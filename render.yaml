services:
  - type: web
    name: nochelive
    runtime: ruby
    plan: starter
    region: frankfurt
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nochelive-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RENDER
        value: "true"
      - key: APP_HOST
        value: nochelive.onrender.com

databases:
  - name: nochelive-db
    plan: basic-256mb
    region: frankfurt
