        questions:
        - id: fast-psalms-pack05-q01
          type: texte
          format: qcm
          reference: Psaume 127:1
          prompt: "¿Cuándo trabajan en vano los que construyen, según el salmo?"
          choices:
          - id: a
            text: Sin Dios para construir la casa
          - id: b
            text: Si la ciudad no tiene muros
          - id: c
            text: Si empiezan a trabajar temprano
          - id: d
            text: Con tres generaciones en casa
          correct_choice: a
          feedback: Dios pone la casa y la ciudad bajo su cuidado, sin despreciar el trabajo humano.
        - id: fast-psalms-pack05-q02
          type: texte
          format: vrai_faux
          reference: Psaume 127:2
          prompt: 'Cierto o falso: ¿agotarse es el único camino a la bendición?'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'Dios no celebra el trabajo angustioso: también da a sus amados mientras duermen.'
        - id: fast-psalms-pack05-q03
          type: texte
          format: qcm
          reference: Psaume 128:1-2
          prompt: "¿Qué vincula el Salmo 128 con la felicidad?"
          choices:
          - id: a
            text: Temer a Dios, seguir sus caminos
          - id: b
            text: Dejar casa y trabajo
          - id: c
            text: Tener ciudad y ejército
          - id: d
            text: No sufrir ni cansarse jamás
          correct_choice: a
          feedback: La felicidad se une al temor de Dios, a seguir sus caminos y al fruto del trabajo.
        - id: fast-psalms-pack05-q04
          type: vie
          format: vrai_faux
          reference: Psaume 128:3-6
          prompt: 'Cierto o falso: ¿el Salmo 128 impone un modelo familiar?'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: Este canto celebra una bendición; no mide el valor de las personas ni la fidelidad de las familias.
        - id: fast-psalms-pack05-q05
          type: texte
          format: qcm
          reference: Psaume 137:1-2
          prompt: "¿Qué hacen los exiliados al recordar Sion?"
          choices:
          - id: a
            text: Organizan una fiesta enseguida
          - id: b
            text: Lloran, con las arpas colgadas
          - id: c
            text: Olvidan Jerusalén
          - id: d
            text: Cantan para sus vencedores
          correct_choice: b
          feedback: A orillas de los ríos de Babilonia, los exiliados lloran y cuelgan sus arpas.
        - id: fast-psalms-pack05-q06
          type: texte
          format: vrai_faux
          reference: Psaume 137:3-4
          prompt: 'Cierto o falso: ¿cantan los exiliados cuando sus opresores lo exigen?'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'Preguntan cómo cantar para Dios en tierra extraña: sus opresores no mandan sobre su alegría.'
        - id: fast-psalms-pack05-q07
          type: texte
          format: qcm
          reference: Psaume 137:5-6
          prompt: "¿Qué se niega a olvidar el exiliado?"
          choices:
          - id: a
            text: La riqueza de Babilonia
          - id: b
            text: El canto de sus vencedores
          - id: c
            text: Jerusalén, su mayor alegría
          - id: d
            text: La ruta de las caravanas
          correct_choice: c
          feedback: Aun en el exilio, Jerusalén vive en su memoria y sigue siendo su mayor alegría.
        - id: fast-psalms-pack05-q08
          type: texte
          format: qcm
          reference: Psaume 147:2-4
          prompt: "¿Qué obra de Dios reúne estos versículos?"
          choices:
          - id: a
            text: Edificar, reunir, sanar, nombrar
          - id: b
            text: Borrar el recuerdo del exilio
          - id: c
            text: Mirar solo a los poderosos
          - id: d
            text: Dejar que los heridos se curen
          correct_choice: a
          feedback: Dios edifica Jerusalén, reúne a los exiliados, sana corazones y nombra las estrellas.
        - id: fast-psalms-pack05-q09
          type: vie
          format: qcm
          reference: Psaume 147:10-11
          prompt: "¿Qué importa más que el puro rendimiento?"
          choices:
          - id: a
            text: Ocultar tu debilidad
          - id: b
            text: Esperar en la bondad de Dios
          - id: c
            text: No necesitar a nadie
          - id: d
            text: Ser el más fuerte
          correct_choice: b
          feedback: Dios no mira primero la fuerza humana, sino a quienes esperan en su bondad.
        - id: fast-psalms-pack05-q10
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'Cierto o falso: ¿construir con Dios garantiza familia ideal y sanación?'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: Estos salmos invitan a recibir y construir con Dios, sin garantizar familia ideal ni sanación inmediata.
