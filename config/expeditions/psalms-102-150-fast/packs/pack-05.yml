          source_summary: "Les vainqueurs exigent chants et joie; les exilés demandent comment chanter pour l'Éternel sur une terre étrangère."
          interpretation: "Le refus de livrer un cantique sacré à l'oppresseur conserve dignité et fidélité."
          application: "Ne pas produire la joie sur commande peut être une résistance juste plutôt qu'une passivité."
        ps137-5-6:
