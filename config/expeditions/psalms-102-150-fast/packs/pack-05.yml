          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=fra"
          retrieved_on: "2026-09-05"
          kind: scripture
          resolved_text: |-
            Ta femme est comme une vigne féconde Dans l'intérieur de ta maison ; Tes enfants sont comme des plants d'olivier Autour de ta table.
