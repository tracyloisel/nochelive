  agent_memory:
    influenceur:
      owner: expedition-fast-influenceur
      revision: 2
      status: complete
      production: |-
        ACCROCHE DE PREMIER ÉCRAN

        Tu peux avoir perdu ta maison sans avoir perdu le chemin du retour.

        ANGLE HUMAIN UNIQUE

        Une personne qui revient après une longue absence ne sait plus où est
        sa place. Elle rencontre des exilés qui refusent d'oublier Sion, puis
        un Dieu qui rebâtit Jérusalem, rassemble les dispersés et panse les
        cœurs. Elle découvre enfin que la maison, le travail, la table et les
        générations peuvent être bâtis avec Dieu, sans devenir une mesure de
        sa valeur ni l'obligation d'entrer dans un modèle familial unique.

        CE QUE DISENT LES TEXTES

        Le Psaume 137:1-6 laisse les exilés pleurer, suspendre leurs harpes et
        garder Jérusalem comme leur joie principale; il ne force pas un chant
        heureux au milieu de l'oppression. Le Psaume 147 présente l'Éternel
        qui rebâtit Jérusalem, rassemble les exilés, guérit les cœurs brisés,
        nomme les étoiles, soutient les malheureux et donne sa parole à son
        peuple. Les Psaumes 127-128 placent sous son action la maison, la
        garde, le repos, le travail des mains, la table, les générations, Sion
        et la paix.

        RÉCEPTION ET APPLICATION

        Dans une réception chrétienne, cette reconstruction peut éclairer le
        retour à Dieu et à son peuple par Jésus-Christ; ce lien relève de la
        réception et non d'une mention littérale du Christ dans ces psaumes.
        L'application proposée est de reprendre un lien concret avec une
        communauté de foi et de confier à Dieu ce que l'on essaie de bâtir au
        quotidien. Elle ne promet ni famille conforme à une image unique, ni
        enfant, ni prospérité, ni guérison immédiate.

        SCRIPT ORAL — 35 À 45 SECONDES

        Tu peux avoir perdu ta maison sans avoir perdu le chemin du retour.
        Dans le Psaume 137, des exilés pleurent loin de Jérusalem. Ils ne
        chantent pas sur commande, mais ils refusent d'oublier Sion. Puis le
        Psaume 147 répond : Dieu rebâtit Jérusalem, rassemble les exilés et
        panse les cœurs brisés. Et les Psaumes 127 et 128 ramènent cette œuvre
        jusque dans la maison, le travail, la table et les générations. La
        foi n'efface pas l'exil. Elle nous apprend que Dieu peut rebâtir avec
        nous, nous rendre une place dans son peuple et rejoindre notre vie
        ordinaire.

        QUESTION FINALE

        Quel premier lien pourrais-tu reprendre pour ne plus bâtir seul ?

        TROIS RISQUES DE SIMPLIFICATION À TRANSMETTRE AU MYSTIQUE

        1. Transformer les images familiales des Psaumes 127-128 en modèle
           obligatoire ou en promesse automatique de mariage, d'enfants et de
           prospérité, ce qui ferait de certaines vies une preuve d'échec.
        2. Faire du rassemblement et de la guérison du Psaume 147 une garantie
           de retour facile, de communauté sans blessure ou de guérison
           immédiate, alors que le texte nomme réellement l'exil et le cœur
           brisé.
        3. Réduire le Psaume 137:1-6 à une nostalgie inspirante, imposer trop
           vite la joie aux personnes blessées ou glisser vers les
           imprécations des versets 7-9, qui sont hors du périmètre approuvé.
    mystique:
      owner: expedition-fast-mystique
      revision: 3
      status: complete
      production: |-
        PHRASE-THÈSE

        Dieu ne demande pas d'oublier l'exil pour revenir à lui : il reçoit la
        mémoire blessée, rassemble les dispersés et apprend à rebâtir avec lui
        une demeure où la vie ordinaire peut de nouveau porter du fruit.

        MOUVEMENT INTÉRIEUR DU TEXTE

        1. DEMEURER VRAI DANS L'EXIL — PSAUME 137:1-4

        Au bord des fleuves de Babylone, le peuple s'assied, pleure et suspend
        ses harpes. Il ne nie ni la perte ni l'impossibilité de chanter sous
        l'ordre des oppresseurs. Le premier mouvement spirituel n'est donc pas
        de fabriquer de la joie, mais de laisser la douleur devenir une parole
        vraie devant Dieu.

        2. GARDER VIVANT LE DÉSIR DE SION — PSAUME 137:5-6

        L'exilé refuse d'oublier Jérusalem et la garde comme son principal
        sujet de joie. Sa mémoire n'est pas une fuite hors du présent : elle
        protège son appartenance et maintient ouverte la possibilité du
        retour. Intérieurement, la plainte devient fidélité à ce qui ne doit
        pas être perdu.

        3. SE LAISSER RASSEMBLER ET PANSER — PSAUME 147:1-20

        Le Dieu qui rebâtit Jérusalem rassemble les exilés et panse les cœurs
        brisés. Celui qui nomme les étoiles voit aussi chaque blessure; sa
        puissance ne se confond pas avec la vigueur humaine. Sa parole agit
        dans la création et est confiée à son peuple. Le retour commence ainsi
        par une œuvre reçue de Dieu, avant de devenir un effort humain.

        4. BÂTIR AVEC DIEU DANS LA VIE ORDINAIRE — PSAUMES 127-128

        La maison, la garde de la ville, le sommeil, le travail des mains, la
        table, les générations, Sion et la paix sont placés sous la présence
        de Dieu. Le mouvement s'achève non dans une réussite arrachée par
        l'épuisement, mais dans une vie confiée, travaillée et reçue avec lui.
        Les images familiales décrivent la bénédiction chantée par ces psaumes;
        elles ne définissent pas la valeur ni le destin obligatoire de chacun.

        PRATIQUE SPIRITUELLE CONCRÈTE — LA PRIÈRE DE LA MAISON À REBÂTIR

        Prendre dix minutes avec ces psaumes. Nommer devant Dieu une absence,
        une blessure ou un lieu d'où l'on se sent exilé, sans se forcer à en
        tirer immédiatement quelque chose de positif. Nommer ensuite ce que
        l'on refuse d'oublier de son désir de Dieu. Enfin, lui confier une
        seule chose très ordinaire à bâtir avec lui cette semaine — une prière,
        un repas partagé, un travail, un repos ou un lien à reprendre — puis
        poser ce premier geste librement.

        LIMITES QUI PROTÈGENT LE TEXTE ET LES PERSONNES

        - Les larmes et le silence du Psaume 137:1-6 ne sont ni un manque de
          foi ni une étape à faire disparaître rapidement. Refuser le chant
          exigé par l'oppresseur peut être une fidélité, pas une fermeture à
          Dieu.
        - Le périmètre s'arrête au verset 6 du Psaume 137. Les imprécations des
          versets 7-9 ne doivent être ni importées ni dissimulées sous cette
          lecture du retour.
        - « Il guérit ceux qui ont le cœur brisé » ne garantit ni guérison
          immédiate, ni retour facile, ni communauté religieuse sans blessure.
          Le soin spirituel n'annule pas le besoin éventuel d'aide humaine,
          médicale ou psychologique.
        - Les Psaumes 127-128 ne font pas du mariage, des enfants, de la
          prospérité ou d'une forme familiale unique une preuve de faveur
          divine. Ils ne permettent pas davantage de rendre une personne
          responsable de ses pertes parce qu'elle aurait « bâti sans Dieu ».
        - Recevoir l'œuvre de Dieu ne signifie pas devenir passif. Ces textes
          tiennent ensemble le don, le repos, le travail, la marche dans ses
          voies et la participation concrète à une maison et à un peuple.
    nouveau_baptise:
      owner: expedition-fast-nouveau-baptise
      revision: 4
      status: complete
      production: |-
        BONNE NOUVELLE À RECEVOIR

        Tu n’as pas besoin de cacher ce que l’exil, l’absence ou une blessure
        ont fait en toi pour commencer à revenir vers Dieu. Le Psaume 137:1-6
        laisse le peuple pleurer, suspendre ses harpes et garder vivant son
        désir de Sion. Le Psaume 147 annonce un Dieu qui rebâtit Jérusalem,
        rassemble les exilés et panse les cœurs brisés. Les Psaumes 127-128
        montrent ensuite une vie ordinaire — maison, repos, travail, table et
        générations — qui peut être bâtie avec Dieu plutôt que portée seul.

        Ces psaumes ne nomment pas littéralement Jésus-Christ. Dans une
        réception chrétienne, ils peuvent cependant aider un nouveau disciple
        à recevoir le retour vers Dieu et vers son peuple comme une grâce
        rendue possible en Jésus-Christ : Dieu rejoint d’abord la personne
        dispersée ou blessée, puis l’invite à rebâtir avec lui. Une longue
        absence, des larmes ou une histoire familiale différente ne retirent
        à personne la possibilité de commencer ce chemin.

        RISQUE DE MALENTENDU OU DE TEST D’APPARTENANCE

        Les images de l’épouse, des enfants, de la maison prospère et des
        générations dans les Psaumes 127-128 pourraient être entendues comme
        le portrait obligatoire d’un membre fidèle. Un nouveau baptisé qui est
        célibataire, sans enfant, séparé de sa famille ou dont le foyer est
        fragile pourrait alors croire qu’il lui manque la preuve visible de
        la bénédiction de Dieu. Ce serait transformer un chant de bénédiction
        en examen de valeur personnelle.

        Il serait également blessant de comprendre « si l’Éternel ne bâtit la
        maison » comme l’accusation que toute perte vient d’une foi
        insuffisante, de traiter les larmes du Psaume 137 comme un refus de
        croire, ou de promettre avec le Psaume 147 une guérison immédiate dès
        l’entrée dans l’Église. L’appartenance ne se prouve ni par une famille
        idéale, ni par une joie forcée, ni par une blessure déjà refermée.

        PREMIER PAS RÉALISTE, SANS HONTE NI PERFORMANCE

        Choisir un seul de ces psaumes et prendre dix minutes avec Dieu.
        Nommer simplement le lieu, le lien ou la paix qui manque aujourd’hui,
        sans chercher à produire une émotion positive. Puis choisir un geste
        assez petit pour cette semaine : envoyer un message à une personne
        sûre de la communauté, demander à venir avec elle à une réunion,
        partager un repas, ou confier à Dieu une tâche quotidienne avant de la
        commencer. Ce geste est une invitation, pas une mesure de conversion;
        demander de l’aide ou attendre avant de revenir dans un lieu blessant
        reste légitime.

        QUESTION ENCORE POSÉE

        Si Dieu rassemble les exilés, comment puis-je retrouver une place dans
        son peuple lorsque c’est justement une communauté de foi qui m’a
        blessé ?
    quiz:
      owner: expedition-fast-quiz
      revision: 5
      status: complete
      production: |-
        INTENTION DU QUIZ

        Faire parcourir le mouvement du pack : bâtir avec Dieu plutôt que
        s'épuiser seul, accueillir sans en faire une norme les images de la
        maison et des générations, demeurer vrai dans l'exil, puis découvrir
        le Dieu qui rassemble, panse les cœurs et regarde l'espérance placée
        en sa bonté. Les applications ne transforment ni la guérison en
        promesse immédiate, ni la famille en preuve de faveur divine.

        MIX RETENU

        - 7 questions de type texte et 3 questions de type vie.
        - 6 QCM et 4 vrai/faux.
        - Les vrai/faux ne portent que sur des affirmations directement et
          honnêtement décidables par le texte ou par une limite d'application
          explicitement établie dans le dossier.

        QUESTIONS

        1. fast-psalms-pack05-q01 — texte, QCM — Psaume 127:1
           Question : Selon le psaume, quand les bâtisseurs travaillent-ils en vain ?
           a. Quand l'Éternel ne bâtit pas la maison [JUSTE]
           b. Quand la ville ne possède pas de murailles
           c. Quand le travail commence après le lever du soleil
           d. Quand plusieurs générations vivent sous le même toit
           Retour : Le verset place la maison et la garde de la ville sous l'action de Dieu; il ne méprise pas le travail humain.

        2. fast-psalms-pack05-q02 — texte, vrai/faux — Psaume 127:2
           Affirmation : Le Psaume 127 présente les longues journées épuisantes comme le seul chemin vers la bénédiction.
           a. Vrai
           b. Faux [JUSTE]
           Retour : Le verset critique le labeur anxieux et dit que Dieu donne aussi à ses bien-aimés pendant leur sommeil.

        3. fast-psalms-pack05-q03 — texte, QCM — Psaume 128:1-2
           Question : Quelles deux réalités le Psaume 128 relie-t-il au bonheur ?
           a. Craindre l'Éternel et marcher dans ses voies [JUSTE]
           b. Quitter sa maison et renoncer à son travail
           c. Posséder une ville et commander une armée
           d. Ne jamais connaître de peine ni de fatigue
           Retour : Le texte associe le bonheur à la crainte de l'Éternel, à la marche dans ses voies et au fruit du travail des mains.

        4. fast-psalms-pack05-q04 — vie, vrai/faux — Psaume 128:3-6
           Affirmation : Les images familiales du Psaume 128 fixent un modèle obligatoire pour recevoir la faveur de Dieu.
           a. Vrai
           b. Faux [JUSTE]
           Retour : Dans la réception retenue, ce chant de bénédiction ne mesure ni la valeur d'une personne ni la fidélité de toutes les familles.

        5. fast-psalms-pack05-q05 — texte, QCM — Psaume 137:1-2
           Question : Que font les exilés en se souvenant de Sion ?
           a. Ils organisent aussitôt une fête
           b. Ils s'assoient, pleurent et suspendent leurs harpes [JUSTE]
           c. Ils oublient Jérusalem pour recommencer ailleurs
           d. Ils chantent pour satisfaire leurs vainqueurs
           Retour : Le texte laisse les exilés pleurer au bord des fleuves de Babylone et suspendre leurs harpes.

        6. fast-psalms-pack05-q06 — texte, vrai/faux — Psaume 137:3-4
           Affirmation : Les exilés chantent volontiers quand leurs oppresseurs exigent un cantique de Sion.
           a. Vrai
           b. Faux [JUSTE]
           Retour : Ils demandent comment chanter un cantique de l'Éternel sur une terre étrangère; leur joie n'est pas commandée.

        7. fast-psalms-pack05-q07 — texte, QCM — Psaume 137:5-6
           Question : Qu'est-ce que l'exilé refuse d'oublier ?
           a. La richesse de Babylone
           b. Le chant de ses vainqueurs
           c. Jérusalem, son principal sujet de joie [JUSTE]
           d. Le chemin suivi par les caravanes
           Retour : Le texte garde Jérusalem vivante dans la mémoire de l'exilé et en fait son principal sujet de joie.

        8. fast-psalms-pack05-q08 — texte, QCM — Psaume 147:2-4
           Question : Quelle œuvre de Dieu réunit ces versets ?
           a. Il rebâtit, rassemble, guérit et nomme les étoiles [JUSTE]
           b. Il efface toute mémoire de l'exil
           c. Il réserve son attention aux personnes puissantes
           d. Il demande aux blessés de se guérir seuls
           Retour : Le texte unit Jérusalem rebâtie, les exilés rassemblés, les cœurs pansés et les étoiles nommées.

        9. fast-psalms-pack05-q09 — vie, QCM — Psaume 147:10-11
           Question : Qu'est-ce qui compte davantage que la seule performance ?
           a. Cacher sa faiblesse aux autres
           b. Espérer en la bonté de l'Éternel [JUSTE]
           c. Prouver que l'on n'a besoin de personne
           d. Être plus fort que ceux qui nous entourent
           Retour : Le texte détourne le regard de la vigueur humaine et le porte vers ceux qui espèrent en la bonté de Dieu.

        10. fast-psalms-pack05-q10 — vie, vrai/faux — application
            Affirmation : Bâtir avec Dieu garantit une famille idéale et une guérison immédiate.
            a. Vrai
            b. Faux [JUSTE]
            Retour : Application : ces psaumes invitent à recevoir et bâtir avec Dieu, sans garantir un modèle familial ni une guérison immédiate.

        CONTRÔLE DES RÉFÉRENCES ET DES LIMITES

        Toutes les références appartiennent au périmètre approuvé. Les
        questions sur le Psaume 137 s'arrêtent au verset 6. Les questions de
        vie distinguent explicitement l'application ou la réception du texte
        littéral. Chaque question possède une seule bonne réponse; les
        distracteurs n'humilient aucune personne ni confession.
    voix:
      owner: expedition-fast-voix
      revision: 6
      status: complete
      production: |-
        DÉCOUVERTE PROPOSÉE AU JOUEUR, QUESTION PAR QUESTION

        1. Le travail de la maison devient vain lorsque Dieu n'en est pas le
           bâtisseur; le psaume ne méprise pas le travail humain.
        2. Le Psaume 127 refuse de faire de l'épuisement anxieux le seul chemin
           vers la bénédiction et fait aussi place au don reçu dans le repos.
        3. Le Psaume 128 relie le bonheur à la crainte de Dieu, à la marche dans
           ses voies et au fruit du travail.
        4. Le chant familial du Psaume 128 célèbre une bénédiction sans imposer
           à chaque personne un modèle familial obligatoire.
        5. Les exilés se souviennent de Sion en pleurant et en suspendant leurs
           harpes; leur douleur n'est pas effacée.
        6. Les exilés ne livrent pas leur joie sur commande à leurs oppresseurs.
        7. L'exilé garde Jérusalem vivante comme son principal sujet de joie.
        8. Le même Dieu rebâtit, rassemble, panse les cœurs et nomme les étoiles.
        9. Dieu regarde l'espérance placée en sa bonté plutôt que la seule
           vigueur humaine.
        10. Bâtir avec Dieu est une invitation, jamais la garantie d'une famille
            idéale ni d'une guérison immédiate.

        COPIE DE PLATEAU FRANÇAISE

        1. Quand les bâtisseurs travaillent-ils en vain, selon le psaume ?
           — Sans Dieu pour bâtir la maison [JUSTE]
           — Quand la ville n'a pas de murs
           — Si le travail commence au matin
           — Avec trois générations au foyer
           Révélation : Dieu place maison et ville sous son action, sans
           mépriser le travail humain.

        2. Vrai ou faux : s'épuiser serait le seul chemin vers la bénédiction ?
           — Vrai
           — Faux [JUSTE]
           Révélation : Dieu ne célèbre pas le labeur anxieux : il donne aussi
           à ses bien-aimés pendant leur sommeil.

        3. Que relie le Psaume 128 au bonheur ?
           — Craindre Dieu, suivre ses voies [JUSTE]
           — Quitter maison et travail
           — Posséder ville et armée
           — Ne jamais peiner ni se fatiguer
           Révélation : Le bonheur est ici lié à la crainte de Dieu, à la marche
           dans ses voies et au fruit du travail.

        4. Vrai ou faux : le Psaume 128 impose-t-il un modèle familial ?
           — Vrai
           — Faux [JUSTE]
           Révélation : Ce chant célèbre une bénédiction; il ne mesure ni la
           valeur des personnes ni la fidélité des familles.

        5. Que font les exilés en se souvenant de Sion ?
           — Ils organisent aussitôt une fête
           — Ils pleurent, harpes suspendues [JUSTE]
           — Ils oublient Jérusalem
           — Ils chantent pour les vainqueurs
           Révélation : Au bord des fleuves de Babylone, les exilés pleurent et
           suspendent leurs harpes.

        6. Vrai ou faux : les exilés chantent quand leurs oppresseurs l'exigent ?
           — Vrai
           — Faux [JUSTE]
           Révélation : Ils demandent comment chanter pour Dieu en terre
           étrangère : leurs oppresseurs ne commandent pas leur joie.

        7. Qu'est-ce que l'exilé refuse d'oublier ?
           — La richesse de Babylone
           — Le chant de ses vainqueurs
           — Jérusalem, sa plus grande joie [JUSTE]
           — Le chemin des caravanes
           Révélation : Même en exil, Jérusalem reste vivante dans sa mémoire et
           demeure son principal sujet de joie.

        8. Quelle œuvre de Dieu réunit ces versets ?
           — Rebâtir, réunir, panser, nommer [JUSTE]
           — Effacer la mémoire de l'exil
           — Ne voir que les puissants
           — Laisser les blessés se guérir
           Révélation : Dieu rebâtit Jérusalem, rassemble les exilés, panse les
           cœurs et nomme les étoiles.

        9. Qu'est-ce qui compte plus que la seule performance ?
           — Cacher sa faiblesse
           — Espérer en la bonté de Dieu [JUSTE]
           — N'avoir besoin de personne
           — Être le plus fort
           Révélation : Dieu ne regarde pas d'abord la vigueur humaine, mais
           ceux qui espèrent en sa bonté.

        10. Vrai ou faux : bâtir avec Dieu garantit famille idéale et guérison ?
            — Vrai
            — Faux [JUSTE]
            Révélation : Ces psaumes invitent à recevoir et bâtir avec Dieu,
            sans garantir famille idéale ni guérison immédiate.

        LECTURE ORALE ET LIMITES

        Les dix séquences complètes ont été lues à voix haute. Les prompts
        tiennent en une seule respiration; les choix sont parallèles et se
        comprennent en moins de deux secondes; les révélations déclarent le
        sens après le verdict sans parler de catégorie éditoriale. Les
        invariants du Quiz sont conservés. Les dix questions ont ensuite été
        exécutées comme de vraies QuizDefinition::Question dans Street à
        390 × 667. Une mauvaise réponse a été soumise pour chacune; l'unique
        ligne juste, sa lettre mélangée, son texte source et la révélation
        exacte ont été contrôlés. Aucun clipping, aucune troncature, aucun
        défilement de réponse ni erreur console sévère n'a été observé.
    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 7
      status: complete
      production: |-
        PÉRIMÈTRE ET SOURCES RÉSOLUES

        Les dix unités françaises finales ont été reliées à dix bases
        sémantiques, consultées dans les textes officiels indiqués par
        source.readings : Psaume 127:1, 127:2, 128:1-2, 128:3-6,
        137:1-2, 137:3-4, 137:5-6, 147:2-4, 147:10-11 et l'application
        soutenue par Psaumes 127-128 et 147:2-3. La source_library distingue
        pour chacune texte, interprétation et application.

        ARBITRAGES DES DIX UNITÉS

        1. BÂTIR AVEC DIEU — La maison sous un rayon serait claire mais
           abstraite. Une maîtresse maçonne arrête un chantier devant une
           fondation décalée et rassemble l'équipe autour du plan et des
           Écritures. Alternative dramaturgique, réalisme cinéma.
        2. RECEVOIR LE REPOS — Le dormeur paisible gagne sur une usine en
           arrière-plan : sur un toit inachevé, un artisan dort enfin sous
           les étoiles, outils posés et ouvrage encore ouvert. Hybride,
           illustration biblique.
        3. MARCHER ET TRAVAILLER — Le chemin lumineux serait convenu. Une
           artisane quitte un bref recueillement et ouvre son atelier au
           matin, ouvrage accompli en main. Alternative dramaturgique,
           réalisme cinéma.
        4. UNE BÉNÉDICTION, PAS UN MODÈLE — La famille nucléaire idéale
           illustrerait le chant mais transformerait l'image en norme. Une
           grande table de jardin réunit plusieurs formes de foyer autour de
           jeunes oliviers. Alternative dramaturgique, réalisme cinéma.
        5. PLEURER EN EXIL — L'image biblique classique est la plus forte :
           au bord du fleuve, les exilés s'assoient et suspendent leurs harpes
           aux saules. Conventionnel vivant, illustration biblique.
        6. REFUSER LE CHANT COMMANDÉ — Une harpe muette seule manquerait le
           rapport de force. Un oppresseur exige un chant; la musicienne
           garde ses mains loin des cordes et soutient son regard.
           Alternative dramaturgique, réalisme cinéma historique.
        7. GARDER JÉRUSALEM VIVANTE — La ville flottant dans le ciel serait
           littérale. Une exilée dessine les portes de Jérusalem dans l'argile
           pour un enfant, Babylone derrière eux. Alternative dramaturgique,
           illustration biblique.
        8. REBÂTIR, RASSEMBLER, PANSER, NOMMER — Les quatre emblèmes seraient
           didactiques. Sous un ciel étoilé, des familles franchissent une
           porte réparée tandis qu'une soigneuse panse une blessure.
           Hybride, illustration biblique.
        9. PLUS QUE LA PERFORMANCE — Le cheval fort opposé à une personne
           agenouillée serait une devinette. Après une course, une cavalière
           descend du podium, pose sa coupe et prie dans l'écurie sans renier
           son excellence. Alternative dramaturgique, réalisme cinéma.
        10. BÂTIR SANS GARANTIE — La famille parfaite et le cœur bandé seraient
            une affiche corrective. Dans le jardin d'une maison de réunion,
            une femme encore appareillée rejoint des voisins très divers pour
            poser la première pierre d'un pavillon. Alternative
            dramaturgique, réalisme cinéma.

        TEST DES DEUX SECONDES ET RYTHME

        Chaque unité offre un foyer immédiat : fondation arrêtée, dormeur
        sous les étoiles, atelier ouvert, table plurielle, harpes suspendues,
        mains refusant les cordes, ville tracée dans l'argile, porte réparée,
        coupe déposée, première pierre. Le réalisme cinéma domine six unités;
        quatre illustrations bibliques portent la poésie, l'exil et la
        reconstruction. La progression va de l'effort au repos, de la
        bénédiction au manque, puis de la résistance au retour actif.

        LIMITES ET TRANSMISSION

        Dieu n'est jamais représenté. Aucune scène ne garantit maison,
        famille, guérison, retour ou appartenance; l'oppresseur n'est pas
        glorifié et la souffrance ne sert pas de raccourci vers la profondeur.
        Les personnes restent belles, actives et dignes. Les dix concepts
        concernent uniquement quiz_question; les futurs 9:16 et 16:9 devront
        être recomposés nativement. Aucun pixel n'a été produit.
    direction_artistique:
      owner: expedition-fast-directeur-artistique-producteur
      revision: 11
      status: batch_generated_awaiting_human_review
      production: |-
        SÉLECTION DE LA PREUVE

        La question 6 a été choisie comme test le plus discriminant du langage
        du pack. Le face-à-face entre l'ordre d'un officiel, la harpe placée
        entre les deux camps et les mains volontairement retirées rend la
        résistance spirituelle lisible avant même la copie. Cette scène
        historique éprouve simultanément le réalisme cinéma, la dignité des
        personnages, la richesse des costumes et le Celestial Dark.

        PRODUCTION ET INSPECTION

        Un seul appel ImageGen intégré a produit une composition native 9:16,
        sans référence externe, variante, edit ni upscale. Le master montre
        exactement cinq personnes : l'officiel, la musicienne et trois témoins
        exilés. L'ordre, le regard soutenu, les mains éloignées des cordes et la
        harpe silencieuse sont visibles; aucune violence, joie forcée, divinité,
        inscription, marque ou réponse n'est représentée. La zone inférieure
        sombre reçoit le chrome Street sans masquer le conflit central.

        La preuve a été rendue dans la vraie surface Street ask à 390x667 avec
        « Psaume 137:3-4 », le prompt français final et les choix Vrai/Faux.
        Le contrôle donne 1 test, 48 assertions, 0 échec, 0 erreur : aucun
        débordement horizontal, clipping, troncature ou journal navigateur
        sévère. Cette inspection technique ne préjuge pas du jugement à froid.

        LIMITES

        Aucun idéal architectural contemporain de l'Église n'était pertinent
        dans cette scène babylonienne; aucune référence de temple n'a donc été
        utilisée. Aucun autre concept, ratio, lot, traduction ou branche runtime
        n'a été produit. La preuve attend le Critique des deux secondes puis la
        décision humaine.

        LOT QUIZ FRANÇAIS AUTORISÉ

        Après l'approbation humaine r10, neuf appels ImageGen intégrés distincts
        ont produit q01-q05 et q07-q10. La preuve q06 a été copiée à l'identique
        dans le dossier final; elle n'a subi ni edit ni nouvel appel. Les dix
        masters natifs sont des PNG 941x1672 en 9:16. Aucun autre ratio, variante
        ou upscale n'a été créé.

        Le rythme validé est conservé : réalisme cinéma pour q01, q03, q04,
        q06, q09 et q10; illustration biblique pour q02, q05, q07 et q08;
        Celestial Light et Dark suivent chaque scène. Q10 transpose seulement
        l'ordre, la pierre, le bois, les jardins et la dignité des espaces saints
        des derniers jours sans reproduire de temple ni revendiquer un lieu exact.

        CONTRÔLE STREET FRANÇAIS

        Les dix questions ont été exécutées dans Street à 390x667 en ask puis en
        reveal avec la copie française finale. Les vingt images, les prompts,
        choix mélangés, lettres correctes affichées, bonnes réponses, feedbacks,
        citations, boutons Lire, Suivant et Voir les résultats ont été contrôlés.
        La question d'application q10 affiche la citation résolue
        « Psaumes 127-128 ; 147:2-3 ». Résultat : 1 test, 1389 assertions,
        0 échec, 0 erreur; aucun clipping, troncature, scroll de réponse,
        débordement horizontal ou erreur console sévère.

        Le master q04 contient deux cadres décoratifs vides dans sa zone basse,
        mais l'inspection de la vraie surface confirme qu'ils sont couverts par
        le chrome et ne deviennent pas de fausses commandes visibles. Cette
        observation reste déclarée pour le jugement humain. Deux planches-contact
        ask et reveal ont été produites. Le lot s'arrête au gate français : aucune
        traduction ni connexion au runtime n'est autorisée.
    critique_deux_secondes:
      owner: expedition-fast-critique-deux-secondes
      revision: 9
      status: complete
      production: |-
        LECTURE FROIDE

        Avant lecture du concept, l'œil rencontre un homme vêtu de bleu qui
        tend la main vers une femme placée de l'autre côté d'une grande harpe.
        Elle lui fait face, les mains ouvertes et éloignées de l'instrument,
        tandis que trois personnes se tiennent derrière elle. En moins de deux
        secondes, la scène ressemble à une exigence ou un ordre auquel elle ne
        cède pas. La question spontanée est : « Que leur exige-t-il, et vont-ils
        céder ? » La décision probable est d'arrêter le scroll.

        CONTRÔLE APRÈS LECTURE DU DOSSIER

        Cette lecture visible correspond au concept : face-à-face historique,
        geste de pouvoir, refus actif, harpe silencieuse entre les camps et cinq
        personnages. Le point focal résiste dans Street 390x667; le chrome reste
        dans la zone sombre prévue sans masquer les regards, le geste ni
        l'instrument. Les costumes, matières, architecture et lumière donnent
        beauté et dignité sans misérabilisme, sexualisation ou violence-spectacle.
        La scène est spécifique et ouvre une question naturelle plutôt qu'une
        énigme opaque. Aucune référence identifiable au temple, à un rite ou à
        l'Église n'est représentée; aucune intégrité de source institutionnelle
        n'est donc compromise.

        VERDICT

        PASS. Aucun correctif visuel n'est requis avant la décision humaine.
        Ce verdict n'autorise ni lot, ni variante, ni traduction, ni runtime.
