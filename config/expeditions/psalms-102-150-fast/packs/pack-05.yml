          type: texte
          format: qcm
          reference: Psaume 127:1
          prompt: Segundo o salmo, quando os construtores trabalham em vão?
          choices:
          - id: a
            text: Sem Deus para construir a casa
          - id: b
            text: Quando a cidade não tem muros
          - id: c
            text: Se o trabalho começa cedo
          - id: d
            text: Com três gerações em casa
          correct_choice: a
          feedback: Deus coloca casa e cidade sob seu cuidado, sem desprezar o trabalho humano.
        - id: fast-psalms-pack05-q02
          type: texte
          format: vrai_faux
          reference: Psaume 127:2
          prompt: 'Verdadeiro ou falso: esgotar-se é o único caminho para a bênção?'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: Deus não celebra o trabalho angustiante; ele também dá aos seus amados enquanto dormem.
        - id: fast-psalms-pack05-q03
          type: texte
          format: qcm
          reference: Psaume 128:1-2
          prompt: O que o Salmo 128 liga à felicidade?
          choices:
          - id: a
            text: Temer a Deus; seguir seu caminho
          - id: b
            text: Deixar casa e trabalho
          - id: c
            text: Ter cidade e exército
          - id: d
            text: Nunca sofrer nem se cansar
          correct_choice: a
          feedback: A felicidade se liga ao temor de Deus, aos seus caminhos e ao fruto do trabalho.
        - id: fast-psalms-pack05-q04
          type: vie
          format: vrai_faux
          reference: Psaume 128:3-6
          prompt: 'Verdadeiro ou falso: o Salmo 128 impõe um modelo familiar?'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: Este cântico celebra uma bênção; não mede o valor das pessoas nem a fidelidade das famílias.
        - id: fast-psalms-pack05-q05
          type: texte
          format: qcm
          reference: Psaume 137:1-2
          prompt: O que os exilados fazem ao lembrar de Sião?
          choices:
          - id: a
            text: Fazem logo uma festa
          - id: b
            text: Choram, com as harpas penduradas
          - id: c
            text: Esquecem Jerusalém
          - id: d
            text: Cantam para seus vencedores
          correct_choice: b
          feedback: Às margens dos rios da Babilônia, os exilados choram e penduram suas harpas.
        - id: fast-psalms-pack05-q06
          type: texte
          format: vrai_faux
          reference: Psaume 137:3-4
          prompt: 'Verdadeiro ou falso: os exilados cantam quando seus opressores exigem?'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'Eles perguntam como cantar para Deus em terra estrangeira: os opressores não mandam em sua alegria.'
        - id: fast-psalms-pack05-q07
          type: texte
          format: qcm
          reference: Psaume 137:5-6
          prompt: O que o exilado se recusa a esquecer?
          choices:
          - id: a
            text: A riqueza da Babilônia
          - id: b
            text: O canto de seus vencedores
          - id: c
            text: Jerusalém, sua maior alegria
          - id: d
            text: A rota das caravanas
          correct_choice: c
          feedback: Mesmo no exílio, Jerusalém vive em sua memória e continua sendo sua maior alegria.
        - id: fast-psalms-pack05-q08
          type: texte
          format: qcm
          reference: Psaume 147:2-4
          prompt: Que obra de Deus reúne esses versículos?
          choices:
          - id: a
            text: Edificar, reunir, curar, nomear
          - id: b
            text: Apagar a memória do exílio
          - id: c
            text: Ver apenas os poderosos
          - id: d
            text: Deixar os feridos se curarem
          correct_choice: a
          feedback: Deus edifica Jerusalém, reúne os exilados, cura corações e dá nome às estrelas.
        - id: fast-psalms-pack05-q09
          type: vie
          format: qcm
          reference: Psaume 147:10-11
          prompt: O que vale mais do que só o desempenho?
          choices:
          - id: a
            text: Esconder sua fraqueza
          - id: b
            text: Esperar na bondade de Deus
          - id: c
            text: Não precisar de ninguém
          - id: d
            text: Ser o mais forte
          correct_choice: b
          feedback: Deus não olha primeiro para a força humana, mas para quem espera em sua bondade.
        - id: fast-psalms-pack05-q10
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'Verdadeiro ou falso: construir com Deus garante família ideal e cura?'
