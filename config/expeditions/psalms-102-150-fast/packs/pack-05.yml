        ps127-2:
          reference: "Psaume 127:2"
          resolved_references: ["Psaume 127:2"]
          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/127?lang=fra"
          retrieved_on: "2026-09-05"
          kind: scripture
          resolved_text: "En vain vous levez-vous le matin, vous couchez-vous tard, Et mangez-vous le pain de la douleur ; Il en donne autant à ses bien-aimés pendant leur sommeil."
          source_summary: "Le psaume oppose l'agitation douloureuse du lever précoce et du coucher tardif au don que les bien-aimés reçoivent aussi pendant leur sommeil."
