        questions:
        - id: fast-psalms-pack05-q01
          type: texte
          format: qcm
          reference: Psaume 127:1
          prompt: According to the psalm, when do builders labor in vain?
          choices:
          - id: a
            text: Without God building the house
          - id: b
            text: When the city has no walls
          - id: c
            text: If work starts in the morning
          - id: d
            text: With three generations at home
          correct_choice: a
          feedback: God places house and city under his care, without dismissing human work.
        - id: fast-psalms-pack05-q02
          type: texte
          format: vrai_faux
          reference: Psaume 127:2
          prompt: 'True or false: Is exhaustion the only path to blessing?'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: God does not praise anxious toil; he also gives to his beloved while they sleep.
        - id: fast-psalms-pack05-q03
          type: texte
          format: qcm
          reference: Psaume 128:1-2
          prompt: What does Psalm 128 link with happiness?
          choices:
          - id: a
            text: Fear God and walk in his ways
          - id: b
            text: Leave home and work
          - id: c
            text: Own a city and an army
          - id: d
            text: Never struggle or get tired
          correct_choice: a
          feedback: Happiness is linked to fearing God, walking in his ways, and enjoying the fruit of work.
        - id: fast-psalms-pack05-q04
          type: vie
          format: vrai_faux
          reference: Psaume 128:3-6
          prompt: 'True or false: Does Psalm 128 impose one family model?'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: This song celebrates a blessing; it does not measure anyone's worth or a family's faithfulness.
        - id: fast-psalms-pack05-q05
          type: texte
          format: qcm
          reference: Psaume 137:1-2
          prompt: What do the exiles do when they remember Zion?
          choices:
          - id: a
            text: They quickly throw a party
          - id: b
            text: They weep, their harps hung up
          - id: c
            text: They forget Jerusalem
          - id: d
            text: They sing for their conquerors
          correct_choice: b
          feedback: By Babylon's rivers, the exiles weep and hang up their harps.
        - id: fast-psalms-pack05-q06
          type: texte
          format: vrai_faux
          reference: Psaume 137:3-4
          prompt: 'True or false: Do the exiles sing when their oppressors demand it?'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: 'They ask how to sing for God in a foreign land: their oppressors do not command their joy.'
        - id: fast-psalms-pack05-q07
          type: texte
          format: qcm
          reference: Psaume 137:5-6
          prompt: What does the exile refuse to forget?
          choices:
          - id: a
            text: Babylon's riches
          - id: b
            text: Their conquerors' song
          - id: c
            text: Jerusalem, his greatest joy
          - id: d
            text: The caravan route
          correct_choice: c
          feedback: Even in exile, Jerusalem stays alive in his memory and remains his greatest joy.
        - id: fast-psalms-pack05-q08
          type: texte
          format: qcm
          reference: Psaume 147:2-4
          prompt: What work of God ties these verses together?
          choices:
          - id: a
            text: Rebuild, gather, heal, name
          - id: b
            text: Erase the memory of exile
          - id: c
            text: Notice only the powerful
          - id: d
            text: Leave the wounded to heal alone
          correct_choice: a
          feedback: God rebuilds Jerusalem, gathers the exiles, heals hearts, and names the stars.
        - id: fast-psalms-pack05-q09
          type: vie
          format: qcm
          reference: Psaume 147:10-11
          prompt: What matters more than sheer performance?
          choices:
          - id: a
            text: Hide your weakness
          - id: b
            text: Hope in God's goodness
          - id: c
            text: Need nobody else
          - id: d
            text: Be the strongest
          correct_choice: b
          feedback: God looks first not at human strength, but at those who hope in his goodness.
        - id: fast-psalms-pack05-q10
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'True or false: Building with God guarantees an ideal family and healing.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: These psalms invite us to receive and build with God, without promising an ideal family or instant healing.
