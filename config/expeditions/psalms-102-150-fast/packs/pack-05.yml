          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/137?lang=fra"
          retrieved_on: "2026-09-05"
          kind: scripture
          resolved_text: |-
            Sur les bords des fleuves de Babylone, Nous étions assis et nous pleurions, en nous souvenant de Sion.
