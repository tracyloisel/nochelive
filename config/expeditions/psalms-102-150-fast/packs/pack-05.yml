          source_summary: "Les exilés s'assoient et pleurent au bord des fleuves de Babylone en se souvenant de Sion; leurs harpes restent suspendues aux saules."
          interpretation: "La plainte et le silence musical expriment une perte réelle; ils ne sont pas un manque de foi."
          application: "Une image peut laisser la douleur exister sans l'embellir ni exiger immédiatement un retour à la joie."
        ps137-3-4:
          reference: "Psaume 137:3-4"
          resolved_references: ["Psaume 137:3", "Psaume 137:4"]
          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/137?lang=fra"
          retrieved_on: "2026-09-05"
          kind: scripture
          resolved_text: |-
            Là, nos vainqueurs nous demandaient des chants, Et nos oppresseurs de la joie : Chantez-nous quelques-uns des cantiques de Sion !
