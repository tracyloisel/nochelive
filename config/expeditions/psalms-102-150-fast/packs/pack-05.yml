          source_summary: "Le chant figure la bénédiction par l'épouse, les enfants, la vigne, les oliviers, les générations, Sion et la paix."
          interpretation: "Ces images célèbrent la bénédiction dans ce psaume; elles ne fixent pas la valeur ni le destin familial obligatoire de chacun."
          application: "La table peut accueillir des vies et des liens variés sans effacer l'image familiale du texte."
        ps137-1-2:
