          resolved_references: ["Psaume 128:1", "Psaume 128:2"]
          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=fra"
          retrieved_on: "2026-09-05"
          kind: scripture
          resolved_text: |-
            Heureux tout homme qui craint l'Éternel, Qui marche dans ses voies !
