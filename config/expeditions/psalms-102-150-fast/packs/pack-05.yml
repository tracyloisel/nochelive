  result:
    revision_pipeline:
      human_revision: 0
      status: agents_running
      quiz: { processed_revision: 0, status: complete }
      voix: { processed_revision: 0, status: complete }
      mise_en_scene_visuelle: { processed_revision: 0, status: complete }
    influenceur:
      opening_screen: "Tu peux avoir perdu ta maison sans avoir perdu le chemin du retour."
      human_angle: >-
        Une personne qui revient après une longue absence ne sait plus où est sa place. Elle rencontre des exilés qui refusent d'oublier Sion, puis un Dieu qui rebâtit Jérusalem, rassemble les dispersés et panse les cœurs. Elle découvre que la maison, le travail, la table et les générations peuvent être bâtis avec Dieu, sans devenir une mesure de sa valeur ni l'obligation d'entrer dans un modèle familial unique.
      spoken_script: >-
        Tu peux avoir perdu ta maison sans avoir perdu le chemin du retour. Dans le Psaume 137, des exilés pleurent loin de Jérusalem. Ils ne chantent pas sur commande, mais ils refusent d'oublier Sion. Puis le Psaume 147 répond : Dieu rebâtit Jérusalem, rassemble les exilés et panse les cœurs brisés. Et les Psaumes 127 et 128 ramènent cette œuvre jusque dans la maison, le travail, la table et les générations. La foi n'efface pas l'exil. Elle nous apprend que Dieu peut rebâtir avec nous, nous rendre une place dans son peuple et rejoindre notre vie ordinaire.
      closing_question: "Quel premier lien pourrais-tu reprendre pour ne plus bâtir seul ?"
      simplification_risks:
        - "Transformer les images familiales des Psaumes 127-128 en modèle obligatoire ou en promesse automatique de mariage, d'enfants et de prospérité, ce qui ferait de certaines vies une preuve d'échec."
        - "Faire du rassemblement et de la guérison du Psaume 147 une garantie de retour facile, de communauté sans blessure ou de guérison immédiate, alors que le texte nomme réellement l'exil et le cœur brisé."
        - "Réduire le Psaume 137:1-6 à une nostalgie inspirante, imposer trop vite la joie aux personnes blessées ou glisser vers les imprécations des versets 7-9, qui sont hors du périmètre approuvé."
    mystique:
      thesis: >-
        Dieu ne demande pas d'oublier l'exil pour revenir à lui : il reçoit la mémoire blessée, rassemble les dispersés et apprend à rebâtir avec lui une demeure où la vie ordinaire peut de nouveau porter du fruit.
      inner_movement:
        - step: 1
          title: "Demeurer vrai dans l’exil"
          references: ["Psaume 137:1-4"]
          movement: >-
            S’asseoir, pleurer et suspendre les harpes au lieu de fabriquer la joie : la douleur devient une parole vraie devant Dieu.
        - step: 2
          title: "Garder vivant le désir de Sion"
          references: ["Psaume 137:5-6"]
          movement: >-
            Refuser d’oublier Jérusalem protège l’appartenance et maintient ouverte la possibilité du retour; la plainte devient fidélité.
        - step: 3
          title: "Se laisser rassembler et panser"
          references: ["Psaume 147:1-20"]
          movement: >-
            Le Dieu qui nomme les étoiles rebâtit Jérusalem, rassemble les exilés et panse les cœurs; le retour commence par une œuvre reçue de lui.
        - step: 4
          title: "Bâtir avec Dieu dans la vie ordinaire"
          references: ["Psaumes 127-128"]
          movement: >-
            Maison, garde, repos, travail, table, générations, Sion et paix deviennent une vie confiée, travaillée et reçue avec Dieu, sans imposer un destin familial unique.
      spiritual_practice: >-
        Prendre dix minutes avec ces psaumes : nommer devant Dieu une absence ou une blessure sans fabriquer de joie, nommer ce que l’on refuse d’oublier de son désir de Dieu, puis lui confier une chose ordinaire à bâtir cette semaine et poser un premier geste concret.
      limits:
        - "Les larmes et le silence de Psaume 137:1-6 ne sont pas un manque de foi; refuser le chant exigé par l’oppresseur peut être une fidélité."
        - "Le périmètre s’arrête à Psaume 137:6 et n’importe pas les imprécations des versets 7-9."
        - "La guérison du cœur en Psaume 147 n’est ni immédiate ni garantie et ne remplace pas l’aide humaine, médicale ou psychologique éventuellement nécessaire."
        - "Les Psaumes 127-128 ne font ni du mariage, ni des enfants, ni de la prospérité, ni d’une forme familiale unique une preuve de faveur divine."
        - "Recevoir l’œuvre de Dieu ne justifie pas la passivité : le don et le repos restent liés au travail, à la marche et à un geste concret."
    nouveau_baptise:
      good_news: >-
        Les Psaumes 137:1-6 et 147 montrent qu’une personne peut revenir vers Dieu sans nier l’exil ni forcer la joie : Dieu rejoint les cœurs brisés, rassemble les dispersés et rebâtit. Les Psaumes 127-128 ouvrent ensuite la possibilité de bâtir avec lui la vie ordinaire. Dans une réception chrétienne, ce retour peut être reçu comme une grâce rendue possible en Jésus-Christ, sans que ces psaumes le nomment littéralement.
      belonging_risk: >-
        Les images familiales des Psaumes 127-128 ne doivent pas devenir un test de fidélité, de valeur ou de faveur divine. Une famille idéale, une joie forcée ou une guérison déjà accomplie ne prouvent pas l’appartenance; les pertes ne doivent pas être imputées à une foi insuffisante et Psaume 147 ne garantit pas une guérison immédiate.
      first_step: >-
        Prendre dix minutes avec un seul psaume, nommer devant Dieu ce qui manque sans fabriquer de joie, puis choisir un petit geste libre : contacter une personne sûre, demander à venir avec elle à une réunion, partager un repas ou confier à Dieu une tâche ordinaire. Ce geste n’est pas une mesure de conversion, et attendre avant de revenir dans un lieu blessant reste légitime.
      open_question: >-
        Si Dieu rassemble les exilés, comment puis-je retrouver une place dans son peuple lorsque c’est justement une communauté de foi qui m’a blessé ?
