brief:
  id: psalms-102-150-pack-06
  source_locale: fr
  output_locale: fr
  audience: >-
    Personnes découvrant l’Évangile ou se préparant peut-être au baptême, personnes envisageant un retour à l’Église après une longue absence, et disciples désirant progresser et persévérer en Jésus-Christ.
  target_pack_count: 1
  questions_per_pack: 10
  authorized_scope: full_expedition_authoring
  constraints:
    - "Titre approuvé du pack : Tout souffle a sa place."
    - "Découverte évangélique approuvée : Toutes les nations, générations, créatures et voix sont invitées à répondre à Dieu ensemble."
    - "Question humaine approuvée : Quelle place puis-je prendre dans le peuple qui adore Dieu ?"
    - "Produire exactement dix questions françaises pour ce pack, jamais pour un autre pack."
    - "N’utiliser que les références autorisées dans parent_expedition.approved_source_refs."
    - "Ne pas hériter des choix éditoriaux, questions, concepts ou visuels de l’ancienne expédition Psaumes."
    - "Respecter tous les gates humains; ne traduire et ne relier au runtime sous aucune condition à ce stade."

