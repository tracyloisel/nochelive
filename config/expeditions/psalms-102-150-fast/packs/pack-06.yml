            - { id: b, text: "Attendre d’être parfait avant de venir" }
            - { id: c, text: "Venir honnêtement et offrir ce qui est possible" }
            - { id: d, text: "Mesurer sa foi au volume de sa voix" }
          correct_choice: c
          feedback: "La joie est dans le texte; en application, on peut venir sans la simuler et répondre selon ses possibilités."
        - id: fast-psalms-pack06-q09
          type: texte
