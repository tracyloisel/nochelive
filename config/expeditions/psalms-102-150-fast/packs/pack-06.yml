        MÉTHODE

        L’espagnol, l’anglais et le portugais brésilien ont été localisés séparément depuis le français approuvé, sans langue relais. Pour chacune des trente séquences, les identifiants, types, formats, références, identifiants et sens des choix, `correct_choice`, fait testé et nuance pastorale sont conservés. Chaque séquence complète a été lue à voix haute dans une voix de présentateur native; chaque choix reste saisissable en moins de deux secondes.

