      spoken_script: >-
        Et si ta voix manquait vraiment au chant du monde ? Le Psaume 117 appelle toutes les nations. Le Psaume 148 ajoute le soleil, les étoiles, les montagnes, les animaux, les rois, les enfants et les vieillards. Puis le Psaume 149 ouvre l'assemblée avec un chant nouveau, de la joie et de la danse. Enfin, le Psaume 150 fait entrer trompette, harpe, flûte, tambourin et cymbales, avant cette invitation : que tout ce qui respire loue l'Éternel. Tu n'as pas besoin d'une voix parfaite ni d'un passé parfait. Tu peux venir, respirer, répondre à Dieu et prendre ta place avec son peuple.
