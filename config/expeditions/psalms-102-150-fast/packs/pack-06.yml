      en:
        status: technical_pass_awaiting_human_validation
        source_locale: fr
        source_approval_revision: 14
        localized_pack_title: Every breath has a place
        official_localized_readings:
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/117?lang=eng
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng
        questions:
        - id: fast-psalms-pack06-q01
          type: texte
          format: qcm
          reference: Psaume 117:1
          prompt: Whom does Psalm 117 invite to praise the Lord?
          choices:
          - id: a
            text: Only the priests
          - id: b
            text: Only Israel
          - id: c
            text: All nations and peoples
          - id: d
            text: The temple musicians
          correct_choice: c
          feedback: 'All nations and peoples are invited to praise the Lord: no one is left outside the call.'
        - id: fast-psalms-pack06-q02
          type: texte
          format: vrai_faux
          reference: Psaume 117:2
          prompt: 'True or false: The Lord’s faithfulness lasts for one generation.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: 'His faithfulness lasts forever: God’s goodness carries through the generations.'
        - id: fast-psalms-pack06-q03
          type: texte
          format: qcm
          reference: Psaume 148:3
          prompt: Which heavenly lights does Psalm 148 call to praise God?
          choices:
          - id: a
            text: Sun, moon, and stars
          - id: b
            text: Clouds, rain, and thunder
          - id: c
            text: Sea, rivers, and springs
          - id: d
            text: Dawn, noon, and dusk
          correct_choice: a
          feedback: 'Bright sun, moon, and stars: the whole sky joins the praise.'
        - id: fast-psalms-pack06-q04
          type: texte
          format: vrai_faux
          reference: Psaume 148:11-12
          prompt: 'True or false: Kings, peoples, older people, and children are called.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: From kings to children, people of every nation and age are invited to praise God.
        - id: fast-psalms-pack06-q05
          type: vie
          format: qcm
          reference: Psaume 148:11-13
          prompt: You feel too old to have a place. What does the psalm say?
          choices:
          - id: a
            text: Only the young can praise
          - id: b
            text: Age decides your place
          - id: c
            text: Hide your weakness
          - id: d
            text: Older people and children too
          correct_choice: d
          feedback: 'The psalm calls older people and children: for us, no age shuts anyone out of praise.'
        - id: fast-psalms-pack06-q06
          type: texte
          format: qcm
          reference: Psaume 149:1
          prompt: Where does the new song ring out?
          choices:
          - id: a
            text: In a locked room
          - id: b
            text: In the congregation of saints
          - id: c
            text: Before foreign kings
          - id: d
            text: In the heart of battle
          correct_choice: b
          feedback: 'The new song rings out in the congregation of saints: praise becomes a shared voice.'
        - id: fast-psalms-pack06-q07
          type: texte
          format: vrai_faux
          reference: Psaume 149:3
          prompt: 'True or false: Dance, tambourine, and harp join the praise.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: 'The psalm joins body and instruments: dance, tambourine, and harp praise God.'
        - id: fast-psalms-pack06-q08
          type: vie
          format: qcm
          reference: Psaume 149:1-5
          prompt: You’re coming back to church without feeling joy. What’s one first step?
          choices:
          - id: a
            text: Put on a joyful face
          - id: b
            text: Wait until you feel perfect
          - id: c
            text: Come honestly and take one step
          - id: d
            text: Measure faith by volume
          correct_choice: c
          feedback: Joy lives in the psalm; you can come without pretending and offer God what you can today.
        - id: fast-psalms-pack06-q09
          type: texte
          format: vrai_faux
          reference: Psaume 150:3-5
          prompt: 'True or false: Psalm 150 names only one instrument.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: Trumpet, psaltery, harp, timbrel, strings, flute, cymbals, and dance make a whole celebration.
        - id: fast-psalms-pack06-q10
          type: vie
          format: qcm
          reference: Psaume 150:6
          prompt: You can’t sing or play. How does the psalm make room for you?
          choices:
          - id: a
            text: Respond with breath and presence
          - id: b
            text: Leave praise to the musicians
          - id: c
            text: Prove faith through talent
          - id: d
            text: Wait for a powerful feeling
          correct_choice: a
          feedback: "“Everything that has breath” includes you: your breath and presence can respond to God. Praise is not a contest."
