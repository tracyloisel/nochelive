            - { id: b, text: "Faux" }
          correct_choice: a
          feedback: "Le verset associe les danses, le tambourin et la harpe à la louange."
        - id: fast-psalms-pack06-q08
          type: vie
          format: qcm
          reference: "Psaume 149:1-5"
          prompt: "Tu reviens à l’Église sans ressentir encore la joie. Quel premier pas respecte ces psaumes ?"
