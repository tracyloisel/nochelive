            - { id: c, text: "Prouver sa foi par un autre talent" }
            - { id: d, text: "Attendre une émotion spectaculaire" }
          correct_choice: a
          feedback: "« Tout ce qui respire » élargit l’appel; offrir son souffle et sa présence est une application, pas un concours."
