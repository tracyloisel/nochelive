      production: |-
        ACCROCHE DE PREMIER ÉCRAN

        Et si ta voix manquait vraiment au chant du monde ?

        ANGLE HUMAIN UNIQUE

        Une personne qui se croit extérieure, maladroite ou arrivée trop tard
        découvre que la louange biblique n'est pas réservée aux spécialistes.
        Les nations, les générations, les puissants, les humbles, la création
        entière et chaque être qui respire sont appelés ensemble. Sa place ne
        dépend donc ni d'une voix parfaite, ni d'une histoire religieuse sans
        faille : elle peut répondre à Dieu avec ce qu'elle est et rejoindre un
        peuple qui se réjouit en lui.

        CE QUE DISENT LES TEXTES

        Le Psaume 117 appelle toutes les nations et tous les peuples à louer
        l'Éternel pour sa bonté et sa fidélité. Le Psaume 148 élargit cet appel
        aux cieux, aux astres, aux éléments, aux animaux, aux rois, aux peuples,
        aux jeunes, aux vieillards et aux enfants. Le Psaume 149 place un
        cantique nouveau, la joie, la danse et les instruments dans l'assemblée
        des fidèles; il affirme aussi que Dieu prend plaisir à son peuple et
        glorifie les humbles en les sauvant. Le Psaume 150 rassemble sanctuaire,
        puissance, hauts faits, instruments, danse et souffle dans une finale :
        que tout ce qui respire loue l'Éternel.

        RÉCEPTION ET APPLICATION

        Dans une réception chrétienne, cet appel universel peut aider une
        personne à venir vers Dieu et à prendre place parmi son peuple par
        Jésus-Christ; ces psaumes ne nomment toutefois pas littéralement le
        baptême ni une assemblée chrétienne contemporaine. L'application
        proposée est de venir à l'Église et d'offrir avec les autres une louange
        sincère, parlée, chantée, jouée, dansée ou simplement portée par sa
        présence et son souffle. Le score, l'aisance musicale et l'intensité
        émotionnelle ne mesurent jamais la foi ni la dignité.

        SCRIPT ORAL — 35 À 45 SECONDES

        Et si ta voix manquait vraiment au chant du monde ? Le Psaume 117 appelle
        toutes les nations. Le Psaume 148 ajoute le soleil, les étoiles, les
        montagnes, les animaux, les rois, les enfants et les vieillards. Puis le
        Psaume 149 ouvre l'assemblée avec un chant nouveau, de la joie et de la
        danse. Enfin, le Psaume 150 fait entrer trompette, harpe, flûte, tambourin
        et cymbales, avant cette invitation : que tout ce qui respire loue
        l'Éternel. Tu n'as pas besoin d'une voix parfaite ni d'un passé parfait.
        Tu peux venir, respirer, répondre à Dieu et prendre ta place avec son
        peuple.

        QUESTION FINALE

        Quelle voix, quel geste ou quelle présence pourrais-tu offrir avec les
        autres ?

        TROIS RISQUES DE SIMPLIFICATION À TRANSMETTRE AU MYSTIQUE

        1. Réduire la louange à la musique, à l'enthousiasme visible ou à une
           performance, alors que le corpus convoque aussi la présence, la
           relation, la fidélité et le souffle.
        2. Présenter l'universalité de l'appel comme si chaque personne devait
           ressentir immédiatement la joie, ou comme si la maladresse, le doute
           et un retour tardif excluaient de l'assemblée.
        3. Transformer les images de glaive, de vengeance et de jugement du
           Psaume 149:6-9 en consigne personnelle ou en violence chrétienne;
           elles appartiennent au texte ancien et exigent une lecture historique
           et théologique que ce pack ne doit pas simplifier.
    mystique:
      owner: expedition-fast-mystique
      revision: 3
      status: complete
      production: |-
        PHRASE-THÈSE

        Ces psaumes font passer la personne qui se croit extérieure de la
        position de spectatrice à celle de vivante appelée : elle reçoit son
        souffle, reconnaît la bonté et la fidélité de Dieu, puis prend librement
        sa place dans une louange plus vaste qu'elle, avec le peuple et toute la
        création.

        CE QUE DIT LE TEXTE

        Le Psaume 117 appelle toutes les nations et tous les peuples à louer
        l'Éternel parce que sa bonté est grande et que sa fidélité demeure. Le
        Psaume 148 déploie l'appel des cieux vers la terre : anges, astres,
        éléments, reliefs, végétaux, animaux, gouvernants, peuples, jeunes,
        vieillards et enfants louent le nom du Dieu créateur dont la majesté
        domine et dont le peuple est près de lui. Le Psaume 149:1-5 relie le
        cantique nouveau, l'assemblée, la danse et la joie au Dieu qui prend
        plaisir à son peuple et glorifie les humbles en les sauvant. Le Psaume
        150 conduit du sanctuaire et des hauts faits de Dieu aux instruments, à
        la danse, puis au souffle commun à tout vivant.

        MOUVEMENT INTÉRIEUR — QUATRE PASSAGES

        1. ENTENDRE UN APPEL QUI ME DÉPASSE. « Toutes les nations » brise l'idée
           d'une louange réservée aux habitués, mais l'impératif reçoit sa raison
           dans la bonté et la fidélité de Dieu : la réponse ne part pas d'une
           performance à produire.
        2. DÉCOUVRIR UN MONDE DÉJÀ TOURNÉ VERS DIEU. Le regard monte vers les
           cieux puis redescend jusqu'aux animaux, aux peuples et à tous les
           âges. La personne cesse de demander si elle mérite d'entrer seule et
           découvre qu'elle est une voix parmi une création reçue et ordonnée.
        3. PASSER DE L'ISOLEMENT À UNE JOIE PARTAGÉE. Dans Psaume 149:1-5, le
           chant nouveau se lève dans l'assemblée; le corps, les instruments et
           la joie ont leur place, tandis que les humbles ne sont pas effacés :
           Dieu prend plaisir à son peuple et les sauve.
        4. OFFRIR LE SOUFFLE REÇU. Psaume 150 multiplie les manières de louer,
           puis les rassemble dans ce que nul vivant n'a à maîtriser comme un
           talent : respirer. L'intériorité ne se referme donc pas sur elle-même;
           elle devient présence, réponse et communion.

        RÉCEPTION ET APPLICATION PROPOSÉES

        Dans une réception chrétienne, ce mouvement peut accompagner une venue
        ou un retour parmi le peuple de Dieu et une réponse à sa grâce en
        Jésus-Christ. Les psaumes ne nomment toutefois ni le baptême chrétien ni
        une réunion moderne : ce lien demeure une réception et une application,
        jamais une citation du texte.

        PRATIQUE SPIRITUELLE CONCRÈTE — LA PRIÈRE DU SOUFFLE ET DE LA PLACE

        Pendant cinq minutes, seul puis si possible auprès d'une assemblée :
        recevoir trois respirations sans chercher une émotion particulière;
        à chaque expiration, nommer sobrement une bonté ou une fidélité de Dieu;
        écouter ensuite une autre voix sans la comparer à la sienne; enfin,
        offrir une réponse réellement possible aujourd'hui — une phrase, un
        chant, un geste de service, une présence attentive ou un silence tourné
        vers Dieu. La pratique ne mesure ni la foi ni la dignité; elle rend
        simplement imaginable une place prise avec les autres.

        LIMITES QUI PROTÈGENT LE TEXTE ET LES PERSONNES

        - La louange ne commande pas de nier la peine, le doute ou l'épuisement,
          ni de fabriquer une joie visible. Le souffle peut être fragile et la
          présence silencieuse peut déjà être une réponse.
        - L'appel universel n'efface ni les histoires particulières ni les
          limites du corps. Musique, danse et intensité ne sont pas des preuves
          supérieures de foi ou d'appartenance.
        - Psaume 149:6-9 appartient au texte ancien et son langage de glaive,
          vengeance, chaînes et jugement exige une lecture historique et
          théologique. Il ne devient ici ni consigne personnelle, ni violence
          chrétienne légitimée, ni question de vie simplifiée.
        - « Dieu prend plaisir à son peuple » et « glorifie les humbles en les
          sauvant » ne deviennent ni score de dignité, ni garantie automatique
          de protection, ni diagnostic porté sur autrui.
        - Dire qu'une personne peut prendre place dans l'Église par
          Jésus-Christ est une réception chrétienne proposée; ce n'est pas la
          formulation littérale de ces psaumes et cela ne doit jamais servir de
          test d'appartenance.
    nouveau_baptise:
      owner: expedition-fast-nouveau-baptise
      revision: 4
      status: complete
      production: |-
        CE QUI PEUT ÊTRE REÇU COMME UNE BONNE NOUVELLE

        Le Psaume 117 appelle toutes les nations et tous les peuples à louer
        l’Éternel, non parce qu’ils auraient réussi une épreuve religieuse, mais
        parce que sa bonté est grande et que sa fidélité dure à jamais. Le
        Psaume 148 fait entendre cet appel des cieux à la terre, jusque dans la
        diversité des peuples et des âges. Psaume 149:1-5 place le cantique
        nouveau dans l’assemblée, affirme que Dieu prend plaisir à son peuple et
        qu’il glorifie les humbles en les sauvant. Le Psaume 150 rassemble de
        nombreuses manières de louer, puis les ouvre à tout ce qui respire.

        Un nouveau baptisé peut donc recevoir cette bonne nouvelle : il ne se
        présente pas à une audition pour mériter une place. Il est invité à
        répondre à la bonté et à la fidélité de Dieu avec le souffle et les
        possibilités qu’il reçoit aujourd’hui, parmi un peuple et une création
        déjà appelés. Dans une réception chrétienne, cette réponse peut prendre
        place dans un chemin vers Dieu par Jésus-Christ et dans la communion de
        l’Église; les psaumes ne nomment toutefois littéralement ni le baptême
        chrétien ni une réunion contemporaine.

        CE QUI RISQUE D’ÊTRE MAL COMPRIS OU VÉCU COMME UN TEST D’APPARTENANCE

        La répétition de « louez » pourrait faire croire qu’il faut chanter
        fort, danser, éprouver immédiatement de la joie ou maîtriser des codes
        religieux pour être un vrai disciple. Les instruments, la danse et les
        cris de joie décrivent des formes présentes dans les psaumes; ils ne
        mesurent ni la foi, ni la dignité, ni la réalité d’une conversion. La
        phrase « l’Éternel prend plaisir à son peuple » ne permet pas davantage
        de décider qui serait accepté ou exclu par Dieu. Une personne timide,
        endeuillée, handicapée, hésitante ou encore peu familière de l’Église ne
        doit pas entendre ce pack comme une injonction à simuler l’enthousiasme.

        Psaume 149:6-9 forme une limite textuelle ferme : son langage de glaive,
        de vengeance, de chaînes et de jugement appartient au psaume ancien et
        demande une lecture historique et théologique. Il ne devient ici ni
        consigne personnelle, ni légitimation de violence, ni question de vie
        simplifiée, ni critère d’appartenance.

        UN PREMIER PAS RÉALISTE, SANS HONTE NI PERFORMANCE

        Lors d’une prochaine prière ou rencontre de l’Église, commencer par
        écouter une autre voix sans se comparer. Puis offrir une seule réponse
        honnête à la bonté ou à la fidélité de Dieu : une phrase simple, un chant
        si on le souhaite, un geste de service, une présence attentive ou un
        silence tourné vers lui. Ce premier pas est une application proposée,
        non une condition de salut ni une manière de prouver sa foi.

        UNE QUESTION QU’UN NOUVEAU BAPTISÉ POURRAIT ENCORE POSER

        Si je ne ressens pas encore la joie et que je n’ose pas chanter, ma
        présence silencieuse a-t-elle quand même une place auprès du peuple de
        Dieu ?
    quiz:
      owner: expedition-fast-quiz
      revision: 5
      status: complete
      production: |-
        CONTRÔLE D'ENTRÉE

        La filiation est conforme : architecture rencontrer-le-roi-serviteur,
        pack-06, titre « Tout souffle a sa place », périmètre strict Psaume 117
        et Psaumes 148–150. La révision humaine est idle à 0; aucun instantané
        humain ne remplace donc le dossier éditorial reçu. Les mémoires
        Influenceur, Mystique et Nouveau baptisé ont été relues intégralement.

        CONTRÔLE DES SOURCES OFFICIELLES

        - Psaume 117:1-2 appelle toutes les nations et tous les peuples à louer
          l'Éternel à cause de sa grande bonté et de sa fidélité éternelle.
          Source : https://www.churchofjesuschrist.org/study/scriptures/ot/ps/117?lang=fra
        - Psaume 148:3 nomme soleil, lune et étoiles lumineuses; 148:11-12
          appelle rois, peuples, princes, juges, jeunes, vieillards et enfants;
          148:13 place la majesté de Dieu au-dessus de la terre et des cieux.
          Source : https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=fra
        - Psaume 149:1-5 situe le cantique nouveau dans l'assemblée, nomme
          danses, tambourin et harpe, puis la joie du peuple et le salut des
          humbles. Les versets 6-9 sont reconnus comme limite textuelle : ils
          ne deviennent ni consigne personnelle, ni légitimation de violence,
          ni question de vie simplifiée.
          Source : https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=fra
        - Psaume 150:1-6 relie la louange au sanctuaire, aux hauts faits et à
          la grandeur de Dieu, multiplie les instruments et la danse, puis
          appelle tout ce qui respire.
          Source : https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=fra

        MIX RETENU ET RAISON

        Sept questions texte et trois questions vie : les quatre psaumes
        offrent une grande variété de paroles vérifiables, tandis que les
        applications restent limitées aux discernements réellement soutenus
        par le dossier — une place à tout âge, une présence honnête sans joie
        simulée et une réponse possible sans performance musicale. Six QCM et
        quatre vrai/faux : ces derniers ne portent que sur des affirmations
        textuelles nettes. Les positions justes des QCM sont c, a, d, b, c, a;
        elles sont variées sans motif répétitif.

        DIX QUESTIONS SÉMANTIQUES

        1. [texte, qcm, Psaume 117:1] Qui le psaume appelle-t-il à louer
           l'Éternel ? Réponse : c, toutes les nations et tous les peuples.
           Retour : le verset adresse l'appel aux nations et aux peuples.
        2. [texte, vrai_faux, Psaume 117:2] La fidélité de l'Éternel ne dure
           qu'une génération. Réponse : Faux. Retour : elle dure à jamais.
        3. [texte, qcm, Psaume 148:3] Quels astres sont appelés à louer Dieu ?
           Réponse : a, soleil, lune et étoiles. Retour : ce sont les trois
           groupes célestes nommés au verset 3.
        4. [texte, vrai_faux, Psaume 148:11-12] Rois, peuples, vieillards et
           enfants sont eux aussi appelés. Réponse : Vrai. Retour : les
           versets rassemblent responsabilités, peuples et générations.
        5. [vie, qcm, Psaume 148:11-13] Une personne se croit trop âgée pour
           avoir sa place. Réponse : d, vieillards et enfants sont appelés
           aussi. Retour : le texte nomme les âges; l'application refuse d'en
           faire un droit d'entrée ou d'exclusion.
        6. [texte, qcm, Psaume 149:1] Où le cantique nouveau est-il chanté ?
           Réponse : b, dans l'assemblée des fidèles. Retour : c'est le lieu
           explicitement donné par le verset.
        7. [texte, vrai_faux, Psaume 149:3] Le psaume nomme danse, tambourin
           et harpe. Réponse : Vrai. Retour : les trois formes sont présentes.
        8. [vie, qcm, Psaume 149:1-5] Une personne revient à l'Église sans
           ressentir encore la joie. Réponse : c, venir honnêtement et offrir
           ce qui est possible. Retour : la joie appartient au texte; venir
           sans la simuler est une application pastorale, pas une citation.
        9. [texte, vrai_faux, Psaume 150:3-5] Le psaume ne cite qu'un seul
           instrument. Réponse : Faux. Retour : il en rassemble plusieurs,
           avec les danses.
        10. [vie, qcm, Psaume 150:6] Une personne ne sait ni chanter ni jouer.
            Réponse : a, répondre à Dieu avec son souffle et sa présence.
            Retour : « tout ce qui respire » soutient cette application sans
            transformer la louange en concours.

        AUDIT DE SORTIE

        Chaque QCM possède quatre choix distincts et une seule réponse juste.
        Chaque vrai/faux possède exactement Vrai et Faux et teste une phrase
        sans réserve cachée. Les trois questions vie sont explicitement reliées
        à leur passage et leur retour signale le statut d'application. Aucune
        question ne transforme Psaume 149:6-9 en conduite personnelle. Aucun
        fait, référence ou correct_choice ne reste non résolu.
    voix:
      owner: expedition-fast-voix
      revision: 6
      status: complete
      production: |-
        CONTRÔLE D’ENTRÉE

        La filiation, les quatre lectures officielles déclarées dans
        source.readings et les mémoires Influenceur, Mystique, Nouveau baptisé
        et Quiz ont été relues intégralement. La révision humaine est idle à 0
        et la projection Quiz déclare processed_revision 0 : il n’existe donc
        aucun instantané humain soumis à réconcilier. Les dix unités du Quiz
        forment bien 7 questions texte, 3 questions vie, 6 QCM et 4 vrai/faux.

        DÉCOUVERTE PROPOSÉE AU JOUEUR, QUESTION PAR QUESTION

        1. L’appel du Psaume 117 embrasse toutes les nations et tous les
           peuples; il n’est réservé ni à un clergé, ni à un seul peuple, ni
           aux musiciens.
        2. La fidélité de Dieu dure à jamais et traverse les générations.
        3. Soleil, lune et étoiles lumineuses sont explicitement appelés à
           louer Dieu.
        4. Responsabilités, peuples et générations, des rois aux enfants, sont
           réunis dans le même appel.
        5. Vieillards et enfants sont nommés : l’application proposée refuse
           donc de faire de l’âge un droit d’entrée ou d’exclusion.
        6. Le cantique nouveau est chanté dans l’assemblée des fidèles; la
           louange y devient une voix partagée.
        7. Le Psaume 149:3 associe danse, tambourin et harpe à la louange.
        8. La joie appartient au psaume, mais revenir parmi le peuple de Dieu
           n’exige pas de la simuler : une réponse sincère et possible forme
           un premier pas pastoral.
        9. Le Psaume 150 ne réduit pas la louange à un instrument; il rassemble
           de nombreux instruments et la danse.
        10. L’appel à tout ce qui respire ouvre une réponse par le souffle et
            la présence sans transformer la louange en concours.

        COPIE DE PLATEAU FRANÇAISE

        1. Qui le Psaume 117 invite-t-il à louer l’Éternel ?
           — Seulement les prêtres
           — Seulement Israël
           — Nations et peuples, tous appelés [JUSTE]
           — Les musiciens du temple
           Révélation : Toutes les nations et tous les peuples sont invités à
           louer l’Éternel : personne n’est hors de l’appel.

        2. Vrai ou faux : la fidélité de l’Éternel dure une seule génération.
           — Vrai
           — Faux [JUSTE]
           Révélation : Sa fidélité dure à jamais : la bonté de Dieu traverse
           les générations.

        3. Quels astres le Psaume 148 appelle-t-il à louer Dieu ?
           — Soleil, lune et étoiles [JUSTE]
           — Nuages, pluie et tonnerre
           — Mer, fleuves et sources
           — Aurore, midi et crépuscule
           Révélation : Soleil, lune et étoiles lumineuses : le ciel entier
           entre dans la louange.

        4. Vrai ou faux : rois, peuples, vieillards et enfants sont appelés.
           — Vrai [JUSTE]
           — Faux
           Révélation : Du roi à l’enfant, tous les peuples et tous les âges
           sont invités à louer Dieu.

        5. Tu te crois trop âgé pour avoir ta place. Que répond le psaume ?
           — Seuls les jeunes peuvent louer
           — L’âge décide de ta place
           — Il faut cacher sa fragilité
           — Vieillards et enfants aussi [JUSTE]
           Révélation : Le psaume appelle vieillards et enfants : pour nous,
           aucun âge n’exclut de la louange.

        6. Où le cantique nouveau résonne-t-il ?
           — Dans une chambre fermée
           — Dans l’assemblée des fidèles [JUSTE]
           — Devant des rois étrangers
           — Au cœur d’une bataille
           Révélation : Le chant nouveau résonne dans l’assemblée des fidèles :
           la louange devient une voix partagée.

        7. Vrai ou faux : danse, tambourin et harpe entrent dans la louange.
           — Vrai [JUSTE]
           — Faux
           Révélation : Le psaume unit le corps et les instruments : danse,
           tambourin et harpe célèbrent Dieu.

        8. Tu reviens à l’Église sans ressentir la joie. Quel premier pas
           choisir ?
           — Afficher une joie de façade
           — Attendre de se sentir parfait
           — Venir sincère et offrir un pas [JUSTE]
           — Mesurer sa foi au volume
           Révélation : La joie habite le psaume; nous pouvons venir sans la
           feindre et offrir à Dieu ce qui est possible aujourd’hui.

        9. Vrai ou faux : le Psaume 150 ne cite qu’un seul instrument.
           — Vrai
           — Faux [JUSTE]
           Révélation : Trompette, luth, harpe, tambourin, cordes, flûte,
           cymbales et danse composent toute une fête.

        10. Tu ne sais ni chanter ni jouer. Quelle place le psaume t’ouvre-t-il ?
            — Répondre par souffle et présence [JUSTE]
            — Laisser louer les musiciens
            — Prouver sa foi par un talent
            — Attendre une émotion forte
            Révélation : « Tout ce qui respire » t’inclut : souffle et présence
            peuvent répondre à Dieu. La louange n’est pas un concours.

        AUDIT ORAL ET PASTORAL

        Les dix séquences prompt, choix puis révélation ont été lues à voix
        haute dans l’ordre du joueur. Chaque lancement porte une seule attente,
        chaque choix se dit et se distingue en moins de deux secondes et chaque
        révélation fonctionne après une réponse juste comme après une réponse
        fausse. Aucun retour ne parle de méthode éditoriale, ne félicite ou
        n’humilie le joueur. Les applications des questions 5, 8 et 10 restent
        signalées par leur formulation, sans se faire passer pour une citation.
        Psaume 149:6-9 ne devient ni consigne personnelle, ni légitimation de
        violence, ni question de vie simplifiée.

        PREUVE STREET 390 × 667

        Le test système permanent expedition_fast_voice_visual_test.rb a été
        chargé sans modification du fichier de test, puis ses constantes de
        dossier et de pack ont été redirigées en mémoire vers ce pack isolé.
        Chacune des dix copies a donc été construite comme une véritable
        QuizDefinition::Question, affichée par la route Street, mélangée,
        répondue volontairement à faux et inspectée dans ask puis reveal.
        Résultat : 1 run, 1093 assertions, 0 failure, 0 error, 0 skip. Les vingt
        captures 390 × 667 sont dans
        /private/tmp/fast-psalms-pack06-voice-r6. L’inspection directe des deux
        planches confirme l’absence de clipping, troncature, ellipse,
        défilement des réponses ou erreur console sévère.

        Une première commande ImageMagick de montage a signalé une police
        d’annotation introuvable après avoir créé les planches. La relance avec
        le chemin explicite de SFNSMono.ttf a terminé avec le code 0. Cet
        incident ne concerne ni les vingt captures sources, ni le test Street,
        ni la copie; les planches finales ont été ouvertes et inspectées
        directement. Aucun visuel de pack n’a été généré.

        CONTRÔLE DES INVARIANTS

        Pour les dix unités, id, type, format, référence, identifiants et sens
        des choix, correct_choice et découverte testée sont inchangés. Chaque
        QCM conserve quatre choix; chaque vrai/faux conserve exactement Vrai et
        Faux. Les maxima observés sont 72 graphèmes pour un prompt, 32 pour un
        choix et 113 pour un feedback. Les productions antérieures, le
        brouillon fast.result.quiz et fast.visual_requirements sont inchangés
        d’après leurs empreintes SHA-256 prises avant et après l’écriture.
    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 7
      status: complete
      production: |-
        CONTRÔLE D’ENTRÉE

        La copie française finale comporte exactement dix questions, la Voix a
        traité la révision humaine 0 et le dossier est au stade de mise en scène.
        Les quatre chapitres officiels ont été relus à leurs URL déclarées. Le
        prompt du quiz n’a jamais servi de source.

        RÉSOLUTION ET FRONTIÈRE DE VÉRITÉ

        Psaume 117 appelle nations et peuples en réponse à la bonté et à la
        fidélité durable de Dieu. Psaume 148 élargit l’appel aux astres, aux
        responsabilités, aux peuples et aux âges. Psaume 149:1-5 place chant,
        joie, danse et instruments dans l’assemblée; ses versets 6-9 restent un
        langage ancien de jugement qui exige une lecture historique et
        théologique et ne devient jamais conduite personnelle. Psaume 150
        réunit sanctuaire, hauts faits, instruments, danse et tout souffle.

        ARBITRAGE VISUEL

        Dix images conventionnelles ont été comparées à une situation
        dramaturgique lorsqu’elle renforçait vraiment la scène. Les choix finaux
        comptent une image conventionnelle, cinq dramaturgiques et quatre
        hybrides. Le rythme alterne sept photogrammes cinématographiques et
        trois illustrations bibliques. Il progresse d’un appel universel vers
        une place personnellement offerte, par émerveillement cosmique,
        générations, assemblée, fête, retour sincère et souffle partagé.

        TRANSMISSION

        Les dix concepts sont PASS, aucune source ni unité ne bloque. Le lot
        complet reste interdit. Le Producteur peut choisir la preuve la plus
        discriminante et effectuer exactement un appel 9:16 avant la Critique
        des deux secondes et la décision humaine.
