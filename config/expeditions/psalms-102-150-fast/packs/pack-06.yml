      pt-BR:
        status: technical_pass_awaiting_human_validation
        source_locale: fr
        source_approval_revision: 14
        localized_pack_title: Todo fôlego tem seu lugar
        official_localized_readings:
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/117?lang=por
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=por
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=por
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=por
        questions:
        - id: fast-psalms-pack06-q01
          type: texte
          format: qcm
          reference: Psaume 117:1
          prompt: Quem o Salmo 117 convida a louvar o Senhor?
          choices:
          - id: a
            text: Somente os sacerdotes
          - id: b
            text: Somente Israel
          - id: c
            text: Todas as nações e povos
          - id: d
            text: Os músicos do templo
          correct_choice: c
          feedback: 'Todas as nações e todos os povos são convidados a louvar o Senhor: ninguém fica de fora do chamado.'
        - id: fast-psalms-pack06-q02
          type: texte
          format: vrai_faux
          reference: Psaume 117:2
          prompt: 'Verdadeiro ou falso: a fidelidade do Senhor dura só uma geração.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'Sua fidelidade dura para sempre: a bondade de Deus atravessa gerações.'
        - id: fast-psalms-pack06-q03
          type: texte
          format: qcm
          reference: Psaume 148:3
          prompt: Que astros o Salmo 148 chama para louvar a Deus?
          choices:
          - id: a
            text: Sol, lua e estrelas
          - id: b
            text: Nuvens, chuva e trovões
          - id: c
            text: Mar, rios e nascentes
          - id: d
            text: Aurora, meio-dia e entardecer
          correct_choice: a
          feedback: 'Sol, lua e estrelas brilhantes: o céu inteiro entra no louvor.'
        - id: fast-psalms-pack06-q04
          type: texte
          format: vrai_faux
          reference: Psaume 148:11-12
          prompt: 'Verdadeiro ou falso: reis, povos, idosos e crianças são chamados.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: Do rei à criança, todos os povos e todas as idades são convidados a louvar a Deus.
        - id: fast-psalms-pack06-q05
          type: vie
          format: qcm
          reference: Psaume 148:11-13
          prompt: Você acha que já passou da idade. O que o salmo responde?
          choices:
          - id: a
            text: Só os jovens podem louvar
          - id: b
            text: A idade decide seu lugar
          - id: c
            text: É preciso esconder a fragilidade
          - id: d
            text: Idosos e crianças também
          correct_choice: d
          feedback: 'O salmo chama idosos e crianças: para nós, nenhuma idade exclui alguém do louvor.'
        - id: fast-psalms-pack06-q06
          type: texte
          format: qcm
          reference: Psaume 149:1
          prompt: Onde o cântico novo ressoa?
          choices:
          - id: a
            text: Num quarto fechado
          - id: b
            text: Na congregação dos santos
          - id: c
            text: Diante de reis estrangeiros
          - id: d
            text: No meio de uma batalha
          correct_choice: b
          feedback: 'O cântico novo ressoa na congregação dos santos: o louvor se torna uma voz compartilhada.'
