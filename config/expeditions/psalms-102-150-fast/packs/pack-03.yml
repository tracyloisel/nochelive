  agent_memory:
    influenceur:
      owner: expedition-fast-influenceur
      revision: 1
      status: complete
      production: |-
        ACCROCHE DE PREMIER ÉCRAN

        Et si Dieu te connaissait entièrement sans chercher à t'humilier ?

        ANGLE HUMAIN UNIQUE

        Quelqu'un qui cache sa détresse ou sa faute par peur d'être rejeté découvre
        qu'il peut parler vrai devant Dieu : l'Éternel entend le cri, se souvient
        de notre fragilité, éloigne les transgressions, reste présent jusque dans
        la nuit et accepte encore de conduire le cœur qui s'ouvre à lui.

        SCRIPT ORAL — 35 À 45 SECONDES

        Tu as peut-être déjà voulu prier, puis tu t'es arrêté : « S'il savait
        vraiment ce qu'il y a en moi, est-ce qu'il me rejetterait ? » Ces psaumes
        osent répondre sans maquiller la vie. L'un crie depuis la solitude. Un
        autre se rappelle que Dieu sait que nous sommes poussière et qu'il éloigne
        nos fautes. Un autre dit : « Il entend ma voix. » Et le dernier ne cherche
        plus à fuir : « Sonde-moi, connais mon cœur et conduis-moi. » Être connu
        par Dieu n'est pas être exposé pour être écrasé. C'est pouvoir venir vrai,
        recevoir sa compassion et recommencer à marcher avec lui.

        QUESTION FINALE

        Qu'aurais-tu envie de dire à Dieu si tu étais sûr d'être entendu sans être rejeté ?

        RISQUES DE SIMPLIFICATION À TRANSMETTRE AU MYSTIQUE

        1. Transformer « Dieu connaît tout » en surveillance menaçante ou, à
           l'inverse, en approbation automatique de tout choix.
        2. Transformer les images de guérison, délivrance et conduite en garantie
           immédiate de santé, de sécurité ou de fin de la souffrance.
        3. Effacer le repentir, l'alliance et le désir d'être corrigé en ne gardant
           qu'un message vague d'acceptation, ou utiliser les imprécations de
           Psaume 139:19-22 comme permission de haïr.
    mystique:
      owner: expedition-fast-mystique
      revision: 1
      status: complete
      production: |-
        PHRASE-THÈSE

        Sous le regard du Dieu qui entend, se souvient, pardonne et connaît,
        la prière conduit de la détresse dite sans masque au consentement d'être
        relevé, repris et conduit sur sa voie.

        MOUVEMENT INTÉRIEUR DU TEXTE

        1. DÉVERSER LA PLAINTE SANS LA CORRIGER — Psaume 102:1-12, 18-22
           La prière commence dans un corps épuisé, l'insomnie, la solitude, les
           larmes et la peur de disparaître. Le texte ne demande pas au malheureux
           de paraître fort : son cri parvient à Dieu, qui ne dédaigne pas la
           prière du démuni et écoute le gémissement des captifs.

        2. SE SOUVENIR DE LA COMPASSION AU CŒUR DE LA FRAGILITÉ —
           Psaume 103:1-18
           L'âme se parle pour ne pas oublier. Elle nomme pardon, relèvement,
           justice et bonté, puis reçoit une compassion qui connaît sa matière :
           Dieu se souvient que l'être humain est poussière. Cette miséricorde
           n'efface pas l'alliance; elle rend possible d'y revenir et d'y marcher.

        3. PASSER DU SECOURS REÇU À UNE RÉPONSE OFFERTE — Psaume 116:1-19
           Celui qui a crié découvre une oreille penchée vers lui, retourne au
           repos et choisit de marcher sur la terre des vivants. Sa reconnaissance
           devient invocation, sacrifice d'actions de grâces et fidélité assumée
           devant le peuple : non le paiement d'un miracle, mais une vie qui répond.

        4. CESSER DE FUIR LE REGARD QUI PEUT CONDUIRE — Psaume 139:1-18, 23-24
           La connaissance divine rejoint la pensée, la parole, la nuit et les
           extrémités de la mer. À la fin, le psalmiste ne cherche plus à se cacher :
           il demande librement d'être sondé, éprouvé et conduit sur la voie de
           l'éternité. Être connu devient une prière de transformation, pas une
           condamnation anticipée.

        PRATIQUE SPIRITUELLE CONCRÈTE — LA PRIÈRE EN QUATRE VERBES

        Prendre sept minutes, sans chercher une émotion particulière. Dire à Dieu
        une détresse réelle avec le verbe « je crie ». Nommer ensuite un bienfait
        dont on veut se souvenir. Choisir une réponse petite et libre pour la
        journée — remercier, réparer, tenir une parole ou demander de l'aide.
        Terminer en lisant Psaume 139:23-24 et en laissant cette demande ouverte :
        « Montre-moi ce qui doit changer et conduis-moi. » Si aucune paix immédiate
        ne vient, la prière n'est pas ratée.

        LIMITES DE FIDÉLITÉ ET DE DISCERNEMENT

        - La détresse du Psaume 102 demeure corporelle, sociale et historique.
          L'écouter spirituellement ne permet ni de minimiser une maladie ou une
          injustice, ni de substituer la prière aux soins, à la protection ou à
          l'aide concrète.
        - Les délivrances et guérisons chantées ne garantissent pas une issue
          immédiate à toute souffrance. Le texte atteste une relation de confiance;
          il ne permet pas de juger la foi d'une personne dont l'épreuve continue.
        - La connaissance de Dieu dans le Psaume 139 ne devient ni surveillance
          humiliante ni approbation automatique de tout choix. Les versets 23-24
          conservent l'appel à être éprouvé, corrigé et conduit.
        - La compassion et le pardon du Psaume 103 ne suppriment ni repentance,
          réparation, commandements ni alliance; ils excluent en revanche la honte
          comme moyen de contraindre quelqu'un à revenir.
        - La haine et le souhait de mort de Psaume 139:19-22 sont une parole de
          conflit présente dans le psaume, pas une permission chrétienne de haïr,
          persécuter ou se venger. La lecture proposée choisit le retournement des
          versets 23-24 : demander d'abord que son propre cœur soit examiné.
        - La rencontre avec Jésus-Christ est une réception chrétienne de ce
          mouvement — venir vrai, recevoir miséricorde et marcher avec Dieu — et
          non une citation littérale de ces quatre psaumes.
    nouveau_baptise:
      owner: expedition-fast-nouveau-baptise
      revision: 1
      status: complete
      production: |-
        CE QUI PEUT ÊTRE REÇU COMME UNE BONNE NOUVELLE

        Le texte laisse venir quelqu’un sans lui demander de cacher ce qui fait
        mal. Le Psaume 102 montre une plainte qui parvient à Dieu et une prière
        de démuni qu’il ne dédaigne pas. Le Psaume 103 annonce un Dieu
        compatissant, lent à la colère, qui pardonne et se souvient que l’être
        humain est poussière. Le Psaume 116 fait entendre la joie de quelqu’un
        dont le cri a été écouté et qui choisit de marcher devant Dieu. Le
        Psaume 139 affirme que nul lieu, nulle nuit et aucune part de soi ne sont
        hors de sa connaissance, puis transforme cette vérité en demande libre :
        être sondé et conduit.

        Dans une réception chrétienne, un nouveau baptisé peut y reconnaître
        que venir au Christ ne consiste pas à devenir présentable avant de
        s’approcher. Il peut parler vrai, recevoir la miséricorde et apprendre à
        répondre dans l’alliance. Cette lecture chrétienne éclaire le mouvement
        des psaumes; elle n’est pas une citation littérale du baptême ou de
        Jésus-Christ dans ces passages.

        Pour la vie, être entièrement connu de Dieu ne signifie donc pas être
        exposé pour être humilié. Cela peut devenir la sécurité de ne plus prier
        avec un masque et l’espérance qu’un chemin reste ouvert même après une
        faute, une longue absence ou une prière sans sensation immédiate.

        CE QUI RISQUE D’ÊTRE MAL COMPRIS OU VÉCU COMME UN TEST D’APPARTENANCE

        Les expressions « ceux qui le craignent », « gardent son alliance » ou
        « marchent devant l’Éternel » pourraient être utilisées comme si Dieu
        n’écoutait que les personnes déjà fortes, régulières ou irréprochables.
        Ce serait trahir l’ensemble retenu : le cri vient justement d’un être
        abattu, Dieu connaît notre fragilité et la fidélité apparaît comme une
        réponse au secours reçu, non comme le prix à payer pour mériter son
        attention.

        La connaissance divine du Psaume 139 peut aussi être vécue comme une
        surveillance menaçante, et les paroles de guérison ou de délivrance
        comme une promesse de résultat immédiat. Le texte n’autorise ni à mesurer
        l’appartenance d’une personne à son soulagement visible, ni à conclure
        qu’une souffrance persistante prouve un manque de foi. La compassion
        n’efface pas repentance, réparation, commandements ou alliance; elle
        exclut la honte et la peur comme moyens de forcer le retour.

        UN PREMIER PAS RÉALISTE, SANS HONTE NI PERFORMANCE

        Lire lentement Psaume 139:23-24, puis dire à Dieu une seule phrase vraie
        que l’on aurait préféré cacher : une peur, une faute, une colère ou un
        besoin. Ajouter simplement : « Montre-moi un pas juste et conduis-moi. »
        Ce pas peut être demander de l’aide, réparer une chose précise, tenir une
        parole aujourd’hui ou seulement reprendre contact avec une personne de
        confiance. Il n’est pas nécessaire de produire une émotion, une réponse
        spectaculaire ou une longue prière pour que cette démarche soit réelle.

        UNE QUESTION QU’UN NOUVEAU BAPTISÉ POURRAIT ENCORE POSER

        Si Dieu me connaît déjà entièrement, pourquoi ai-je encore besoin de lui
        parler — et comment continuer à lui faire confiance lorsque je prie sans
        ressentir tout de suite sa réponse ?
    quiz:
      owner: expedition-fast-quiz
      revision: 1
      status: complete
      production: |-
        INTENTION DU QUIZ

        Faire reconnaître un Dieu auquel la détresse peut être dite sans masque :
        il ne dédaigne pas la prière du démuni, se souvient de notre fragilité,
        entend les supplications et demeure présent jusque dans la nuit. Conduire
        ensuite le joueur vers une réponse libre : revenir, remercier, demander de
        l’aide et consentir à être sondé puis conduit par Dieu.

        DISTINCTIONS DE VÉRITÉ

        - Texte : les questions 1, 3, 4, 6, 7 et 9 vérifient des paroles présentes
          dans Psaume 102:18, Psaume 103:10,14, Psaume 116:1-2,12-17 et
          Psaume 139:11-12.
        - Application : les questions 2, 5, 8 et 10 proposent un discernement pour
          la vie depuis Psaume 102:1-3, Psaume 103:12-18, Psaume 116:3-9 et
          Psaume 139:23-24. Leur retour les nomme comme applications.
        - La prière ne remplace ni les soins ni l’aide concrète. Le pardon ouvre
          un retour et une réparation; il n’est ni une permission d’ignorer le mal
          ni une garantie de soulagement immédiat.
        - La connaissance divine n’est présentée ni comme humiliation ni comme
          approbation automatique : le psalmiste demande d’être examiné et conduit.

        ARCHITECTURE

        - 6 questions de type texte et 4 questions de type vie.
        - 7 QCM et 3 vrai/faux.
        - Les trois vrai/faux portent sur des affirmations directement jugeables :
          Dieu ne traite pas selon les péchés, le psalmiste invoquera Dieu toute sa
          vie, et la prière n’interdit pas de demander des soins.
        - Les bonnes réponses sont réparties : q01=c, q02=b, q03=b, q04=d,
          q05=a, q06=a, q07=c, q08=b, q09=d, q10=c.

        QUESTIONS STRUCTURÉES

        1. [texte · qcm · Psaume 102:18] À quelle prière l’Éternel est-il
           attentif ? Réponse : À celle de la personne dans le dénuement. Le verset
           affirme qu’il ne dédaigne pas sa prière.
        2. [vie · qcm · Psaume 102:1-3] Quand la détresse m’épuise, quel
           premier pas respecte ce psaume ? Réponse : Dire ma plainte à Dieu et
           chercher une aide sûre. Cette application garde ensemble prière honnête
           et aide concrète.
        3. [texte · vrai_faux · Psaume 103:10] Dieu nous traite selon nos
           péchés et nous punit selon nos fautes. Réponse : Faux. Le verset affirme
           précisément le contraire.
        4. [texte · qcm · Psaume 103:14] De quoi l’Éternel se souvient-il à
           notre sujet ? Réponse : Que nous sommes poussière. Sa compassion rejoint
           une fragilité qu’il connaît.
        5. [vie · qcm · Psaume 103:12-18] Quelle réponse accueille à la fois
           le pardon et l’alliance ? Réponse : Revenir à Dieu et réparer ce qui peut
           l’être. Cette application reçoit la miséricorde sans effacer les
           commandements ni la réparation.
        6. [texte · vrai_faux · Psaume 116:1-2] Parce que Dieu a entendu sa
           voix, le psalmiste dit qu’il l’invoquera toute sa vie. Réponse : Vrai.
           L’écoute reçue ouvre une relation qui continue.
        7. [texte · qcm · Psaume 116:12-17] Quelle réponse le psalmiste
           offre-t-il pour les bienfaits reçus ? Réponse : Un sacrifice d’actions
           de grâces. Il invoque aussi Dieu et accomplit ses vœux.
        8. [vie · vrai_faux · Psaume 116:3-9] Prier dans la détresse interdit
           de demander des soins ou de l’aide. Réponse : Faux. C’est une limite
           d’application : le psaume invite à crier vers Dieu sans remplacer l’aide
           humaine nécessaire.
        9. [texte · qcm · Psaume 139:11-12] Que devient la nuit devant Dieu ?
           Réponse : Elle brille comme le jour. Aucune obscurité ne met le psalmiste
           hors de sa présence.
        10. [vie · qcm · Psaume 139:23-24] Si Dieu me connaît déjà, pourquoi
            lui parler vrai ? Réponse : Pour lui demander de m’examiner et de me
            conduire. Cette application transforme le fait d’être connu en prière
            libre de transformation.
    voix:
      owner: expedition-fast-voix
      revision: 1
      status: complete
      production: |-
        SOURCE ET INVARIANTS

        Les dix questions de fast.result.quiz ont été relues avec le texte source
        et les productions intégrales de l’Influenceur, du Mystique et du Nouveau
        baptisé. La révision humaine est 0 et le Quiz a traité cette même révision.
        Les IDs, types, formats, références, identifiants et sens des choix,
        bonnes réponses, faits testés et limites pastorales restent inchangés.

        INTENTION DE PLATEAU

        Le joueur entend une progression simple : sa détresse peut être dite,
        Dieu ne dédaigne pas sa prière, se souvient de sa fragilité, accueille
        une réponse libre et demeure présent jusque dans la nuit. Les questions
        de vie gardent ensemble prière, aide concrète, retour, réparation et
        désir d’être conduit, sans promettre un soulagement immédiat.

        LECTURE ORALE

        Les dix séquences prompt, choix et feedback ont été prononcées dans
        l’ordre joueur. Chaque prompt porte une seule attente, chaque choix se
        comprend en moins de deux secondes et chaque révélation peut suivre une
        réponse juste ou fausse sans félicitation, reproche, jargon éditorial ni
        vocabulaire du Conseil.

        CONTRÔLE DE COPIE

        Les prompts mesurent 59, 58, 59, 54, 63, 61, 63, 64, 49 et 55
        graphèmes. Le plus long choix mesure 32 graphèmes. Les feedbacks mesurent
        84, 108, 105, 106, 105, 97, 91, 109, 91 et 112 graphèmes. Les limites
        72/32/120 passent. Les trois vrai/faux gardent exactement Vrai et Faux;
        les sept QCM gardent quatre choix et la même identité de réponse juste.

        PREUVE DE SURFACE

        La feuille Street réelle 390 × 667 a exécuté les dix formulations comme
        de vraies QuizDefinition::Question dans un catalogue isolé, restauré en
        teardown. Pour chaque question, le kicker a affiché exactement
        question.scripture.cite, une mauvaise réponse a été soumise par
        l’interface réelle, puis l’unique bonne ligne et le feedback exact ont
        été contrôlés. Les vingt états demande/révélation ne présentent ni
        clipping, ni troncature, ni défilement des réponses, ni erreur console
        sévère. Les lettres justes observées et les assertions sont consignées
        dans fast.result.voix.render_evidence.
    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 1
      status: complete
      production: |-
        SOURCES RÉSOLUES

        Les dix références du quiz final ont été relues dans les quatre textes
        officiels attachés au dossier. Elles sont dédupliquées dans la bibliothèque
        de sources, avec séparation du texte, de l'interprétation et de
        l'application. Aucun concept ne repose sur le seul libellé d'une question.

        DIRECTION DU LOT

        Le lot va du cri isolé à une confiance qui agit : être entendu, oser
        demander de l'aide, recevoir une compassion qui connaît la fragilité,
        revenir et réparer, persévérer dans la prière, remercier publiquement,
        accepter des soins, traverser la nuit et demander à être conduit.
        Le réalisme cinématographique domine pour rendre les décisions humaines
        immédiates; trois illustrations bibliques assument la poésie des psaumes
        et leur monde cultuel sans prétendre reconstituer un événement précis.

        ARBITRAGE VISUEL

        Chaque unité a comparé une image classique à une alternative
        dramaturgique. Les symboles universels sont gardés lorsqu'ils lisent mieux;
        les scènes humaines gagnent lorsqu'un geste montre la vérité sans texte.
        La beauté vient de présences actives, de matières riches, de relations et
        de lumière, jamais d'une accumulation de visages tristes ou épuisés.

        GARDE-FOUS

        Dieu n'est jamais personnifié. La lumière ne garantit ni délivrance ni
        guérison immédiate. Prière et aide compétente restent ensemble. Le pardon
        appelle retour et réparation sans humiliation. Le sacrifice d'actions de
        grâces répond librement aux bienfaits; il ne les achète pas. Être connu
        devient consentement à l'examen et à la conduite, jamais surveillance.
    direction_artistique:
      owner: expedition-fast-directeur-artistique-producteur
      revision: 12
      status: complete
      history:
        - revision: 8
          status: complete
          production: |-
            SÉLECTION

            La preuve q07 est retenue parce qu'elle condense l'identité du pack en une seule action immédiatement lisible : gratitude reçue, offrande libre, engagement public, beauté biblique et communauté en fête. La scène permet de tester le sacrifice du cœur sans souffrance automatique ni transaction.

            PRODUCTION

            Un unique master natif 9:16 a été produit par ImageGen intégré, sans référence importée, variante, edit, upscale, crop automatique, autre ratio ni autre concept. Le prompt exact et la sortie sont consignés dans fast.result.visual_production.

            INSPECTION

            Le psalmiste, la coupe levée, le geste d'offrande et les témoins se lisent au premier regard. La joie, les matières riches et la lumière servent une reconnaissance déjà reçue; aucune violence animale, dette envers Dieu, inscription ou reconstruction rituelle affirmée n'apparaît. La zone basse reste calme et continue pour l'interface.

            SURFACE

            L'image a été éprouvée dans la vraie surface Street 390 × 667 avec la copie française finale. Le kicker affiche Psaume 116:12-17, les quatre choix sont complets, la bonne réponse est rendue en A dans l'ordre affiché c, a, b, d, et aucun débordement ou rognage n'a été observé.

            ARRÊT

            La preuve attend maintenant la Critique des deux secondes. Aucun lot, traduction, branchement runtime ou travail sur un autre pack n'est lancé.
      production: |-
        AUTORISATION

        La décision humaine r11 couvre les dix concepts `quiz_question` au seul ratio natif 9:16. La preuve q07 approuvée est réutilisée strictement; q01–q06 et q08–q10 ont reçu chacun exactement un appel ImageGen intégré, soit neuf nouveaux appels, sans variante, edit, upscale, second ratio, traduction ni autre surface.

        INSPECTION DES MASTERS

        Les dix masters existent à 941 × 1672 et ont été réellement regardés. Les scènes conservent leur geste principal, leur traitement, leurs matières, leur dignité et une zone basse utilisable. q03, q04, q07 et q09 emploient l'illustration biblique; les autres le réalisme cinématographique. q01 dépasse visuellement le compte indicatif de neuf personnes dans la procession, mais maintient clairement la femme digne, le contraste social et l'absence de réponse lumineuse magique; cette divergence reste exposée au jugement humain plutôt que masquée. Aucune référence identifiable à un temple contemporain n'a été utilisée.

        SURFACE STREET

        Un catalogue de test isolé a construit dix vraies `QuizDefinition::Question` avec chaque image finale et `question.scripture.cite`. Sur Street 390 × 667, vingt captures ask/reveal ont été produites en soumettant une mauvaise réponse réelle. L'image, le kicker scripturaire exact, la copie finale, l'ordre affiché, la lettre correcte, le texte de la bonne réponse et le feedback ont été contrôlés. Le test rend 1 exécution, 1189 assertions, zéro échec et zéro erreur; aucune feuille, ligne ou réponse ne déborde ni ne se tronque.

        ARRÊT

        Les dix unités attendent maintenant la validation humaine française. Rien n'est relié au catalogue runtime; les traductions restent bloquées et aucun travail ne commence sur pack-04.
    critique_deux_secondes:
      owner: expedition-fast-critique-deux-secondes
      revision: 9
      status: complete
      production: |-
        LECTURE FROIDE — IMAGE SEULE

        Le regard rencontre d’abord l’homme en indigo, son visage joyeux et la coupe ciselée levée dans la lumière. En moins de deux secondes, une communauté biblique célèbre publiquement au milieu du grain, de l’huile, de la musique, des fleurs et d’étoffes somptueuses. La question spontanée est : « Quel bienfait célèbre-t-il, et pourquoi montre-t-il cette coupe à tous ? » Décision probable : arrêter le scroll.

        LECTURE FROIDE — SURFACE STREET 390 × 667

        Le visage, la coupe et les témoins restent nettement au-dessus de la feuille Quiz. L’anneau tenu par la seconde main et l’offrande de grain et d’huile demeurent visibles à la limite supérieure de la feuille; le cadrage ne réduit donc pas la scène à un toast. Le kicker, la question et les quatre choix restent lisibles sans rognage ni concurrence avec le foyer visuel. Le PNG inspecté est bien en 390 × 667 et correspond au rendu décrit, mais son SHA actuel `0da62c4d87dd7e1197ced287ff0041374f9d43a0a2339392ccfed4524983427f` diffère du SHA `8059686b37c5d4b16d822cc055b72a0bcdab4f27827a983b45ad57e47efd30c3` consigné par le Producteur; cette divergence de traçabilité doit être réconciliée avant archivage sans altérer la lecture visuelle.

        CONTRÔLE DE FIDÉLITÉ

        Le concept demande une reconnaissance publique en réponse à des bienfaits déjà reçus. La coupe, l’offrande, l’anneau précieux, les musiciens et les familles rendent ensemble cette réponse libre. Le traitement reste une illustration biblique assumée, Celestial Light, riche et digne. Aucun paiement envers Dieu, triomphe militaire, sacrifice animal, inscription ou rite historique identifiable n’est affirmé.

        VERDICT

        PASS. Les dix gates passent, y compris la lecture en deux secondes, la survie dans Street et la fidélité. Ce verdict ouvre seulement `visual_proof_approval`; il n’approuve aucun lot et ne déclenche aucune génération, traduction ou publication.
    localisateur_voix:
      owner: expedition-fast-localisateur-voix
      revision: 15
      status: complete_awaiting_human_validation
      production: |-
        GATE D’ENTRÉE

        La copie française approuvée en révision 13 contient exactement dix questions et ses dix unités sont approuvées. `fast.translation_gate.translation_authorized` vaut true et vise cette même révision. Les dix images françaises approuvées ont été réutilisées à l’identique, sans génération, retouche, variante ni texte incrusté.

