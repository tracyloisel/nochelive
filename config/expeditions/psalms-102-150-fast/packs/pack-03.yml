    influenceur:
      opening_screen: "Et si Dieu te connaissait entièrement sans chercher à t'humilier ?"
      human_angle: "Quelqu’un qui cache sa détresse ou sa faute par peur d’être rejeté découvre qu’il peut parler vrai devant Dieu, recevoir sa compassion et lui demander d’être conduit."
      spoken_script: "Tu as peut-être déjà voulu prier, puis tu t'es arrêté : « S'il savait vraiment ce qu'il y a en moi, est-ce qu'il me rejetterait ? » Ces psaumes osent répondre sans maquiller la vie. L'un crie depuis la solitude. Un autre se rappelle que Dieu sait que nous sommes poussière et qu'il éloigne nos fautes. Un autre dit : « Il entend ma voix. » Et le dernier ne cherche plus à fuir : « Sonde-moi, connais mon cœur et conduis-moi. » Être connu par Dieu n'est pas être exposé pour être écrasé. C'est pouvoir venir vrai, recevoir sa compassion et recommencer à marcher avec lui."
      closing_question: "Qu'aurais-tu envie de dire à Dieu si tu étais sûr d'être entendu sans être rejeté ?"
      simplification_risks:
        - "Faire de la connaissance divine une surveillance menaçante ou une approbation automatique."
        - "Présenter guérison, délivrance ou conduite comme des garanties immédiates."
        - "Effacer repentir et alliance, ou légitimer la haine à partir de Psaume 139:19-22."
    mystique:
      thesis: "Sous le regard du Dieu qui entend, se souvient, pardonne et connaît, la prière conduit de la détresse dite sans masque au consentement d'être relevé, repris et conduit sur sa voie."
      inner_movement:
        - references: ["Psaume 102:1-12", "Psaume 102:18-22"]
          passage: "Déverser la plainte sans la corriger : le corps épuisé, la solitude et les larmes sont dits à Dieu, qui ne dédaigne pas le démuni et écoute les captifs."
        - references: ["Psaume 103:1-18"]
          passage: "Se souvenir de la compassion au cœur de la fragilité : pardon, relèvement et bonté rejoignent l'être humain que Dieu sait poussière, sans effacer l'alliance."
        - references: ["Psaume 116:1-19"]
          passage: "Passer du secours reçu à une réponse offerte : l'oreille penchée de Dieu ouvre le repos, la marche parmi les vivants, la gratitude et la fidélité."
        - references: ["Psaume 139:1-18", "Psaume 139:23-24"]
          passage: "Cesser de fuir le regard qui peut conduire : être entièrement connu devient le consentement libre à être sondé, corrigé et mené sur la voie de l'éternité."
      spiritual_practice: "Pendant sept minutes : dire une détresse réelle, se souvenir d'un bienfait, choisir une petite réponse libre pour la journée, puis lire Psaume 139:23-24 et demander à Dieu de montrer ce qui doit changer et de conduire, sans considérer l'absence de paix immédiate comme un échec."
      limits:
        - "Ne pas spiritualiser la détresse corporelle, sociale ou historique, ni substituer la prière aux soins, à la protection ou à l'aide concrète."
        - "Ne pas faire des délivrances ou guérisons une garantie immédiate, ni juger la foi de la personne dont l'épreuve continue."
        - "Ne pas transformer la connaissance divine en surveillance humiliante ou en approbation automatique; Psaume 139:23-24 demande examen, correction et conduite."
        - "Ne pas effacer repentance, réparation, commandements ou alliance au nom du pardon; ne pas employer la honte pour forcer un retour."
        - "Ne pas utiliser Psaume 139:19-22 pour autoriser haine, persécution ou vengeance; la pratique proposée revient à l'examen de son propre cœur aux versets 23-24."
        - "Présenter la rencontre avec Jésus-Christ comme réception chrétienne du mouvement des psaumes, jamais comme leur citation littérale."
    nouveau_baptise:
      good_news: "Ces psaumes accueillent une parole sans masque : Dieu entend le démuni, connaît notre fragilité, offre compassion et pardon, et permet que le fait d’être connu devienne une demande libre d’être conduit. Dans une réception chrétienne, venir au Christ n’exige pas de se rendre présentable avant de s’approcher."
      belonging_risk: "Ne pas faire de la crainte de Dieu, de l’alliance ou de la marche fidèle un filtre réservant son écoute aux personnes irréprochables; ne pas transformer sa connaissance en surveillance, ni guérison et délivrance en garanties immédiates. La compassion ouvre repentance et réparation sans employer la honte."
      first_step: "Lire Psaume 139:23-24, dire à Dieu une seule phrase vraie que l’on aurait préféré cacher, puis demander un pas juste pour aujourd’hui — aide, réparation, parole tenue ou reprise de contact — sans exiger une émotion ou une réponse immédiate."
      open_question: "Si Dieu me connaît déjà entièrement, pourquoi ai-je encore besoin de lui parler — et comment continuer à lui faire confiance lorsque je prie sans ressentir tout de suite sa réponse ?"
