        status: technical_pass_awaiting_human_validation
        source_locale: fr
        source_approval_revision: 13
        localized_pack_title: Él te escucha y te conoce
        official_localized_readings:
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=spa
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/103?lang=spa
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/116?lang=spa
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=spa
        questions:
        - id: fast-psalms-pack03-q01
          type: texte
          format: qcm
          reference: Psaume 102:18
          prompt: En el salmo, ¿a qué oración presta atención Dios?
          choices:
          - id: a
            text: La oración de los reyes
          - id: b
            text: La oración de siervos de Sion
          - id: c
            text: La oración del desamparado
          - id: d
            text: La oración de los ángeles
          correct_choice: c
          feedback: 'Dios no desprecia al desamparado: escucha su oración aun en su mayor necesidad.'
        - id: fast-psalms-pack03-q02
          type: vie
          format: qcm
          reference: Psaume 102:1-3
          prompt: La angustia te agota. ¿Qué primer paso sigue el salmo?
          choices:
          - id: a
            text: Esperar a ser fuerte para orar
          - id: b
            text: Orar y luego pedir ayuda
          - id: c
            text: Ocultar mi dolor a todos
          - id: d
            text: Prometer que todo pasará pronto
          correct_choice: b
          feedback: El salmo abre una oración sin máscaras. Contarle tu angustia a Dios no impide buscar ayuda concreta.
        - id: fast-psalms-pack03-q03
          type: texte
          format: vrai_faux
          reference: Psaume 103:10
          prompt: 'Cierto o falso: Dios nos castiga exactamente según nuestras faltas.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'El salmo dice lo contrario: Dios no nos trata según nuestros pecados ni nos paga según nuestras iniquidades.'
        - id: fast-psalms-pack03-q04
          type: texte
          format: qcm
          reference: Psaume 103:14
          prompt: Dios conoce nuestra fragilidad. ¿De qué se acuerda?
          choices:
          - id: a
            text: Somos reyes
          - id: b
            text: No tenemos debilidades
          - id: c
            text: Somos ángeles
          - id: d
            text: Somos polvo
          correct_choice: d
          feedback: Dios se acuerda de que somos polvo. Su compasión alcanza nuestra fragilidad; no la desprecia.
        - id: fast-psalms-pack03-q05
          type: vie
          format: qcm
          reference: Psaume 103:12-18
          prompt: El perdón nos mueve a responder. ¿Qué respuesta honra el convenio?
          choices:
          - id: a
            text: Volver a Dios y reparar
          - id: b
            text: 'Negar el mal: Dios perdona'
          - id: c
            text: Esperar a ser irreprochable
          - id: d
            text: Medir la fe de los demás
          correct_choice: a
          feedback: 'La misericordia abre el camino de regreso: nos permite volver a Dios y reparar lo que sea posible.'
        - id: fast-psalms-pack03-q06
          type: texte
          format: vrai_faux
          reference: Psaume 116:1-2
          prompt: 'Cierto o falso: Dios oyó al salmista, que lo invocará siempre.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: a
          feedback: Dios oyó su voz e inclinó su oído. El salmista responde con una confianza que perdura.
        - id: fast-psalms-pack03-q07
          type: texte
          format: qcm
          reference: Psaume 116:12-17
          prompt: Dios le dio tantos bienes. ¿Qué ofrece el salmista a cambio?
          choices:
          - id: a
            text: Silencio lejos del pueblo
          - id: b
            text: La promesa de no sufrir más
          - id: c
            text: Un sacrificio de gratitud
          - id: d
            text: Una victoria sobre sus enemigos
          correct_choice: c
          feedback: Ofrece un sacrificio de gratitud, invoca a Dios y cumple sus votos ante el pueblo.
        - id: fast-psalms-pack03-q08
          type: vie
          format: vrai_faux
          reference: Psaume 116:3-9
          prompt: 'Cierto o falso: orar impide pedir atención médica o ayuda.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: La oración no sustituye la atención médica ni la ayuda necesaria. Puedes invocar a Dios y pedir apoyo concreto.
        - id: fast-psalms-pack03-q09
          type: texte
          format: qcm
          reference: Psaume 139:11-12
          prompt: Ante Dios, ¿qué pasa con la noche más oscura?
          choices:
          - id: a
            text: Oculta toda palabra
          - id: b
            text: Detiene su mano
          - id: c
            text: Aleja su espíritu
          - id: d
            text: Brilla como el día
          correct_choice: d
          feedback: Ante Dios, la noche resplandece como el día. Ni las tinieblas son oscuras para él.
        - id: fast-psalms-pack03-q10
          type: vie
          format: qcm
          reference: Psaume 139:23-24
          prompt: Dios ya te conoce. ¿Por qué hablarle con sinceridad?
          choices:
          - id: a
            text: Enseñarle lo que no sabe
          - id: b
            text: Evitar cuestionarme
          - id: c
            text: Pedir que me examine y me guíe
          - id: d
            text: Recibir una respuesta inmediata
          correct_choice: c
          feedback: 'El salmista elige abrirse: «Escudríñame» y «guíame». Ser conocido se convierte en una oración para cambiar.'
        question_audits:
