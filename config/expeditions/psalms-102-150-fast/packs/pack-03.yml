      en:
        status: technical_pass_awaiting_human_validation
        source_locale: fr
        source_approval_revision: 13
        localized_pack_title: He Hears and Knows You
        official_localized_readings:
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/103?lang=eng
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/116?lang=eng
        - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=eng
        questions:
        - id: fast-psalms-pack03-q01
          type: texte
          format: qcm
          reference: Psaume 102:18
          prompt: In the psalm, whose prayer does God pay attention to?
          choices:
          - id: a
            text: The prayer of kings
          - id: b
            text: Zion’s servants at prayer
          - id: c
            text: The prayer of someone in need
          - id: d
            text: The prayer of angels
          correct_choice: c
          feedback: God does not dismiss someone in need; he hears their prayer, even in the deepest need.
        - id: fast-psalms-pack03-q02
          type: vie
          format: qcm
          reference: Psaume 102:1-3
          prompt: Distress wears you down. What first step fits this psalm?
          choices:
          - id: a
            text: Wait until I’m strong to pray
          - id: b
            text: Pray, then ask for help
          - id: c
            text: Hide my pain from everyone
          - id: d
            text: Promise it will pass quickly
          correct_choice: b
          feedback: The psalm opens an honest prayer. Telling God your distress does not keep you from seeking practical help.
        - id: fast-psalms-pack03-q03
          type: texte
          format: vrai_faux
          reference: Psaume 103:10
          prompt: 'True or false: God punishes us exactly as our sins deserve.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: 'The psalm says the opposite: God does not deal with us according to our sins or repay us for our wrongs.'
        - id: fast-psalms-pack03-q04
          type: texte
          format: qcm
          reference: Psaume 103:14
          prompt: God knows our weakness. What does he remember?
          choices:
          - id: a
            text: We are kings
          - id: b
            text: Nothing can weaken us
          - id: c
            text: We are angels
          - id: d
            text: We are dust
          correct_choice: d
          feedback: God remembers that we are dust. His compassion meets our weakness; it does not despise it.
        - id: fast-psalms-pack03-q05
          type: vie
          format: qcm
          reference: Psaume 103:12-18
          prompt: Forgiveness invites a response. Which one also honors the covenant?
          choices:
          - id: a
            text: Return to God and make amends
          - id: b
            text: 'Deny the harm: God forgives'
          - id: c
            text: Wait until I am blameless
          - id: d
            text: Judge everyone else’s faith
          correct_choice: a
          feedback: Mercy opens the way back. It lets us return to God and make amends where we can.
        - id: fast-psalms-pack03-q06
          type: texte
          format: vrai_faux
          reference: Psaume 116:1-2
          prompt: 'True or false: God heard him, so he’ll call on God all his life.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
