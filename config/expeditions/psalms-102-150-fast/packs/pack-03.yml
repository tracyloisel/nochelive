          reference: Psaume 102:18
          prompt: No salmo, a que oração Deus dá atenção?
          choices:
          - id: a
            text: À oração dos reis
          - id: b
            text: À oração dos servos de Sião
          - id: c
            text: À oração do desamparado
          - id: d
            text: À oração dos anjos
          correct_choice: c
          feedback: 'Deus não despreza o desamparado: ouve sua oração mesmo em meio à maior necessidade.'
        - id: fast-psalms-pack03-q02
          type: vie
          format: qcm
          reference: Psaume 102:1-3
          prompt: A angústia esgota você. Qual primeiro passo combina com o salmo?
          choices:
          - id: a
            text: Esperar ser forte para orar
          - id: b
            text: Orar e depois pedir ajuda
          - id: c
            text: Esconder minha dor de todos
          - id: d
            text: Prometer que tudo passará logo
          correct_choice: b
          feedback: O salmo abre uma oração sem máscaras. Contar sua angústia a Deus não impede buscar ajuda concreta.
        - id: fast-psalms-pack03-q03
          type: texte
          format: vrai_faux
          reference: Psaume 103:10
          prompt: 'Verdadeiro ou falso: Deus nos pune exatamente conforme nossas faltas.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'O salmo diz o contrário: Deus não nos trata segundo nossos pecados nem nos retribui segundo nossas iniquidades.'
        - id: fast-psalms-pack03-q04
          type: texte
          format: qcm
          reference: Psaume 103:14
          prompt: Deus conhece nossa fragilidade. Do que ele se lembra?
          choices:
          - id: a
            text: Somos reis
          - id: b
            text: Nada nos enfraquece
          - id: c
            text: Somos anjos
          - id: d
            text: Somos pó
          correct_choice: d
          feedback: Deus se lembra de que somos pó. Sua compaixão alcança nossa fragilidade; não a despreza.
        - id: fast-psalms-pack03-q05
          type: vie
          format: qcm
          reference: Psaume 103:12-18
          prompt: O perdão nos leva a responder. O que também honra o convênio?
          choices:
          - id: a
            text: Voltar a Deus e reparar
          - id: b
            text: 'Negar o mal: Deus perdoa'
          - id: c
            text: Esperar até ser irrepreensível
          - id: d
            text: Medir a fé dos outros
          correct_choice: a
          feedback: A misericórdia abre o caminho de volta. Ela permite voltar a Deus e reparar o que for possível.
        - id: fast-psalms-pack03-q06
          type: texte
          format: vrai_faux
          reference: Psaume 116:1-2
          prompt: 'Verdadeiro ou falso: Deus ouviu o salmista, que o invocará sempre.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: Deus ouviu sua voz e inclinou os ouvidos. O salmista responde com uma confiança duradoura.
        - id: fast-psalms-pack03-q07
          type: texte
          format: qcm
          reference: Psaume 116:12-17
          prompt: Deus lhe fez muito bem. O que o salmista oferece em resposta?
          choices:
          - id: a
            text: Silêncio longe do povo
          - id: b
            text: Prometer nunca mais sofrer
          - id: c
            text: Um sacrifício de gratidão
          - id: d
            text: Vitória sobre seus inimigos
          correct_choice: c
          feedback: Ele oferece um sacrifício de gratidão, invoca a Deus e cumpre seus votos diante do povo.
        - id: fast-psalms-pack03-q08
          type: vie
          format: vrai_faux
          reference: Psaume 116:3-9
          prompt: 'Verdadeiro ou falso: orar impede buscar cuidados médicos ou ajuda.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: A oração não substitui os cuidados médicos nem a ajuda necessária. Você pode invocar a Deus e pedir apoio concreto.
        - id: fast-psalms-pack03-q09
          type: texte
          format: qcm
          reference: Psaume 139:11-12
          prompt: Diante de Deus, o que acontece com a noite mais escura?
          choices:
          - id: a
            text: Ela esconde toda palavra
          - id: b
            text: Ela detém sua mão
          - id: c
            text: Ela afasta seu espírito
          - id: d
            text: Ela brilha como o dia
          correct_choice: d
          feedback: Diante de Deus, a noite resplandece como o dia. Nem as trevas são escuras para ele.
        - id: fast-psalms-pack03-q10
          type: vie
          format: qcm
          reference: Psaume 139:23-24
          prompt: Deus já conhece você. Por que falar com sinceridade?
          choices:
          - id: a
            text: Ensinar o que ele não sabe
          - id: b
            text: Evitar me examinar
          - id: c
            text: Pedir que me sonde e me guie
          - id: d
            text: Receber resposta imediata
          correct_choice: c
          feedback: 'O salmista escolhe se abrir: «Sonda-me» e «guia-me». Ser conhecido se torna uma oração para mudar.'
