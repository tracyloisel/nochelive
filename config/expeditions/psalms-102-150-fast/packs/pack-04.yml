        questions:
        - id: fast-psalms-pack04-q01
          type: texte
          format: qcm
          reference: Psaume 119:18
          prompt: What does the psalmist ask for to see the wonders of God's law?
          choices:
          - id: a
            text: Keep my enemies away
          - id: b
            text: Open my eyes
          - id: c
            text: Give me gold
          - id: d
            text: Hide your commands
          correct_choice: b
          feedback: He asks God to open his eyes so he can see the wonders in God's law.
        - id: fast-psalms-pack04-q02
          type: texte
          format: vrai_faux
          reference: Psaume 119:32
          prompt: 'True or false: God enlarges his heart, so he runs toward God''s commands.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: 'God enlarges his heart: the psalmist no longer drags his feet but runs in the way of God''s commands.'
        - id: fast-psalms-pack04-q03
          type: texte
          format: qcm
          reference: Psaume 119:45
          prompt: Why does the psalmist say he walks in freedom?
          choices:
          - id: a
            text: He owns every treasure
          - id: b
            text: He has no enemies left
          - id: c
            text: He seeks God's precepts
          - id: d
            text: Kings approve of him
          correct_choice: c
          feedback: His freedom grows from seeking God's precepts. He moves toward God's word instead of running from it.
        - id: fast-psalms-pack04-q04
          type: texte
          format: vrai_faux
          reference: Psaume 119:105
          prompt: 'True or false: God''s word lights each step like a lamp.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: 'A lamp for his feet, a light for his path: God''s word lights the next step.'
        - id: fast-psalms-pack04-q05
          type: texte
          format: qcm
          reference: Psaume 119:176
          prompt: At the end of Psalm 119, what image stays with you?
          choices:
          - id: a
            text: A watchman on his tower
          - id: b
            text: A traveler with no bags
          - id: c
            text: A sleeping servant
          - id: d
            text: A lost sheep
          correct_choice: d
          feedback: The psalmist knows he has strayed like a lost sheep and dares to ask God, “Seek your servant.”
        - id: fast-psalms-pack04-q06
          type: texte
          format: qcm
          reference: Psaume 138:3
          prompt: He calls on God. What does he receive in Psalm 138?
          choices:
          - id: a
            text: Praise before kings
          - id: b
            text: The whole road ahead
          - id: c
            text: An end to all distress
          - id: d
            text: An answer and new strength
          correct_choice: d
          feedback: God answers, reassures, and strengthens his soul. That answer helps him stand firm.
        - id: fast-psalms-pack04-q07
          type: vie
          format: vrai_faux
          reference: Psaume 119:176
          prompt: 'True or false: loving God''s word means never straying again.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: Psalm 119 ends with a lost sheep who still remembers God's commands and asks to be found.
        - id: fast-psalms-pack04-q08
          type: vie
          format: qcm
          reference: Psaume 119:33-35
          prompt: When moving forward is hard, which prayer rings true?
          choices:
          - id: a
            text: Teach me and guide me
          - id: b
            text: Spare me every decision
          - id: c
            text: Show me everything ahead
          - id: d
            text: Decide without teaching me
          correct_choice: a
          feedback: The psalmist asks God to teach him, give him understanding, and guide him on a path he loves.
        - id: fast-psalms-pack04-q09
          type: vie
          format: vrai_faux
          reference: Psaume 138:7
          prompt: 'True or false: if God strengthens you, distress is over.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: 'The psalm does not hide the trial: God gives life while the psalmist still walks through distress.'
        - id: fast-psalms-pack04-q10
          type: vie
          format: qcm
          reference: Psaume 119:176; Psaume 138:8
          prompt: You have strayed. What first step echoes these two psalms?
          choices:
          - id: a
            text: Wait until I feel worthy
          - id: b
            text: Hide it and carry on alone
          - id: c
            text: Seek me; do not abandon me
          - id: d
            text: Promise I will never fall again
          correct_choice: c
          feedback: 'These psalms open an honest prayer: “Seek me,” and “do not abandon the work of your hands.”'
