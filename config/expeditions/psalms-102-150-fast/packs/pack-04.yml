    critique_deux_secondes:
      owner: expedition-fast-critique-deux-secondes
      revision: 9
      status: complete
      production: |-
        LECTURE FROIDE — IMAGE SEULE

        Le regard rencontre d’abord la femme en manteau indigo, yeux fermés et main sur le cœur, puis les deux proches qui désignent des directions opposées. En moins de deux secondes, une personne suspend sa décision entre deux témoignages concurrents sur une route rurale. La question spontanée est : « Laquelle de ces voix écoutera-t-elle ? » Décision probable : arrêter le scroll.

        LECTURE FROIDE — SURFACE STREET ASK 390 × 667

        Les trois visages, la main recueillie, le carnet baissé et les deux bras opposés restent nettement visibles au-dessus de la feuille Quiz. Le chrome coupe seulement le bas des silhouettes et la route calme; il ne masque ni le conflit ni le geste intérieur. Le kicker, la question et les quatre choix sont complets, contrastés et lisibles.

        CONTRÔLE DE FIDÉLITÉ

        Le concept demande une enquêtrice qui prie avant d’agir face à deux témoignages plausibles et contradictoires. L’image livre exactement cette tension sans boussole littérale, témoin caricatural, indice magique ni direction désignée comme vraie. Le réalisme cinématographique, la lumière automnale et les vêtements structurés donnent une scène digne, contemporaine et immédiatement Noche Live.

        VERDICT

        PASS. Les dix gates passent, notamment lecture en deux secondes, survie dans Street et fidélité. Ce verdict ouvre uniquement `visual_proof_approval`; il n’est ni une décision humaine ni une autorisation de lot, de génération, de traduction ou de publication.
    localisateur_voix:
      owner: expedition-fast-localisateur-voix
      revision: 15
      status: complete_awaiting_human_validation
      production: |-
        GATE D’ENTRÉE

        La copie française approuvée en révision 13 contient exactement dix questions et ses dix unités sont approuvées. `fast.translation_gate.translation_authorized` vaut true et vise cette même révision. Les images françaises approuvées ont été réutilisées sans génération, retouche, variante ni texte incrusté.

        MÉTHODE

        L’espagnol, l’anglais et le portugais brésilien ont été localisés séparément depuis le français approuvé, sans langue relais. Pour chacune des trente séquences, les identifiants, types, formats, références, identifiants et sens des choix, `correct_choice`, fait testé et nuance pastorale sont conservés. Les séquences ont été lues à voix haute dans une voix de présentateur native; chaque choix reste saisissable en moins de deux secondes.

        PREUVE TECHNIQUE

        Chaque langue a été exécutée indépendamment comme dix vraies `QuizDefinition::Question` dans Street 390 × 667. Après mélange déterministe, une mauvaise réponse a été soumise; une seule ligne juste, le même identifiant source, le texte localisé exact et le feedback exact ont été vérifiés. Les trente asks et trente reveals ont été inspectés : aucune troncature, aucun clipping, aucun scroll de réponses et aucune erreur console sévère. Test : 3 runs, 4419 assertions, 0 failures, 0 errors.

