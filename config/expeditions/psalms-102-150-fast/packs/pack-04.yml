          application: "Une limite ou une discipline librement cherchée peut permettre un mouvement plus audacieux."
        ps119-105:
          reference: "Psaume 119:105"
          resolved_references: ["Psaume 119:105"]
          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=fra"
          retrieved_on: "2026-09-04"
          kind: scripture
          resolved_text: |-
            Ta parole est une lampe à mes pieds,
