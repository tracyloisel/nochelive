        questions:
        - id: fast-psalms-pack04-q01
          type: texte
          format: qcm
          reference: Psaume 119:18
          prompt: "¿Qué pide el salmista para ver las maravillas de la ley?"
          choices:
          - id: a
            text: Aleja a mis enemigos
          - id: b
            text: Abre mis ojos
          - id: c
            text: Dame oro
          - id: d
            text: Oculta tus mandamientos
          correct_choice: b
          feedback: Le pide a Dios que abra sus ojos para contemplar las maravillas de su ley.
        - id: fast-psalms-pack04-q02
          type: texte
          format: vrai_faux
          reference: Psaume 119:32
          prompt: 'Cierto o falso: Dios ensancha su corazón y corre a sus mandamientos.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: a
          feedback: 'Dios ensancha su corazón: el salmista deja de andar lento y corre por el camino de sus mandamientos.'
        - id: fast-psalms-pack04-q03
          type: texte
          format: qcm
          reference: Psaume 119:45
          prompt: "¿Por qué dice el salmista que camina en libertad?"
          choices:
          - id: a
            text: Tiene todos los tesoros
          - id: b
            text: Ya no tiene adversarios
          - id: c
            text: Busca los preceptos
          - id: d
            text: Los reyes lo aprueban
          correct_choice: c
          feedback: 'Su libertad nace de una búsqueda: va tras los preceptos de Dios; no huye de su palabra.'
        - id: fast-psalms-pack04-q04
          type: texte
          format: vrai_faux
          reference: Psaume 119:105
          prompt: 'Cierto o falso: la palabra de Dios alumbra los pasos como una lámpara.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: a
          feedback: 'Lámpara para los pies, luz para el camino: la palabra alumbra el próximo paso.'
        - id: fast-psalms-pack04-q05
          type: texte
          format: qcm
          reference: Psaume 119:176
          prompt: 'Último verso del Salmo 119: ¿qué imagen queda grabada?'
          choices:
          - id: a
            text: Un guardián en su torre
          - id: b
            text: Un viajero sin equipaje
          - id: c
            text: Un siervo dormido
          - id: d
            text: Una oveja perdida
          correct_choice: d
          feedback: 'El salmista se sabe perdido como una oveja y se atreve a pedirle a Dios: «Busca a tu siervo».'
        - id: fast-psalms-pack04-q06
          type: texte
          format: qcm
          reference: Psaume 138:3
          prompt: Invoca a Dios. ¿Qué recibe, según el Salmo 138?
          choices:
          - id: a
            text: Celebrar ante los reyes
          - id: b
            text: Todo el camino por delante
          - id: c
            text: El fin de toda angustia
          - id: d
            text: Respuesta y fortaleza
          correct_choice: d
          feedback: Dios lo escucha, lo alienta y fortalece su alma. Esa respuesta lo ayuda a mantenerse firme.
        - id: fast-psalms-pack04-q07
          type: vie
          format: vrai_faux
          reference: Psaume 119:176
          prompt: 'Cierto o falso: amar la palabra significa no perderse nunca más.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: El Salmo 119 termina con una oveja perdida que aún recuerda los mandamientos y pide que la busquen.
        - id: fast-psalms-pack04-q08
          type: vie
          format: qcm
          reference: Psaume 119:33-35
          prompt: Cuando cuesta avanzar, ¿qué oración te sale del corazón?
          choices:
          - id: a
            text: Enséñame y guíame
          - id: b
            text: Líbrame de toda decisión
          - id: c
            text: Muéstramelo todo de antemano
          - id: d
            text: Decide sin enseñarme
          correct_choice: a
          feedback: El salmista le pide a Dios que le enseñe, le dé entendimiento y lo guíe por un camino que ama.
        - id: fast-psalms-pack04-q09
          type: vie
          format: vrai_faux
          reference: Psaume 138:7
          prompt: 'Cierto o falso: si Dios te fortalece, ya no pasas por angustias.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'El salmo no oculta la prueba: Dios le da vida mientras el salmista aún camina en medio de la angustia.'
        - id: fast-psalms-pack04-q10
          type: vie
          format: qcm
          reference: Psaume 119:176; Psaume 138:8
          prompt: Te has perdido. ¿Qué primer paso refleja estos dos salmos?
          choices:
          - id: a
            text: Esperar a sentirme digno
          - id: b
            text: Ocultarlo y seguir solo
          - id: c
            text: Búscame, no me abandones
          - id: d
            text: Prometer no volver a caer
          correct_choice: c
          feedback: 'Estos salmos abren una oración sincera: «Búscame» y «no abandones la obra de tus manos».'
