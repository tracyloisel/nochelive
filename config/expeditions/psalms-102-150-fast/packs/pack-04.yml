        production: |-
          SÉLECTION

          La preuve q08 est retenue parce qu'elle rend immédiatement visible une
          décision sous témoignages contradictoires : deux personnes crédibles
          désignent des directions opposées tandis que l'enquêtrice suspend son
          geste et prie avant d'agir. Elle éprouve la tension du choix et le besoin
          d'être conduite sans recourir à l'embranchement littéral.

          PRODUCTION

          Un unique master natif 9:16 a été produit par ImageGen intégré, sans
