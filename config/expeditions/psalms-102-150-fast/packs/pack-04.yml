  agent_memory:
    influenceur:
      owner: expedition-fast-influenceur
      revision: 2
      status: complete
      production: |-
        ACCROCHE DE PREMIER ÉCRAN

        Tu ne tiens pas par la force. Et si la Parole t’apprenait à durer ?

        ANGLE HUMAIN UNIQUE

        Une personne veut marcher avec Dieu, mais ses écarts et ses reprises lui
        donnent l’impression que la foi est une performance réussie ou ratée. Elle
        découvre un priant qui aime la parole tout en demandant sans cesse d’être
        enseigné, soutenu, relevé et ramené, puis un Dieu qui fortifie l’âme au
        milieu de la détresse et n’abandonne pas l’œuvre commencée.

        CE QUE DISENT LES TEXTES

        Le Psaume 119 unit recherche de tout le cœur, choix de la vérité, joie,
        liberté et pratique des commandements à des demandes répétées de grâce,
        d’intelligence, de soutien et de vie. Sa dernière image reste celle d’une
        brebis errante que le Seigneur doit chercher. Le Psaume 138 témoigne d’une
        âme fortifiée lorsque Dieu répond; la marche continue pourtant au milieu
        de la détresse et se termine par la prière que Dieu n’abandonne pas l’œuvre
        de ses mains.

        RÉCEPTION ET APPLICATION

        Dans une réception chrétienne, cette marche peut devenir l’apprentissage
        durable d’un disciple auprès du Christ; ce lien relève de la réception et
        n’est pas une mention littérale de Jésus-Christ dans ces versets.
        L’application proposée est de recevoir une parole précise, de la mettre en
        pratique aujourd’hui et de revenir demander aide et grâce lorsqu’on s’égare.

        SCRIPT ORAL — 35 À 45 SECONDES

        Tu sais ce qui fatigue dans la foi ? Croire qu’il faut réussir pour
        mériter de rester avec Dieu. Le Psaume 119 ne ressemble pas à
        ça. Le croyant répète : « Enseigne-moi », « soutiens-moi », « rends-moi la
        vie ». Il choisit la parole, il tombe, il demande d’être relevé, et il
        termine encore comme une brebis perdue que Dieu doit chercher. Puis le
        Psaume 138 ajoute ceci : au milieu de la détresse,
        Dieu fortifie l’âme et n’abandonne pas ce qu’il a commencé. La foi qui
        dure, ce n’est pas ne jamais tomber. C’est revenir à la parole, recevoir
        la grâce et reprendre un pas avec Dieu.

        QUESTION FINALE

        Quelle parole de Dieu pourrais-tu mettre en pratique aujourd’hui pour
        reprendre la route avec lui ?

        TROIS RISQUES DE SIMPLIFICATION À TRANSMETTRE AU MYSTIQUE

        1. Transformer l’obéissance en monnaie qui mérite l’amour ou le secours de
           Dieu, alors que le priant demande grâce, intelligence, soutien et vie.
        2. Faire de la force reçue une garantie de disparition immédiate de la
           détresse; le Psaume 138 parle d’une marche au milieu d’elle et d’une
           œuvre encore confiée à Dieu.
        3. Réduire le Psaume 119 à une formule motivante sur la lampe et le chemin,
           en effaçant désir, vérité, commandements, égarement, retour et durée.
    mystique:
      owner: expedition-fast-mystique
      revision: 3
      status: complete
      production: |-
        PHRASE-THÈSE

        Dans une relation où Dieu enseigne et soutient, le priant reçoit la
        parole comme lumière et vérité, y répond de tout son cœur, puis revient
        demander grâce, vie et conduite chaque fois que la détresse ou
        l'égarement interrompent sa marche.

        MOUVEMENT INTÉRIEUR DU TEXTE

        1. DÉSIRER LA VOIE ET DEMANDER D'ÊTRE CONDUIT — Psaume 119:1-40

           Le texte commence par le bonheur de chercher Dieu de tout son cœur et
           de marcher selon sa loi, mais le priant ne transforme pas cet idéal en
           autosuffisance. Il demande : « Enseigne-moi », « donne-moi
           l'intelligence », « conduis-moi », « incline mon cœur » et « rends-moi
           la vie ». L'obéissance est un désir et une réponse rendue possible dans
           la relation avec Dieu, non une performance solitaire.

        2. RECEVOIR LA PAROLE COMME APPUI POUR LE PROCHAIN PAS —
           Psaume 119:41-112

           La parole est miséricorde, vérité, espérance, consolation, délice et
           lumière. Elle permet au priant de réfléchir à ses voies, de diriger ses
           pieds et de choisir la vérité jusque dans la misère, les railleries et
           les pièges. La lampe éclaire le sentier et appelle une pratique fidèle;
           elle ne livre pas d'avance une carte sans incertitude ni épreuve.

        3. PERSÉVÉRER EN DEMANDANT SECOURS, PUIS REVENIR ENCORE —
           Psaume 119:113-176

           L'amour de la loi demeure traversé par les supplications : «
           Soutiens-moi », « affermis mes pas », « délivre-moi » et « rends-moi la
           vie ». La détresse, l'angoisse et la persécution ne sont pas niées. Le
           dernier aveu, celui de la brebis perdue que Dieu doit chercher, empêche
           de confondre persévérance et perfection : la marche durable comprend le
           retour après l'égarement.

        4. CONFIER À DIEU L'ŒUVRE ENCORE INACHEVÉE — Psaume 138:1-8

           La célébration de tout le cœur naît de la bonté et de la fidélité de
           Dieu. Le priant témoigne que Dieu a répondu et fortifié son âme, mais il
           se voit encore marcher au milieu de la détresse. Sa confiance culmine
           dans une demande, non dans une possession : que le Dieu dont la bonté
           dure n'abandonne pas l'œuvre de ses mains.

        RÉCEPTION CHRÉTIENNE ET APPLICATION

        Dans une réception chrétienne, ce mouvement peut décrire la persévérance
        d'un disciple qui apprend auprès du Christ, reçoit la grâce et revient à
        lui après ses écarts. Cette lecture est une réception : ces psaumes
        s'adressent littéralement à l'Éternel et ne nomment pas Jésus-Christ dans
        les passages retenus. L'application proposée consiste à accueillir une
        parole précise, lui donner aujourd'hui une réponse observable et revenir
        demander secours lorsque la marche se défait.

        PRATIQUE SPIRITUELLE CONCRÈTE — UN VERSET, UN PAS, UN RETOUR

        Pendant sept jours, choisir chaque matin un verset du Psaume 119 et le
        reformuler en une demande adressée à Dieu : enseigne-moi, donne-moi
        l'intelligence, affermis mes pas ou rends-moi la vie. Noter un seul acte
        observable qui lui répond avant le soir. Le soir, relire la journée sans
        score : remercier pour le pas accompli ou, si l'on s'est égaré, reprendre
        Psaume 119:176 et demander à être cherché et ramené. Le septième jour,
        lire Psaume 138:3, 7-8, nommer la détresse encore réelle et confier à Dieu
        ce qui a besoin d'être fortifié et poursuivi.

        LIMITES POUR NE PAS SPIRITUALISER LA SOUFFRANCE NI TRAHIR LE TEXTE

        - L'amour des commandements reste une obéissance réelle, mais il ne
          devient ni monnaie pour mériter l'amour de Dieu, ni test permettant de
          classer la foi ou la dignité d'une personne.
        - La lampe sur le sentier promet une lumière pour marcher; elle ne garantit
          pas que toute décision sera immédiatement claire ni que le croyant ne
          tombera plus.
        - Les paroles sur l'humiliation ne permettent pas d'attribuer une maladie,
          un abus, une oppression ou un traumatisme à une correction voulue par
          Dieu. Elles ne commandent jamais de rester sans protection.
        - La paix de Psaume 119:165 et le secours de Psaume 138:7-8 ne deviennent
          pas une garantie automatique de sécurité, de guérison ou de victoire
          terrestre. Demander une aide médicale, psychologique, juridique,
          sociale ou pastorale peut faire partie du prochain pas fidèle.
        - L'image finale de la brebis errante ouvre une demande de recherche et de
          retour; elle n'autorise ni honte fabriquée, ni coercition religieuse, ni
          effacement de la responsabilité et de la réparation nécessaires.
    nouveau_baptise:
      owner: expedition-fast-nouveau-baptise
      revision: 4
      status: complete
      production: |-
        CE QUI PEUT ÊTRE REÇU COMME UNE BONNE NOUVELLE

        Je peux commencer ou recommencer à marcher avec Dieu sans savoir déjà
        tout comprendre ni réussir chaque pas. Le Psaume 119 fait entendre un
        croyant qui aime la parole et qui demande pourtant encore : «
        Enseigne-moi », « soutiens-moi », « affermis mes pas » et « cherche ton
        serviteur ». Même après l'égarement, la relation n'est pas présentée comme
        terminée : le priant peut appeler Dieu, recevoir une lumière pour le
        prochain pas et demander d'être ramené. Le Psaume 138 ajoute que Dieu
        fortifie l'âme au milieu de la détresse et que son œuvre peut lui être
        confiée comme une œuvre encore inachevée.

        Dans une réception chrétienne, une personne qui découvre l'Évangile,
        prépare son baptême ou revient à l'Église peut y reconnaître un chemin de
        disciple auprès de Jésus-Christ : accueillir sa parole, lui répondre dans
        l'alliance et revenir recevoir grâce et direction lorsque la marche se
        défait. Jésus-Christ et le baptême appartiennent ici à la réception
        chrétienne; ils ne sont pas nommés littéralement dans les versets retenus.

        CE QUI RISQUE D'ÊTRE MAL COMPRIS OU VÉCU COMME UN TEST D'APPARTENANCE

        Les expressions « de tout mon cœur », « garder ses commandements » ou
        « marcher selon sa loi » pourraient faire croire qu'il faut déjà être
        irréprochable, tout comprendre et ne plus rechuter pour être accueilli par
        Dieu ou avoir une place dans l'Église. Ce serait effacer les demandes
        répétées d'enseignement, de soutien, de miséricorde et de vie, ainsi que
        l'aveu final de la brebis perdue. Le score, la régularité visible, la
        vitesse du progrès ou une émotion spirituelle immédiate ne mesurent ni la
        valeur d'une personne ni la réalité de son appartenance.

        La paix et le secours ne signifient pas non plus qu'un baptême ou un
        retour à l'Église fera disparaître rapidement une dépendance, une maladie,
        un traumatisme, une situation dangereuse ou toute détresse. Chercher Dieu
        n'interdit jamais de demander les soins, la protection et l'aide humaine
        nécessaires.

        UN PREMIER PAS RÉALISTE, SANS HONTE NI PERFORMANCE

        Lire seulement Psaume 119:105 et 176, puis Psaume 138:3. Dire à Dieu, avec
        ses propres mots : « Voici le pas que je ne vois pas encore; enseigne-moi
        et viens me chercher. » Choisir ensuite un seul geste possible avant
        demain : lire dix minutes, poser une question à des missionnaires,
        reprendre contact avec une personne sûre dans l'Église, participer à une
        réunion ou commencer à réparer un tort. Ce geste n'achète ni l'amour de
        Dieu ni une place dans la communauté; il rend simplement possible un pas
        vrai dans sa direction.

        UNE QUESTION QU'UN NOUVEAU BAPTISÉ POURRAIT ENCORE POSER

        Si je m'égare ou retombe après mon baptême ou mon retour, comment puis-je
        revenir à Dieu et trouver de l'aide dans l'Église sans devoir faire
        semblant d'aller bien ?
    quiz:
      owner: expedition-fast-quiz
      revision: 5
      status: complete
      production: |-
        INTENTION DU QUIZ

        Faire découvrir que le Psaume 119 unit amour de la parole, obéissance
        désirée et demandes répétées d'enseignement, de soutien et de vie. Faire
        reconnaître que la marche peut continuer après l'égarement et au milieu
        de la détresse : la parole éclaire le prochain pas, tandis que le Psaume
        138 présente une âme rassurée et fortifiée qui confie encore à Dieu son
        œuvre inachevée.

        DISTINCTIONS DE VÉRITÉ

        - Texte : les questions 1 à 6 vérifient uniquement des paroles présentes
          dans Psaume 119:18, 32, 45, 105, 176 et Psaume 138:3.
        - Application : les questions 7 à 10 transposent les mouvements et limites
          déjà établis; leur retour les désigne comme applications et les rattache
          aux versets qui les soutiennent.
        - Réception : aucune question n'attribue littéralement aux psaumes une
          mention de Jésus-Christ, du baptême ou de l'Église.
        - Aucune promesse de perfection immédiate, de disparition de la détresse,
          de sécurité, de guérison ou de victoire terrestre n'est ajoutée.

        ARCHITECTURE

        - 6 questions de type texte et 4 questions de type vie.
        - 6 QCM et 4 vrai/faux.
        - Les vrai/faux portent sur quatre affirmations sans réserve cachée : la
          cause de la course au verset 32, l'image de la lampe au verset 105,
          l'égarement encore reconnu au verset 176 et la détresse encore traversée
          au Psaume 138:7.
        - Les bonnes réponses sont réparties : q01=b, q02=a, q03=c, q04=a,
          q05=d, q06=d, q07=b, q08=a, q09=b, q10=c.

        QUESTIONS STRUCTURÉES

        1. [texte · qcm · Psaume 119:18] Que demande le priant pour contempler
           les merveilles de la loi ? Réponse : Que Dieu ouvre ses yeux. Le
           verset demande à Dieu d'ouvrir les yeux du priant afin qu'il contemple
           les merveilles de sa loi.
        2. [texte · vrai_faux · Psaume 119:32] Le priant court dans la voie des
           commandements parce que Dieu élargit son cœur. Réponse : Vrai. Le
           verset relie directement sa course au cœur que Dieu élargit.
        3. [texte · qcm · Psaume 119:45] Pourquoi le priant dit-il marcher en
           toute liberté ? Réponse : Parce qu'il recherche les ordonnances. Le
           verset associe cette liberté à sa recherche des ordonnances de Dieu.
        4. [texte · vrai_faux · Psaume 119:105] La parole de Dieu est une lampe
           aux pieds et une lumière sur le sentier. Réponse : Vrai. C'est l'image
           donnée par le verset 105.
        5. [texte · qcm · Psaume 119:176] À quoi le priant se compare-t-il dans
           le dernier verset ? Réponse : À une brebis perdue. Il reconnaît son
           égarement et demande à Dieu de chercher son serviteur.
        6. [texte · qcm · Psaume 138:3] Que fait Dieu le jour où le priant
           l'invoque ? Réponse : Il l'exauce, le rassure et fortifie son âme. Le
           verset nomme ensemble la réponse, le réconfort et la force reçue.
        7. [vie · vrai_faux · Psaume 119:176] Aimer la parole exige d'avoir déjà
           cessé de s'égarer. Réponse : Faux. Application : le dernier verset
           garde ensemble la mémoire des commandements et l'aveu d'être perdu;
           demander à revenir fait partie de la marche.
        8. [vie · qcm · Psaume 119:33-35] Quand avancer devient difficile,
           quelle prière rejoint le mouvement du psaume ? Réponse : « Enseigne-moi
           et conduis-moi. » Application : ces versets demandent à Dieu
           enseignement, intelligence et conduite pour marcher dans une voie
           aimée.
        9. [vie · vrai_faux · Psaume 138:7] Être fortifié par Dieu signifie ne
           plus traverser de détresse. Réponse : Faux. Application : le psaume
           parle d'une vie reçue tout en marchant encore au milieu de la détresse.
        10. [vie · qcm · Psaume 119:176; Psaume 138:8] Après s'être égaré, quelle
            démarche correspond le mieux à ces psaumes ? Réponse : Demander à
            Dieu : « Cherche-moi et ne m'abandonne pas. » Application : les deux
            fins permettent de demander à être recherché et de confier à Dieu
            l'œuvre encore inachevée.
    voix:
      owner: expedition-fast-voix
      revision: 6
      status: complete
      production: |-
        SOURCE ET INVARIANTS

        Les dix questions de fast.result.quiz ont été relues avec Psaumes 119 et
        138 et les productions intégrales de l'Influenceur, du Mystique et du
        Nouveau baptisé. Les IDs, types, formats, références, identifiants et sens
        des choix, correct_choice, faits testés et limites pastorales sont
        conservés. La révision humaine est 0 et le Quiz a traité cette même
        révision.

        INTENTION DE PLATEAU

        Le joueur avance de découverte en découverte : Dieu peut ouvrir ses yeux,
        élargir son cœur et éclairer son pas; la liberté se cherche dans sa parole,
        et même la brebis perdue peut encore appeler. La révélation finale ne fait
        jamais de la foi une performance : Dieu fortifie au milieu de la détresse,
        et l'égarement peut devenir une prière sans masque plutôt qu'une sortie du
        chemin.

        VOIX PUBLIQUE ET LECTURE ORALE

        Les dix séquences ont été entièrement réécrites pour une voix de
        présentateur chaleureuse : questions à une seule impulsion, choix brefs et
        parallèles, révélations directement prononçables après un verdict juste ou
        faux. Les dix ensembles prompt, choix et feedback ont été relus à voix
        haute dans l'ordre joueur. Aucun ne demande une syntaxe de dissertation,
        un souffle artificiellement long ou du vocabulaire de Conseil. Les choix
        se comprennent chacun en moins de deux secondes.

        CONTRÔLE DE COPIE

        Les prompts mesurent 57, 70, 51, 65, 62, 53, 62, 60, 66 et 58
        graphèmes. Le plus long choix mesure 31 graphèmes. Les feedbacks mesurent
        77, 93, 95, 83, 100, 83, 110, 113, 112 et 105 graphèmes. Les limites
        72/32/120 passent. Les quatre vrai/faux gardent exactement Vrai et Faux;
        les six QCM gardent quatre choix et chaque question conserve sa réponse
        juste.

        PREUVE DE SURFACE

        La feuille Street réelle 390 × 667 a exécuté les dix formulations comme
        de vraies QuizDefinition::Question dans un catalogue isolé, restauré en
        teardown. Pour chacune, le kicker a affiché exactement
        question.scripture.cite, les choix ont été contrôlés après mélange, une
        mauvaise réponse a été soumise par l'interface réelle, puis l'unique ligne
        juste, sa lettre, son texte source et le feedback exact ont été vérifiés.
        Les vingt états ask/reveal ont été inspectés sur deux planches de contact :
        aucun clipping, aucune troncature, aucun défilement des réponses et aucune
        erreur console sévère. Les lettres justes réellement affichées et les
        mesures sont consignées dans fast.result.voix.render_evidence.
    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 7
      status: complete
      production: |-
        PÉRIMÈTRE ET SOURCES RÉSOLUES

        Les dix unités françaises finales ont été reliées à neuf passages
        uniques, consultés dans les textes officiels indiqués par source.readings :
        Psaume 119:18, 32, 33-35, 45, 105, 176 et Psaume 138:3, 7, 8.
        Psaume 119:176 sert aux questions 5, 7 et 10 sans être dupliqué; la
        question 10 mobilise aussi Psaume 138:8. Pour chaque passage, la
        source_library distingue le texte, l'interprétation nécessaire et
        l'application proposée.

        ARBITRAGES DES DIX UNITÉS

        1. OUVRIR LES YEUX — Le grand œil au-dessus d'un rouleau serait immédiat
           mais impersonnel. Une aînée qui soulève le voile d'un manuscrit devant
           une jeune lectrice conserve le symbole et donne un instant de
           transmission. Alternative dramaturgique retenue, illustration biblique.
        2. LE CŒUR ÉLARGI — Le cœur lumineux serait trop littéral. Une coureuse
           débouche d'une arche étroite dans une avenue immense et accélère,
           poitrine ouverte. Hybride environnemental retenu, réalisme cinéma.
        3. LIBRE DANS UNE DIRECTION — Les chaînes brisées autour d'un rouleau
           opposeraient encore règle et liberté. Une alpiniste choisit la corde
           guide puis traverse avec audace. Alternative dramaturgique retenue,
           réalisme cinéma.
        4. LA LAMPE AU PROCHAIN PAS — La lampe seule reste universelle mais sans
           enjeu. Une sœur éclaire la prochaine pierre d'un passage inondé et tend
           la main à l'enfant qui la suit. Hybride retenu, illustration biblique.
        5. LA BREBIS CHERCHÉE — Ici l'image classique gagne : au crépuscule, un
           berger repère une brebis isolée dans des terrasses fleuries et quitte
           le troupeau pour la rejoindre. Conventionnel vivant retenu,
           illustration biblique.
        6. UNE ÂME FORTIFIÉE — Le rayon sur une personne agenouillée serait
           générique. Après une prière brève, une chirurgienne relève la tête et
           rejoint son équipe; l'urgence demeure. Alternative dramaturgique
           retenue, réalisme cinéma.
        7. REVENIR SANS PRÉTENDRE N'ÊTRE JAMAIS PARTI — Le mouton revenant
           répéterait la question 5. Une personne revient, Écritures usées en
           main, vers un cercle d'étude où une amie lui fait place. Alternative
           dramaturgique retenue, réalisme cinéma.
        8. DEMANDER D'ÊTRE CONDUIT — La boussole sur un chemin serait claire mais
           convenue. Une enquêtrice entre deux témoins pointant en sens opposés
           baisse son carnet et prend un instant de prière. Alternative
           dramaturgique retenue, réalisme cinéma.
        9. FORTIFIÉE AU MILIEU DE LA DÉTRESSE — La silhouette immobile dans
           l'orage manquerait de relation. Une capitaine maintient la barre et
           coordonne son équipage tandis que les vagues restent hautes.
           Alternative dramaturgique retenue, réalisme cinéma.
        10. CHERCHÉE, ŒUVRE NON ABANDONNÉE — Le berger et l'objet inachevé
            formeraient deux métaphores concurrentes. Dans une cour d'atelier, une
            maîtresse rejoint l'apprentie partie avec la dernière tesselle; la
            mosaïque inachevée reste visible. Alternative dramaturgique retenue,
            réalisme cinéma.

        TEST DES DEUX SECONDES ET RYTHME

        Chaque concept présente un geste, une relation ou un symbole lisible sans
        titre : voile levé, accélération, corde choisie, lampe tendue, recherche,
        relèvement, place faite, directions contradictoires, barre tenue, main
        tendue. Le lot va de l'émerveillement à l'élan, la liberté, le soin, la
        recherche, l'assurance, le retour, la décision, le courage et la
        miséricorde. Le réalisme cinéma domine sept unités; trois illustrations
        bibliques gardent les images poétiques et la respiration du psautier.

        LIMITES ET TRANSMISSION

        Aucune scène ne représente Dieu, ne garantit guérison, accueil, sécurité
        ou résolution, et aucune détresse ne devient automatiquement punition ou
        noblesse. Les personnages restent beaux, actifs et diversement situés;
        les scènes joyeuses et assurées empêchent le lot de réduire la profondeur
        à des visages fatigués. Les dix concepts concernent uniquement la surface
        quiz_question. Chaque futur ratio devra être recomposé nativement. La
        génération du lot reste interdite; aucun pixel n'a été produit.
    direction_artistique:
