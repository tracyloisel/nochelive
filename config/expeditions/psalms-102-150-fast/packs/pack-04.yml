          source_summary: "La parole de Dieu est comparée à une lampe aux pieds et à une lumière sur le sentier."
          interpretation: "La lampe donne assez de lumière pour avancer; elle ne promet pas une carte totale ni la disparition du danger."
          application: "Une parole reçue peut éclairer le prochain pas et soutenir une relation de confiance."
        ps119-176:
