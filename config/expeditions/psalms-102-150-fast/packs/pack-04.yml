          retrieved_on: "2026-09-04"
          kind: scripture
          resolved_text: |-
            Enseigne-moi, Éternel, la voie de tes statuts pour que je la retienne jusqu’à la fin !
            Donne-moi l’intelligence pour que je garde ta loi Et que je l’observe de tout mon cœur !
            Conduis-moi dans le sentier de tes commandements ! Car je l’aime.
          source_summary: "Le priant demande enseignement, intelligence et conduite pour demeurer dans une voie qu'il aime."
          interpretation: "Aimer la voie n'abolit ni l'apprentissage ni le discernement; la demande reconnaît un besoin réel d'être conduit."
          application: "Devant des directions concurrentes, on peut suspendre l'impulsion et demander à être enseigné avant d'agir."
        ps119-45:
          reference: "Psaume 119:45"
          resolved_references: ["Psaume 119:45"]
          url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=fra"
          retrieved_on: "2026-09-04"
          kind: scripture
          resolved_text: |-
