    influenceur:
      opening_screen: "Tu ne tiens pas par la force. Et si la Parole t’apprenait à durer ?"
      human_angle: "Une personne qui pense la foi comme une performance réussie ou ratée découvre que marcher avec Dieu unit obéissance désirée, demandes de grâce et reprises après l’égarement; Dieu fortifie l’âme au milieu de la détresse et n’abandonne pas l’œuvre commencée."
      spoken_script: "Tu sais ce qui fatigue dans la foi ? Croire qu’il faut réussir pour mériter de rester avec Dieu. Le Psaume 119 ne ressemble pas à ça. Le croyant répète : « Enseigne-moi », « soutiens-moi », « rends-moi la vie ». Il choisit la parole, il tombe, il demande d’être relevé, et il termine encore comme une brebis perdue que Dieu doit chercher. Puis le Psaume 138 ajoute ceci : au milieu de la détresse, Dieu fortifie l’âme et n’abandonne pas ce qu’il a commencé. La foi qui dure, ce n’est pas ne jamais tomber. C’est revenir à la parole, recevoir la grâce et reprendre un pas avec Dieu."
      closing_question: "Quelle parole de Dieu pourrais-tu mettre en pratique aujourd’hui pour reprendre la route avec lui ?"
      simplification_risks:
        - "Transformer l’obéissance en monnaie qui mérite l’amour ou le secours de Dieu, alors que le priant demande grâce, intelligence, soutien et vie."
        - "Faire de la force reçue une garantie de disparition immédiate de la détresse; le Psaume 138 parle d’une marche au milieu d’elle et d’une œuvre encore confiée à Dieu."
        - "Réduire le Psaume 119 à une formule motivante sur la lampe et le chemin, en effaçant désir, vérité, commandements, égarement, retour et durée."
    mystique:
      thesis: "Dans une relation où Dieu enseigne et soutient, le priant reçoit la parole comme lumière et vérité, y répond de tout son cœur, puis revient demander grâce, vie et conduite chaque fois que la détresse ou l'égarement interrompent sa marche."
      inner_movement:
        - references: ["Psaume 119:1-40"]
          passage: "Désirer la voie et demander d'être conduit : chercher Dieu de tout son cœur conduit à demander enseignement, intelligence, orientation et vie plutôt qu'à compter sur une performance solitaire."
        - references: ["Psaume 119:41-112"]
          passage: "Recevoir la parole comme appui pour le prochain pas : miséricorde, vérité, espérance et lumière aident à diriger ses pieds au milieu de la misère et des résistances, sans supprimer l'incertitude."
        - references: ["Psaume 119:113-176"]
          passage: "Persévérer en demandant secours, puis revenir encore : le priant aime la loi tout en demandant soutien, délivrance et vie; son dernier aveu de brebis perdue fait du retour une part de la marche."
        - references: ["Psaume 138:1-8"]
          passage: "Confier à Dieu l'œuvre encore inachevée : l'âme fortifiée célèbre la bonté fidèle de Dieu tout en marchant au milieu de la détresse et en demandant de ne pas être abandonnée."
      spiritual_practice: "Pendant sept jours, choisir chaque matin un verset du Psaume 119, le reformuler en demande, décider d'un acte observable et relire le soir sans score; remercier pour le pas accompli ou revenir à Psaume 119:176 après un écart, puis lire Psaume 138:3, 7-8 au septième jour en nommant la détresse encore réelle et ce qui a besoin d'être fortifié."
      limits:
        - "L'obéissance réelle n'est ni une monnaie pour mériter l'amour de Dieu, ni un test de la foi ou de la dignité d'autrui."
        - "La lampe sur le sentier éclaire la marche sans garantir que toute décision sera immédiatement claire ni que le croyant ne tombera plus."
        - "Les paroles sur l'humiliation ne permettent pas d'attribuer maladie, abus, oppression ou traumatisme à une correction voulue par Dieu, ni d'exiger qu'une personne reste sans protection."
        - "La paix et le secours annoncés ne garantissent ni sécurité, ni guérison, ni victoire terrestre automatiques; les aides médicales, psychologiques, juridiques, sociales ou pastorales restent légitimes."
        - "La brebis errante ouvre une demande de recherche et de retour; elle ne justifie ni honte fabriquée, ni coercition religieuse, ni effacement de la responsabilité et de la réparation."
    nouveau_baptise:
      good_news: "Je peux commencer ou recommencer à marcher avec Dieu sans tout comprendre ni réussir chaque pas : le Psaume 119 unit amour de la parole et demandes d'enseignement, de soutien et de retour; le Psaume 138 montre une âme fortifiée au milieu de la détresse et une œuvre encore confiée à Dieu. Dans une réception chrétienne, la personne qui découvre l'Évangile, prépare son baptême ou revient à l'Église peut y reconnaître un chemin de disciple auprès de Jésus-Christ, soutenu par la grâce plutôt que par la performance."
      belonging_risk: "Les appels à chercher Dieu de tout son cœur et à garder ses commandements ne doivent pas devenir l'exigence d'être irréprochable, de tout comprendre, de ne plus rechuter ou de ressentir immédiatement quelque chose pour appartenir. Le score, la régularité visible et la vitesse du progrès ne mesurent ni la valeur ni l'appartenance; baptême et retour à l'Église ne garantissent pas la disparition rapide de la détresse et ne remplacent jamais soins, protection ou aide humaine."
      first_step: "Lire Psaume 119:105 et 176, puis Psaume 138:3; dire à Dieu le pas que l'on ne voit pas encore et demander d'être enseigné et recherché, puis choisir avant demain un seul geste possible : lire dix minutes, poser une question à des missionnaires, reprendre contact avec une personne sûre dans l'Église, participer à une réunion ou commencer à réparer un tort. Ce geste n'est ni une preuve de dignité ni le prix de l'appartenance."
      open_question: "Si je m'égare ou retombe après mon baptême ou mon retour, comment puis-je revenir à Dieu et trouver de l'aide dans l'Église sans devoir faire semblant d'aller bien ?"
