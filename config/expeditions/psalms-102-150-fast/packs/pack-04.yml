          reference: Psaume 119:18
          prompt: O que o salmista pede para ver as maravilhas da lei?
          choices:
          - id: a
            text: Afasta meus inimigos
          - id: b
            text: Abre meus olhos
          - id: c
            text: Dá-me ouro
          - id: d
            text: Esconde teus mandamentos
          correct_choice: b
          feedback: Ele pede que Deus abra seus olhos para contemplar as maravilhas da lei.
        - id: fast-psalms-pack04-q02
          type: texte
          format: vrai_faux
          reference: Psaume 119:32
          prompt: 'Verdadeiro ou falso: Deus amplia o coração, e ele corre aos mandamentos.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: 'Deus amplia seu coração: o salmista deixa de se arrastar e corre pelo caminho dos mandamentos.'
        - id: fast-psalms-pack04-q03
          type: texte
          format: qcm
          reference: Psaume 119:45
          prompt: Por que o salmista diz que anda em liberdade?
          choices:
          - id: a
            text: Possui todos os tesouros
          - id: b
            text: Não tem mais adversários
          - id: c
            text: Busca os preceitos
          - id: d
            text: Os reis o aprovam
          correct_choice: c
          feedback: 'Sua liberdade nasce de uma busca: ele vai aos preceitos de Deus, sem fugir da palavra.'
        - id: fast-psalms-pack04-q04
          type: texte
          format: vrai_faux
          reference: Psaume 119:105
          prompt: 'Verdadeiro ou falso: a palavra de Deus ilumina os passos como lâmpada.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: 'Lâmpada para os pés, luz para o caminho: a palavra ilumina o próximo passo.'
        - id: fast-psalms-pack04-q05
          type: texte
          format: qcm
          reference: Psaume 119:176
          prompt: No último versículo do Salmo 119, qual imagem fica na memória?
          choices:
          - id: a
            text: Um vigia em sua torre
          - id: b
            text: Um viajante sem bagagem
          - id: c
            text: Um servo adormecido
          - id: d
            text: Uma ovelha perdida
          correct_choice: d
          feedback: 'O salmista se vê perdido como uma ovelha e ousa pedir a Deus: “Busca o teu servo.”'
        - id: fast-psalms-pack04-q06
          type: texte
          format: qcm
          reference: Psaume 138:3
          prompt: Ele invoca a Deus. O que recebe, segundo o Salmo 138?
          choices:
          - id: a
            text: Louvar diante dos reis
          - id: b
            text: Todo o caminho à frente
          - id: c
            text: O fim de toda aflição
          - id: d
            text: Resposta e força
          correct_choice: d
          feedback: Deus o atende, encoraja e fortalece sua alma. Essa resposta o ajuda a permanecer firme.
        - id: fast-psalms-pack04-q07
          type: vie
          format: vrai_faux
          reference: Psaume 119:176
          prompt: 'Verdadeiro ou falso: amar a palavra é nunca mais se perder.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: O Salmo 119 termina com uma ovelha perdida que ainda lembra os mandamentos e pede para ser buscada.
        - id: fast-psalms-pack04-q08
          type: vie
          format: qcm
          reference: Psaume 119:33-35
          prompt: Quando avançar fica difícil, qual oração soa verdadeira?
          choices:
          - id: a
            text: Ensina-me e guia-me
          - id: b
            text: Livra-me de toda decisão
          - id: c
            text: Mostra tudo de antemão
          - id: d
            text: Decide sem me ensinar
          correct_choice: a
          feedback: O salmista pede que Deus o ensine, lhe dê entendimento e o guie por um caminho que ele ama.
        - id: fast-psalms-pack04-q09
          type: vie
          format: vrai_faux
          reference: Psaume 138:7
          prompt: 'Verdadeiro ou falso: fortalecido por Deus, você não enfrenta aflição.'
