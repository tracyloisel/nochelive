          et les dimensions sont consignés dans fast.result.visual_production.

          INSPECTION

          Les trois personnages, les deux gestes opposés, le carnet abaissé et le
          recueillement central se lisent au premier regard. Les témoins restent
          crédibles, aucune direction vraie n'est révélée et aucun indice magique
          ne répond à la prière. Les visages et les mains occupent le haut de la
