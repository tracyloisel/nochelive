        CONTRÔLE DE SURFACE

        Le harness réel construit les dix `QuizDefinition::Question`, affiche `question.scripture.cite` dans le kicker, soumet une mauvaise réponse et contrôle copie, ordre rendu, lettre correcte, bonne réponse, feedback et géométrie. Une exécution et 1 389 assertions passent sans échec ni erreur. Pour q10, la citation « Psaume 119:176; Psaume 138:8 » et le bouton « Voir les résultats » sont entièrement visibles, sans chevauchement ni rognage horizontal ou vertical.

