      en:
        status: technical_pass_awaiting_human_validation
        source_locale: fr
        source_approval_revision: 13
        localized_pack_title: The living God acts
        official_scripture_sources:
          urls:
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng
          vocabulary_checked: Psalm, the Lord, mercy, salvation
        questions:
        - id: fast-psalms-pack01-q01
          type: texte
          format: vrai_faux
          reference: Psaume 135:15-17
          prompt: 'True or false: Idols have mouths, but they cannot speak.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: Mouths, eyes, and ears—but no breath. These idols have human form, yet no life.
        - id: fast-psalms-pack01-q02
          type: texte
          format: qcm
          reference: Psaume 135:18
          prompt: According to the psalm, whom do people who trust idols resemble?
          choices:
          - id: a
            text: Powerful kings
          - id: b
            text: The Lord’s servants
          - id: c
            text: The idols they make
          - id: d
            text: Peoples set free
          correct_choice: c
          feedback: 'Here’s the trap: Those who make idols and trust them end up becoming like them.'
        - id: fast-psalms-pack01-q03
          type: texte
          format: qcm
          reference: Psaume 136:1-26
          prompt: In Psalm 136, which line is repeated 26 times?
          choices:
          - id: a
            text: His reign begins today
          - id: b
            text: His mercy endures forever
          - id: c
            text: His people will suffer no more
          - id: d
            text: His power overturns everything
          correct_choice: b
          feedback: Twenty-six times, the psalm declares that God’s mercy endures forever. Each deed brings it back to mind.
        - id: fast-psalms-pack01-q04
          type: texte
          format: qcm
          reference: Psaume 136:23-25
          prompt: In verses 23–25, what three things does God do?
          choices:
          - id: a
            text: He hands his people to kings
          - id: b
            text: He keeps food from nations
          - id: c
            text: He forgets the lowly
          - id: d
            text: He remembers, rescues, feeds
          correct_choice: d
          feedback: God remembers the lowly, rescues them from their enemies, and feeds every living thing. His mercy acts.
        - id: fast-psalms-pack01-q05
          type: texte
          format: qcm
          reference: Psaume 146:3-4
          prompt: Why can’t powerful people be our saviors?
          choices:
          - id: a
            text: They die, and so do their plans
          - id: b
            text: They all refuse to help
          - id: c
            text: They always worship idols
          - id: d
            text: They do not know the law
          correct_choice: a
          feedback: Their breath leaves, they return to the earth, and their plans die with them. Their power cannot save.
        - id: fast-psalms-pack01-q06
          type: texte
          format: qcm
          reference: Psaume 146:5-6
          prompt: According to Psalm 146, where does a happy person place their hope?
          choices:
          - id: a
            text: In their own plans
          - id: b
            text: In the power of rulers
          - id: c
            text: In the Lord their God
          - id: d
            text: In what they make
          correct_choice: c
          feedback: The God of Jacob is their help. Their hope rests in the Lord, faithful Creator of heaven, earth, and sea.
        - id: fast-psalms-pack01-q07
          type: texte
          format: vrai_faux
          reference: Psaume 146:3-4
          prompt: 'True or false: The plans of rulers outlive them.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: 'The verse is clear: When their breath leaves, they return to the earth, and their plans perish.'
        - id: fast-psalms-pack01-q08
          type: vie
          format: vrai_faux
          reference: Psaume 146:5-10
          prompt: 'True or false: This psalm promises every trial will end at once.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: God remains faithful, gives help, and reigns. Yet the psalm does not promise every trial will end at once.
        - id: fast-psalms-pack01-q09
          type: vie
          format: qcm
          reference: application
          prompt: A useful support can become an idol. When?
          choices:
          - id: a
            text: When you learn to use it
          - id: b
            text: When you expect it to save you
          - id: c
            text: When you ask for advice
          - id: d
            text: When you admit its limits
          correct_choice: b
          feedback: Human help can be useful. But none can carry our salvation; that trust belongs to God.
        - id: fast-psalms-pack01-q10
          type: vie
          format: qcm
          reference: application
          prompt: God’s help is delayed. What first step keeps faith alive?
          choices:
          - id: a
            text: Hide your pain
          - id: b
            text: Believe your faith is too weak
          - id: c
            text: Demand an immediate sign
          - id: d
            text: Pray honestly and keep hoping
          correct_choice: d
          feedback: You can tell God what weighs on you and keep hoping. His timing does not measure your faith or spiritual worth.
