            - { id: b, text: "Ils refusent tous de secourir" }
            - { id: c, text: "Ils adorent toujours des idoles" }
            - { id: d, text: "Ils ignorent la loi" }
          correct_choice: a
          feedback: "Quand leur souffle s’en va, ils retournent à la terre et leurs projets périssent. Leur pouvoir ne peut donc pas sauver ultimement."
        - id: fast-psalms-pack01-q06
          type: texte
          format: qcm
          reference: "Psaume 146:5-6"
          prompt: "Où la personne déclarée heureuse place-t-elle son espérance ?"
          choices:
            - { id: a, text: "Dans ses propres projets" }
            - { id: b, text: "Dans la puissance des grands" }
            - { id: c, text: "Dans l’Éternel, son Dieu" }
            - { id: d, text: "Dans ce que ses mains fabriquent" }
          correct_choice: c
          feedback: "Elle a pour secours le Dieu de Jacob et met son espérance en l’Éternel, créateur fidèle des cieux, de la terre et de la mer."
        - id: fast-psalms-pack01-q07
