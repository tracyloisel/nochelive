            - { id: b, text: "Faux" }
          correct_choice: b
          feedback: "Le verset 4 affirme qu’au jour où l’homme retourne à la terre, ses projets périssent."
        - id: fast-psalms-pack01-q08
          type: vie
          format: vrai_faux
          reference: "Psaume 146:5-10"
          prompt: "Vrai ou faux : ce psaume promet la fin immédiate de toute épreuve."
          choices:
