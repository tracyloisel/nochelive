        questions:
        - id: fast-psalms-pack01-q01
          type: texte
          format: vrai_faux
          reference: Psaume 135:15-17
          prompt: 'Cierto o falso: los ídolos tienen boca, pero no hablan.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: a
          feedback: Boca, ojos y oídos, pero sin aliento. Estos ídolos tienen forma humana, pero no tienen vida.
        - id: fast-psalms-pack01-q02
          type: texte
          format: qcm
          reference: Psaume 135:18
          prompt: Según el salmo, ¿a quiénes se parecen quienes confían en ídolos?
          choices:
          - id: a
            text: A reyes poderosos
          - id: b
            text: A los siervos de Jehová
          - id: c
            text: A los ídolos que fabrican
          - id: d
            text: A pueblos liberados
          correct_choice: c
          feedback: 'Ahí está la trampa: quienes fabrican ídolos y confían en ellos terminan pareciéndose a ellos.'
        - id: fast-psalms-pack01-q03
          type: texte
          format: qcm
          reference: Psaume 136:1-26
          prompt: En el Salmo 136, ¿qué frase se repite 26 veces?
          choices:
          - id: a
            text: Su reino comienza hoy
          - id: b
            text: Su misericordia es para siempre
          - id: c
            text: Su pueblo ya no sufrirá
          - id: d
            text: Su poder lo derriba todo
          correct_choice: b
          feedback: Veintiséis veces, el salmo proclama que la misericordia de Dios es para siempre. Cada obra aviva esa memoria.
        - id: fast-psalms-pack01-q04
          type: texte
          format: qcm
          reference: Psaume 136:23-25
          prompt: En los versículos 23 al 25, ¿qué tres acciones de Dios se suceden?
          choices:
          - id: a
            text: Entrega su pueblo a reyes
          - id: b
            text: Niega pan a las naciones
          - id: c
            text: Olvida a los abatidos
          - id: d
            text: Recuerda, rescata y alimenta
          correct_choice: d
          feedback: 'Dios recuerda a los abatidos, los rescata de sus enemigos y alimenta a toda criatura: su bondad actúa.'
        - id: fast-psalms-pack01-q05
          type: texte
          format: qcm
          reference: Psaume 146:3-4
          prompt: "¿Por qué los poderosos no pueden ser nuestros salvadores?"
          choices:
          - id: a
            text: Mueren, igual que sus planes
          - id: b
            text: Todos se niegan a ayudar
          - id: c
            text: Siempre adoran a ídolos
          - id: d
            text: Desconocen la ley
          correct_choice: a
          feedback: Su aliento se va, vuelven a la tierra y sus planes mueren con ellos. Su poder no puede salvar.
        - id: fast-psalms-pack01-q06
          type: texte
          format: qcm
          reference: Psaume 146:5-6
          prompt: Según el Salmo 146, ¿en quién espera la persona feliz?
          choices:
          - id: a
            text: En sus propios planes
          - id: b
            text: En el poder de los grandes
          - id: c
            text: En Jehová, su Dios
          - id: d
            text: En lo que fabrica
          correct_choice: c
          feedback: Su ayuda es el Dios de Jacob. Espera en Jehová, el Creador fiel del cielo, la tierra y el mar.
        - id: fast-psalms-pack01-q07
          type: texte
          format: vrai_faux
          reference: Psaume 146:3-4
          prompt: 'Cierto o falso: los planes de los poderosos sobreviven a su muerte.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'El versículo es tajante: cuando su aliento se va, vuelven a la tierra y sus planes perecen.'
        - id: fast-psalms-pack01-q08
          type: vie
          format: vrai_faux
          reference: Psaume 146:5-10
          prompt: 'Cierto o falso: este salmo promete que toda prueba acaba enseguida.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: Dios sigue fiel, socorre y reina. Pero el salmo no promete que cada prueba termine enseguida.
        - id: fast-psalms-pack01-q09
          type: vie
          format: qcm
          reference: application
          prompt: Un apoyo útil puede volverse un ídolo. ¿Cuándo?
          choices:
          - id: a
            text: Cuando aprendes a usarlo
          - id: b
            text: Cuando esperas que te salve
          - id: c
            text: Cuando pides consejo
          - id: d
            text: Cuando reconoces sus límites
          correct_choice: b
          feedback: 'Los medios humanos pueden ayudar. Pero ninguno puede cargar con tu salvación: esa confianza le pertenece a Dios.'
        - id: fast-psalms-pack01-q10
          type: vie
          format: qcm
          reference: application
          prompt: La ayuda de Dios tarda. ¿Qué primer paso mantiene viva tu fe?
          choices:
          - id: a
            text: Ocultar tu sufrimiento
          - id: b
            text: Creer que tu fe es muy débil
          - id: c
            text: Exigir una señal inmediata
          - id: d
            text: Orar con sinceridad y esperar
          correct_choice: d
          feedback: Puedes contarle a Dios lo que te pesa y seguir esperando. La demora no mide tu fe ni tu valor espiritual.
