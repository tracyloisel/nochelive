    influenceur:
      opening_screen: "Et si ton meilleur appui ne pouvait même pas t’entendre ?"
      human_angle: "Nous confions facilement notre avenir à ce que nous pouvons fabriquer, posséder ou admirer. Ces psaumes opposent les appuis sans souffle au Dieu vivant : il crée, se souvient, nourrit, délivre et relève."
      spoken_script: >-
        On se sent plus tranquille quand on contrôle quelque chose : de l’argent,
        un contact puissant, un plan parfaitement ficelé. Mais les Psaumes 135 et
        146 lancent un défi : ce que nos mains fabriquent ne peut ni voir, ni
        entendre, ni sauver. Puis le Psaume 136 déroule une autre mémoire : Dieu
        crée, conduit, se souvient des humiliés et nourrit toute chair. La foi ne
        consiste donc pas à nier les moyens humains. Elle consiste à ne pas leur
        demander d’être notre sauveur. Alors, quand tout vacille, sur quoi ton
        espérance repose-t-elle vraiment ?
      closing_question: "Quel appui utile risques-tu de traiter comme s’il pouvait te sauver ?"
      simplification_risks:
        - "Condamner indistinctement l’argent, l’autorité ou toute organisation humaine au lieu d’interroger la confiance salvatrice."
        - "Transformer les délivrances et jugements racontés en consignes présentes de violence ou en garantie automatique de victoire."
        - "Promettre la fin immédiate de toute épreuve au lieu d’annoncer le caractère et le règne du Dieu vivant."
    mystique:
      thesis: "En se souvenant ensemble des œuvres de Dieu et en répétant sa miséricorde, l’âme retire son espérance aux appuis sans souffle et se laisse rendre vivante, attentive et secourable par le Dieu vivant."
      inner_movement:
        - step: 1
          title: "Entrer dans la louange"
          references: ["Psaume 135:1-5", "Psaume 136:1-3", "Psaume 146:1-2"]
          movement: "Tourner volontairement l’attention vers la bonté de Dieu et ouvrir la mémoire."
        - step: 2
          title: "Reconnaître ce qui ne peut porter l’espérance ultime"
          references: ["Psaume 135:15-18", "Psaume 146:3-4"]
          movement: "Nommer les appuis incapables de voir, d’entendre, de respirer ou de sauver."
        - step: 3
          title: "Se rappeler le Dieu qui agit"
          references: ["Psaume 135:6-14", "Psaume 136:4-25"]
          movement: "Relire la création, la délivrance, le désert, l’humiliation et la nourriture sous le refrain de la miséricorde durable."
        - step: 4
          title: "Devenir une louange vivante"
          references: ["Psaume 135:19-21", "Psaume 136:26", "Psaume 146:5-10"]
          movement: "Replacer son espérance en Dieu et vivre avec une attention réelle aux personnes qu’il secourt."
      spiritual_practice: >-
        Prendre dix minutes avec Psaume 136:23-26 et Psaume 146:5-10; nommer
        devant Dieu un appui utile devenu presque absolu, écrire trois actes de
        Dieu dont on veut se souvenir en reprenant le refrain du Psaume 136,
        demander la confiance et choisir un geste concret de secours sans en
        faire une transaction.
      limits:
        - "Ne pas déclarer inutiles les moyens humains : ils ne portent simplement pas le poids ultime du salut."
        - "Ne pas transformer le secours du Psaume 146 en garantie de délivrance immédiate."
        - "Ne pas accuser une personne éprouvée de manquer de foi lorsque la délivrance tarde."
        - "Ne pas transformer les jugements et victoires racontés en consignes présentes de violence."
        - "Ne pas employer le refrain sur la miséricorde comme une formule magique ou un déni du mal."
        - "Ne pas utiliser l’interprétation de Psaume 135:18 pour diagnostiquer ou humilier autrui."
    nouveau_baptise:
      good_news: >-
        Dieu est vivant, règne et demeure miséricordieux : il se souvient des
        humiliés, nourrit, relève, protège et fait droit. Une personne nouvelle
        peut lui confier son espérance et joindre sa voix à la louange sans
        devoir déjà tout comprendre ni tout maîtriser.
      belonging_risk: >-
        Les maisons nommées, les promesses de secours et le contraste entre
        justes et méchants pourraient devenir un test d’ancienneté, de mérite ou
        de foi réussie. Le quiz doit accueillir l’apprentissage et ne jamais
        accuser celui dont la délivrance tarde.
      first_step: >-
        Lire lentement un verset de Psaume 136:23-26 ou Psaume 146:5-10, confier
        à Dieu en une phrase ce qui est difficile à porter, sans exiger de
        sentiment ni de résultat immédiat; puis, si possible, poser un petit
        geste de secours sans chercher à acheter une bénédiction.
      open_question: >-
        Si Dieu se souvient des humiliés, relève ceux qui sont courbés et fait
        droit aux opprimés, comment continuer à lui faire confiance lorsque son
        secours semble tarder ?
