        source_locale: fr
        source_approval_revision: 13
        localized_pack_title: O Deus vivo age
        official_scripture_sources:
          urls:
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=por
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=por
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=por
          vocabulary_checked: Salmo, o Senhor, benignidade, salvação
        questions:
        - id: fast-psalms-pack01-q01
          type: texte
          format: vrai_faux
          reference: Psaume 135:15-17
          prompt: 'Verdadeiro ou falso: os ídolos têm boca, mas não falam.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: Boca, olhos e ouvidos, mas nenhum fôlego. Esses ídolos têm forma humana, porém não têm vida.
        - id: fast-psalms-pack01-q02
          type: texte
          format: qcm
          reference: Psaume 135:18
          prompt: Segundo o salmo, com quem se parecem os que confiam em ídolos?
          choices:
          - id: a
            text: Com reis poderosos
          - id: b
            text: Com os servos do Senhor
          - id: c
            text: Com os ídolos que fabricam
          - id: d
            text: Com povos libertos
          correct_choice: c
          feedback: 'Aí está a armadilha: quem fabrica ídolos e confia neles acaba se tornando semelhante a eles.'
        - id: fast-psalms-pack01-q03
          type: texte
          format: qcm
          reference: Psaume 136:1-26
          prompt: No Salmo 136, qual frase se repete 26 vezes?
          choices:
          - id: a
            text: Seu reino começa hoje
          - id: b
            text: Sua benignidade dura para sempre
          - id: c
            text: Seu povo não sofrerá mais
          - id: d
            text: Seu poder derruba tudo
          correct_choice: b
          feedback: Vinte e seis vezes, o salmo declara que a benignidade de Deus dura para sempre. Cada obra reaviva essa memória.
        - id: fast-psalms-pack01-q04
          type: texte
          format: qcm
          reference: Psaume 136:23-25
          prompt: Nos versículos 23 a 25, quais são as três ações de Deus?
          choices:
          - id: a
            text: Entrega seu povo aos reis
          - id: b
            text: Nega alimento às nações
          - id: c
            text: Esquece os abatidos
          - id: d
            text: Lembra, resgata e alimenta
          correct_choice: d
          feedback: 'Deus se lembra dos abatidos, resgata-os dos inimigos e alimenta toda criatura: sua bondade age.'
        - id: fast-psalms-pack01-q05
          type: texte
          format: qcm
          reference: Psaume 146:3-4
          prompt: Por que os poderosos não podem ser nossos salvadores?
          choices:
          - id: a
            text: Morrem, e seus planos também
          - id: b
            text: Todos se recusam a ajudar
          - id: c
            text: Sempre adoram ídolos
          - id: d
            text: Desconhecem a lei
          correct_choice: a
          feedback: Seu espírito sai, eles voltam à terra e seus planos morrem com eles. Seu poder não pode salvar.
        - id: fast-psalms-pack01-q06
          type: texte
          format: qcm
          reference: Psaume 146:5-6
          prompt: Segundo o Salmo 146, onde a pessoa feliz põe sua esperança?
          choices:
          - id: a
            text: Nos próprios planos
          - id: b
            text: No poder dos grandes
          - id: c
            text: No Senhor, seu Deus
          - id: d
            text: No que ela fabrica
          correct_choice: c
          feedback: Seu auxílio é o Deus de Jacó. Sua esperança está no Senhor, Criador fiel do céu, da terra e do mar.
        - id: fast-psalms-pack01-q07
          type: texte
          format: vrai_faux
          reference: Psaume 146:3-4
          prompt: 'Verdadeiro ou falso: os planos dos poderosos sobrevivem a eles.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: 'O versículo é claro: quando seu espírito sai, eles voltam à terra e seus planos perecem.'
        - id: fast-psalms-pack01-q08
          type: vie
          format: vrai_faux
          reference: Psaume 146:5-10
          prompt: 'Verdadeiro ou falso: este salmo promete o fim imediato de toda provação.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
