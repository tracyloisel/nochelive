      questions:
        - id: fast-psalms-pack01-q01
          type: texte
          format: vrai_faux
          reference: "Psaume 135:15-17"
          prompt: "Vrai ou faux : les idoles ont une bouche, mais ne parlent pas."
          choices:
            - { id: a, text: "Vrai" }
            - { id: b, text: "Faux" }
          correct_choice: a
          feedback: "Bouche, yeux, oreilles… mais aucun souffle. Ces idoles ont une forme humaine, sans aucune vie."
        - id: fast-psalms-pack01-q02
          type: texte
          format: qcm
          reference: "Psaume 135:18"
          prompt: "D’après le psaume, à qui ressemblent ceux qui se fient aux idoles ?"
          choices:
            - { id: a, text: "Aux rois puissants" }
            - { id: b, text: "Aux serviteurs de l’Éternel" }
            - { id: c, text: "Aux idoles qu’ils fabriquent" }
            - { id: d, text: "Aux peuples délivrés" }
          correct_choice: c
          feedback: "Voilà le piège : ceux qui fabriquent les idoles et leur font confiance finissent par leur ressembler."
        - id: fast-psalms-pack01-q03
          type: texte
          format: qcm
          reference: "Psaume 136:1-26"
          prompt: "Dans le Psaume 136, quel refrain revient 26 fois ?"
          choices:
            - { id: a, text: "Son règne commence ce jour" }
            - { id: b, text: "Sa miséricorde dure à jamais" }
            - { id: c, text: "Son peuple ne souffrira plus" }
            - { id: d, text: "Sa puissance renverse tout" }
          correct_choice: b
          feedback: "Vingt-six fois, le psaume proclame que la miséricorde de Dieu dure à jamais. Chaque œuvre ravive cette mémoire."
        - id: fast-psalms-pack01-q04
          type: texte
          format: qcm
          reference: "Psaume 136:23-25"
          prompt: "Aux versets 23 à 25, trois actions de Dieu s’enchaînent. Lesquelles ?"
          choices:
            - { id: a, text: "Il livre son peuple aux rois" }
            - { id: b, text: "Il prive les nations de pain" }
            - { id: c, text: "Il oublie les humiliés" }
            - { id: d, text: "Il se souvient, libère, nourrit" }
          correct_choice: d
          feedback: "Dieu se souvient des humiliés, les délivre de leurs oppresseurs et nourrit toute chair : sa bonté agit."
        - id: fast-psalms-pack01-q05
          type: texte
          format: qcm
          reference: "Psaume 146:3-4"
          prompt: "Pourquoi les grands ne peuvent-ils pas être nos sauveurs ?"
          choices:
            - { id: a, text: "Ils meurent, leurs projets aussi" }
            - { id: b, text: "Ils refusent tous de secourir" }
            - { id: c, text: "Ils adorent toujours des idoles" }
            - { id: d, text: "Ils ignorent la loi" }
          correct_choice: a
          feedback: "Leur souffle s’en va, ils retournent à la terre et leurs projets meurent avec eux. Leur pouvoir ne sauve pas."
        - id: fast-psalms-pack01-q06
          type: texte
          format: qcm
          reference: "Psaume 146:5-6"
          prompt: "Selon le Psaume 146, où l’homme heureux place-t-il son espérance ?"
          choices:
            - { id: a, text: "Dans ses propres projets" }
            - { id: b, text: "Dans la puissance des grands" }
            - { id: c, text: "Dans l’Éternel, son Dieu" }
            - { id: d, text: "Dans ce qu’il fabrique" }
          correct_choice: c
          feedback: "Son secours, c’est le Dieu de Jacob. Son espérance repose sur le Créateur fidèle du ciel, de la terre et de la mer."
        - id: fast-psalms-pack01-q07
          type: texte
          format: vrai_faux
          reference: "Psaume 146:3-4"
          prompt: "Vrai ou faux : les projets des grands leur survivent."
          choices:
            - { id: a, text: "Vrai" }
            - { id: b, text: "Faux" }
          correct_choice: b
          feedback: "Le verset tranche : quand leur souffle s’en va, ils retournent à la terre et leurs projets périssent."
        - id: fast-psalms-pack01-q08
          type: vie
          format: vrai_faux
          reference: "Psaume 146:5-10"
          prompt: "Vrai ou faux : ce psaume promet que toute épreuve finit aussitôt."
          choices:
            - { id: a, text: "Vrai" }
            - { id: b, text: "Faux" }
          correct_choice: b
          feedback: "Dieu demeure fidèle, secourt et règne. Le psaume ne promet pourtant pas que chaque épreuve cessera aussitôt."
        - id: fast-psalms-pack01-q09
          type: vie
          format: qcm
          reference: application
          prompt: "Un appui utile peut devenir une idole. À quel moment ?"
          choices:
            - { id: a, text: "Quand on apprend à s’en servir" }
            - { id: b, text: "Quand il doit garantir le salut" }
            - { id: c, text: "Quand on demande un conseil" }
            - { id: d, text: "Quand on reconnaît ses limites" }
          correct_choice: b
          feedback: "Les moyens humains peuvent nous aider. Mais aucun ne peut porter notre salut : cette confiance appartient à Dieu."
        - id: fast-psalms-pack01-q10
          type: vie
          format: qcm
          reference: application
          prompt: "Le secours de Dieu tarde. Quel premier pas garde la foi vivante ?"
          choices:
            - { id: a, text: "Cacher sa souffrance" }
            - { id: b, text: "Croire sa foi trop faible" }
            - { id: c, text: "Exiger un signe immédiat" }
            - { id: d, text: "Prier vrai, continuer d’espérer" }
          correct_choice: d
          feedback: "Tu peux dire à Dieu ce qui pèse et continuer d’espérer. Son délai ne mesure ni ta foi ni ta valeur spirituelle."
