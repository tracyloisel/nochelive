      production: |-
        Lecture de l’image seule : l’œil rencontre d’abord les deux visages presque
        face à face, puis les doigts de l’artisan contre la barbe d’or et le marteau
        suspendu. En moins de deux secondes, un artisan interrompt son travail pour
        examiner ou écouter la statue qu’il vient de façonner. La question spontanée
        est : « attend-il qu’elle lui réponde, ou va-t-il la frapper ? » Décision
        probable : arrêt du scroll.

        Lecture sur Street 390 × 667 : le visage de l’artisan, celui de l’idole, la
        main et le marteau restent simultanément lisibles entre le HUD et la feuille
        Quiz. Le panneau occupe la zone sombre prévue sans masquer la relation
        essentielle; la question et les deux réponses restent entièrement lisibles.

        Contrôle de fidélité : la preuve réalise le concept hybride approuvé dans un
        réalisme cinématographique crédible. L’idole demeure manifestement inerte,
        l’artisan est seul, actif, beau et digne, l’atelier et les matières sont
        spécifiques, et aucun risque annoncé — statue vivante, horreur, misère ou
        caricature d’une religion vivante — n’apparaît. Le manifeste n’emploie aucune
        référence identifiable au temple, à un rite ou à l’Église.

        Verdict : `PASS`. La preuve peut être soumise à la décision humaine. Ce PASS
        n’autorise aucun lot, variante, upscale ou autre ratio et ne rappelle aucun
        agent.
