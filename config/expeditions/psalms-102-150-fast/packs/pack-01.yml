            - { id: b, text: "Faux" }
          correct_choice: b
          feedback: "Le psaume révèle un Dieu fidèle qui secourt et règne; il ne fixe pas le moment où chaque épreuve prendra fin."
        - id: fast-psalms-pack01-q09
