            - { id: d, text: "Quand on reconnaît ses limites" }
          correct_choice: b
          feedback: "Ces psaumes ne méprisent pas les moyens humains. Ils invitent à ne pas leur demander ce que Dieu seul peut porter."
        - id: fast-psalms-pack01-q10
          type: vie
          format: qcm
