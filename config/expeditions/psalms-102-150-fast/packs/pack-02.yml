          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=por
          vocabulary_checked: Salmo, o Senhor, mão direita, sacerdote eterno, Melquisedeque, pedra de esquina
        questions:
        - id: fast-psalms-pack02-q01
          type: texte
          format: vrai_faux
          reference: Psaume 110:4
          prompt: 'Verdadeiro ou falso: Deus estabelece este sacerdote para sempre.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: Deus o declara sacerdote eterno, segundo a ordem de Melquisedeque.
        - id: fast-psalms-pack02-q02
          type: texte
          format: qcm
          reference: Psaume 110:1
          prompt: Onde Deus convida o Senhor a se sentar?
          choices:
          - id: a
            text: Diante de seu trono
          - id: b
            text: Às portas de Sião
          - id: c
            text: À sua mão direita
          - id: d
            text: Junto ao altar
          correct_choice: c
          feedback: 'Deus lhe diz: “Sente-se à minha direita”. Uma autoridade recebida, não conquistada.'
        - id: fast-psalms-pack02-q03
          type: texte
          format: qcm
          reference: Psaume 118:5
          prompt: O salmista clama na angústia. O que o Senhor faz?
          choices:
          - id: a
            text: Deixa-o esperando
          - id: b
            text: Ouve e lhe dá espaço
          - id: c
            text: Envia-lhe um rei
          - id: d
            text: Esconde seus inimigos
          correct_choice: b
          feedback: 'A angústia é real. Deus ouve seu clamor e lhe dá espaço: enfim, ele pode respirar.'
        - id: fast-psalms-pack02-q04
          type: texte
          format: vrai_faux
          reference: Psaume 118:8-9
          prompt: 'Verdadeiro ou falso: é melhor confiar em Deus do que nos poderosos.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: a
          feedback: O salmo prefere refúgio no Senhor à confiança absoluta nas pessoas, mesmo nas mais poderosas.
        - id: fast-psalms-pack02-q05
          type: texte
          format: qcm
          reference: Psaume 118:22
          prompt: Os construtores rejeitam uma pedra. O que ela se torna?
          choices:
          - id: a
            text: Uma pedra esquecida
          - id: b
            text: Uma pedra do portão
          - id: c
            text: Uma pedra do altar
          - id: d
            text: A pedra de esquina
          correct_choice: d
          feedback: A pedra rejeitada se torna a pedra de esquina. Deus constrói com o que as pessoas descartaram.
        - id: fast-psalms-pack02-q06
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'Verdadeiro ou falso: com Deus, toda provação acaba na hora.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: Buscar refúgio em Deus fortalece a confiança. Isso não garante o fim imediato da provação.
        - id: fast-psalms-pack02-q07
          type: vie
          format: qcm
          reference: application
          prompt: Você se sente sem saída. Que primeiro passo reflete o salmo?
          choices:
          - id: a
            text: Esperar até resolver tudo
          - id: b
            text: Dizer o que dói e pedir ajuda
          - id: c
            text: Recusar toda ajuda humana
          - id: d
            text: Prometer melhora imediata
          correct_choice: b
          feedback: Orar com sinceridade é dizer a Deus o que aperta seu coração enquanto você busca ajuda segura e concreta.
        - id: fast-psalms-pack02-q08
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'Verdadeiro ou falso: ser rejeitado basta para provar que você tem razão.'
          choices:
          - id: a
            text: Verdadeiro
          - id: b
            text: Falso
          correct_choice: b
          feedback: O salmo celebra o que Deus faz com a pedra rejeitada. A rejeição, por si só, não torna toda causa justa.
        - id: fast-psalms-pack02-q09
          type: vie
          format: qcm
          reference: application
          prompt: Como buscar refúgio em Deus sem rejeitar a ajuda humana?
          choices:
          - id: a
            text: Orar e buscar ajuda segura
          - id: b
            text: Guardar minha dor só para mim
          - id: c
            text: Contar somente com a oração
          - id: d
            text: Entregar tudo a alguém poderoso
          correct_choice: a
          feedback: 'Confiar em Deus não nos isola: pode incluir cuidados, proteção e ajuda de pessoas capacitadas.'
        - id: fast-psalms-pack02-q10
          type: vie
          format: qcm
          reference: réception chrétienne de Psaume 110:4 et Psaume 118:22-26
          prompt: Quem os cristãos reconhecem nessas imagens dos salmos?
          choices:
          - id: a
            text: Um rei que garante a vitória
          - id: b
            text: Um mestre que rejeita toda ajuda
          - id: c
            text: 'Jesus: Rei, sacerdote e pedra'
          - id: d
            text: 'Um sinal: toda rejeição é justa'
          correct_choice: c
          feedback: 'Os cristãos reconhecem Jesus Cristo: o Rei, o sacerdote eterno e a pedra de esquina.'
