        fast-psalms-pack02-q02 [texte · qcm · Psaume 110:1]
        Question : ¿Dónde invita Jehová al Señor a sentarse?
        Choix : a=Frente a su trono | b=A las puertas de Sion | c=A su diestra | d=Junto al altar
        Réponse juste : c — A su diestra — lettre affichée A
        Révélation : Jehová le dice: «Siéntate a mi diestra». Es una autoridad recibida, no conquistada.
        Graphèmes : prompt 41; choix a:17/b:21/c:12/d:14; feedback 83
        Chrome : Leer Salmo 110:1 | Siguiente
        Preuves : tmp/fast-psalms-pack02-translations-r14/es/ask/fast-psalms-pack02-q02.png | tmp/fast-psalms-pack02-translations-r14/es/reveal/fast-psalms-pack02-q02.png
        fast-psalms-pack02-q03 [texte · qcm · Psaume 118:5]
        Question : El salmista clama en la angustia. ¿Qué hace Jehová?
        Choix : a=Lo deja esperando | b=Le responde y le da espacio | c=Le envía un rey | d=Oculta a sus enemigos
        Réponse juste : b — Le responde y le da espacio — lettre affichée C
        Révélation : La angustia es real. Dios oye su clamor y le da espacio: por fin puede respirar.
        Graphèmes : prompt 51; choix a:17/b:27/c:15/d:21; feedback 80
        Chrome : Leer Salmo 118:5 | Siguiente
        Preuves : tmp/fast-psalms-pack02-translations-r14/es/ask/fast-psalms-pack02-q03.png | tmp/fast-psalms-pack02-translations-r14/es/reveal/fast-psalms-pack02-q03.png
        fast-psalms-pack02-q04 [texte · vrai_faux · Psaume 118:8-9]
        Question : Cierto o falso: es mejor confiar en Dios que en los poderosos.
        Choix : a=Cierto | b=Falso
        Réponse juste : a — Cierto — lettre affichée B
        Révélation : El salmo prefiere refugiarse en Jehová a confiar por completo en otras personas, incluso las poderosas.
        Graphèmes : prompt 62; choix a:6/b:5; feedback 103
        Chrome : Leer Salmo 118:8-9 | Siguiente
        Preuves : tmp/fast-psalms-pack02-translations-r14/es/ask/fast-psalms-pack02-q04.png | tmp/fast-psalms-pack02-translations-r14/es/reveal/fast-psalms-pack02-q04.png
        fast-psalms-pack02-q05 [texte · qcm · Psaume 118:22]
        Question : Los constructores rechazan una piedra. ¿En qué se convierte?
        Choix : a=Una piedra olvidada | b=Una piedra de la puerta | c=Una piedra del altar | d=La piedra angular
        Réponse juste : d — La piedra angular — lettre affichée B
        Révélation : La piedra rechazada se vuelve la piedra angular. Dios construye con lo que otros descartaron.
        Graphèmes : prompt 60; choix a:19/b:23/c:20/d:17; feedback 93
        Chrome : Leer Salmo 118:22 | Siguiente
        Preuves : tmp/fast-psalms-pack02-translations-r14/es/ask/fast-psalms-pack02-q05.png | tmp/fast-psalms-pack02-translations-r14/es/reveal/fast-psalms-pack02-q05.png
        fast-psalms-pack02-q06 [vie · vrai_faux · application]
        Question : Cierto o falso: con Dios, toda prueba termina de inmediato.
        Choix : a=Cierto | b=Falso
        Réponse juste : b — Falso — lettre affichée A
        Révélation : Buscar refugio en Dios fortalece la confianza. No garantiza que la prueba termine de inmediato.
