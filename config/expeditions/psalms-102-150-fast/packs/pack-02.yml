  agent_memory:
    influenceur:
      owner: expedition-fast-influenceur
      revision: 1
      status: complete
      production: |-
        ACCROCHE DE PREMIER ÉCRAN
        Le Roi annoncé par ces psaumes n’entre pas comme on l’attend.

        ANGLE HUMAIN UNIQUE
        Reconnaître Jésus-Christ quand le secours de Dieu prend la forme d’un roi-serviteur rejeté, devenu pierre principale et prêtre pour toujours.

        SCRIPT ORAL — 35 À 45 SECONDES
        Imagine : tu cherches quelqu’un d’assez fort pour te sauver, mais tu ne veux pas d’un pouvoir qui t’écrase. Le Psaume 110 annonce un roi placé auprès de Dieu et prêtre pour toujours. Le Psaume 118 raconte la détresse, le cri entendu, puis cette surprise : la pierre rejetée devient la pierre principale. Pour les chrétiens, ces paroles éclairent Jésus-Christ : le Roi vient aussi comme celui que les hommes ont rejeté. Il ouvre une porte vers la justice, devient force et salut, et nous apprend que Dieu peut bâtir précisément avec ce que le monde avait écarté.

        QUESTION FINALE
        Si Jésus est ce Roi-là, qu’est-ce que cela change à la manière dont tu cherches du secours ?

        RISQUES DE SIMPLIFICATION À TRANSMETTRE AU MYSTIQUE
        1. Réduire le roi du Psaume 110 à un chef politique contemporain ou faire du langage de victoire une permission de dominer.
        2. Présenter l’identification chrétienne à Jésus-Christ comme le seul sens littéral immédiatement évident des deux psaumes, sans distinguer texte et réception.
        3. Transformer le secours, la victoire et le salut du Psaume 118 en garantie automatique d’une issue terrestre favorable.
    mystique:
      owner: expedition-fast-mystique
      revision: 1
      status: complete
      production: |-
        PHRASE-THÈSE
        Ces psaumes font passer le cœur de la fascination pour une puissance qui écrase à la confiance en Dieu : dans la réception chrétienne, Jésus-Christ est accueilli comme Roi et prêtre pour toujours, secours dans la détresse et pierre rejetée devenue fondement d’une vie rendue à la louange.

        MOUVEMENT INTÉRIEUR DU TEXTE
        1. Recevoir avant d’agir — Le Psaume 110 présente une parole et un serment de l’Éternel : le seigneur est placé à sa droite et déclaré « prêtre pour toujours ». Le mouvement commence par une autorité reçue de Dieu, non fabriquée par l’ego. La lecture chrétienne reconnaît ici Jésus-Christ; cette reconnaissance relève de la réception messianique du psaume et ne doit pas être confondue avec son seul horizon littéral.
        2. Crier depuis l’étroitesse et déplacer sa confiance — Dans le Psaume 118, le priant ne nie pas la détresse : il appelle, reçoit du large et apprend qu’il vaut mieux chercher refuge en l’Éternel que rendre absolus les humains ou les puissants. L’intérieur passe de l’encerclement à une confiance qui respire et peut raconter le secours reçu.
        3. Traverser le rejet sans lui donner le dernier mot — Le priant franchit les portes de la justice, puis contemple la pierre rejetée devenue principale de l’angle. Le rejet réel n’est ni embelli ni déclaré bon; l’émerveillement porte sur l’œuvre de Dieu qui peut faire d’une réalité écartée un fondement. La réception chrétienne y discerne le Christ rejeté et exalté.
        4. Répondre au salut par une vie tournée vers Dieu — La demande « accorde le salut », la bénédiction de celui qui vient, la lumière et la louange finale conduisent de l’aide reçue à une réponse : reconnaître Dieu, lui rendre grâce et rejoindre une louange communautaire. Le salut ne devient pas possession privée ni supériorité sur autrui.

        PRATIQUE SPIRITUELLE CONCRÈTE
        Pendant dix minutes, lire lentement Psaume 110:4 puis Psaume 118:5, 8-9, 14, 19-24 et 28-29. Nommer devant Dieu, sans l’atténuer, une situation qui donne le sentiment d’être « à l’étroit ». Écrire ensuite deux phrases : « Le refuge que je suis tenté de rendre absolu est… » et « Le secours juste que je peux demander aujourd’hui est… ». Dans la foi chrétienne, confier cette situation à Jésus-Christ comme Roi, prêtre et pierre principale, puis accomplir un pas vérifiable qui respecte la réalité : demander de l’aide, poser une limite protectrice, réparer un tort, prendre un rendez-vous nécessaire ou remercier une personne. Terminer par une phrase de louange qui n’affirme que ce qui peut être dit honnêtement aujourd’hui.

        LIMITES POUR NE PAS SPIRITUALISER LA SOUFFRANCE NI TRAHIR LE TEXTE
        - Le langage de combat, de colère, d’ennemis vaincus et de cadavres du Psaume 110 appartient à une poésie royale ancienne; il ne donne pas aux disciples une permission de dominer, d’humilier ou de violenter des personnes.
        - Les Psaumes 110 et 118 ont une voix et un contexte propres. Reconnaître Jésus-Christ comme Roi, prêtre et pierre principale est une réception chrétienne explicitement assumée, non une prétention que chaque image n’aurait eu dès l’origine qu’un seul sens immédiatement transparent.
        - Le passage de la détresse au large, le salut et la prospérité demandée ne garantissent ni guérison immédiate, ni sécurité matérielle, ni victoire terrestre. On peut demeurer fidèle tout en ayant encore besoin d’aide médicale, psychologique, juridique, sociale ou matérielle.
        - Être rejeté ne prouve pas automatiquement qu’une personne ou sa cause a raison, et la pierre rejetée ne doit jamais servir à persuader quelqu’un de rester dans une situation abusive ou dangereuse.
        - Le châtiment évoqué en Psaume 118:18 ne permet pas de diagnostiquer la souffrance d’autrui comme une punition de Dieu. La pratique proposée ouvre une relation vraie avec Dieu; elle ne remplace ni la protection, ni les soins, ni la réparation concrète.
    nouveau_baptise:
      owner: expedition-fast-nouveau-baptise
      revision: 1
      status: complete
      production: |-
        CE QUI PEUT ÊTRE REÇU COMME UNE BONNE NOUVELLE
        Je peux appeler Dieu depuis la détresse sans avoir d’abord à prouver que ma foi est forte : le Psaume 118 montre un cri entendu, un espace rendu pour respirer et un refuge qui ne dépend pas du prestige des humains. Mon rejet, mes erreurs ou ma fragilité n’ont pas nécessairement le dernier mot; Dieu peut donner une place nouvelle à ce qui avait été écarté. Dans la réception chrétienne, Jésus-Christ est reconnu comme le Roi qui reçoit son autorité de Dieu, le prêtre pour toujours et la pierre rejetée devenue principale. Pour une personne nouvellement baptisée, cela ouvre un chemin de confiance : venir au Christ pour recevoir son secours, apprendre à s’appuyer sur lui et répondre par une louange honnête, même lorsque toute difficulté n’est pas encore résolue.

        CE QUI RISQUE D’ÊTRE MAL COMPRIS OU VÉCU COMME UN TEST D’APPARTENANCE
        Les images de roi victorieux, d’ennemis vaincus, de « justes » entrant par la porte et d’un peuple plein d’ardeur pourraient faire croire qu’un vrai disciple doit être fort, triomphant, sans peur ni doute, ou qu’il doit montrer immédiatement une fidélité parfaite pour appartenir à l’Église. « Chercher un refuge en l’Éternel » ne demande pas de refuser l’aide de personnes compétentes ou aimantes. Le baptême ne garantit pas une victoire terrestre immédiate, et souffrir ne prouve ni un manque de foi ni un châtiment de Dieu. Enfin, être rejeté ne rend pas automatiquement une personne ou sa cause juste et ne commande jamais de rester dans une situation dangereuse.

        UN PREMIER PAS RÉALISTE, SANS HONTE NI PERFORMANCE
        Lire seulement Psaume 118:5, 8 et 22-24. Dire ensuite à Dieu, avec ses propres mots : « Voici ce qui me met à l’étroit aujourd’hui; aide-moi à chercher refuge en toi. » Choisir un seul geste possible avant demain : demander de l’aide à une personne sûre, reprendre contact avec un membre de l’Église digne de confiance, poser une limite protectrice ou noter une raison sincère de rendre grâce. Ce pas n’est ni une preuve de dignité ni une promesse que tout changera vite; c’est une manière libre de commencer à placer sa confiance en Dieu.

        UNE QUESTION QU’UN NOUVEAU BAPTISÉ POURRAIT ENCORE POSER
        Comment puis-je chercher refuge en Dieu et reconnaître Jésus-Christ comme mon Roi sans cesser de demander l’aide humaine dont j’ai réellement besoin ?
    quiz:
      owner: expedition-fast-quiz
      revision: 1
      status: complete
      production: |-
        INTENTION DU QUIZ
        Faire reconnaître, dans les paroles des Psaumes 110 et 118, une autorité reçue de Dieu, une prêtrise durable, un secours demandé depuis la détresse et la pierre rejetée devenue principale. Conduire ensuite le joueur à chercher refuge en Dieu sans nier la réalité, refuser les garanties automatiques et accueillir, dans la réception chrétienne, Jésus-Christ comme Roi, prêtre pour toujours et pierre principale.

        DISTINCTIONS DE VÉRITÉ
        - Texte : les questions 1 à 5 vérifient uniquement des formulations directement présentes dans Psaume 110:1,4 et Psaume 118:5,8-9,22.
        - Application : les questions 6 à 9 transposent les limites pastorales déjà établies; leur retour les nomme explicitement comme applications et ne les attribue pas mot pour mot au psaume.
        - Réception chrétienne : la question 10 annonce explicitement ce cadre avant d’identifier Jésus-Christ comme Roi, prêtre pour toujours et pierre principale.
        - Aucune promesse de victoire terrestre, de guérison immédiate ou de dispense d’aide humaine n’est attribuée au texte.

        ARCHITECTURE
        - 5 questions de type texte et 5 questions de type vie.
        - 6 QCM et 4 vrai/faux.
        - Les quatre vrai/faux portent sur des affirmations sans réserve cachée : la durée de la prêtrise, la préférence du refuge en Dieu, l’absence de garantie d’une issue immédiate et l’impossibilité de déduire la justesse d’une cause de son seul rejet.
        - Les bonnes réponses sont réparties : q01=a, q02=c, q03=b, q04=a, q05=d, q06=b, q07=b, q08=b, q09=a, q10=c.

        QUESTIONS STRUCTURÉES
        1. [texte · vrai_faux · Psaume 110:4] L’Éternel jure que le prêtre le restera pour toujours. Réponse : Vrai. Le verset annonce un prêtre pour toujours, à la manière de Melchisédek.
        2. [texte · qcm · Psaume 110:1] Où l’Éternel invite-t-il le Seigneur à s’asseoir ? Réponse : À sa droite. Le verset place le Seigneur à la droite de l’Éternel.
        3. [texte · qcm · Psaume 118:5] Quand le psalmiste crie dans la détresse, que fait l’Éternel ? Réponse : Il l’exauce et le met au large. Le texte ne nie pas la détresse; il raconte un cri entendu et un espace rendu.
        4. [texte · vrai_faux · Psaume 118:8-9] Le psaume préfère le refuge en Dieu à la confiance dans les puissants. Réponse : Vrai. Les versets 8 et 9 opposent le refuge en l’Éternel à une confiance absolue dans l’homme ou les grands.
        5. [texte · qcm · Psaume 118:22] Que devient la pierre rejetée par les bâtisseurs ? Réponse : La principale de l’angle. Le rejet n’a pas le dernier mot : Dieu fait de la pierre écartée un fondement.
        6. [vie · vrai_faux · application] Chercher refuge en Dieu garantit que toute épreuve finira tout de suite. Réponse : Faux. C’est une application : le psaume invite à la confiance, sans garantir une issue terrestre immédiate.
        7. [vie · qcm · application] Quand je me sens à l’étroit, quel premier pas respecte ce psaume ? Réponse : Nommer ma détresse à Dieu et chercher une aide sûre. C’est une application de Psaume 118:5 et 8 : prier honnêtement peut accompagner une demande d’aide concrète.
        8. [vie · vrai_faux · application] Être rejeté prouve automatiquement qu’une personne ou sa cause a raison. Réponse : Faux. C’est une limite d’application : Psaume 118:22 célèbre l’œuvre de Dieu, pas tous les rejets ni toutes les causes.
        9. [vie · qcm · application] Comment chercher refuge en Dieu sans refuser l’aide humaine ? Réponse : Prier et solliciter une personne compétente. C’est une application : la confiance en Dieu peut inclure les soins, la protection et l’aide d’autrui.
        10. [vie · qcm · réception chrétienne de Psaume 110:4 et Psaume 118:22-26] Quel Sauveur ces psaumes aident-ils les chrétiens à reconnaître ? Réponse : Jésus-Christ, Roi, prêtre et pierre principale. La lecture chrétienne reçoit ces images comme des témoignages de Jésus-Christ, sans en faire une garantie de succès terrestre.
    voix:
      owner: expedition-fast-voix
      revision: 1
      status: complete
      production: |-
        SOURCE ET INVARIANTS

        Les dix questions de fast.result.quiz ont été relues avec les productions
        intégrales de l’Influenceur, du Mystique et du Nouveau baptisé. La révision
        humaine est 0 et le Quiz a traité cette même révision. Les IDs, types,
        formats, références, identifiants de choix, bonnes réponses, faits testés
        et limites pastorales sont conservés.

        INTENTION DE PLATEAU

        Le joueur découvre un Roi dont l’autorité vient de Dieu, un prêtre pour
        toujours et une pierre rejetée devenue fondement. Les questions de vie
        font entendre une confiance qui prie et demande de l’aide, sans promettre
        la fin immédiate des épreuves ni sanctifier automatiquement le rejet.

        LECTURE ORALE

        Les dix séquences prompt, choix et feedback ont été prononcées
        intégralement. Chaque prompt porte une seule attente; chaque choix se
        comprend isolément; chaque feedback peut suivre une réponse juste ou
        fausse sans félicitation, reproche ni vocabulaire de fabrication.

        CONTRÔLE DE COPIE

        Les prompts mesurent respectivement 52, 62, 56, 62, 55, 60, 59, 59,
        61 et 65 graphèmes. Le plus long choix mesure 32 graphèmes. Les
        feedbacks mesurent 66, 82, 94, 106, 101, 111, 102, 109, 113 et 109
        graphèmes. Toutes les limites brutes 72/32/120 passent. Les quatre
        vrai/faux gardent exactement Vrai et Faux; les six QCM gardent quatre
        choix et la même identité de réponse juste.

        PREUVE DE SURFACE

        La feuille Street réelle 390 x 667 a exécuté les dix formulations comme
        de vraies QuizDefinition::Question dans un catalogue isolé, restauré en
        teardown. Pour chaque question, une mauvaise réponse a été soumise par
        l’interface réelle puis la révélation exacte a été contrôlée. Les vingt
        états demande/révélation ne présentent ni clipping, ni troncature, ni
        défilement des réponses, ni erreur console sévère. Le test compte 1093
        assertions, sans échec ni erreur. Les lettres justes observées sont A,
        C, D, A, D, A, B, A, B et B : le mélange et correct_choice ont donc été
        réellement exercés.
    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 1
      status: complete
      production: |-
        SOURCES RÉSOLUES

        Les Psaumes 110 et 118 ont été relus dans les deux lectures officielles
        déclarées. Les références du quiz sont dédupliquées en six entrées :
        Psaume 110:1, Psaume 110:4, Psaume 118:5, Psaume 118:8-9,
        Psaume 118:22 et Psaume 118:22-26. Les quatre applications sont
        rattachées aux passages et aux limites pastorales amont, jamais à leur
        seul prompt.

        DIRECTION DU LOT

        Le lot oppose la puissance visible qui ne peut tout garantir à une
        autorité reçue, un refuge qui laisse place à l'aide concrète et une
        pierre rejetée que Dieu établit. Le réalisme cinématographique domine
        les décisions humaines. Trois illustrations bibliques assument les
        images messianiques et architecturales sans prétendre reconstituer un
        événement documenté.

        CONCEPTS RETENUS

        q01 : un prêtre au seuil du sanctuaire porte le vêtement sacré devant
        un cercle d'or sans rupture. q02 : dans une salle royale, le siège de
        droite est offert à celui qui n'a pas conquis le trône. q03 : une femme
        sort d'un défilé rocheux vers une mer immense après avoir crié. q04 :
        un dignitaire quitte une cour de puissants pour prier au seuil du
        sanctuaire. q05 : des bâtisseurs rappellent la pierre écartée pour
        fermer l'angle qui tenait tout l'édifice en attente. q06 : un marin prie
        tandis que la tempête et le travail de l'équipage continuent. q07 : au
        milieu d'une fête étouffante, une jeune femme nomme sa détresse à une
        amie et accepte de sortir avec elle. q08 : un apprenti rejeté découvre
        la fissure dangereuse de son propre plan. q09 : une femme prie puis
        franchit avec un proche la porte d'un centre de soins. q10 : une
        illustration chrétienne unit le Christ accueillant, la dignité royale,
        le signe sacerdotal et la pierre devenue soutien de la porte.

        TEST DES DEUX SECONDES ET LIMITES

        Chaque concept porte un geste, un rapport d'échelle ou un renversement
        lisible sans titre. Aucun puissant humain n'est diabolisé, aucun rejet
        n'est sanctifié, aucune épreuve ne disparaît par magie et aucune aide
        humaine n'est opposée à Dieu. La représentation de Jésus en q10 est
        explicitement une réception chrétienne, non une reconstruction du
        psaume. Les dix concepts passent; aucun pixel n'a été généré.
    direction_artistique:
      owner: expedition-fast-directeur-artistique-producteur
      revision: 1
      status: completed
      production: |-
        AUTORISATION ET SÉLECTION

        fast.visual_requirements a été lu. La mise en scène est
        ready_for_proof, les dix concepts sont PASS et le contrat
        fast.visual_staging_contract.proof_generation autorise exactement un
        appel avant le jugement humain. Aucun appel antérieur n'était consigné
        pour la révision 1 de la mise en scène.

        Le concept psalms-pack02-visual-q05 a été choisi pour la surface
        quiz_question dans une composition native 9:16. La pierre rejetée que
        les bâtisseurs ramènent ensemble vers l'angle vide concentre le
        renversement central du pack : en deux secondes, l'objet écarté devient
        indispensable à l'édifice. Le geste collectif, la direction donnée par
        l'architecte et l'angle encore incomplet créent une question visible
        sans titre et sans prétendre reconstruire un événement précis.

        PRODUCTION

        Un seul appel au générateur intégré image_gen a été effectué, sans
        référence, variante, upscale ni second ratio. Le traitement demandé est
        une illustration biblique monumentale en Celestial Light : calcaire
        ivoire, textiles lapis et corail, lumière de midi et or focal retenu.
        Aucune inspiration architecturale identifiable à un temple de l'Église
        de Jésus-Christ des Saints des Derniers Jours n'était utile et aucune
        n'a été employée.

        PROMPT EXACT

        Use case: illustration-story. Asset type: premium Noche Live mobile TV-quiz proof, native vertical 9:16. Monumental expressive biblical illustration at an ancient white-limestone construction site: at the decisive instant, eight skilled diverse builders recover one visibly rejected, dust-marked cornerstone and lift it toward the empty principal angle that has kept the whole structure unfinished; a magnetic architect in rich colored linen points urgently to the exact waiting angle while the other workers suspend their tools and understand the reversal. Painterly naturalism, credible ancient bronze tools, ropes, wood scaffolding and cut limestone, beautiful dignified artisans, layered architectural depth, bright midday Celestial Light, ivory stone, lapis and coral textiles, restrained gold focal accents. Keep the architect, rejected stone, lifting hands and clearly empty corner readable in the upper two thirds; leave the lower 35 percent calmer and slightly darker as a continuous safe zone for mobile quiz controls. No readable text, logo or watermark; no magical glowing stone; no claim of an exact historical reconstruction; do not imply that every rejected person or project is automatically right.

        INSPECTION RÉELLE

        Le master PNG existe en 941 x 1672. La pierre sombre et marquée, les
        mains qui la soulèvent, l'architecte qui désigne l'angle et le chantier
        monumental sont immédiatement visibles. Les huit artisans paraissent
        compétents, actifs et dignes; le calcaire, les échafaudages, les outils
        et les étoffes donnent profondeur et richesse. Aucun texte, logo,
        filigrane, pierre magique ou figure divine n'apparaît. L'image obtenue
        tend vers un naturalisme pictural très réaliste, mais conserve la
        composition biblique expressive et ne revendique aucune exactitude
        historique. La pierre est portée vers l'édifice plutôt que déjà placée :
        l'instant reste non résolu et fidèle au concept.

        Un aperçu non destructif a été rendu dans la vraie surface Street
        390 x 667 avec le chrome et la copie française exacte de q05. L'ordre
        réellement affiché est c, a, b, d; la bonne réponse source d apparaît
        sous la lettre D. Le test de surface compte 1 exécution, 66 assertions,
        aucun échec et aucune erreur. Aucun débordement horizontal, clipping,
        troncature, ellipsis ou défilement des réponses n'a été constaté; aucune
        erreur console sévère n'a été relevée.

        ARRÊT

        La preuve attend maintenant le Critique des deux secondes. Le lot
        complet reste interdit : full_batch_authorized est false et
        fast.visual_requirements.generation_authorized demeure false. Aucun
        critique, successeur, traducteur ou branchement runtime n'a été lancé.

        LOT QUIZ AUTORISÉ — RÉVISION 11

        L'approbation humaine de la révision 10 autorisait exactement les dix
        concepts Quiz sur quiz_question en portrait 9:16. Le master q05 approuvé
        a été réutilisé sans appel. Neuf appels intégrés image_gen distincts ont
        produit q01 à q04 et q06 à q10, sans variante, upscale ni autre ratio.
        Les dix masters PNG mesurent 941 x 1672 et leurs hashes sont consignés.

        Les masters ont été ouverts ensemble et comparés aux concepts : appel
        sacerdotal, autorité reçue, passage de l'étroitesse au large, renoncement
        au prestige, pierre réhabilitée, action dans la tempête, confidence à une
        amie, erreur reconnue, entrée accompagnée dans le soin et accueil du
        Christ sont lisibles. q04 montre une cour plus nombreuse que le minimum
        de casting demandé; la relation, le sceau rendu et le choix du sanctuaire
        restent conformes, sans démonisation. Aucun nouvel appel n'était autorisé
        pour corriger ce détail non sémantique.

        Vingt aperçus ont été rendus dans la vraie surface Street 390 x 667,
        états ask et reveal, avec chaque master, la copie française finale et la
        citation exacte de question.scripture.cite dans .quiz-kicker, jamais le
        titre du pack. Le test compte 1 exécution et 1179 assertions, sans échec,
        erreur, clipping, troncature, ellipsis, défilement des réponses,
        débordement horizontal ni erreur console sévère. Ordres affichés,
        lettres justes, réponses, feedbacks, chemins et hashes sont consignés
        unité par unité dans fast.french_quiz_approval.review_units.

        Le lot s'arrête à french_quiz_approval. La décision humaine demeure
        vide; aucune traduction, aucun Localisateur, aucun runtime et aucun
        autre agent n'ont été lancés.
    critique_deux_secondes:
      owner: expedition-fast-critique-deux-secondes
      revision: 9
      status: complete
      production: |-
        Lecture de l’image seule : l’œil rencontre d’abord la pierre levée par
        plusieurs mains, puis l’architecte en bleu et rouge qui désigne l’angle
        du bâtiment. En moins de deux secondes, une équipe de bâtisseurs remet
        en jeu une pierre manifestement importante sur un chantier interrompu.
        La question spontanée est : « pourquoi cette pierre change-t-elle tout ? »
        Décision probable : arrêt du scroll.

        Lecture sur Street 390 × 667 : la pierre, les mains qui la portent,
        l’architecte et le chantier restent lisibles entre le HUD et la feuille
        Quiz. Le panneau de réponses recouvre seulement la zone basse assombrie;
        il ne masque ni le geste collectif ni la direction indiquée. La question
        et les quatre choix sont entièrement visibles sans débordement.

        Contrôle de fidélité : la preuve respecte le concept hybride retenu.
        L’image montre une pierre rugueuse ramenée vers l’édifice, un chantier
        suspendu, une équipe active et un architecte qui indique sa destination.
        Le calcaire blanc, les échafaudages, les outils et les étoffes colorées
        donnent un monde biblique spécifique et digne. La pierre n’est ni
        magique ni déjà installée; l’instant demeure non résolu. Aucun temple,
        rite ou élément identifiable de l’Église n’est représenté.

        Verdict : `PASS`. Aucun échec visible ni correction obligatoire. La
        preuve peut être soumise à la décision humaine. Ce PASS n’autorise aucun
        lot, aucune variante, aucun autre ratio, aucune traduction et ne rappelle
        aucun agent.
    localisateur_voix:
      owner: expedition-fast-localisateur-voix
      revision: 14
      status: complete_awaiting_human_validation
      production: |-
        GATE D’ENTRÉE

        La copie française approuvée en révision 12 contient exactement dix questions et ses dix unités sont approuvées. `fast.translation_gate.translation_authorized` vaut true et vise cette même révision. Les dix images françaises approuvées ont été réutilisées bit pour bit, sans génération, retouche, variante ni texte incrusté.

        MÉTHODE

        L’espagnol, l’anglais et le portugais brésilien ont été localisés séparément depuis le français approuvé, sans langue relais. Pour chacune des trente séquences, les identifiants, types, formats, références canoniques, identifiants et sens des choix, `correct_choice`, fait testé et nuance pastorale sont conservés. Les séquences ont été relues dans une voix de présentateur native; chaque choix reste saisissable en moins de deux secondes. Le vocabulaire scripturaire a été contrôlé dans les éditions officielles de l’Église pour les Psaumes 110 et 118.

        PREUVE TECHNIQUE

        Chaque langue a été exécutée indépendamment comme dix vraies `QuizDefinition::Question` dans Street 390 × 667. Après mélange déterministe, une mauvaise réponse a été soumise; une seule ligne juste, le même identifiant source, le texte localisé exact et le feedback exact ont été vérifiés. Les trente asks et trente reveals ont été rendus et inspectés. Les CTA, citations et noms du livre ont été vérifiés mot pour mot dans chaque langue.

        LANGUE es — PASS TECHNIQUE
        Titre : Este es Jesucristo. Références et CTA natifs : Leer, Siguiente, Ver resultados. Dix asks et dix reveals : PASS.
        fast-psalms-pack02-q01 [texte · vrai_faux · Psaume 110:4]
        Question : Cierto o falso: Dios establece a este sacerdote para siempre.
        Choix : a=Cierto | b=Falso
        Réponse juste : a — Cierto — lettre affichée B
        Révélation : Dios lo declara sacerdote para siempre, según el orden de Melquisedec.
