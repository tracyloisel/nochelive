        localized_pack_title: Este es Jesucristo
        official_scripture_sources:
          urls:
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=spa
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=spa
          vocabulary_checked: Salmo, Jehová, diestra, sacerdote para siempre, Melquisedec, piedra angular
        questions:
        - id: fast-psalms-pack02-q01
          type: texte
          format: vrai_faux
          reference: Psaume 110:4
          prompt: 'Cierto o falso: Dios establece a este sacerdote para siempre.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: a
          feedback: Dios lo declara sacerdote para siempre, según el orden de Melquisedec.
        - id: fast-psalms-pack02-q02
          type: texte
          format: qcm
          reference: Psaume 110:1
          prompt: "¿Dónde invita Jehová al Señor a sentarse?"
          choices:
          - id: a
            text: Frente a su trono
          - id: b
            text: A las puertas de Sion
          - id: c
            text: A su diestra
          - id: d
            text: Junto al altar
          correct_choice: c
          feedback: 'Jehová le dice: «Siéntate a mi diestra». Es una autoridad recibida, no conquistada.'
        - id: fast-psalms-pack02-q03
          type: texte
          format: qcm
          reference: Psaume 118:5
          prompt: El salmista clama en la angustia. ¿Qué hace Jehová?
          choices:
          - id: a
            text: Lo deja esperando
          - id: b
            text: Le responde y le da espacio
          - id: c
            text: Le envía un rey
          - id: d
            text: Oculta a sus enemigos
          correct_choice: b
          feedback: 'La angustia es real. Dios oye su clamor y le da espacio: por fin puede respirar.'
        - id: fast-psalms-pack02-q04
          type: texte
          format: vrai_faux
          reference: Psaume 118:8-9
          prompt: 'Cierto o falso: es mejor confiar en Dios que en los poderosos.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: a
          feedback: El salmo prefiere refugiarse en Jehová a confiar por completo en otras personas, incluso las poderosas.
        - id: fast-psalms-pack02-q05
          type: texte
          format: qcm
          reference: Psaume 118:22
          prompt: Los constructores rechazan una piedra. ¿En qué se convierte?
          choices:
          - id: a
            text: Una piedra olvidada
          - id: b
            text: Una piedra de la puerta
          - id: c
            text: Una piedra del altar
          - id: d
            text: La piedra angular
          correct_choice: d
          feedback: La piedra rechazada se vuelve la piedra angular. Dios construye con lo que otros descartaron.
        - id: fast-psalms-pack02-q06
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'Cierto o falso: con Dios, toda prueba termina de inmediato.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: Buscar refugio en Dios fortalece la confianza. No garantiza que la prueba termine de inmediato.
        - id: fast-psalms-pack02-q07
          type: vie
          format: qcm
          reference: application
          prompt: Te sientes sin salida. ¿Qué primer paso refleja el salmo?
          choices:
          - id: a
            text: Esperar a tener todo resuelto
          - id: b
            text: Decir lo que duele y pedir ayuda
          - id: c
            text: Rechazar toda ayuda humana
          - id: d
            text: Prometer una mejora inmediata
          correct_choice: b
          feedback: Orar con sinceridad es decirle a Dios qué te oprime mientras buscas ayuda segura y concreta.
        - id: fast-psalms-pack02-q08
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'Cierto o falso: ser rechazado basta para demostrar que tienes razón.'
          choices:
          - id: a
            text: Cierto
          - id: b
            text: Falso
          correct_choice: b
          feedback: El salmo celebra lo que Dios hace con la piedra rechazada. El rechazo por sí solo no vuelve justa toda causa.
        - id: fast-psalms-pack02-q09
          type: vie
          format: qcm
          reference: application
          prompt: "¿Cómo refugiarte en Dios sin rechazar la ayuda humana?"
          choices:
          - id: a
            text: Orar y buscar ayuda segura
          - id: b
            text: Guardarte el dolor
          - id: c
            text: Contar solo con la oración
          - id: d
            text: Dejarlo todo a alguien poderoso
          correct_choice: a
          feedback: 'Confiar en Dios no te aísla: puede incluir cuidados, protección y ayuda de personas capacitadas.'
        - id: fast-psalms-pack02-q10
          type: vie
          format: qcm
          reference: réception chrétienne de Psaume 110:4 et Psaume 118:22-26
          prompt: "¿A quién reconocen los cristianos en estas imágenes de los salmos?"
          choices:
          - id: a
            text: Un rey que asegura la victoria
          - id: b
            text: Un amo que rechaza toda ayuda
          - id: c
            text: 'Jesús: Rey, sacerdote y piedra'
          - id: d
            text: 'Un signo: todo rechazo es justo'
          correct_choice: c
          feedback: 'Los cristianos reconocen a Jesucristo: el Rey, el sacerdote para siempre y la piedra angular.'
