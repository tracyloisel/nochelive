    influenceur:
      opening_screen: "Le Roi annoncé par ces psaumes n’entre pas comme on l’attend."
      human_angle: "Reconnaître Jésus-Christ quand le secours de Dieu prend la forme d’un roi-serviteur rejeté, devenu pierre principale et prêtre pour toujours."
      spoken_script: "Imagine : tu cherches quelqu’un d’assez fort pour te sauver, mais tu ne veux pas d’un pouvoir qui t’écrase. Le Psaume 110 annonce un roi placé auprès de Dieu et prêtre pour toujours. Le Psaume 118 raconte la détresse, le cri entendu, puis cette surprise : la pierre rejetée devient la pierre principale. Pour les chrétiens, ces paroles éclairent Jésus-Christ : le Roi vient aussi comme celui que les hommes ont rejeté. Il ouvre une porte vers la justice, devient force et salut, et nous apprend que Dieu peut bâtir précisément avec ce que le monde avait écarté."
      closing_question: "Si Jésus est ce Roi-là, qu’est-ce que cela change à la manière dont tu cherches du secours ?"
      simplification_risks:
        - "Réduire le roi du Psaume 110 à un chef politique contemporain ou faire du langage de victoire une permission de dominer."
        - "Présenter l’identification chrétienne à Jésus-Christ comme le seul sens littéral immédiatement évident des deux psaumes, sans distinguer texte et réception."
        - "Transformer le secours, la victoire et le salut du Psaume 118 en garantie automatique d’une issue terrestre favorable."
    mystique:
      thesis: "Ces psaumes font passer le cœur de la fascination pour une puissance qui écrase à la confiance en Dieu : dans la réception chrétienne, Jésus-Christ est accueilli comme Roi et prêtre pour toujours, secours dans la détresse et pierre rejetée devenue fondement d’une vie rendue à la louange."
      inner_movement:
        - "Recevoir avant d’agir : le Psaume 110 présente une autorité et une prêtrise données par la parole et le serment de Dieu; la réception chrétienne y reconnaît Jésus-Christ."
        - "Crier depuis l’étroitesse et déplacer sa confiance : le Psaume 118 ne nie pas la détresse, mais conduit de l’encerclement au refuge en Dieu et au témoignage du secours reçu."
        - "Traverser le rejet sans lui donner le dernier mot : la pierre écartée devient principale de l’angle par l’œuvre de Dieu; la réception chrétienne y discerne le Christ rejeté et exalté."
        - "Répondre au salut par une vie tournée vers Dieu : la demande, la bénédiction, la lumière et la louange font du secours reçu une gratitude vécue et communautaire."
      spiritual_practice: "Pendant dix minutes, lire Psaume 110:4 et Psaume 118:5, 8-9, 14, 19-24, 28-29; nommer une situation d’étroitesse, identifier le refuge que l’on absolutise, demander à Dieu un secours juste, choisir un pas concret de protection, de soin, de réparation ou de gratitude, puis conclure par une louange honnête."
      limits:
        - "Le langage royal de combat du Psaume 110 n’autorise aucune domination, humiliation ou violence envers des personnes."
        - "La reconnaissance de Jésus-Christ comme Roi, prêtre et pierre principale est une réception chrétienne explicitement distinguée de l’horizon littéral propre à chaque psaume."
        - "Le secours, le salut et la prospérité demandée ne garantissent ni guérison immédiate, ni sécurité matérielle, ni victoire terrestre; les aides médicales, psychologiques, juridiques, sociales ou matérielles restent légitimes."
        - "Le rejet ne prouve pas automatiquement la justesse d’une personne ou d’une cause et ne justifie jamais de rester exposé à l’abus ou au danger."
        - "Psaume 118:18 ne permet pas de diagnostiquer la souffrance d’autrui comme une punition divine; la prière ne remplace ni protection, ni soins, ni réparation concrète."
    nouveau_baptise:
      good_news: "Je peux appeler Dieu depuis la détresse sans devoir d’abord prouver la force de ma foi : le Psaume 118 présente un cri entendu, un espace pour respirer et un refuge qui ne dépend pas du prestige humain. Le rejet et la fragilité n’ont pas nécessairement le dernier mot. Dans la réception chrétienne, Jésus-Christ est reconnu comme Roi, prêtre pour toujours et pierre rejetée devenue principale; le nouveau baptisé peut venir à lui, apprendre la confiance et offrir une louange honnête avant même que tout soit résolu."
      belonging_risk: "Les images de victoire, d’ennemis vaincus, de justes et d’un peuple ardent peuvent être reçues comme l’exigence d’être fort, sans peur, sans doute et immédiatement parfait pour appartenir. Chercher refuge en Dieu ne signifie pas refuser l’aide humaine; le baptême ne garantit pas une victoire terrestre rapide, la souffrance ne prouve pas un manque de foi, et le rejet ne justifie ni toute cause ni le maintien dans le danger."
      first_step: "Lire Psaume 118:5, 8 et 22-24, nommer simplement à Dieu ce qui met aujourd’hui à l’étroit, puis choisir avant demain un seul geste possible : demander de l’aide à une personne sûre, reprendre contact avec un membre de l’Église digne de confiance, poser une limite protectrice ou noter une raison sincère de rendre grâce. Ce geste n’est ni une preuve de dignité ni une garantie d’issue rapide."
      open_question: "Comment puis-je chercher refuge en Dieu et reconnaître Jésus-Christ comme mon Roi sans cesser de demander l’aide humaine dont j’ai réellement besoin ?"
