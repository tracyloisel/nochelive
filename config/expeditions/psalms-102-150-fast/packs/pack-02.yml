      en:
        status: technical_pass_awaiting_human_validation
        source_locale: fr
        source_approval_revision: 12
        localized_pack_title: This Is Jesus Christ
        official_scripture_sources:
          urls:
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng
          - https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=eng
          vocabulary_checked: Psalm, the Lord, right hand, priest forever, Melchizedek, cornerstone
        questions:
        - id: fast-psalms-pack02-q01
          type: texte
          format: vrai_faux
          reference: Psaume 110:4
          prompt: 'True or false: God appoints this priest forever.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: God declares him a priest forever, after the order of Melchizedek.
        - id: fast-psalms-pack02-q02
          type: texte
          format: qcm
          reference: Psaume 110:1
          prompt: Where does God tell the Lord to sit?
          choices:
          - id: a
            text: In front of his throne
          - id: b
            text: At Zion’s gates
          - id: c
            text: At his right hand
          - id: d
            text: Beside the altar
          correct_choice: c
          feedback: God tells him, “Sit at my right hand.” This authority is received, not seized.
        - id: fast-psalms-pack02-q03
          type: texte
          format: qcm
          reference: Psaume 118:5
          prompt: The psalmist cries out in distress. What does the Lord do?
          choices:
          - id: a
            text: Leaves him waiting
          - id: b
            text: Answers and gives him room
          - id: c
            text: Sends him a king
          - id: d
            text: Hides his enemies
          correct_choice: b
          feedback: The distress is real. God hears his cry and gives him room—at last, he can breathe.
        - id: fast-psalms-pack02-q04
          type: texte
          format: vrai_faux
          reference: Psaume 118:8-9
          prompt: 'True or false: Refuge in God is better than trusting the powerful.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: a
          feedback: The psalm prefers refuge in the Lord to absolute trust in people, even the powerful.
        - id: fast-psalms-pack02-q05
          type: texte
          format: qcm
          reference: Psaume 118:22
          prompt: The builders reject a stone. What does it become?
          choices:
          - id: a
            text: A forgotten stone
          - id: b
            text: A stone from the gate
          - id: c
            text: A stone from the altar
          - id: d
            text: The cornerstone
          correct_choice: d
          feedback: The rejected stone becomes the cornerstone. God builds with what people cast aside.
        - id: fast-psalms-pack02-q06
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'True or false: With God, every trial ends immediately.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: Taking refuge in God builds trust. It does not guarantee that a trial will end immediately.
        - id: fast-psalms-pack02-q07
          type: vie
          format: qcm
          reference: application
          prompt: You feel trapped. What first step reflects the psalm?
          choices:
          - id: a
            text: Wait until I have solved it all
          - id: b
            text: Name my pain and seek help
          - id: c
            text: Refuse all human help
          - id: d
            text: Promise things will improve fast
          correct_choice: b
          feedback: Honest prayer means telling God what is closing in on you while seeking safe, practical help.
        - id: fast-psalms-pack02-q08
          type: vie
          format: vrai_faux
          reference: application
          prompt: 'True or false: Being rejected is enough to prove you are right.'
          choices:
          - id: a
            text: 'True'
          - id: b
            text: 'False'
          correct_choice: b
          feedback: The psalm celebrates what God does with the rejected stone. Rejection alone does not make every cause right.
        - id: fast-psalms-pack02-q09
          type: vie
          format: qcm
          reference: application
          prompt: How can you take refuge in God without rejecting human help?
          choices:
          - id: a
            text: Pray and seek safe help
          - id: b
            text: Keep my pain to myself
          - id: c
            text: Rely on prayer alone
          - id: d
            text: Leave it all to someone powerful
          correct_choice: a
          feedback: Trust in God does not isolate us. It can include care, protection, and help from qualified people.
        - id: fast-psalms-pack02-q10
          type: vie
          format: qcm
          reference: réception chrétienne de Psaume 110:4 et Psaume 118:22-26
          prompt: Who do Christians recognize in these images from the psalms?
          choices:
          - id: a
            text: A king who guarantees victory
          - id: b
            text: A master who refuses all help
          - id: c
            text: 'Jesus: King, priest, cornerstone'
          - id: d
            text: 'A sign: every rejection is right'
          correct_choice: c
          feedback: 'Christians recognize Jesus Christ: the King, the priest forever, and the cornerstone.'
