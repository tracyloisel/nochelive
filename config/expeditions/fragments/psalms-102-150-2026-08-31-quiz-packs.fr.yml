schema_version: 1
kind: expedition_quiz_pack_draft
parent_dossier: config/expeditions/psalms-102-150-2026-08-31.yml
locale: fr
target: { player_id: 22, player_name: TRACY, ward_id: 1, ward_name: "Rama Benidorm" }
editorial_status: locally_published_for_review
runtime_status: local_rama_benidorm
localization_status:
  fr: complete_draft
  es: pending_after_french_editorial_approval
  en: pending_after_french_editorial_approval
  pt-BR: pending_after_french_editorial_approval

formation_quizzes:
  owner: expedition-spiritual-experience-director
  revision: 1
  method: code_de_la_route
  copy_limits:
    counting_unit: unicode_graphemes_including_spaces_and_punctuation
    reference_surface: street_quiz_390x667
    prompt: { hard_max: 72, max_lines: 3, must_be_self_contained: true }
    choice: { hard_max: 32, max_lines: 2 }
    correction: { hard_max: 120 }
    max_choices: 4
    locale_policy: validate_every_translation_independently
    overflow_policy: REJECT_COPY_OVERFLOW
    forbidden_fixes: [font_shrink, truncation, ellipsis, answer_scroll]
  assessment_policy:
    scores: [observation_du_texte, contexte, discernement, transfert]
    never_scores: [foi, saintete, emotion, confession, priere, repentance, salut]
  items:
    - id: ps102-fumee-01
      pack_id: disappearing-voice
      learning_lens: RECIT_DU_TEXTE
      source_layer: textual
      formation_goal: "Reconnaître la peur humaine qui ouvre le psaume."
      scripture_references: ["Psaume 102:2-12"]
      claim_ids: [exeg-002]
      prompt: "Que craint la voix au début du Psaume 102 ?"
      choices:
        - { id: a, text: "Disparaître", diagnosis: correct_text }
        - { id: b, text: "Perdre son trône", diagnosis: invented_royal_plot }
        - { id: c, text: "Oublier une victoire", diagnosis: invented_triumph }
      correct_choice: a
      correction: "Ses jours partent en fumée et son corps s’épuise : elle craint de disparaître."
    - id: ps102-herbe-02
      pack_id: disappearing-voice
      learning_lens: LECTURE_DU_TEXTE
      source_layer: textual
      formation_goal: "Voir comment une image rend la détresse physique."
      scripture_references: ["Psaume 102:5"]
      claim_ids: [exeg-002]
      prompt: "À quoi son cœur est-il comparé ?"
      choices:
        - { id: a, text: "À de l’herbe desséchée", diagnosis: correct_image }
        - { id: b, text: "À une muraille fissurée", diagnosis: imported_city_image }
        - { id: c, text: "À une rivière tarie", diagnosis: invented_image }
      correct_choice: a
      correction: "Son cœur est comme une herbe frappée et desséchée : la souffrance atteint tout son être."
    - id: ps102-mais-toi-03
      pack_id: disappearing-voice
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Distinguer la fragilité humaine de la permanence de Dieu."
      scripture_references: ["Psaume 102:13-14"]
      claim_ids: [exeg-002]
      prompt: "Quel tournant ouvre enfin un avenir ?"
      choices:
        - { id: a, text: "Mais toi, tu subsistes", diagnosis: correct_turn }
        - { id: b, text: "Moi seul, je résisterai", diagnosis: self_sufficiency }
        - { id: c, text: "Tout est déjà réparé", diagnosis: premature_resolution }
      correct_choice: a
      correction: "La voix ne prétend pas aller mieux. Elle tourne son regard vers Dieu, qui demeure."
    - id: ps102-sion-04
      pack_id: disappearing-voice
      learning_lens: MONDE_HISTORIQUE
      source_layer: historical
      formation_goal: "Relier la douleur personnelle à l’attente de Sion."
      scripture_references: ["Psaume 102:14-23"]
      claim_ids: [hist-004, exeg-002]
      prompt: "À quelle ville sa douleur finit-elle par se mêler ?"
      choices:
        - { id: a, text: "Sion", diagnosis: correct_place }
        - { id: b, text: "Rome", diagnosis: later_world }
        - { id: c, text: "Ninive", diagnosis: unrelated_city }
      correct_choice: a
      correction: "Sa plainte personnelle rejoint les pierres et la poussière de Sion, qui attend d’être relevée."
    - id: ps102-avenir-05
      pack_id: disappearing-voice
      learning_lens: PLAN_DE_DIEU
      source_layer: textual
      formation_goal: "Voir que la prière regarde au-delà d’une seule vie."
      scripture_references: ["Psaume 102:19-29"]
      claim_ids: [exeg-002]
      prompt: "Qui devra encore louer Dieu après cette génération ?"
      choices:
        - { id: a, text: "Un peuple à venir", diagnosis: correct_future }
        - { id: b, text: "Seulement les rois", diagnosis: narrowed_people }
        - { id: c, text: "Personne après elle", diagnosis: erased_future }
      correct_choice: a
      correction: "Le psaume imagine une génération future qui lira, louera Dieu et trouvera encore Sion devant elle."
    - id: ps103-memoire-06
      pack_id: disappearing-voice
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Comprendre la mémoire comme acte spirituel."
      scripture_references: ["Psaume 103:1-5"]
      claim_ids: [exeg-003]
      prompt: "Que demande le Psaume 103 à l’âme ?"
      choices:
        - { id: a, text: "N’oublie aucun bienfait", diagnosis: correct_command }
        - { id: b, text: "Ne regarde que tes fautes", diagnosis: shame_filter }
        - { id: c, text: "Oublie ce qui t’a blessé", diagnosis: false_forgetting }
      correct_choice: a
      correction: "La voix commande à son âme de bénir Dieu et de ne pas oublier ses bienfaits."
    - id: ps103-distance-07
      pack_id: disappearing-voice
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Recevoir l’image du pardon sans la réduire à une performance."
      scripture_references: ["Psaume 103:8-12"]
      claim_ids: [exeg-003]
      prompt: "Que fait Dieu des fautes dans l’image du psaume ?"
      choices:
        - { id: a, text: "Il les éloigne très loin", diagnosis: correct_mercy }
        - { id: b, text: "Il les garde pour humilier", diagnosis: punitive_memory }
        - { id: c, text: "Il nie qu’elles existent", diagnosis: denial }
      correct_choice: a
      correction: "Comme l’orient est loin de l’occident, le psaume représente Dieu éloignant les fautes."
    - id: ps103-fragilite-08
      pack_id: disappearing-voice
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Relier la compassion de Dieu à la fragilité humaine."
      scripture_references: ["Psaume 103:13-14"]
      claim_ids: [exeg-003]
      prompt: "Comment Dieu regarde-t-il notre fragilité ?"
      choices:
        - { id: a, text: "Avec compassion", diagnosis: correct_compassion }
        - { id: b, text: "Avec surprise", diagnosis: forgets_dust }
        - { id: c, text: "Avec mépris", diagnosis: harsh_projection }
      correct_choice: a
      correction: "Le psaume dit que Dieu se souvient que nous sommes poussière et nous regarde avec compassion."
    - id: ps103-eternite-09
      pack_id: disappearing-voice
      learning_lens: ESPERANCE_ETERNELLE
      source_layer: textual
      formation_goal: "Distinguer la brièveté humaine de l’amour durable de Dieu."
      scripture_references: ["Psaume 103:15-18"]
      claim_ids: [exeg-003]
      prompt: "La vie passe comme l’herbe. Qu’est-ce qui demeure ?"
      choices:
        - { id: a, text: "L’amour fidèle de Dieu", diagnosis: correct_hope }
        - { id: b, text: "La force du corps", diagnosis: mortal_strength }
        - { id: c, text: "La renommée humaine", diagnosis: passing_glory }
      correct_choice: a
      correction: "La vie humaine est brève, mais l’amour de Dieu est présenté comme allant d’éternité en éternité."
    - id: ps102-hebreux-10
      pack_id: disappearing-voice
      learning_lens: RECEPTION_CANONIQUE
      source_layer: canonical
      formation_goal: "Reconnaître une relecture chrétienne sans effacer le premier psaume."
      scripture_references: ["Psaume 102:26-28", "Hébreux 1:10-12"]
      claim_ids: [exeg-021]
      prompt: "Dans Hébreux 1, ces mots du Psaume 102 parlent de qui ?"
      choices:
        - { id: a, text: "Du Fils", diagnosis: correct_reception }
        - { id: b, text: "Du chanteur anonyme", diagnosis: layers_confused }
        - { id: c, text: "De Melchisédek", diagnosis: wrong_reception }
      correct_choice: a
      correction: "Hébreux applique au Fils les mots sur celui qui demeure. Cela ne fait pas de toute la plainte la voix de Jésus."

    - id: ps110-roles-01
      pack_id: nameless-king
      learning_lens: RECIT_DU_TEXTE
      source_layer: textual
      formation_goal: "Identifier la combinaison qui crée l’énigme du psaume."
      scripture_references: ["Psaume 110:1-4"]
      claim_ids: [exeg-004]
      prompt: "Quels deux rôles le Psaume 110 réunit-il ?"
      choices:
        - { id: a, text: "Roi et prêtre", diagnosis: correct_roles }
        - { id: b, text: "Prophète et juge", diagnosis: imported_roles }
        - { id: c, text: "Scribe et soldat", diagnosis: invented_roles }
      correct_choice: a
      correction: "Une première parole concerne un roi ; une seconde le déclare prêtre selon Melchisédek."
    - id: ps110-roi-inconnu-02
      pack_id: nameless-king
      learning_lens: PERSONNAGES
      source_layer: historical
      formation_goal: "Apprendre à respecter un personnage que le texte ne nomme pas."
      scripture_references: ["Psaume 110:1-7"]
      claim_ids: [hist-001, hist-005]
      prompt: "Le texte permet-il de nommer ce roi avec certitude ?"
      choices:
        - { id: a, text: "Non, il reste inconnu", diagnosis: correct_uncertainty }
        - { id: b, text: "Oui, c’est David", diagnosis: title_as_biography }
        - { id: c, text: "Oui, c’est Salomon", diagnosis: invented_identity }
      correct_choice: a
      correction: "Le titre transmis l’associe à David, mais le roi visé et la première scène historique restent inconnus."
    - id: ps110-droite-03
      pack_id: nameless-king
      learning_lens: LECTURE_DU_TEXTE
      source_layer: textual
      formation_goal: "Voir l’autorité accordée au personnage royal."
      scripture_references: ["Psaume 110:1"]
      claim_ids: [exeg-004]
      prompt: "Où Dieu invite-t-il ce seigneur à s’asseoir ?"
      choices:
        - { id: a, text: "À sa droite", diagnosis: correct_position }
        - { id: b, text: "Derrière l’autel", diagnosis: invented_location }
        - { id: c, text: "Hors de Jérusalem", diagnosis: invented_exile }
      correct_choice: a
      correction: "La droite représente ici une place d’autorité accordée par Dieu."
    - id: ps110-melchisedek-04
      pack_id: nameless-king
      learning_lens: PERSONNAGES
      source_layer: textual
      formation_goal: "Comprendre pourquoi le nom de Melchisédek ouvre une enquête."
      scripture_references: ["Psaume 110:4"]
      claim_ids: [exeg-004]
      prompt: "Pourquoi Melchisédek surprend-il au verset 4 ?"
      choices:
        - { id: a, text: "Le roi devient aussi prêtre", diagnosis: correct_tension }
        - { id: b, text: "Il détruit Jérusalem", diagnosis: invented_action }
        - { id: c, text: "Il écrit le psaume", diagnosis: invented_authorship }
      correct_choice: a
      correction: "Le serment ajoute un rôle sacerdotal au roi. Le rapport historique exact à Melchisédek reste discuté."
    - id: ps110-fin-05
      pack_id: nameless-king
      learning_lens: LECTURE_DU_TEXTE
      source_layer: textual
      formation_goal: "Ne pas arrêter la lecture avant la violence finale."
      scripture_references: ["Psaume 110:5-7"]
      claim_ids: [exeg-004]
      prompt: "Le psaume finit-il avec le serment sacerdotal ?"
      choices:
        - { id: a, text: "Non, il poursuit vers le combat", diagnosis: correct_difficult_ending }
        - { id: b, text: "Oui, tout s’arrête là", diagnosis: truncated_reading }
        - { id: c, text: "Non, il raconte l’exil", diagnosis: wrong_ending }
      correct_choice: a
      correction: "Après le serment, le poème poursuit avec une victoire violente. L’expédition ne doit pas l’effacer."
    - id: ps110-scene-06
      pack_id: nameless-king
      learning_lens: MONDE_HISTORIQUE
      source_layer: historical
      formation_goal: "Distinguer atmosphère royale et reconstitution certaine."
      scripture_references: ["Psaume 110:1-7"]
      claim_ids: [hist-005]
      prompt: "Que reste-t-il inconnu derrière cette scène royale ?"
      choices:
        - { id: a, text: "Le roi et la cérémonie", diagnosis: correct_unknowns }
        - { id: b, text: "Le nom de Jérusalem", diagnosis: false_unknown }
        - { id: c, text: "L’existence de la royauté", diagnosis: false_unknown }
      correct_choice: a
      correction: "Le psaume est royal, mais il ne permet pas de reconstruire avec certitude le roi ni la cérémonie."
    - id: ps110-matthieu-07
      pack_id: nameless-king
      learning_lens: RECEPTION_CANONIQUE
      source_layer: canonical
      formation_goal: "Suivre l’énigme que Jésus tire du premier verset."
      scripture_references: ["Psaume 110:1", "Matthieu 22:41-46"]
      claim_ids: [exeg-021]
      prompt: "Dans Matthieu 22, quelle énigme Jésus pose-t-il ?"
      choices:
        - { id: a, text: "David appelle son fils Seigneur", diagnosis: correct_riddle }
        - { id: b, text: "Moïse refuse d’être roi", diagnosis: wrong_character }
        - { id: c, text: "Salomon devient prophète", diagnosis: wrong_reception }
      correct_choice: a
      correction: "Jésus demande comment le Messie peut être fils de David si David l’appelle aussi Seigneur."
    - id: ps110-hebreux5-08
      pack_id: nameless-king
      learning_lens: PLAN_DE_DIEU
      source_layer: canonical
      formation_goal: "Relier le serment du psaume au rôle salvateur du Christ."
      scripture_references: ["Psaume 110:4", "Hébreux 5:5-10"]
      claim_ids: [exeg-021]
      prompt: "Dans Hébreux 5, qui est le prêtre pour toujours ?"
      choices:
        - { id: a, text: "Jésus-Christ", diagnosis: correct_christ }
        - { id: b, text: "Le roi historique certain", diagnosis: layers_confused }
        - { id: c, text: "Le chanteur du psaume", diagnosis: wrong_voice }
      correct_choice: a
      correction: "Hébreux reprend le serment pour le Christ et le nomme auteur d’un salut éternel."
    - id: ps110-hebreux7-09
      pack_id: nameless-king
      learning_lens: ESPERANCE_ETERNELLE
      source_layer: canonical
      formation_goal: "Comprendre l’espérance attachée à l’intercession durable du Christ."
      scripture_references: ["Psaume 110:4", "Hébreux 7:23-25"]
      claim_ids: [exeg-021]
      prompt: "Selon Hébreux 7, pourquoi peut-il sauver pleinement ?"
      choices:
        - { id: a, text: "Il vit toujours et intercède", diagnosis: correct_eternal_intercession }
        - { id: b, text: "Il gagne chaque bataille", diagnosis: military_reduction }
        - { id: c, text: "Il ignore toute faiblesse", diagnosis: false_priesthood }
      correct_choice: a
      correction: "Hébreux fonde cette espérance sur le Christ vivant toujours pour intercéder."
    - id: ps110-lds-10
      pack_id: nameless-king
      learning_lens: PLAN_DE_DIEU
      source_layer: doctrinal
      formation_goal: "Identifier la lecture LDS tout en la gardant dans sa couche."
      scripture_references: ["Psaume 110:4", "Alma 13", "D&A 84", "D&A 107"]
      claim_ids: [exeg-022]
      prompt: "Dans la lecture LDS, quel ordre éclaire ce serment ?"
      choices:
        - { id: a, text: "L’ordre du Fils de Dieu", diagnosis: correct_lds_reception }
        - { id: b, text: "L’ordre des rois de Juda", diagnosis: invented_order }
        - { id: c, text: "L’ordre des scribes", diagnosis: invented_order }
      correct_choice: a
      correction: "Alma et Doctrine et Alliances relient cet ordre au Fils de Dieu et à la prêtrise de Melchisédek."

    - id: ps116-appel-01
      pack_id: cry-stone-seek
      learning_lens: RECIT_DU_TEXTE
      source_layer: textual
      formation_goal: "Voir le premier geste de la voix prise par la mort."
      scripture_references: ["Psaume 116:1-4"]
      claim_ids: [exeg-005]
      prompt: "Quand la mort l’enserre, que fait d’abord la voix ?"
      choices:
        - { id: a, text: "Elle appelle Dieu", diagnosis: correct_first_act }
        - { id: b, text: "Elle cache sa peur", diagnosis: avoidance }
        - { id: c, text: "Elle promet de tout contrôler", diagnosis: self_sufficiency }
      correct_choice: a
      correction: "Son cri tient en peu de mots : elle appelle le nom de Dieu et demande d’être délivrée."
    - id: ps116-public-02
      pack_id: cry-stone-seek
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Suivre le passage du cri privé à la gratitude publique."
      scripture_references: ["Psaume 116:12-19"]
      claim_ids: [exeg-005]
      prompt: "Après la délivrance, où porte-t-elle sa gratitude ?"
      choices:
        - { id: a, text: "Devant tout le peuple", diagnosis: correct_public_thanks }
        - { id: b, text: "Dans un lieu secret", diagnosis: private_only }
        - { id: c, text: "Devant les armées", diagnosis: invented_audience }
      correct_choice: a
      correction: "La voix accomplit ses vœux publiquement et transforme sa délivrance en témoignage partagé."
    - id: ps117-nations-03
      pack_id: cry-stone-seek
      learning_lens: PLAN_DE_DIEU
      source_layer: textual
      formation_goal: "Voir l’horizon universel d’un psaume très court."
      scripture_references: ["Psaume 117:1-2"]
      claim_ids: [exeg-006]
      prompt: "Qui le Psaume 117 invite-t-il à louer Dieu ?"
      choices:
        - { id: a, text: "Toutes les nations", diagnosis: correct_universal_call }
        - { id: b, text: "Seulement les prêtres", diagnosis: narrowed_call }
        - { id: c, text: "Seulement Jérusalem", diagnosis: narrowed_place }
      correct_choice: a
      correction: "En deux versets, le psaume appelle toutes les nations et tous les peuples."
    - id: ps117-romains-04
      pack_id: cry-stone-seek
      learning_lens: RECEPTION_CANONIQUE
      source_layer: canonical
      formation_goal: "Comprendre pourquoi Paul reprend l’appel aux nations."
      scripture_references: ["Psaume 117:1", "Romains 15:7-13"]
      claim_ids: [exeg-021]
      prompt: "Pourquoi Paul reprend-il le Psaume 117 dans Romains 15 ?"
      choices:
        - { id: a, text: "Les nations louent Dieu", diagnosis: correct_gentile_inclusion }
        - { id: b, text: "Le Temple doit être rebâti", diagnosis: wrong_context }
        - { id: c, text: "David doit devenir prêtre", diagnosis: wrong_psalm }
      correct_choice: a
      correction: "Paul y voit les nations accueillies avec le peuple de Dieu dans la louange et l’espérance."
    - id: ps118-pierre-05
      pack_id: cry-stone-seek
      learning_lens: LECTURE_DU_TEXTE
      source_layer: textual
      formation_goal: "Reconnaître le renversement de la pierre rejetée."
      scripture_references: ["Psaume 118:22-23"]
      claim_ids: [exeg-007]
      prompt: "Que devient la pierre rejetée du Psaume 118 ?"
      choices:
        - { id: a, text: "La pierre principale", diagnosis: correct_reversal }
        - { id: b, text: "Une pierre oubliée", diagnosis: rejection_final }
        - { id: c, text: "Une arme de guerre", diagnosis: invented_use }
      correct_choice: a
      correction: "Ce que les bâtisseurs avaient rejeté devient la pierre dont la construction dépend."
    - id: ps118-actes-06
      pack_id: cry-stone-seek
      learning_lens: PLAN_DE_DIEU
      source_layer: canonical
      formation_goal: "Relier la pierre au Christ ressuscité et au salut."
      scripture_references: ["Psaume 118:22", "Actes 4:10-12"]
      claim_ids: [exeg-021]
      prompt: "Dans Actes 4, qui devient cette pierre ?"
      choices:
        - { id: a, text: "Jésus-Christ", diagnosis: correct_christological_reception }
        - { id: b, text: "Pierre l’apôtre", diagnosis: wordplay_confusion }
        - { id: c, text: "Le roi du Psaume 110", diagnosis: psalms_confused }
      correct_choice: a
      correction: "Pierre applique l’image à Jésus ressuscité et affirme que le salut se trouve en lui."
    - id: ps119-return-07
      pack_id: cry-stone-seek
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Revenir à Dieu sans attendre d’avoir repris le contrôle."
      scripture_references: ["Psaume 119:176"]
      claim_ids: [exeg-008]
      prompt: "Tu as raté trois jours. Que faire d’après la fin du Psaume 119 ?"
      choices:
        - { id: a, text: "Me cacher jusqu’à aller mieux", diagnosis: shame_performance }
        - { id: b, text: "Me promettre de ne plus échouer", diagnosis: self_perfection }
        - { id: c, text: "Demander à Dieu de me chercher", diagnosis: correct_return }
        - { id: d, text: "Abandonner le chemin", diagnosis: discouragement }
      correct_choice: c
      correction: "La voix ne dit pas qu’elle a réussi. Elle reconnaît s’être perdue et demande à Dieu de la chercher."
    - id: ps119-teach-08
      pack_id: cry-stone-seek
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      formation_goal: "Demander d’être enseigné au lieu de simuler la maîtrise."
      scripture_references: ["Psaume 119:12", "Psaume 119:33-34", "Psaume 119:125"]
      claim_ids: [exeg-008]
      prompt: "Ton esprit part ailleurs. Quel réflexe revient dans le Psaume 119 ?"
      choices:
        - { id: a, text: "Faire comme si j’avais compris", diagnosis: spiritual_appearance }
        - { id: b, text: "Demander à Dieu de m’enseigner", diagnosis: correct_request }
        - { id: c, text: "Arrêter dès que je me disperse", diagnosis: all_or_nothing }
        - { id: d, text: "Réciter pour mériter son aide", diagnosis: merit_logic }
      correct_choice: b
      correction: "Le psaume revient à cette demande : enseigne-moi, donne-moi de comprendre et fais-moi vivre."
    - id: ps119-order-09
      pack_id: cry-stone-seek
      learning_lens: LECTURE_DU_TEXTE
      source_layer: textual
      formation_goal: "Utiliser la discipline comme aide, jamais comme preuve de valeur."
      scripture_references: ["Psaume 119:1-176"]
      claim_ids: [hist-008, exeg-008]
      prompt: "Ta routine tient. Que rappelle pourtant la fin du Psaume 119 ?"
      choices:
        - { id: a, text: "Une routine empêche de se perdre", diagnosis: control }
        - { id: b, text: "L’ordre aide sans remplacer Dieu", diagnosis: correct_discipline }
        - { id: c, text: "Toute discipline est inutile", diagnosis: cynicism }
        - { id: d, text: "Dieu aide, donc je n’agis plus", diagnosis: passivity }
      correct_choice: b
      correction: "Le poème est très ordonné, mais il finit avec une brebis perdue. La discipline ne remplace pas Dieu."
    - id: ps119-help-10
      pack_id: cry-stone-seek
      learning_lens: DISCERNEMENT_DE_VIE
      source_layer: textual
