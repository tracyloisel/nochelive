# Canonical expedition-level manifest for the FAST Expedition Council.
# Pack productions live only in referenced pack files. Expedition-wide public
# editorial and visual productions live here and are never duplicated per pack.
schema_version: 1
kind: expedition_fast_manifest

lifecycle:
  status: draft # draft | running | awaiting_human_selection | blocked | complete
  runtime_mode: detached
  current_revision: 0
  human_approval_required: true
  publish_authorized: false
  created_at: "YYYY-MM-DD"
  updated_at: "YYYY-MM-DD"

brief:
  id: ""
  source_locale: fr
  output_locale: fr
  audience: ""
  target_pack_count: 1
  questions_per_pack: 10
  authorized_scope: full_expedition_authoring
  constraints: []

source:
  readings:
    - reference: ""
      label: ""
      url: ""
      required: true

council:
  current_stage: responsable_missionnaire
  sequence:
    - expedition-fast-responsable-missionnaire
  pack_sequence_template:
    - expedition-fast-influenceur
    - expedition-fast-mystique
    - expedition-fast-nouveau-baptise
    - expedition-fast-quiz
    - expedition-fast-voix
    - expedition-fast-directeur-mise-en-scene
    - expedition-fast-directeur-artistique-producteur
    - expedition-fast-critique-deux-secondes
    - expedition-fast-localisateur-voix
  section_owners:
    "brief": expedition-fast-responsable-missionnaire
    "source": expedition-fast-responsable-missionnaire
    "council": expedition-fast-responsable-missionnaire
    "packs": expedition-fast-responsable-missionnaire
    "fast.agent_memory.responsable_missionnaire": expedition-fast-responsable-missionnaire
    "fast.result.missionary_source_map": expedition-fast-responsable-missionnaire
    "fast.result.missionary_architectures": expedition-fast-responsable-missionnaire
    "fast.result.approved_source_scope": expedition-fast-responsable-missionnaire
    "fast.public_editorial": human
    "fast.visual_staging_contract": human
    "fast.visual_requirements": human
    "fast.visual_proof_approval": human
    "fast.agent_memory.mise_en_scene_visuelle": expedition-fast-directeur-mise-en-scene
    "fast.result.visual_staging": expedition-fast-directeur-mise-en-scene
    "fast.agent_memory.direction_artistique": expedition-fast-directeur-artistique-producteur
    "fast.result.visual_production": expedition-fast-directeur-artistique-producteur
    "fast.agent_memory.critique_deux_secondes": expedition-fast-critique-deux-secondes
    "fast.result.visual_proof_review": expedition-fast-critique-deux-secondes
    "fast.source_scope_approval": human
  revision_log: []
  objections: []

packs: []

fast:
  status: draft
  public_editorial:
    owner: human
    status: pending
    source_locale: fr
    required_locales: [fr, es, en, pt-BR]
    expedition: {}
    rama_headline: {}
    library_days: []
  visual_staging_contract:
    owner: human
    source_policy:
      quiz_prompt_is_source: false
      resolve_each_unique_reference_once: true
      deduplicate_in_source_library: true
    representation_modes: [iconic_symbol, human_dramaturgy, historical_cinematic, environmental_world]
    visual_treatments: [cinematic_realism, biblical_illustration]
    max_words_per_concept_excluding_ids_and_references: 160
    generation_authorized: false
    proof_generation:
      authorized_by_council_contract: true
      human_approval_before_first_proof: false
      max_calls_before_human_review: 1
      selection_owner: expedition-fast-directeur-artistique-producteur
      human_approval_after_critic: true
  visual_requirements:
    owner: human
    scope: expedition
    production_owner: expedition-fast-directeur-artistique-producteur
    revision: 1
    status: approved_cost_optimized_contract
    generation_authorized: false
    creative_master_policy:
      default_canvas: { ratio: "1:1", width: 2160, height: 2160 }
      master_file_format: png
      common_safe_region_required: true
      responsive_derivatives_are_new_generations: false
      additional_composition_requires_documented_surface_failure: true
      additional_composition_requires_human_authorization: true
    derivative_targets:
      portrait: { ratio: "9:16", width: 1080, height: 1920 }
      tablet: { ratio: "4:5", width: 1440, height: 1800 }
      landscape: { ratio: "16:9", width: 1920, height: 1080 }
    surfaces:
      library:
        required: true
        units: 7
        creative_masters_per_unit: 1
        approved_quiz_asset_reuse_preferred: true
        maximum_new_creative_master_count: 7
        derivative_targets: [portrait, tablet, landscape]
      campaign_key_art:
        required: true
        units: 1
        creative_masters_per_unit: 1
        expected_new_creative_master_count: 1
        shared_by: [expedition_key_art, rama_hero, home_expedition]
        derivative_targets: [portrait, tablet, landscape]
      rama_headline:
        required: true
        asset_kind: live_html_copy
        required_locales: [fr, es, en, pt-BR]
        baked_into_artwork: false
        expected_image_master_count: 0
      expedition_pack_art:
        required: true
        source: first_approved_quiz_master_per_pack
        expected_new_creative_master_count: 0
        dedicated_master: only_after_documented_map_surface_failure
      home_expedition:
        required: true
        source: campaign_key_art
        expected_new_creative_master_count: 0
    maximum_new_creative_master_count: 8
    generation_count_is_a_ceiling_not_a_target: true
  visual_proof_approval:
    owner: human
    status: pending
    proof_output_path: ""
    critic_verdict: ""
    decision: ""
    authorized_batch: {}
  source_scope_approval:
    owner: human
    status: pending # pending | awaiting_human_selection | approved | revision_requested
    candidate_architecture_ids: []
    selected_architecture_id: ""
    amendments: []
    approved_pack_plan: []
    excluded_sources: []
    decision: ""
    approved_on: ""
  agent_memory:
    responsable_missionnaire:
      owner: expedition-fast-responsable-missionnaire
      revision: 0
      status: pending
      production: |-

    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 0
      status: pending
      production: |-

    direction_artistique:
      owner: expedition-fast-directeur-artistique-producteur
      revision: 0
      status: pending
      production: |-

    critique_deux_secondes:
      owner: expedition-fast-critique-deux-secondes
      revision: 0
      status: pending
      production: |-

  result:
    missionary_source_map: []
    missionary_architectures: []
    approved_source_scope:
      status: pending
      architecture_id: ""
      missionary_promise: ""
      spiritual_movement: {}
      packs: []
      excluded_sources: []
      human_amendments: []
    visual_staging:
      status: pending
      generation_authorized: false
      source_library: {}
      visual_concepts: []
      expedition_rhythm: {}
      blocked_missing_semantic_content: []
      blocked_missing_source: []
    visual_production:
      status: pending
      production_mode: proof_only
      full_batch_authorized: false
      proof: {}
      generation_records: []
      manifests: []
    visual_proof_review:
      status: pending
      proof_output_path: ""
      surface_preview_paths: {}
      cold_read: {}
      checks: {}
      verdict: ""
      observed_failures: []
      required_changes: []
      recommendation: ""
