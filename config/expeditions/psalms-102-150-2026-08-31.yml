facts:
  historical:
    owner: expedition-historian
    revision: 1
    status: complete
    sources:
      - id: src-hist-yale
        institution: "Yale Divinity School — Yale Bible Study"
        title: "What Are the Psalms?"
        url: "https://yalebiblestudy.org/courses/psalms/lessons/what-are-the-psalms-study-guide/"
        consulted_on: "2026-08-30"
        limits: "Synthèse universitaire; ne date pas chaque psaume."
      - id: src-hist-11q5
        institution: "Israel Antiquities Authority"
        title: "11Q Psalms Scroll — 11Q5"
        url: "https://www.deadseascrolls.org.il/explore-the-archive/manuscript/11Q5-2?locale=en_US"
        consulted_on: "2026-08-30"
        limits: "Un manuscrit ne représente pas tous les groupes juifs anciens."
      - id: src-hist-loc
        institution: "Library of Congress"
        title: "Scrolls from the Dead Sea — Introduction"
        url: "https://www.loc.gov/exhibits/scrolls/intr.html"
        consulted_on: "2026-08-30"
        limits: "Notice d'exposition, sans apparat critique complet."
      - id: src-hist-royal
        institution: "Yale Divinity School — Yale Bible Study"
        title: "The Royal Psalms"
        url: "https://yalebiblestudy.org/courses/psalms/lessons/the-royal-psalms-study-guide/"
        consulted_on: "2026-08-30"
        limits: "Le genre royal ne permet pas d'identifier un roi ou une cérémonie."
      - id: src-hist-melchizedek
        institution: "Oxford University Press"
        title: "Psalm 110: From Davidic King to Melchizedek"
        url: "https://academic.oup.com/book/32343/chapter-abstract/268596194"
        consulted_on: "2026-08-30"
        limits: "Résumé libre uniquement; signale les ambiguïtés sans les résoudre."
      - id: src-hist-hallel
        institution: "Project TABS — TheTorah.com"
        title: "Hallel: How Many Psalms?"
        url: "https://www.thetorah.com/article/hallel-how-many-psalms"
        consulted_on: "2026-08-30"
        limits: "L'usage reçu ne doit pas être rétrojeté intact dans le Premier Temple."
      - id: src-hist-ascents
        institution: "University of St Andrews"
        title: "Pilgrimage — Songs of Ascents"
        url: "https://www.saet.ac.uk/Christianity/Pilgrimage"
        consulted_on: "2026-08-30"
        limits: "Le pèlerinage est l'hypothèse principale, pas un itinéraire documenté."
      - id: src-hist-usccb
        institution: "United States Conference of Catholic Bishops"
        title: "Psalms — texts and scholarly notes"
        url: "https://bible.usccb.org/bible/psalms/102"
        consulted_on: "2026-08-30"
        limits: "Les notes de genre et contexte ne constituent pas une datation indépendante."
      - id: src-hist-babylon
        institution: "British Museum"
        title: "Babylonian Chronicle tablet 21946"
        url: "https://www.britishmuseum.org/collection/object/W_1896-0409-51"
        consulted_on: "2026-08-30"
        limits: "Atteste la campagne de 597 avant notre ère; ne date pas le Psaume 137."
      - id: src-hist-music
        institution: "The Bible and Interpretation — University of Arizona"
        title: "Music and Musical Instruments in the Hebrew Bible"
        url: "https://bibleinterp.arizona.edu/articles/Music"
        consulted_on: "2026-08-30"
        limits: "Les comparaisons régionales ne restituent ni instruments ni sons exacts du Temple."
    claims:
      - id: hist-001
        certainty: ATTESTÉ
        statement: "Les titres reçus associent 103, 110, 138 et 139 à David, et 127 à Salomon; 102 ne nomme aucun auteur."
        source_ids: [src-hist-yale, src-hist-usccb]
        allowed_copy: "Le titre transmis associe ce psaume à David ou Salomon; l'auteur historique demeure inconnu."
        forbidden_copy: ["David écrit la scène montrée.", "Salomon compose 127 pendant la construction du Temple."]
        depiction_mode: textual_superscription_only
        quiz_eligible: true
      - id: hist-002
        certainty: INCERTAIN
        statement: "La date précise de la plupart de ces psaumes ne peut être établie."
        source_ids: [src-hist-yale]
        allowed_copy: "Conservé depuis l'Antiquité; horizon exilique ou postexilique probable lorsque précisé."
        forbidden_copy: ["Écrit il y a exactement trois mille ans.", "Tous appartiennent à la même époque."]
        depiction_mode: atmosphere_without_dated_event
        quiz_eligible: true
      - id: hist-003
        certainty: ATTESTÉ
        statement: "11Q5 conserve de nombreux psaumes de la zone 101–150 dans un ordre différent, avec d'autres compositions."
        source_ids: [src-hist-11q5, src-hist-loc]
        allowed_copy: "Un ancien rouleau place plusieurs de ces psaumes dans un autre ordre."
        forbidden_copy: ["Qumran possédait le seul vrai Psautier.", "Des psaumes ont été cachés."]
        depiction_mode: attested_manuscript
        quiz_eligible: true
      - id: hist-004
        certainty: PROBABLE
        statement: "Le Psaume 102 est une plainte anonyme dont les pierres, la poussière et Sion rendent plausible un horizon de destruction et restauration."
        source_ids: [src-hist-usccb, src-hist-yale]
        allowed_copy: "Sa douleur personnelle se mêle à une ville qui attend d'être relevée."
        forbidden_copy: ["Un déporté nommé écrit depuis Babylone.", "Un diagnostic médical précis."]
        depiction_mode: anonymous_restoration_atmosphere
        quiz_eligible: true
      - id: hist-005
        certainty: PROBABLE
        statement: "Le Psaume 110 est royal et reflète probablement l'idéologie monarchique de Juda; le roi et la cérémonie restent inconnus."
        source_ids: [src-hist-royal, src-hist-melchizedek]
        allowed_copy: "Une voix s'adresse à un roi placé sous l'autorité divine. Mais lequel?"
        forbidden_copy: ["Couronnement historique de David.", "Melchisédek couronne David."]
        depiction_mode: royal_mystery
        quiz_eligible: true
      - id: hist-006
        certainty: INCERTAIN
        statement: "La traduction de Psaume 110:4, le statut sacerdotal et le rapport originel à Melchisédek restent discutés."
        source_ids: [src-hist-melchizedek]
        allowed_copy: "Pourquoi ce roi est-il aussi prêtre, et que vient faire Melchisédek ici?"
        forbidden_copy: ["Un ordre sacerdotal historique univoque est déjà organisé."]
        depiction_mode: competing_readings
        quiz_eligible: false
      - id: hist-007
        certainty: TRADITION
        statement: "Dans la liturgie juive reçue, 113–118 forment le Hallel; 116–118 en constituent la fin."
        source_ids: [src-hist-hallel]
        allowed_copy: "Ces psaumes vivent dans le Hallel des fêtes juives."
        forbidden_copy: ["Rite identique attesté dans le Temple de Salomon."]
        depiction_mode: later_liturgical_tradition
        quiz_eligible: true
      - id: hist-008
        certainty: ATTESTÉ
        statement: "Psaume 119 est un acrostiche de vingt-deux strophes de huit vers selon les lettres hébraïques."
        source_ids: [src-hist-usccb]
        allowed_copy: "Cent soixante-seize vers cachent une architecture alphabétique."
        forbidden_copy: ["Un scribe identifié l'a composé dans une école précise."]
        depiction_mode: scribal_visualization
        quiz_eligible: true
      - id: hist-009
        certainty: PROBABLE
        statement: "Les Chants des montées 120–134, dont 127–128, sont généralement associés aux pèlerinages vers Jérusalem."
        source_ids: [src-hist-ascents]
        allowed_copy: "Une collection longtemps associée à la montée vers Jérusalem."
        forbidden_copy: ["Chaque psaume correspond à une marche ou étape certaine."]
        depiction_mode: labeled_probable_pilgrimage
        quiz_eligible: true
      - id: hist-010
        certainty: PROBABLE
        statement: "La porte de Psaume 127:5 est probablement l'espace civique et judiciaire, pas un rempart de bataille."
        source_ids: [src-hist-usccb]
        allowed_copy: "La porte est aussi le lieu où la cité règle ses affaires."
        forbidden_copy: ["Les fils tirent des flèches depuis les remparts."]
        depiction_mode: civic_city_gate
        quiz_eligible: true
      - id: hist-011
        certainty: PROBABLE
        statement: "Le refrain répété vingt-six fois en Psaume 136 suggère une performance antiphonale."
        source_ids: [src-hist-usccb]
        allowed_copy: "Une voix pouvait raconter et l'assemblée répondre."
        forbidden_copy: ["Voici le rythme authentique et l'effectif exact."]
        depiction_mode: probable_call_and_response
        quiz_eligible: true
      - id: hist-012
        certainty: PROBABLE
        statement: "Psaume 137 provient très probablement d'un contexte babylonien après la chute de Jérusalem; ni chanteur, ni canal, ni date exacte ne sont connus."
        source_ids: [src-hist-usccb, src-hist-babylon]
        allowed_copy: "À Babylone, des exilés refusent de transformer leurs chants de Sion en divertissement."
        forbidden_copy: ["Un musicien nommé sur une rive exacte.", "Écrit le jour même de la chute."]
        depiction_mode: probable_exilic_collective_memory
        quiz_eligible: true
      - id: hist-013
        certainty: ATTESTÉ
        statement: "Psaume 137 se termine par une imprécation extrême; il ne rapporte pas l'exécution de cette violence."
        source_ids: [src-hist-usccb]
        allowed_copy: "Le chant conserve une colère que le lecteur préférerait peut-être ne pas entendre."
        forbidden_copy: ["Violence graphique contre des enfants.", "Ordre contemporain."]
        depiction_mode: non_graphic_trauma_memory
        quiz_eligible: false
      - id: hist-014
        certainty: PROBABLE
        statement: "La reconstruction de Jérusalem en Psaume 147 rend un horizon postexilique très probable sans identifier un chantier."
        source_ids: [src-hist-usccb]
        allowed_copy: "Après la dispersion, Jérusalem se rebâtit et les blessés sont rassemblés."
        forbidden_copy: ["Néhémie dirige la scène.", "Une année de composition précise."]
        depiction_mode: probable_postexilic_restoration
        quiz_eligible: true
      - id: hist-015
        certainty: INCERTAIN
        statement: "La situation de Psaume 149 et la relation entre louange et combat réel sont inconnues."
        source_ids: [src-hist-usccb]
        allowed_copy: "La louange place soudain une épée dans l'image — pourquoi?"
        forbidden_copy: ["Bataille inventée.", "Peuple moderne visé.", "Appel contemporain à la violence."]
        depiction_mode: symbolic_non_graphic_tension
        quiz_eligible: false
      - id: hist-016
        certainty: ATTESTÉ
        statement: "Psaume 150 nomme cor, cordes, tambour, danse, souffle et cymbales; leurs équivalents et sons exacts sont parfois incertains."
        source_ids: [src-hist-music]
        allowed_copy: "Tout ce qui peut sonner, puis tout ce qui respire."
        forbidden_copy: ["Reconstruction sonore authentique du Temple.", "Harpe moderne identifiée avec certitude."]
        depiction_mode: comparative_archaeology_only
        quiz_eligible: true
    unknowns:
      - "Aucun auteur historique certain pour les dix-neuf psaumes."
      - "Aucune chronologie unique ni événement commun à tout le corpus."
      - "Aucun héros nommé autorisé pour Psaumes 102, 116, 118, 137–139."
      - "Aucun Temple, costume, orchestre ou cérémonie précisément datable."
    preventive_vetoes:
      - { id: veto-hist-authorship, reason: "Superscription transformée en biographie.", status: open_preventive }
      - { id: veto-hist-110, reason: "Lecture de Melchisédek transformée en archive univoque.", status: open_preventive }
      - { id: veto-hist-137, reason: "Trauma et violence exploités graphiquement.", status: open_preventive }
      - { id: veto-hist-149, reason: "Psaume converti en propagande militaire.", status: open_preventive }
      - { id: veto-hist-music, reason: "Évocation sonore appelée reconstruction authentique.", status: open_preventive }
  exegetical:
    owner: expedition-exegete
    revision: 1
    status: complete
    sources:
      - id: src-text-psalms-fr
        institution: "Église de Jésus-Christ des Saints des Derniers Jours"
        title: "Livre des Psaumes — texte français"
        url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps?lang=fra"
        consulted_on: "2026-08-30"
        limits: "Les résumés éditoriaux ne font pas partie des versets."
      - id: src-cfm-2026
        institution: "Église de Jésus-Christ des Saints des Derniers Jours"
        title: "31 août–6 septembre — Que tout ce qui respire loue l'Éternel !"
        url: "https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/36?lang=fra"
        consulted_on: "2026-08-30"
        limits: "Réception spirituelle LDS, pas reconstruction du premier contexte."
      - id: src-lds-helps
        institution: "Église de Jésus-Christ des Saints des Derniers Jours"
        title: "Scripture Helps — Psalms 102–150"
        url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng"
        consulted_on: "2026-08-30"
        limits: "Les lectures christologiques sont une réception doctrinale explicite."
      - id: src-exeg-yale-poetry
        institution: "Yale Divinity School — Yale Bible Study"
        title: "Psalms as Poetry"
        url: "https://yalebiblestudy.org/courses/psalms/lessons/psalms-of-poetry-study-guide/"
        consulted_on: "2026-08-30"
        limits: "Les fonctions proposées pour les acrostiches restent interprétatives."
      - id: src-exeg-melchizedek
        institution: "Project TABS — TheTorah.com"
        title: "Who Assumed Melchizedek's Priesthood?"
        url: "https://www.thetorah.com/article/who-assumed-melchizedeks-priesthood"
        consulted_on: "2026-08-30"
        limits: "Présente plusieurs lectures sans résoudre le destinataire initial."
      - id: src-exeg-137
        institution: "Project TABS — TheTorah.com"
        title: "Violent Fantasies on the Rivers of Babylon"
        url: "https://www.thetorah.com/symposium/psalm-137-9"
        consulted_on: "2026-08-30"
        limits: "Réunit plusieurs lectures contemporaines de l'imprécation."
    claims:
      - id: exeg-001
        certainty: ATTESTÉ
        statement: "Le corpus réunit plusieurs genres et voix; il ne forme pas un récit historique continu."
        references: ["Psaumes 102–103; 110; 116–119; 127–128; 135–139; 146–150"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Dix-neuf chants, plusieurs voix, un chemin éditorial du cri vers la louange."
        forbidden_copy: ["L'histoire vraie d'un seul auteur."]
        quiz_eligible: true
      - id: exeg-002
        certainty: ATTESTÉ
        statement: "Psaume 102 passe du corps consumé et de la solitude au pivot « Mais toi », à Sion et aux générations futures."
        references: ["Psaume 102:1-29"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Ses jours partent en fumée; puis deux mots renversent l'horizon : « Mais toi »."
        forbidden_copy: ["Dieu le guérit immédiatement.", "La voix est David."]
        quiz_eligible: true
      - id: exeg-003
        certainty: ATTESTÉ
        statement: "Psaume 103 commande à l'âme de ne pas oublier, puis élargit la compassion de Dieu jusqu'à toutes ses œuvres."
        references: ["Psaume 103:1-22"]
        source_ids: [src-text-psalms-fr, src-lds-helps]
        allowed_copy: "La mémoire devient résistance : n'oublie aucun de ses bienfaits."
        forbidden_copy: ["Toute maladie disparaît immédiatement si la foi suffit."]
        quiz_eligible: true
      - id: exeg-004
        certainty: ATTESTÉ
        statement: "Psaume 110 contient deux oracles, royal puis sacerdotal, avant une conclusion violente de victoire."
        references: ["Psaume 110:1-7"]
        source_ids: [src-text-psalms-fr, src-exeg-melchizedek]
        allowed_copy: "Un roi reçoit un siège; un serment le déclare prêtre selon Melchisédek."
        forbidden_copy: ["Le premier destinataire est identifié avec certitude."]
        quiz_eligible: true
      - id: exeg-005
        certainty: ATTESTÉ
        statement: "Psaume 116 transforme les liens de la mort et un cri bref en repos, marche, coupe, vœux et action de grâce publique."
        references: ["Psaume 116:1-19"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Le cri tient en quelques mots; la réponse remplit les parvis."
        forbidden_copy: ["La coupe désigne explicitement la Sainte-Cène."]
        quiz_eligible: true
      - id: exeg-006
        certainty: ATTESTÉ
        statement: "Les deux versets de Psaume 117 convoquent toutes les nations et tous les peuples."
        references: ["Psaume 117:1-2"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Le chant le plus court ouvre l'horizon le plus vaste."
        forbidden_copy: ["Un psaume sans intrigue parce qu'il est court."]
        quiz_eligible: true
      - id: exeg-007
        certainty: ATTESTÉ
        statement: "Psaume 118 va de la détresse et de l'encerclement aux portes, à la pierre rejetée devenue principale et à la bénédiction de celui qui vient."
        references: ["Psaume 118:1-29"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Ils l'avaient rejetée; elle devient la pierre dont tout dépend."
        forbidden_copy: ["Le premier sens nomme explicitement Jésus."]
        quiz_eligible: true
      - id: exeg-008
        certainty: ATTESTÉ
        statement: "Psaume 119 compte 176 vers en vingt-deux strophes et finit par une brebis égarée qui demande à être cherchée."
        references: ["Psaume 119:1-176"]
        source_ids: [src-text-psalms-fr, src-exeg-yale-poetry]
        allowed_copy: "Il connaît toutes les lettres, mais sa dernière prière demande encore : cherche-moi."
        forbidden_copy: ["Un score de fidélité parfait.", "Le juste ne s'égare jamais."]
        quiz_eligible: true
      - id: exeg-009
        certainty: ATTESTÉ
        statement: "Psaume 127 oppose l'effort vain sans Dieu à ce que l'humain reçoit comme don; Psaume 128 va de la table au bien de Jérusalem."
        references: ["Psaumes 127–128"]
        source_ids: [src-text-psalms-fr, src-lds-helps]
        allowed_copy: "Maison, garde, travail, table et ville : qu'est-ce qui tient vraiment?"
        forbidden_copy: ["La fertilité mesure la justice.", "Toutes les familles doivent avoir la même forme."]
        quiz_eligible: true
      - id: exeg-010
        certainty: ATTESTÉ
        statement: "Psaume 135 oppose les actes de Dieu à des idoles dotées d'organes sans parole, vue, écoute ni souffle."
        references: ["Psaume 135:1-21"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Elles ont des yeux et une bouche, mais pas de souffle."
        forbidden_copy: ["Caricature de peuples voisins comme stupides."]
        quiz_eligible: true
      - id: exeg-011
        certainty: ATTESTÉ
        statement: "Chacun des vingt-six versets de Psaume 136 porte le même refrain, jusque dans les mémoires difficiles de violence."
        references: ["Psaume 136:1-26"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Vingt-six fois, la même réponse refuse de disparaître."
        forbidden_copy: ["La partition exacte du chœur est connue."]
        quiz_eligible: true
      - id: exeg-012
        certainty: ATTESTÉ
        statement: "Psaume 137 va des harpes suspendues et du refus de chanter à la fidélité à Jérusalem, puis à l'imprécation."
        references: ["Psaume 137:1-9"]
        source_ids: [src-text-psalms-fr, src-exeg-137]
        allowed_copy: "On leur ordonne de chanter la ville qu'on leur a détruite."
        forbidden_copy: ["La vengeance est héroïque.", "La violence est montrée."]
        quiz_eligible: false
      - id: exeg-013
        certainty: ATTESTÉ
        statement: "Psaume 138 élargit la louange aux rois mais revient à une voix encore au milieu de la détresse."
        references: ["Psaume 138:1-8"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "La confiance cohabite avec : ne m'abandonne pas."
        forbidden_copy: ["Rassemblement diplomatique historique de tous les rois."]
        quiz_eligible: true
      - id: exeg-014
        certainty: ATTESTÉ
        statement: "Psaume 139 est encadré par « sonder » et passe de la connaissance à la fuite impossible, la formation cachée, la haine, puis l'examen de soi."
        references: ["Psaume 139:1-24"]
        source_ids: [src-text-psalms-fr, src-lds-helps]
        allowed_copy: "Après avoir dénoncé le mal, la voix accepte d'être elle-même sondée."
        forbidden_copy: ["Poème uniquement doux sur l'estime de soi.", "La haine devient devoir chrétien."]
        quiz_eligible: true
      - id: exeg-015
        certainty: ATTESTÉ
        statement: "Psaume 146 oppose le souffle perdu des puissants au Dieu qui agit pour affamés, captifs, étrangers, orphelins et veuves."
        references: ["Psaume 146:1-10"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Les projets des puissants meurent avec leur souffle."
        forbidden_copy: ["Louange abstraite sans les vulnérables nommés."]
        quiz_eligible: true
      - id: exeg-016
        certainty: ATTESTÉ
        statement: "Psaume 147 joint reconstruction de Jérusalem, cœurs brisés, étoiles comptées et puissance militaire relativisée."
        references: ["Psaume 147:1-20"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Celui qui compte les étoiles s'arrête aussi devant un cœur brisé."
        forbidden_copy: ["La force physique déplaît toujours à Dieu."]
        quiz_eligible: true
      - id: exeg-017
        certainty: ATTESTÉ
        statement: "Psaume 148 fait descendre le chœur des astres vers météo, reliefs, animaux, rois, peuples, jeunes et vieux."
        references: ["Psaume 148:1-14"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Le chœur descend des étoiles jusqu'aux enfants."
        forbidden_copy: ["Cosmologie scientifique moderne."]
        quiz_eligible: true
      - id: exeg-018
        certainty: ATTESTÉ
        statement: "Psaume 149 bascule explicitement du chant, de la danse et des instruments vers le glaive et le jugement."
        references: ["Psaume 149:1-9"]
        source_ids: [src-text-psalms-fr, src-lds-helps]
        allowed_copy: "La louange danse, puis le poème place soudain un glaive dans la main du chœur."
        forbidden_copy: ["Le glaive signifie seulement la Bible.", "Autorisation de violence contemporaine."]
        quiz_eligible: false
      - id: exeg-019
        certainty: ATTESTÉ
        statement: "Psaume 150 répond où, pourquoi, comment et qui doit louer, jusqu'à tout ce qui respire."
        references: ["Psaume 150:1-6"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "L'instrument ultime n'est pas un objet : c'est tout ce qui respire."
        forbidden_copy: ["Partition ou chorégraphie historique exacte."]
        quiz_eligible: true
      - id: exeg-020
        certainty: PROBABLE
        statement: "L'expédition peut faire résonner un motif du souffle entre 135:17, 146:4 et 150:6, sans prétendre à un code intentionnel."
        references: ["Psaume 135:17", "Psaume 146:4", "Psaume 150:6"]
        source_ids: [src-text-psalms-fr]
        allowed_copy: "Les idoles n'ont pas de souffle; les puissants le perdent; à la fin, tout souffle devient louange."
        forbidden_copy: ["Un code hébreu secret relie les trois textes."]
        quiz_eligible: true
      - id: exeg-021
        certainty: ATTESTÉ
        statement: "Le Nouveau Testament relit Psaume 102 pour le Fils, 110 pour le Seigneur et prêtre, 117 pour les nations et 118 pour Jésus comme pierre."
        references: ["Hébreux 1", "Matthieu 22", "Actes 2", "Hébreux 5–7", "Romains 15", "Matthieu 21", "Actes 4", "1 Pierre 2"]
        source_ids: [src-cfm-2026, src-lds-helps]
        allowed_copy: "Des textes anciens deviennent des clés majeures de la lecture chrétienne du Christ."
        forbidden_copy: ["La réception ultérieure prouve chaque intention historique initiale."]
        quiz_eligible: true
      - id: exeg-022
        certainty: ATTESTÉ
        statement: "La réception LDS relie Psaume 110:4 au Christ et à la prêtrise selon l'ordre du Fils de Dieu."
        references: ["Alma 13", "Doctrine et Alliances 84", "Doctrine et Alliances 107"]
        source_ids: [src-lds-helps]
        allowed_copy: "Pour les saints des derniers jours, ce serment ouvre aussi sur la prêtrise selon l'ordre du Fils de Dieu."
        forbidden_copy: ["Cette lecture donne l'identité historique certaine du premier roi."]
        quiz_eligible: true
    literary_map:
      - { reference: "Psaumes 102–103", movement: "cri → mémoire", turn: "« Mais toi » puis « n'oublie aucun de ses bienfaits »", claim_ids: [exeg-002, exeg-003] }
      - { reference: "Psaume 110", movement: "roi → prêtre → jugement", turn: "le serment de Melchisédek", claim_ids: [exeg-004, exeg-021, exeg-022] }
      - { reference: "Psaumes 116–119", movement: "délivrance → monde entier → porte/pierre → parole", turn: "la brebis perdue après l'acrostiche parfait", claim_ids: [exeg-005, exeg-006, exeg-007, exeg-008] }
      - { reference: "Psaumes 127–128", movement: "effort → don → table → paix de la ville", turn: "la bénédiction sort de la maison", claim_ids: [exeg-009] }
      - { reference: "Psaumes 135–139", movement: "idoles sans souffle → refrain → chant refusé → présence qui sonde", turn: "la voix demande à être examinée", claim_ids: [exeg-010, exeg-011, exeg-012, exeg-013, exeg-014] }
      - { reference: "Psaumes 146–150", movement: "puissants mortels → cœur relevé → chœur cosmique → glaive → tout souffle", turn: "le vivant devient l'instrument final", claim_ids: [exeg-015, exeg-016, exeg-017, exeg-018, exeg-019, exeg-020] }
    reception_layers:
      - { id: reception-102, layer: NEW_TESTAMENT, source: "Psaume 102:25-27", receiving: "Hébreux 1:10-12", boundary: "Ne pas identifier toute la plainte à Jésus." }
      - { id: reception-110, layer: NEW_TESTAMENT_AND_LDS, source: "Psaume 110:1,4", receiving: "Matthieu 22; Actes 2; Hébreux 5–7; Alma 13; D&A 84,107", boundary: "Premier destinataire toujours discuté." }
      - { id: reception-117-118, layer: NEW_TESTAMENT, source: "Psaumes 117:1; 118:22,26", receiving: "Romains 15; Matthieu 21; Actes 4; 1 Pierre 2", boundary: "La première pierre reste ouverte." }
      - { id: reception-116-118, layer: JEWISH_LITURGY, source: "Psaumes 113–118", receiving: "Hallel", boundary: "Usage reçu, pas composition simultanée certaine." }
      - { id: reception-149, layer: LDS_STUDY_HELP, source: "Psaume 149:6", receiving: "D&A 6:2", boundary: "Lecture symbolique; le sens martial reste visible." }
    preventive_vetoes:
      - { id: veto-exeg-single-hero, reason: "Les voix ne forment pas la biographie d'un héros unique.", status: open_preventive }
      - { id: veto-exeg-110, reason: "Texte, réception chrétienne et réception LDS doivent rester stratifiés.", status: open_preventive }
      - { id: veto-exeg-137, reason: "Trauma et imprécation ne deviennent ni score ni spectacle.", status: open_preventive }
      - { id: veto-exeg-family, reason: "127–128 ne classent ni fertilité ni forme familiale.", status: open_preventive }
      - { id: veto-exeg-149, reason: "Le glaive n'est ni effacé ni transformé en consigne contemporaine.", status: open_preventive }
      - { id: veto-exeg-arc, reason: "Cri → louange est un arc éditorial, jamais une chronologie historique.", status: open_preventive }

concepts:
  candidates:
    - id: concept-a
      owner: expedition-showrunner
      revision: 2
      supersedes_revision: 1
      title: { fr: "Leurs voix nous atteignent encore" }
      promise:
        fr: "Dix-neuf chants, plusieurs voix : suivre ce qu'elles disent lorsque le corps s'épuise, que l'autorité devient mystérieuse, que la maison paraît fragile, que la ville est perdue ou que la louange rencontre la colère."
      human_question:
        fr: "Pourquoi des paroles venues de vies si différentes peuvent-elles encore devenir les nôtres ?"
      why_this_text_endures:
        fr: "L'expédition ne prétend pas expliquer par une cause unique pourquoi ces textes ont été conservés. Elle explore les gestes dans lesquels des lecteurs peuvent encore se reconnaître : crier, se souvenir, distinguer, structurer, bâtir, refuser, accepter d'être sondé et louer."
      dramatic_thesis:
        fr: "Aucune voix ne porte seule cette histoire; leur pluralité traverse effacement, mémoire, exil, ambiguïté et louange sans devenir une biographie continue."
      opening_image:
        fr: "Une voix anonyme, sans visage ni date, décrit ses jours qui partent en fumée et son cœur desséché; puis le poème pivote : « Mais toi »."
      opening_claim_ids: [exeg-002, hist-002, hist-004]
      emotional_arc: [effacement, mémoire, transmission, déracinement, vérité_difficile, héritage_vivant]
      proposed_pack_movements:
        - { order: 1, name: { fr: "La voix qui pensait disparaître" }, readings: ["Psaume 102", "Psaume 103"], movement: { fr: "Du corps consumé au refus d'oublier." }, claim_ids: [exeg-002, exeg-003, hist-004] }
        - { order: 2, name: { fr: "L'énigme transmise" }, readings: ["Psaume 110"], movement: { fr: "Un roi inconnu, un serment et des siècles de relectures." }, claim_ids: [hist-005, hist-006, exeg-004, exeg-021, exeg-022] }
        - { order: 3, name: { fr: "Donner une forme à la survie" }, readings: ["Psaume 116", "Psaume 117", "Psaume 118", "Psaume 119"], movement: { fr: "Le cri devient témoignage, horizon universel, pierre relevée puis alphabet de fidélité." }, claim_ids: [exeg-005, exeg-006, exeg-007, exeg-008, hist-007, hist-008] }
        - { order: 4, name: { fr: "Ce que l'on espère transmettre" }, readings: ["Psaume 127", "Psaume 128"], movement: { fr: "De l'effort insuffisant au don, à la table et au bien de la cité." }, claim_ids: [exeg-009, hist-009, hist-010] }
        - { order: 5, name: { fr: "Se souvenir sans falsifier la douleur" }, readings: ["Psaume 135", "Psaume 136", "Psaume 137", "Psaume 138", "Psaume 139"], movement: { fr: "Des idoles sans souffle au refrain, au chant refusé et à l'examen de soi." }, claim_ids: [exeg-010, exeg-011, exeg-012, exeg-013, exeg-014, hist-011, hist-012, hist-013] }
        - { order: 6, name: { fr: "Quand l'héritage recommence à respirer" }, readings: ["Psaume 146", "Psaume 147", "Psaume 148", "Psaume 149", "Psaume 150"], movement: { fr: "Les puissants perdent leur souffle; le cosmos rejoint le chœur; le glaive demeure une tension; tout souffle devient louange." }, claim_ids: [exeg-015, exeg-016, exeg-017, exeg-018, exeg-019, exeg-020, hist-014, hist-015, hist-016] }
      payoff:
        fr: "Le joueur n'obtient pas une cause unique de conservation : il éprouve comment des paroles anciennes offrent encore des formes au cri, à la mémoire, à la vigilance et à la louange."
      risks:
        historical: ["Faire de 11Q5 le témoin direct de chaque lecture.", "Transformer les titres en biographies."]
        exegetical: ["Présenter les voix comme un héros unique.", "Adoucir 137 et 149."]
        retention: ["Transformer la transmission en visite de musée."]
      supporting_claim_ids: [hist-001, hist-002, hist-003, hist-004, hist-005, hist-006, hist-007, hist-008, hist-009, hist-010, hist-011, hist-012, hist-013, hist-014, hist-015, hist-016, exeg-001, exeg-002, exeg-003, exeg-004, exeg-005, exeg-006, exeg-007, exeg-008, exeg-009, exeg-010, exeg-011, exeg-012, exeg-013, exeg-014, exeg-015, exeg-016, exeg-017, exeg-018, exeg-019, exeg-020, exeg-021, exeg-022]
      repair_notes:
        - { objection_ids: [veto-a-causality-hist, veto-a-causality-exeg], repair: "Aucune cause certaine n'est affirmée." }
        - { objection_ids: [veto-a-11q5-scope, ret-a-museum], repair: "11Q5 devient une découverte du mouvement 3." }
        - { objection_ids: [warning-a-single-voice], repair: "La pluralité des voix est explicite." }
    - id: concept-b
      owner: expedition-showrunner
      revision: 1
      title: { fr: "Ce qui tient quand tout s'effondre" }
      promise:
        fr: "Soumettre nos appuis à six épreuves : corps, effort, images, puissants, maison et certitude."
      human_question:
        fr: "À quoi confier sa vie lorsque le corps, les chefs, la maison et la ville peuvent tous céder ?"
      why_this_text_endures:
        fr: "Le corpus examine des appuis concrets, expose leur fragilité et fait de la louange un verdict éprouvé plutôt qu'un optimisme automatique."
      dramatic_thesis:
        fr: "La foi devient crédible lorsqu'elle accepte de comparer ses fondations à tout ce qui peut mourir, mentir, tomber ou rester sans souffle."
      opening_image:
        fr: "Un corps consumé, des gardes qui veillent en vain et les projets d'un puissant qui s'arrêtent avec son souffle."
      opening_claim_ids: [exeg-002, exeg-009, exeg-015]
      emotional_arc: [assurance, mise_à_l_épreuve, ambiguïté, perte, reconstruction, verdict]
      proposed_pack_movements:
        - { order: 1, name: { fr: "Épreuve du corps et de la force" }, readings: ["Psaume 102", "Psaume 127", "Psaume 146"], claim_ids: [exeg-002, exeg-009, exeg-015, hist-004] }
        - { order: 2, name: { fr: "Épreuve des faux visages" }, readings: ["Psaume 135", "Psaume 139"], claim_ids: [exeg-010, exeg-014] }
        - { order: 3, name: { fr: "Épreuve de la promesse" }, readings: ["Psaume 103", "Psaume 116", "Psaume 119", "Psaume 136"], claim_ids: [exeg-003, exeg-005, exeg-008, exeg-011] }
        - { order: 4, name: { fr: "Épreuve de l'autorité" }, readings: ["Psaume 110", "Psaume 118", "Psaume 149"], claim_ids: [exeg-004, exeg-007, exeg-018, hist-005, hist-006, hist-015] }
        - { order: 5, name: { fr: "Épreuve de la maison perdue" }, readings: ["Psaume 128", "Psaume 137", "Psaume 147"], claim_ids: [exeg-009, exeg-012, exeg-016, hist-012, hist-014] }
        - { order: 6, name: { fr: "Le verdict du vivant" }, readings: ["Psaume 117", "Psaume 138", "Psaume 148", "Psaume 150"], claim_ids: [exeg-006, exeg-013, exeg-017, exeg-019] }
      payoff:
        fr: "Le joueur termine avec une carte exigeante de la confiance : l'idole sans souffle, le pouvoir qui le perd et Dieu qui relève les vulnérables n'ont pas le même poids."
      risks:
        historical: ["Transformer les épreuves en ordre historique."]
        exegetical: ["Réduire chaque psaume au thème de la confiance.", "Faire de 127–128 une récompense automatique."]
        retention: ["Ton abstrait.", "Six révélations trop semblables."]
      supporting_claim_ids: [hist-002, hist-004, hist-005, hist-006, hist-008, hist-009, hist-010, hist-011, hist-012, hist-013, hist-014, hist-015, hist-016, exeg-001, exeg-002, exeg-003, exeg-004, exeg-005, exeg-006, exeg-007, exeg-008, exeg-009, exeg-010, exeg-011, exeg-012, exeg-013, exeg-014, exeg-015, exeg-016, exeg-017, exeg-018, exeg-019, exeg-020]
    - id: concept-c
      owner: expedition-showrunner
      revision: 1
      title: { fr: "Le chant qu'on ne peut pas commander" }
      promise:
        fr: "Commencer devant des harpes suspendues et découvrir pourquoi la louange peut crier, refuser, se souvenir et seulement ensuite offrir librement son souffle."
      human_question:
        fr: "Peut-on encore appeler cela une louange lorsque le chant refuse d'être joyeux sur commande ?"
      why_this_text_endures:
