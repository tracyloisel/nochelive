experience_design:
  owner: expedition-spiritual-experience-director
  revision: 2
  status: featured_units_pass_character_revision
  structure: { model: constellation, navigation: free_choice, global_arc: none, forced_connections: [] }
  units:
    - unit_id: disappearing-voice
      references: ["Psaume 102", "Psaume 103"]
      claim_ids: [exeg-001, exeg-002, exeg-003, hist-002, hist-004]
      first_encounter:
        see: { fr: "Le visage d'un adulte anonyme lutte pour finir sa phrase tandis que ses jours lui semblent partir en fumée; une autre personne refuse d'oublier. La seconde ne répare pas la première." }
        hear: { fr: "Deux voix différentes, séparées par un vrai silence et sans musique de soulagement." }
        feel: { fr: "Épuisement et mémoire peuvent rester côte à côte sans devenir un récit de guérison." }
      human_presence:
        who: { fr: "Un adulte anonyme dont le visage reste visible; jamais identifié comme auteur." }
        wants: { fr: "Finir sa phrase et être entendu avant de se sentir disparaître." }
        does: { fr: "Il se redresse, cherche son souffle et continue malgré la main qui tremble." }
        resists: { fr: "Son corps, la fatigue et la sensation que le temps lui échappe." }
      tension_to_inhabit: { fr: "L'une craint de disparaître; l'autre se commande de ne pas oublier." }
      question_before_explanation: { fr: "Que peut encore faire la mémoire quand la souffrance n'est pas terminée ?" }
      symbol_left_open: { fr: "La fumée à côté d'une trace conservée; aucune flèche ni « donc » entre elles." }
      silence_or_pause: { fr: "Plusieurs secondes de vide entre les deux parties." }
      memorable_act: { fr: "Garder côte à côte un fragment de chaque voix sans les fusionner." }
      tomorrow_memory: { fr: "L'une partait en fumée; l'autre refusait d'oublier." }
      explanation_delayed_until: { fr: "Après la rencontre séparée des deux voix." }
      prohibited_shortcuts: ["Même héros", "Guérison causale", "Auteur ou diagnostic inventé", "Émotion personnelle scorée"]
    - unit_id: nameless-king
      references: ["Psaume 110"]
      claim_ids: [hist-005, hist-006, exeg-004, exeg-021, exeg-022]
      first_encounter:
        see: { fr: "Un roi sans nom avance avec assurance vers sa place, puis se retourne quand une seconde déclaration le désigne comme prêtre selon Melchisédek." }
        hear: { fr: "Les deux déclarations arrivent séparément; les relectures ultérieures attendent." }
        feel: { fr: "L'importance est perceptible, l'identité reste hors d'atteinte." }
      human_presence:
        who: { fr: "Un homme traité visuellement comme roi, mais sans nom, emblème ou visage historique reconnaissable." }
        wants: { fr: "Avancer avec l'assurance de celui qui connaît sa place." }
        does: { fr: "Il s'approche du siège, puis se retourne lorsque la déclaration sacerdotale le vise." }
        resists: { fr: "Des paroles qui agrandissent son rôle au point de le rendre énigmatique même pour lui." }
      tension_to_inhabit: { fr: "Le texte parle de quelqu'un d'immense importance sans nous autoriser à le nommer historiquement." }
      question_before_explanation: { fr: "Qui reçoit ces paroles — et pourquoi ne peut-on pas remplir tout de suite la place vide ?" }
      symbol_left_open: { fr: "Un siège préparé dont le nom manque." }
      silence_or_pause: { fr: "Après Melchisédek, laisser l'énigme sans définition immédiate." }
      memorable_act: { fr: "Soulever séparément texte, contexte probable et relectures ultérieures." }
      tomorrow_memory: { fr: "Un roi et un prêtre dans le même psaume; le siège gardait son nom vide." }
      explanation_delayed_until: { fr: "Après avoir éprouvé l'envie de nommer le destinataire." }
      prohibited_shortcuts: ["Couronnement inventé", "Melchisédek mis en scène", "Réponse historique certaine", "Violence héroïsée"]
    - unit_id: seek-me
      references: ["Psaume 119"]
      claim_ids: [hist-008, exeg-008]
      first_encounter:
        see: { fr: "Une jeune lectrice aligne vingt-deux ensembles de huit; dans la dernière case, elle rencontre une brebis égarée qui demande encore à être cherchée." }
        hear: { fr: "La régularité tient jusqu'au bout, puis cesse sans son de réussite." }
        feel: { fr: "Une forme parfaitement tenue et une voix qui n'est toujours pas arrivée." }
      human_presence:
        who: { fr: "Une jeune lectrice contemporaine; elle explore le poème, elle ne joue pas son auteur." }
        wants: { fr: "Comprendre et maîtriser l'architecture du texte." }
        does: { fr: "Elle aligne les lettres avec assurance, atteint le dernier vers, puis lève les yeux vers la brebis isolée." }
        resists: { fr: "La dernière image défait l'idée que tout savoir mettre en ordre signifie être arrivé." }
      tension_to_inhabit: { fr: "Maîtriser l'alphabet ne rend pas le locuteur spirituellement parfait." }
      question_before_explanation: { fr: "Comment un poème aussi parfaitement construit finit-il par demander : « Cherche-moi » ?" }
      symbol_left_open: { fr: "Une architecture complète dont la dernière case ouvre encore un chemin." }
      silence_or_pause: { fr: "Laisser la dernière demande sans réponse rassurante." }
      memorable_act: { fr: "Parcourir toute la structure et ouvrir la dernière case." }
      tomorrow_memory: { fr: "176 vers tenaient ensemble; le dernier demandait encore d'être cherché." }
      explanation_delayed_until: { fr: "Après la régularité et le retournement final." }
      prohibited_shortcuts: ["Forme qui s'effondre", "Perfection spirituelle", "Scribe ou date inventés", "Foi scorée"]
    - unit_id: suspended-harps
      references: ["Psaume 137"]
      claim_ids: [hist-002, hist-012, hist-013, exeg-012]
      route: { mode: quiet, scored: false, timed: false, fanfare: false, exit_available: true }
      first_encounter:
        see: { fr: "Une musicienne exilée soutient le regard de celui qui exige un chant; derrière elle, les instruments restent suspendus près d'une eau non localisée." }
        hear: { fr: "Aucun instrument; la demande de chanter arrive, puis aucun morceau ne commence." }
        feel: { fr: "Un chant de mémoire transformé en divertissement imposé, avec le droit de rester à distance." }
      human_presence:
        who: { fr: "Plusieurs exilés adultes et un captor dramatisé; aucun personnage nommé ni violence montrée." }
        wants: { fr: "Les exilés veulent garder leur chant hors de portée de l'humiliation." }
        does: { fr: "Une musicienne fixe celui qui réclame le chant, échange un regard avec les siens et ne décroche pas l'instrument." }
        resists: { fr: "Un homme qui transforme leur mémoire en ordre de divertissement." }
      tension_to_inhabit: { fr: "Chanter garde une ville présente; chanter sur commande peut devenir une humiliation." }
      question_before_explanation: { fr: "Pourquoi refusent-ils de chanter ?" }
      symbol_left_open: { fr: "Les instruments restent suspendus, sans verdict immédiat sur le geste." }
      silence_or_pause: { fr: "Silence incompressible; continuer ou quitter sans pénalité." }
      memorable_act: { fr: "Suspendre l'instrument et ne recevoir aucune commande de le jouer." }
      tomorrow_memory: { fr: "On leur demandait une chanson de chez eux; les instruments sont restés suspendus." }
      explanation_delayed_until: { fr: "Après le silence et une continuation volontaire." }
      prohibited_shortcuts: ["Ravisseur ou date inventés", "Violence montrée", "Colère héroïsée", "Score ou fanfare", "Louange réparatrice automatique"]
    - unit_id: you-know-me
      references: ["Psaume 139"]
      claim_ids: [hist-001, hist-002, exeg-014]
      first_encounter:
        see: { fr: "Un lecteur cherche à partir, s'arrête sous les étoiles, puis déplie une page qui relie « tu me sondes » à « sonde-moi »." }
        hear: { fr: "Le même verbe revient : connaissance déjà là, puis demande volontaire." }
        feel: { fr: "Une proximité qui peut être consolante et inconfortable." }
      human_presence:
        who: { fr: "Un lecteur contemporain seul sous un ciel étoilé, visage découvert." }
        wants: { fr: "Échapper un instant au regard qui semble le connaître partout." }
        does: { fr: "Il marche, s'arrête, déplie la page et finit par soutenir lui-même ce regard." }
        resists: { fr: "L'impossibilité de trouver un lieu où sa vie intérieure serait totalement cachée." }
      tension_to_inhabit: { fr: "Après avoir nommé le mal et sa propre haine, la voix accepte que le regard se tourne aussi vers elle." }
      question_before_explanation: { fr: "Pourquoi la voix qui envisage de fuir finit-elle par demander : « Sonde-moi » ?" }
      symbol_left_open: { fr: "Le pli entre « tu me sondes » et « sonde-moi »." }
      silence_or_pause: { fr: "Garder les deux extrémités visibles avant de révéler le milieu." }
      memorable_act: { fr: "Déplier la page et découvrir que le fait d'être connu devient une demande." }
      tomorrow_memory: { fr: "Le même mot encadrait le psaume : « tu me sondes », puis « sonde-moi »." }
      explanation_delayed_until: { fr: "Après l'ouverture complète du pli." }
      prohibited_shortcuts: ["Estime de soi simplifiée", "Horreur de surveillance", "Haine effacée ou validée", "Confession du joueur", "David historicisé"]
    - unit_id: everything-breathes
      references: ["Psaume 146", "Psaume 147", "Psaume 148", "Psaume 149", "Psaume 150"]
      claim_ids: [hist-014, hist-015, hist-016, exeg-015, exeg-016, exeg-017, exeg-018, exeg-019, exeg-020]
      local_structure: { model: constellation, navigation: free_choice, forced_sequence: false }
      first_encounter:
        see: { fr: "Des personnes de plusieurs générations se regardent avant de prendre souffle ensemble; l'une reste silencieuse et le groupe l'attend." }
        hear: { fr: "Chaque présence garde son espace; Psaume 149 reste sans effet martial et Psaume 150 ne recouvre pas son silence." }
        feel: { fr: "Une vaste ouverture traversée par une dissonance qui reste visible." }
      human_presence:
        who: { fr: "Un groupe contemporain de plusieurs générations, jamais présenté comme musiciens du Temple." }
        wants: { fr: "Trouver comment répondre ensemble sans effacer la personne encore silencieuse." }
        does: { fr: "Ils se regardent, prennent le même souffle et commencent seulement lorsque chacun est prêt." }
        resists: { fr: "La tentation de transformer la louange finale en euphorie obligatoire." }
      tension_to_inhabit: { fr: "La louange élargit le monde, mais le glaive empêche une image simplement euphorique." }
      question_before_explanation: { fr: "Que devient l'image du glaive lorsque le psaume suivant appelle tout ce qui respire à louer ?" }
      symbol_left_open: { fr: "Un souffle près d'un glaive immobile; l'un n'efface pas l'autre." }
      silence_or_pause: { fr: "Psaume 149 garde son propre silence et une sortie libre." }
      memorable_act: { fr: "Visiter les cinq présences dans l'ordre choisi et les laisser toutes visibles." }
      tomorrow_memory: { fr: "Celui qui compte les étoiles s'arrête aussi devant un cœur brisé; le souffle final n'efface pas le glaive." }
      explanation_delayed_until: { fr: "Après l'exploration libre d'au moins une présence." }
      prohibited_shortcuts: ["Crescendo obligatoire", "150 résout 149", "Combat animé", "149 scoré", "Instruments authentiques revendiqués", "Code secret du souffle"]

formation_quizzes:
  owner: expedition-spiritual-experience-director
  revision: 2
  status: psalm_119_initial_series_human_validation
  expanded_pack_source:
    path: config/expeditions/fragments/psalms-102-150-2026-08-31-quiz-packs.fr.yml
    revision: 1
    locale: fr
    status: human_validation
    total_questions: 60
  method: code_de_la_route
  rejected_questions:
    - id: ps119-structure-trivia
      prompt: "Les 176 vers du Psaume 119, ils sont rangés comment ?"
      verdict: REJECT
      reason: "La bonne réponse vérifie une curiosité littéraire sans former un discernement réutilisable dans la relation à Dieu, à soi-même ou aux autres."
      retained_as: "Révélation visuelle qui rend plus fort le contraste entre une forme parfaitement ordonnée et une voix encore perdue."
  mastery_rule: "Le même discernement doit être reconnu dans plusieurs contextes; aucune déclaration de foi n'est scorée."
  copy_limits:
    counting_unit: unicode_graphemes_including_spaces_and_punctuation
    reference_surface: street_quiz_390x667
    prompt: { hard_max: 72, max_lines: 3, must_be_self_contained: true }
    choice: { hard_max: 32, max_lines: 2 }
    correction: { hard_max: 120 }
    max_choices: 4
    locale_policy: validate_every_translation_independently
    overflow_policy: REJECT_COPY_OVERFLOW
    forbidden_fixes: [font_shrink, truncation, ellipsis, answer_scroll]
  learning_lenses:
    allowed_statuses: [covered, planned, not_supported, pending_claims]
    coverage:
      - { lens: RECIT_DU_TEXTE, status: planned, candidate_units: [disappearing-voice, suspended-harps] }
      - { lens: PERSONNAGES, status: planned, candidate_units: [disappearing-voice, nameless-king] }
      - { lens: MONDE_HISTORIQUE, status: planned, candidate_units: [nameless-king, suspended-harps] }
      - { lens: LECTURE_DU_TEXTE, status: covered, question_ids: [ps119-order-03] }
      - { lens: PRINCIPES_DE_L_EVANGILE, status: covered, question_ids: [ps119-return-01, ps119-teach-02, ps119-help-and-step-04] }
      - { lens: PLAN_DE_DIEU, status: pending_claims, candidate_units: [nameless-king, everything-breathes] }
      - { lens: ESPERANCE_ETERNELLE, status: pending_claims, candidate_units: [disappearing-voice, everything-breathes] }
      - { lens: RECEPTION_CANONIQUE, status: planned, candidate_units: [nameless-king] }
      - { lens: DISCERNEMENT_DE_VIE, status: covered, question_ids: [ps119-return-01, ps119-help-and-step-04] }
  assessment:
    scores: [observation_du_texte, discernement_textuel, transfert]
    never_scores: [foi, saintete, emotion, confession, priere, repentance, salut]
  items:
    - id: ps119-return-01
      unit_id: seek-me
      formation_goal: "Revenir à Dieu sans attendre d'avoir repris le contrôle."
      soul_relevance: "L'échec d'une routine ne transforme pas le besoin d'aide en motif de fuite ou de honte."
      scripture_references: ["Psaume 119:176"]
      claim_ids: [exeg-008]
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      situation: "Tu avais enfin une bonne routine. Puis tu rates trois jours et tu as l'impression d'avoir tout gâché."
      prompt: "Tu as raté trois jours. Que faire d’après la fin du Psaume 119 ?"
      choices:
        - { id: a, text: "Me cacher jusqu’à aller mieux", diagnosis: honte_performance }
        - { id: b, text: "Me promettre de ne plus échouer", diagnosis: perfection_autosuffisante }
        - { id: c, text: "Demander à Dieu de me chercher", diagnosis: retour_et_dependance }
        - { id: d, text: "Abandonner le chemin", diagnosis: decouragement_renoncement }
      correct_choice: c
      correction: "La voix ne dit pas « j’ai réussi ». Elle reconnaît qu’elle s’est perdue et demande à Dieu de la chercher."
      misconception_targeted: "La connaissance ou la discipline devrait supprimer tout besoin d'aide."
      practice_invitation: "Si tu le souhaites, transforme une promesse impossible en une demande simple : « Cherche-moi ici. »"
      transfer_question_id: ps119-return-01b
      spaced_repetition: { after_questions: 3, changed_context: "Après trois bonnes journées, une vieille habitude revient. Quel est le prochain geste qui ne soit ni fuite ni abandon ?" }
      pastoral_boundary: "La réponse évalue la lecture du psaume, jamais l'état spirituel ni une rechute réelle du joueur."
      copy_metrics: { prompt_graphemes: 64, choice_graphemes: { a: 29, b: 31, c: 30, d: 20 }, correction_graphemes: 105, mobile_copy_gate: PASS }
    - id: ps119-teach-02
      unit_id: seek-me
      formation_goal: "Demander lumière et compréhension au lieu de simuler la maîtrise."
      soul_relevance: "Une attention dispersée n'empêche pas de revenir à Dieu par une demande simple."
      scripture_references: ["Psaume 119:12", "Psaume 119:26-27", "Psaume 119:33-34", "Psaume 119:124-125", "Psaume 119:135"]
      claim_ids: [exeg-008]
      learning_lens: PRINCIPES_DE_L_EVANGILE
      source_layer: textual
      situation: "Dans le métro, tu essaies de lire, mais ton esprit retourne au travail, aux messages et aux problèmes."
      prompt: "Ton esprit part ailleurs. Quel réflexe revient dans le Psaume 119 ?"
      choices:
        - { id: a, text: "Faire comme si j’avais compris", diagnosis: apparence_spirituelle }
        - { id: b, text: "Demander à Dieu de m’enseigner", diagnosis: demande_de_lumiere }
        - { id: c, text: "Arrêter dès que je me disperse", diagnosis: tout_ou_rien }
        - { id: d, text: "Réciter pour mériter son aide", diagnosis: logique_du_merite }
      correct_choice: b
      correction: "Le psaume revient à cette prière : « Enseigne-moi. Donne-moi de comprendre. Fais-moi vivre. »"
      misconception_targeted: "Il faudrait paraître concentré ou mériter l'aide avant de la demander."
      practice_invitation: "Avant une prochaine lecture, tu peux commencer par : « Enseigne-moi ce que j'ai besoin de voir. »"
      transfer_question_id: ps119-teach-02b
      spaced_repetition: { after_questions: 5, changed_context: "Dans une réunion stressante, tu ne sais plus quelle décision prendre. Quel premier geste reprend le réflexe du psaume ?" }
      pastoral_boundary: "Aucune difficulté d'attention n'est interprétée comme faute morale ou manque de foi."
      copy_metrics: { prompt_graphemes: 67, choice_graphemes: { a: 30, b: 30, c: 30, d: 29 }, correction_graphemes: 93, mobile_copy_gate: PASS }
    - id: ps119-order-03
      unit_id: seek-me
      formation_goal: "Utiliser la discipline comme chemin de retour, jamais comme preuve de valeur."
      soul_relevance: "Une routine peut aider sans devenir un trophée ni une garantie de ne plus se perdre."
      scripture_references: ["Psaume 119:1-176"]
      claim_ids: [hist-008, exeg-008]
      learning_lens: LECTURE_DU_TEXTE
      source_layer: textual
      situation: "Ton agenda est propre, ta routine tient et tu as coché toutes tes habitudes."
      prompt: "Ta routine tient. Que rappelle pourtant la fin du Psaume 119 ?"
      choices:
        - { id: a, text: "Une routine empêche de se perdre", diagnosis: controle }
        - { id: b, text: "L’ordre aide sans remplacer Dieu", diagnosis: discipline_au_service_de_la_relation }
        - { id: c, text: "Toute discipline est inutile", diagnosis: cynisme }
        - { id: d, text: "Dieu aide, donc je n’agis plus", diagnosis: passivite }
      correct_choice: b
      correction: "Le poème est très ordonné, mais il finit avec une brebis perdue. La discipline aide ; elle ne remplace pas Dieu."
      misconception_targeted: "La routine garantit la sécurité spirituelle, ou bien elle ne sert à rien."
      practice_invitation: "Choisis un rythme assez petit pour servir la relation plutôt que ta performance."
      transfer_question_id: ps119-order-03b
      spaced_repetition: { after_questions: 7, changed_context: "Une série de trente jours vient de se briser. Qu'est-ce qui a réellement été perdu, et quel prochain pas reste possible ?" }
      pastoral_boundary: "Aucune routine religieuse, familiale ou psychique n'est imposée au joueur."
      copy_metrics: { prompt_graphemes: 62, choice_graphemes: { a: 32, b: 32, c: 28, d: 30 }, correction_graphemes: 112, mobile_copy_gate: PASS }
    - id: ps119-help-and-step-04
      unit_id: seek-me
      formation_goal: "Tenir ensemble l'aide de Dieu et la reprise du chemin."
      soul_relevance: "Recevoir de l'aide ne signifie ni attendre passivement ni devoir mériter d'être secouru."
      scripture_references: ["Psaume 119:10", "Psaume 119:33-40", "Psaume 119:176"]
      claim_ids: [exeg-008]
      learning_lens: DISCERNEMENT_DE_VIE
      source_layer: textual
      situation: "Une amie dit : « Si Dieu vient me chercher, je n'ai plus rien à faire. »"
      prompt: "« Dieu me cherche, donc je n’ai rien à faire. » Que répond le psaume ?"
      choices:
        - { id: a, text: "Attendre suffit toujours", diagnosis: passivite }
        - { id: b, text: "Dieu n’aide que les parfaits", diagnosis: merite_perfection }
        - { id: c, text: "Demander son aide, puis agir", diagnosis: aide_et_reponse }
        - { id: d, text: "Les règles passent avant Dieu", diagnosis: legalisme }
      correct_choice: c
      correction: "La voix cherche Dieu, demande d’être enseignée, puis d’être cherchée. Recevoir de l’aide et faire un pas vont ensemble."
      misconception_targeted: "Il faudrait choisir entre dépendre de Dieu et agir."
      practice_invitation: "Pour aider quelqu'un, offre d'abord une présence, puis un seul prochain pas possible."
      transfer_question_id: ps119-help-and-step-04b
      spaced_repetition: { after_questions: 9, changed_context: "Après un engagement manqué, quelle réponse évite à la fois la passivité et la honte ?" }
      pastoral_boundary: "Le jeu n'affirme jamais que Dieu a révélé personnellement une action au joueur."
      copy_metrics: { prompt_graphemes: 70, choice_graphemes: { a: 24, b: 28, c: 28, d: 29 }, correction_graphemes: 119, mobile_copy_gate: PASS }
  pastoral_boundaries:
    - "Une mauvaise réponse révèle une confusion de lecture à retravailler, jamais une faute morale."
    - "Aucun témoignage, traumatisme, péché, sentiment ou engagement personnel n'est exigé."
    - "La détresse psychique n'est jamais assimilée automatiquement au péché ou à l'égarement."
    - "Aucun feedback humiliant, aucune culpabilité et aucune promesse de guérison immédiate."
    - "Le salut n'est ni gagné ni vérifié par le quiz."
    - "Le joueur conserve le droit au silence, au désaccord et à la sortie."

