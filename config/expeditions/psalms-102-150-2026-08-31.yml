expedition:
  owner: expedition-showrunner
  revision: 1
  status: internal_legacy_superseded
  visibility: audit_only
  superseded_by: editorial_structure_revision_2
  selected_concept_id: concept-a
  title: { fr: "Leurs voix nous atteignent encore" }
  subtitle: { fr: "Du cri anonyme au souffle partagé" }
  promise:
    fr: "Dix-neuf chants, plusieurs voix : apprendre à reconnaître ce qu'elles font de l'effacement, de la mémoire, du pouvoir, de la maison, de l'exil et de la louange."
  weekly_logline:
    fr: "Une voix croit disparaître; d'autres lui répondent par des formes différentes jusqu'à un chœur final qui accueille davantage de souffle sans effacer les paroles difficiles."
  human_question:
    fr: "Pourquoi des paroles venues de vies si différentes peuvent-elles encore devenir les nôtres ?"
  why_this_text_endures:
    fr: "L'expédition ne tranche pas la cause historique de leur conservation. Elle fait éprouver la pertinence durable de gestes inscrits dans les textes : crier, se souvenir, distinguer, structurer, bâtir, refuser, examiner et louer."
  protagonist_model:
    type: plural_textual_voices
    rule: { fr: "Le protagonisme circule entre voix anonymes, assemblées et images poétiques; aucun héros continu n'est inventé." }
    claim_ids: [exeg-001, hist-001, hist-002]
  dramatic_contract:
    beginning: { fr: "Une voix anonyme craint l'effacement." }
    middle: { fr: "D'autres voix proposent mémoire, parole, maison et chant, puis rencontrent exil, colère et examen de soi." }
    ending: { fr: "Le chœur s'élargit à tout ce qui respire sans réécrire les tensions antérieures." }
  research_reveal:
    id: reveal-11q5
    timing: after_movement_03_human_attachment
    fr: "11Q5 conserve plusieurs psaumes de la zone 101–150 dans un autre ordre et avec d'autres compositions; il illustre une histoire textuelle complexe sans expliquer seul la conservation de l'ensemble."
    claim_ids: [hist-003]
  mechanical_briefs:
    foundation_probe:
      source_concept: concept-b
      scope: mechanic_only
      fr: "Éprouver un appui nommé par le texte — force, autorité, perfection, effort, image ou pouvoir — sans réduire tous les psaumes au même verdict."
    collective_voice_reward:
      source_concept: concept-c
      scope: reward_only
      fr: "Chaque mouvement libère un éclat d'un chœur contemporain, du souffle isolé vers des voix superposées; ce n'est pas une reconstruction du Temple."
      exclusions: ["Aucun score ni éclat gagné sur le trauma de 137.", "Aucun score ni éclat gagné sur le glaive de 149."]
      claim_ids: [hist-016, exeg-019, exeg-020]
  content_boundaries:
    - "Psaumes 137 et 149 empruntent une voie calme non notée."
    - "Les formes familiales réelles du joueur ne sont jamais évaluées."
    - "Les réceptions chrétienne et LDS de 110 sont nommées comme réceptions."
    - "L'arc ne devient ni datation, ni histoire continue, ni promesse de guérison."
    - "Le dernier mouvement ajoute des voix; il ne gomme aucune voix précédente."

editorial_structure:
  owner: expedition-showrunner
  revision: 2
  status: selected
  type: constellation
  confidence: high
  reason:
    fr: >-
      Les dix-neuf psaumes ne partagent ni narrateur, ni événement, ni auteur,
      ni chronologie. La semaine propose donc des destinations autonomes. Six
      histoires portent la bande-annonce; quatre autres restent visibles et
      comptent autant dans la progression.
  navigation: free_choice
  completion:
    fr: "La progression mesure les découvertes accomplies, jamais l'avancée dans un récit."
  units:
    - id: disappearing-voice
      working_title: { fr: "La voix qui disparaît" }
      featured_in_trailer: true
      references: ["Psaume 102", "Psaume 103"]
      claim_ids: [hist-004, exeg-002, exeg-003]
      boundary: { fr: "Diptyque de deux voix; aucune identité commune ni guérison causale n'est affirmée." }
    - id: nameless-king
      working_title: { fr: "Le roi sans nom" }
      featured_in_trailer: true
      references: ["Psaume 110"]
      claim_ids: [hist-005, hist-006, exeg-004, exeg-021, exeg-022]
      boundary: { fr: "Le roi, la cérémonie et la première situation historique restent inconnus." }
    - id: cry-nations-stone
      working_title: { fr: "Le cri, les nations et la pierre" }
      featured_in_trailer: false
      references: ["Psaume 116", "Psaume 117", "Psaume 118"]
      claim_ids: [hist-007, exeg-005, exeg-006, exeg-007, exeg-021]
      boundary: { fr: "Mini-anthologie; aucun événement ni auteur commun n'est affirmé." }
    - id: seek-me
      working_title: { fr: "Cherche-moi" }
      featured_in_trailer: true
      references: ["Psaume 119"]
      claim_ids: [hist-008, exeg-008]
    - id: house-table-city
      working_title: { fr: "La maison, la table et la ville" }
      featured_in_trailer: false
      references: ["Psaume 127", "Psaume 128"]
      claim_ids: [hist-009, hist-010, exeg-009]
      boundary: { fr: "Aucune forme familiale, fertilité ou prospérité n'est évaluée." }
    - id: breathless-images-answer
      working_title: { fr: "Les bouches sans souffle et la réponse répétée" }
      featured_in_trailer: false
      references: ["Psaume 135", "Psaume 136"]
      claim_ids: [hist-011, exeg-010, exeg-011]
      boundary: { fr: "Contraste éditorial entre deux psaumes; aucune unité de composition n'est affirmée." }
    - id: suspended-harps
      working_title: { fr: "Les harpes suspendues" }
      featured_in_trailer: true
      references: ["Psaume 137"]
      claim_ids: [hist-012, hist-013, exeg-012]
      quiet_route: { scored: false, timed: false, fanfare: false, depiction: non_graphic }
    - id: still-in-distress
      working_title: { fr: "Encore au milieu de la détresse" }
      featured_in_trailer: false
      references: ["Psaume 138"]
      claim_ids: [exeg-013]
    - id: you-know-me
      working_title: { fr: "Tu me connais" }
      featured_in_trailer: true
      references: ["Psaume 139"]
      claim_ids: [exeg-014]
    - id: everything-breathes
      working_title: { fr: "Tout ce qui respire" }
      featured_in_trailer: true
      references: ["Psaume 146", "Psaume 147", "Psaume 148", "Psaume 149", "Psaume 150"]
      claim_ids: [hist-014, hist-015, hist-016, exeg-015, exeg-016, exeg-017, exeg-018, exeg-019, exeg-020]
      boundary: { fr: "Constellation interne; Psaume 150 ne résout ni n'efface Psaume 149." }
  echoes:
    - motif: souffle
      unit_ids: [breathless-images-answer, everything-breathes]
      claim_ids: [exeg-010, exeg-015, exeg-019, exeg-020]
      limits: { fr: "Écho éditorial, jamais code intentionnel démontré." }
    - motif: etre_cherche_ou_sonde
      unit_ids: [seek-me, you-know-me]
      claim_ids: [exeg-008, exeg-014]
      limits: { fr: "Deux gestes textuels distincts, sans auteur ou projet commun affirmé." }
  forced_connections: []

