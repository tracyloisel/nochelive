visual_language:
  owner: expedition-art-director
  revision: 3
  status: approved
  library_identity: "Conserver le bleu profond de la Bibliothèque; laisser chaque artwork décider Celestial Light ou Dark, avec une signature or locale."
  common_prompt:
    render: "Premium cinematic editorial illustration for Noche Live, painterly realism, an emotionally legible contemporary relationship and decisive human gesture, deep navy and restrained gold signature, flattering but honest light, layered depth, generous negative space for localized Library copy, no text inside the image."
    casting: "Beautiful, charismatic and desirable adults through magnetic presence, personal style, expressive faces, living bodies and precise vulnerability; never sexualized, plastically perfected, airbrushed or posed like interchangeable advertising talent."
    safety: "No literal illustration of a word or biblical metaphor, no historical reconstruction, no portrait of Solomon or Qoheleth, no identifiable sacred figure, no logos, no readable writing, no infographic, no UI, no providential beam, no poverty spectacle and no prosperity symbolism."
    responsive_contract:
      mobile: "9:16 master, subject in lower-right or lower-center, calm negative space in upper-left."
      tablet: "4:5 master, prove the same decisive human behavior independently, negative space left."
      landscape: "16:9 master, subject on right third, story environment across frame, copy-safe left half."
  daily_artworks:
    - id: wisdom_voice
      artwork_key: scripture.library.daily.prov1.wisdom-cries
      references: [ot/prov/1]
      light_family: celestial_dark
      filenames:
        mobile: media/masters/media/study/library/daily/prov1-public-threshold-listening-portrait-v2.png
        tablet: media/masters/media/study/library/daily/prov1-public-threshold-listening-tablet-v2.png
        landscape: media/masters/media/study/library/daily/prov1-public-threshold-listening-landscape-v2.png
      exact_prompt: "At the busy threshold of a stylish contemporary public venue, an adult sister calls to her younger adult brother already moving away with the crowd. She stays in place. His body remains oriented toward departure, but he stops, fully removes one earbud and turns his face back to meet her gaze while everyone else continues walking. Show only the choice to hear, never the content or outcome."
      forbidden: [street_preacher, crossroads, megaphone, raised_moralizing_finger, halo, providential_beam, earbuds_advertisement, frozen_crowd, hug, resolved_outcome]
      alt_fact: "Au seuil d’un lieu public bruyant, une sœur appelle son frère qui repart; il retire un écouteur et se retourne tandis que les passants continuent."
      disclosure_fact: "Scène contemporaine inventée pour évoquer Proverbes 1; le frère et la sœur ne sont pas des personnages bibliques et le contenu de leur échange reste inconnu."
      claim_ids: [exeg-001]
    - id: joy_while_waiting
      artwork_key: scripture.library.daily.prov3-prov16.joy-while-waiting
      references: [ot/prov/3, ot/prov/16]
      light_family: celestial_dark
      filenames:
        mobile: media/masters/media/study/library/daily/prov3-16-audition-friends-portrait-v2.png
        tablet: media/masters/media/study/library/daily/prov3-16-audition-friends-tablet-v2.png
        landscape: media/masters/media/study/library/daily/prov3-16-audition-friends-landscape-v2.png
      exact_prompt: "After a contemporary dance audition, one dancer is being celebrated because he was selected. His closest friend wanted the same role and was not selected. The nonselected friend stops crumpling a blank audition slip and clasps the selected dancer’s trembling hand, the wrinkled paper still visible between two fingers; his sincere wet-eyed smile holds pride and disappointment together. Suggest no later compensation or success."
      forbidden: [trophy, money, luxury, prosperity_proof, divine_beam, magic_path, guaranteed_future_victory, jealousy_caricature, uniform_euphoria, isolated_loser]
      alt_fact: "Après une audition, le danseur non retenu cesse de froisser son numéro et prend la main tremblante de son ami choisi, les yeux humides mais le sourire sincère."
      disclosure_fact: "Scène contemporaine inventée pour Proverbes 3 et 16; elle ne prouve aucune faveur divine et ne promet ni rôle ni réussite future au danseur non retenu."
      claim_ids: [exeg-002, exeg-005]
    - id: gentle_answer
      artwork_key: scripture.library.daily.prov4-prov15.gentle-answer
      references: [ot/prov/4, ot/prov/15]
      light_family: celestial_dark
      filenames:
        mobile: media/masters/media/study/library/daily/prov4-15-chair-before-words-portrait-v3.png
        tablet: media/masters/media/study/library/daily/prov4-15-chair-before-words-tablet-v3.png
        landscape: media/masters/media/study/library/daily/prov4-15-chair-before-words-landscape-v3.png
      exact_prompt: "Beside the visibly dented door of a family car, an adult daughter stands in the garage entry holding the keys, ashamed and braced for accusation. Her mother stops the pointing gesture she was beginning: one hand opens and rests on a small table while the other pulls out an empty chair. The mother does not smile; the daughter cautiously raises her eyes. The fault remains and no reconciliation is guaranteed."
      forbidden: [phone_prop, shouting_caricature, instant_hug, resolved_smile, unsafe_submission, punishment, glowing_doorway]
      alt_fact: "Une portière abîmée reste visible derrière une mère qui interrompt son geste accusateur, pose la main ouverte et tire une chaise; sa fille adulte tient les clés et relève les yeux."
      disclosure_fact: "Scène contemporaine inventée pour Proverbes 4 et 15; la chaise offerte ne garantit pas une réconciliation et ne demande à personne de rester en danger."
      claim_ids: [exeg-003, exeg-004]
    - id: good_name_open_hand
      artwork_key: scripture.library.daily.prov22-prov31.open-hand
      references: [ot/prov/22, ot/prov/31]
      light_family: celestial_dark
      filenames:
        mobile: media/masters/media/study/library/daily/prov22-31-bread-between-equals-portrait-v2.png
        tablet: media/masters/media/study/library/daily/prov22-31-bread-between-equals-tablet-v2.png
        landscape: media/masters/media/study/library/daily/prov22-31-bread-between-equals-landscape-v2.png
