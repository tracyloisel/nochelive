        allowed_copy: "Garde ton cœur; regarde aussi où tes pieds te conduisent."
        forbidden_copy: ["Une émotion mauvaise rend physiquement malade."]
        quiz_eligible: true
      - id: exeg-004
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Proverbes 15:1 met en parallèle la réponse douce qui détourne la fureur et la parole blessante qui excite la colère."
        references: ["Proverbes 15:1"]
        source_ids: [src-prov-15]
        interpretive_limits: "Orientation de sagesse, pas résultat garanti dans chaque conflit."
        allowed_copy: "Une parole douce peut interrompre l’escalade."
        forbidden_copy: ["Parle doucement et toute violence cessera.", "Reste dans une situation dangereuse."]
        quiz_eligible: true
      - id: exeg-005
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Proverbes 16:3,9 tient ensemble les œuvres confiées à l’Éternel, les projets du cœur et la direction des pas par Dieu."
        references: ["Proverbes 16:3", "Proverbes 16:9"]
        source_ids: [src-prov-16]
        interpretive_limits: "La souveraineté divine n’est pas présentée comme fatalisme."
        allowed_copy: "Le cœur prépare un chemin; l’Éternel dirige les pas."
        forbidden_copy: ["Tes choix ne comptent pas.", "Tout projet réussi prouve l’approbation divine."]
        quiz_eligible: true
      - id: exeg-006
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Proverbes 22 préfère un bon nom aux grandes richesses, rappelle que Dieu est le créateur du riche et du pauvre et loue celui qui partage son pain."
        references: ["Proverbes 22:1-2", "Proverbes 22:9"]
        source_ids: [src-prov-22]
        interpretive_limits: "Ne pas identifier automatiquement richesse et faute, pauvreté et vertu."
        allowed_copy: "Un bon nom vaut mieux que de grandes richesses; riche et pauvre ont le même Créateur; celui qui partage son pain est déclaré heureux."
        forbidden_copy: ["Toute personne riche est méchante.", "Un bon croyant sera toujours respecté."]
        quiz_eligible: true
      - id: exeg-007
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Proverbes 31:8-9 demande de parler pour ceux qui ne peuvent se défendre; le poème de 31:10-31 célèbre force, travail, sagesse, bonté et main ouverte envers le pauvre."
        references: ["Proverbes 31:8-9", "Proverbes 31:10-31"]
        source_ids: [src-prov-31]
        interpretive_limits: "Ne pas transformer le poème en liste de conformité imposée aux femmes."
        allowed_copy: "La femme célébrée ouvre sa bouche avec sagesse et sa main vers les personnes dans le besoin."
        forbidden_copy: ["Une femme vertueuse doit accomplir seule toutes ces tâches.", "Le poème décrit une femme historique connue."]
        quiz_eligible: true
      - id: exeg-008
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Ecclésiaste 1 fait tourner soleil, vent et rivières, puis affirme que l’œil et l’oreille ne sont pas rassasiés."
        references: ["Ecclésiaste 1:4-9"]
        source_ids: [src-eccl-1]
        interpretive_limits: "La répétition cosmique sert la question du profit; ce n’est pas une leçon scientifique."
        allowed_copy: "Tout recommence, sans rassasier le regard."
        forbidden_copy: ["L’auteur connaissait la météorologie moderne.", "Rien n’a jamais aucun sens."]
        quiz_eligible: true
      - id: exeg-009
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Ecclésiaste 3 énumère des temps opposés et maintient que l’humain ne saisit pas l’œuvre de Dieu du commencement à la fin."
        references: ["Ecclésiaste 3:1-11"]
        source_ids: [src-eccl-3]
        interpretive_limits: "La liste décrit l’amplitude de la vie; elle ne sanctifie pas chaque violence nommée."
        allowed_copy: "Il y a des temps opposés, mais nous ne tenons pas toute l’histoire."
        forbidden_copy: ["Chaque tragédie arrive au moment parfait.", "La guerre est voulue par Dieu."]
        quiz_eligible: true
      - id: exeg-010
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: textual
        assertion_kind: TEXTE
        certainty: ATTESTÉ
        statement: "Ecclésiaste 12 demande de se souvenir du Créateur avant les jours difficiles, déroule des images de lumière qui baisse et d’objets qui se brisent, puis conclut par la crainte de Dieu et les commandements."
        references:
          - "Ecclésiaste 12:3-16 (versification française utilisée)"
          - "Ecclesiastes/Eclesiastés/Eclesiastes 12:1-14 (en/es/pt-BR)"
        source_ids: [src-eccl-12, src-eccl-12-en, src-eccl-12-es, src-eccl-12-pt]
        interpretive_limits: "La conclusion finale parle de Qohéleth à la troisième personne; ne pas l’attribuer automatiquement à la même voix. Garder aussi l’ouverture poétique des images."
        allowed_copy: "Souviens-toi de ton Créateur avant que la lumière baisse."
        forbidden_copy: ["Chaque objet correspond avec certitude à un organe précis.", "La vieillesse rend la vie sans valeur."]
        quiz_eligible: true
      - id: exeg-011
        owner: expedition-exegete
        revision: 1
        status: active
        source_layer: canonical
        assertion_kind: RÉCEPTION
        certainty: ATTESTÉ
        statement: "Le rapprochement hebdomadaire entre ces passages est une constellation éditoriale; ils ne forment ni récit continu ni voix historique unique."
        references: ["Proverbes 1; 3–4; 15–16; 22; 31", "Ecclésiaste 1; 3; 12"]
        source_ids: [src-cfm-37, src-prov-text, src-eccl-1, src-eccl-3, src-eccl-12]
        interpretive_limits: "Les échos sont proposés au lecteur et ne deviennent pas une chronologie."
        allowed_copy: "Six portes éditoriales, sans histoire inventée entre elles."
        forbidden_copy: ["Un seul sage traverse les sept jours.", "L’Ecclésiaste est la suite narrative de Proverbes."]
        quiz_eligible: false

