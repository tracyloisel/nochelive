experience_design:
  owner: expedition-spiritual-experience-director
  revision: 3
  status: approved_for_art
  days:
    - id: wisdom_voice
      see: "Au seuil d’un lieu public animé, une sœur appelle son frère déjà repris par le flux; il suspend son départ et retire son écouteur tandis que les passants continuent."
      tension: "La voix est publique et proche, mais l’écoute ne commence que lorsque quelqu’un interrompt son mouvement."
      question: "Quelle voix réelle te demande de ralentir avant de disparaître dans le bruit ?"
      memorable_act: "Retirer un écouteur et laisser le contenu de l’appel encore inconnu."
      tomorrow_memory: "Un corps encore tourné vers le départ, un visage revenu vers sa sœur."
      claim_ids: [exeg-001]
    - id: joy_while_waiting
      see: "Deux amis ont passé la même audition; celui qui n’a pas été choisi cesse de froisser son numéro pour prendre la main tremblante de l’autre."
      tension: "La joie offerte à l’autre peut rester vraie sans effacer la déception ni promettre une compensation."
      question: "Peux-tu applaudir sa joie sans nier ce que tu attends encore ?"
      memorable_act: "Cesser de froisser ce qui rappelle l’échec pour offrir une main réellement présente."
      tomorrow_memory: "Un numéro d’audition froissé entre deux doigts et une autre main accueillie."
      claim_ids: [exeg-002, exeg-005]
    - id: gentle_answer
      see: "Une mère découvre la voiture familiale abîmée; son doigt accusateur s’ouvre en main posée et tire une chaise pour sa fille restée au seuil avec les clés."
      tension: "La faute et la colère demeurent; le prochain geste peut toutefois éviter une blessure supplémentaire."
      question: "Que veux-tu laisser sortir quand la colère entre ?"
      memorable_act: "Ouvrir la main qui allait pointer, sans sourire ni résoudre trop vite."
      tomorrow_memory: "Une chaise tirée dans une pièce où rien n’est encore réglé."
      claim_ids: [exeg-003, exeg-004]
    - id: good_name_open_hand
      see: "Une bénévole reconnaît son ancienne professeure dans une épicerie solidaire; elle retire son tablier, contourne le comptoir et partage le pain à côté d’elle."
      tension: "Un besoin matériel peut être reçu sans réduire une personne à ce besoin ni transformer l’aide en domination."
      question: "Qu’est-ce qu’une main révèle qu’un compte ne dira jamais ?"
      memorable_act: "Quitter le côté du comptoir qui sépare et s’asseoir à hauteur égale."
      tomorrow_memory: "Deux femmes élégantes de part et d’autre d’un pain ouvert entre elles."
      claim_ids: [hist-003a, hist-003b, exeg-006, exeg-007]
    - id: repeating_sun
      see: "Après une répétition réussie, une danseuse quitte déjà l’étreinte du groupe, relance la caméra et reprend le premier mouvement; le bras de son amie reste suspendu."
      tension: "Quelque chose vient de réussir sans pouvoir être habité avant que le cycle recommence."
      question: "Pourquoi tant de mouvement peut-il sembler ne mener nulle part ?"
      memorable_act: "Voir le premier mouvement recommencer alors que les autres attendaient encore un regard."
      tomorrow_memory: "Un bras tendu vers quelqu’un qui regarde déjà la prise suivante."
      claim_ids: [hist-005a, hist-005b, hist-005c, exeg-008]
    - id: time_and_memory
      see: "Un père âgé répare un vêtement et tend un second outil; sa fille venue cinq minutes pose téléphone et clés hors de portée puis rapproche le tabouret."
      tension: "Une présence longtemps reportée peut encore être choisie sans réduire l’âge à la fragilité ni annoncer l’avenir."
      question: "Qu’est-ce que tu ne veux plus remettre à plus tard ?"
      memorable_act: "Mettre ce qui presse hors de portée et placer ses mains à côté de celles qui transmettent."
      tomorrow_memory: "Deux tabourets rapprochés pendant que le téléphone vibre ailleurs."
      claim_ids: [exeg-009, exeg-010]
    - id: weekly_contemplation
      see: "Une personne soulève l’une des six reproductions de même format; les cinq autres restent ouvertes, visibles et égales."
      tension: "Une image peut compter davantage aujourd’hui sans devenir un classement, un résumé ou une morale finale."
      question: "Quelle image veux-tu emporter ?"
      memorable_act: "Retenir une image sans retourner, couvrir ni diminuer les cinq autres."
      tomorrow_memory: "Une reproduction légèrement soulevée, cinq encore disponibles."
      claim_ids: [hist-002, exeg-001, exeg-002, exeg-003, exeg-004, exeg-005, exeg-006, exeg-007, exeg-008, exeg-009, exeg-010, exeg-011]

human_dramaturgy:
  owner: expedition-human-dramaturge
  revision: 2
  status: proposed_for_experience_and_truth_review
  casting_rule: "Personnages beaux, charismatiques et désirables par leur présence, leur style et la relation qu’on veut habiter; jamais sexualisés, plastiques, publicitaires ni privés de vulnérabilité."
  scenes:
    - unit_id: wisdom_voice
      references: [ot/prov/1]
      claim_ids: [exeg-001]
      truth_to_inhabit: "Au milieu d’un seuil public bruyant, entendre commence lorsque celui qui part interrompt son mouvement pour la voix qui l’appelle."
      people:
        - { role: sœur aînée, wants: "être entendue avant que son frère ne disparaisse dans le flux", lacks: "son attention à cet instant", does: "l’appelle clairement depuis le seuil", hides_or_resists: "l’impulsion de le poursuivre ou de le retenir physiquement" }
        - { role: jeune frère, wants: "continuer son départ avec le mouvement des autres", lacks: "un instant d’écoute réelle", does: "avance avec un écouteur déjà en place", hides_or_resists: "l’impulsion de continuer sans se retourner" }
      relationship: "Frère et sœur reconnaissables par leur familiarité immédiate, séparés de quelques pas par un courant de personnes qui entrent et sortent."
      contradictory_emotions: [élan_du_départ_et_attention_naissante, insistance_et_respect_de_la_distance]
      observable_moment: "Au seuil d’un lieu public animé, elle l’appelle alors qu’il a déjà rejoint les passants; sa main, qui allait remettre l’écouteur, s’immobilise et il le retire entièrement."
      decisive_gesture_or_look: "Son corps reste orienté vers le départ, mais son visage revient vers elle; elle demeure au seuil et soutient simplement son regard."
      silence_or_distance: "Deux ou trois pas et plusieurs passants restent entre eux; le bruit continue et aucun dialogue ultérieur n’est montré."
      subtext_without_scripture: "Quelqu’un qui part vient de choisir d’entendre la personne qui l’appelle."
      first_literal_idea_rejected: "Une femme anonyme personnifiant la Sagesse prêche seule au milieu d’un carrefour."
      stock_image_risk: "Publicité pour écouteurs, retrouvailles fraternelles parfaites ou campagne civique sur l’attention."
      magnetic_human_presence: "Deux adultes beaux et soignés, avec des styles distincts et une familiarité visible dans le regard; leur magnétisme vient du presque-départ et de l’attention retrouvée, jamais d’une pose."
      forbidden_visual_shortcuts: [street_preacher, metaphorical_crossroads, megaphone, raised_moralizing_finger, halo_or_providential_beam, frozen_crowd, explained_message, danger_cue, hug_or_reconciliation, guaranteed_outcome, advertising_pose]
      handoff_to_art: "Conserver exactement l’instant suspendu: elle appelle, il cesse d’avancer et retire l’écouteur, les autres continuent de passer; ne rien révéler du contenu, de la conversation suivante ou de son issue."

    - unit_id: joy_while_waiting
      references: [ot/prov/3, ot/prov/16]
      claim_ids: [exeg-002, exeg-005]
      truth_to_inhabit: "Ne pas contrôler son propre résultat n’empêche ni la confiance ni la joie offerte à l’autre."
      people:
        - { role: danseur choisi, wants: "accueillir enfin le rôle obtenu", lacks: "le calme après l’annonce", does: "laisse ses proches le célébrer", hides_or_resists: "sa main tremble encore" }
        - { role: ami non choisi, wants: "le même rôle et la relation intacte", lacks: "la victoire espérée", does: "applaudit puis vient serrer la main de son ami", hides_or_resists: "sa déception vive derrière un sourire sincère" }
      relationship: "Deux amis proches qui ont passé la même audition de danse."
      contradictory_emotions: [fierté_et_déception, joie_et_manque, confiance_sans_garantie]
      observable_moment: "L’ami non choisi cesse de froisser son numéro d’audition pour prendre la main tremblante du danseur choisi."
      decisive_gesture_or_look: "Sourire tourné vers l’ami, yeux légèrement humides, papier froissé encore visible entre deux doigts."
      silence_or_distance: "Un seul pas de retrait, jamais une exclusion du groupe."
      subtext_without_scripture: "Il ne nie ni la joie de l’autre ni sa propre peine et choisit la relation."
      first_literal_idea_rejected: "Un voyageur devant deux routes avec une carte."
      stock_image_risk: "Groupe uniformément euphorique autour d’une victoire vague."
      magnetic_human_presence: "Deux danseurs athlétiques, expressifs et élégants; l’attraction vient de leur complicité vulnérable."
      forbidden_visual_shortcuts: [fork, map, trophy, luxury, providential_beam, luminous_path, jealousy_caricature]
      handoff_to_art: "Faire lire simultanément le papier froissé, la main qui cesse de le froisser et le contact avec l’ami."

    - unit_id: gentle_answer
      references: [ot/prov/4, ot/prov/15]
      claim_ids: [exeg-003, exeg-004]
      truth_to_inhabit: "La faute reste réelle; une parole retenue peut empêcher la blessure suivante sans garantir la réconciliation."
      people:
        - { role: mère, wants: "vérité et responsabilité", lacks: "la certitude de pouvoir parler sans blesser", does: "voit la portière abîmée, commence à pointer puis s’arrête", hides_or_resists: "l’amour encore présent sous sa colère" }
        - { role: fille adulte, wants: "être reçue malgré sa faute", lacks: "le courage de soutenir le regard", does: "reste dans l’encadrement avec les clés", hides_or_resists: "sa honte derrière une posture prête à encaisser" }
      relationship: "Une mère et sa fille adulte devant la voiture familiale endommagée."
      contradictory_emotions: [colère_et_amour_retenu, honte_et_espoir_fragile]
      observable_moment: "La mère pose sa main ouverte sur la table et tire une chaise sans sourire; la fille relève les yeux."
      decisive_gesture_or_look: "Le doigt qui allait accuser s’ouvre en main posée; les clés restent dans la main de la fille."
      silence_or_distance: "Une chaise vide devient une invitation concrète avant toute parole."
      subtext_without_scripture: "La blessure n’a pas disparu, mais la prochaine parole ne sera pas une arme."
      first_literal_idea_rejected: "Un couple générique pose un téléphone sous une lampe chaude."
      stock_image_risk: "Conflit familial déjà résolu par un sourire ou un câlin."
      magnetic_human_presence: "Deux femmes soignées et expressives dont la ressemblance et la tension rendent la relation désirable malgré la faute."
      forbidden_visual_shortcuts: [phone_prop, theatrical_shouting, instant_hug, resolved_conflict, unsafe_submission]
      handoff_to_art: "Montrer la portière, les clés, la main ouverte et la chaise dans un même instant non résolu."

    - unit_id: good_name_open_hand
      references: [ot/prov/22, ot/prov/31]
      claim_ids: [hist-003a, hist-003b, exeg-006, exeg-007]
      truth_to_inhabit: "Le besoin matériel n’efface ni l’histoire, ni l’égalité, ni la valeur d’une personne."
      people:
        - { role: ancienne élève bénévole, wants: "aider sans dominer", lacks: "une manière de contourner l’humiliation", does: "retire badge et tablier puis contourne le comptoir", hides_or_resists: "son émotion de reconnaître son ancienne professeure" }
        - { role: ancienne professeure, wants: "recevoir de quoi manger sans être réduite à son besoin", lacks: "la sécurité matérielle", does: "commence à rendre le sac", hides_or_resists: "sa gêne derrière une élégance intacte" }
      relationship: "Une ancienne élève reconnaît son ancienne professeure dans une épicerie solidaire en fermeture."
      contradictory_emotions: [gêne_et_fierté, reconnaissance_et_tendresse]
      observable_moment: "La bénévole s’assied à côté d’elle et ouvre le pain entre elles au lieu de lui présenter le sac."
      decisive_gesture_or_look: "Après une hésitation, la professeure soutient enfin son regard."
      silence_or_distance: "Le comptoir cesse de les séparer."
      subtext_without_scripture: "L’aide devient une rencontre entre égales plutôt qu’une scène de sauvetage."
      first_literal_idea_rejected: "Deux inconnues sourient en se passant un sac devant une caméra."
      stock_image_risk: "Charité corporate avec sauveur et bénéficiaire."
      magnetic_human_presence: "Deux femmes élégantes et charismatiques, belles dans leur histoire partagée et leur dignité, jamais dans la mise en scène du manque."
      forbidden_visual_shortcuts: [bag_handoff_pose, savior_pose, coin_rebus, badge_rebus, poverty_costume, branded_charity]
      handoff_to_art: "Faire du contournement du comptoir, du pain partagé et du regard retrouvé le centre émotionnel."

    - unit_id: repeating_sun
      references: [ot/eccl/1]
      claim_ids: [hist-005a, hist-005b, hist-005c, exeg-008]
      truth_to_inhabit: "Quelque chose peut réussir sans rassasier celui qui relance déjà le cycle."
      people:
        - { role: danseuse principale, wants: "atteindre enfin la prise parfaite", lacks: "la capacité d’habiter la réussite présente", does: "sort du cercle, relance la caméra et reprend le premier mouvement", hides_or_resists: "son insatisfaction derrière l’exigence" }
        - { role: meilleure amie et partenaire, wants: "partager la réussite et la ramener au groupe", lacks: "un regard rendu par son amie", does: "tend les bras puis reste suspendue", hides_or_resists: "son inquiétude derrière l’admiration" }
      relationship: "Une troupe de danse après une répétition objectivement réussie."
      contradictory_emotions: [fierté_et_insatisfaction, admiration_et_inquiétude]
      observable_moment: "Tous s’approchent pour l’embrasser; elle regarde l’écran, relance l’enregistrement et reprend."
      decisive_gesture_or_look: "Le bras de son amie reste dans le vide tandis que la danseuse se détourne des visages."
      silence_or_distance: "Une distance d’un pas ouvre déjà un nouveau cycle."
      subtext_without_scripture: "La réussite vient d’avoir lieu, mais elle ne peut pas l’habiter avant de recommencer."
      first_literal_idea_rejected: "Une personne seule regarde le soleil se lever sur un fleuve."
      stock_image_risk: "Silhouette contemplative devant horizon ou clip de danse victorieux sans manque."
      magnetic_human_presence: "Troupe athlétique et stylée; la danseuse magnétique reste belle dans l’effort et lisiblement vulnérable."
      forbidden_visual_shortcuts: [horizon, sunrise, river, wind_cycle, time_loop, lonely_silhouette]
      handoff_to_art: "La caméra relancée, le premier mouvement repris et le bras suspendu de l’amie doivent raconter la scène sans texte."

    - unit_id: time_and_memory
      references: [ot/eccl/3, ot/eccl/12]
      claim_ids: [exeg-009, exeg-010]
      truth_to_inhabit: "Une présence longtemps reportée peut encore être choisie maintenant, sans réduire l’âge au déclin."
      people:
        - { role: père âgé, wants: "transmettre un geste familial", lacks: "la certitude d’une prochaine occasion", does: "répare un vêtement à la machine puis tend le second outil", hides_or_resists: "son urgence pour ne pas culpabiliser sa fille" }
        - { role: fille adulte, wants: "tenir son agenda et ne pas regretter", lacks: "du temps qu’elle croit pouvoir toujours remettre", does: "arrive manteau, clés et téléphone en main", hides_or_resists: "son pressentiment du regret derrière l’impatience" }
      relationship: "Un père actif transmet son savoir-faire à sa fille venue seulement cinq minutes."
      contradictory_emotions: [affection_et_urgence, impatience_et_pressentiment]
      observable_moment: "Elle pose téléphone et clés hors de portée, rapproche le second tabouret et place ses mains à côté des siennes."
      decisive_gesture_or_look: "Le second outil reste tendu jusqu’à ce qu’elle s’assoie."
      silence_or_distance: "Le téléphone vibre encore, désormais hors de portée."
      subtext_without_scripture: "Elle décide que cette présence ne sera pas encore reportée; l’aîné reste sujet et transmetteur."
      first_literal_idea_rejected: "Une personne âgée allume une lampe au crépuscule devant un agenda."
      stock_image_risk: "Vieillesse fragile, album souvenir ou coucher de soleil mélancolique."
      magnetic_human_presence: "Père élégant, actif et assuré; fille adulte sophistiquée dont l’attention retrouvée rend leur lien désirable."
      forbidden_visual_shortcuts: [lamp_at_dusk, calendar, clock, photo_album, frail_elder, broken_body, sunset]
      handoff_to_art: "Cadrer la transmission par les mains et les outils, avec les clés et le téléphone volontairement écartés."

    - unit_id: weekly_contemplation
      references: [ot/prov/1, ot/prov/3, ot/prov/4, ot/prov/15, ot/prov/16, ot/prov/22, ot/prov/31, ot/eccl/1, ot/eccl/3, ot/eccl/12]
      claim_ids: [hist-002, exeg-001, exeg-002, exeg-003, exeg-004, exeg-005, exeg-006, exeg-007, exeg-008, exeg-009, exeg-010, exeg-011]
      truth_to_inhabit: "Contempler consiste ici à retenir une image qui continue de travailler en soi sans fermer, classer ni résoudre les cinq autres."
      people:
        - { role: personne ayant traversé les six découvertes, wants: "emporter une image précise avec elle", lacks: "une réponse capable de résumer toute la semaine", does: "soulève une seule des six reproductions", hides_or_resists: "l’envie de transformer son choix en classement ou en conclusion" }
      relationship: "Une personne face aux six scènes déjà vécues; son geste exprime une proximité particulière avec l’une d’elles, sans désavouer les autres."
      contradictory_emotions: [reconnaissance_et_hésitation, attachement_et_non_clôture]
      observable_moment: "Six reproductions de même format sont ouvertes et entièrement visibles; la personne glisse une main sous l’une d’elles et la soulève, tandis que les cinq autres restent face visible, espacées de manière égale et intactes."
      decisive_gesture_or_look: "Son regard demeure sur l’image choisie; sa main libre ne rassemble, ne retourne et ne couvre aucune des cinq autres."
      silence_or_distance: "Aucun second geste, aucune annotation et aucune réaction de révélation; le choix reste calme et les cinq images non retenues demeurent disponibles."
      subtext_without_scripture: "Cette image compte davantage pour elle aujourd’hui, mais elle ne prétend ni résumer ni refermer les autres."
      first_literal_idea_rejected: "Un lecteur solitaire devant six fenêtres symboliques."
      stock_image_risk: "Vision board de développement personnel, journaling d’influenceur, cartes inspirantes classées ou révélation spirituelle publicitaire."
      magnetic_human_presence: "Visage pleinement visible, style personnel soigné et concentration expressive; la présence est attirante par son attention silencieuse, sans mélancolie solitaire, perfection plastique ni pose de méditation."
      forbidden_visual_shortcuts: [six_windows, symbolic_collage, constellation, ranked_images, timeline, glowing_chosen_image, dimmed_unselected_images, five_closed_images, seventh_symbol, caption_or_label, moral_revelation, resolved_smile, hands_only, solitary_horizon, wellness_advertising]
      handoff_to_art: "Le sens repose exclusivement sur ce rapport visible: une reproduction retenue, cinq encore ouvertes et égales; ne créer aucun nouvel événement, aucune morale, aucun dénouement et aucun signe distinguant la bonne image."

