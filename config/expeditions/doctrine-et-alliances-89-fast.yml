            02. At a party, you’re offered alcohol. What does the text call for? a=Leave the party; b=Give in to avoid the looks; c=Say no without explaining; d=Turn the party into a sermon. Correct=c. Reveal: Out of love for the Lord and yourself, you can say no without explaining, condemning others, or breaking the bond.
            03. True or false: the Word of Wisdom bans all wine, no exceptions. a=True; b=False. Correct=b. Reveal: Verses 5–6 keep an exception for the sacrament: pure grape wine made by the Saints.
            04. True or false: living the Word of Wisdom guarantees good health. a=True; b=False. Correct=b. Reveal: The Word of Wisdom is neither a medical contract nor a license to judge others.
            05. When is it pleasing to the Lord for us to eat meat? a=In winter, cold, or famine; b=Every day with gratitude; c=Only at celebrations; d=After physical exertion. Correct=a. Reveal: Verses 12–13 counsel using it sparingly, only in winter, cold weather, or famine.
