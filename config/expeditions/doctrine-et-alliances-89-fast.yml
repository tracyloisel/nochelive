        dc89-7-8:
          reference: "D&A 89:7-8"
          url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=fra"
          retrieved_on: "2026-09-03"
          kind: scripture
          source_summary: "Les boissons fortes sont réservées au lavage du corps; le tabac n’est destiné ni au corps ni au ventre, n’est pas bon pour l’homme et est évoqué pour les contusions et le bétail malade."
          interpretation: "Les versets excluent la consommation de tabac et distinguent lavage corporel, contusions et usage pour des animaux malades."
          application: "Le visuel ne transforme ni l’usage historique en conseil actuel ni le tabac en accessoire séduisant."
        dc89-9:
          reference: "D&A 89:9"
          url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=fra"
          retrieved_on: "2026-09-03"
          kind: scripture
          source_summary: "Le verset déclare que les boissons brûlantes ne sont ni pour le corps ni pour le ventre."
          interpretation: "Le texte ne nomme pas ici une boisson précise; le visuel doit préserver cette limite."
          application: "Le refus peut rester beau et paisible sans représenter la personne comme privée de joie."
        dc89-10:
          reference: "D&A 89:10"
          url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=fra"
          retrieved_on: "2026-09-03"
          kind: scripture
          source_summary: "Dieu a prévu les herbes salutaires pour la constitution, la nature et l’usage de l’être humain."
          interpretation: "Le qualificatif salutaire limite le groupe visé; le verset ne transforme pas toute plante en remède."
          application: "La sélection avisée évite l’aura magique et toute prescription médicale inventée."
        dc89-12-13:
          reference: "D&A 89:12-13"
          url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=fra&id=p12-p13#p12"
          retrieved_on: "2026-09-03"
          kind: scripture
          exact_text:
            verse_12: "Oui, moi, le Seigneur, j’ai aussi prévu la chair des bêtes et des oiseaux du ciel pour l’usage de l’homme avec actions de grâces ; toutefois, il faut en user avec économie."
            verse_13: "Et il m’est agréable que l’on n’en use qu’en période d’hiver, ou de froid, ou de famine."
          source_summary: "La chair des bêtes et des oiseaux est prévue pour l’usage humain avec actions de grâces et économie; le Seigneur dit qu’il lui est agréable de n’en user qu’en hiver, au froid ou en famine."
          interpretation: "Le verset 13 donne trois circonstances à la réponse du Quiz; le verset 12 empêche d’en faire une permission d’abondance sans mesure."
          application: "La scène rend visibles une circonstance nommée, l’hiver, et un usage reconnaissant et mesuré, sans prescrire un régime universel."
        dc89-18-21:
