            09. Verdadeiro ou falso: D&C 89 permite fumar ou mascar tabaco. a=Verdadeiro; b=Falso. Correta=b. Revelação: O versículo 8 diz que o tabaco não é para o corpo nem o ventre: fumar ou mascar é proibido.
