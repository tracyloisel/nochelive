        3. [texte, vrai_faux, D&A 89:5-6] Vrai ou faux : la Parole de Sagesse interdit tout vin, sans exception.
        A. Vrai
        B. Faux
        Révélation : Les versets 5 et 6 gardent une exception pour le sacrement : du vin pur de raisin fabriqué par les saints.

        4. [vie, vrai_faux, application] Vrai ou faux : renoncer garantit de rester en bonne santé.
        A. Vrai
        B. Faux
        Révélation : La Parole de Sagesse n’est ni un contrat médical ni un permis de juger les autres.

        5. [texte, qcm, D&A 89:7-8] Boissons fortes et tabac : quels usages leur sont réservés ?
        A. Lavage; bleus et bétail malade
        B. Repas quotidiens et détente
        C. Boissons d’hiver et remèdes
        D. Nourriture et médecine
        Révélation : Les boissons fortes servent au lavage du corps. Le tabac sert aux contusions et au bétail malade.

        6. [vie, qcm, application] Après une rechute, quel premier geste respecte la dignité ?
        A. La cacher pour sauver son image
        B. Dire vrai, demander de l’aide
        C. Attendre avant de prier
        D. Déclarer son baptême sans valeur
        Révélation : Une rechute n’efface ni dignité ni alliance. Dire vrai, prier et demander de l’aide rouvrent le chemin.

        7. [texte, qcm, D&A 89:9] Selon le verset 9, que dit le texte des boissons brûlantes ?
        A. Excellentes pour la santé
        B. Réservées aux fièvres
        C. Ni pour le corps ni le ventre
        D. Permises seulement le soir
        Révélation : Le verset 9 dit que les boissons brûlantes ne sont ni pour le corps ni pour le ventre.

        8. [vie, vrai_faux, D&A 89:10] Vrai ou faux : créées par Dieu, toutes les plantes guérissent.
        A. Vrai
        B. Faux
        Révélation : Le verset 10 parle d’herbes salutaires pour l’homme. Il ne dit pas que toute plante est un remède.

        9. [texte, vrai_faux, D&A 89:8] Vrai ou faux : D&A 89 permet de fumer ou de chiquer du tabac.
        A. Vrai
        B. Faux
        Révélation : Le verset 8 dit que le tabac n’est ni pour le corps ni pour le ventre : le fumer ou le chiquer est proscrit.

        10. [vie, qcm, application] Quel choix ressemble vraiment à un sacrifice de cœur ?
        A. Renoncer sans rien exiger
        B. Renoncer pour obtenir une faveur
        C. Imposer son choix aux autres
        D. Cacher son désir pour paraître
        Révélation : Le sacrifice garde le désir réel : on choisit Dieu librement et on espère sa bénédiction sans l’exiger.

        Verdict révision humaine 4 : PASS. Les dix prompts restent sous 72 graphèmes, tous les choix sous 32 et tous les feedbacks sous 120. Le rendu de la copie exacte sur la feuille Street réelle 390 × 667 est consigné dans `fast.result.voix`; aucun texte n’a été traduit, aucune image n’a été générée et aucun lot n’a été autorisé.

        Revalidation technique — révision YAML 44, sans réécriture éditoriale.

        La preuve précédente par substitution DOM est annulée : elle conservait la bonne réponse de la question hôte et marquait donc A juste sur toutes les révélations. Le test système permanent charge les dix entrées de `fast.result.quiz_final.questions`, construit dix vraies `QuizDefinition::Question` dans un catalogue de test isolé, ouvre un vrai `QuizRun` et traverse la soumission Street réelle à 390 × 667. Le catalogue runtime est restauré en teardown.

