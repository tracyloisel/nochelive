            02. En una fiesta te ofrecen alcohol. ¿A qué te invita el texto? a=Irte de la fiesta; b=Ceder para evitar miradas; c=Cuidarte sin justificarte; d=Convertir la fiesta en sermón. Correcta=c. Revelación: Por amor al Señor y a ti, puedes decir que no sin justificarte, condenar a otros ni romper el vínculo.
