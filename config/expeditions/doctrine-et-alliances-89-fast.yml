  agent_memory:
    influenceur:
      owner: expedition-fast-influenceur
      revision: 17
      status: complete
      history:
        - revision: 1
          status: complete
          production: |-
            Angle : « Qui choisit ce qui entre dans ton corps : toi, Dieu, ton groupe… ou quelqu’un qui profite de tes automatismes ? »

            Premier écran : « Ton corps t’appartient-il encore ? »

            Script 35–45 secondes :
            Tu crois que Doctrine et Alliances 89, c’est seulement « pas d’alcool, pas de tabac » ? Le texte commence autrement : « non par commandement ou par contrainte », comme un principe accompagné d’une promesse, adapté même aux plus faibles.

            Puis il avertit que certains chercheront à exploiter nos désirs. La vraie question devient : qu’est-ce qui dirige tes habitudes ?

            Oui, le texte pose des limites. Mais sa moitié oubliée parle aussi de fruits, de saisons, de gratitude, de prudence, de viande consommée avec économie et de grains qui soutiennent la vie.

            Ce n’est donc pas seulement : « Qu’est-ce que je refuse ? » C’est : « Comment est-ce que je reçois et respecte la vie ? »

            Et la promesse finale relie le corps à la sagesse, à la connaissance et à l’endurance. Alors, quelle habitude pourrais-tu regarder sans honte, mais avec assez de vérité pour retrouver ta liberté ?

            Question finale : « Une habitude que tu as choisie — ou qui t’a choisi ? »

            Tensions humaines :
            - Appartenance au groupe contre liberté de conscience.
            - Dépendance abordée sans humiliation ni guérison instantanée.
            - Gratitude et modération dans les contraintes d’un vrai budget familial.
            - Promesses reçues sans accuser les personnes malades, handicapées ou épuisées.

            Garde-fous :
            - Ne pas transformer le verset 4 en théorie du complot.
            - Ne pas déduire du seul terme « boissons brûlantes » toute l’interprétation moderne.
            - Ne pas effacer la tension entre l’absence initiale de contrainte et le statut religieux ultérieur.
            - Ne promettre ni invulnérabilité ni guérison biologique.
            - Ne pas réduire la section à quatre interdits ou à un classement des « bons » corps.
      production: |-
        Angle humain : « Quand une habitude promet de te détendre, de t’intégrer ou de te récompenser, qui tient réellement le volant ? »

        Premier écran : « Qui commande tes habitudes ? »

        Script 35–45 secondes :
        On résume souvent Doctrine et Alliances 89 à quatre produits interdits. Pourtant, le texte commence par un principe accompagné d’une promesse, pensé même pour les plus faibles. Puis il pose une question très actuelle : que se passe-t-il quand d’autres intérêts apprennent à exploiter nos désirs ? La réponse n’est pas seulement une série de « non ». Le chapitre parle aussi de fruits, de saisons, de gratitude, de prudence et de grains qui soutiennent la vie. Autrement dit : ton corps n’est ni un trophée ni un motif de honte. C’est l’endroit concret où tu peux apprendre à recevoir, renoncer et choisir librement devant Dieu. Et les promesses de sagesse et d’endurance n’autorisent jamais à juger la maladie d’autrui. Alors, quelle habitude mérite aujourd’hui un regard honnête, sans honte ?

        Question finale : « Quelle habitude te sert encore — et laquelle te dirige ? »

        Risques de simplification transmis au Mystique :
        - Réduire le chapitre aux interdits et oublier ses dons, sa gratitude et son économie.
        - Confondre le texte de 1833, sa réception ultérieure dans l’Église et une application personnelle actuelle.
        - Transformer les promesses des versets 18 à 21 en garantie médicale ou en droit de juger autrui.
    mystique:
      owner: expedition-fast-mystique
      revision: 18
      status: complete
      history:
        - revision: 2
          status: complete
          production: |-
            La fonction mystique de Doctrine et Alliances 89 est de faire du corps un lieu de discernement et d’alliance. Le texte ne sépare pas une « vie spirituelle » noble d’un corps encombrant : il fait passer la relation à Dieu par les gestes les plus ordinaires — boire, manger, recevoir les fruits de la terre, poser une limite, remercier.

            Son mouvement intérieur peut se lire en trois passages :

            1. Se réveiller. L’avertissement des versets 1 à 4 démasque ce qui gouverne silencieusement le désir : l’habitude, la pression du groupe ou l’intérêt d’autrui. La mystique commence non par l’extase, mais par une conscience rendue libre.

            2. Recevoir avec mesure. Les interdits des versets 5 à 9 et les dons nommés aux versets 10 à 17 forment ensemble une ascèse de la gratitude. Renoncer n’est pas mépriser la matière ; c’est apprendre à ne plus consommer le monde comme si tout nous était dû. Saisons, prudence, économie et actions de grâces replacent la créature dans une relation juste avec le Créateur et avec la création.

            3. Marcher dans une vie unifiée. Les promesses des versets 18 à 21 relient santé, sagesse, connaissance, course et endurance. Elles dessinent moins une récompense biologique automatique qu’un être rendu disponible. L’image finale de protection évoque la Pâque et inscrit cette discipline quotidienne dans une mémoire d’alliance et de délivrance, sans promettre l’invulnérabilité.

            Ainsi, la question mystique du texte n’est pas seulement « Qu’ai-je le droit de consommer ? », mais « À quoi est-ce que je consens, jour après jour, avec mon corps ? » Sa visée profonde est une liberté incarnée : un corps ni adoré, ni humilié, ni utilisé pour classer les croyants, mais accueilli comme le lieu fragile où l’on apprend à choisir Dieu dans le réel.
      production: |-
        Phrase-thèse : Doctrine et Alliances 89 fait du corps le lieu quotidien d’une alliance libre : recevoir les dons de Dieu avec gratitude, offrir à Dieu les désirs qui menacent de nous gouverner et apprendre une liberté capable d’aimer.

        Mouvement intérieur :

        1. Être réveillé. Les versets 1 à 4 déplacent le regard de l’objet consommé vers ce qui agit sur le désir : automatisme, pression d’appartenance ou intérêt d’autrui. Le premier mouvement spirituel consiste à redevenir présent à ce qui nous conduit.

        2. Recevoir et offrir. Les limites des versets 5 à 9 et les dons des versets 10 à 17 appartiennent au même apprentissage. La matière n’est pas méprisée : fruits, plantes, chair et grains sont reçus selon la saison, avec actions de grâces, prudence et économie. Lorsqu’un plaisir, un soulagement ou l’approbation du groupe demeure réellement désirable, y renoncer librement par amour pour Dieu peut devenir un sacrifice de cœur. Ce sacrifice n’achète pas une bénédiction : il remet le désir dans l’alliance.

        3. Marcher accompagné. Les versets 18 à 21 ouvrent un horizon de sagesse, de connaissance, d’endurance et de délivrance. La promesse ne transforme pas l’obéissance en contrat médical. Elle invite à recevoir de Dieu de quoi continuer le chemin, y compris dans un corps malade, handicapé, dépendant ou fatigué.

        Pratique spirituelle concrète : choisir une seule habitude; nommer devant Dieu le bien véritable qu’on y cherche; observer sans honte ce qu’elle donne et ce qu’elle prend; puis offrir aujourd’hui un geste mesurable de liberté — renoncer, différer, demander de l’aide ou recevoir autrement — et rendre grâce pour le don que l’on veut protéger.

        Limites : ne pas faire d’une dépendance une simple faiblesse morale; ne pas présenter le sacrifice comme une transaction qui garantirait santé ou protection; ne pas juger la foi d’après un corps; ne pas confondre la formulation du texte de 1833, sa réception ultérieure dans l’Église et une application personnelle; ne pas réduire la section aux seuls interdits.
    nouveau_baptise:
      owner: expedition-fast-nouveau-baptise
      revision: 19
      status: complete
      history:
        - revision: 3
          status: complete
          production: |-
            Pour un nouveau baptisé, Doctrine et Alliances 89 peut d’abord être une bonne nouvelle : Dieu s’intéresse à toute sa vie, jusque dans les habitudes très concrètes de son corps. Le baptême n’ouvre pas un chemin où il faudrait devenir parfait d’un coup ; il ouvre un apprentissage où l’on découvre, choix après choix, ce qui rend plus libre pour suivre le Christ.

            Ce texte peut lui offrir quatre repères :

            1. Une boussole plutôt qu’une liste pour se comparer. La Parole de Sagesse aide à demander : « Cette habitude me rend-elle plus libre, plus présent à Dieu et aux autres ? » Elle ne donne pas le droit de mesurer la fidélité d’autrui à son apparence, sa santé ou son alimentation.

            2. Le droit de commencer humblement. Certaines habitudes se quittent facilement ; d’autres touchent une dépendance, une histoire familiale ou la peur d’être exclu du groupe. Un nouveau baptisé peut avancer honnêtement, demander de l’aide à Dieu, à des proches sûrs et, si nécessaire, à des professionnels. Une difficulté n’annule ni son alliance ni sa dignité.

            3. Une manière positive de recevoir la création. Les plantes, les fruits, les grains, les saisons, la gratitude et l’économie montrent que le chemin ne consiste pas seulement à dire non. Il apprend aussi à dire merci, à choisir avec mesure et à respecter la vie, dans les limites réelles de son budget, de sa santé et de sa famille.

            4. Une promesse de compagnonnage, pas un contrat de performance physique. Les versets 18 à 21 peuvent nourrir l’espérance que Dieu donne sagesse, connaissance et force pour continuer. Ils ne signifient pas qu’une personne malade, handicapée ou épuisée aurait moins de foi. La fidélité peut se voir non dans un corps invulnérable, mais dans la grâce de marcher encore avec Dieu.

            Pour son chemin de vie, le premier pas pourrait donc être très simple : choisir une habitude à regarder dans la prière, sans honte et sans mise en scène, puis demander : « Seigneur, qu’est-ce qui m’aiderait à devenir plus libre pour t’aimer et aimer les autres ? »

            Ainsi, Doctrine et Alliances 89 devient moins un test d’appartenance qu’une école quotidienne de liberté, de gratitude et de confiance.
      production: |-
        Bonne nouvelle : Dieu ne demande pas au nouveau baptisé de devenir instantanément un modèle de maîtrise. Doctrine et Alliances 89 lui révèle que sa vie corporelle intéresse Dieu et que l’alliance peut se vivre dans des décisions ordinaires : recevoir un don avec gratitude, reconnaître ce qui le gouverne, renoncer librement et demander de l’aide.

        Ce qui peut être reçu :
        - Le texte est annoncé comme un principe accompagné d’une promesse, adapté même aux plus faibles. La faiblesse n’exclut donc pas du chemin.
        - La Parole de Sagesse contient des « oui » autant que des limites : fruits, plantes, grains, saisons, actions de grâces, prudence et économie.
        - Offrir à Dieu un désir encore réel peut être un sacrifice de cœur : non pour acheter une bénédiction, mais pour choisir à qui l’on veut appartenir.

        Ce qui risque d’être mal compris :
        - Confondre le texte de 1833 avec toute sa réception actuelle dans l’Église sans expliquer la différence.
        - Faire de chaque difficulté une faute, ou de la santé visible un bulletin de fidélité.
        - Présenter l’abstinence comme un changement facile, solitaire et immédiat, surtout lorsqu’une dépendance ou la peur de perdre son groupe est en jeu.

        Premier pas réaliste : choisir une seule habitude. Nommer dans la prière ce qu’elle promet vraiment — détente, plaisir, courage, appartenance — puis décider d’un geste possible aujourd’hui : différer, refuser une fois, remplacer, parler à une personne sûre ou demander une aide professionnelle. Ce pas n’a pas besoin d’être spectaculaire pour être fidèle.

        Question encore ouverte : « Si ce choix me coûte une amitié, une habitude familiale ou une place dans mon groupe, comment Dieu et l’Église peuvent-ils m’aider sans me faire honte ? »
    quiz:
      owner: expedition-fast-quiz
      revision: 57
      status: complete
      history:
        - revision: 4
          status: revision_required
          production: |-
            1. [texte, D&A 89:1-3] Comment Doctrine et Alliances 89 présente-t-elle d’abord la Parole de Sagesse ?
            A. Comme une règle réservée aux dirigeants
            B. Comme un principe accompagné d’une promesse, « non par commandement ni contrainte »
            C. Comme un traitement contre toutes les maladies
            D. Comme une liste destinée à classer les croyants
            Réponse : B. Le texte la présente comme un principe adapté même aux plus faibles.

            2. [vie, application] Une habitude est très populaire dans ton groupe. Quelle question rejoint le mieux l’appel du texte au discernement ?
            A. « Comment cacher mon choix aux autres ? »
            B. « Est-ce que tout le monde le fait ? »
            C. « Cette habitude me rend-elle plus libre pour aimer Dieu et les autres ? »
            D. « Qui puis-je juger à cause de ses habitudes ? »
            Réponse : C. La Parole de Sagesse peut devenir une boussole de liberté, pas un outil de comparaison.

            3. [texte, D&A 89:8] Que dit précisément le texte au sujet du tabac ?
            A. Qu’il est bon pour le corps s’il est utilisé avec modération
            B. Qu’il n’est pas destiné au corps ni au ventre, tout en évoquant un usage pour les contusions et le bétail malade
            C. Qu’il est permis uniquement pendant l’hiver
            D. Qu’il remplace les plantes médicinales
            Réponse : B.

            4. [vie, application] Une personne lutte contre une dépendance. Quelle réaction respecte le mieux l’esprit de cette section ?
            A. Lui dire que sa difficulté prouve un manque de foi
            B. Exiger qu’elle change immédiatement et seule
            C. L’accompagner sans humiliation vers un pas honnête, avec une aide spirituelle, relationnelle et, si nécessaire, professionnelle
            D. Éviter complètement le sujet
            Réponse : C. Une difficulté n’efface ni l’alliance ni la dignité d’une personne.

            5. [texte, D&A 89:10-17] Quelle description correspond aux conseils positifs de ces versets ?
            A. Refuser tous les plaisirs liés à la nourriture
            B. Recevoir plantes et fruits avec prudence et gratitude, user de la chair avec économie et reconnaître les grains comme soutien de la vie
            C. Suivre un régime coûteux et identique pour tous
            D. Ne manger que ce qui pousse hors du sol
            Réponse : B.

            6. [vie, application] Dans une famille au budget limité, quelle application est la plus fidèle au texte ?
            A. Acheter des aliments coûteux pour prouver sa fidélité
            B. Culpabiliser ceux qui ne peuvent pas suivre un régime idéal
            C. Choisir avec gratitude et mesure parmi les possibilités réellement accessibles
            D. Faire de chaque repas un test spirituel
            Réponse : C. Prudence, économie et actions de grâces invitent à une relation juste, pas à une performance alimentaire.

            7. [texte, D&A 89:18-21] Quelles promesses apparaissent à la fin de la section ?
            A. Richesse et réussite sociale
            B. Santé, sagesse, trésors de connaissance, endurance et protection
            C. Disparition immédiate de toute souffrance
            D. Supériorité sur ceux qui vivent autrement
            Réponse : B.

            8. [vie, application] Une personne fidèle reste malade ou handicapée. Que peut-on conclure à partir des promesses du texte ?
            A. Qu’elle a nécessairement désobéi
            B. Qu’elle manque de foi
            C. Que les promesses ne permettent pas de juger son corps ou sa fidélité
            D. Qu’elle doit cacher sa souffrance
            Réponse : C. Ces promesses nourrissent l’espérance et le compagnonnage avec Dieu ; elles ne constituent pas un contrat d’invulnérabilité.

            9. [texte, D&A 89:4] Contre quoi ce verset met-il en garde ?
            A. Toute activité commerciale
            B. Les mauvaises intentions et les desseins de personnes qui cherchent à exploiter autrui
            C. Les progrès scientifiques
            D. Le fait de vivre en groupe
            Réponse : B. Le verset invite à la vigilance sans autoriser une théorie du complot contre des personnes ou des groupes précis.

            10. [vie, application] Quel premier pas concret résume le mieux l’enseignement de Doctrine et Alliances 89 pour la vie quotidienne ?
            A. Examiner toutes les habitudes des autres
            B. Transformer son alimentation entière en une journée
            C. Choisir une habitude, la regarder dans la prière sans honte et demander ce qui rendrait plus libre pour aimer
            D. Se concentrer uniquement sur les interdits
            Réponse : C. Le texte ouvre une école quotidienne de liberté incarnée, de gratitude et de confiance.
        - revision: 9
          status: complete
          production: |-
            1. [texte, qcm, D&A 89:1-3] Comment le texte présente-t-il d’abord la Parole de Sagesse ?
            A. Une loi de santé réservée aux dirigeants
            B. Un principe accompagné d’une promesse, adapté même aux plus faibles
            C. Un traitement qui empêche toute maladie
            D. Un régime identique imposé à tous
            Réponse : B. Les versets 2 et 3 parlent explicitement d’un principe accompagné d’une promesse, adapté à la capacité des faibles.

            2. [vie, qcm, application] Une habitude est populaire dans ton groupe. Quelle question ouvre le meilleur discernement ?
            A. Est-ce que tout le monde le fait ?
            B. Comment cacher mon choix ?
            C. Cette habitude me rend-elle plus libre pour aimer Dieu et les autres ?
            D. Qui puis-je juger à cause d’elle ?
            Réponse : C. C’est une application du texte : la liberté et l’amour orientent le discernement, pas la comparaison.

            3. [texte, vrai_faux, D&A 89:8] Le verset 8 dit que le tabac n’est ni pour le corps ni pour le ventre.
            A. Vrai
            B. Faux
            Réponse : A. C’est la formulation explicite du verset, qui évoque ensuite d’autres usages avec sagesse et savoir-faire.

            4. [vie, vrai_faux, application] Demander une aide professionnelle peut faire partie d’un chemin spirituel honnête face à une dépendance.
            A. Vrai
            B. Faux
            Réponse : A. Cette application respecte la dignité de la personne et reconnaît qu’une aide spirituelle, relationnelle ou professionnelle peut être nécessaire.

            5. [texte, qcm, D&A 89:10-17] Quelle image d’ensemble ces versets donnent-ils des aliments ?
            A. Des biens à recevoir avec gratitude, prudence et mesure
            B. Une épreuve destinée à classer les croyants
            C. Un luxe réservé à ceux qui peuvent tout choisir
            D. Une matière sans lien avec la vie spirituelle
            Réponse : A. Le texte associe plantes, fruits, chair et grains aux saisons, aux actions de grâces, à la prudence et à l’économie.

            6. [vie, qcm, application] Dans une famille au budget limité, quelle application reste fidèle à cette lecture ?
            A. Acheter des aliments coûteux pour prouver sa foi
            B. Culpabiliser ceux qui ont moins de choix
            C. Choisir avec gratitude et mesure parmi ce qui est accessible
            D. Faire de chaque repas un test spirituel
            Réponse : C. L’application tient compte des possibilités réelles sans abandonner la gratitude ni la mesure.

            7. [texte, vrai_faux, D&A 89:19] Le texte promet de la sagesse et de grands trésors de connaissance.
            A. Vrai
            B. Faux
            Réponse : A. Le verset 19 nomme explicitement la sagesse et de grands trésors de connaissance, y compris des trésors cachés.

            8. [vie, vrai_faux, application] La maladie d’une personne prouve qu’elle a désobéi à la Parole de Sagesse.
            A. Vrai
            B. Faux
            Réponse : B. Cette conclusion n’est pas autorisée par le dossier : les promesses ne donnent pas le droit de juger le corps ou la fidélité d’autrui.

            9. [texte, qcm, D&A 89:4] Contre quoi le verset 4 met-il en garde ?
            A. Toute activité commerciale
            B. De mauvaises intentions et des desseins qui cherchent à exploiter
            C. Les progrès scientifiques
            D. Le simple fait de vivre en groupe
            Réponse : B. Le verset avertit de mauvaises intentions et de mauvais desseins sans autoriser à accuser un groupe précis.

            10. [vie, qcm, application] Quel premier pas correspond le mieux à la lecture proposée dans ce dossier ?
            A. Examiner les habitudes des autres
            B. Tout transformer en une journée
            C. Regarder une habitude dans la prière, sans honte
            D. Ne retenir que les interdits
            Réponse : C. Cette application commence humblement par une habitude et cherche une liberté plus grande pour aimer Dieu et les autres.
        - revision: 20
          status: complete
          production: |-
            1. [texte, qcm, D&A 89:1-3] À qui la Parole de Sagesse est-elle adressée au début de la section ?
            A. Seulement à Joseph Smith et à sa famille
            B. Au conseil des grands prêtres, à l’Église et aux saints de Sion
            C. Uniquement aux personnes déjà malades
            D. Aux seuls responsables chargés de la faire appliquer
            Réponse : B. Le verset 1 nomme le conseil assemblé, l’Église et les saints de Sion; les versets suivants l’adaptent même aux plus faibles.

            2. [vie, qcm, application] Lors d’une fête, refuser une habitude menace ta place dans le groupe. Quel discernement correspond au dossier ?
            A. Partir sans explication et rompre toute relation
            B. Céder pour prouver que l’on ne juge personne
            C. Nommer le désir d’appartenir et chercher une manière libre de rester en lien
            D. Transformer immédiatement la soirée en leçon pour les autres
