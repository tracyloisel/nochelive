          - { id: b, text: "Chaque jour avec gratitude" }
          - { id: c, text: "Lors des fêtes seulement" }
          - { id: d, text: "Après un effort physique" }
        correct_choice: a
        feedback: "Les versets 12–13 conseillent d’en user avec économie, seulement en hiver, par temps froid ou en période de famine."
      - id: fast-dc89-q06
        type: vie
        format: qcm
        reference: application
        prompt: "Après une rechute, en cas d'addiction, qu'est-il bon de faire ?"
        choices:
