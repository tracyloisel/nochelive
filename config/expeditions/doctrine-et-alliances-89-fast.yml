        pt-BR:
          status: complete
          source_locale: fr
          source_approval_revision: 61
          localized_directly_from_source: true
          surface_pack_title: "Doutrina e Convênios 89"
          voice_gate: PASS
          mobile_copy_gate: PASS
          questions:
            - id: fast-dc89-q01
              type: texte
              format: qcm
              reference: "D&A 89:1-3"
              prompt: "No início, para quem é a Palavra de Sabedoria?"
              choices:
                - { id: a, text: "A Joseph Smith e sua família" }
                - { id: b, text: "Conselho, Igreja, santos de Sião" }
                - { id: c, text: "A quem já estava doente" }
                - { id: d, text: "Só aos líderes da Igreja" }
              correct_choice: b
              feedback: "O versículo 1 cita o conselho, a Igreja e os santos de Sião. O princípio serve até para os mais fracos."
            - id: fast-dc89-q02
              type: vie
              format: qcm
              reference: application
              prompt: "Numa festa, alguém oferece álcool. O que o texto convida você a fazer?"
              choices:
                - { id: a, text: "Sair da festa" }
                - { id: b, text: "Ceder para evitar os olhares" }
                - { id: c, text: "Se proteger sem se justificar" }
                - { id: d, text: "Transformar a festa em sermão" }
              correct_choice: c
              feedback: "Por amar o Senhor e cuidar de você, dá para recusar sem se explicar, julgar os outros ou romper o vínculo."
            - id: fast-dc89-q03
              type: texte
              format: vrai_faux
              reference: "D&A 89:5-6"
              prompt: "Verdadeiro ou falso: a Palavra de Sabedoria proíbe todo vinho."
              choices:
                - { id: a, text: "Verdadeiro" }
                - { id: b, text: "Falso" }
              correct_choice: b
              feedback: "Os versículos 5–6 mantêm uma exceção para o sacramento: vinho puro de uva feito pelos santos."
            - id: fast-dc89-q04
              type: vie
              format: vrai_faux
              reference: application
              prompt: "Verdadeiro ou falso: viver a Palavra de Sabedoria garante saúde."
              choices:
                - { id: a, text: "Verdadeiro" }
                - { id: b, text: "Falso" }
              correct_choice: b
              feedback: "A Palavra de Sabedoria não é um contrato médico nem uma licença para julgar os outros."
            - id: fast-dc89-q05
              type: texte
              format: qcm
              reference: "D&A 89:12-13"
              prompt: "Quando agrada ao Senhor que a gente consuma carne?"
              choices:
                - { id: a, text: "No inverno, no frio ou na fome" }
                - { id: b, text: "Todos os dias, com gratidão" }
                - { id: c, text: "Só durante as festas" }
                - { id: d, text: "Depois de fazer exercício" }
              correct_choice: a
              feedback: "Os versículos 12–13 aconselham moderação: apenas no inverno, no frio ou em época de fome."
            - id: fast-dc89-q06
              type: vie
              format: qcm
              reference: application
              prompt: "Depois de uma recaída no vício, o que fazer primeiro?"
              choices:
                - { id: a, text: "Esconder para manter sua imagem" }
                - { id: b, text: "Dizer a verdade e pedir ajuda" }
                - { id: c, text: "Esperar antes de orar" }
                - { id: d, text: "Crer que o batismo foi anulado" }
              correct_choice: b
              feedback: "Uma recaída não apaga sua dignidade nem seu convênio. Confessar, orar e pedir ajuda reabrem o caminho."
            - id: fast-dc89-q07
              type: texte
              format: qcm
              reference: "D&A 89:9"
              prompt: "Segundo o versículo 9, o que o texto diz das bebidas quentes?"
              choices:
                - { id: a, text: "Excelentes para a saúde" }
                - { id: b, text: "Reservadas para a febre" }
                - { id: c, text: "Nem para o corpo nem o ventre" }
