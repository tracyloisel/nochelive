            after: { prompt: "¿A quién se dirige la Palabra de Sabiduría al comienzo?", feedback: "El versículo 1 nombra al consejo, la Iglesia y los santos de Sion. Es un principio pensado incluso para los más débiles." }
            reason: "La question part directement à l’oral et pensado para évite le calque français servir aux plus faibles."
          - locale: es
            question_id: fast-dc89-q05
            before: "En invierno, frío o hambre"
            after: "En invierno, con frío o hambre"
            reason: "La préposition con rend l’énumération idiomatique sans changer les trois circonstances."
          - locale: pt-BR
            question_id: fast-dc89-q01
            before: "No início, a quem se dirige a Palavra de Sabedoria?"
            after: "No início, para quem é a Palavra de Sabedoria?"
            reason: "Para quem é est plus spontané dans la bouche d’un présentateur brésilien et garde le même destinataire."
          - locale: pt-BR
            question_id: fast-dc89-q02
            before: { prompt: "Numa festa, oferecem álcool a você. O que o texto convida a fazer?", feedback: "Por amor ao Senhor e a você, dá para recusar sem se justificar, condenar os outros ou romper o vínculo." }
            after: { prompt: "Numa festa, alguém oferece álcool. O que o texto convida você a fazer?", feedback: "Por amar o Senhor e cuidar de você, dá para recusar sem se explicar, julgar os outros ou romper o vínculo." }
            reason: "Alguém offre une situation naturelle; amar et cuidar de você éliminent le calque por amor a você sans déplacer le refus ni le lien."
