              type: texte
              format: qcm
              reference: "D&A 89:1-3"
              prompt: "¿A quién se dirige la Palabra de Sabiduría al comienzo?"
              choices:
                - { id: a, text: "A José Smith y su familia" }
                - { id: b, text: "Consejo, Iglesia, santos de Sion" }
                - { id: c, text: "A quienes ya estaban enfermos" }
                - { id: d, text: "Solo a líderes de la Iglesia" }
              correct_choice: b
              feedback: "El versículo 1 nombra al consejo, la Iglesia y los santos de Sion. Es un principio pensado incluso para los más débiles."
            - id: fast-dc89-q02
              type: vie
              format: qcm
              reference: application
              prompt: "En una fiesta te ofrecen alcohol. ¿A qué te invita el texto?"
              choices:
                - { id: a, text: "Irte de la fiesta" }
                - { id: b, text: "Ceder para evitar miradas" }
                - { id: c, text: "Cuidarte sin justificarte" }
                - { id: d, text: "Convertir la fiesta en sermón" }
              correct_choice: c
              feedback: "Por amor al Señor y a ti, puedes decir que no sin justificarte, condenar a otros ni romper el vínculo."
            - id: fast-dc89-q03
              type: texte
              format: vrai_faux
              reference: "D&A 89:5-6"
              prompt: "Verdadero o falso: la Palabra de Sabiduría prohíbe todo vino."
              choices:
                - { id: a, text: "Verdadero" }
                - { id: b, text: "Falso" }
              correct_choice: b
              feedback: "Los versículos 5–6 mantienen una excepción para la Santa Cena: vino puro de uva elaborado por los santos."
            - id: fast-dc89-q04
              type: vie
              format: vrai_faux
              reference: application
              prompt: "Verdadero o falso: vivir la Palabra de Sabiduría garantiza la salud."
              choices:
                - { id: a, text: "Verdadero" }
                - { id: b, text: "Falso" }
              correct_choice: b
              feedback: "La Palabra de Sabiduría no es un contrato médico ni un permiso para juzgar a los demás."
            - id: fast-dc89-q05
              type: texte
              format: qcm
              reference: "D&A 89:12-13"
              prompt: "¿Cuándo le agrada al Señor que consumamos carne?"
              choices:
                - { id: a, text: "En invierno, con frío o hambre" }
                - { id: b, text: "Cada día con gratitud" }
                - { id: c, text: "Solo durante las fiestas" }
                - { id: d, text: "Después de hacer ejercicio" }
              correct_choice: a
              feedback: "Los versículos 12–13 aconsejan usarla con moderación, solo en invierno, con frío o en época de hambre."
            - id: fast-dc89-q06
              type: vie
              format: qcm
              reference: application
              prompt: "Tras recaer en una adicción, ¿qué haces primero?"
              choices:
                - { id: a, text: "Ocultarlo para salvar tu imagen" }
                - { id: b, text: "Decir la verdad y pedir ayuda" }
                - { id: c, text: "Esperar antes de orar" }
                - { id: d, text: "Dar por anulado tu bautismo" }
              correct_choice: b
              feedback: "Una recaída no borra tu dignidad ni tu convenio. Confesarlo, orar y pedir ayuda vuelven a abrir el camino."
            - id: fast-dc89-q07
              type: texte
              format: qcm
              reference: "D&A 89:9"
              prompt: "Según el versículo 9, ¿qué dice de las bebidas calientes?"
              choices:
                - { id: a, text: "Excelentes para la salud" }
                - { id: b, text: "Reservadas para la fiebre" }
                - { id: c, text: "Ni para el cuerpo ni el vientre" }
                - { id: d, text: "Permitidas solo de noche" }
              correct_choice: c
              feedback: "El versículo 9 dice que las bebidas calientes no son para el cuerpo ni para el vientre."
            - id: fast-dc89-q08
              type: vie
              format: vrai_faux
              reference: "D&A 89:10"
              prompt: "Verdadero o falso: si Dios las creó, todas las plantas curan."
              choices:
                - { id: a, text: "Verdadero" }
                - { id: b, text: "Falso" }
              correct_choice: b
              feedback: "El versículo 10 habla de hierbas saludables. No afirma que toda planta sea un remedio."
            - id: fast-dc89-q09
              type: texte
              format: vrai_faux
              reference: "D&A 89:8"
              prompt: "Verdadero o falso: DyC 89 permite fumar o mascar tabaco."
              choices:
                - { id: a, text: "Verdadero" }
                - { id: b, text: "Falso" }
              correct_choice: b
              feedback: "El versículo 8 dice que el tabaco no es para el cuerpo ni el vientre: fumarlo o mascarlo está prohibido."
            - id: fast-dc89-q10
              type: texte
              format: qcm
              reference: "D&A 89:2"
              prompt: "Según el versículo 2, ¿cómo se envía la Palabra de Sabiduría?"
              choices:
                - { id: a, text: "Por mandamiento" }
                - { id: b, text: "Por coacción" }
                - { id: c, text: "Por revelación" }
                - { id: d, text: "Por tradición" }
              correct_choice: c
              feedback: "El versículo 2 dice que no se envía por mandamiento ni coacción, sino por revelación."
