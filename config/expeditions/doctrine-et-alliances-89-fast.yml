            10. Según el versículo 2, ¿cómo se envía la Palabra de Sabiduría? a=Por mandamiento; b=Por coacción; c=Por revelación; d=Por tradición. Correcta=c. Revelación: El versículo 2 dice que no se envía por mandamiento ni coacción, sino por revelación.

