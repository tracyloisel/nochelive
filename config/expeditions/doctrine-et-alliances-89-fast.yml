            05. ¿Cuándo le agrada al Señor que consumamos carne? a=En invierno, frío o hambre; b=Cada día con gratitud; c=Solo durante las fiestas; d=Después de hacer ejercicio. Correcta=a. Revelación: Los versículos 12–13 aconsejan usarla con moderación, solo en invierno, con frío o en época de hambre.
            06. Tras recaer en una adicción, ¿qué haces primero? a=Ocultarlo para salvar tu imagen; b=Decir la verdad y pedir ayuda; c=Esperar antes de orar; d=Dar por anulado tu bautismo. Correcta=b. Revelación: Una recaída no borra tu dignidad ni tu convenio. Confesarlo, orar y pedir ayuda vuelven a abrir el camino.
            07. Según el versículo 9, ¿qué dice de las bebidas calientes? a=Excelentes para la salud; b=Reservadas para la fiebre; c=Ni para el cuerpo ni el vientre; d=Permitidas solo de noche. Correcta=c. Revelación: El versículo 9 dice que las bebidas calientes no son para el cuerpo ni para el vientre.
