          - { id: c, text: "Elles ne sont ni pour le corps ni pour le ventre" }
          - { id: d, text: "Elles sont permises seulement le soir" }
        correct_choice: c
        feedback: "Le verset 9 dit que les boissons brûlantes ne sont ni pour le corps ni pour le ventre."
      - id: fast-dc89-q08
