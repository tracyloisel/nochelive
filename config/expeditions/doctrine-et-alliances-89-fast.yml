        en:
          status: complete
          source_locale: fr
          source_approval_revision: 61
          localized_directly_from_source: true
          surface_pack_title: "Doctrine and Covenants 89"
          voice_gate: PASS
          mobile_copy_gate: PASS
          questions:
            - id: fast-dc89-q01
              type: texte
              format: qcm
              reference: "D&A 89:1-3"
              prompt: "Who is the Word of Wisdom addressed to at the start?"
              choices:
                - { id: a, text: "Joseph Smith and his family" }
                - { id: b, text: "Council, Church, Saints in Zion" }
                - { id: c, text: "People who were already sick" }
                - { id: d, text: "Church leaders alone" }
              correct_choice: b
              feedback: "Verse 1 names the council, the Church, and the Saints in Zion. The principle is meant for everyone, even the weak."
            - id: fast-dc89-q02
              type: vie
              format: qcm
              reference: application
              prompt: "At a party, you’re offered alcohol. Which choice fits the text?"
              choices:
                - { id: a, text: "Leave the party" }
                - { id: b, text: "Give in to avoid the looks" }
                - { id: c, text: "Say no without explaining" }
                - { id: d, text: "Turn the party into a sermon" }
              correct_choice: c
              feedback: "Out of love for the Lord and yourself, you can say no without explaining, condemning others, or breaking the bond."
            - id: fast-dc89-q03
              type: texte
              format: vrai_faux
              reference: "D&A 89:5-6"
              prompt: "True or false: the Word of Wisdom bans all wine, no exceptions."
              choices:
                - { id: a, text: "True" }
                - { id: b, text: "False" }
              correct_choice: b
              feedback: "Verses 5–6 keep an exception for the sacrament: pure grape wine made by the Saints."
            - id: fast-dc89-q04
              type: vie
              format: vrai_faux
              reference: application
              prompt: "True or false: living the Word of Wisdom guarantees good health."
              choices:
                - { id: a, text: "True" }
                - { id: b, text: "False" }
              correct_choice: b
              feedback: "The Word of Wisdom is neither a medical contract nor a license to judge others."
            - id: fast-dc89-q05
              type: texte
              format: qcm
              reference: "D&A 89:12-13"
              prompt: "When is it pleasing to the Lord for us to eat meat?"
              choices:
                - { id: a, text: "Winter, cold weather, or famine" }
                - { id: b, text: "Every day with gratitude" }
                - { id: c, text: "Only at celebrations" }
                - { id: d, text: "After physical exertion" }
              correct_choice: a
              feedback: "Verses 12–13 counsel using it sparingly, only in winter, cold weather, or famine."
            - id: fast-dc89-q06
              type: vie
              format: qcm
              reference: application
              prompt: "After an addiction relapse, what should you do first?"
              choices:
                - { id: a, text: "Hide it to protect your image" }
                - { id: b, text: "Tell the truth and ask for help" }
                - { id: c, text: "Wait before praying" }
                - { id: d, text: "Think your baptism is canceled" }
              correct_choice: b
              feedback: "A relapse doesn’t erase your dignity or your covenant. Confessing, praying, and asking for help reopen the way."
            - id: fast-dc89-q07
              type: texte
              format: qcm
              reference: "D&A 89:9"
              prompt: "According to verse 9, what does the text say about hot drinks?"
              choices:
                - { id: a, text: "Excellent for your health" }
                - { id: b, text: "Reserved for fevers" }
                - { id: c, text: "Not for the body or belly" }
                - { id: d, text: "Allowed only at night" }
              correct_choice: c
              feedback: "Verse 9 says hot drinks are not for the body or the belly."
            - id: fast-dc89-q08
              type: vie
              format: vrai_faux
              reference: "D&A 89:10"
              prompt: "True or false: because God created them, all plants can heal."
              choices:
                - { id: a, text: "True" }
                - { id: b, text: "False" }
              correct_choice: b
              feedback: "Verse 10 speaks of wholesome herbs. It does not say every plant is a remedy."
            - id: fast-dc89-q09
              type: texte
              format: vrai_faux
              reference: "D&A 89:8"
              prompt: "True or false: D&C 89 allows smoking or chewing tobacco."
              choices:
                - { id: a, text: "True" }
                - { id: b, text: "False" }
              correct_choice: b
              feedback: "Verse 8 says tobacco is not for the body or belly: smoking or chewing it is forbidden."
            - id: fast-dc89-q10
              type: texte
              format: qcm
              reference: "D&A 89:2"
              prompt: "According to verse 2, how is the Word of Wisdom sent?"
              choices:
                - { id: a, text: "By commandment" }
                - { id: b, text: "By force" }
                - { id: c, text: "By revelation" }
                - { id: d, text: "By tradition" }
              correct_choice: c
              feedback: "Verse 2 says it is sent not by commandment or force, but by revelation."
