        09. True or false: D&C 89 allows smoking or chewing tobacco. a=True; b=False. Correct=b. Reveal: Verse 8 says tobacco is not for the body or belly: smoking or chewing it is forbidden.
        10. According to verse 2, how is the Word of Wisdom sent? a=By commandment; b=By force; c=By revelation; d=By tradition. Correct=c. Reveal: Verse 2 says it is sent not by commandment or force, but by revelation.

        PORTUGUÊS DO BRASIL — voz nativa de apresentador
        01. No início, para quem é a Palavra de Sabedoria? a=A Joseph Smith e sua família; b=Conselho, Igreja, santos de Sião; c=A quem já estava doente; d=Só aos líderes da Igreja. Correta=b. Revelação: O versículo 1 cita o conselho, a Igreja e os santos de Sião. O princípio serve até para os mais fracos.
        02. Numa festa, alguém oferece álcool. O que o texto convida você a fazer? a=Sair da festa; b=Ceder para evitar os olhares; c=Se proteger sem se justificar; d=Transformar a festa em sermão. Correta=c. Revelação: Por amar o Senhor e cuidar de você, dá para recusar sem se explicar, julgar os outros ou romper o vínculo.
        03. Verdadeiro ou falso: a Palavra de Sabedoria proíbe todo vinho. a=Verdadeiro; b=Falso. Correta=b. Revelação: Os versículos 5–6 mantêm uma exceção para o sacramento: vinho puro de uva feito pelos santos.
        04. Verdadeiro ou falso: viver a Palavra de Sabedoria garante saúde. a=Verdadeiro; b=Falso. Correta=b. Revelação: A Palavra de Sabedoria não é um contrato médico nem uma licença para julgar os outros.
        05. Quando agrada ao Senhor que a gente consuma carne? a=No inverno, no frio ou na fome; b=Todos os dias, com gratidão; c=Só durante as festas; d=Depois de fazer exercício. Correta=a. Revelação: Os versículos 12–13 aconselham moderação: apenas no inverno, no frio ou em época de fome.
        06. Depois de uma recaída no vício, o que fazer primeiro? a=Esconder para manter sua imagem; b=Dizer a verdade e pedir ajuda; c=Esperar antes de orar; d=Crer que o batismo foi anulado. Correta=b. Revelação: Uma recaída não apaga sua dignidade nem seu convênio. Confessar, orar e pedir ajuda reabrem o caminho.
        07. Segundo o versículo 9, o que o texto diz das bebidas quentes? a=Excelentes para a saúde; b=Reservadas para a febre; c=Nem para o corpo nem o ventre; d=Permitidas apenas à noite. Correta=c. Revelação: O versículo 9 diz que bebidas quentes não são para o corpo nem para o ventre.
        08. Verdadeiro ou falso: se Deus as criou, todas as plantas curam. a=Verdadeiro; b=Falso. Correta=b. Revelação: O versículo 10 fala de ervas salutares. Não diz que toda planta é um remédio.
        09. Verdadeiro ou falso: D&C 89 permite fumar ou mascar tabaco. a=Verdadeiro; b=Falso. Correta=b. Revelação: O versículo 8 diz que o tabaco não é para o corpo nem o ventre: fumar ou mascar é proibido.
        10. Segundo o versículo 2, como a Palavra de Sabedoria é enviada? a=Por mandamento; b=Por coação; c=Por revelação; d=Por tradição. Correta=c. Revelação: O versículo 2 diz que ela não é enviada por mandamento nem coação, mas por revelação.

        Contrôles : les trente séquences respectent toujours 72 graphèmes pour le prompt, 32 par choix et 120 pour le feedback; le nouveau choix anglais q05 compte 31 graphèmes. Le test système permanent construit de vraies `QuizDefinition::Question`, réutilise chaque master français approuvé, localise le titre scripturaire, mélange les choix, soumet une mauvaise réponse et contrôle l’unique ligne juste, son identifiant source, son texte localisé et le feedback exact. Sur Street 390 × 667 : 1 exécution, 3213 assertions, zéro échec, zéro erreur; aucun clipping, troncature, défilement de réponses ni erreur console sévère. Les aperçus ask/reveal r65 et leurs hashes sont conservés dans les audits. Arrêt au gate humain `translation_approval`; rien n’est relié au runtime et rien n’est publié.
