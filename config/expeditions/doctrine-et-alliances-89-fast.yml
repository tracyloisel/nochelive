        Lecture sur la surface Street 390 × 667 : la paume, le verre et les regards survivent très bien au HUD et à la feuille Quiz. La question et les quatre réponses sont lisibles sans débordement. En revanche, la feuille recouvre la zone où la seconde main devait prouver qu’elle reste physiquement dans la ronde; les mains basses deviennent ambiguës et ne portent plus le lien conservé.

