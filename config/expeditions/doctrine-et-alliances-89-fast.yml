          - { id: d, text: "Aux seuls responsables chargés de l’appliquer" }
        correct_choice: b
        feedback: "Le verset 1 nomme le conseil assemblé, l’Église et les saints de Sion ; le principe est adapté même aux plus faibles."
      - id: fast-dc89-q02
        type: vie
        format: qcm
        reference: application
        prompt: "On te propose de boire de l'alcool en soirée. A quoi t'invite la Parole de Sagesse ?"
        choices:
          - { id: a, text: "Quitter la soirée" }
          - { id: b, text: "Céder pour éviter les regards" }
          - { id: c, text: "Refuser pour ton bien sans te justifier" }
          - { id: d, text: "Transformer la soirée en leçon" }
        correct_choice: c
        feedback: "Par amour pour le Seigneur et pour soi-même, on peut refuser sans condamner les autres ni rompre le lien avec eux."
      - id: fast-dc89-q03
