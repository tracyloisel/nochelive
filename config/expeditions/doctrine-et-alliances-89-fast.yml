          - { id: b, text: "Dire la vérité et demander de l’aide" }
          - { id: c, text: "Attendre avant de prier" }
          - { id: d, text: "Penser que son baptête est annulé" }
        correct_choice: b
        feedback: "Une rechute n’efface ni dignité ni alliance : se confesser, prier et demander de l’aide permettent de reprendre le chemin."
      - id: fast-dc89-q07
