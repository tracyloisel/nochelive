    visual_staging:
      status: ready_for_proof
      generation_authorized: false
      staging_revision: 1
      source_library:
      - id: src-ps136-mercy-refrain
        reference: Psaume 136:1-26
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Sa miséricorde dure pour toujours.
        textual_fact: Le même refrain accompagne création, délivrance, humiliation
          reconnue et nourriture.
        qualified_interpretation: Le refrain permet de relire une histoire entière
          sous la miséricorde de Dieu.
        application_boundary: La violence historique du psaume ne devient aucun modèle
          d'action présent.
      - id: src-ps110-royal-priest
        reference: Psaume 110:1-4
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Tu es prêtre pour toujours, à la manière de Melchisédek.
        textual_fact: Le psaume unit une figure royale placée par Dieu et une prêtrise
          durable.
        qualified_interpretation: Le programme hebdomadaire le reçoit comme prophétie
          accomplie en Jésus-Christ.
        application_boundary: Les versets de jugement ne sont ni mis en scène ni appliqués.
      - id: src-ps118-rejected-stone
        reference: Psaume 118:19-26
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: La pierre rejetée est devenue la principale de l'angle.
        textual_fact: Porte, pierre rejetée devenue principale, salut et joie se succèdent.
        qualified_interpretation: La réception chrétienne reconnaît Jésus-Christ dans
          la pierre et celui qui vient au nom du Seigneur.
        application_boundary: Le visuel de synthèse n'est pas présenté comme un événement
          historique photographié.
      - id: src-cfm-psalms-christ-reception
        reference: Programme Viens et suis-moi, 31 août-6 septembre 2026
        url: https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/36?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Jésus-Christ a accompli les prophéties des Psaumes.
        textual_fact: Le programme rapproche Psaume 110:1-4 et Psaume 118:22,25-26
          de passages du Nouveau Testament.
        qualified_interpretation: Le Roi, le prêtre et la pierre peuvent être unis
          dans une image chrétienne de Jésus-Christ.
        application_boundary: Cette réception est annoncée comme chrétienne, jamais
          dissimulée sous une prétendue neutralité historique.
      - id: src-ps139-known-and-guided
        reference: Psaume 139:1-18,23-24
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Sonde-moi, connais mon cœur et conduis-moi.
        textual_fact: Le psalmiste se sait connu puis consent à être examiné et conduit.
        qualified_interpretation: Être connu peut ouvrir une correction volontaire
          sans devenir surveillance punitive.
        application_boundary: Aucune réconciliation humaine n'est garantie par le geste.
      - id: src-ps119-lamp
        reference: Psaume 119:105
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Ta parole est une lampe à mes pieds et une lumière sur mon sentier.
        textual_fact: La parole éclaire le sentier du priant.
        qualified_interpretation: Une lumière limitée au prochain pas reste fidèle à
          l'image et à l'expérience de persévérance.
        application_boundary: La lumière ne promet ni route entièrement visible ni
          absence d'obstacle.
      - id: src-ps147-rebuild-and-gather
        reference: Psaume 147:1-5
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/147?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Il rebâtit Jérusalem, rassemble les exilés et panse les blessures.
        textual_fact: Bâtir, rassembler et prendre soin des cœurs blessés sont réunis.
        qualified_interpretation: Une personne peut participer à une construction avant
          que toute blessure soit réparée.
        application_boundary: Ni guérison immédiate, ni famille idéale, ni appartenance
          automatique ne sont promises.
      - id: src-ps149-sincere-assembly
        reference: Psaume 149:1-5
        url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=fra
        consulted_on: '2026-09-05'
        text_excerpt: Chantez ses louanges dans l'assemblée des fidèles.
        textual_fact: Le peuple, son Roi, l'assemblée, la danse et le salut des humbles
          portent les cinq premiers versets.
        qualified_interpretation: Une personne peut rejoindre l'assemblée avec une
          présence sincère avant de ressentir sa joie.
        application_boundary: Les versets 6-9 et leur violence restent hors champ.
      visual_concepts:
