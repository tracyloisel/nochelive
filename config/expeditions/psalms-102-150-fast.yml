          es: En un portal monumental abierto hacia un jardín, Jesús y dos constructores
            levantan juntos una piedra; detrás de ellos hay un trono vacío.
          en: In a monumental gateway opening onto a garden, Jesus and two builders
            lift a stone together; an empty throne stands behind them.
          pt-BR: Num portal monumental aberto para um jardim, Jesus e dois construtores
            erguem juntos uma pedra; atrás deles há um trono vazio.
        disclosure:
