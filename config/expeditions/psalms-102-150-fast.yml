      textual_core: L'âme se souvient du pardon, de la compassion, de l'alliance et
        du règne de Dieu.
      reveals_about_god: Miséricordieux, lent à la colère, compatissant comme un père.
      human_condition: Péché, oubli, fragilité et besoin de miséricorde.
