          pt-BR: Num pátio antigo ao pôr do sol, um cantor ergue a mão no meio de
            uma reunião de todas as idades; lamparinas acesas formam um caminho ao redor.
        disclosure:
          fr: Cette illustration biblique s’inspire du refrain du Psaume 136. Elle
            ne reconstitue pas un événement précis raconté par le psaume.
          es: Esta ilustración bíblica se inspira en el estribillo del Salmo 136.
            No reconstruye un acontecimiento concreto narrado en el salmo.
          en: This biblical illustration draws on the refrain in Psalm 136. It does
            not reconstruct a specific event narrated in the psalm.
          pt-BR: Esta ilustração bíblica se inspira no refrão do Salmo 136. Ela não
            reconstitui um acontecimento específico narrado no salmo.
      - day_id: psalms-102-150-fast-day-2
        alt:
          fr: Sous une porte de pierre, Jésus accueille plusieurs voyageurs; une
            grosse pierre d’angle repose au premier plan dans la lumière.
          es: Bajo una puerta de piedra, Jesús recibe a varios viajeros; una gran
            piedra angular descansa en primer plano, iluminada por el sol.
          en: Beneath a stone gateway, Jesus welcomes several travelers; a large
            cornerstone rests in the light in the foreground.
          pt-BR: Sob um portal de pedra, Jesus recebe vários viajantes; uma grande
            pedra angular repousa iluminada em primeiro plano.
        disclosure:
          fr: Cette illustration représente une lecture chrétienne des Psaumes 110
            et 118 en Jésus-Christ. Elle ne reconstitue pas une scène racontée par
            ces psaumes.
          es: Esta ilustración representa una lectura cristiana de los Salmos 110
