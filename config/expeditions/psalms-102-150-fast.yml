      - id: psalms-expedition-library-day-3
        content_source_ids:
        - psalms-102-150-fast-day-3
        surfaces:
        - library_day_3
        source_basis_ids:
        - src-ps139-known-and-guided
        truth_to_stage: Être entièrement connue de Dieu peut conduire à une vérité
          offerte librement, non au rejet.
        representation_mode: human_dramaturgy
        visual_treatment:
          selected: cinematic_realism
          reason: Une décision contemporaine rend l'examen du cœur concret.
        approach_comparison:
          conventional_image: Des mains ouvertes devant un sentier lumineux.
          dramaturgical_alternative:
            attempted: true
            concept: Après sa prière, une femme envoie enfin un message d'excuse.
          selected: dramaturgical
          selection_reason: Le geste porte une vulnérabilité précise et une issue non
            garantie.
        two_second_read: Seule dans une chapelle claire, une femme émue appuie sur envoyer.
        viewer_question: Quelle vérité a-t-elle accepté de dire ?
        visual_concept: Réemploi verrouillé de la femme élégante sur un banc, téléphone
          sans texte lisible, doigt décidé après la prière.
        human_drama:
          applicable: true
          desire: Être connue et changer.
          resistance: Protéger son innocence apparente.
          gesture_or_relationship: Elle ouvre une conversation incertaine.
        heart_sacrifice:
          applicable: true
          desire_kept_alive: Rester aimée et comprise.
          freely_renounced_action: Éviter toute remise en question.
          visible_cost: Reconnaître sa part sans obtenir d'avance le pardon.
          hoped_horizon: Être conduite vers une voie plus juste.
        cast:
