        et rebâtit Sion.
      reveals_about_god: Il demeure, entend le démuni et regarde pour délivrer.
      human_condition: Anxiété, isolement, fragilité et désir d'un avenir.
      christ_relation: Aucune prophétie christologique explicite retenue ici; application
        chrétienne par la prière adressée à Dieu en Christ.
      missionary_good_news: On peut revenir en commençant par une plainte vraie.
      faith_obstacle: Croire que Dieu méprise une prière épuisée.
      next_step: Dire à Dieu sans masque ce qui fait mal.
