        question_id: fast-psalms-pack06-q08
        asset_path: public/media/expeditions/psalms-102-150-fast/pack-06/proofs/psalms-pack06-q08-proof-v1.png
    - id: psalms-102-150-fast-day-7
      kind: contemplation
      scheduled_on: '2026-09-06'
      pack_id:
      reference: ot/ps/118
      references:
      - ot/ps/102
      - ot/ps/110
      - ot/ps/118
      - ot/ps/119
      - ot/ps/127
      - ot/ps/137
      - ot/ps/139
      - ot/ps/150
      copy:
        fr:
          eyebrow: Contemplation de la semaine
          title: Quel pas vas-tu poursuivre ?
          setup: Le Dieu vivant agit. Le Roi-serviteur sauve. Il écoute, éclaire,
            rassemble et appelle tout souffle. Tu n’as pas à tout comprendre ni
            à tout changer en une semaine.
          question: Laquelle de ces six étapes veux-tu reprendre avec Dieu cette
            semaine ?
          cta_label: Revenir à l’expédition
        es:
          eyebrow: Contemplación de la semana
          title: ¿Qué paso quieres seguir dando?
          setup: El Dios vivo actúa. El Rey servidor salva. Escucha, da luz, reúne
            y llama a todo ser que respira. No tienes que entenderlo todo ni cambiarlo
            todo en una semana.
          question: ¿Cuál de estas seis etapas quieres retomar con Dios esta semana?
          cta_label: Volver a la expedición
        en:
          eyebrow: This week’s contemplation
          title: Which step will you keep taking?
          setup: The living God acts. The Servant King saves. He listens, gives light,
            gathers, and calls everything that breathes. You do not have to understand
            everything or change everything in one week.
          question: Which of these six stages do you want to revisit with God this
            week?
          cta_label: Return to the expedition
        pt-BR:
          eyebrow: Contemplação da semana
          title: Qual passo você vai continuar dando?
          setup: O Deus vivo age. O Rei servo salva. Ele escuta, ilumina, reúne e
            chama tudo o que respira. Você não precisa entender tudo nem mudar tudo
            em uma semana.
          question: Qual dessas seis etapas você quer retomar com Deus nesta semana?
          cta_label: Voltar à expedição
