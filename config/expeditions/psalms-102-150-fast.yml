          en: This present-day scene was invented to accompany the call to praise
            in Psalms 117 and 148–150. These people are not biblical figures.
          pt-BR: Esta cena contemporânea foi inventada para acompanhar o chamado
            ao louvor dos Salmos 117 e 148–150. Essas pessoas não são personagens bíblicas.
      - day_id: psalms-102-150-fast-day-7
        alt:
          fr: Dans une porte monumentale ouverte sur un jardin, Jésus et deux bâtisseurs
