    missionary_architectures:
    - id: retour-a-la-maison
      title: Revenir à la maison de Dieu
      people_served:
      - Personnes qui croient encore mais hésitent à revenir à l'Église
      - Personnes éprouvées qui pensent devoir d'abord aller mieux
      missionary_promise: Tu peux parler à Dieu tel que tu es, rencontrer sa compassion
        et le Christ vivant, recevoir une lumière pour marcher, retrouver un peuple
        et faire de nouveau entendre ta voix.
      spiritual_movement:
        begins_with: Je suis loin, épuisé ou sans mots.
        passes_through: Dieu m'écoute, me connaît, me pardonne et me montre Jésus-Christ.
        leads_toward: Je reprends le chemin, rebâtis avec lui et rejoins la louange.
      strengths:
      - entrée humaine immédiate
      - retour sans honte
      - progression de la prière à l'assemblée
      tradeoffs:
      - témoignage christologique explicite seulement au troisième pack
      - forte densité du dernier pack
      excluded_sources: []
      packs:
      - working_id: pack-01
        working_title: Tu peux encore l'appeler
        source_refs:
        - Psaume 102:1-29
        - Psaume 116:1-11
        - Psaume 137:1-6
        gospel_discovery: Dieu reçoit la plainte, entend l'appel et laisse l'exilé
          garder mémoire de Sion.
        human_question: Puis-je prier quand je suis en colère, loin ou épuisé ?
        faith_obstacle: Croire qu'il faut aller bien et parler pieusement avant de
          revenir.
        possible_next_step: Formuler une prière honnête et non performante.
        role_in_journey: Ouvrir la porte du retour.
        ten_question_viability:
          status: pass
          reason: Trois mouvements distincts offrent texte, discernement et limites
            sans exploiter les imprécations.
        repetition_guard: Réserver la fidélité publique de Psaume 116 au pack 02.
      - working_id: pack-02
        working_title: La miséricorde te remet debout
        source_refs:
        - Psaume 103:1-22
        - Psaume 116:12-19
        - Psaume 138:1-8
        gospel_discovery: Le Dieu compatissant pardonne, fortifie l'âme et appelle
          une réponse fidèle.
        human_question: Dieu me reçoit-il encore après mes fautes et mon absence ?
        faith_obstacle: Voir en Dieu un accusateur impatient ou un distributeur de
          faveurs.
        possible_next_step: Demander pardon, se souvenir d'un bienfait et reprendre
          un engagement.
        role_in_journey: Passer de l'appel à une confiance responsable.
        ten_question_viability:
          status: pass
          reason: Pardon, fragilité, gratitude, vœux, temple et force intérieure donnent
            des angles distincts.
        repetition_guard: Ne pas transformer guérison et délivrance en garanties.
      - working_id: pack-03
        working_title: Le Christ n'est pas resté rejeté
        source_refs:
        - Psaume 110:1-7
        - Psaume 118:1-29
        gospel_discovery: Le programme reçoit Jésus-Christ comme Roi, prêtre durable
          et pierre rejetée devenue principale.
        human_question: Qui peut vraiment me sauver et porter mon retour vers Dieu
          ?
        faith_obstacle: Réduire Jésus à un maître du passé ou chercher son refuge
          dans le prestige humain.
        possible_next_step: Lire les accomplissements indiqués par le programme et
          invoquer le Christ.
        role_in_journey: Placer Jésus-Christ au centre du retour.
        ten_question_viability:
          status: pass
          reason: Deux psaumes messianiques riches permettent histoire du texte, réception
            et confiance vécue.
        repetition_guard: Qualifier chaque lien néotestamentaire et isoler le langage
          guerrier.
      - working_id: pack-04
        working_title: Une lumière pour reprendre la route
        source_refs:
        - Psaume 119:1-176
        - Psaume 139:23-24
        gospel_discovery: Dieu donne sa parole et invite le cœur à être sondé pour
          retrouver la voie éternelle.
        human_question: Comment reprendre sans retomber dans mes anciens chemins ?
        faith_obstacle: Confondre les commandements avec une performance qui mérite
          l'amour de Dieu.
        possible_next_step: Choisir une parole-lampe et consentir à une correction
          précise.
        role_in_journey: Donner une pratique de persévérance.
        ten_question_viability:
          status: pass
          reason: Le Psaume 119 possède de nombreux mouvements; la finale de 139 personnalise
            le discernement.
        repetition_guard: Ne pas réduire les 176 versets aux seules images du chemin
          et de la lampe.
      - working_id: pack-05
        working_title: Rebâtir avec Dieu
        source_refs:
        - Psaumes 127-128
        - Psaume 135:13-21
        - Psaume 139:1-18
        gospel_discovery: Le Dieu vivant connaît la personne et veut habiter son travail,
          son foyer et son appartenance.
        human_question: À quoi ressemble une vie réellement rebâtie avec Dieu ?
        faith_obstacle: Réduire le retour à une émotion du dimanche ou à un modèle
          familial unique.
        possible_next_step: Confier une responsabilité ordinaire à Dieu et reprendre
          place parmi son peuple.
        role_in_journey: Faire entrer l'alliance dans la vie quotidienne.
        ten_question_viability:
          status: pass
          reason: Maison, travail, repos, générations, Dieu vivant et connaissance
            personnelle offrent un corpus varié.
        repetition_guard: Aucune bénédiction familiale ne devient promesse de mariage,
          d'enfant ou de prospérité.
      - working_id: pack-06
        working_title: Retrouver ta voix
        source_refs:
        - Psaume 117
        - Psaume 135:1-12
        - Psaume 136
        - Psaumes 146-150
        gospel_discovery: Le Dieu créateur, libérateur et proche rassemble toutes
          les nations et tout souffle dans une louange active.
        human_question: Que puis-je offrir à Dieu après ce qu'il a fait et fait encore
          ?
        faith_obstacle: Croire que louer consiste à nier sa douleur ou posséder une
          foi parfaite.
        possible_next_step: Rejoindre une assemblée et témoigner d'une œuvre de Dieu.
        role_in_journey: Achever le retour par une voix personnelle devenue communautaire.
        ten_question_viability:
          status: pass
          reason: Universalité, création, justice, guérison, assemblée, instruments
            et souffle dépassent largement dix angles.
        repetition_guard: Répartir création, secours, rassemblement et formes de louange;
          ne pas répéter seulement 'louez'.
    - id: rencontrer-le-roi-serviteur
      title: Rencontrer le Dieu vivant et choisir de le suivre
      people_served:
      - Personnes découvrant l'Évangile et demandant qui est Dieu
      - Personnes se préparant peut-être au baptême et désirant comprendre l'alliance
      missionary_promise: Découvre le Dieu vivant dans ses œuvres, rencontre Jésus-Christ
        comme Roi, prêtre et pierre du salut, puis apprends à lui répondre par la
        prière, la parole, une vie bâtie avec lui et la louange partagée.
      spiritual_movement:
        begins_with: Pourquoi placer ma confiance en Dieu ?
        passes_through: Je vois ce qu'il fait et qui est Jésus-Christ, puis je lui
          réponds personnellement.
        leads_toward: Je choisis son chemin, bâtis avec lui et rejoins son peuple.
      strengths:
      - Dieu et Jésus-Christ annoncés tôt
      - progression catéchétique claire
      - alliance incarnée
      tradeoffs:
      - l'expérience de l'exil arrive plus tard
      - chemin plus didactique
      excluded_sources: []
      packs:
      - working_id: pack-01
        working_title: Le Dieu vivant agit
        source_refs:
        - Psaume 135:1-21
        - Psaume 136:1-26
        - Psaume 146:1-10
        gospel_discovery: Dieu crée, se souvient, délivre et secourt; les faux appuis
          ne peuvent sauver.
        human_question: Pourquoi lui faire confiance plutôt qu'à ce que nous contrôlons
          ?
        faith_obstacle: Prendre argent, influence ou puissance humaine pour un salut
          durable.
        possible_next_step: Nommer un faux appui et une œuvre de Dieu digne de confiance.
        role_in_journey: Présenter le caractère et l'action du Dieu vivant.
        ten_question_viability:
          status: pass
          reason: Idoles, création, histoire, miséricorde et justice offrent des découvertes
            nettement distinctes.
        repetition_guard: Ne pas confondre les récits de jugement avec des consignes
          présentes.
      - working_id: pack-02
        working_title: Voici Jésus-Christ
        source_refs:
        - Psaume 110:1-7
        - Psaume 118:1-29
        gospel_discovery: Jésus-Christ est reçu comme Roi, prêtre pour toujours, pierre
          principale, secours et salut.
        human_question: Quel Sauveur les Psaumes nous apprennent-ils à reconnaître
          ?
        faith_obstacle: Croire que Jésus appartient seulement au passé.
        possible_next_step: Comparer les psaumes avec les accomplissements néotestamentaires
          du programme.
        role_in_journey: Annoncer explicitement le Christ.
        ten_question_viability:
          status: pass
          reason: Titres, images, accomplissements et mouvement de détresse au salut
            soutiennent dix questions variées.
        repetition_guard: Ne pas transformer tout détail royal en prophétie individuelle.
      - working_id: pack-03
        working_title: Il entend et il connaît
        source_refs:
        - Psaume 102
        - Psaume 103
        - Psaume 116
        - Psaume 139
        gospel_discovery: Le Dieu révélé et annoncé en Christ reçoit le cri, connaît
          la fragilité, pardonne et conduit.
        human_question: Puis-je être vraiment connu sans être rejeté ?
        faith_obstacle: Cacher sa détresse ou sa faute par peur de Dieu.
        possible_next_step: Prier avec franchise puis demander à Dieu de sonder son
          cœur.
        role_in_journey: Faire passer de la connaissance de Dieu à la relation.
        ten_question_viability:
          status: pass
          reason: Plainte, pardon, délivrance, présence et conversion du cœur donnent
            une grande variété.
        repetition_guard: Distinguer écoute, compassion, connaissance et correction.
      - working_id: pack-04
        working_title: Apprendre à marcher avec lui
        source_refs:
        - Psaume 119:1-176
        - Psaume 138:1-8
        gospel_discovery: La parole éclaire une marche soutenue par la grâce, et Dieu
          fortifie au milieu de la détresse.
        human_question: Comment la foi devient-elle un chemin qui dure ?
        faith_obstacle: Opposer relation avec Dieu et obéissance, ou faire de l'obéissance
          un mérite.
        possible_next_step: Mettre en pratique une directive reçue dans les Écritures.
        role_in_journey: Préparer la persévérance et la vie d'alliance.
        ten_question_viability:
          status: pass
          reason: Le long psaume et le témoignage de 138 couvrent apprentissage, choix,
            chute, relèvement et fidélité.
        repetition_guard: Varier structure, verbes, désirs, résistances et pratiques.
      - working_id: pack-05
        working_title: Bâtir une vie et un peuple
        source_refs:
        - Psaumes 127-128
        - Psaume 137:1-6
        - Psaume 147:1-20
        gospel_discovery: Dieu bâtit, rassemble les exilés, panse les cœurs et inscrit
          la foi dans les maisons et les générations.
        human_question: Où trouver une maison spirituelle après l'exil ou l'absence
          ?
        faith_obstacle: Croire que l'appartenance passée est perdue ou qu'il n'existe
          qu'un foyer valable.
        possible_next_step: Reprendre contact avec une communauté et confier son quotidien
          à Dieu.
        role_in_journey: Faire de l'alliance une appartenance et une construction.
        ten_question_viability:
          status: pass
          reason: Maison, exil, rassemblement, cœur guéri, parole et quotidien offrent
            dix angles solides.
        repetition_guard: Rester sur 137:1-6; ne pas utiliser les imprécations sans
          étude spécialisée.
      - working_id: pack-06
        working_title: Tout souffle a sa place
        source_refs:
        - Psaume 117
        - Psaumes 148-150
        gospel_discovery: Toutes les nations, générations, créatures et voix sont
          invitées à répondre à Dieu ensemble.
        human_question: Quelle place puis-je prendre dans le peuple qui adore Dieu
          ?
        faith_obstacle: Se croire trop extérieur, trop maladroit ou trop tardif pour
          louer.
        possible_next_step: Venir à l'Église et offrir une louange sincère avec les
          autres.
        role_in_journey: Conduire de la foi reçue à la joie et au témoignage communautaires.
        ten_question_viability:
          status: pass
          reason: Destinataires, création, générations, assemblée, humilité, arts
            et souffle soutiennent dix questions.
        repetition_guard: Éviter dix variantes lexicales de l'impératif de louer.
