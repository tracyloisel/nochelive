  agent_memory:
    responsable_missionnaire:
      owner: expedition-fast-responsable-missionnaire
      revision: 4
      status: blocked_missing_multi_pack_downstream_schema
      production: |-
        INTENTION MISSIONNAIRE

        Ces psaumes ne commencent pas tous dans la louange. Ils accueillent la
        solitude, l'épuisement, l'exil, la faute, la peur et le désir d'être
        conduit. Ils annoncent aussi un Dieu qui écoute, pardonne, connaît,
        rebâtit, délivre, donne sa parole et rassemble un peuple pour le louer.
        Pour une personne qui revient, leur première bonne nouvelle est qu'elle
        peut parler à Dieu avant d'avoir remis toute sa vie en ordre. Pour une
        personne qui découvre l'Évangile, ils ouvrent un chemin vers Jésus-Christ :
        le programme officiel reçoit les Psaumes 110 et 118 comme témoignages de
        son règne, de sa prêtrise et de la pierre rejetée devenue principale.

        LECTURE DU CORPUS

        Psaume 102 : la prière ne masque ni l'anxiété ni l'isolement. Le "mais
        toi" du verset 13 déplace le regard vers le règne durable de Dieu, qui
        écoute le démuni et rebâtit Sion. Il peut aider une personne absente à
        recommencer par une plainte vraie, sans promettre la fin immédiate de
        l'épreuve.

        Psaume 103 : le croyant rappelle à son âme le pardon, la compassion et
        l'alliance. Dieu sait que nous sommes poussière. Le texte ouvre le
        repentir sans réduire Dieu à un accusateur; ses images de guérison ne
        garantissent pas une guérison médicale individuelle.

        Psaume 110 : le texte royal et sacerdotal est explicitement reçu par le
        programme comme prophétique de Jésus-Christ. Il permet d'annoncer un
        Christ vivant, Roi et prêtre pour toujours. Les scènes de jugement ne
        doivent pas être transformées en violence chrétienne.

        Psaume 116 : une voix sauvée passe de la détresse à l'invocation, au
        repos, à la marche et à l'accomplissement public de ses vœux. C'est une
        forte grammaire du retour et de l'alliance, sans garantie d'échapper à
        toute mort ou souffrance.

        Psaume 117 : deux versets élargissent la louange à toutes les nations.
        Sa contribution est l'universalité de la bonté fidèle de Dieu; seul, il
        ne soutient pas dix questions non répétitives.

        Psaume 118 : la détresse devient espace, confiance, vie et témoignage.
        Le programme relie la pierre rejetée et celui qui vient au nom du
        Seigneur à Jésus-Christ. Le salut reçu devient une journée de joie.

        Psaume 119 : l'immense poème présente la parole comme chemin, lumière,
        conseil, joie, liberté, relèvement et appel à revenir après l'égarement.
        L'obéissance n'y est pas une performance froide : le priant demande que
        Dieu enseigne, donne l'intelligence, élargisse le cœur et rende la vie.

        Psaumes 127-128 : maison, travail, repos, enfants, table, générations et
        paix placent la vie ordinaire sous la bénédiction de Dieu. Ils ne
        permettent pas de juger les célibataires, les couples sans enfant ou
        les familles éprouvées, ni de promettre fécondité et prospérité.

        Psaume 135 : le Dieu vivant agit, voit et entend, contrairement aux
        idoles fabriquées. Le risque missionnaire est d'identifier avec mépris
        les "idoles" d'autrui; l'invitation juste est d'examiner ce qui reçoit
        notre confiance et nous façonne.

        Psaume 136 : la création, l'exode, le désert, la mémoire de l'humiliation
        et la nourriture sont repris par le refrain de la bonté durable. Le
        refrain apprend à relire une histoire entière avec Dieu. La violence
        historique exige contexte et ne devient pas un modèle d'action.

        Psaume 137 : le peuple exilé refuse de chanter pour divertir ses
        oppresseurs et garde mémoire de Sion. Le texte donne une voix à la perte
        et à la colère; ses imprécations finales sont un cri humain conservé
        dans l'Écriture, non une permission de vengeance. Toute utilisation de
        137:7-9 requiert exégèse et Fact Checker.

        Psaume 138 : la prière exaucée fortifie l'âme; Dieu voit l'humble et
        n'abandonne pas l'œuvre de ses mains. Le mouvement est une confiance au
        milieu de la détresse, non la négation de celle-ci.

        Psaume 139 : être entièrement connu par Dieu peut devenir consolation,
        émerveillement et invitation volontaire à être sondé et conduit. Les
        versets de haine ne doivent pas annuler la prière finale de conversion.

        Psaume 146 : il oppose la fragilité des puissants au Dieu créateur qui
        garde la vérité, fait droit, nourrit, délivre et soutient. La réception
        chrétienne peut reconnaître dans ces œuvres un écho du ministère du
        Sauveur, sans appeler le psaume une prophétie explicite.

        Psaume 147 : Dieu rassemble les exilés et panse les cœurs brisés tout en
        nommant les étoiles. Sa grandeur cosmique et sa proximité ne
        s'opposent pas. Son plaisir n'est pas dans la puissance humaine mais
        dans l'espérance placée en sa bonté.

        Psaume 148 : toute la création et tous les âges sont convoqués à louer.
        Il élargit l'appartenance : personne n'est spectateur inutile dans le
        chœur de Dieu.

        Psaume 149 : le cantique nouveau, l'assemblée, la danse et la joie des
        humbles offrent une image forte du peuple rassemblé. Les versets 6-9
        emploient un langage de jugement qui ne doit jamais autoriser la
        vengeance ou la violence personnelle.

        Psaume 150 : souffle, corps, sanctuaire et instruments culminent dans
        une louange où tout vivant est invité. La louange devient réponse libre
        à l'œuvre de Dieu, pas déni de la douleur traversée auparavant.

        NOMBRE DE PROPOSITIONS

        Deux architectures sont présentées. Ce nombre est juste parce que le
        corpus porte deux choix missionnaires vraiment différents : partir de
        l'expérience d'une personne éloignée pour la conduire vers la maison et
        la louange, ou partir de l'identité et de l'œuvre du Dieu vivant pour
        conduire à une réponse d'alliance. Une troisième proposition ne ferait
        que déplacer les mêmes groupes de textes sans créer un autre chemin
        spirituel assez distinct.

        ARCHITECTURE 1 — RETOUR À LA MAISON

        Elle commence avec le droit de crier vers Dieu, passe par la compassion
        et le Christ, reçoit une parole pour marcher, réapprend l'appartenance,
        puis retrouve une voix dans la louange. Elle sert prioritairement celui
        qui craint de devoir être déjà fort ou digne avant de revenir.

        ARCHITECTURE 2 — RENCONTRER LE ROI SERVITEUR

        Elle commence par le Dieu vivant et ses œuvres, rencontre Jésus-Christ
        dans les psaumes reçus comme messianiques, puis apprend à lui répondre
        personnellement, à marcher selon sa parole, à bâtir avec lui et à entrer
        dans la louange de tout le peuple. Elle sert prioritairement celui qui
        découvre la foi et demande d'abord qui est Dieu et pourquoi lui faire
        confiance.

        DISCERNEMENT À LAISSER À L'HUMAIN

        L'architecture 1 a la chaleur du retour vécu; l'architecture 2 rend le
        témoignage du Christ plus tôt et plus explicitement. Aucune n'est
        approuvée ici. L'humain peut choisir, combiner, déplacer ou exclure des
        passages. Le Psaume 137 est conservé dans la cartographie et intégré avec
        prudence aux deux chemins, car l'exclure effacerait la parole de l'exilé;
        ses versets violents ne deviennent toutefois aucune question de vie sans
        travail exégétique ultérieur.

        REPRISE APRÈS APPROBATION HUMAINE — RÉVISION 4

        La porte humaine approuve rencontrer-le-roi-serviteur sans amendement.
        Les six entrées de approved_pack_plan correspondent exactement, pour
        leur identifiant, leur titre et leurs références, aux six packs de cette
        architecture. Le périmètre approuvé est donc matérialisé à l'identique
        dans fast.result.approved_source_scope.

        FAST BLOQUÉ : BLOCKED_MISSING_MULTI_PACK_DOWNSTREAM_SCHEMA

        La chaîne ne peut pas être lancée honnêtement. Le YAML et les rôles
        downstream ne prévoient qu'une mémoire Influenceur, une mémoire
        Mystique, une mémoire Nouveau baptisé, une mémoire Quiz et une mémoire
        Voix, toutes au singulier. Les résultats sont également uniques : un
        seul influenceur, un seul mystique, un seul nouveau_baptise, puis un
        quiz de dix questions et un quiz_final de dix questions.

        Pour produire six packs de dix questions sans écrasement, il manque un
        schéma canonique indexé par working_id, des mémoires complètes par pack,
        des résultats par pack, un contrat d'orchestration séquentielle des six
        chaînes, ainsi que des gates français et visuels portant explicitement
        sur soixante unités. Le Responsable missionnaire n'invente pas ce
        contrat et n'appelle pas l'Influenceur tant que ce manque n'est pas
        résolu.
    mise_en_scene_visuelle:
      owner: expedition-fast-directeur-mise-en-scene
      revision: 1
      status: complete
      production: |-
        SOURCES RÉSOLUES

        Les sept unités publiques ont été relues depuis les liens de `source.readings`.
        Le refrain de miséricorde du Psaume 136, la pierre rejetée du Psaume 118,
        la connaissance du cœur du Psaume 139, la parole-lampe du Psaume 119,
        le rassemblement des exilés du Psaume 147 et le souffle invité du Psaume
        150 soutiennent directement les six jours. Pour la campagne, le Psaume
        110 porte la royauté et la prêtrise, le Psaume 118 porte la pierre devenue
        principale, et le programme Viens et suis-moi qualifie explicitement leur
        réception chrétienne en Jésus-Christ. La campagne reste donc une synthèse
        picturale de réception, jamais la reconstitution d'un événement historique.

        AUDIT DES SIX RÉEMPLOIS

        Les six fichiers existent, sont ouvrables, mesurent 941 x 1672 et gardent
        une lecture immédiate : assemblée joyeuse; Christ accueilli dans une porte
        de pierre; femme connue dans une prière contemporaine; lampe transmise dans
        la nuit; communauté qui bâtit; femme hésitante accueillie sans joie forcée.
        Chaque image sert exactement le jour qui la cite. Elles sont verrouillées :
        aucune régénération, variante ou composition supplémentaire n'est demandée.
        Les crops futurs devront préserver le geste central; un échec de crop sera
        documenté, pas compensé silencieusement par un nouvel appel.

        ARBITRAGE DE CAMPAGNE

        L'image conventionnelle aurait montré un Christ couronné et une pierre
        isolée devant une porte. Elle est lisible, mais statique et proche d'une
        affiche religieuse générique. L'alternative dramaturgique montre Jésus,
        reconnaissable sans prétention documentaire, descendu d'un trône visible
        pour porter avec deux bâtisseurs la pierre rejetée vers le seuil d'une
        porte ouverte. Le choix hybride conserve les signes universels — roi,
        pierre, porte — et donne au Roi-serviteur un geste actif, coûteux et
        partagé. La question naît en deux secondes : pourquoi le roi porte-t-il
        lui-même la pierre rejetée ?

        RYTHME ET COÛT

        L'expédition alterne Celestial Light et Celestial Dark, Bible picturale et
        situations contemporaines, célébration et tension intérieure. Le nouveau
        master de campagne est une illustration biblique Celestial Light, riche en
        pierre, bois, textile et jardin ordonné. Il concentre toute l'action dans
        la zone commune aux crops 9:16, 4:5 et 16:9. C'est le seul concept transmis
        au Producteur et le seul appel permis avant la décision humaine.
    direction_artistique:
      owner: expedition-fast-directeur-artistique-producteur
      revision: 4
      status: responsive_renditions_awaiting_two_second_review
      production: |-
        AUTORISATION ET SÉLECTION

        À la révision de mise en scène 1, `visual_staging` était
        `ready_for_proof`, les sept concepts étaient en PASS, le contrat
        autorisait une preuve avant jugement humain et aucun appel n'était
        consigné. J'ai retenu exclusivement
        `psalms-expedition-campaign-key-art` : c'est le seul master neuf de
        l'expédition et il éprouve à la fois l'image-clé, le Hero Rama, la
        présence Home et le septième jour Bibliothèque. Les six autres jours
        restent verrouillés sur leurs images de quiz approuvées.

        PRODUCTION

        Un seul appel ImageGen intégré a été effectué le 5 septembre 2026,
        sans image de référence, variante, autre ratio, upscale ni retouche.
        La preuve carrée montre exactement trois personnes : Jésus-Christ,
        représenté comme jeune homme juif du Levant dans un vêtement royal
        ivoire, indigo et or, porte avec une bâtisseuse et un bâtisseur une
        pierre ébréchée au seuil d'une grande porte. Le jardin d'aurore, la
        pierre claire, le bois sombre, les fleurs mûres et l'axe ordonné
        empruntent des principes abstraits aux jardins de temple publiquement
        visibles de l'Église; aucun temple moderne, rite ou lieu exact n'est
        revendiqué.

        INSPECTION RÉELLE

        Le PNG s'ouvre, est carré, sans texte, inscription, logo, filigrane ni
        halo. Les trois visages, les mains et la pierre sont lisibles dans le
        master; le geste partagé, la richesse des matières et la lumière
        Celestial Light sont forts. Deux écarts sont exposés sans les masquer :
        le trône demandé n'est pas visible, et l'outil a livré 1254 x 1254
        malgré la demande 2160 x 2160. Aucun upscale n'a été réalisé. Dans
        l'aperçu réel du Hero Rama mobile 390 x 844, les trois visages tiennent,
        mais le titre et le chrome recouvrent presque entièrement la pierre et
        rendent le service partagé moins immédiat. La preuve est donc livrée au
        Critique des deux secondes avec ces non-conformités documentées; aucune
        seconde génération n'est ouverte automatiquement.

        RETOUR DU CRITIQUE

        Le verdict est `REWORK`. Il confirme l'arrêt du regard et la force du
        master, mais refuse la preuve sur la surface Rama : le titre masque le
        geste, le trône manque et la définition ne satisfait pas le master HD.
        Le Conseil s'arrête au gate humain `visual_proof_approval`; aucun autre
        appel, dérivé final ou branchement runtime n'est autorisé.

        REWORK CIBLÉ AUTORISÉ EN RÉVISION 20

        Après décision humaine, la v1 a été chargée et utilisée comme cible d'un
        unique appel ImageGen intégré en mode edit. L'identité du trio, ses
        vêtements, la porte, le jardin et la lumière ont été conservés. La v2
        montre maintenant le trône de pierre vide dans l'axe, derrière le
        Roi-serviteur, et remonte la pierre ainsi que les mains au niveau du
        torse. Aucun personnage, texte, emblème religieux ou lieu contemporain
        identifiable n'a été ajouté.

        INSPECTION V2

        Le master v2 est carré, ouvre correctement et conserve exactement trois
        personnes. Le trône vide, la pierre, toutes les mains et le geste partagé
        sont clairs dans l'image seule. L'outil a de nouveau livré 1254 x 1254;
        conformément à l'autorisation, aucun upscale ni appel de rattrapage n'a
        été effectué. Dans le vrai Hero Rama mobile 390 x 844, le trône et les
        trois visages restent très lisibles, mais le grand titre recouvre encore
        la pierre et une partie des mains. Le rework améliore donc la royauté
        visible sans démontrer encore la lecture de l'action sur cette surface.
        La v2 est transmise au Critique des deux secondes et la chaîne demeure
        fermée à tout lot, dérivé final, runtime ou publication.

        RETOUR DU CRITIQUE V2

        Verdict `REWORK`. Le trône vide et le geste passent dans le master, mais
        la pierre et presque toutes les mains restent masquées par le titre du
        Hero Rama 390 x 844; la définition reste aussi sous le 2160 x 2160
        contractuel. La chaîne est arrêtée au gate humain sans nouvel appel.

        DÉRIVÉ PORTRAIT AUTORISÉ EN RÉVISION 23

        Aucun appel ImageGen n'a été effectué. La v2 exacte, vérifiée par son SHA,
        a été réduite sans recadrage à 1080 x 1080 et placée nette en tête d'un
        canevas 1080 x 1920. Les 840 pixels inférieurs proviennent uniquement des
        260 pixels bas du même master : retournement vertical, étirement, flou
        gaussien et fondu bleu-noir progressif. Cette extension ne crée ni sujet
        ni décor nouveau et ne présente aucune couture perceptible.

        Le portrait et son aperçu réel Rama 390 x 844 ont été ouverts et regardés.
        Le trône, les trois visages, la pierre entière et toutes les mains restent
        visibles avant le début du titre HTML. Le titre, la progression et le CTA
        reposent sur l'extension sombre; le CTA est complet et lisible. La sortie
        est exactement 1080 x 1920. Conformément à la séquence autorisée, aucun
        dérivé 4:5 ou 16:9 n'est produit avant le verdict du Critique.

        PASS PORTRAIT ET RENDITIONS RESTANTES

        Le Critique a validé le portrait en révision 25. Sous l'autorisation
        humaine r23, deux compositions purement mécaniques ont ensuite été
        retenues. Pour la tablette, un fond v2 fortement flouté et assombri porte
        la copie; le carré net, réduit à 1080 x 1080, est placé à droite avec un
        fondu inférieur et un dégradé latéral. Pour le paysage, le même fond
        non figuratif porte la copie à gauche; le carré net est placé à droite,
        avec une entrée latérale fondue. Aucun sujet lisible n'est dupliqué.

        Les quatre fichiers ont été ouverts : masters 1440 x 1800 et 1920 x 1080,
        aperçus Rama réels 768 x 1024 et 1440 x 900. Sur les deux surfaces, le
        trône, les trois visages, la pierre entière et toutes les mains restent
        immédiatement lisibles hors de la copie. Titres, progression, compteur
        et CTA sont complets. Aucun texte n'est incrusté, aucune couture n'est
        perceptible et aucun appel ImageGen n'a été effectué. Les fichiers sont
        transmis au Critique avant tout encodage, runtime ou publication.
    critique_deux_secondes:
      owner: expedition-fast-critique-deux-secondes
      revision: 4
      status: complete_awaiting_human_proof_approval
      production: |-
        LECTURE FROIDE AVANT CONCEPT

        Dans le master seul, l'œil rencontre d'abord le visage baissé de l'homme
        central, puis les trois corps agenouillés et leurs mains réunies autour
        d'une pierre brute. La porte ouverte, le jardin ordonné et l'aurore
        installent immédiatement un monde ample, beau et accueillant. La scène
        perçue est celle de trois personnes richement vêtues qui posent ensemble
        une lourde pierre dans un seuil. La question naturelle est : pourquoi cet
        homme placé au centre et vêtu avec plus de richesse prend-il lui-même le
        poids avec les deux autres ? L'image seule peut arrêter le défilement.

        Dans l'aperçu Rama mobile 390 x 844, le premier sujet devient le grand
        titre HTML, puis les trois visages. La pierre, les mains et leur effort
        commun tombent presque entièrement sous le sous-titre, la progression et
        le bouton. En moins de deux secondes, on comprend surtout que trois
        personnes sont penchées ensemble; on ne saisit plus sûrement qu'elles
        portent ou placent une pierre. Le monde et les visages peuvent encore
        arrêter le pouce, mais l'action qui devait faire contempler le
        Roi-serviteur ne survit pas à la surface.

        CONTRÔLE APRÈS LECTURE DU CONCEPT ET DU MANIFESTE

        La preuve respecte le trio exact, la dignité des visages, la richesse des
        étoffes, la pierre ébréchée, la porte ouverte, le jardin ordonné et la
        famille Celestial Light. Elle ne montre ni texte incrusté, ni halo, ni
        temple moderne identifiable, ni rite inventé. La référence esthétique
        aux jardins de l'Église reste abstraite et cohérente avec la source
        officielle consignée.

        Deux éléments essentiels ne sont cependant pas prouvés. Le trône annoncé
        n'est pas visible : sans ce signe et avec l'action masquée dans le Hero,
        la royauté servante repose surtout sur le titre plutôt que sur l'image.
        Le master livré mesure 1254 x 1254 au lieu des 2160 x 2160 requis; il ne
        démontre donc pas la livraison HD contractuelle ni la résistance des
        dérivés 9:16, 4:5 et 16:9.

        VERDICT

        REWORK. La direction est forte et mérite d'être conservée : présence
        magnétique, service partagé, lumière, matières et profondeur sont déjà
        convaincants. Avant une approbation, il faut rendre la pierre et les mains
        lisibles sur le vrai Hero mobile, rétablir le signe royal prévu dans la
        composition et fournir le master HD demandé. Ce verdict n'autorise aucun
        nouvel appel ni aucune production en série; la décision revient à
        l'humain.

        NOUVELLE LECTURE FROIDE — PREUVE V2

        Dans le master v2 seul, l'œil rencontre le trône de pierre vide placé dans
        l'axe, puis le visage concentré de l'homme central et la masse claire de la
        pierre tenue par le trio. On comprend immédiatement que cet homme de rang
        a quitté son siège et prend le poids avec une bâtisseuse et un bâtisseur.
        La question naît sans titre : pourquoi celui qui pourrait rester sur ce
        trône porte-t-il lui-même la pierre ? L'image est forte, spécifique et
        arrête le défilement.

        Dans le Hero Rama mobile 390 x 844, le trône et les trois visages restent
        nettement visibles. Le grand titre devient ensuite le foyer principal et
        recouvre la pierre ainsi que presque toutes les mains. Avant de lire les
        mots, on voit donc trois personnes penchées sous un trône vide, mais pas
        l'acte précis de porter ensemble. Le titre explique « Roi-serviteur » à la
        place de l'image. Le pouce peut s'arrêter pour la beauté et la présence,
        mais la situation ne se livre toujours pas en deux secondes.

        CONTRÔLE V2 APRÈS CONCEPT ET MANIFESTE

        Le rework réussit le trône absent de la v1. Le master respecte exactement
        trois personnes, leurs identités, la pierre ébréchée, toutes les mains, la
        porte, le jardin, les matières riches et la famille Celestial Light. Il ne
        présente ni texte incrusté, ni halo, ni temple moderne reconnaissable, ni
        rite inventé. La référence esthétique à l'ordre et aux jardins de l'Église
        reste abstraite et fidèle à la source officielle consignée.

        La surface cible échoue néanmoins encore sur l'élément dramatique central :
        pierre, mains et poids partagé ne survivent pas au chrome. Le PNG est
        toujours livré en 1254 x 1254 au lieu des 2160 x 2160 requis; il ne prouve
        ni le master HD contractuel ni ses dérivés 9:16, 4:5 et 16:9.

        VERDICT V2

        REWORK. La direction et le master sont convaincants, et le signe royal est
        désormais réussi. La preuve ne passe toutefois pas le gate de lecture sur
        sa vraie surface et ne satisfait pas la définition HD. Ce verdict ne vaut
        ni autorisation d'un nouvel edit, ni autorisation de lot, de dérivé final,
        de runtime ou de publication. La décision revient à l'humain.

        LECTURE FROIDE — DÉRIVÉ PORTRAIT 1080 X 1920

        Dans le portrait seul, l'œil rencontre le trône vide dans l'axe, les trois
        visages concentrés puis la pierre entière portée par toutes les mains. La
        scène nette occupe la moitié supérieure; le sol se prolonge ensuite dans
        une profondeur sombre sans sujet répété. La transition ne présente ni
        rupture horizontale perceptible, ni décor dupliqué lisible. Sans titre, on
        comprend en deux secondes qu'un homme de rang a quitté son siège pour
        partager le poids avec deux bâtisseurs.

        Dans l'aperçu Rama mobile 390 x 844, le trône, les trois visages, la pierre
        entière et les mains apparaissent tous avant le début du titre. Le bloc
        éditorial repose sur l'extension sombre et ne recouvre plus l'action. Le
        titre, les six repères de progression, le compteur 0 / 6 et le CTA sont
        lisibles; aucun sujet n'est dupliqué sous eux. La scène ouvre naturellement
        la question : pourquoi celui qui pourrait rester assis porte-t-il cette
        pierre avec les autres ? Le pouce s'arrête et l'image donne envie de saisir
        ce service.

        CONTRÔLE APRÈS MANIFESTE

        Le fichier ouvre en 1080 x 1920 exact et son SHA correspond au manifeste.
        Il dérive mécaniquement de la v2 approuvée : réduction du carré net,
        extension issue de son propre sol, flou et fondu bleu-noir. Le dossier
        consigne zéro appel ImageGen pour cette dérivation; les deux appels
        historiques de création des v1 et v2 restent inchangés. Casting, traitement,
        trône, porte, jardin, dignité et intégrité de source sont préservés.

        VERDICT PORTRAIT

        PASS pour le portrait 9:16 et sa surface Rama mobile. Ce PASS ne constitue
        ni une décision humaine, ni une autorisation du 4:5, du 16:9, d'un autre
        traitement, du runtime ou de la publication. Le Conseil retourne au gate
        humain.

        LECTURE FROIDE — DÉRIVÉ TABLETTE 1440 X 1800

        Dans le master 4:5, le trône vide, les trois visages et la pierre tenue par
        toutes les mains occupent le haut-droit. Un champ sombre s'ouvre à gauche
        et se prolonge sous la scène sans personnage lisible répété. La transition
        est progressive : aucune couture horizontale ou verticale n'interrompt le
        regard. Sans texte, on comprend immédiatement qu'un homme de rang partage
        la charge avec deux bâtisseurs.

        Dans le Hero Rama 768 x 1024, le trône, les visages, la pierre entière et
        les mains restent dans la moitié supérieure droite. Le titre se déploie à
        gauche et sous l'action sans la recouvrir. Sous-titre, six repères,
        compteur 0 / 6 et CTA restent complets et lisibles. La question du siège
        quitté et du poids partagé naît en moins de deux secondes.

        VERDICT TABLETTE : PASS.

        LECTURE FROIDE — DÉRIVÉ PAYSAGE 1920 X 1080

        Dans le master 16:9, le grand champ sombre de gauche prépare une zone de
        copie tandis que la scène nette occupe la droite. Trône, trois visages,
        pierre et mains forment un seul foyer. L'entrée latérale du carré net se
        fond dans l'architecture sombre : aucune ligne de collage perceptible et
        aucun visage ou corps dupliqué n'apparaît dans l'extension.

        Dans le Hero Rama 1440 x 900, toute la copie demeure à gauche et toute
        l'action à droite. Le trône vide, les trois visages, la pierre entière et
        les mains sont immédiatement visibles; le service partagé se comprend
        sans lire le titre. Titre, sous-titre, progression, compteur et CTA ont un
        contraste net et ne mordent pas sur les personnages.

        VERDICT PAYSAGE : PASS.

        CONTRÔLE APRÈS MANIFESTE ET VERDICT GLOBAL

        Les fichiers ouvrent aux dimensions exactes 1440 x 1800 et 1920 x 1080;
        leurs SHA ainsi que ceux des aperçus correspondent au manifeste. Les deux
        renditions proviennent de compositions ImageMagick déterministes de la v2
        approuvée. Le dossier consigne zéro appel ImageGen pour les dérivés et les
        deux appels historiques restent inchangés. Casting, traitement, dignité,
        porte, jardin et intégrité de source sont préservés.

        VERDICT GLOBAL : PASS. Ce PASS constate uniquement les masters tablette
        et paysage et leurs surfaces Rama réelles. Il n'autorise aucun asset
        supplémentaire, encodage responsive, branchement runtime ou publication;
        le Conseil retourne au gate humain.
  result:
