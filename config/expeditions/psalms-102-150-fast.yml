    expedition:
      title:
        fr: Rencontrer le Roi-serviteur
        es: Conoce al Rey servidor
        en: Meet the Servant King
        pt-BR: Encontre o Rei servo
      subtitle:
        fr: Six étapes pour découvrir qui est Dieu, puis marcher avec lui
        es: Seis etapas para descubrir quién es Dios y caminar con él
        en: Six stages to discover who God is—and walk with him
        pt-BR: Seis etapas para descobrir quem Deus é e caminhar com ele
      promise:
        fr: Tu peux venir avec tes questions, ta fatigue ou ton désir de recommencer.
          Ces psaumes montrent un Dieu vivant qui agit, écoute, guide et rassemble,
          et ils ouvrent en Jésus-Christ un chemin de salut.
        es: Puedes venir con tus preguntas, tu cansancio o tus ganas de volver a
          empezar. Estos salmos muestran a un Dios vivo que actúa, escucha, guía
          y reúne, y abren en Jesucristo un camino de salvación.
        en: Bring your questions, your weariness, or your desire to begin again.
          These psalms reveal a living God who acts, listens, guides, and gathers,
          and they open a path of salvation in Jesus Christ.
        pt-BR: Você pode vir com suas perguntas, seu cansaço ou sua vontade de
          recomeçar. Estes salmos mostram um Deus vivo que age, escuta, guia e
          reúne, e abrem em Jesus Cristo um caminho de salvação.
    rama_headline:
      fr: Cette semaine, viens rencontrer le Roi-serviteur
      es: Esta semana, ven a conocer al Rey servidor
      en: This week, come meet the Servant King
      pt-BR: Nesta semana, venha encontrar o Rei servo
    library_days:
    - id: psalms-102-150-fast-day-1
      kind: discovery
      scheduled_on: '2026-08-31'
      pack_id: pack-01
      reference: ot/ps/136
      references:
      - ot/ps/135
      - ot/ps/136
      - ot/ps/146
      copy:
        fr:
          eyebrow: Aujourd’hui dans les Écritures
          title: Vingt-six fois la même réponse
          setup: Création, traversée, humiliation, délivrance et nourriture reçoivent
            le même refrain dans le Psaume 136. Sa miséricorde dure d’âge en âge.
          question: Quelle étape de ton histoire pourrais-tu relire avec ce refrain ?
          cta_label: Ouvrir le Psaume 136
        es:
          eyebrow: Hoy en las Escrituras
          title: Veintiséis veces la misma respuesta
          setup: Creación, travesía, humillación, liberación y alimento reciben el
            mismo estribillo en el Salmo 136. Su misericordia permanece para siempre.
          question: ¿Qué etapa de tu historia podrías releer con este estribillo?
          cta_label: Abrir el Salmo 136
        en:
          eyebrow: Today in Scripture
          title: The same answer, twenty-six times
          setup: Creation, the journey, humiliation, deliverance, and food all receive
            the same refrain in Psalm 136. His mercy endures forever.
          question: What part of your story could you revisit with this refrain?
          cta_label: Open Psalm 136
        pt-BR:
          eyebrow: Hoje nas Escrituras
          title: Vinte e seis vezes a mesma resposta
          setup: Criação, travessia, humilhação, libertação e alimento recebem o
            mesmo refrão no Salmo 136. Sua misericórdia dura para sempre.
          question: Que etapa da sua história você poderia reler com esse refrão?
          cta_label: Abrir o Salmo 136
      visual_source:
        strategy: reuse_approved_quiz_master
        question_id: fast-psalms-pack01-q03
        asset_path: public/media/expeditions/psalms-102-150-fast/pack-01/quiz/fr/psalms-pack01-q03-portrait-v1.png
    - id: psalms-102-150-fast-day-2
      kind: discovery
      scheduled_on: '2026-09-01'
      pack_id: pack-02
      reference: ot/ps/118
      references:
      - ot/ps/110
      - ot/ps/118
      - nt/matt/22
      - nt/heb/5
      copy:
        fr:
          eyebrow: Aujourd’hui dans les Écritures
          title: Le Roi, le prêtre et la pierre
          setup: Un prêtre pour toujours. Une pierre rejetée devenue principale.
            Le Nouveau Testament aide les chrétiens à reconnaître Jésus-Christ
            dans ces images des Psaumes 110 et 118.
          question: Que révèlent-elles du Sauveur que tu cherches ?
          cta_label: Ouvrir les Psaumes 110 et 118
        es:
          eyebrow: Hoy en las Escrituras
          title: El Rey, el sacerdote y la piedra
          setup: Un sacerdote para siempre. Una piedra rechazada que llega a ser
            la principal. El Nuevo Testamento ayuda a los cristianos a reconocer
            a Jesucristo en estas imágenes de los Salmos 110 y 118.
          question: ¿Qué revelan del Salvador que buscas?
          cta_label: Abrir los Salmos 110 y 118
        en:
          eyebrow: Today in Scripture
          title: The King, the priest, and the stone
          setup: A priest forever. A rejected stone made the cornerstone. The New
            Testament helps Christians recognize Jesus Christ in these images from
            Psalms 110 and 118.
          question: What do they reveal about the Savior you are seeking?
          cta_label: Open Psalms 110 and 118
        pt-BR:
          eyebrow: Hoje nas Escrituras
          title: O Rei, o sacerdote e a pedra
          setup: Um sacerdote para sempre. Uma pedra rejeitada que se torna a principal.
            O Novo Testamento ajuda os cristãos a reconhecer Jesus Cristo nessas
            imagens dos Salmos 110 e 118.
          question: O que elas revelam sobre o Salvador que você procura?
          cta_label: Abrir os Salmos 110 e 118
      visual_source:
        strategy: reuse_approved_quiz_master
        question_id: fast-psalms-pack02-q10
        asset_path: public/media/expeditions/psalms-102-150-fast/pack-02/quiz/fr/psalms-pack02-q10-portrait-v1.png
    - id: psalms-102-150-fast-day-3
      kind: discovery
      scheduled_on: '2026-09-02'
      pack_id: pack-03
      reference: ot/ps/139
      references:
      - ot/ps/102
      - ot/ps/103
      - ot/ps/116
      - ot/ps/139
      copy:
        fr:
          eyebrow: Aujourd’hui dans les Écritures
          title: Connu sans être rejeté
          setup: Ces psaumes ne cachent ni détresse, ni faute, ni fragilité. Dieu
            écoute, se souvient de notre poussière et reçoit même la prière qui
            lui demande de sonder le cœur.
          question: Qu’oserais-tu lui dire si tu croyais pouvoir être connu ainsi ?
          cta_label: Ouvrir le Psaume 139
        es:
          eyebrow: Hoy en las Escrituras
          title: Conocido sin ser rechazado
          setup: Estos salmos no esconden la angustia, el pecado ni la fragilidad.
            Dios escucha, recuerda que somos polvo y recibe incluso la oración que
            le pide examinar el corazón.
          question: ¿Qué te atreverías a decirle si creyeras que puedes ser conocido así?
          cta_label: Abrir el Salmo 139
        en:
          eyebrow: Today in Scripture
          title: Known without being rejected
          setup: These psalms hide neither distress, sin, nor frailty. God listens,
            remembers that we are dust, and even receives the prayer asking him
            to search the heart.
          question: What would you dare tell him if you believed you could be known like this?
          cta_label: Open Psalm 139
        pt-BR:
          eyebrow: Hoje nas Escrituras
          title: Conhecido sem ser rejeitado
          setup: Estes salmos não escondem angústia, pecado nem fragilidade. Deus
            escuta, lembra que somos pó e recebe até a oração que pede que ele examine
            o coração.
          question: O que você ousaria lhe dizer se acreditasse que pode ser conhecido assim?
          cta_label: Abrir o Salmo 139
      visual_source:
        strategy: reuse_approved_quiz_master
        question_id: fast-psalms-pack03-q10
        asset_path: public/media/expeditions/psalms-102-150-fast/pack-03/quiz/fr/psalms-pack03-q10-portrait-v1.png
    - id: psalms-102-150-fast-day-4
      kind: discovery
      scheduled_on: '2026-09-03'
      pack_id: pack-04
      reference: ot/ps/119
      references:
      - ot/ps/119
      - ot/ps/138
      copy:
        fr:
          eyebrow: Aujourd’hui dans les Écritures
          title: Assez de lumière pour un pas
          setup: La parole n’éclaire pas forcément toute la route d’un coup. Le
            Psaume 119 la compare à une lampe pour les pieds, tandis que le Psaume
            138 parle d’une âme fortifiée au milieu de la détresse.
          question: Quel prochain pas as-tu déjà assez de lumière pour faire ?
          cta_label: Ouvrir le Psaume 119
        es:
          eyebrow: Hoy en las Escrituras
          title: Luz suficiente para un paso
          setup: La palabra no siempre ilumina todo el camino de una vez. El Salmo
            119 la compara con una lámpara para los pies, mientras el Salmo 138
            habla de un alma fortalecida en medio de la angustia.
          question: ¿Para qué próximo paso ya tienes suficiente luz?
          cta_label: Abrir el Salmo 119
        en:
          eyebrow: Today in Scripture
          title: Enough light for one step
          setup: The word may not light the entire road at once. Psalm 119 compares
            it to a lamp for your feet, while Psalm 138 speaks of a soul strengthened
            in the middle of distress.
          question: What next step do you already have enough light to take?
          cta_label: Open Psalm 119
        pt-BR:
          eyebrow: Hoje nas Escrituras
          title: Luz suficiente para um passo
          setup: A palavra nem sempre ilumina todo o caminho de uma vez. O Salmo
            119 a compara a uma lâmpada para os pés, enquanto o Salmo 138 fala de
            uma alma fortalecida em meio à angústia.
          question: Para qual próximo passo você já tem luz suficiente?
          cta_label: Abrir o Salmo 119
      visual_source:
        strategy: reuse_approved_quiz_master
        question_id: fast-psalms-pack04-q04
        asset_path: public/media/expeditions/psalms-102-150-fast/pack-04/quiz/fr/psalms-pack04-q04-portrait-v1.png
    - id: psalms-102-150-fast-day-5
      kind: discovery
      scheduled_on: '2026-09-04'
      pack_id: pack-05
      reference: ot/ps/147
      references:
      - ot/ps/127
      - ot/ps/128
      - ot/ps/137
      - ot/ps/147
      copy:
        fr:
          eyebrow: Aujourd’hui dans les Écritures
          title: Bâtir avant que tout soit réparé
          setup: Les exilés pleurent encore Sion. Pourtant Dieu bâtit, rassemble
            et panse les cœurs. Revenir ne demande pas d’attendre une vie parfaite.
          question: Que pourrais-tu commencer avec Dieu avant que tout soit réparé ?
          cta_label: Ouvrir le Psaume 147
        es:
          eyebrow: Hoy en las Escrituras
          title: Construir antes de que todo sane
          setup: Los exiliados aún lloran por Sion. Sin embargo, Dios construye,
            reúne y sana los corazones. Volver no exige esperar una vida perfecta.
          question: ¿Qué podrías empezar con Dios antes de que todo sane?
          cta_label: Abrir el Salmo 147
        en:
          eyebrow: Today in Scripture
          title: Build before everything is healed
          setup: The exiles still weep for Zion. Yet God builds, gathers, and binds
            up hearts. Returning does not require waiting for a perfect life.
          question: What could you begin with God before everything is healed?
          cta_label: Open Psalm 147
        pt-BR:
          eyebrow: Hoje nas Escrituras
          title: Construir antes que tudo esteja curado
          setup: Os exilados ainda choram por Sião. Mesmo assim, Deus constrói,
            reúne e cuida dos corações. Voltar não exige esperar uma vida perfeita.
          question: O que você poderia começar com Deus antes que tudo esteja curado?
          cta_label: Abrir o Salmo 147
      visual_source:
        strategy: reuse_approved_quiz_master
        question_id: fast-psalms-pack05-q10
        asset_path: public/media/expeditions/psalms-102-150-fast/pack-05/quiz/fr/q10-v1.png
    - id: psalms-102-150-fast-day-6
      kind: discovery
      scheduled_on: '2026-09-05'
      pack_id: pack-06
      reference: ot/ps/150
      references:
      - ot/ps/117
      - ot/ps/148
      - ot/ps/149
      - ot/ps/150
      copy:
        fr:
          eyebrow: Aujourd’hui dans les Écritures
          title: Revenir sans faire semblant
          setup: Dans ces psaumes, les nations, les générations, les instruments
            et tout ce qui respire sont appelés à louer Dieu. Même si ta joie n’est
            pas encore revenue, tu peux reprendre place sans faire semblant.
          question: Quel pas sincère peux-tu faire vers Dieu aujourd’hui ?
          cta_label: Ouvrir le Psaume 150
        es:
          eyebrow: Hoy en las Escrituras
          title: Volver sin fingir
          setup: Estos salmos llaman a las naciones, a todas las generaciones, a
            los instrumentos y a todo ser que respira a alabar a Dios. Aunque la
            alegría aún no haya vuelto, puedes ocupar de nuevo tu lugar sin fingir.
          question: ¿Qué paso sincero puedes dar hoy para acercarte a Dios?
          cta_label: Abrir el Salmo 150
        en:
          eyebrow: Today in Scripture
          title: Come back without pretending
          setup: In these psalms, nations, generations, instruments, and everything
            that breathes are called to praise God. Even if your joy has not returned
            yet, you can take your place again without pretending.
          question: What honest step can you take toward God today?
          cta_label: Open Psalm 150
        pt-BR:
          eyebrow: Hoje nas Escrituras
          title: Voltar sem fingir
          setup: Esses salmos chamam as nações, todas as gerações, os instrumentos
            e tudo o que respira a louvar a Deus. Mesmo que sua alegria ainda não
            tenha voltado, você pode ocupar seu lugar de novo sem fingir.
          question: Que passo sincero você pode dar hoje para se aproximar de Deus?
          cta_label: Abrir o Salmo 150
