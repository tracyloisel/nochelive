style: >
  Family-friendly LDS game-night sound design. Warm gold chapel quiz,
  not a horror film, not a sports stadium. Instrumental only: no vocals,
  no lyrics, no spoken words, no choir hymn, no church organ. No screams,
  no gunshots, no sirens. Dry and close-mic'd so it plays on a phone speaker.

cues:
  round_start:
    kind: oneshot
    max_seconds: 2.2
    prompt: >
      Isolated 1.6 second special-question entrance, then complete silence.
      A fast parchment flick, two ascending close-mic'd harp plucks and one
      restrained warm brass bloom. Adventurous and important, never bombastic.
      Same sonic family as correct_gold. No continuing melody, no voice.

  buzzer_hit:
    kind: oneshot
    max_seconds: 0.6
    prompt: >
      Isolated 0.4 second game-show slam: palm hitting a wooden desk
      plus a short warm brass stab. Punchy, close, no reverb tail.
      No voice, no music bed, then complete silence.

  correct_gold:
    kind: oneshot
    max_seconds: 1.6
    prompt: >
      Isolated 1.15 second crystalline correct-answer release after the
      timer_tension bed. A precise luminous glass-celesta strike, followed by
      two distinct ascending crystal harmonics and one clear suspended high
      resonance that gently resolves. Bright, pure and celestial, like light
      passing through cut crystal; satisfying tension release on a phone
      speaker. No wood, no pizzicato, no drum, no harp glissando, no casino
      coins, no arcade jingle, no fanfare, no voice or choir. Brief clean tail,
      then complete silence.

  wrong_soft:
    kind: oneshot
    max_seconds: 1.0
    prompt: >
      Isolated 0.75 second unmistakable wrong-answer cue that musically says
      “no, no” without any speech. Exactly two short frosted-crystal celesta
      strikes: first note, a clear pause of about 140 milliseconds, then a
      second lower note. DA — DAH, two syllables, firmly descending, instantly
      readable as a gentle refusal. Same crystalline family as correct_gold,
      but muted and restrained. No third note, no chord, no wood, no drum, no
      harsh buzzer, no comedy, no ominous bass, no voice or choir, then silence.

  royal_fanfare:
    kind: oneshot
    max_seconds: 2.8
    prompt: >
      Isolated 2.4 second pack-complete ceremony. A small confident brass
      triplet answered by a rising harp flourish and one luminous gold bell.
      Proud family game-night pageant, intimate and noble, not a stadium,
      not cinematic trailer music. No voice, then complete silence.

  level_up:
    kind: oneshot
    max_seconds: 1.8
    prompt: >
      Isolated 1.4 second rank-up sparkle: rising bells and harp.
      Playful, kid-safe. No voice, then silence.

  chest:
    kind: oneshot
    max_seconds: 1.2
    prompt: >
      Isolated 0.85 second legendary-streak reward. A close wooden chest latch,
      a compact lid thump and a short shower of three brushed-gold sparkles.
      Tactile treasure, premium mobile scale, no coins, no orchestra, no voice,
      then complete silence.

  dramatic_fire:
    kind: oneshot
    max_seconds: 1.8
    prompt: >
      Isolated 1.2 second freeze-dance hit: low drum and a brief
      fire whoosh, theatrical not scary. No voice, then silence.

  fire_whoosh:
    kind: oneshot
    max_seconds: 1.2
    prompt: >
      Isolated 0.65 second streak-rise accent. A tight upward warm-air sweep,
      one dry frame-drum pulse and a tiny gold spark at the crest. Energetic but
      friendly, no explosion, no crackling fire bed, no voice, then silence.

  timer_tension:
    kind: loop
    max_seconds: 30
    prompt: >
      Instrumental only, no vocals, no lyrics. 30 second seamless background
      loop for a timed solo Bible adventure. Sparse muted pizzicato, a soft
      hand-drum heartbeat and occasional low wooden pulse, gold-warm modal
      harmony with restrained forward motion. Keep the spectrum clear for UI
      hits and phone speakers. No melody, horror, clocks or final cadence.
      End on exactly the opening harmony and texture so it loops invisibly.

  tick:
    kind: oneshot
    max_seconds: 0.18
    prompt: >
      Isolated one-shot, 0.12 seconds then complete silence.
      Soft wooden clock tick, dry, no reverb, no music, no voice.
      A single hit suitable to repeat every second.

  tick_low:
    kind: oneshot
    max_seconds: 0.22
    prompt: >
      Isolated one-shot, 0.16 seconds then complete silence.
      Sharper wooden clock tick, slightly higher and closer, still
      dry, no music, no voice. For the last five seconds of a timer.

  round_open:
    kind: oneshot
    max_seconds: 2.0
    prompt: >
      Isolated 1.5 second curtain-rise stinger: harp gliss and a
      small brass door-opening hit. The question just opened.
      No voice, then silence.

  round_lock:
    kind: oneshot
    max_seconds: 1.6
    prompt: >
      Isolated 1.2 second curtain-drop stinger: muted brass fall
      and a wooden lock click. The question just closed. No voice,
      then silence.

  question_change:
    kind: oneshot
    max_seconds: 1.4
    prompt: >
      Isolated 1.1 second page-turn whoosh with a soft harp gliss.
      Next question arrives. Warm gold, no voice, then silence.

  celestial_breath:
    kind: oneshot
    max_seconds: 1.6
    prompt: >
      Isolated 0.8 second new-question arrival. A very soft parchment turn and
      warm air inhale resolving into one delicate brushed-gold bell tone.
      Curious, sacred and intimate without sounding magical or sleepy.
      No choir, no voice, no continuing tail, then complete silence.

  duel_send:
    kind: oneshot
    max_seconds: 1.3
    prompt: >
      Isolated 0.9 second friendly challenge-send cue: a close warm-air
      whoosh into one light brushed-metal tap and a tiny golden chime.
      Premium mobile family game, kind and inviting, no combat, no voice,
      no choir, no stadium, then complete silence.

  stake_gain:
    kind: oneshot
    max_seconds: 1.2
    prompt: >
      Isolated 0.8 second ascending community-score cue: two close,
      warm marimba-like gold notes ending in a delicate bright chime.
      Intimate phone speaker mix, no fanfare, no voice, then silence.

  reveal:
    kind: oneshot
    max_seconds: 2.2
    prompt: >
      Isolated 1.8 second results-reveal stinger: three rising harp
      notes and a small brass hit. Gentle quiz reveal for a family
      night, no stadium roar, no voice, then silence.

  study_light:
    kind: oneshot
    max_seconds: 1.1
    prompt: >
      Isolated 0.9 second scripture-study discovery cue. One warm breath
      of air, a muted wooden resonance, and a single soft luminous tone.
      Contemplative and intimate, not a quiz success jingle, no harp run,
      no fanfare, no voice, then complete silence.

  study_miss:
    kind: oneshot
    max_seconds: 0.45
    prompt: >
      Isolated 0.3 second gentle scripture-study miss cue. One soft low
      wooden touch with a warm felt tail. Kind and neutral, not a buzzer,
      not comic, no melody, no voice, then complete silence.

  study_turn:
    kind: oneshot
    max_seconds: 0.8
    prompt: >
      Isolated 0.65 second delicate parchment page turn with a faint warm
      air tail. Quiet transition to the next scripture question, no harp,
      no chime melody, no voice, then complete silence.
