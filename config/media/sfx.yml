style: >
  Family-friendly LDS game-night sound design. Warm gold chapel quiz,
  not a horror film, not a sports stadium. Instrumental only: no vocals,
  no lyrics, no spoken words, no choir hymn, no church organ. No screams,
  no gunshots, no sirens. Dry and close-mic'd so it plays on a phone speaker.

cues:
  round_start:
    kind: oneshot
    max_seconds: 2.2
    prompt: >
      Isolated 1.6 second special-question entrance, then complete silence.
      A fast parchment flick, two ascending close-mic'd harp plucks and one
      restrained warm brass bloom. Adventurous and important, never bombastic.
      Same sonic family as correct_gold. No continuing melody, no voice.

  buzzer_hit:
    kind: oneshot
    max_seconds: 0.6
    prompt: >
      Isolated 0.4 second game-show slam: palm hitting a wooden desk
      plus a short warm brass stab. Punchy, close, no reverb tail.
      No voice, no music bed, then complete silence.

  correct_gold:
    kind: oneshot
    max_seconds: 0.70
    prompt: >
      One single tiny muted celesta "ting" for a correct answer. Neutral,
      restrained and almost insignificant, just enough to confirm the action
      without interrupting the timer_tension atmosphere. Soft rounded attack,
      short natural decay, no second note, interval, chord, shimmer, flourish,
      celebration or jingle. No drum, coins, jackpot, arcade, brass, voice or
      choir, then silence.

  wrong_soft:
    kind: oneshot
    max_seconds: 1.50
    prompt: >
      Gentle wrong-answer cue: a 0.30 second gesture followed by a warm natural
      decay of about one second. One soft felted-wood tone
      bending slightly downward, a warm quiet "tum" that means not this one,
      never failure. Close, tactile and restrained. No second note, buzzer,
      comedy, ominous bass, voice or choir, then complete silence.

  score_transfer:
    kind: oneshot
    max_seconds: 1.20
    prompt: >
      Score-to-crown movement: a 0.20 second gesture with a soft airy tail
      decaying naturally for roughly 0.8 seconds. A very short warm-air
      upward sweep carrying one faint brushed-gold particle. Luminous and
      tactile, never magical, windy or cinematic. No impact, melody, coins,
      voice or choir, then complete silence.

  crown_chime:
    kind: oneshot
    max_seconds: 2.00
    prompt: >
      Score-complete resolution: a 0.26 second strike followed by a full warm
      1.4 second resonant decay. One warm brushed-glass
      celesta tone, the upper destination note of correct_gold's rising perfect
      fourth. Calm, final and golden on a phone speaker. No chord, coins,
      jackpot, flourish, voice or choir, then complete silence.

  royal_fanfare:
    kind: oneshot
    max_seconds: 4.00
    prompt: >
      Pack-complete ceremony that must remain clearly audible for about three
      seconds: a 1.35 second musical gesture followed by a sustained, rich and
      smoothly fading two-second harmonic resonance. Do not end early or cut
      after the initial notes. Begin with the same two-note
      rising perfect-fourth celesta motif as correct_gold, expand into one warm
      airy harmonic chord, then a single intimate gold bell and a tactile small
      wooden chest opening. Celestial, noble and close, not a brass fanfare,
      stadium, trailer, casino or jackpot. No coins, voice or choir, then
      complete silence.

  level_up:
    kind: oneshot
    max_seconds: 1.8
    prompt: >
      Isolated 1.4 second rank-up sparkle: rising bells and harp.
      Playful, kid-safe. No voice, then silence.

  chest:
    kind: oneshot
    max_seconds: 1.2
    prompt: >
      Isolated 0.85 second legendary-streak reward. A close wooden chest latch,
      a compact lid thump and a short shower of three brushed-gold sparkles.
      Tactile treasure, premium mobile scale, no coins, no orchestra, no voice,
      then complete silence.

  dramatic_fire:
    kind: oneshot
    max_seconds: 1.8
    prompt: >
      Isolated 1.2 second freeze-dance hit: low drum and a brief
      fire whoosh, theatrical not scary. No voice, then silence.

  fire_whoosh:
    kind: oneshot
    max_seconds: 1.30
    prompt: >
      Subtle streak-rise layer: a 0.24 second gesture followed by a gentle airy
      decay, never an abrupt stop. One tiny close warm-air
      flame breath rising into a pinhead high brushed-glass chime. Designed to
      overlay correct_gold without masking it. No drum, explosion, crackling
      fire, melody, voice or choir, then complete silence.

  flame_gold:
    kind: oneshot
    max_seconds: 2.50
    prompt: >
      Three-answer streak milestone: a 0.44 second gesture followed by a full
      warm two-second shimmer decay. A compact warm-air
      flame bloom followed by three delicate ascending brushed-glass celesta
      notes, built from the same rising-perfect-fourth Noche Live motif as
      correct_gold. Energetic and golden but intimate. No drum, explosion,
      crackling, casino, arcade, voice or choir, then complete silence.

  timer_tension:
    kind: loop
    max_seconds: 30
    prompt: >
      Instrumental only, no vocals, no lyrics. 30 second seamless background
      loop for a timed solo Bible adventure. Sparse muted pizzicato, a soft
      hand-drum heartbeat and occasional low wooden pulse, gold-warm modal
      harmony with restrained forward motion. Keep the spectrum clear for UI
      hits and phone speakers. No melody, horror, clocks or final cadence.
      End on exactly the opening harmony and texture so it loops invisibly.

  tick:
    kind: oneshot
    max_seconds: 0.18
    prompt: >
      Isolated one-shot, 0.12 seconds then complete silence.
      Soft wooden clock tick, dry, no reverb, no music, no voice.
      A single hit suitable to repeat every second.

  tick_low:
    kind: oneshot
    max_seconds: 0.22
    prompt: >
      Isolated one-shot, 0.16 seconds then complete silence.
      Sharper wooden clock tick, slightly higher and closer, still
      dry, no music, no voice. For the last five seconds of a timer.

  round_open:
    kind: oneshot
    max_seconds: 2.0
    prompt: >
      Isolated 1.5 second curtain-rise stinger: harp gliss and a
      small brass door-opening hit. The question just opened.
      No voice, then silence.

  round_lock:
    kind: oneshot
    max_seconds: 1.6
    prompt: >
      Isolated 1.2 second curtain-drop stinger: muted brass fall
      and a wooden lock click. The question just closed. No voice,
      then silence.

  question_change:
    kind: oneshot
    max_seconds: 1.20
    prompt: >
      Next-question transition: a 0.20 second gesture followed by a quiet,
      smooth 0.8 second breath decay. One quiet parchment flick
      wrapped in a short warm-air exhale. A clean breath between reward and
      concentration. No harp, chime, melody, voice or tail, then silence.

  celestial_breath:
    kind: oneshot
    max_seconds: 1.50
    prompt: >
      New-question arrival: a 0.34 second gesture followed by a subtle smooth
      one-second shimmer decay. A very soft warm-air inhale
      with a nearly imperceptible high brushed-glass shimmer. Curious, celestial
      and intimate, immediately yielding to silence for reading. No parchment,
      melody, bell strike, magic sparkle, voice or choir, then silence.

  duel_send:
    kind: oneshot
    max_seconds: 1.3
    prompt: >
      Isolated 0.9 second friendly challenge-send cue: a close warm-air
      whoosh into one light brushed-metal tap and a tiny golden chime.
      Premium mobile family game, kind and inviting, no combat, no voice,
      no choir, no stadium, then complete silence.

  stake_gain:
    kind: oneshot
    max_seconds: 1.2
    prompt: >
      Isolated 0.8 second ascending community-score cue: two close,
      warm marimba-like gold notes ending in a delicate bright chime.
      Intimate phone speaker mix, no fanfare, no voice, then silence.

  reveal:
    kind: oneshot
    max_seconds: 2.2
    prompt: >
      Isolated 1.8 second results-reveal stinger: three rising harp
      notes and a small brass hit. Gentle quiz reveal for a family
      night, no stadium roar, no voice, then silence.

  study_refuge:
    kind: loop
    master: focus_music
    max_seconds: 30
    prompt: >
      Instrumental only, no vocals, no lyrics. Original 30 second seamless
      ambient reading music built from warm sustained synthesizer pads and
      real, slowly evolving harmony. Long legato suspended-major and add-nine
      chords, one harmonic change at most every 12 to 16 seconds, with a soft
      airy upper pad and a quiet continuous tonal center. Introspective,
      spacious and mentally absorbing while remaining safe, warm and awake.
      This must feel like long-form binaural reading music, not sound design,
      white noise, a meditation bowl or a game soundtrack. No recognizable
      melody, hook, arpeggio, ostinato, tempo, rhythmic grid, percussion,
      heartbeat, kick, bass attack, low-frequency impact or repeating "boom".
      No piano strikes, bells, chimes, wood, glass, choir, church organ, nature
      sounds, suspense, sadness or dramatic swell. Every note enters and leaves
      through very long fades; the harmony breathes without pulsing. Keep ample
      spectral space for inner speech and reading. The binaural 10 Hz detail is
      added separately in mastering. The first and final four seconds must
      share the same pad and harmony for an invisible loop.

  study_light:
    kind: oneshot
    max_seconds: 1.1
    prompt: >
      Isolated 0.9 second scripture-study discovery cue. One warm breath
      of air, a muted wooden resonance, and a single soft luminous tone.
      Contemplative and intimate, not a quiz success jingle, no harp run,
      no fanfare, no voice, then complete silence.

  study_miss:
    kind: oneshot
    max_seconds: 0.45
    prompt: >
      Isolated 0.3 second gentle scripture-study miss cue. One soft low
      wooden touch with a warm felt tail. Kind and neutral, not a buzzer,
      not comic, no melody, no voice, then complete silence.

  study_turn:
    kind: oneshot
    max_seconds: 0.8
    prompt: >
      Isolated 0.65 second delicate parchment page turn with a faint warm
      air tail. Quiet transition to the next scripture question, no harp,
      no chime melody, no voice, then complete silence.
