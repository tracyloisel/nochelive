# One biblical still per round. Shown on presenter + watch instead of chapel B-roll.
# No readable text in the picture. Family-safe. No crucifix. No temple interiors.

style: >
  Warm painterly gouache illustration for a family Bible game night.
  Cream paper tones, gold light, soft ink shadows. Vertical portrait
  composition. Modest ancient Near Eastern clothing. Stylized, not photoreal.

negative: >
  text, letters, numbers, captions, logos, watermarks, UI, screenshot,
  crucifix, Christian cross, temple interior, blood, gore, violence in progress,
  photoreal close-up of a child, extra fingers

rounds:
  salomon_wisdom: >
    Young King Solomon kneeling at night in a simple stone courtyard,
    empty humble hands raised toward a column of gold heavenly light.
    No treasure piles. Prayer for wisdom.
  rey_o_profeta: >
    Prophet Elijah as a wilderness prophet with a hairy mantle, leather belt
    and wooden staff on a rocky Carmel ridge. No crown. Not a king.
  david_goliath: >
    Small shepherd David with a leather sling and one stone, facing huge
    Goliath as a towering silhouette. Tense standoff before any blow. No blood.
  elias_carmel: >
    Mount Carmel stone altar, gold-white fire from heaven consuming the offering,
    Elijah with arms raised. No people harmed.
  daniel_lions: >
    Daniel kneeling in calm prayer in a stone den, lions lying peacefully
    around him. Moonlight. Peace, not attack.
  freeze_saul: >
    King David dancing with joy before a simple wooden ark with poles,
    modest tunic, a small harp nearby. Celebration, freeze-frame energy.
  mime_jonah: >
    Jonah inside a vast gentle great-fish belly like a cavern of ribs,
    amber gold light. Wondrous, not horror.
  kings_order: >
    Three kings in a left-to-right line: Saul with a simple circlet,
    David with a harp and shepherd pouch, Solomon with a calm gold glow
    and a blank unreadable scroll.
  taboo_nabot: >
    A sunlit vineyard on a hillside, a humble Israelite tending vines,
    a king watching greedily from a distant terrace. Naboth's vineyard.
  statue_david: >
    Young David planted like a living statue, feet wide, sling drawn,
    facing a distant giant silhouette. Stillness and courage. No blood.
  scavenger_harp: >
    Young David seated playing a wooden lyre, gold sound-like light in the air.
    King Saul nearby, his troubled face softening as the music calms him.
  category_prophets: >
    A gathering of Israelite prophets of different ages in rough mantles,
    blank unreadable scrolls, warm firelight. Not kings.
  vote_solomon: >
    King Solomon on a simple throne between two mothers, one holding a
    swaddled infant. Solomon raises an open calming hand. No sword, no violence.
  semifinal_crown: >
    Prophet Samuel pouring oil from a ram's horn onto young shepherd David
    among sheep. Secret anointing in a field. No jeweled crown.
  finale_prophet: >
    Elijah and Elisha, a chariot of fire rising into a gold sky,
    Elijah's mantle falling toward Elisha who reaches upward.
  burger_pan: >
    Elijah and Elisha walking a dusty road together, hairy mantle, gold
    late light, dust motes. No chariot yet.
  burger_jordan: >
    The two at the Jordan, water wall splitting, dry path, gold sun.
    Elijah and Elisha walk a dry path between two standing walls of
    river water. Not Jonah, no fish.
  burger_chariot: >
    Chariot of fire and horses of fire lifting Elijah, mantle falling
    toward Elisha. No people harmed.
  burger_salsa: >
    Elisha alone on the bank, mantle in both hands, looking up at an
    empty gold sky. The ask, not the answer. No readable question.
  burger_lettuce: >
    One gouache lettuce leaf, a small object centered on cream paper.
    No text.
  burger_nugget: >
    One gouache gold-brown nugget, a small object centered on cream paper.
    No text.
  burger_fry: >
    One gouache french fry, a small object centered on cream paper.
    No text.
