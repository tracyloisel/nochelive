version: 2
source_root: media/masters
catalog:
  include: media/**/*
  icon_max: 512
  landscape_ratio: 1.2
  portrait_ratio: 1.2
roles:
  hub_backdrop:
    default_rendition: portrait
    renditions:
      portrait:
        widths: [390, 768, 941]
        sizes: "100vw"
        ratio: "9:16"
        media: "(max-width: 767px)"
        focus: "50% 22%"
      landscape:
        widths: [768, 1440, 1672]
        sizes: "100vw"
        ratio: "16:9"
        media: "(min-width: 768px)"
        focus: "50% 22%"
    quality:
      avif: 50
      webp: 76
      jpeg: 80
  # The mockup hero uses two separately composed masters. Keeping this role
  # distinct from hub_backdrop prevents a mobile crop from manufacturing the
  # explorer composition and avoids upscaling every historical backdrop.
  hub_hero:
    default_rendition: portrait
    renditions:
      portrait:
        widths: [390, 768, 1280, 1536]
        sizes: "100vw"
        ratio: "9:16"
        media: "(max-width: 767px)"
        focus: "50% 50%"
      landscape:
        widths: [768, 1440, 1920, 2560]
        sizes: "100vw"
        ratio: "16:9"
        media: "(min-width: 768px)"
        focus: "50% 50%"
    quality:
      avif: 52
      webp: 78
      jpeg: 82
  # Daily Library covers use three separately approved compositions. Exact-ratio
  # masters keep the person, action and copy-safe field intact; the pipeline must
  # never manufacture tablet or landscape storytelling from the phone crop.
  library_daily_hero:
    default_rendition: portrait
    source_ratio_tolerance: 0.005
    renditions:
      portrait:
        widths: [390, 768, 1170, 1440]
        sizes: "100vw"
        ratio: "9:16"
        media: "(max-width: 599px) and (orientation: portrait)"
      tablet:
        widths: [768, 1024, 1536, 1600]
        sizes: "100vw"
        ratio: "4:5"
        media: "(min-width: 600px) and (orientation: portrait)"
      landscape:
        widths: [768, 1024, 1440, 1920, 2560]
        sizes: "100vw"
        ratio: "16:9"
        media: "(orientation: landscape)"
    quality:
      avif: 54
      webp: 80
      jpeg: 84
  # Hub editorial plates retain their approved master ratio. Their layout can
  # crop locally without baking a second, unstable media identity into content.
  hub_card:
    widths: [390, 768, 1280, 1600]
    sizes: "(max-width: 767px) 82vw, (max-width: 1199px) 50vw, 33vw"
    quality:
      avif: 50
      webp: 76
      jpeg: 80
  catalog_portrait:
    widths: [390, 768]
    sizes: "(max-width: 768px) 100vw, 768px"
    quality:
      avif: 48
      webp: 74
      jpeg: 78
  catalog_landscape:
    widths: [390, 768, 1440]
    sizes: "(max-width: 768px) 100vw, 70vw"
    quality:
      avif: 48
      webp: 74
      jpeg: 78
  catalog_square:
    widths: [256, 512, 768]
    sizes: "(max-width: 768px) 100vw, 50vw"
    quality:
      avif: 48
      webp: 74
      jpeg: 78
  catalog_icon:
    widths: [64, 128, 256, 512]
    sizes: "128px"
    quality:
      avif: 55
      webp: 80
      jpeg: 82
