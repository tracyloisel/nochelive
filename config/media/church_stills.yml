stills:
  meet:
    aspect: "16:9"
    shot: >
      Two young Latter-day Saint missionaries (elders in dark suits, no readable
      name tags) standing on a sunlit ivory-marble porch with gold-leaf Corinthian
      capitals, gently waiting at a tall cream paneled door. Warm oculus god-ray,
      marble planters with gold-yellow flowers, polished floor reflections.
      Invitation, not a sales pitch. Empty of UI. Painterly.

  beliefs:
    aspect: "16:9"
    shot: >
      Two open sacred books side by side on an ivory marble lectern with thin
      gold-leaf trim, in a deep celestial marble hall. Circular oculus above,
      cream god-ray falling on blank creamy pages (no readable letters or
      glyphs). Fluted columns receding, eight-pointed star quietly etched in
      the stone behind the lectern. Painterly still life, sacred, empty of people.

  missionaries:
    aspect: "16:9"
    shot: >
      Two young missionaries walking away down a cream limestone street at
      golden hour, toward a white meetinghouse with a simple steeple in the
      distance. Pioneer-city Salt Lake atmosphere, long warm shadows, ivory
      and gold light. No readable signs, no logos, no name-tag text. Painterly.

  worship:
    aspect: "16:9"
    shot: >
      Latter-day Saint meetinghouse chapel interior on Sunday seen from a side
      aisle looking toward tall rectangular windows of golden-hour light. Long
      padded pews, beige carpet, a piano, luminous ivory walls with gold trim
      on woodwork. Families sit modestly in the middle distance. NO pulpit, NO
      lectern, NO cross, NO crucifix, NO EXIT sign, NO letters, NO logos, NO
      symbols carved in wood. Optional soft oculus glow from above. Painterly,
      not a photograph.

  christ:
    aspect: "16:9"
    shot: >
      Painterly classical view down a deep celestial marble hall: one-point
      perspective, fluted ivory columns with gold-leaf Corinthian capitals,
      circular oculus with strong cream god-rays on a polished floor. At the
      far end, a distant figure of the resurrected Jesus Christ in simple white
      robes walking toward the light — small in frame, face softly suggested
      by light not a photoreal portrait, not a statue on a plinth, not a
      crucifix. Sacred hush, empty aisle, no other people.

  father:
    aspect: "16:9"
    shot: >
      A parent and a child seen from behind (no faces, no photoreal child
      close-up) standing together in a sunlit marble colonnade, looking up
      toward a circular oculus. Warm cream god-ray, gold-leaf capitals, polished
      floor. Tender, quiet, painterly. No text.

  plan:
    aspect: "16:9"
    shot: >
      A multi-generational family walking together down a bright celestial
      marble aisle toward a glowing arched portal of gold-white light. Columns
      recede in one-point perspective, oculus god-rays, polished reflections.
      Hopeful, sacred, painterly. Faces in middle distance, not close-up.
      No furniture, no UI.

  word:
    aspect: "16:9"
    shot: >
      Close painterly still life: a marble table in oculus light, two thick
      cream-bound books open at an angle to each other, a thin gold-leaf
      bookmark ribbon, blank pages with no readable letters. A tall arched
      window of warm daylight behind. Ivory stone, gold metal only. No people.

  restored:
    aspect: "16:9"
    shot: >
      Painterly golden-hour view of the Salt Lake Temple exterior in Salt Lake
      City: granite walls, six spires, a tiny gold angel silhouette high on the
      center spire, formal gardens and a quiet reflecting pool in the foreground.
      Cream-gold sky, sacred grandeur, classical painting — not a tourist photo,
      no crowds close to camera, no flags with readable type, no text, no logos.
