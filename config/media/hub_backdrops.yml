# Curated artwork composed specifically for the Hub. These wide environmental
# scenes leave a quiet central field for Home chrome; quiz stills stay in their
# own catalog and must not be reused here. The Hub resolves the scene from the
# active question's artwork manifest, so its Light/Dark atmosphere never changes
# into an unrelated wallpaper on refresh. Other callers may still use the
# deterministic weekly fallback.
