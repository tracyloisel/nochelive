# Generation prompts for the new parable collection. The runtime reads only `stills`.
packs:
  perdido_encontrado:
    ovejas_cien: "Wide Judean hills at sunrise, one tiny sheep separated from a distant flock of ninety-nine, compassionate shepherd noticing it."
    hasta_encontrarla: "A shepherd searching rugged hills at blue hour with an oil lamp, following one set of hoofprints, determined and tender."
    hombros_gozoso: "Joyful shepherd carrying a rescued sheep across his shoulders, warm dawn breaking through clouds, friends visible far below."
    monedas_diez: "Ancient modest home at night, woman counting nine silver coins beside one empty place, single oil lamp, intimate suspense."
    lampara_escoba: "Woman sweeping an ancient stone floor by lamplight, one lost silver coin catching a tiny gold glint beneath a woven mat."
    gozo_angeles: "Symbolic luminous sky opening above a humble home, countless warm lights celebrating one returning traveler, reverent not literal angels."
    parte_herencia: "Younger son receiving a small pouch from a sorrowful father in a sunlit courtyard, road to a far country behind him."
    pais_lejano: "Lonely young traveler beside a pig enclosure during famine at stormy dusk, empty pouch, distant memory of a warm home."
    padre_corrio: "Elderly father running down a golden road to embrace his returning son, robes moving, overwhelming compassion, home glowing behind."
    muerto_revive: "Family feast in an open courtyard, father and restored son embraced at the center, lanterns and joyful neighbors, older brother at threshold."
  secretos_reino:
    semilla_camino: "Sower crossing a bright Galilean field, seeds falling onto a hard path as birds descend, sweeping cinematic landscape."
    pedregales_raiz: "Tender green shoot rising among sunlit stones then wilting under fierce heat, shallow roots visibly gripping thin soil."
    buena_tierra: "Abundant golden wheat rising from rich dark soil, sower in wonder, layered harvest fields glowing under celestial rays."
    espinos_ahogan: "Young grain being overtaken by dark twisting thorns, distant glittering coins and crowded city blurred like temptations."
    mostaza_crece: "Tiny mustard seed in a weathered hand matched with a flourishing mustard tree full of birds, dawn sky, visual transformation."
    levadura_masa: "Woman kneading a large bowl of rising dough in a warm open-air kitchen, subtle golden expansion through the whole mass."
    tesoro_campo: "Farmer kneeling in a twilight field as a buried clay chest opens with restrained golden light, astonishment and joy."
    mercader_perlas: "Ancient pearl merchant in a sunlit market holding one luminous pearl, all other wares falling softly out of focus."
    vendio_todo: "Merchant joyfully exchanging his final possessions across a market table while the single great pearl waits in warm light."
    valor_reino: "Symbolic split scene joining hidden treasure beneath a field and one radiant pearl, both leading toward a golden horizon."
  amar_projimo:
    camino_jerico: "Steep road from Jerusalem to Jericho at ominous dusk, wounded traveler lying safely without blood, robbers disappearing far away."
    pasaron_largo: "Wounded traveler at roadside while two respected religious men pass at a distance, long shadows, painful silence."
    samaritano_compasion: "Samaritan kneeling beside wounded traveler with open compassionate posture, first sunlight entering the dark ravine."
    aceite_vino: "Close respectful scene of hands bandaging a traveler's arm with cloth, small oil and wine vessels glowing in warm light."
    mostro_misericordia: "Samaritan supporting recovered traveler into a welcoming roadside inn courtyard, innkeeper opening the gate, dawn of hope."
    deuda_diez_mil: "Overwhelmed servant before a royal account table stacked with impossible ledgers and coin jars, deep blue hall and gold light."
    rey_perdono: "Merciful king lifting a kneeling servant and sweeping away an enormous debt ledger, luminous open doorway, release and wonder."
    cien_denarios: "Recently forgiven servant gripping a poorer man's cloak in a narrow shadowed street, tense but family-safe, coins scattered."
    corazon_perdona: "Two estranged men choosing to embrace in a quiet courtyard, broken debt tablet set aside, soft sunrise and olive leaves."
    dos_deudores: "Two debt tablets marked by very different stacks of coins dissolve into light as both forgiven people step forward gratefully."
  velar_servir:
    talentos_repartidos: "Ancient master entrusting three servants with five, two and one pouch of coins in a bright courtyard, responsibility and trust."
    cinco_gano: "Faithful servant returning with doubled coin pouches and honest work goods, master welcoming him with proud joy."
    uno_escondio: "Fearful servant burying one wrapped coin pouch beneath moonlit soil, long shadow, empty field and sealed opportunity."
    buen_siervo: "Master placing a warm hand on a faithful servant's shoulder before an open celebratory courtyard, gold light and belonging."
    cinco_prudentes: "Ten young women waiting with small oil lamps under a starry sky, five lamps steady and five beginning to dim."
    aceite_reserva: "Five wise women calmly refilling glowing lamps from small oil vessels, deep celestial night and quiet readiness."
    medianoche_clamor: "Midnight cry across an ancient village road, bridegroom procession appearing with lanterns, waiting women rising in surprise."
    puerta_cerro: "Wedding courtyard doors closing as warm celebration glows within, unprepared lamps dark outside, solemn distance and no cruelty."
    alimento_tiempo: "Faithful household steward distributing bread fairly to a multigenerational family in a bright open courtyard."
    hallado_haciendo: "Returning master discovers steward actively caring for household at sunrise, surprise turning to celebration and trust."
  sobre_roca:
    oye_hace: "Traveler listening to a teacher on a hillside then setting a foundation stone with both hands, word becoming action."
    fundamento_roca: "Ancient family home being built directly into a massive sunlit rock ledge, workers securing the strong foundation."
    casa_resistio: "House on rock standing firm through cinematic rain and rushing water, warm lamp still shining inside, powerful dark storm."
    arena_ruina: "Empty house foundation collapsing into rain-soaked sand beside a torrent, no people harmed, dramatic lesson in the storm."
    cosecha_abundante: "Rich landowner surveying an overwhelming golden harvest filling every basket, bright abundance with a subtle uneasy shadow."
    graneros_mayores: "Wealthy man planning enormous new barns while workers dismantle smaller ones, sunset light, abundance turning inward."
    esta_noche: "Rich man alone before towering full barns beneath a vast starry night, feast untouched, sudden solemn beam of light."
    fariseo_oraba: "Proud worshiper standing prominently in an ancient temple courtyard while a humble figure remains far behind, measured daylight."
    publicano_pecho: "Humble tax collector alone at the edge of a temple courtyard, hand to chest, downcast eyes, one compassionate shaft of light."
    descendio_justificado: "Humble man walking home down sunlit temple steps with peaceful face while morning light opens across the city."
  simbolos_mormon:
    olivo_cultivado: "Ancient cultivated olive tree beginning to wither in a vast vineyard, caring master approaching at dawn with pruning tools."
    podar_cavar_nutrir: "Lord of the vineyard and servant carefully pruning, digging and nourishing an old olive tree, new tender shoots glowing."
    ramas_silvestres: "Wild olive branches being skillfully grafted into a cultivated trunk, hands at work, vineyard stretching toward many lands."
    me_aflige_perder: "Lord of the vineyard resting a sorrowful hand on a struggling olive trunk at night, many years of labor visible around him."
    semilla_corazon: "Small seed held over the heart of a humble listener on a sunlit hill, symbolic warm light beginning within the chest."
