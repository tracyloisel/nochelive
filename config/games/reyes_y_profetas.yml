theme:
  id: kings_and_prophets
  title: "Reyes y Profetas"
  tagline: "Una noche de coronas, fuego y piedras"

rounds:
  - id: salomon_wisdom
    type: buzzer
    title: "La elección de Salomón"
    icon: crown
    difficulty: 1
    intensity: 2
    question: >
      Dios permitió a Salomón pedir lo que quisiera.
      ¿Qué pidió?
    choices:
      - key: riches
        label: "Riquezas"
      - key: wisdom
        label: "Sabiduría"
      - key: army
        label: "Un ejército"
    correct_choice: "wisdom"
    answer: >
      Sabiduría para gobernar al pueblo.
    reference: "1 Reyes 3:5-12"
    points: 10
    duration: 30
    remote: true
    reward:
      xp: 20
      streak: true
    presentation:
      image: stories/salomon_wisdom.jpg
      intro_vfx: glow
    sfx:
      intro: round_start
      buzz: buzzer_hit
      correct: correct_gold

  - id: rey_o_profeta
    type: true_false
    title: "¿Rey o profeta?"
    icon: scroll
    difficulty: 1
    intensity: 2
    question: "Elías fue un rey de Israel."
    choices:
      - key: "true"
        label: "Verdadero"
      - key: "false"
        label: "Falso"
    correct_choice: "false"
    answer: "Falso. Elías fue profeta."
    reference: "1 Reyes 17"
    points: 10
    duration: 20
    remote: true
    reward:
      xp: 14
    presentation:
      image: stories/rey_o_profeta.jpg

  - id: david_goliath
    type: physical_target
    title: "David contra Goliat"
    icon: sling
    difficulty: 2
    intensity: 4
    question: "¿Con qué derrotó David a Goliat?"
    answer: "Con una honda y una piedra."
    reference: "1 Samuel 17:40-50"
    instructions: >
      En la sala: tres pelotas. Derriba la torre de Goliat.
    points_max: 10
    duration: 60
    remote: false
    remote_variant:
      type: rapid_tap
      taps: 10
      instructions: >
        Mantén el ritmo y lanza la piedra.
    reward:
      xp: 18
    presentation:
      image: stories/david_goliath.jpg
      correct_vfx: stone_hit
    sfx:
      intro: dramatic_fire
      correct: fire_whoosh

  - id: elias_carmel
    type: multiple_choice
    title: "Fuego del cielo"
    icon: fire
    difficulty: 2
    intensity: 3
    question: "¿Qué bajó sobre el altar de Elías en el Carmelo?"
    choices:
      - key: rain
        label: "Lluvia"
      - key: fire
        label: "Fuego"
      - key: wind
        label: "Viento"
      - key: oil
        label: "Aceite"
    correct_choice: "fire"
    answer: "Fuego de Jehová."
    reference: "1 Reyes 18:38"
    points: 12
    duration: 25
    remote: true
    reward:
      xp: 18
    presentation:
      image: stories/elias_carmel.jpg
      correct_vfx: fire_burst

  - id: daniel_lions
    type: buzzer
    title: "Daniel y los leones"
    icon: lion
    difficulty: 2
    intensity: 3
    question: "¿Por qué echaron a Daniel al foso de los leones?"
    choices:
      - key: stole
        label: "Porque robó al rey"
      - key: prayed
        label: "Porque oraba a su Dios"
      - key: slept
        label: "Porque se durmió"
    correct_choice: "prayed"
    answer: "Porque oraba a su Dios."
    reference: "Daniel 6"
    points: 12
    duration: 30
    remote: true
    reward:
      xp: 18
    presentation:
      image: stories/daniel_lions.jpg

  - id: freeze_saul
    type: freeze_dance
    title: "La danza de David"
    icon: harp
    difficulty: 1
    intensity: 3
    instructions: "Bailad. Cuando el presentador pare, ¡congelados!"
    answer: "David danzó delante del Señor."
    reference: "2 Samuel 6:14"
    points: 10
    duration: 45
    remote: false
    remote_variant:
      type: freeze_catch
      window_ms: 2000
      instructions: "Cuando veas CONGELADOS, pulsa. No antes."
    reward:
      xp: 16
    sfx:
      lock: dramatic_fire
    presentation:
      image: stories/freeze_saul.jpg

  - id: mime_jonah
    type: mime
    title: "Jonás sin palabras"
    icon: wave
    difficulty: 1
    intensity: 3
    instructions: "Un jugador representa a Jonás. El equipo adivina."
    answer: "Jonás y el gran pez."
    reference: "Jonás 1-2"
    points: 10
    duration: 60
    remote: false
    remote_variant:
      type: story_path
      instructions: "Tú eres Jonás. Vive los tres momentos."
      beats:
        - key: storm
          shout: "¡LA TORMENTA!"
          picto: wave
        - key: fish
          shout: "¡EL PEZ!"
          picto: fish
        - key: shore
          shout: "¡TIERRA!"
          picto: land
    presentation:
      image: stories/mime_jonah.jpg

  - id: kings_order
    type: ordering
    title: "El orden de los reyes"
    icon: crown
    difficulty: 3
    intensity: 3
    question: "¿Quién reinó primero?"
    instructions: "Tocad los reyes en el orden del tiempo."
    items:
      - key: saul
        label: Saúl
      - key: david
        label: David
      - key: salomon
        label: Salomón
    order:
      - saul
      - david
      - salomon
    answer: "Saúl, luego David, luego Salomón."
    reference: "1 Samuel–1 Reyes"
    points: 14
    duration: 40
    remote: true
    reward:
      xp: 20
    presentation:
      image: stories/kings_order.jpg

  - id: taboo_nabot
    type: taboo
    title: "Palabras prohibidas"
    icon: scroll
    difficulty: 2
    intensity: 3
    instructions: "Un jugador cuenta la historia. No puede decir las palabras rojas. Los demás adivinan."
    target: "La viña de Nabot"
    forbidden:
      - viña
      - Acab
      - Jezabel
    guess_keys:
      - nabot
      - naboth
    answer: "Acab quiso la viña de Nabot."
    reference: "1 Reyes 21"
    points: 12
    duration: 45
    remote: true
    remote_variant:
      type: text_guess
      instructions: "En casa: escuchad la llamada y escribid la historia."
    reward:
      xp: 18
    presentation:
      image: stories/taboo_nabot.jpg

  - id: statue_david
    type: pose
    title: "Estatua de David"
    icon: sling
    difficulty: 1
    intensity: 4
    instructions: "Dejad el teléfono. 30 segundos. Haced la estatua de David frente a Goliat."
    answer: "David no corrió: se plantó."
    reference: "1 Samuel 17"
    points: 10
    duration: 30
    remote: false
    remote_variant:
      type: pose
      instructions: "En casa: 30 segundos. La misma estatua frente a la cámara."
    presentation:
      image: stories/statue_david.jpg

  - id: scavenger_harp
    type: scavenger_hunt
    title: "El arpa de David"
    icon: harp
    difficulty: 1
    intensity: 3
    instructions: "Levantáos. Encontrad un arpa, o cualquier cosa que suene."
    answer: "David calmaba a Saúl con el arpa."
    reference: "1 Samuel 16:23"
    points: 10
    duration: 50
    remote: true
    remote_variant:
      type: scavenger_hunt
      instructions: "En casa: un objeto que suene. Caja, llaves, olla, voz."
    reward:
      xp: 16
    presentation:
      image: stories/scavenger_harp.jpg

  - id: category_prophets
    type: category_race
    title: "Nombres de profetas"
    icon: fire
    difficulty: 2
    intensity: 3
    instructions: "Gritad profetas. Tres bastan."
    guess_keys:
      - Isaías
      - Jeremías
      - Elías
      - Eliseo
      - Daniel
      - Jonás
      - Samuel
      - Moisés
      - Natán
      - Miqueas
    goal: 3
    answer: "Isaías, Jeremías, Elías, Eliseo, Daniel…"
    points: 12
    duration: 30
    remote: false
    remote_variant:
      type: category_type
      instructions: "Escribid tres profetas. Separadlos con comas."
    reward:
      xp: 16
    presentation:
      image: stories/category_prophets.jpg

  - id: vote_solomon
    type: team_vote
    title: "El juicio de Salomón"
    icon: crown
    difficulty: 2
    intensity: 4
    question: "¿Quién ha mostrado más sabiduría esta noche?"
    instructions: "No podéis votaros a vosotros."
    answer: "Sabiduría para ver el amor verdadero."
    reference: "1 Reyes 3:16-28"
    points: 14
    duration: 40
    remote: true
    reward:
      xp: 20
    presentation:
      image: stories/vote_solomon.jpg

  - id: semifinal_crown
    type: buzzer
    title: "La corona tiembla"
    icon: crown
    difficulty: 3
    intensity: 4
    question: "¿Quién ungió a David en secreto, siendo aún joven?"
    choices:
      - key: saul
        label: "Saúl"
      - key: samuel
        label: "Samuel"
      - key: nathan
        label: "Natán"
    correct_choice: "samuel"
    answer: "Samuel."
    reference: "1 Samuel 16:13"
    points: 18
    duration: 30
    remote: true
    reward:
      xp: 24
    presentation:
      image: stories/semifinal_crown.jpg

  - id: finale_prophet
    type: finale
    title: "El burger de fuego"
    icon: fire
    difficulty: 3
    intensity: 5
    swing: true
    question: "¿Qué pidió Eliseo a Elías antes de que el carro de fuego lo llevara?"
    instructions: "¡Todos de pie! La última palabra de la noche."
    choices:
      - key: chariot
        label: "El carro de fuego"
      - key: double
        label: "Una doble porción de su espíritu"
      - key: crown
        label: "La corona de Elías"
    correct_choice: "double"
    answer: "Una doble porción de su espíritu."
    reference: "2 Reyes 2:9"
    points: 25
    duration: 40
    remote: true
    reward:
      xp: 40
    presentation:
      image: burger/chariot.jpg
      intro_vfx: embers
      correct_vfx: fire_burst
    sfx:
      intro: dramatic_fire
      correct: royal_fanfare
    layers:
      - key: pan
        label: "El pan"
        text: "Elías y Eliseo caminan juntos."
        host: "Míralos. El maestro y el discípulo. Elías va a ser llevado. Eliseo no se aparta. Un segundo de silencio."
        picto: scroll
        image: burger/pan.jpg
        clip: burger/pan.mp4
      - key: jordan
        label: "La lechuga"
        text: "Llegan al Jordán. El agua se abre."
        host: "Elías golpea el río. El agua se abre. Pasan en seco. Como el pueblo hace tiempo."
        picto: wave
        image: burger/jordan.jpg
        clip: burger/jordan.mp4
      - key: chariot
        label: "La carne"
        text: "Un carro de fuego. Elías sube al cielo."
        host: "Caballos de fuego. Un carro. Elías sube. Eliseo se queda. ¿Qué va a pedir?"
        picto: fire
        image: burger/chariot.jpg
        clip: burger/chariot.mp4
      - key: salsa
        label: "La salsa"
        text: "La salsa."
        host: "El burger está servido. Ahora la pregunta. No corras."
        picto: crown
        image: burger/salsa.jpg
        clip: burger/salsa.mp4
