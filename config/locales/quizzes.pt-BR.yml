pt-BR:
  quizzes:
    coronas:
      title: "Reis"
      kicker: "Quiz real"
      lede: "Davi, Saul, Salomão: quem foi ungido, quem orou, quem caiu."
      questions:
        ungio_david:
          question: "Quem ungiu Davi quando ele ainda era rapaz?"
          answer: "Samuel o ungiu em Belém, diante dos irmãos dele."
          choices:
            samuel: "Samuel"
            saul: "Saul"
            natan: "Natã"
        piedras_arroyo:
          question: "Quantas pedras lisas Davi tirou do riacho?"
          answer: "Ele pegou cinco pedras lisas no riacho."
          choices:
            cinco: "Cinco"
            tres: "Três"
            siete: "Sete"
            una: "Uma"
        arpa_saul:
          question: "A harpa de Davi acalmava o espírito atormentado de…"
          answer: "Quando Davi tocava, Saul encontrava alívio."
          choices:
            saul: "Saul"
            absalon: "Absalão"
            goliat: "Golias"
        vina_nabot:
          question: "Quem quis a vinha de Nabote?"
          answer: "O rei Acabe quis a vinha que ficava ao lado do palácio."
          choices:
            acab: "Acabe"
            jehu: "Jeú"
            elias: "Elias"
        salomon_templo:
          question: "O que Salomão levantou em Jerusalém para o Senhor?"
          answer: "Salomão construiu a casa do Senhor: o templo."
          choices:
            templo: "O templo"
            palacio: "Um palácio para o faraó"
            torre: "A torre de Babel"
        juicio_madres:
          question: "No julgamento das duas mães, o que Salomão mandou trazer?"
          answer: "Mandou trazer uma espada. A mãe de verdade não deixou partir o menino."
          choices:
            espada: "Uma espada"
            balanza: "Uma balança"
            arca: "A arca"
        arca_jerusalen:
          question: "Onde Davi colocou a arca do convênio?"
          answer: "Davi fez a arca subir a Jerusalém, com alegria."
          choices:
            jerusalen: "Jerusalém"
            silo: "Siló"
            egipto: "O Egito"
        sucedio_salomon:
          question: "Quem foi ungido rei quando Davi estava velho?"
          answer: "Salomão foi ungido, e o povo gritou: Viva o rei Salomão!"
          choices:
            salomon: "Salomão"
            adonias: "Adonias"
            joab: "Joabe"
        josias_libro:
          question: "O que o sacerdote Hilquias achou na casa do Senhor, nos dias de Josias?"
          answer: "Achou o livro da lei. Josias rasgou as roupas quando ouviu."
          choices:
            ley: "O livro da lei"
            mana: "Um vaso de maná"
            corona: "A coroa de Davi"
        moises_roca:
          question: "Em Meribá, o que Moisés fez com a rocha, em vez de falar com ela?"
          answer: "Ele golpeou a rocha duas vezes. Por isso não entrou na terra."
          choices:
            golpeo: "Ele a golpeou"
            canto: "Ele cantou para ela"
            ignoro: "Ele passou adiante"
    placas:
      title: "Placas"
      kicker: "Quiz das placas"
      lede: "Leí, Néfi, Abinádi: as placas, o barco e a torre."
      questions:
        lehi_jerusalen:
          question: "De que cidade Leí saiu com a família?"
          answer: "O Senhor mandou que ele saísse de Jerusalém."
          choices:
            jerusalen: "Jerusalém"
            babilonia: "Babilônia"
            egipto: "O Egito"
        nefi_barco:
          question: "Junto ao mar, o que o Senhor mandou Néfi construir?"
          answer: "O Senhor disse que ele construísse um barco, do jeito do Senhor."
          choices:
            barco: "Um barco"
            templo: "Um templo"
            torre: "Uma torre"
        benjamin_torre:
          question: "De onde o rei Benjamim falou ao seu povo?"
          answer: "Ele mandou construir uma torre para que o povo o ouvisse."
          choices:
            torre: "Uma torre"
            muro: "O muro da cidade"
            templo: "O templo de Salomão"
        noe_inicuo:
          question: "O rei Noé, filho de Zenife, era um rei…"
          answer: "Noé sobrecarregou o povo e não guardou os mandamentos."
          choices:
            inicuo: "Iníquo"
            justo: "Justo"
            nino: "Ainda menino"
        abinadi_noe:
          question: "Diante de quem Abinádi testificou?"
          answer: "Abinádi veio com a mensagem do Senhor para Noé e o povo."
          choices:
            noe: "O rei Noé"
            mosiah: "O rei Mosias"
            lamoni: "O rei Lamôni"
        alma_joven:
          question: "O que aconteceu com Alma, o filho, quando um anjo falou?"
          answer: "Ele caiu e não conseguiu falar. O Senhor tinha ouvido o pai dele."
          choices:
            cayo: "Ele caiu no chão"
            rey: "O fizeram rei"
            mar: "Ele fugiu para o mar"
        samuel_muro:
          question: "De onde Samuel, o lamanita, pregou aos nefitas?"
          answer: "Eles o expulsaram da cidade. Ele subiu ao muro, e não conseguiram atingi-lo."
          choices:
            muro: "O muro"
            rio: "O rio Sidom"
            bosque: "Uma floresta"
        mosiah_jared:
          question: "Que registros Mosias traduziu com as pedras de videntes?"
          answer: "Ele traduziu os registros do povo de Jarede, achados pelo povo de Limhi."
          choices:
            jared: "Os de Jarede"
            isaias: "Isaías"
            brass: "As placas de Labão"
        moroni_planchas:
          question: "O que Morôni escondeu para que viesse à luz no último dia?"
          answer: "Morôni terminou o registro do pai e escondeu as placas."
          choices:
            planchas: "As placas"
            arca: "A arca"
            corona: "A coroa de Benjamim"
        jared_senor:
          question: "No monte, a quem o irmão de Jarede viu?"
          answer: "O Senhor se mostrou. O véu foi tirado dos olhos dele."
          choices:
            senor: "O Senhor"
            moroni: "Morôni"
            noe: "Noé"
    hermanas:
      title: "Irmãs"
      kicker: "Quiz das irmãs"
      lede: "Rute, Ester, Ana e Débora: mulheres que ficaram, falaram e salvaram."
      questions:
        rut_noemi:
          question: "Com quem Rute ficou, em vez de voltar a Moabe?"
          answer: "Rute disse: aonde fores, irei eu."
          choices:
            noemi: "Noemi"
            orfa: "Orfa"
            raquel: "Raquel"
        ester_rey:
          question: "Diante de quem Ester se apresentou, mesmo sem ser chamada?"
          answer: "Ester disse: se eu perecer, pereci. Ela entrou para ver o rei."
          choices:
            rey: "O rei"
            aman: "Hamã"
            mardoqueo: "Mardoqueu"
        ana_hijo:
          question: "O que Ana pediu ao Senhor em Siló, com a alma amargurada?"
          answer: "Pediu um filho e prometeu dedicá-lo ao Senhor."
          choices:
            hijo: "Um filho"
            corona: "Uma coroa"
            tierra: "Uma terra"
        debora_juzga:
          question: "Quem julgava Israel debaixo da palmeira?"
          answer: "Débora, profetisa, julgava Israel."
          choices:
            debora: "Débora"
            jael: "Jael"
            rut: "Rute"
        abigail_david:
          question: "Quem Abigail deteve para que não derramasse sangue?"
          answer: "Abigail saiu ao encontro de Davi com pães e fruto."
          choices:
            david: "Davi"
            naval: "Nabal"
            saul: "Saul"
        saba_salomon:
          question: "A quem a rainha de Sabá visitou?"
          answer: "Ela veio pôr Salomão à prova com perguntas difíceis."
          choices:
            salomon: "Salomão"
            david: "Davi"
            faraon: "O faraó"
        maria_madre:
          question: "De quem Maria seria a mãe?"
          answer: "O anjo disse: você conceberá e dará à luz um filho."
          choices:
            jesus: "Jesus"
            juan: "João Batista"
            moises: "Moisés"
        magdalena_tumba:
          question: "A quem Maria Madalena viu junto ao túmulo vazio?"
          answer: "Jesus lhe disse: Maria. Aí ela o reconheceu."
          choices:
            jesus: "Jesus"
            pilato: "Pilatos"
            caifas: "Caifás"
        viuda_blancas:
          question: "O que a viúva pobre lançou no cofre do templo?"
          answer: "Ela lançou duas moedinhas: mais do que todos, porque era tudo o que tinha."
          choices:
            blancas: "Duas moedinhas"
            oro: "Um talento de ouro"
            diezmo: "O dízimo do templo"
        marta_parte:
          question: "Jesus disse a Marta que Maria tinha escolhido…"
          answer: "Maria sentou-se para ouvir. Isso não lhe seria tirado."
          choices:
            parte: "A boa parte"
            cocina: "A cozinha"
            corona: "Uma coroa"
    abish:
      title: "Abish"
      kicker: "Quiz da Abish"
      lede: "Abish, Sariah e as mães dos dois mil: fé que não duvidou."
      questions:
        saria_lehi:
          question: "Com quem Sariah saiu de Jerusalém?"
          answer: "Sariah saiu com Leí, o marido, e os filhos."
          choices:
            lehi: "Leí"
            laban: "Labão"
            ismael: "Ismael"
        abish_reina:
          question: "Abish era serva de…"
          answer: "Abish, lamanita, servia a esposa de Lamôni."
          choices:
            reina: "A rainha"
            noe: "O rei Noé"
            benjamin: "O rei Benjamim"
        lamoni_esposa:
          question: "Quem creu nas palavras de Amom sobre o rei Lamôni?"
          answer: "A rainha creu. Disse: não tenho dúvida nenhuma."
          choices:
            esposa: "A esposa de Lamôni"
            anti: "Anti-Néfi-Leí"
            noe: "Noé"
        madres_dudar:
          question: "As mães dos dois mil ensinaram os filhos a…"
          answer: "Ensinaram que, se não duvidassem, Deus os livraria."
          choices:
            dudar: "Não duvidar"
            huir: "Fugir para as montanhas"
            diezmar: "Pagar o dízimo primeiro"
        eva_madre:
          question: "Segundo Leí, Eva é mãe de…"
          answer: "Adão e Eva tiveram filhos. Eva é mãe de todos os viventes."
          choices:
            vivientes: "Todos os viventes"
            israel: "Só Israel"
            nefi: "Só Néfi"
        maria_hijo:
          question: "O anjo disse a Benjamim que Maria seria mãe do…"
          answer: "Ele se chamaria Jesus Cristo, o Filho de Deus."
          choices:
            hijo: "Filho de Deus"
            benjamin: "Rei Benjamim"
            samuel: "O profeta Samuel"
        saria_bronce:
          question: "Ao ver o quê Sariah se alegrou, depois de murmurar?"
          answer: "Ela viu que os filhos tinham voltado com as placas. Ofereceu sacrifício."
          choices:
            bronce: "As placas de bronze"
            barco: "O barco de Néfi"
            liahona: "A Liahona"
        abish_casas:
          question: "Quando a rainha e o rei caíram, o que Abish fez?"
          answer: "Correu de casa em casa, para que o povo visse o poder de Deus."
          choices:
            casas: "Correu de casa em casa"
            escondio: "Escondeu-se"
            canto: "Cantou um salmo"
        saria_barco:
          question: "No barco, Sariah e as crianças pequenas…"
          answer: "Lamã e Lemuel tinham amarrado Néfi. Sariah e as crianças adoeceram de dor."
          choices:
            sufrieron: "Sofreram"
            gobernaron: "Governaram o leme"
            durmieron: "Dormiram a viagem inteira"
        abish_vision:
          question: "Como Abish se convertera, anos antes?"
          answer: "O Senhor a tinha preparado. Pela visão do pai, ela cria."
          choices:
            vision: "Por uma visão notável de seu pai"
            benjamin: "Ao ouvir Benjamim"
            placas: "Ao ler as placas"
    profetas:
      title: "Profetas"
      kicker: "Quiz dos profetas"
      lede: "Jonas, Elias e Daniel: três dias, corvos e janelas para Jerusalém."
      questions:
        jonas_tres:
          question: "Quantos dias Jonas ficou no peixe?"
          answer: "Três dias e três noites."
          choices:
            tres: "Três"
            siete: "Sete"
            cuarenta: "Quarenta"
        elias_cuervos:
          question: "Junto ao riacho, quem alimentava Elias?"
          answer: "Os corvos lhe levavam pão e carne, de manhã e à tarde."
          choices:
            cuervos: "Corvos"
            angeles: "Anjos"
            sacerdotes: "Sacerdotes"
        daniel_tres:
          question: "Quantas vezes ao dia Daniel orava, com as janelas abertas para Jerusalém?"
          answer: "Três vezes ao dia, como ele já fazia antes."
          choices:
            tres: "Três vezes ao dia"
            una: "Uma vez por ano"
            nunca: "Nunca, por decreto"
        jonas_tarsis:
          question: "Para onde Jonas fugiu, em vez de ir a Nínive?"
          answer: "Ele fugiu para Társis, para longe da presença do Senhor."
          choices:
            tarsis: "Társis"
            ninive: "Nínive"
            egipto: "O Egito"
        naaman_jordan:
          question: "Em que rio Naamã se lavou e ficou limpo?"
          answer: "Ele mergulhou sete vezes no Jordão, conforme a palavra de Eliseu."
          choices:
            jordan: "O Jordão"
            nilo: "O Nilo"
            mar: "O mar Morto"
        elias_siete:
          question: "Elias mandou o servo olhar para o mar. Quantas vezes?"
          answer: "Sete vezes. Na sétima, aparecia uma nuvemzinha."
          choices:
            siete: "Sete vezes"
            tres: "Três vezes"
            una: "Só uma vez"
        tres_horno:
          question: "Quem foi lançado na fornalha por não se curvar?"
          answer: "Sadraque, Mesaque e Abede-Nego. Não serviram a estátua do rei."
          choices:
            tres: "Sadraque, Mesaque e Abede-Nego"
            daniel: "Daniel sozinho"
            moises: "Moisés e Arão"
        elias_manto:
          question: "Com o que Elias golpeou o Jordão para atravessar a seco?"
          answer: "Com o manto. As águas se apartaram."
          choices:
            manto: "O manto dele"
            vara: "A vara de Moisés"
            arpa: "A harpa de Davi"
        isaias_templo:
          question: "A quem Isaías viu assentado num trono, no templo?"
          answer: "Ele viu o Senhor. A borda do manto enchia o templo."
          choices:
            senor: "O Senhor"
            saul: "O rei Saul"
            babilonia: "A Babilônia"
        eliseo_carros:
          question: "Quando Elias foi elevado, o que Eliseu viu?"
          answer: "Um carro de fogo e cavalos de fogo. Elias subiu num redemoinho."
          choices:
            carros: "Carros de fogo"
            barca: "Um barco no Jordão"
            nube: "Só uma nuvem cinza"
    jehova:
      title: "O Senhor"
      kicker: "Quiz do Senhor"
      lede: "O nome do Senhor, o mar que se abre e o único Salvador."
      questions:
        zarza_yo_soy:
          question: "Na sarça, que nome o Senhor deu a Moisés?"
          answer: "EU SOU O QUE SOU. Assim dirás aos filhos de Israel."
          choices:
            yo_soy: "EU SOU"
            moises: "O Deus só de Moisés"
            faraon: "O nome do faraó"
        mar_rojo:
          question: "O que o Senhor abriu para que Israel passasse a seco?"
          answer: "Moisés estendeu a mão, e o Senhor abriu o mar Vermelho."
          choices:
            mar: "O mar Vermelho"
            jordan: "O Jordão"
            nilo: "O Nilo"
        no_salvador:
          question: "Isaías ouve o Senhor dizer: eu, eu o Senhor, e…"
          answer: "Fora de mim não há quem salve."
          choices:
            yo: "Fora de mim não há Salvador"
            babilonia: "A Babilônia salvará"
            reyes: "Os reis da terra"
        kirtland_senor:
          question: "Quem apareceu a Joseph e a Oliver em Kirtland, sob o véu?"
          answer: "O Senhor. A voz dele era como o ruído de grandes águas."
          choices:
            senor: "O Senhor"
            moises_solo: "Só Moisés"
            elias_solo: "Só Elias"
        ley_moises:
          question: "Em Abundância, Jesus disse da lei de Moisés…"
          answer: "Sou eu quem deu a lei. Sou eu quem a cumpriu."
          choices:
            yo: "Sou eu quem deu a lei a Moisés"
            aaron: "Arão deu a lei"
            roma: "César deu a lei"
        antes_abraham:
          question: "Jesus disse aos que o ouviam: em verdade, em verdade vos digo…"
          answer: "Antes que Abraão existisse, EU SOU."
          choices:
            yo_soy: "Antes que Abraão existisse, EU SOU"
            despues: "Nasci depois de Abraão"
            nieto: "Sou neto de Abraão"
        omnipotente_descendio:
          question: "O Senhor Onipotente, segundo o anjo que falou a Benjamim…"
          answer: "Ele descerá do céu e morará num tabernáculo de barro."
          choices:
            descendio: "Descerá entre os filhos dos homens"
            lejos: "Ficará longe para sempre"
            angel: "Enviará só um anjo"
        jared_padre_hijo:
          question: "O irmão de Jarede ouviu: eis que eu sou…"
          answer: "Eu sou o Pai e o Filho. Em mim a humanidade terá luz."
          choices:
            ambos: "O Pai e o Filho"
            solo_angel: "Só um anjo"
            moises: "Moisés em glória"
        dios_egipto:
          question: "Segundo Néfi, o Deus de Abraão, de Isaque e de Jacó é o mesmo que…"
          answer: "Tirou os filhos de Israel do Egito, e seria levantado."
          choices:
            egipto: "O Deus de Abraão, que tirou Israel do Egito"
            baal: "Baal dos cananeus"
            roma: "O César de Roma"
        nube_nombre:
          question: "Da nuvem, sobre o povo de Néfi, quem se nomeou?"
          answer: "Jesus Cristo, o Filho de Deus. Eu criei os céus e a terra."
          choices:
            jesus: "Jesus Cristo"
            alma: "Alma, o filho"
            samuel: "Samuel, o lamanita"
    nazareno:
      title: "Na terra"
      kicker: "Quiz na terra"
      lede: "Belém, o batismo e os milagres: Jesus entre nós."
      questions:
        nacio_belen:
          question: "Onde Jesus nasceu?"
          answer: "Em Belém da Judeia, numa manjedoura, porque não havia lugar."
          choices:
            belen: "Belém"
            nazaret: "Nazaré"
            jerusalen: "Jerusalém"
        bautizo_juan:
          question: "Quem batizou Jesus no Jordão?"
          answer: "João. Os céus se abriram, e o Espírito desceu."
          choices:
            juan: "João"
            pedro: "Pedro"
            andrew: "André"
        cana_vino:
          question: "Em Caná, Jesus transformou a água em…"
          answer: "Em vinho. Foi o primeiro sinal, numa festa de casamento."
          choices:
            vino: "Vinho"
            aceite: "Azeite"
            miel: "Mel"
        cinco_mil:
          question: "Com cinco pães e dois peixes, quantos Jesus alimentou?"
          answer: "Cerca de cinco mil homens, além de mulheres e crianças."
          choices:
            cinco: "Cinco mil"
            doce: "Doze"
            ciento: "Cem"
        camino_mar:
          question: "De noite, em direção ao barco, Jesus andou sobre…"
          answer: "Sobre o mar. Os discípulos se assustaram, e ele disse: sou eu."
          choices:
            mar: "O mar"
            nubes: "As nuvens"
            fuego: "Um rio de fogo"
        getsemani:
          question: "Em Getsêmani, o que Jesus fez?"
          answer: "Ele orou. O suor era como grandes gotas de sangue."
          choices:
            orar: "Ele orou, com a alma muito triste"
            huir: "Ele fugiu para a Galileia"
            dormir: "Ele dormiu até o amanhecer"
        crucificado:
          question: "No Gólgota, o que fizeram com Jesus?"
          answer: "O crucificaram. Ele entregou a vida, e tudo se cumpriu."
          choices:
            cruz: "O crucificaram"
            rey: "O coroaram César"
            egipto: "Mandaram-no ao Egito"
        magdalena_resucitado:
          question: "Depois do terceiro dia, Maria Madalena…"
          answer: "Ela viu Jesus vivo. Foi dizer aos discípulos: eu vi o Senhor."
          choices:
            resucitado: "Ela o viu ressuscitado"
            tumba: "Ela só viu o túmulo fechado"
            soldados: "Ela viu os soldados de Roma"
        abundancia:
          question: "Depois da ressurreição, em que templo Jesus se mostrou aos nefitas?"
          answer: "No templo de Abundância. Ele desceu, e o povo o tocou."
          choices:
            abundancia: "Abundância"
            zarahemla: "Zaraenla"
            jerusalen: "Jerusalém da Judeia"
        ninos_uno:
          question: "Em Abundância, como Jesus abençoou as crianças?"
          answer: "Um a um. Ele os tomou nos braços e os abençoou."
          choices:
            uno: "Um a um"
            lejos: "De longe, em grupo"
            angeles: "Só os anjos os tocaram"
    moises:
      title: "Moisés"
      kicker: "Quiz de Moisés"
      lede: "Face a face, o Éden e a criação: o que Moisés viu."
      questions:
        moises_cara:
          question: "Segundo o livro de Moisés, Moisés viu Deus…"
          answer: "Face a face, e falou com ele. A glória de Deus estava sobre Moisés."
          choices:
            cara: "Face a face"
            sueno: "Só num sonho"
            nube: "Atrás de uma nuvem, sem vê-lo"
        satanas_tento:
          question: "Quando a glória se afastou, Satanás tentou Moisés…"
          answer: "Ele disse: Moisés, filho do homem, adora-me. Moisés não cedeu."
          choices:
            adorar: "A adorá-lo"
            rey: "A fazê-lo faraó"
            huir: "A fugir de novo para Midiã"
        cielo_tierra:
          question: "Em Moisés 2, Deus diz que criou…"
          answer: "O céu e a terra. Eu sou o Princípio e o Fim."
          choices:
            cielo: "O céu e a terra"
            kolob: "Só Kolob"
            egipto: "Só o Egito"
        polvo_hombre:
          question: "O homem foi formado do…"
          answer: "Pó da terra. Deus soprou em suas narinas o fôlego de vida."
          choices:
            polvo: "O pó da terra"
