      enter_game: "Entrar no Noche Live"
      privacy: "Privacidade"
      pages:
        home:
          title: "Noche Live — Jogos bíblicos, atividades cristãs e estudo"
          description: "Descubra jogos bíblicos, atividades cristãs para jovens e famílias e roteiros de estudo das escrituras com o Noche Live."
          kicker: "Uma aventura bíblica para viver juntos"
          h1: "A Bíblia ganha vida quando é compartilhada"
          lede: "O Noche Live transforma as escrituras em uma aventura de perguntas, desafios, histórias e encontros. Jogue sozinho, com a família, com amigos ou em uma noite na igreja."
          cta: "Jogar agora"
          card_title: "Descobrir o Noche Live"
          card_body: "Jogos, estudo e comunidade em uma só aventura."
          sections:
            - title: "Jogue e fique com vontade de reler"
              body: "Cada pergunta abre uma história bíblica. Pontos, coroas e desafios dão vontade de continuar, mas a vitória de verdade é reconhecer melhor os profetas, os reis e, acima de tudo, se aproximar de Jesus Cristo."
            - title: "Uma experiência para a sala inteira"
              body: "O Noche Live funciona no celular e reúne as pessoas. Uma família joga no sofá, os jovens formam equipes e toda a ala acompanha a disputa ao vivo no telão."
            - title: "Sempre existe um próximo passo"
              body: "Depois do jogo, você pode abrir a passagem, seguir um programa semanal ou conversar com alguém da Igreja. Nada é apressado ou imposto: cada porta fica aberta para quando você quiser avançar."
        bible_games:
          title: "Jogos bíblicos para jovens, famílias e grupos | Noche Live"
          description: "Jogos bíblicos gratuitos com perguntas, desafios, equipes e aventuras para jovens, famílias, classes e grupos cristãos."
          kicker: "Jogos bíblicos"
          h1: "Jogos que fazem todos olhar, rir e lembrar"
          lede: "Não é uma atividade escolar com botão de enviar. São perguntas rápidas, desafios em equipe e momentos que fazem a sala inteira entrar em uma história bíblica."
          cta: "Abrir os jogos"
          card_title: "Jogos bíblicos"
          card_body: "Perguntas, desafios e uma aventura para compartilhar."
          sections:
            - title: "Uma história por trás de cada pergunta"
              body: "Cada resposta leva a uma passagem real. Arrisque, surpreenda-se e abra as escrituras para entender por que Davi, Ester, Moisés ou Elias tomaram aquela decisão."
            - title: "Do celular de volta para a sala"
              body: "O celular serve para responder e manter a sequência. A atenção volta para as pessoas: comentar uma resposta, celebrar uma conquista e ajudar a equipe a assumir a liderança."
            - title: "Para uma pessoa ou cinquenta"
              body: "Jogue uma rodada curta sozinho, desafie um amigo ou prepare uma noite inteira para jovens e famílias. O ritmo muda, mas a aventura e o jeito acolhedor permanecem."
        bible_quiz:
          title: "Quiz bíblico gratuito com respostas | Noche Live"
          description: "Teste seus conhecimentos com um quiz bíblico gratuito, respostas explicadas e links diretos para as passagens."
          kicker: "Quiz bíblico"
          h1: "Quanto da Bíblia você realmente lembra?"
          lede: "Responda rápido, veja o que outros jogadores escolheram e abra o versículo quando uma história surpreender você. Até um erro pode virar uma porta para aprender."
          cta: "Começar o quiz"
          card_title: "Quiz bíblico"
          card_body: "Perguntas rápidas com resposta e passagem."
          sections:
            - title: "Reis, profetas e decisões"
              body: "As perguntas percorrem pessoas, lugares, promessas e momentos decisivos. Você não precisa ser especialista: a dificuldade cresce aos poucos e o texto bíblico está sempre por perto."
            - title: "Uma resposta que fica na memória"
              body: "Depois da escolha vêm a revelação, uma explicação curta e a passagem. A resposta certa deixa de ser apenas uma letra e se transforma em uma cena fácil de lembrar."
            - title: "Sequências, estrelas e desafios"
              body: "As recompensas deixam o progresso visível. Supere sua própria marca ou desafie alguém sem transformar o aprendizado em uma prova fria."
        group_activities:
          title: "Atividades cristãs para grupos e famílias | Noche Live"
          description: "Ideias de atividades cristãs para jovens, famílias, classes e grupos: jogos bíblicos, equipes, conversa e momentos de fé."
          kicker: "Atividades cristãs"
          h1: "Uma atividade que realmente reúne"
          lede: "Quando todos chegam cansados, uma boa atividade precisa de um convite claro, um começo rápido e algo para compartilhar. O Noche Live coloca o jogo a serviço do encontro."
          cta: "Preparar uma atividade"
          card_title: "Atividades cristãs"
          card_body: "Ideias para reunir, jogar e conversar."
          sections:
            - title: "Comece em menos de dois minutos"
              body: "Um código curto coloca todos no jogo pelo celular. O jogo começa no horário e cada pessoa avança pelos quizzes sem papéis nem regras intermináveis."
            - title: "Um lugar para cada pessoa"
              body: "Há momentos para quem sabe muito, para quem acabou de chegar, para quem fala alto e para quem prefere observar. As equipes evitam que uma pessoa carregue toda a resposta sozinha."
            - title: "A conversa continua"
              body: "Uma surpresa do jogo pode abrir uma conversa sobre coragem, serviço, fé ou Jesus Cristo. A atividade não substitui esse momento: ela o prepara e dá a todos uma história em comum."
        youth_activities:
          title: "Atividades cristãs para jovens que prendem a atenção | Noche Live"
          description: "Atividades cristãs dinâmicas para jovens com jogos bíblicos em equipes, desafios, perguntas e apresentação fácil."
          kicker: "Atividades para jovens"
          h1: "Menos explicação. Mais jogo em equipe."
          lede: "Os jovens entendem em segundos o que fazer. O celular vira controle, a sala vira palco e as escrituras são o ponto de partida de cada desafio."
          cta: "Começar uma noite"
          card_title: "Atividades para jovens"
          card_body: "Ritmo, equipes e fé sem clima de sala de aula."
          sections:
            - title: "Um começo que não deixa ninguém para trás"
              body: "Entre com um código, escolha uma equipe e comece. A interface mostra uma ação clara enquanto a tela ao vivo atualiza o progresso e a classificação automaticamente."
            - title: "Competição sem excluir"
              body: "Pontos e coroas criam tensão, enquanto os desafios misturam memória, intuição, movimento e cooperação. Talentos diferentes podem salvar a equipe."
            - title: "Uma noite que dá vontade de repetir"
              body: "O progresso, as lembranças da ala e os novos mundos criam um próximo encontro. Os jovens não recebem mais uma plataforma: sentem que fazem parte de uma aventura de todos."
        bible_study:
          title: "Estudo bíblico simples, semanal e compartilhado | Noche Live"
          description: "Siga um estudo bíblico semanal com leituras, perguntas, progresso e comunidade. Um jeito simples de voltar às escrituras."
          kicker: "Estudo bíblico"
          h1: "Uma semana, uma passagem, mais um passo"
          lede: "O estudo não precisa começar com uma hora livre. Leia a passagem, responda algumas perguntas e salve seu progresso. Na próxima vez, você saberá exatamente de onde continuar."
          cta: "Abrir o programa"
          card_title: "Estudo bíblico"
          card_body: "Leitura semanal, perguntas e progresso."
          sections:
            - title: "Primeiro, o texto"
              body: "Cada unidade começa com uma leitura definida. O leitor destaca a referência e mantém o capítulo por perto para que uma pergunta nunca substitua as escrituras."
            - title: "Perguntas para olhar de novo"
              body: "Não se trata apenas de lembrar nomes. As perguntas chamam atenção para uma promessa, uma decisão ou uma imagem da passagem e ajudam você a reler com mais intenção."
            - title: "Um caminho visível"
              body: "Seu histórico mostra o que você já percorreu. Você também pode acompanhar sua comunidade, celebrar quem terminou e retomar sem precisar começar de novo."
        psalms_study:
          title: "Estudo dos Salmos com leituras e perguntas semanais | Noche Live"
          description: "Leia e estude os Salmos em um roteiro semanal, com perguntas curtas e progresso fácil de retomar."
          kicker: "Os Salmos"
          h1: "Palavras para orar quando faltam palavras"
          lede: "Os Salmos falam a partir da alegria, do medo, da gratidão e da espera. Este roteiro semanal ajuda a ler devagar e reconhecer uma frase para levar com você."
          cta: "Estudar os Salmos"
          card_title: "Caminho pelos Salmos"
          card_body: "Uma leitura semanal para orar e lembrar."
          sections:
            - title: "Uma voz humana diante de Deus"
              body: "Os salmistas não escondem o que sentem. Eles trazem louvor, perguntas, arrependimento e confiança em palavras que ainda hoje podem acompanhar uma oração."
            - title: "Leia o salmo em seu contexto"
              body: "Cada semana abre a passagem completa antes das perguntas. Pare em uma imagem, volte a um versículo e acompanhe o pensamento sem transformar a leitura em prova."
            - title: "Leve uma luz para a semana"
              body: "Concluir uma unidade deixa o caminho visível. Mais importante, permite escolher uma verdade ou frase do salmo para lembrar quando você precisar dela de novo."
