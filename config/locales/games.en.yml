en:
  games:
    kings_and_prophets:
      title: "Kings and Prophets"
      tagline: "A night of crowns, fire, and stones"
      rounds:
        salomon_wisdom:
          title: "Solomon's choice"
          question: "God let Solomon ask for anything. What did he ask for?"
          answer: "Wisdom to lead the people."
          choices:
            riches: "Riches"
            wisdom: "Wisdom"
            army: "An army"
        rey_o_profeta:
          title: "King or prophet?"
          question: "Elijah was a king of Israel."
          answer: "False. Elijah was a prophet."
          choices:
            "true": "True"
            "false": "False"
        david_goliath:
          title: "David and Goliath"
          question: "What did David use to defeat Goliath?"
          answer: "A sling and a stone."
          instructions: "In the room: three balls. Bring down Goliath's tower."
          remote_instructions: "Keep the rhythm and throw the stone."
        elias_carmel:
          title: "Fire from heaven"
          question: "What fell on Elijah's altar on Carmel?"
          answer: "Fire from the Lord."
          choices:
            rain: "Rain"
            fire: "Fire"
            wind: "Wind"
            oil: "Oil"
        daniel_lions:
          title: "Daniel and the lions"
          question: "Why was Daniel thrown into the lions' den?"
          answer: "Because he prayed to his God."
          choices:
            stole: "Because he stole from the king"
            prayed: "Because he prayed to his God"
            slept: "Because he fell asleep"
        freeze_saul:
          title: "David's dance"
          instructions: "Dance. When the presenter stops, freeze!"
          answer: "David danced before the Lord."
          remote_instructions: "When you see FREEZE, tap. Not before."
        mime_jonah:
          title: "Jonah without words"
          instructions: "One player acts out Jonah. The team guesses."
          answer: "Jonah and the great fish."
          remote_instructions: "You are Jonah. Live the three moments."
          beats:
            storm:
              shout: "THE STORM!"
              label: "THE STORM!"
            fish:
              shout: "THE FISH!"
              label: "THE FISH!"
            shore:
              shout: "LAND!"
              label: "LAND!"
        kings_order:
          title: "The order of the kings"
          question: "Who reigned first?"
          instructions: "Tap the kings in the order of time."
          answer: "Saul, then David, then Solomon."
          items:
            saul: "Saul"
            david: "David"
            salomon: "Solomon"
        taboo_nabot:
          title: "Forbidden words"
          instructions: "One player tells the story. They cannot say the red words. The others guess."
          target: "Naboth's vineyard"
          answer: "Ahab wanted Naboth's vineyard."
          remote_instructions: "At home: listen to the call and write the story."
          forbidden:
            vina: "vineyard"
            acab: "Ahab"
            jezabel: "Jezebel"
          guess_keys:
            - naboth
            - vineyard
            - nabot
        statue_david:
          title: "Statue of David"
          instructions: "Put the phone down. 30 seconds. Be the statue of David facing Goliath."
          answer: "David did not run. He stood."
          remote_instructions: "At home: 30 seconds. The same statue in front of the camera."
        scavenger_harp:
          title: "David's harp"
          instructions: "Stand up. Find a harp, or anything that makes a sound."
          answer: "David calmed Saul with the harp."
          remote_instructions: "At home: something that sounds. A box, keys, a pot, a voice."
        category_prophets:
          title: "Names of prophets"
          instructions: "Shout prophets. Three is enough."
          answer: "Isaiah, Jeremiah, Elijah, Elisha, Daniel…"
          remote_instructions: "Write three prophets. Separate them with commas."
          guess_keys:
            - Isaiah
            - Jeremiah
            - Elijah
            - Elisha
            - Daniel
            - Jonah
            - Samuel
            - Moses
            - Nathan
            - Micah
            - Isaías
            - Jeremías
            - Elías
            - Eliseo
            - Jonás
            - Moisés
            - Natán
            - Miqueas
        vote_solomon:
          title: "Solomon's judgment"
          question: "Who has shown the most wisdom tonight?"
          instructions: "You cannot vote for yourselves."
          answer: "Wisdom to see true love."
        semifinal_crown:
          title: "The crown shakes"
          question: "Who anointed David in secret, while he was still young?"
          answer: "Samuel."
          choices:
            saul: "Saul"
            samuel: "Samuel"
            nathan: "Nathan"
        finale_prophet:
          title: "The fire burger"
          question: "What did Elisha ask Elijah before the chariot of fire took him?"
          instructions: "Everybody up! The last word of the night."
          answer: "A double portion of his spirit."
          choices:
            chariot: "The chariot of fire"
            double: "A double portion of his spirit"
            crown: "Elijah's crown"
          layers:
            pan:
              label: "The bun"
              text: "Elijah and Elisha walk together."
              host: "Look at them. The teacher and the disciple. Elijah is about to be taken. Elisha does not step away. One second of silence."
            jordan:
              label: "The lettuce"
              text: "They reach the Jordan. The water opens."
              host: "Elijah strikes the river. The water opens. They cross on dry ground. Like the people long ago."
            chariot:
              label: "The patty"
              text: "A chariot of fire. Elijah goes up to heaven."
              host: "Horses of fire. A chariot. Elijah goes up. Elisha stays. What will he ask?"
            salsa:
              label: "The sauce"
              text: "The sauce."
              host: "The burger is served. Now the question. Don't rush."
