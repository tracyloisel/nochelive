      navigation: "Explore Noche Live"
      nav:
        games: "Bible games"
        activities: "Activities"
        study: "Bible study"
      secondary_cta: "Discover the Church"
      keep_exploring: "Keep the adventure going"
      next_title: "What would you like to discover next?"
      enter_game: "Enter Noche Live"
      privacy: "Privacy"
      pages:
        home:
          title: "Noche Live — Bible games, Christian activities, and study"
          description: "Discover Bible games, Christian activities for youth and families, and guided scripture study with Noche Live."
          kicker: "A Bible adventure shared together"
          h1: "The Bible comes alive when we share it"
          lede: "Noche Live turns scripture into an adventure of questions, challenges, stories, and time together. Play on your own, with family and friends, or during a church night."
          cta: "Play now"
          card_title: "Discover Noche Live"
          card_body: "Games, study, and community in one adventure."
          sections:
            - title: "Play, then want to read again"
              body: "Every question opens a Bible story. Points, crowns, and challenges make the journey exciting, but the real win is recognizing the prophets and kings—and, above all, drawing closer to Jesus Christ."
            - title: "An experience for the whole room"
              body: "Noche Live works on a phone and brings people together. A family can play from the sofa, youth can form teams, and a congregation can follow the live race on a big screen."
            - title: "There is always a next step"
              body: "After a game, open the passage, follow a weekly study plan, or talk with someone from the Church. Nothing is rushed or forced. Each door stays open for whenever you are ready."
        bible_games:
          title: "Bible games for youth, families, and groups | Noche Live"
          description: "Free Bible games with questions, challenges, teams, and adventures for youth, families, classes, and Christian groups."
          kicker: "Bible games"
          h1: "Games that make everyone look up, laugh, and remember"
          lede: "This is not a worksheet with a Submit button. It is quick questions, team challenges, and moments that let the whole room step into a Bible story together."
          cta: "Open the games"
          card_title: "Bible games"
          card_body: "Questions, challenges, and an adventure to share."
          sections:
            - title: "A story behind every question"
              body: "Every answer connects to a real passage. Make a guess, be surprised, and open scripture to see why David, Esther, Moses, or Elijah made that choice."
            - title: "From the phone back to the room"
              body: "The phone is for answering and building a streak. Attention quickly returns to the people around you: discuss an answer, celebrate a feat, and help the team take the lead."
            - title: "For one person or fifty"
              body: "Play a short solo round, challenge a friend, or prepare a whole night for youth and families. The pace changes, while the warm voice and sense of adventure stay the same."
        bible_quiz:
          title: "Free Bible trivia with answers | Noche Live"
          description: "Test what you know with free Bible trivia, explained answers, and direct links to the scripture passages."
          kicker: "Bible trivia"
          h1: "How much of the Bible do you really remember?"
          lede: "Answer quickly, see what other players chose, and open the verse whenever a story surprises you. Even a wrong answer can become a doorway to learn."
          cta: "Start the trivia"
          card_title: "Bible trivia"
          card_body: "Quick questions with answers and passages."
          sections:
            - title: "Kings, prophets, and hard choices"
              body: "Questions travel through people, places, promises, and turning points. You do not need to be an expert: the difficulty grows gently, and the Bible text is always close by."
            - title: "An answer worth remembering"
              body: "After your choice comes the reveal, a short explanation, and the passage. The correct answer becomes more than a letter; it becomes a scene you can picture and remember."
            - title: "Streaks, stars, and challenges"
              body: "Rewards make progress visible. Beat your own score or challenge someone else without turning learning into a cold exam."
        group_activities:
          title: "Christian activities for groups and families | Noche Live"
          description: "Christian activity ideas for youth, families, classes, and groups: Bible games, teams, conversation, and moments of faith."
          kicker: "Christian activities"
          h1: "An activity that truly brings people together"
          lede: "When everyone arrives tired, a good activity needs a clear invitation, a quick start, and something worth sharing. Noche Live puts the game in service of the gathering."
          cta: "Plan an activity"
          card_title: "Christian activities"
          card_body: "Ideas to gather, play, and talk together."
          sections:
            - title: "Start in under two minutes"
              body: "A short code gets everyone in on their phone. The game starts on schedule and everyone moves through the quizzes without handouts or endless rules."
            - title: "A place for everyone"
              body: "There are moments for the person who knows a lot, the one who just arrived, the loud voice, and the quiet observer. Teams keep anyone from carrying the whole answer alone."
            - title: "The conversation keeps going"
              body: "A surprise in the game can open a conversation about courage, service, faith, or Jesus Christ. The activity does not replace that moment; it prepares it and gives everyone a shared story."
        youth_activities:
          title: "Christian youth activities that hold attention | Noche Live"
          description: "Lively Christian youth activities with team Bible games, challenges, questions, and an automatic live format."
          kicker: "Youth activities"
          h1: "Less explaining. More playing together."
          lede: "Young people understand what to do in seconds. The phone becomes a controller, the room becomes a stage, and scripture is where every challenge begins."
          cta: "Start a night"
          card_title: "Youth activities"
          card_body: "Pace, teams, and faith without feeling like class."
          sections:
            - title: "A start that leaves nobody behind"
              body: "Enter a code, choose a team, and begin. The interface offers one clear action while the live screen updates progress and standings automatically."
            - title: "Compete without shutting anyone out"
              body: "Points and crowns create tension, while challenges mix memory, instinct, movement, and cooperation. Different strengths can save the team."
            - title: "A night worth repeating"
              body: "Progress, shared ward memories, and new worlds create a reason to meet again. Youth do not get one more platform; they feel part of an adventure that belongs to everyone."
        bible_study:
          title: "Simple weekly Bible study to share | Noche Live"
          description: "Follow a weekly Bible study with readings, questions, progress, and community—a simple way to return to scripture."
          kicker: "Bible study"
          h1: "One week, one passage, one more step"
          lede: "Study does not have to begin with a free hour. Read the passage, answer a few questions, and save your progress. Next time, you will know exactly where to continue."
          cta: "Open the study plan"
          card_title: "Bible study"
          card_body: "Weekly reading, questions, and progress."
          sections:
            - title: "The text comes first"
              body: "Every unit begins with a specific reading. The reader highlights the reference and keeps the chapter close so that a question never replaces scripture itself."
            - title: "Questions that help you look again"
              body: "This is not only about remembering names. Questions draw attention to a promise, a decision, or an image in the passage and help you return to it with greater purpose."
            - title: "A visible path"
              body: "Your history shows what you have already completed. You can also see your community moving, celebrate finishers, and pick up the journey without starting over."
        psalms_study:
          title: "Study the Psalms with weekly readings and questions | Noche Live"
          description: "Read and study the Psalms through a weekly path, short questions, and progress that is easy to resume."
          kicker: "The Psalms"
          h1: "Words for prayer when words are hard to find"
          lede: "The Psalms speak from joy, fear, gratitude, and waiting. This weekly path helps you read slowly and recognize one line to carry with you."
          cta: "Study the Psalms"
          card_title: "A path through the Psalms"
          card_body: "A weekly reading for prayer and remembrance."
          sections:
            - title: "A human voice before God"
              body: "The psalmists do not hide what they feel. They offer praise, questions, repentance, and trust in words that can still accompany prayer today."
            - title: "Read the whole psalm in context"
              body: "Each week opens the complete passage before any questions. Pause over an image, return to a verse, and follow the thought without turning the reading into a test."
            - title: "Carry one light into the week"
              body: "Completing a unit makes the path visible. More importantly, it lets you choose one truth or line from the psalm to remember when you need it again."
