  church:
    title: "Venha à igreja"
    invite: "Venha à Igreja de Jesus Cristo"
    kicker: "Igreja"
    menu: "Igreja de Jesus Cristo"
    lede: "O Noche Live nasce nas noites em família. Se você quer conhecer A Igreja de Jesus Cristo dos Santos dos Últimos Dias, estas portas são para você."
    doors: "Como chegar mais perto"
    meet_title: "Falar com um missionário"
    meet_hint: "Uma visita, sempre de graça."
    meet_lede: "Dois missionários podem te encontrar em casa, num parque ou por videochamada. Eles escutam. Não cobram nada."
    meet_expect: "Eles explicam o que esperar no domingo e podem te esperar na porta da capela."
    meet_cta: "Pedir uma visita"
    meet_note: "Eles organizam a visita no site deles. O Noche Live não guarda seu telefone nem sua rua."
    beliefs_title: "Crenças"
    beliefs_hint: "Jesus Cristo no centro."
    beliefs_lede: "Todas as nossas crenças olham para Jesus Cristo. Celebramos a vida dEle e a graça dEle, e te convidamos a chegar até Ele sem pressa."
    missionaries_title: "Os missionários"
    missionaries_hint: "Andam de dois em dois."
    missionaries_lede: "São jovens — e às vezes casais mais velhos — que saem de casa um tempo para falar de Jesus Cristo. Andam de dois em dois. Se você não quiser, diz que não; se abrir a porta, te tratam com respeito."
    missionaries_pair: "Eles podem te cumprimentar no domingo. A visita é sempre de graça."
    mission:
      call_kicker: "Chamados por revelação"
      call_title: "Eles não escolhem um destino. Respondem a um chamado."
      call_body: "Cada jovem missionário de ensino é chamado pelo Presidente da Igreja. Um Apóstolo designa a missão por revelação. Antes de partir, o missionário é designado para representar Jesus Cristo."
      grace_kicker: "O que eles levam"
      grace_title: "Autoridade no chamado. Poder ao vivê-lo."
      grace_body: "Essa graça não pertence a eles: vem de Jesus Cristo. O chamado dá autoridade; a oração, os convênios e o serviço fiel permitem que o Espírito Santo aja por meio deles."
      gifts:
        christ_title: "Um convite para vir a Cristo"
        christ_body: "Eles ajudam as pessoas a crer em Jesus Cristo, arrepender-se, ser batizadas, receber o Espírito Santo e perseverar."
        spirit_title: "Um testemunho levado pelo Espírito"
        spirit_body: "Eles não forçam uma resposta. Ensinam, escutam e convidam; o Espírito Santo confirma a verdade."
        companion_title: "De dois em dois"
        companion_body: "Eles estudam, oram e servem com um companheiro. Ninguém carrega a missão sozinho."
      path_kicker: "Seu próximo passo"
      path_title: "E se esse chamado fosse para você?"
      path_body: "Há missões de ensino e de serviço para jovens e adultos. O caminho começa bem antes de abrir uma carta."
      steps:
        prepare_title: "Ore e prepare-se"
        prepare_body: "Fortaleça sua fé em Jesus Cristo e cuide da preparação espiritual, física e emocional."
        bishop_title: "Converse com seu bispo"
        bishop_body: "Ele vai escutar, responder às suas perguntas e abrir o processo oficial de recomendação."
        call_title: "Receba seu chamado"
        call_body: "O Presidente da Igreja chama você; um Apóstolo designa por revelação onde e como você vai servir."
      cta: "Descobrir como servir"
      source: "Ler Pregar Meu Evangelho"
    worship_title: "Venha adorar"
    worship_hint: "No domingo, a porta está aberta."
    worship_lede: "No domingo a capela está aberta. Não precisa ser membro. Venha como numa festa de família: com decência, sem fantasia."
    worship_first: "A primeira hora é a reunião sacramental. Não precisa saber os hinos."
    worship_cta: "Encontrar uma capela"
    worship:
      overview_kicker: "Duas horas para respirar"
      overview_title: "Um domingo, dois momentos"
      overview_body: "Os horários mudam de uma ala para outra, mas o ritmo costuma ser o mesmo: uma reunião para todos e depois aulas por idade ou grupo."
      schedule:
        sacrament_title: "Reunião sacramental · cerca de uma hora"
        sacrament_body: "Toda a congregação canta, ora e ouve discursos de membros. No centro está o sacramento."
        classes_title: "Aulas e conversa · cerca de uma hora"
        classes_body: "Crianças, jovens e adultos aprendem juntos com as escrituras. Se você não souber onde ir, alguém acompanha você."
      center_kicker: "O centro do domingo"
      center_title: "Lembrar de Jesus Cristo"
      center_body: "Pão e água são abençoados e distribuídos em lembrança do corpo e do sangue de Jesus Cristo. É um momento de silêncio, gratidão e renovação. Na primeira visita, você pode participar ou só passar a bandeja: ninguém vai pressionar você."
      first_kicker: "Sua primeira vez"
      first_title: "Venha sem pressão"
      first_body: "Não precisa conhecer os hinos, levar dinheiro nem saber o que fazer. Entre, sente-se e respire."
      reassurances:
        wear_title: "Venha como você está"
        wear_body: "O pessoal costuma se arrumar um pouco, mas você é bem-vindo com uma roupa confortável e respeitosa."
        alone_title: "Você não precisa vir sozinho"
        alone_body: "Um membro ou dois missionários podem esperar você na porta e sentar ao seu lado."
        give_title: "Não passa cestinha"
        give_body: "Visitantes não precisam doar. As contribuições dos membros são feitas em particular."
      source: "Ver como é um domingo"
    official: "Página da Igreja"
    back: "As quatro portas"
    belief:
      christ_title: "Jesus Cristo é o Salvador"
      christ_body: "Jesus Cristo é o Filho de Deus. Ele sofreu e morreu por todos, e ressuscitou. Mesmo sendo o Salvador do mundo, Ele te conhece pelo nome. Por causa dEle você pode mudar, ser perdoado e viver de novo com Deus."
      father_title: "Deus te ama"
      father_body: "Você é filho ou filha de Deus. Ele te conhece. Quer te ouvir na oração. Quando você se volta para Ele, encontra consolo e rumo."
      plan_title: "A vida tem sentido"
      plan_body: "A vida nem sempre é fácil, mas Deus tem um plano para cada um. As famílias estão no centro desse plano. A morte não é o fim: é o fechamento deste trecho do caminho."
      word_title: "Dois livros, um Jesus"
      word_body: "Acreditamos que a Bíblia é a palavra de Deus, traduzida corretamente. Também acreditamos que o Livro de Mórmon é a palavra de Deus: outro testemunho de Jesus Cristo, escrito por profetas nas Américas antigas."
      church_title: "A Igreja dEle está aqui"
      church_body: "Quando Jesus esteve na terra, Ele organizou a Igreja com profetas e apóstolos. Acreditamos que essa Igreja foi restaurada. Hoje um profeta vivo a conduz. No domingo, uma congregação te espera para adorar e te sustentar."
      christlike_title: "Ficar mais parecido com Ele"
      christlike_body: "Fé em Jesus Cristo, arrependimento, batismo e o dom do Espírito Santo. Perdão, esperança, caridade. Buscamos o que é virtuoso, belo, digno de louvor."
      faq_title: "Perguntas de sempre"
      faq:
        denomination:
          q: "Que igreja é essa?"
          a: "Somos A Igreja de Jesus Cristo dos Santos dos Últimos Dias. Às vezes nos chamam de “mórmons”; o nome que amamos é o de Jesus Cristo."
        wear:
          q: "O que eu visto no domingo?"
          a: "Venha como numa festa de família: com decência, sem fantasia. O povo costuma ir arrumado, mas ninguém te manda embora pela roupa. O que importa é entrar."
        length:
          q: "Quanto tempo dura?"
          a: "A reunião sacramental dura cerca de uma hora. Depois tem aulas. Se for a sua primeira vez, fique essa primeira hora; dois missionários podem sentar com você."
        donate:
          q: "Eu preciso dar dinheiro?"
          a: "Não. Visitantes não passam cestinha. O dízimo é uma escolha particular dos membros."
        member:
          q: "Como é ser membro?"
          a: "A gente tenta seguir Jesus Cristo: orar, servir, se reunir no domingo, cuidar da família. Ninguém espera que você saiba tudo no primeiro dia."
