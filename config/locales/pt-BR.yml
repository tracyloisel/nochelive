    nature: "Noche Live é um quiz de família para alas de A Igreja de Jesus Cristo dos Santos dos Últimos Dias: noites na sala e jogo no telefone."
    law_title: "A lei"
    law: "Este aviso identifica o prestador segundo a LSSI-CE espanhola (Lei 34/2002). O tratamento dos dados está na política de privacidade."
  privacy:
    title: "Política de privacidade"
    kicker: "Privacidade"
    updated: "Atualizado em 26 de agosto de 2026"
    legal_link: "Aviso legal"
    who:
      title: "Quem responde"
      body: "Noche Live é um site pessoal. Quem responde pelos dados é Tracy Loisel."
    ask:
      title: "O que pedimos — e o que não pedimos"
      body: "Não pedimos RG, e-mail, telefone nem endereço. Se você cria ficha, pedimos um nome de jogo, às vezes um sobrenome, um ano favorito (o que você escolher, para não te confundir com outra pessoa da ala) e um avatar. Você também escolhe a ala. Isso basta para o iPad de casa te reconhecer e para a liga."
      guest: "Você pode jogar sem ficha. Aí não há nome no servidor: só o token deste aparelho."
    purpose:
      title: "Para quê"
      body: "Para rodar o quiz — na rua e numa noite —, lembrar quem joga neste aparelho, guardar o idioma, mostrar a liga da sua ala e, se o telefone permitir, sugerir a capela mais perto."
      basis: "A base jurídica é o artigo 6.1.b do RGPD: o serviço que você pede. Os cookies são técnicos, necessários para esse serviço. Não há decisões automatizadas com efeitos jurídicos. Não vendemos dados nem fazemos publicidade."
    cookies:
      title: "Cookies deste site"
      lede: "O Noche Live coloca cookies assinados neste navegador. São de primeiro partido, HttpOnly e SameSite Lax. Em produção, viajam só por HTTPS."
      third_parties: "Não instalamos cookies de terceiros, nem de anúncio, nem de medição de fora, nem de rede social. As fontes são pedidas ao Google Fonts ao abrir a página: não é cookie de publicidade."
      mute: "Se você silencia o som, essa escolha fica neste telefone. Não vai para os nossos servidores."
      rows:
        device:
          name: "noche_device"
          why: "Um token aleatório para reconhecer este aparelho."
          ttl: "1 ano"
        ward:
          name: "noche_ward"
          why: "A ala em que você joga."
          ttl: "1 ano"
        host:
          name: "noche_ward_host"
          why: "Se você abre a ala como apresentador."
          ttl: "1 ano"
        person:
          name: "noche_street_person"
          why: "Qual ficha está ativa neste aparelho."
          ttl: "1 ano"
        guest:
          name: "noche_street_guest"
          why: "Que você joga sem ficha."
          ttl: "1 ano"
        locale:
          name: "noche_locale"
          why: "O idioma que você escolheu."
          ttl: "1 ano"
        seat:
          name: "noche_player, noche_client"
          why: "O seu lugar numa noite ao vivo."
          ttl: "2 dias"
        presenter:
          name: "noche_presenter"
          why: "O seu lugar de apresentador nessa noite."
          ttl: "1 dia"
        session:
          name: "_nochelive_session"
          why: "Sessão técnica do site, para os formulários não serem forjados."
          ttl: "Até fechar o navegador"
    server:
      title: "Nos nossos servidores"
      body: "A ficha guarda nome, sobrenome se houver, ano favorito, avatar, idioma e ala. O aparelho fica ligado à ficha, com a última vez em que você apareceu na liga. As partidas, respostas e pontos do quiz da rua, e o seu lugar numa noite ao vivo, ficam guardados para o jogo."
    location:
      title: "Localização"
      body: "Se você busca ala com o campo vazio, o telefone pode pedir a sua posição para sugerir a capela mais perto. Essa coordenada serve só para essa busca: não entra na ficha. Se você recusar, busca pelo nome da cidade."
    where:
      title: "Onde fica"
      body: "Os dados vivem em servidores da Render Services, Inc., nos Estados Unidos. Isso é uma transferência internacional. A Render usa as cláusulas contratuais-tipo da Comissão Europeia."
      church: "Se você pede uma visita aos missionários, sai do Noche Live e fala com a Igreja. Nós não recebemos esse formulário. O mesmo se você abre o mapa de capelas ou as escrituras no site deles."
    how_long:
      title: "Por quanto tempo"
      body: "Os cookies duram o que a tabela diz. A ficha, os pontos e as partidas ficam enquanto a ala existir e você não pedir a exclusão. A presença na liga atualiza quando você joga. Os registros do servidor (endereço IP, data) ficam um prazo curto, para o site funcionar e ficar seguro."
    kids:
      title: "Em família"
      body: "O Noche Live se usa em casa, em família. Uma ficha pode ser de uma criança. Não há publicidade dirigida a menores. Na Espanha, se o jogador tem menos de 14 anos, a família cria a ficha neste aparelho."
    rights:
      title: "Os seus direitos"
      body: "Você pode ver os seus dados, corrigi-los, pedir que a gente apague, se opor, limitar o tratamento ou pedir uma cópia. Apagar os cookies deste navegador corta o reconhecimento neste aparelho."
      complain_html: "Se você não concordar, pode reclamar à %{aepd}."
      aepd: "Agência Espanhola de Proteção de Dados"
    write:
      title: "Como escrever"
      body: "Para ver ou apagar os seus dados, escreva para Tracy Loisel."
