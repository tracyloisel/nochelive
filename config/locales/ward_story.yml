es:
  time:
    formats:
      rama_night: "%-d %B · %H:%M"
  ward_story:
    community_name:
      branch: "RAMA %{city}"
      ward: "BARRIO %{city}"
    hero:
      title: "Un lugar para venir, aprender y crecer juntos."
      actions_label: "Opciones de visita · %{community}"
      scroll: "Esta semana"
    actions:
      directions: "Cómo llegar"
      missionaries: "Hablar con los misioneros"
      church: "Ven a la Iglesia"
      maps_hint: "Abrir en Google Maps"
      missionaries_hint: "Enviar un mensaje"
      church_hint: "Descubre qué puedes esperar"
    week:
      kicker: "ESTA SEMANA · LA PALABRA"
      progress: "%{done} / %{total} puertas"
      progress_label: "Puertas completadas: %{done} de %{total}"
      enter: "Entrar en la expedición"
      read: "Leer esta semana"
    night:
      kicker: "NOS VEMOS EL %{weekday}"
      title: "Noche Live"
      open: "Ver la noche"
    circle:
      kicker: "EL CÍRCULO DE %{city}"
      title: "De lo que estamos hablando"
      reply: "Responder"
      open: "Abrir la conversación"
      replies:
        one: "1 respuesta"
        other: "%{count} respuestas"
      privacy: "Solo los miembros de esta comunidad ven estos intercambios."
      empty_title: "Aún no hay conversaciones esta semana."
      empty_body: "Abre una lectura y haz la primera pregunta en %{city}."
      empty_read_only_title: "El Círculo aún está tranquilo esta semana."
      empty_read_only_body: "La próxima conversación del Círculo de %{city} aparecerá aquí."
      empty_action: "Leer esta semana"
    league:
      kicker: "LA COMUNIDAD JUEGA"
      title: "Quién avanza en %{city}"
      players:
        zero: "0 jugadores"
        one: "1 jugador"
        other: "%{count} jugadores"
      rail_label: "Jugadores que van en cabeza en la comunidad"
      you_badge: "TÚ"
      your_rank: "Tú eres #%{rank}"
      gap:
        zero: "Estás empatado con %{name}."
        one: "Te separa 1 corona de %{name}."
        other: "Te separan %{count} coronas de %{name}."
      leading: "Vas en cabeza."
      open: "Ver la clasificación"
      empty: "La aventura de %{city} está a punto de comenzar."
    visit:
      kicker: "VEN A VERNOS"
      title: "Nos vemos en %{city}."
      actions_label: "Preparar una visita"
    admin:
      label: "Herramientas de la comunidad"

