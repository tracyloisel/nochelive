  church:
    title: "Join us at church"
    invite: "Come to the Church of Jesus Christ"
    kicker: "Church"
    menu: "Church of Jesus Christ"
    lede: "Noche Live started in family night. If you want to know The Church of Jesus Christ of Latter-day Saints, these doors are for you."
    doors: "How to come closer"
    meet_title: "Meet a missionary"
    meet_hint: "A visit, always free."
    meet_lede: "Two missionaries can visit you at home, in a park, or on a video call. They listen. It is always free."
    meet_expect: "They will tell you what Sunday feels like, and they can wait for you at the chapel door."
    meet_cta: "Ask for a visit"
    meet_note: "They set up the visit on their site. Noche Live does not keep your phone or your street."
    beliefs_title: "Basic beliefs"
    beliefs_hint: "Jesus Christ at the center."
    beliefs_lede: "All our beliefs look to Jesus Christ. We celebrate His life and His grace, and we invite you to come to Him without rushing."
    missionaries_title: "About missionaries"
    missionaries_hint: "They go two by two."
    missionaries_lede: "They are young people — and sometimes older couples — who leave home for a time to talk about Jesus Christ. They go two by two. If you are not ready, say no. If you open the door, they treat you with respect."
    missionaries_pair: "They can greet you on Sunday. A visit is always free."
    mission:
      call_kicker: "Called by revelation"
      call_title: "They do not choose a destination. They answer a call."
      call_body: "Each young teaching missionary is called by the President of the Church. An Apostle assigns a mission by revelation. Before leaving, the missionary is set apart to represent Jesus Christ."
      grace_kicker: "What they carry"
      grace_title: "Authority in the calling. Power in living it."
      grace_body: "The grace is not their own; it comes from Jesus Christ. Their calling gives authority, while prayer, covenants, and faithful service allow the Holy Ghost to work through them."
      gifts:
        christ_title: "An invitation to come to Christ"
        christ_body: "They help people believe in Jesus Christ, repent, be baptized, receive the Holy Ghost, and endure."
        spirit_title: "A witness carried by the Spirit"
        spirit_body: "They do not force an answer. They teach, listen, and invite; the Holy Ghost confirms truth."
        companion_title: "Two by two"
        companion_body: "They study, pray, and serve with a companion. No one carries a mission alone."
      path_kicker: "Your next step"
      path_title: "What if the call were for you?"
      path_body: "There are teaching and service missions for young people and adults. The journey begins long before a call letter is opened."
      steps:
        prepare_title: "Pray and prepare"
        prepare_body: "Strengthen your faith in Jesus Christ and care for your spiritual, physical, and emotional readiness."
        bishop_title: "Talk with your bishop"
        bishop_body: "He will listen, answer questions, and open the official recommendation process."
        call_title: "Receive your call"
        call_body: "The President of the Church calls you; an Apostle assigns where and how you will serve by revelation."
      cta: "Explore ways to serve"
      source: "Read Preach My Gospel"
    worship_title: "Worship with us"
    worship_hint: "On Sunday the door is open."
    worship_lede: "On Sunday the chapel is open. You do not need to be a member. Come as you would to a family celebration: tidy, not in costume."
    worship_first: "The first hour is sacrament meeting. You do not need to know the hymns."
    worship_cta: "Find a chapel"
    worship:
      overview_kicker: "Two hours to breathe"
      overview_title: "One Sunday, two moments"
      overview_body: "Times vary by congregation, but the rhythm feels familiar: one meeting for everyone, followed by classes for different ages and groups."
      schedule:
        sacrament_title: "Sacrament meeting · about one hour"
        sacrament_body: "The whole congregation sings, prays, and hears talks from members. The sacrament is at the center."
        classes_title: "Classes and conversation · about one hour"
        classes_body: "Children, youth, and adults learn from the scriptures together. If you are unsure where to go, someone will walk with you."
      center_kicker: "The center of Sunday"
      center_title: "Remembering Jesus Christ"
      center_body: "Bread and water are blessed and passed in remembrance of the body and blood of Jesus Christ. It is a moment of quiet, gratitude, and renewal. On a first visit, you may participate or simply pass the tray along. No one will pressure you."
      first_kicker: "Your first visit"
      first_title: "Come without pressure"
      first_body: "You do not need to know the hymns, bring money, or know what to do. Come in, take a seat, and breathe."
      reassurances:
        wear_title: "Come as you are"
        wear_body: "People often dress up a little, but you are welcome in comfortable, respectful clothes."
        alone_title: "You do not have to come alone"
        alone_body: "A member or two missionaries can meet you at the door and sit with you."
        give_title: "No collection plate"
        give_body: "Visitors are not asked to donate. Members make their contributions privately."
      source: "See what Sunday is like"
    official: "Church website"
    back: "The four doors"
    belief:
      christ_title: "Jesus Christ is the Savior"
      christ_body: "Jesus Christ is the Son of God. He suffered and died for all of us, and He rose again. Though He is Savior of the world, He knows you by name. Because of Him you can change, be forgiven, and live with God again."
      father_title: "God loves you"
      father_body: "You are a child of God. He knows you. He wants to hear from you in prayer. When you turn to Him, you find comfort and a way forward."
      plan_title: "Life has purpose"
      plan_body: "Life is not always easy, but God has a plan for each of us. Families sit at the heart of that plan. Death is not the end — it is the close of this stretch of the road."
      word_title: "Two books, one Jesus"
      word_body: "We believe the Bible to be the word of God, as far as it is translated correctly. We also believe the Book of Mormon to be the word of God: another witness of Jesus Christ, written by prophets in the ancient Americas."
      church_title: "His Church is here"
      church_body: "When Jesus was on the earth, He organized His Church with prophets and apostles. We believe that Church was restored. A living prophet leads it today. On Sunday a congregation is waiting to worship and to hold you up."
      christlike_title: "Becoming more like Him"
      christlike_body: "Faith in Jesus Christ, repentance, baptism, and the gift of the Holy Ghost. Forgiveness, hope, charity. We look for whatever is virtuous, lovely, or of good report."
      faq_title: "Questions people ask"
      faq:
        denomination:
          q: "What church is this?"
          a: "We are The Church of Jesus Christ of Latter-day Saints. Some still say “Mormons”; the name we love is Jesus Christ’s."
        wear:
          q: "What should I wear on Sunday?"
          a: "Come as you would to a family celebration: tidy, not in costume. People usually dress up a little, but nobody turns you away for your clothes. Coming in is what matters."
        length:
          q: "How long does it last?"
          a: "Sacrament meeting is about an hour. Classes follow. If it is your first time, stay for that first hour; two missionaries can sit with you."
        donate:
          q: "Do I have to give money?"
          a: "No. Visitors do not pass a plate. Tithing is a private choice for members."
        member:
          q: "What is it like to be a member?"
          a: "We try to follow Jesus Christ: pray, serve, gather on Sunday, care for our families. Nobody expects you to know everything on day one."
