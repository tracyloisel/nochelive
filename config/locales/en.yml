    law_title: "The law"
    law: "This notice names the service provider under Spain’s LSSI-CE (Act 34/2002). How we handle data is in the privacy policy."
  privacy:
    title: "Privacy policy"
    kicker: "Privacy"
    updated: "Updated 28 August 2026"
    legal_link: "Legal notice"
    who:
      title: "Who is responsible"
      body: "Noche Live is a personal site. Tracy Loisel is responsible for the data."
    ask:
      title: "What we ask — and what we don’t"
      body: "We do not ask for ID, email, phone, or a home address. If you make a card, we ask for a play name, sometimes a family name, a favourite year (yours to choose, so we don’t mix you up with someone else in the ward), and an avatar. You also pick a ward. That is enough for the family iPad to know you, and for the league."
      guest: "You can play with no card. Then there is no name on the server — only this device’s token."
    purpose:
      title: "What it is for"
      body: "To run the quiz — on the street and on a night — remember who plays on this device, keep your language, show your ward league, and, if the phone allows it, suggest the nearest chapel."
      basis: "The legal basis is GDPR article 6.1.b: the service you asked for. The cookies are technical, needed for that service. There are no automated decisions with legal effects. We do not sell data or run ads."
    cookies:
      title: "Our cookies"
      lede: "Noche Live sets signed cookies in this browser. They are first-party, HttpOnly, and SameSite Lax. In production they travel only over HTTPS."
      third_parties: "We do not set advertising cookies or use outside analytics. Fonts are fetched from Google Fonts when the page opens. YouTube is not contacted until you agree to open its player; from that point Google may receive technical data or store its own identifiers."
      mute: "If you silence the sound, that choice stays on this phone. It does not go to our servers."
      rows:
        device:
          name: "noche_device"
          why: "A random token so we recognise this device."
          ttl: "1 year"
        ward:
          name: "noche_ward"
          why: "The ward you play in."
          ttl: "1 year"
        host:
          name: "noche_ward_host"
          why: "If you open the ward as presenter."
          ttl: "1 year"
        person:
          name: "noche_street_person"
          why: "Which card is active on this device."
          ttl: "1 year"
        guest:
          name: "noche_street_guest"
          why: "That you are playing with no card."
          ttl: "1 year"
        locale:
          name: "noche_locale"
          why: "The language you chose."
          ttl: "1 year"
        seat:
          name: "noche_player, noche_client"
          why: "Your seat in a live night."
          ttl: "2 days"
        presenter:
          name: "noche_presenter"
          why: "Your presenter seat for that night."
          ttl: "1 day"
        session:
          name: "_nochelive_session"
          why: "A technical session, so forms cannot be forged."
          ttl: "Until you close the browser"
    youtube:
      title: "YouTube videos"
      body: "The video library shows titles and thumbnails from the Church’s official channel. Thumbnails pass through Noche Live. The player uses YouTube’s privacy-enhanced domain and loads only after you choose to continue."
      choice: "We remember that choice only in this browser’s local storage under noche_youtube_consent. You can withdraw it by clearing this site’s data. Watching a video never awards crowns or changes your progress."
    push:
      title: "Notifications you choose"
      body: "If you ask for them, we store the Web Push endpoint and public subscription keys in encrypted form. We also keep the linked profile and device, language, time zone, browser family, the types you chose, frequency, time, consent dates, and the technical status of each delivery and open."
      basis: "The legal basis is your specific consent under GDPR Article 6(1)(a). Challenges, verses, and Noche Live reminders are chosen separately, are never preselected, and each choice is as easy to withdraw as it was to give. System permission only opens the technical channel; by itself, it does not allow us to send you anything."
      screen: "A notification may appear on your Lock Screen. Its text is therefore short and does not reveal private spiritual reading or more personal detail than needed. Tapping it opens the matching passage, reading, challenge, or Noche Live entrance directly."
      providers: "Render stores the subscription and the job queue. To deliver a notification, the encrypted endpoint is used with your browser or operating system’s push service, which may be operated by Apple, Google, Mozilla, or another browser provider. Noche Live does not sell this data or use it for advertising."
      retention: "We keep a subscription while your choices remain active. An endpoint that reports it no longer exists is revoked immediately and deleted after 30 days. Technical delivery and open records are deleted after 90 days. You can turn off one type or this device from your profile."
    server:
      title: "On our servers"
      body: "A card stores name, family name if there is one, favourite year, avatar, language, and ward. The device is tied to the card, with the last time you were seen in the league. Street-quiz runs, answers, and crowns, and your seat in a live night, are stored for the game."
    location:
      title: "Location"
      body: "If you search for a ward with the field empty, the phone may ask for your position to suggest the nearest chapel. That coordinate is used only for that search: it is not saved on the card. If you say no, you search by town name."
    where:
      title: "Where it lives"
      body: "The data lives on servers at Render Services, Inc., in the United States. That is an international transfer. Render uses the European Commission’s standard contractual clauses."
      church: "If you ask missionaries for a visit, you leave Noche Live and talk with the Church. We never see that form. The same if you open the chapel map or the scriptures on their site."
    how_long:
      title: "How long"
      body: "Cookies last as long as the table says. The card, scores, and runs stay while the ward exists and you have not asked us to delete them. League presence updates when you play. Server logs (IP address, date) are kept a short time, so the site can run and stay safe."
    kids:
      title: "Family night"
      body: "Noche Live is used at home, as a family. A card can belong to a child. There is no advertising aimed at children. In Spain, if the player is under 14, the family makes the card on this device."
    rights:
      title: "Your rights"
      body: "You can see your data, correct it, ask us to delete it, object, limit the processing, or ask for a copy. Clearing this browser’s cookies stops recognition on this device."
      complain_html: "If you disagree, you can complain to the %{aepd}."
      aepd: "Spanish Data Protection Agency"
    write:
      title: "How to write"
      body: "To see or delete your data, write to Tracy Loisel."
