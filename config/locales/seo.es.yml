      pages:
        home:
          title: "Noche Live — Juegos bíblicos, actividades cristianas y estudio"
          description: "Descubre juegos bíblicos, actividades cristianas para jóvenes y familias, y recorridos de estudio de las Escrituras con Noche Live."
          kicker: "Una aventura bíblica compartida"
          h1: "La Biblia se vive mejor juntos"
          lede: "Noche Live convierte las Escrituras en una aventura de preguntas, retos, historias y encuentros. Juega a solas, con tu familia, con tus amigos o durante una noche de la Iglesia."
          cta: "Jugar ahora"
          card_title: "Descubrir Noche Live"
          card_body: "Juegos, estudio y comunidad en una sola aventura."
          sections:
            - title: "Juega, no solo leas"
              body: "Cada pregunta abre una historia bíblica. Los puntos, las coronas y los retos dan ganas de seguir, pero la victoria verdadera es reconocer mejor a los profetas, los reyes y, sobre todo, acercarse a Jesucristo."
            - title: "Una experiencia para la sala entera"
              body: "Noche Live funciona en el móvil y también reúne a la gente. Una familia puede jugar desde el sofá; una clase de jóvenes puede competir por equipos; una congregación puede vivir una noche con presentador y pantalla grande."
            - title: "Aprender con un próximo paso"
              body: "Después del juego puedes abrir el pasaje, seguir un programa semanal o hablar con alguien de la Iglesia. Nada obliga ni mete prisa: cada puerta está ahí para ayudarte a continuar cuando tú quieras."
        bible_games:
          title: "Juegos bíblicos para jóvenes, familias y grupos | Noche Live"
          description: "Juegos bíblicos gratuitos con preguntas, retos, equipos y aventuras para jóvenes, familias, clases y grupos cristianos."
          kicker: "Juegos bíblicos"
          h1: "Juegos que hacen que todos miren, rían y recuerden"
          lede: "No es una ficha escolar con un botón de validar. Son preguntas rápidas, desafíos de equipo y momentos que convierten una historia bíblica en algo que la sala vive junta."
          cta: "Abrir los juegos"
          card_title: "Juegos bíblicos"
          card_body: "Preguntas, retos y aventura para jugar juntos."
          sections:
            - title: "Preguntas con una historia detrás"
              body: "Cada respuesta se conecta con un pasaje real. Puedes adivinar, sorprenderte y abrir las Escrituras para entender por qué David, Ester, Moisés o Elías tomaron aquella decisión."
            - title: "Del móvil a la sala"
              body: "El teléfono sirve para elegir, votar o pulsar. La atención vuelve a las personas: comentar una respuesta, celebrar una racha, ayudar al equipo y escuchar la revelación del presentador."
            - title: "Para una persona o para cincuenta"
              body: "Juega una partida corta a solas, lanza un desafío a un amigo o prepara una noche completa para jóvenes y familias. El ritmo cambia; la aventura y el lenguaje cercano se mantienen."
        bible_quiz:
          title: "Trivia bíblica gratuita con respuestas | Noche Live"
          description: "Pon a prueba lo que sabes con una trivia bíblica gratuita, respuestas explicadas y enlaces directos a los pasajes."
          kicker: "Trivia bíblica"
          h1: "¿Cuánto recuerdas de la Biblia?"
          lede: "Responde rápido, descubre lo que eligieron otros jugadores y abre el versículo cuando una historia te sorprenda. Cada error también es una puerta para aprender."
          cta: "Empezar la trivia"
          card_title: "Trivia bíblica"
          card_body: "Preguntas rápidas con respuesta y pasaje."
          sections:
            - title: "Reyes, profetas y decisiones"
              body: "Las preguntas recorren personajes, lugares, promesas y momentos decisivos. No hace falta ser experto: la dificultad crece poco a poco y siempre puedes volver al texto bíblico."
            - title: "Una respuesta que deja huella"
              body: "Después de elegir llega la revelación, la explicación y el pasaje. Así la respuesta correcta no se queda en una letra: se convierte en una escena que puedes recordar."
            - title: "Rachas, estrellas y desafíos"
              body: "Las recompensas hacen visible tu progreso. Puedes superar tu propia marca o retar a alguien sin convertir el aprendizaje en un examen frío."
        group_activities:
          title: "Actividades cristianas para grupos y familias | Noche Live"
          description: "Ideas de actividades cristianas para jóvenes, familias, clases y grupos: juegos bíblicos, equipos, conversación y momentos de fe."
          kicker: "Actividades cristianas"
          h1: "Una actividad que reúne de verdad"
          lede: "Cuando todos llegan cansados, una buena actividad necesita una consigna clara, un comienzo rápido y algo que compartir. Noche Live pone el juego al servicio del encuentro."
          cta: "Preparar una actividad"
          card_title: "Actividades cristianas"
          card_body: "Ideas para reunir, jugar y conversar."
          sections:
            - title: "Empieza en menos de dos minutos"
              body: "Un código corto permite entrar desde el móvil. El presentador ve el ritmo de la sala y puede alternar preguntas, movimientos, votos y desafíos sin repartir papeles ni explicar reglas eternas."
            - title: "Todos encuentran un lugar"
              body: "Hay momentos para quien sabe mucho, para quien acaba de llegar, para quien habla fuerte y para quien prefiere observar. Los equipos ayudan a que nadie cargue solo con la respuesta."
            - title: "La conversación continúa"
              body: "Una sorpresa del juego puede abrir una conversación sobre valor, servicio, fe o Jesucristo. La actividad no reemplaza ese momento: lo prepara y le da una historia compartida."
        youth_activities:
          title: "Actividades cristianas para jóvenes que sí enganchan | Noche Live"
          description: "Actividades cristianas dinámicas para jóvenes: juegos bíblicos por equipos, retos, preguntas y una experiencia fácil de presentar."
          kicker: "Actividades para jóvenes"
          h1: "Menos explicación. Más jugar juntos."
          lede: "Los jóvenes entienden en segundos qué tienen que hacer. El móvil se convierte en mando, la sala en escenario y las Escrituras en el lugar donde nace cada reto."
          cta: "Lanzar una noche"
          card_title: "Actividades para jóvenes"
          card_body: "Ritmo, equipos y fe sin ambiente de clase."
          sections:
            - title: "Un comienzo que no pierde a nadie"
              body: "Entrar con un código, escoger equipo y empezar. La interfaz da una acción clara y el presentador conserva el control del ritmo para evitar esperas y discursos largos."
            - title: "Competir sin dejar a nadie fuera"
              body: "Puntos y coronas crean tensión, pero las pruebas mezclan memoria, intuición, movimiento y cooperación. Diferentes talentos pueden salvar al equipo."
            - title: "Una noche que merece repetirse"
              body: "La progresión, los recuerdos de la parroquia y los nuevos mundos crean una próxima cita. Los jóvenes no reciben otra plataforma: sienten que forman parte de una aventura común."
        bible_study:
          title: "Estudio bíblico sencillo, semanal y compartido | Noche Live"
          description: "Sigue un estudio bíblico semanal con lecturas, preguntas, progreso y comunidad. Una forma sencilla de volver a las Escrituras."
          kicker: "Estudio bíblico"
          h1: "Una semana, un pasaje, un paso más"
          lede: "El estudio no necesita empezar con una hora libre. Lee el pasaje, responde unas preguntas y guarda tu avance. La próxima vez sabrás exactamente por dónde continuar."
          cta: "Abrir el programa"
          card_title: "Estudio bíblico"
          card_body: "Lectura semanal, preguntas y progreso."
          sections:
            - title: "Primero, el texto"
              body: "Cada unidad comienza con una lectura concreta. El lector destaca la referencia y mantiene el capítulo cerca para que una pregunta nunca sustituya a las Escrituras."
            - title: "Preguntas para mirar mejor"
              body: "No se trata solo de recordar nombres. Las preguntas llaman la atención sobre una promesa, una decisión o una imagen del pasaje y ayudan a volver a leer con más intención."
            - title: "Un camino visible"
              body: "Tu historial muestra lo que ya recorriste. También puedes ver cómo avanza tu comunidad, celebrar a quienes terminaron y retomar sin empezar de cero."
        psalms_study:
          title: "Estudio de los Salmos: lectura y preguntas semanales | Noche Live"
          description: "Lee y estudia los Salmos con un recorrido semanal, preguntas breves y un progreso fácil de retomar."
          kicker: "Los Salmos"
          h1: "Palabras para orar cuando faltan las palabras"
          lede: "Los Salmos hablan desde la alegría, el miedo, la gratitud y la espera. Este recorrido semanal te ayuda a leerlos despacio y reconocer una frase para llevar contigo."
          cta: "Estudiar los Salmos"
          card_title: "Recorrido por los Salmos"
          card_body: "Una lectura semanal para orar y recordar."
          sections:
            - title: "Una voz humana delante de Dios"
              body: "Los salmistas no esconden lo que sienten. Al leerlos encuentras alabanza, preguntas, arrepentimiento y confianza expresados con palabras que todavía hoy pueden acompañar una oración."
            - title: "Lee el salmo en contexto"
              body: "Cada semana abre el pasaje completo antes de las preguntas. Puedes detenerte en una imagen, volver a un versículo y seguir el hilo sin convertir la lectura en una prueba."
            - title: "Guarda una luz para la semana"
              body: "Terminar una unidad deja visible el camino recorrido. Más importante aún, permite escoger una verdad o una frase del salmo para recordarla cuando vuelva a hacer falta."
