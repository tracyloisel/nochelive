  church:
    title: "Viens à l’église"
    invite: "Viens à l’église de Jésus-Christ"
    kicker: "Église"
    menu: "Église de Jésus-Christ"
    lede: "Noche Live est né des soirées en famille. Si tu veux connaître l’Église de Jésus-Christ des Saints des Derniers Jours, ces portes sont pour toi."
    doors: "Comment t’approcher"
    meet_title: "Parler à un missionnaire"
    meet_hint: "Une visite, toujours gratuite."
    meet_lede: "Deux missionnaires peuvent te voir à la maison, dans un parc ou en visio. Ils t’écoutent. C’est toujours gratuit."
    meet_expect: "Ils t’expliquent le dimanche, et peuvent t’attendre à la porte de la chapelle."
    meet_cta: "Demander une visite"
    meet_note: "Ils organisent la visite sur leur site. Noche Live ne garde ni ton téléphone ni ta rue."
    beliefs_title: "Croyances"
    beliefs_hint: "Jésus-Christ au centre."
    beliefs_lede: "Toutes nos croyances regardent vers Jésus-Christ. Nous célébrons sa vie et sa grâce, et nous t’invitons à t’approcher de Lui sans te presser."
    missionaries_title: "Les missionnaires"
    missionaries_hint: "Ils vont deux par deux."
    missionaries_lede: "Ce sont des jeunes — parfois des couples plus âgés — qui quittent la maison un temps pour parler de Jésus-Christ. Ils vont deux par deux. Si tu ne veux pas, tu dis non ; si tu ouvres, ils te respectent."
    missionaries_pair: "Ils peuvent te saluer le dimanche. La visite est toujours gratuite."
    mission:
      call_kicker: "Appelés par révélation"
      call_title: "Ils ne choisissent pas une destination. Ils répondent à un appel."
      call_body: "Chaque jeune missionnaire d’enseignement est appelé par le président de l’Église. Un apôtre lui attribue une mission par révélation. Avant son départ, il est mis à part pour représenter Jésus-Christ."
      grace_kicker: "Ce qu’ils portent"
      grace_title: "De l’autorité dans l’appel. De la puissance en le vivant."
      grace_body: "Cette grâce ne leur appartient pas : elle vient de Jésus-Christ. Leur appel leur confère une autorité ; la prière, les alliances et un service fidèle permettent au Saint-Esprit d’agir par eux."
      gifts:
        christ_title: "Une invitation à venir au Christ"
        christ_body: "Ils aident chacun à croire en Jésus-Christ, se repentir, être baptisé, recevoir le Saint-Esprit et persévérer."
        spirit_title: "Un témoignage porté par l’Esprit"
        spirit_body: "Ils ne forcent aucune réponse. Ils enseignent, écoutent et invitent ; le Saint-Esprit confirme la vérité."
        companion_title: "Deux par deux"
        companion_body: "Ils étudient, prient et servent avec un compagnon. Personne ne porte seul sa mission."
      path_kicker: "Ton prochain pas"
      path_title: "Et si cet appel était pour toi ?"
      path_body: "Il existe des missions d’enseignement et de service, pour les jeunes comme pour les adultes. Le chemin commence bien avant l’ouverture d’une lettre."
      steps:
        prepare_title: "Prie et prépare-toi"
        prepare_body: "Fortifie ta foi en Jésus-Christ et prends soin de ta préparation spirituelle, physique et émotionnelle."
        bishop_title: "Parle à ton évêque"
        bishop_body: "Il t’écoute, répond à tes questions et ouvre le processus officiel de recommandation."
        call_title: "Reçois ton appel"
        call_body: "Le président de l’Église t’appelle ; un apôtre attribue par révélation le lieu et la manière de servir."
      cta: "Découvrir comment servir"
      source: "Lire Prêchez mon Évangile"
    worship_title: "Viens adorer"
    worship_hint: "Le dimanche, la porte est ouverte."
    worship_lede: "Le dimanche, la chapelle est ouverte. Pas besoin d’être membre. Viens comme à une fête de famille : correct, sans déguisement."
    worship_first: "La première heure, c’est la réunion de Sainte-Cène. Pas besoin de connaître les cantiques."
    worship_cta: "Trouver une chapelle"
    worship:
      overview_kicker: "Deux heures pour respirer"
      overview_title: "Un dimanche, deux moments"
      overview_body: "Les horaires varient selon les assemblées, mais le parcours reste familier : une réunion pour tous, puis des classes par âge ou par groupe."
      schedule:
        sacrament_title: "Réunion de Sainte-Cène · environ une heure"
        sacrament_body: "Toute l’assemblée chante, prie et écoute des discours donnés par des membres. Au centre se trouve la Sainte-Cène."
        classes_title: "Classes et échanges · environ une heure"
        classes_body: "Enfants, jeunes et adultes étudient les Écritures ensemble. Si tu ne sais pas où aller, quelqu’un t’accompagnera."
      center_kicker: "Le centre du dimanche"
      center_title: "Se souvenir de Jésus-Christ"
      center_body: "Du pain et de l’eau sont bénis et distribués en souvenir du corps et du sang de Jésus-Christ. C’est un moment de silence, de gratitude et de renouvellement. Pour une première visite, tu peux participer ou simplement passer le plateau : personne ne te pousse."
      first_kicker: "Ta première fois"
      first_title: "Viens sans pression"
      first_body: "Pas besoin de connaître les cantiques, d’apporter de l’argent ou de savoir quoi faire. Entre, assieds-toi et respire."
      reassurances:
        wear_title: "Viens comme tu es"
        wear_body: "Les gens s’habillent souvent un peu, mais tu es bienvenu dans une tenue confortable et respectueuse."
        alone_title: "Tu n’as pas besoin de venir seul"
        alone_body: "Un membre ou deux missionnaires peuvent t’attendre à la porte et s’asseoir avec toi."
        give_title: "Aucune corbeille ne circule"
        give_body: "Les visiteurs n’ont rien à donner. Les contributions des membres se font en privé."
      source: "Découvrir un dimanche avec nous"
    official: "Page de l’Église"
    back: "Les quatre portes"
    belief:
      christ_title: "Jésus-Christ est le Sauveur"
      christ_body: "Jésus-Christ est le Fils de Dieu. Il a souffert et est mort pour tous, puis il est ressuscité. Même s’il est le Sauveur du monde, il te connaît par ton nom. Grâce à Lui, tu peux changer, être pardonné, et vivre de nouveau avec Dieu."
      father_title: "Dieu t’aime"
      father_body: "Tu es enfant de Dieu. Il te connaît. Il veut t’entendre dans la prière. Quand tu te tournes vers Lui, tu trouves du réconfort et un chemin."
      plan_title: "La vie a un sens"
      plan_body: "La vie n’est pas toujours facile, mais Dieu a un plan pour chacun. Les familles sont au cœur de ce plan. La mort n’est pas la fin : c’est la clôture de ce bout de route."
      word_title: "Deux livres, un Jésus"
      word_body: "Nous croyons que la Bible est la parole de Dieu, traduite correctement. Nous croyons aussi que le Livre de Mormon est la parole de Dieu : un autre témoin de Jésus-Christ, écrit par des prophètes dans les Amériques anciennes."
      church_title: "Son Église est là"
      church_body: "Quand Jésus était sur la terre, il a organisé son Église avec des prophètes et des apôtres. Nous croyons que cette Église a été rétablie. Un prophète vivant la dirige aujourd’hui. Le dimanche, une assemblée t’attend pour adorer et te porter."
      christlike_title: "Nous ressembler davantage à Lui"
      christlike_body: "La foi en Jésus-Christ, le repentir, le baptême, et le don du Saint-Esprit. Le pardon, l’espérance, la charité. Nous cherchons ce qui est vertueux, beau, digne de louange."
      faq_title: "Questions qu’on pose souvent"
      faq:
        denomination:
          q: "Quelle Église êtes-vous ?"
          a: "Nous sommes l’Église de Jésus-Christ des Saints des Derniers Jours. On dit encore parfois « mormons » ; le nom que nous aimons, c’est celui de Jésus-Christ."
        wear:
          q: "Je m’habille comment, le dimanche ?"
          a: "Viens comme à une fête de famille : correct, sans déguisement. Les gens s’habillent un peu, mais personne ne te renvoie pour tes vêtements. L’important, c’est d’entrer."
        length:
          q: "Ça dure combien de temps ?"
          a: "La réunion de Sainte-Cène dure environ une heure. Ensuite, il y a des classes. Si c’est ta première fois, reste cette première heure ; deux missionnaires peuvent s’asseoir avec toi."
        donate:
          q: "Est-ce que je dois donner de l’argent ?"
          a: "Non. Les visiteurs ne font pas passer de corbeille. La dîme, c’est un choix privé des membres."
        member:
          q: "C’est comment, d’être membre ?"
          a: "On essaie de suivre Jésus-Christ : prier, servir, se réunir le dimanche, soigner la famille. Personne n’attend que tu saches tout dès le premier jour."
