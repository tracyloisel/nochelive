    born: "Le projet est né le lundi 24 août 2026, pour la soirée en famille de notre Rama de Benidorm : Rois et prophètes, le samedi 29 août."
    source: "Je partage le code source, libre, sur GitHub. Si un développeur veut m’aider, il est le bienvenu : qu’il ouvre une Pull Request."
    purse: "Je finance sur mes deniers le développement, l’hébergement, les visuels, les questions et les modèles d’IA."
    association: "Je prévois de créer une association pour recueillir des fonds et porter le jeu vers plus de paroisses."
    disclaimer: "L’Église de Jésus-Christ des Saints des Derniers Jours, et en particulier la Rama de Benidorm, ne peuvent être tenues pour responsables de cette plateforme ni de son contenu : c’est une initiative totalement privée."
