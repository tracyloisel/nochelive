  privacy:
    title: "Politique de confidentialité"
    kicker: "Confidentialité"
    updated: "Mis à jour le 26 août 2026"
    legal_link: "Mentions légales"
    who:
      title: "Qui est responsable"
      body: "Noche Live est un site personnel. Tracy Loisel est responsable des données."
    ask:
      title: "Ce qu’on te demande — et ce qu’on ne demande pas"
      body: "On ne demande ni pièce d’identité, ni courriel, ni téléphone, ni adresse. Si tu crées une fiche, on demande un prénom de jeu, parfois un nom de famille, une année favorite (celle que tu choisis, pour ne pas te confondre avec quelqu’un d’autre dans la paroisse) et un avatar. Tu choisis aussi ta paroisse. Ça suffit pour que l’iPad de la maison te reconnaisse, et pour la ligue."
      guest: "Tu peux jouer sans fiche. Alors il n’y a pas de nom sur le serveur : seulement le jeton de cet appareil."
    purpose:
      title: "À quoi ça sert"
      body: "Pour faire tourner le quiz — dans la rue et pendant une soirée —, se souvenir de qui joue sur cet appareil, garder la langue, montrer la ligue de ta paroisse et, si le téléphone le permet, proposer la chapelle la plus proche."
      basis: "La base juridique est l’article 6.1.b du RGPD : le service que tu demandes. Les cookies sont techniques, nécessaires à ce service. Il n’y a pas de décisions automatisées aux effets juridiques. On ne vend pas les données et on ne fait pas de publicité."
    cookies:
      title: "Cookies du site"
      lede: "Noche Live pose des cookies signés dans ce navigateur. Ils sont propres au site, HttpOnly et SameSite Lax. En production, ils ne voyagent qu’en HTTPS."
      third_parties: "On n’installe pas de cookies tiers, ni de cookies pub, ni d’analytique étrangère, ni de cookies de réseaux sociaux. Les polices sont demandées à Google Fonts à l’ouverture de la page : ce n’est pas un cookie publicitaire."
      mute: "Si tu coupes le son, ce choix reste sur ce téléphone. Il ne part pas vers nos serveurs."
      rows:
        device:
          name: "noche_device"
          why: "Un jeton au hasard pour reconnaître cet appareil."
          ttl: "1 an"
        ward:
          name: "noche_ward"
          why: "La paroisse dans laquelle tu joues."
          ttl: "1 an"
        host:
          name: "noche_ward_host"
          why: "Si tu ouvres la paroisse comme présentateur."
          ttl: "1 an"
        person:
          name: "noche_street_person"
          why: "Quelle fiche est active sur cet appareil."
          ttl: "1 an"
        guest:
          name: "noche_street_guest"
          why: "Que tu joues sans fiche."
          ttl: "1 an"
        locale:
          name: "noche_locale"
          why: "La langue que tu as choisie."
          ttl: "1 an"
        seat:
          name: "noche_player, noche_client"
          why: "Ta place dans une soirée en direct."
          ttl: "2 jours"
        presenter:
          name: "noche_presenter"
          why: "Ta place de présentateur pour cette soirée."
          ttl: "1 jour"
        session:
          name: "_nochelive_session"
          why: "Une session technique, pour que les formulaires ne soient pas falsifiés."
          ttl: "Jusqu’à la fermeture du navigateur"
    server:
      title: "Chez nous"
      body: "La fiche garde le prénom, le nom s’il y en a un, l’année favorite, l’avatar, la langue et la paroisse. L’appareil est lié à la fiche, avec la dernière fois où on t’a vu dans la ligue. Les parties, réponses et points du quiz de rue, et ta place dans une soirée, sont gardés pour le jeu."
    location:
      title: "Position"
      body: "Si tu cherches une paroisse sans rien taper, le téléphone peut demander ta position pour proposer la chapelle la plus proche. Cette coordonnée sert seulement à cette recherche : elle n’est pas gravée sur la fiche. Si tu refuses, tu cherches par le nom du village."
    where:
      title: "Où ça vit"
      body: "Les données vivent sur les serveurs de Render Services, Inc., aux États-Unis. C’est un transfert international. Render s’appuie sur les clauses contractuelles types de la Commission européenne."
      church: "Si tu demandes une visite aux missionnaires, tu quittes Noche Live et tu parles à l’Église. Nous ne recevons pas ce formulaire. Pareil si tu ouvres la carte des chapelles ou les Écritures sur leur site."
    how_long:
      title: "Combien de temps"
      body: "Les cookies durent ce qu’indique le tableau. La fiche, les points et les parties restent tant que la paroisse existe et que tu n’as pas demandé l’effacement. La présence dans la ligue se met à jour quand tu joues. Les journaux du serveur (adresse IP, date) se gardent un temps court, pour que le site tourne et reste sûr."
    kids:
      title: "En famille"
      body: "Noche Live se joue à la maison, en famille. Une fiche peut être celle d’un enfant. Il n’y a pas de publicité dirigée vers les mineurs. En Espagne, si le joueur a moins de 14 ans, c’est la famille qui crée la fiche sur cet appareil."
    rights:
      title: "Tes droits"
      body: "Tu peux voir tes données, les corriger, demander qu’on les efface, t’y opposer, limiter le traitement ou en demander une copie. Effacer les cookies de ce navigateur coupe la reconnaissance sur cet appareil."
      complain_html: "Si tu n’es pas d’accord, tu peux saisir l’%{aepd}."
      aepd: "Agence espagnole de protection des données"
    write:
      title: "Nous écrire"
      body: "Pour voir ou effacer tes données, écris à Tracy Loisel."
