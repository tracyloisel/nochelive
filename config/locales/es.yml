  church:
    title: "Ven a la iglesia"
    invite: "Ven a la Iglesia de Jesucristo"
    kicker: "Iglesia"
    menu: "Iglesia de Jesucristo"
    lede: "Noche Live nace en las Noches de Hogar. Si quieres conocer la Iglesia de Jesucristo de los Santos de los Últimos Días, estas puertas son para ti."
    doors: "Cómo acercarte"
    meet_title: "Hablar con un misionero"
    meet_hint: "Una visita, siempre gratis."
    meet_lede: "Dos misioneros pueden verte en casa, en un parque o por videollamada. Te escuchan. No cobran nada."
    meet_expect: "Te explican qué esperar el domingo y pueden esperarte en la puerta de la capilla."
    meet_cta: "Pedir una visita"
    meet_note: "Ellos organizan la visita en su página. Noche Live no guarda tu teléfono ni tu calle."
    beliefs_title: "Creencias"
    beliefs_hint: "Jesucristo al centro."
    beliefs_lede: "Todas nuestras creencias miran a Jesucristo. Celebramos su vida y su gracia, y te invitamos a acercarte a Él sin prisa."
    missionaries_title: "Los misioneros"
    missionaries_hint: "Van de dos en dos."
    missionaries_lede: "Son jóvenes —y a veces parejas mayores— que dejan casa un tiempo para hablar de Jesucristo. Van de dos en dos. Si no quieres, dices que no; si abres, te tratan con respeto."
    missionaries_pair: "Pueden saludarte el domingo. La visita es siempre gratis."
    worship_title: "Ven a adorar"
    worship_hint: "El domingo, la puerta está abierta."
    worship_lede: "El domingo la capilla está abierta. No hace falta ser miembro. Ven como a una fiesta de familia: con decencia, sin disfraz."
    worship_first: "La primera hora es la reunión sacramental. No hace falta saber los himnos."
    worship_cta: "Buscar una capilla"
    official: "Página de la Iglesia"
    back: "Las cuatro puertas"
    belief:
      christ_title: "Jesucristo es el Salvador"
      christ_body: "Jesucristo es el Hijo de Dios. Sufrió y murió por todos, y resucitó. Aunque es el Salvador del mundo, te conoce por tu nombre. Por Él puedes cambiar, ser perdonado y volver a vivir con Dios."
      father_title: "Dios te quiere"
      father_body: "Eres hijo o hija de Dios. Él te conoce. Quiere oírte en la oración. Cuando te vuelves hacia Él, encuentras consuelo y rumbo."
      plan_title: "La vida tiene sentido"
      plan_body: "La vida no siempre es fácil, pero Dios tiene un plan para cada uno. Las familias están en el centro de ese plan. La muerte no es el final: es el cierre de este tramo."
      word_title: "Dos libros, un Jesús"
      word_body: "Creemos que la Biblia es la palabra de Dios, traducida correctamente. También creemos que el Libro de Mormón es la palabra de Dios: otro testigo de Jesucristo, escrito por profetas en las Américas antiguas."
      church_title: "Su Iglesia está hoy"
      church_body: "Cuando Jesús estuvo en la tierra, organizó su Iglesia con profetas y apóstoles. Creemos que esa Iglesia fue restaurada. Hoy hay un profeta vivo. El domingo te espera una comunidad que adora y se sostiene."
      christlike_title: "Parecernos más a Él"
      christlike_body: "Fe en Jesucristo, arrepentimiento, bautismo, y el don del Espíritu Santo. Perdón, esperanza, caridad. Buscamos lo virtuoso, lo bello, lo digno de alabanza."
      faq_title: "Preguntas de siempre"
      faq:
        denomination:
          q: "¿Qué iglesia sois?"
          a: "Somos La Iglesia de Jesucristo de los Santos de los Últimos Días. A veces nos llaman «mormones»; el nombre que amamos es el de Jesucristo."
        wear:
          q: "¿Qué me pongo el domingo?"
          a: "Ven como a una fiesta de familia: decente, sin disfraz. La gente suele ir arreglada, pero nadie te echa por la ropa. Lo importante es entrar."
        length:
          q: "¿Cuánto dura?"
          a: "La reunión sacramental dura alrededor de una hora. Después hay clases. Si es tu primera vez, quédate la primera hora; dos misioneros pueden sentarse contigo."
        donate:
          q: "¿Tengo que dar dinero?"
          a: "No. Los visitantes no pasan bandeja. El diezmo es una decisión de los miembros, en privado."
        member:
          q: "¿Cómo se vive siendo miembro?"
          a: "Intentamos seguir a Jesucristo: orar, servir, reunirnos el domingo, cuidar la familia. Nadie espera que lo sepas todo el primer día."
  about:
