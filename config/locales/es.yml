    gift: "Noche Live es un regalo. Tracy Loisel, de la Rama de Benidorm en España, líder de la obra misional, lo ofrece gratis a todos los miembros."
    born: "El proyecto nació el lunes 24 de agosto de 2026, para la Noche de Hogar de nuestra Rama de Benidorm: Reyes y Profetas, el sábado 29 de agosto."
    source: "Comparto el código en GitHub, libre para todos. Si un desarrollador quiere echar una mano, es bienvenido: que abra un Pull Request."
    purse: "Pago de mi bolsillo el desarrollo, el alojamiento, las imágenes, las preguntas y los modelos de IA."
    association: "Quiero crear una asociación para recoger fondos y llevar el juego a más ramas."
    disclaimer: "La Iglesia de Jesucristo de los Santos de los Últimos Días, y en particular la Rama de Benidorm, no responden de esta plataforma ni de su contenido: es una iniciativa totalmente privada."
