    nature: "Noche Live es un quiz familiar para ramas de La Iglesia de Jesucristo de los Santos de los Últimos Días: noches en sala y juego en el teléfono."
    law_title: "Normativa"
    law: "Este aviso identifica al prestador según la LSSI-CE (Ley 34/2002). Cómo tratamos los datos está en la política de privacidad."
  privacy:
    title: "Política de privacidad"
    kicker: "Privacidad"
    updated: "Actualizado el 26 de agosto de 2026"
    legal_link: "Aviso legal"
    who:
      title: "Quién responde"
      body: "Noche Live es un sitio personal. Quien responde de los datos es Tracy Loisel."
    ask:
      title: "Qué pedimos y qué no"
      body: "No pedimos DNI, correo, teléfono ni domicilio. Si creas ficha, pedimos un nombre de juego, a veces un apellido, un año favorito (el que elijas, para no confundirte con otra persona de la rama) y un avatar. También eliges rama. Eso basta para que el iPad de casa te reconozca y para la liga."
      guest: "Puedes jugar sin ficha. Entonces no hay nombre en el servidor: solo el token de este aparato."
    purpose:
      title: "Para qué"
      body: "Para prestar el quiz —en la calle y en una noche—, recordar quién juega en este aparato, guardar el idioma, mostrar la liga de tu rama y, si el teléfono lo permite, sugerir la capilla cercana."
      basis: "La base jurídica es el artículo 6.1.b del RGPD: el servicio que pides. Las cookies son técnicas, necesarias para ese servicio. No hay decisiones automatizadas con efectos jurídicos. No vendemos datos ni hacemos publicidad."
    cookies:
      title: "Cookies propias"
      lede: "Noche Live pone cookies firmadas en este navegador. Son de primer partido, HttpOnly y SameSite Lax. En producción viajan solo por HTTPS."
      third_parties: "No instalamos cookies de terceros, ni de anuncios, ni de analítica ajena, ni de redes sociales. Las tipografías se piden a Google Fonts al abrir la página: no es una cookie de publicidad."
      mute: "Si silencias el sonido, esa preferencia se guarda en este teléfono. No viaja a nuestros servidores."
      rows:
        device:
          name: "noche_device"
          why: "Un token aleatorio para reconocer este aparato."
          ttl: "1 año"
        ward:
          name: "noche_ward"
          why: "La rama en la que juegas."
          ttl: "1 año"
        host:
          name: "noche_ward_host"
          why: "Si abres la rama como presentador."
          ttl: "1 año"
        person:
          name: "noche_street_person"
          why: "Qué ficha está activa en este aparato."
          ttl: "1 año"
        guest:
          name: "noche_street_guest"
          why: "Que juegas sin ficha."
          ttl: "1 año"
        locale:
          name: "noche_locale"
          why: "El idioma que elegiste."
          ttl: "1 año"
        seat:
          name: "noche_player, noche_client"
          why: "Tu asiento en una noche en vivo."
          ttl: "2 días"
        presenter:
          name: "noche_presenter"
          why: "Tu asiento de presentador en esa noche."
          ttl: "1 día"
        session:
          name: "_nochelive_session"
          why: "Sesión técnica del sitio, para que los formularios no se falsifiquen."
          ttl: "Hasta cerrar el navegador"
    server:
      title: "En nuestros servidores"
      body: "La ficha guarda nombre, apellido si lo hay, año favorito, avatar, idioma y rama. El aparato queda ligado a la ficha, con la última vez que se te vio en la liga. Las partidas, respuestas y puntos del quiz callejero, y el asiento en una noche en vivo, se guardan para el juego."
    location:
      title: "Ubicación"
      body: "Si buscas rama y dejas el campo vacío, el teléfono puede pedir tu posición para sugerir la capilla más cercana. Esa coordenada sirve solo para esa búsqueda: no se graba en la ficha. Si dices que no, buscas por el nombre del pueblo."
    where:
      title: "Dónde se guarda"
      body: "Los datos viven en servidores de Render Services, Inc., en Estados Unidos. Eso es una transferencia internacional. Render se acoge a las cláusulas contractuales tipo de la Comisión Europea."
      church: "Si pides una visita a los misioneros, sales de Noche Live y hablas con la Iglesia. Nosotros no recibimos ese formulario. Lo mismo si abres el mapa de capillas o las Escrituras en su sitio."
    how_long:
      title: "Cuánto tiempo"
      body: "Las cookies duran lo que indica la tabla. La ficha, los puntos y las partidas se quedan mientras exista la rama y no pidas el borrado. La presencia en la liga se actualiza al jugar. Los registros del servidor (dirección IP, fecha) se conservan un plazo breve, para que el sitio funcione y esté seguro."
    kids:
      title: "En familia"
      body: "Noche Live se usa en casa, en familia. Una ficha puede ser de un niño. No hay publicidad dirigida a menores. En España, si el jugador tiene menos de 14 años, la ficha la crea la familia en este aparato."
    rights:
      title: "Tus derechos"
      body: "Puedes acceder a tus datos, rectificarlos, pedir que los borremos, oponerte, limitar el tratamiento o pedir la portabilidad. Borrar las cookies de este navegador corta el reconocimiento en este aparato."
      complain_html: "Si no estás de acuerdo, puedes reclamar ante la %{aepd}."
      aepd: "Agencia Española de Protección de Datos"
    write:
      title: "Cómo escribirnos"
      body: "Para ver o borrar tus datos, escribe a Tracy Loisel."
