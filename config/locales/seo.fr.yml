      pages:
        home:
          title: "Noche Live — Jeux bibliques, activités chrétiennes et étude"
          description: "Découvre des jeux bibliques, des activités chrétiennes pour les jeunes et les familles, et des parcours d’étude des Écritures."
          kicker: "Une aventure biblique à vivre ensemble"
          h1: "La Bible prend vie quand on la partage"
          lede: "Noche Live transforme les Écritures en aventure faite de questions, de défis, d’histoires et de rencontres. Joue seul, en famille, avec des amis ou pendant une soirée à l’église."
          cta: "Jouer maintenant"
          card_title: "Découvrir Noche Live"
          card_body: "Jeu, étude et communauté dans une même aventure."
          sections:
            - title: "Jouer pour avoir envie de relire"
              body: "Chaque question ouvre une histoire biblique. Les points, les couronnes et les défis donnent envie de continuer, mais la vraie victoire consiste à mieux reconnaître les prophètes, les rois et, surtout, à s’approcher de Jésus-Christ."
            - title: "Une expérience pour toute la salle"
              body: "Noche Live fonctionne sur mobile et rassemble les personnes. Une famille joue depuis le canapé, un groupe de jeunes forme des équipes, une paroisse vit une soirée menée par un présentateur sur grand écran."
            - title: "Toujours un prochain pas"
              body: "Après le jeu, tu peux ouvrir le passage, suivre un programme hebdomadaire ou parler avec quelqu’un de l’Église. Rien ne presse et rien n’oblige : chaque porte reste ouverte pour le moment où tu voudras avancer."
        bible_games:
          title: "Jeux bibliques pour jeunes, familles et groupes | Noche Live"
          description: "Des jeux bibliques gratuits avec questions, défis, équipes et aventures pour les jeunes, les familles et les groupes chrétiens."
          kicker: "Jeux bibliques"
          h1: "Des jeux qui font regarder, rire et se souvenir"
          lede: "Ce n’est pas une fiche scolaire avec un bouton Valider. Ce sont des questions rapides, des défis d’équipe et des moments qui font vivre une histoire biblique à toute la salle."
          cta: "Ouvrir les jeux"
          card_title: "Jeux bibliques"
          card_body: "Questions, défis et aventure à vivre ensemble."
          sections:
            - title: "Une histoire derrière chaque question"
              body: "Chaque réponse rejoint un passage réel. Tu peux tenter, être surpris, puis ouvrir les Écritures pour comprendre pourquoi David, Esther, Moïse ou Élie ont pris cette décision."
            - title: "Du téléphone à la salle"
              body: "Le téléphone sert à choisir, voter ou buzzer. L’attention revient vite vers les autres : commenter une réponse, célébrer une série, aider son équipe et attendre la révélation du présentateur."
            - title: "Pour une personne ou pour cinquante"
              body: "Lance une courte partie seul, défie un ami ou prépare une soirée entière pour des jeunes et des familles. Le rythme change, mais l’aventure et le ton chaleureux restent les mêmes."
        bible_quiz:
          title: "Quiz biblique gratuit avec réponses | Noche Live"
          description: "Teste tes connaissances avec un quiz biblique gratuit, des réponses expliquées et des liens directs vers les passages."
          kicker: "Quiz biblique"
          h1: "Que te rappelles-tu vraiment de la Bible ?"
          lede: "Réponds vite, découvre les choix des autres joueurs et ouvre le verset lorsqu’une histoire te surprend. Même une erreur peut devenir une porte pour apprendre."
          cta: "Commencer le quiz"
          card_title: "Quiz biblique"
          card_body: "Des questions rapides avec réponse et passage."
          sections:
            - title: "Rois, prophètes et décisions"
              body: "Les questions parcourent les personnages, les lieux, les promesses et les moments décisifs. Nul besoin d’être expert : la difficulté grandit peu à peu et le texte biblique reste toujours accessible."
            - title: "Une réponse qui laisse une trace"
              body: "Après le choix viennent la révélation, une courte explication et le passage. La bonne réponse ne reste donc pas une simple lettre : elle devient une scène facile à retenir."
            - title: "Séries, étoiles et défis"
              body: "Les récompenses rendent les progrès visibles. Tu peux battre ton propre score ou défier quelqu’un sans transformer l’apprentissage en examen froid."
        group_activities:
          title: "Activités chrétiennes pour groupes et familles | Noche Live"
          description: "Des idées d’activités chrétiennes pour jeunes, familles et groupes : jeux bibliques, équipes, échanges et moments de foi."
          kicker: "Activités chrétiennes"
          h1: "Une activité qui rassemble vraiment"
          lede: "Quand tout le monde arrive fatigué, une bonne activité demande une consigne claire, un départ rapide et quelque chose à partager. Noche Live met le jeu au service de la rencontre."
          cta: "Préparer une activité"
          card_title: "Activités chrétiennes"
          card_body: "Des idées pour se retrouver, jouer et échanger."
          sections:
            - title: "Commencer en moins de deux minutes"
              body: "Un code court suffit pour entrer sur mobile. Le présentateur voit le rythme de la salle et alterne questions, mouvements, votes et défis sans distribuer de feuilles ni réciter de longues règles."
            - title: "Une place pour chacun"
              body: "Il y a des moments pour celui qui connaît beaucoup, celle qui vient d’arriver, celui qui parle fort et celle qui préfère observer. Les équipes évitent qu’une seule personne porte toute la réponse."
            - title: "La conversation continue"
              body: "Une surprise du jeu peut ouvrir un échange sur le courage, le service, la foi ou Jésus-Christ. L’activité ne remplace pas ce moment : elle le prépare et offre une histoire vécue ensemble."
        youth_activities:
          title: "Activités chrétiennes pour jeunes qui accrochent | Noche Live"
          description: "Des activités chrétiennes dynamiques pour les jeunes : jeux bibliques en équipes, défis, questions et présentation facile."
          kicker: "Activités pour les jeunes"
          h1: "Moins d’explications. Plus de jeu ensemble."
          lede: "Les jeunes comprennent en quelques secondes quoi faire. Le mobile devient une manette, la salle devient une scène et les Écritures sont le point de départ de chaque défi."
          cta: "Lancer une soirée"
          card_title: "Activités pour les jeunes"
          card_body: "Du rythme, des équipes et de la foi sans ambiance de classe."
          sections:
            - title: "Un départ qui ne perd personne"
              body: "Entrer avec un code, choisir son équipe et commencer. L’interface montre une action claire et le présentateur garde la main sur le rythme pour éviter les attentes et les discours trop longs."
            - title: "Se mesurer sans exclure"
              body: "Les points et les couronnes créent de la tension, mais les épreuves mélangent mémoire, intuition, mouvement et coopération. Différents talents peuvent sauver l’équipe."
            - title: "Une soirée qu’on veut recommencer"
              body: "La progression, les souvenirs de la paroisse et les nouveaux mondes donnent envie d’un prochain rendez-vous. Les jeunes ne reçoivent pas une plateforme de plus : ils entrent dans une aventure commune."
        bible_study:
          title: "Étude biblique simple, hebdomadaire et partagée | Noche Live"
          description: "Suis une étude biblique hebdomadaire avec lectures, questions, progression et communauté. Une manière simple de revenir aux Écritures."
          kicker: "Étude biblique"
          h1: "Une semaine, un passage, un pas de plus"
          lede: "L’étude n’a pas besoin de commencer par une heure libre. Lis le passage, réponds à quelques questions et garde ta progression. La prochaine fois, tu sauras exactement où reprendre."
          cta: "Ouvrir le programme"
          card_title: "Étude biblique"
          card_body: "Lecture hebdomadaire, questions et progression."
          sections:
            - title: "Le texte d’abord"
              body: "Chaque unité commence par une lecture précise. Le lecteur souligne la référence et garde le chapitre à portée de main afin qu’une question ne remplace jamais les Écritures."
            - title: "Des questions pour mieux regarder"
              body: "Il ne s’agit pas seulement de retenir des noms. Les questions attirent l’attention sur une promesse, une décision ou une image du passage et donnent envie de relire avec plus d’attention."
            - title: "Un chemin visible"
              body: "Ton historique montre ce que tu as déjà parcouru. Tu peux aussi voir l’avancée de ta communauté, célébrer ceux qui terminent et reprendre sans recommencer depuis le début."
        psalms_study:
          title: "Étude des Psaumes : lecture et questions chaque semaine | Noche Live"
          description: "Lis et étudie les Psaumes avec un parcours hebdomadaire, de courtes questions et une progression facile à reprendre."
          kicker: "Les Psaumes"
          h1: "Des mots pour prier quand les mots manquent"
          lede: "Les Psaumes parlent depuis la joie, la peur, la gratitude et l’attente. Ce parcours hebdomadaire aide à les lire lentement et à reconnaître une phrase à garder avec soi."
          cta: "Étudier les Psaumes"
          card_title: "Parcours dans les Psaumes"
          card_body: "Une lecture hebdomadaire pour prier et se souvenir."
          sections:
            - title: "Une voix humaine devant Dieu"
              body: "Les psalmistes ne cachent pas ce qu’ils ressentent. On trouve chez eux louange, questions, repentance et confiance, exprimées avec des mots qui peuvent encore accompagner une prière aujourd’hui."
            - title: "Lire le psaume dans son contexte"
              body: "Chaque semaine ouvre le passage complet avant les questions. Tu peux t’arrêter sur une image, revenir à un verset et suivre le fil sans transformer la lecture en contrôle."
            - title: "Garder une lumière pour la semaine"
              body: "Terminer une unité rend le chemin visible. Plus important encore, cela permet de choisir une vérité ou une phrase du psaume à retrouver lorsqu’on en aura besoin."
