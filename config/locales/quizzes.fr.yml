fr:
  quizzes:
    coronas:
      title: "Rois"
      kicker: "Quizz royal"
      lede: "David, Saül, Salomon : qui a été oint, qui a prié, qui a chuté."
      questions:
        ungio_david:
          question: "Qui a oint David quand il était encore un garçon ?"
          answer: "Samuel l’a oint à Bethléhem, devant ses frères."
          choices:
            samuel: "Samuel"
            saul: "Saül"
            natan: "Nathan"
        piedras_arroyo:
          question: "Combien de pierres lisses David a-t-il prises dans le torrent ?"
          answer: "Il a pris cinq pierres lisses dans le torrent."
          choices:
            cinco: "Cinq"
            tres: "Trois"
            siete: "Sept"
            una: "Une"
        arpa_saul:
          question: "La harpe de David apaisait l’esprit tourmenté de…"
          answer: "Quand David jouait, Saül se sentait soulagé."
          choices:
            saul: "Saül"
            absalon: "Absalom"
            goliat: "Goliath"
        vina_nabot:
          question: "Qui a voulu la vigne de Naboth ?"
          answer: "Le roi Achab a voulu la vigne qui jouxtait son palais."
          choices:
            acab: "Achab"
            jehu: "Jéhu"
            elias: "Élie"
        salomon_templo:
          question: "Qu’a élevé Salomon à Jérusalem pour l’Éternel ?"
          answer: "Salomon a bâti la maison de l’Éternel : le temple."
          choices:
            templo: "Le temple"
            palacio: "Un palais pour Pharaon"
            torre: "La tour de Babel"
        juicio_madres:
          question: "Dans le jugement des deux mères, qu’a demandé Salomon ?"
          answer: "Il a demandé une épée. La vraie mère n’a pas laissé couper l’enfant."
          choices:
            espada: "Une épée"
            balanza: "Une balance"
            arca: "L’arche"
        arca_jerusalen:
          question: "Où David a-t-il fait reposer l’arche de l’alliance ?"
          answer: "David a fait monter l’arche à Jérusalem, dans la joie."
          choices:
            jerusalen: "Jérusalem"
            silo: "Silo"
            egipto: "L’Égypte"
        sucedio_salomon:
          question: "Qui a été oint roi quand David était vieux ?"
          answer: "Salomon a été oint, et le peuple a crié : Vive le roi Salomon !"
          choices:
            salomon: "Salomon"
            adonias: "Adonias"
            joab: "Joab"
        josias_libro:
          question: "Qu’a trouvé le prêtre Hilkiya dans la maison de l’Éternel, au temps de Josias ?"
          answer: "Il a trouvé le livre de la loi. Josias a déchiré ses vêtements en l’entendant."
          choices:
            ley: "Le livre de la loi"
            mana: "Une jarre de manne"
            corona: "La couronne de David"
        moises_roca:
          question: "À Mériba, qu’a fait Moïse au rocher, au lieu de lui parler ?"
          answer: "Il a frappé le rocher deux fois. C’est pour cela qu’il n’est pas entré dans le pays."
          choices:
            golpeo: "Il l’a frappé"
            canto: "Il lui a chanté"
            ignoro: "Il est passé outre"
    placas:
      title: "Plaques"
      kicker: "Quiz des plaques"
      lede: "Léhi, Néphi, Abinadi : les plaques, le bateau et la tour."
      questions:
        lehi_jerusalen:
          question: "De quelle ville Léhi est-il parti avec sa famille ?"
          answer: "L’Éternel lui a commandé de quitter Jérusalem."
          choices:
            jerusalen: "Jérusalem"
            babilonia: "Babylone"
            egipto: "L’Égypte"
        nefi_barco:
          question: "Au bord de la mer, que l’Éternel a-t-il commandé à Néphi de construire ?"
          answer: "L’Éternel lui a dit de construire un bateau, selon sa manière."
          choices:
            barco: "Un bateau"
            templo: "Un temple"
            torre: "Une tour"
        benjamin_torre:
          question: "D’où le roi Benjamin a-t-il parlé à son peuple ?"
          answer: "Il a fait construire une tour pour que le peuple l’entende."
          choices:
            torre: "Une tour"
            muro: "Le mur de la ville"
            templo: "Le temple de Salomon"
        noe_inicuo:
          question: "Le roi Noé, fils de Zéniff, était un roi…"
          answer: "Noé a imposé le peuple et n’a pas gardé les commandements."
          choices:
            inicuo: "Inique"
            justo: "Juste"
            nino: "Encore enfant"
        abinadi_noe:
          question: "Devant qui Abinadi a-t-il rendu témoignage ?"
          answer: "Abinadi est venu avec le message de l’Éternel pour Noé et son peuple."
          choices:
            noe: "Le roi Noé"
            mosiah: "Le roi Mosiah"
            lamoni: "Le roi Lamoni"
        alma_joven:
          question: "Qu’est-il arrivé à Alma le jeune quand un ange a parlé ?"
          answer: "Il est tombé et n’a plus pu parler. L’Éternel avait entendu son père."
          choices:
            cayo: "Il est tombé à terre"
            rey: "On l’a fait roi"
            mar: "Il s’est enfui vers la mer"
        samuel_muro:
          question: "D’où Samuel le Lamanite a-t-il prêché aux Néphites ?"
          answer: "Ils l’ont chassé de la ville. Il est monté sur le mur, et ils n’ont pas pu l’atteindre."
          choices:
            muro: "Le mur"
            rio: "Le fleuve Sidon"
            bosque: "Une forêt"
        mosiah_jared:
          question: "Quels registres Mosiah a-t-il traduits avec les interprètes ?"
          answer: "Il a traduit les registres du peuple de Jared, trouvés par le peuple de Limhi."
          choices:
            jared: "Ceux de Jared"
            isaias: "Ésaïe"
            brass: "Les plaques de Laban"
        moroni_planchas:
          question: "Qu’a caché Moroni pour que cela vienne à la lumière au dernier jour ?"
          answer: "Moroni a terminé le registre de son père et a caché les plaques."
          choices:
            planchas: "Les plaques"
            arca: "L’arche"
            corona: "La couronne de Benjamin"
        jared_senor:
          question: "Sur la montagne, qui le frère de Jared a-t-il vu ?"
          answer: "Le Seigneur s’est montré. Le voile a été ôté de ses yeux."
          choices:
            senor: "Le Seigneur"
            moroni: "Moroni"
            noe: "Noé"
    hermanas:
      title: "Sœurs"
      kicker: "Quiz des sœurs"
      lede: "Ruth, Esther, Anne et Débora : des femmes qui sont restées, ont parlé, ont sauvé."
      questions:
        rut_noemi:
          question: "Avec qui Ruth est-elle restée, au lieu de rentrer en Moab ?"
          answer: "Ruth a dit : où tu iras, j’irai."
          choices:
            noemi: "Noémi"
            orfa: "Orpa"
            raquel: "Rachel"
        ester_rey:
          question: "Devant qui Esther s’est-elle présentée, sans même avoir été appelée ?"
          answer: "Esther a dit : si je péris, je périrai. Elle est entrée chez le roi."
          choices:
            rey: "Le roi"
            aman: "Haman"
            mardoqueo: "Mardochée"
        ana_hijo:
          question: "Qu’a demandé Anne à l’Éternel à Silo, l’âme amère ?"
          answer: "Elle a demandé un fils et a promis de le consacrer à l’Éternel."
          choices:
            hijo: "Un fils"
            corona: "Une couronne"
            tierra: "Une terre"
        debora_juzga:
          question: "Qui jugeait Israël sous le palmier ?"
          answer: "Débora, prophétesse, jugeait Israël."
          choices:
            debora: "Débora"
            jael: "Jaël"
            rut: "Ruth"
        abigail_david:
          question: "Qui Abigaïl a-t-elle arrêté pour qu’il ne verse pas le sang ?"
          answer: "Abigaïl est allée au-devant de David avec du pain et des fruits."
          choices:
            david: "David"
            naval: "Nabal"
            saul: "Saül"
        saba_salomon:
          question: "Qui la reine de Saba a-t-elle visité ?"
          answer: "Elle est venue éprouver Salomon par des questions difficiles."
          choices:
            salomon: "Salomon"
            david: "David"
            faraon: "Pharaon"
        maria_madre:
          question: "De qui Marie serait-elle la mère ?"
          answer: "L’ange lui a dit : tu concevras et tu enfanteras un fils."
          choices:
            jesus: "Jésus"
            juan: "Jean-Baptiste"
            moises: "Moïse"
        magdalena_tumba:
          question: "Qui Marie de Magdala a-t-elle vu près du tombeau vide ?"
          answer: "Jésus lui a dit : Marie. Alors elle l’a reconnu."
          choices:
            jesus: "Jésus"
            pilato: "Pilate"
            caifas: "Caïphe"
        viuda_blancas:
          question: "Qu’a jeté la veuve pauvre dans le trésor ?"
          answer: "Elle a jeté deux petites pièces : plus que tous, parce que c’était tout ce qu’elle avait."
          choices:
            blancas: "Deux petites pièces"
            oro: "Un talent d’or"
            diezmo: "La dîme du temple"
        marta_parte:
          question: "Jésus a dit à Marthe que Marie avait choisi…"
          answer: "Marie s’était assise pour écouter. Cela ne lui serait pas ôté."
          choices:
            parte: "La bonne part"
            cocina: "La cuisine"
            corona: "Une couronne"
    abish:
      title: "Abish"
      kicker: "Quiz d’Abish"
      lede: "Abish, Sariah et les mères des deux mille : une foi qui n’a pas douté."
      questions:
        saria_lehi:
          question: "Avec qui Sariah a-t-elle quitté Jérusalem ?"
          answer: "Sariah est partie avec Léhi, son mari, et leurs fils."
          choices:
            lehi: "Léhi"
            laban: "Laban"
            ismael: "Ismaël"
        abish_reina:
          question: "Abish était servante de…"
          answer: "Abish, lamanite, servait la femme de Lamoni."
          choices:
            reina: "La reine"
            noe: "Le roi Noé"
            benjamin: "Le roi Benjamin"
        lamoni_esposa:
          question: "Qui a cru les paroles d’Ammon au sujet du roi Lamoni ?"
          answer: "La reine a cru. Elle a dit : je n’ai aucun doute."
          choices:
            esposa: "La femme de Lamoni"
            anti: "Anti-Néphi-Léhi"
            noe: "Noé"
        madres_dudar:
          question: "Les mères des deux mille ont enseigné à leurs fils à…"
          answer: "Elles leur ont enseigné que s’ils ne doutaient pas, Dieu les délivrerait."
          choices:
            dudar: "Ne pas douter"
            huir: "Fuir vers les montagnes"
            diezmar: "Payer la dîme d’abord"
        eva_madre:
          question: "Selon Léhi, Ève est mère de…"
          answer: "Adam et Ève ont eu des enfants. Ève est mère de tous les vivants."
          choices:
            vivientes: "Tous les vivants"
            israel: "Israël seulement"
            nefi: "Néphi seulement"
        maria_hijo:
          question: "L’ange a dit à Benjamin que Marie serait mère du…"
          answer: "Il s’appellerait Jésus-Christ, le Fils de Dieu."
          choices:
            hijo: "Fils de Dieu"
            benjamin: "Roi Benjamin"
            samuel: "Le prophète Samuel"
        saria_bronce:
          question: "En voyant quoi Sariah s’est-elle réjouie, après avoir murmuré ?"
          answer: "Elle a vu que ses fils étaient revenus avec les plaques. Elle a offert un sacrifice."
          choices:
            bronce: "Les plaques d’airain"
            barco: "Le bateau de Néphi"
            liahona: "La Liahona"
        abish_casas:
          question: "Quand la reine et le roi sont tombés, qu’a fait Abish ?"
          answer: "Elle a couru de maison en maison, pour que le peuple voie la puissance de Dieu."
          choices:
            casas: "Elle a couru de maison en maison"
            escondio: "Elle s’est cachée"
            canto: "Elle a chanté un psaume"
        saria_barco:
          question: "Sur le bateau, Sariah et les petits enfants…"
          answer: "Laman et Lémuel avaient lié Néphi. Sariah et les enfants étaient malades de chagrin."
          choices:
            sufrieron: "Ont souffert"
            gobernaron: "Ont tenu la barre"
            durmieron: "Ont dormi tout le voyage"
        abish_vision:
          question: "Comment Abish s’était-elle convertie, des années auparavant ?"
          answer: "Le Seigneur l’avait préparée. Grâce à la vision de son père, elle croyait."
          choices:
            vision: "Par une vision remarquable de son père"
            benjamin: "En écoutant Benjamin"
            placas: "En lisant les plaques"
    profetas:
      title: "Prophètes"
      kicker: "Quiz des prophètes"
      lede: "Jonas, Élie, Daniel : trois jours, des corbeaux, des fenêtres vers Jérusalem."
      questions:
        jonas_tres:
          question: "Combien de jours Jonas est-il resté dans le poisson ?"
          answer: "Trois jours et trois nuits."
          choices:
            tres: "Trois"
            siete: "Sept"
            cuarenta: "Quarante"
        elias_cuervos:
          question: "Près du torrent, qui nourrissait Élie ?"
          answer: "Les corbeaux lui apportaient du pain et de la viande, matin et soir."
          choices:
            cuervos: "Des corbeaux"
            angeles: "Des anges"
            sacerdotes: "Des prêtres"
        daniel_tres:
          question: "Combien de fois par jour Daniel priait-il, les fenêtres ouvertes vers Jérusalem ?"
          answer: "Trois fois par jour, comme il le faisait auparavant."
          choices:
            tres: "Trois fois par jour"
            una: "Une fois par an"
            nunca: "Jamais, par décret"
        jonas_tarsis:
          question: "Vers où Jonas a-t-il fui, au lieu d’aller à Ninive ?"
          answer: "Il a fui vers Tarsis, loin de la face de l’Éternel."
          choices:
            tarsis: "Tarsis"
            ninive: "Ninive"
            egipto: "L’Égypte"
        naaman_jordan:
          question: "Dans quel fleuve Naaman s’est-il lavé et a-t-il été purifié ?"
          answer: "Il s’est plongé sept fois dans le Jourdain, selon la parole d’Élisée."
          choices:
            jordan: "Le Jourdain"
            nilo: "Le Nil"
            mar: "La mer Morte"
        elias_siete:
          question: "Élie a dit à son serviteur de regarder vers la mer. Combien de fois ?"
          answer: "Sept fois. À la septième, on voyait un petit nuage."
          choices:
            siete: "Sept fois"
            tres: "Trois fois"
            una: "Une seule fois"
        tres_horno:
          question: "Qui a été jeté dans la fournaise pour n’avoir pas voulu se prosterner ?"
          answer: "Shadrak, Méshak et Abed-Nego. Ils n’ont pas servi la statue du roi."
          choices:
            tres: "Shadrak, Méshak et Abed-Nego"
            daniel: "Daniel seul"
            moises: "Moïse et Aaron"
        elias_manto:
          question: "Avec quoi Élie a-t-il frappé le Jourdain pour le passer à sec ?"
          answer: "Avec son manteau. Les eaux se sont écartées."
          choices:
            manto: "Son manteau"
            vara: "La verge de Moïse"
            arpa: "La harpe de David"
        isaias_templo:
          question: "Qui Ésaïe a-t-il vu assis sur un trône, dans le temple ?"
          answer: "Il a vu l’Éternel. Le pan de son manteau remplissait le temple."
          choices:
            senor: "L’Éternel"
            saul: "Le roi Saül"
            babilonia: "Babylone"
        eliseo_carros:
          question: "Quand Élie a été enlevé, qu’a vu Élisée ?"
          answer: "Un char de feu et des chevaux de feu. Élie est monté dans un tourbillon."
          choices:
            carros: "Des chars de feu"
            barca: "Une barque sur le Jourdain"
            nube: "Seulement un nuage gris"
    jehova:
      title: "L’Éternel"
      kicker: "Quiz de l’Éternel"
      lede: "Le nom de l’Éternel, la mer qui s’ouvre, le seul Sauveur."
      questions:
        zarza_yo_soy:
          question: "Dans le buisson, quel nom l’Éternel s’est-il donné à Moïse ?"
          answer: "JE SUIS CELUI QUI SUIS. Voilà ce que tu diras aux enfants d’Israël."
          choices:
            yo_soy: "JE SUIS"
            moises: "Le Dieu de Moïse seulement"
            faraon: "Le nom de Pharaon"
        mar_rojo:
          question: "Qu’a ouvert l’Éternel pour qu’Israël passe à pied sec ?"
          answer: "Moïse a étendu la main, et l’Éternel a ouvert la mer Rouge."
          choices:
            mar: "La mer Rouge"
            jordan: "Le Jourdain"
            nilo: "Le Nil"
        no_salvador:
          question: "Ésaïe entend l’Éternel dire : moi, moi l’Éternel, et…"
          answer: "Hors de moi, il n’y a point de Sauveur."
          choices:
            yo: "Hors de moi, point de Sauveur"
            babilonia: "Babylone sauvera"
            reyes: "Les rois de la terre"
        kirtland_senor:
          question: "Qui est apparu à Joseph et à Oliver à Kirtland, sous le voile ?"
          answer: "Le Seigneur. Sa voix était comme le bruit de grandes eaux."
          choices:
            senor: "Le Seigneur"
            moises_solo: "Moïse seulement"
            elias_solo: "Élie seulement"
        ley_moises:
          question: "À Bountiful, Jésus a dit de la loi de Moïse…"
          answer: "C’est moi qui ai donné la loi. C’est moi qui l’ai accomplie."
          choices:
            yo: "C’est moi qui ai donné la loi à Moïse"
            aaron: "Aaron a donné la loi"
            roma: "César a donné la loi"
        antes_abraham:
          question: "Jésus a dit à ceux qui l’écoutaient : en vérité, en vérité, je vous le dis…"
          answer: "Avant qu’Abraham fût, JE SUIS."
          choices:
            yo_soy: "Avant qu’Abraham fût, JE SUIS"
            despues: "Je suis né après Abraham"
            nieto: "Je suis le petit-fils d’Abraham"
        omnipotente_descendio:
          question: "Le Seigneur Tout-Puissant, selon l’ange qui parla à Benjamin…"
          answer: "Il descendra du ciel et habitera dans un tabernacle d’argile."
          choices:
            descendio: "Il descendra parmi les enfants des hommes"
            lejos: "Il restera loin pour toujours"
            angel: "Il enverra seulement un ange"
        jared_padre_hijo:
          question: "Le frère de Jared a entendu : voici, je suis…"
          answer: "Je suis le Père et le Fils. En moi l’humanité aura la lumière."
          choices:
            ambos: "Le Père et le Fils"
            solo_angel: "Seulement un ange"
            moises: "Moïse dans la gloire"
        dios_egipto:
          question: "Selon Néphi, le Dieu d’Abraham, d’Isaac et de Jacob est le même qui…"
          answer: "A fait sortir les enfants d’Israël d’Égypte, et serait élevé."
          choices:
            egipto: "Le Dieu d’Abraham, qui a fait sortir Israël d’Égypte"
            baal: "Baal des Cananéens"
            roma: "César de Rome"
        nube_nombre:
          question: "Depuis la nuée, au-dessus du peuple de Néphi, qui s’est nommé ?"
          answer: "Jésus-Christ, le Fils de Dieu. J’ai créé les cieux et la terre."
          choices:
            jesus: "Jésus-Christ"
            alma: "Alma le jeune"
            samuel: "Samuel le Lamanite"
    nazareno:
      title: "Sur la terre"
      kicker: "Quiz sur la terre"
      lede: "Bethléhem, le baptême, les miracles : Jésus parmi nous."
      questions:
        nacio_belen:
          question: "Où Jésus est-il né ?"
          answer: "À Bethléhem de Judée, dans une crèche, parce qu’il n’y avait pas de place."
          choices:
            belen: "Bethléhem"
            nazaret: "Nazareth"
            jerusalen: "Jérusalem"
        bautizo_juan:
          question: "Qui a baptisé Jésus dans le Jourdain ?"
          answer: "Jean. Les cieux se sont ouverts, et l’Esprit est descendu."
          choices:
            juan: "Jean"
            pedro: "Pierre"
            andrew: "André"
        cana_vino:
          question: "À Cana, Jésus a changé l’eau en…"
          answer: "En vin. Ce fut le premier signe, à des noces."
          choices:
            vino: "Du vin"
            aceite: "De l’huile"
            miel: "Du miel"
        cinco_mil:
          question: "Avec cinq pains et deux poissons, combien Jésus a-t-il nourris ?"
          answer: "Environ cinq mille hommes, sans compter les femmes et les enfants."
          choices:
            cinco: "Cinq mille"
            doce: "Douze"
            ciento: "Cent"
        camino_mar:
          question: "La nuit, vers la barque, Jésus a marché sur…"
          answer: "Sur la mer. Les disciples ont eu peur, et il a dit : c’est moi."
          choices:
            mar: "La mer"
            nubes: "Les nuages"
            fuego: "Un fleuve de feu"
        getsemani:
          question: "À Gethsémané, qu’a fait Jésus ?"
          answer: "Il a prié. Sa sueur était comme de grosses gouttes de sang."
          choices:
            orar: "Il a prié, l’âme toute triste"
            huir: "Il s’est enfui en Galilée"
            dormir: "Il a dormi jusqu’à l’aube"
        crucificado:
          question: "Au Golgotha, qu’a-t-on fait à Jésus ?"
          answer: "On l’a crucifié. Il a livré sa vie, et tout s’est accompli."
          choices:
            cruz: "On l’a crucifié"
            rey: "On l’a couronné César"
            egipto: "On l’a envoyé en Égypte"
        magdalena_resucitado:
          question: "Après le troisième jour, Marie de Magdala…"
          answer: "Elle a vu Jésus vivant. Elle est allée dire aux disciples : j’ai vu le Seigneur."
          choices:
            resucitado: "Elle l’a vu ressuscité"
            tumba: "Elle n’a vu qu’un tombeau fermé"
            soldados: "Elle a vu les soldats de Rome"
        abundancia:
          question: "Après sa résurrection, dans quel temple Jésus s’est-il montré aux Néphites ?"
          answer: "Au temple de Bountiful. Il est descendu, et le peuple l’a touché."
          choices:
            abundancia: "Bountiful"
            zarahemla: "Zarahemla"
            jerusalen: "Jérusalem de Judée"
        ninos_uno:
          question: "À Bountiful, comment Jésus a-t-il béni les enfants ?"
          answer: "Un à un. Il les a pris dans ses bras et les a bénis."
          choices:
            uno: "Un à un"
            lejos: "De loin, en groupe"
            angeles: "Seuls les anges les ont touchés"
    moises:
      title: "Moïse"
      kicker: "Quiz de Moïse"
      lede: "Face à face, l’Éden, la création : ce que Moïse a vu."
      questions:
        moises_cara:
          question: "Selon le livre de Moïse, Moïse a vu Dieu…"
