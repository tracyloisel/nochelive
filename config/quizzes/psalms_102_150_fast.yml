packs:
- id: psalms_living_god
  copy:
    fr:
      title: Le Dieu vivant agit
      kicker: Psaumes 135 · 136 · 146
      lede: Création, traversée, humiliation, délivrance et nourriture reçoivent le
        même refrain dans le Psaume 136. Sa miséricorde dure d’âge en âge.
    es:
      title: El Dios viviente actúa
      kicker: Salmos 135 · 136 · 146
      lede: Creación, travesía, humillación, liberación y alimento reciben el mismo
        estribillo en el Salmo 136. Su misericordia permanece para siempre.
    en:
      title: The living God acts
      kicker: Psalms 135 · 136 · 146
      lede: Creation, the journey, humiliation, deliverance, and food all receive
        the same refrain in Psalm 136. His mercy endures forever.
    pt-BR:
      title: O Deus vivo age
      kicker: Salmos 135 · 136 · 146
      lede: Criação, travessia, humilhação, libertação e alimento recebem o mesmo
        refrão no Salmo 136. Sua misericórdia dura para sempre.
  readings:
  - study: ot/ps/135
    cite: Psaume 135
  - study: ot/ps/136
    cite: Psaume 136
  - study: ot/ps/146
    cite: Psaume 146
  questions:
  - id: fast-psalms-pack01-q01
    scripture:
      canon: bible
      cite: Psaume 135:15-17
      study: ot/ps/135
    correct_choice: a
    points: 5
    duration: 0
    intensity: 1
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q01.png
    copy:
      fr:
        prompt: 'Vrai ou faux : les idoles ont une bouche, mais ne parlent pas.'
        choices:
        - key: a
          label: Vrai
        - key: b
          label: Faux
        feedback: Bouche, yeux, oreilles… mais aucun souffle. Ces idoles ont une forme
          humaine, sans aucune vie.
        scripture_cite: Psaume 135:15-17
      es:
        prompt: 'Cierto o falso: los ídolos tienen boca, pero no hablan.'
        choices:
        - key: a
          label: Cierto
        - key: b
          label: Falso
        feedback: Boca, ojos y oídos, pero sin aliento. Estos ídolos tienen forma
          humana, pero no tienen vida.
        scripture_cite: Salmo 135:15-17
      en:
        prompt: 'True or false: Idols have mouths, but they cannot speak.'
        choices:
        - key: a
          label: 'True'
        - key: b
          label: 'False'
        feedback: Mouths, eyes, and ears—but no breath. These idols have human form,
          yet no life.
        scripture_cite: Psalm 135:15-17
      pt-BR:
        prompt: 'Verdadeiro ou falso: os ídolos têm boca, mas não falam.'
        choices:
        - key: a
          label: Verdadeiro
        - key: b
          label: Falso
        feedback: Boca, olhos e ouvidos, mas nenhum fôlego. Esses ídolos têm forma
          humana, porém não têm vida.
        scripture_cite: Salmo 135:15-17
  - id: fast-psalms-pack01-q02
    scripture:
      canon: bible
      cite: Psaume 135:18
      study: ot/ps/135
    correct_choice: c
    points: 5
    duration: 0
    intensity: 1
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q02.png
    copy:
      fr:
        prompt: D’après le psaume, à qui ressemblent ceux qui se fient aux idoles
          ?
        choices:
        - key: a
          label: Aux rois puissants
        - key: b
          label: Aux serviteurs de l’Éternel
        - key: c
          label: Aux idoles qu’ils fabriquent
        - key: d
          label: Aux peuples délivrés
        feedback: 'Voilà le piège : ceux qui fabriquent les idoles et leur font confiance
          finissent par leur ressembler.'
        scripture_cite: Psaume 135:18
      es:
        prompt: Según el salmo, ¿a quiénes se parecen quienes confían en ídolos?
        choices:
        - key: a
          label: A reyes poderosos
        - key: b
          label: A los siervos de Jehová
        - key: c
          label: A los ídolos que fabrican
        - key: d
          label: A pueblos liberados
        feedback: 'Ahí está la trampa: quienes fabrican ídolos y confían en ellos
          terminan pareciéndose a ellos.'
        scripture_cite: Salmo 135:18
      en:
        prompt: According to the psalm, whom do people who trust idols resemble?
        choices:
        - key: a
          label: Powerful kings
        - key: b
          label: The Lord’s servants
        - key: c
          label: The idols they make
        - key: d
          label: Peoples set free
        feedback: 'Here’s the trap: Those who make idols and trust them end up becoming
          like them.'
        scripture_cite: Psalm 135:18
      pt-BR:
        prompt: Segundo o salmo, com quem se parecem os que confiam em ídolos?
        choices:
        - key: a
          label: Com reis poderosos
        - key: b
          label: Com os servos do Senhor
        - key: c
          label: Com os ídolos que fabricam
        - key: d
          label: Com povos libertos
        feedback: 'Aí está a armadilha: quem fabrica ídolos e confia neles acaba se
          tornando semelhante a eles.'
        scripture_cite: Salmo 135:18
  - id: fast-psalms-pack01-q03
    scripture:
      canon: bible
      cite: Psaume 136:1-26
      study: ot/ps/136
    correct_choice: b
    points: 5
    duration: 0
    intensity: 2
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q03.png
    copy:
      fr:
        prompt: Dans le Psaume 136, quel refrain revient 26 fois ?
        choices:
        - key: a
          label: Son règne commence ce jour
        - key: b
          label: Sa miséricorde dure à jamais
        - key: c
          label: Son peuple ne souffrira plus
        - key: d
          label: Sa puissance renverse tout
        feedback: Vingt-six fois, le psaume proclame que la miséricorde de Dieu dure
          à jamais. Chaque œuvre ravive cette mémoire.
        scripture_cite: Psaume 136:1-26
      es:
        prompt: En el Salmo 136, ¿qué frase se repite 26 veces?
        choices:
        - key: a
          label: Su reino comienza hoy
        - key: b
          label: Su misericordia es para siempre
        - key: c
          label: Su pueblo ya no sufrirá
        - key: d
          label: Su poder lo derriba todo
        feedback: Veintiséis veces, el salmo proclama que la misericordia de Dios
          es para siempre. Cada obra aviva esa memoria.
        scripture_cite: Salmo 136:1-26
      en:
        prompt: In Psalm 136, which line is repeated 26 times?
        choices:
        - key: a
          label: His reign begins today
        - key: b
          label: His mercy endures forever
        - key: c
          label: His people will suffer no more
        - key: d
          label: His power overturns everything
        feedback: Twenty-six times, the psalm declares that God’s mercy endures forever.
          Each deed brings it back to mind.
        scripture_cite: Psalm 136:1-26
      pt-BR:
        prompt: No Salmo 136, qual frase se repete 26 vezes?
        choices:
        - key: a
          label: Seu reino começa hoje
        - key: b
          label: Sua benignidade dura para sempre
        - key: c
          label: Seu povo não sofrerá mais
        - key: d
          label: Seu poder derruba tudo
        feedback: Vinte e seis vezes, o salmo declara que a benignidade de Deus dura
          para sempre. Cada obra reaviva essa memória.
        scripture_cite: Salmo 136:1-26
  - id: fast-psalms-pack01-q04
    scripture:
      canon: bible
      cite: Psaume 136:23-25
      study: ot/ps/136
    correct_choice: d
    points: 8
    duration: 20
    intensity: 2
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q04.png
    copy:
      fr:
        prompt: Aux versets 23 à 25, trois actions de Dieu s’enchaînent. Lesquelles
          ?
        choices:
        - key: a
          label: Il livre son peuple aux rois
        - key: b
          label: Il prive les nations de pain
        - key: c
          label: Il oublie les humiliés
        - key: d
          label: Il se souvient, libère, nourrit
        feedback: 'Dieu se souvient des humiliés, les délivre de leurs oppresseurs
          et nourrit toute chair : sa bonté agit.'
        scripture_cite: Psaume 136:23-25
      es:
        prompt: En los versículos 23 al 25, ¿qué tres acciones de Dios se suceden?
        choices:
        - key: a
          label: Entrega su pueblo a reyes
        - key: b
          label: Niega pan a las naciones
        - key: c
          label: Olvida a los abatidos
        - key: d
          label: Recuerda, rescata y alimenta
        feedback: 'Dios recuerda a los abatidos, los rescata de sus enemigos y alimenta
          a toda criatura: su bondad actúa.'
        scripture_cite: Salmo 136:23-25
      en:
        prompt: In verses 23–25, what three things does God do?
        choices:
        - key: a
          label: He hands his people to kings
        - key: b
          label: He keeps food from nations
        - key: c
          label: He forgets the lowly
        - key: d
          label: He remembers, rescues, feeds
        feedback: God remembers the lowly, rescues them from their enemies, and feeds
          every living thing. His mercy acts.
        scripture_cite: Psalm 136:23-25
      pt-BR:
        prompt: Nos versículos 23 a 25, quais são as três ações de Deus?
        choices:
        - key: a
          label: Entrega seu povo aos reis
        - key: b
          label: Nega alimento às nações
        - key: c
          label: Esquece os abatidos
        - key: d
          label: Lembra, resgata e alimenta
        feedback: 'Deus se lembra dos abatidos, resgata-os dos inimigos e alimenta
          toda criatura: sua bondade age.'
        scripture_cite: Salmo 136:23-25
  - id: fast-psalms-pack01-q05
    scripture:
      canon: bible
      cite: Psaume 146:3-4
      study: ot/ps/146
    correct_choice: a
    points: 8
    duration: 20
    intensity: 2
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q05.png
    copy:
      fr:
        prompt: Pourquoi les grands ne peuvent-ils pas être nos sauveurs ?
        choices:
        - key: a
          label: Ils meurent, leurs projets aussi
        - key: b
          label: Ils refusent tous de secourir
        - key: c
          label: Ils adorent toujours des idoles
        - key: d
          label: Ils ignorent la loi
        feedback: Leur souffle s’en va, ils retournent à la terre et leurs projets
          meurent avec eux. Leur pouvoir ne sauve pas.
        scripture_cite: Psaume 146:3-4
      es:
        prompt: "¿Por qué los poderosos no pueden ser nuestros salvadores?"
        choices:
        - key: a
          label: Mueren, igual que sus planes
        - key: b
          label: Todos se niegan a ayudar
        - key: c
          label: Siempre adoran a ídolos
        - key: d
          label: Desconocen la ley
        feedback: Su aliento se va, vuelven a la tierra y sus planes mueren con ellos.
          Su poder no puede salvar.
        scripture_cite: Salmo 146:3-4
      en:
        prompt: Why can’t powerful people be our saviors?
        choices:
        - key: a
          label: They die, and so do their plans
        - key: b
          label: They all refuse to help
        - key: c
          label: They always worship idols
        - key: d
          label: They do not know the law
        feedback: Their breath leaves, they return to the earth, and their plans die
          with them. Their power cannot save.
        scripture_cite: Psalm 146:3-4
      pt-BR:
        prompt: Por que os poderosos não podem ser nossos salvadores?
        choices:
        - key: a
          label: Morrem, e seus planos também
        - key: b
          label: Todos se recusam a ajudar
        - key: c
          label: Sempre adoram ídolos
        - key: d
          label: Desconhecem a lei
        feedback: Seu espírito sai, eles voltam à terra e seus planos morrem com eles.
          Seu poder não pode salvar.
        scripture_cite: Salmo 146:3-4
  - id: fast-psalms-pack01-q06
    scripture:
      canon: bible
      cite: Psaume 146:5-6
      study: ot/ps/146
    correct_choice: c
    points: 8
    duration: 20
    intensity: 3
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q06.png
    copy:
      fr:
        prompt: Selon le Psaume 146, où l’homme heureux place-t-il son espérance ?
        choices:
        - key: a
          label: Dans ses propres projets
        - key: b
          label: Dans la puissance des grands
        - key: c
          label: Dans l’Éternel, son Dieu
        - key: d
          label: Dans ce qu’il fabrique
        feedback: Son secours, c’est le Dieu de Jacob. Son espérance repose sur le
          Créateur fidèle du ciel, de la terre et de la mer.
        scripture_cite: Psaume 146:5-6
      es:
        prompt: Según el Salmo 146, ¿en quién espera la persona feliz?
        choices:
        - key: a
          label: En sus propios planes
        - key: b
          label: En el poder de los grandes
        - key: c
          label: En Jehová, su Dios
        - key: d
          label: En lo que fabrica
        feedback: Su ayuda es el Dios de Jacob. Espera en Jehová, el Creador fiel
          del cielo, la tierra y el mar.
        scripture_cite: Salmo 146:5-6
      en:
        prompt: According to Psalm 146, where does a happy person place their hope?
        choices:
        - key: a
          label: In their own plans
        - key: b
          label: In the power of rulers
        - key: c
          label: In the Lord their God
        - key: d
          label: In what they make
        feedback: The God of Jacob is their help. Their hope rests in the Lord, faithful
          Creator of heaven, earth, and sea.
        scripture_cite: Psalm 146:5-6
      pt-BR:
        prompt: Segundo o Salmo 146, onde a pessoa feliz põe sua esperança?
        choices:
        - key: a
          label: Nos próprios planos
        - key: b
          label: No poder dos grandes
        - key: c
          label: No Senhor, seu Deus
        - key: d
          label: No que ela fabrica
        feedback: Seu auxílio é o Deus de Jacó. Sua esperança está no Senhor, Criador
          fiel do céu, da terra e do mar.
        scripture_cite: Salmo 146:5-6
  - id: fast-psalms-pack01-q07
    scripture:
      canon: bible
      cite: Psaume 146:3-4
      study: ot/ps/146
    correct_choice: b
    points: 12
    duration: 15
    intensity: 3
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q07.png
    copy:
      fr:
        prompt: 'Vrai ou faux : les projets des grands leur survivent.'
        choices:
        - key: a
          label: Vrai
        - key: b
          label: Faux
        feedback: 'Le verset tranche : quand leur souffle s’en va, ils retournent
          à la terre et leurs projets périssent.'
        scripture_cite: Psaume 146:3-4
      es:
        prompt: 'Cierto o falso: los planes de los poderosos sobreviven a su muerte.'
        choices:
        - key: a
          label: Cierto
        - key: b
          label: Falso
        feedback: 'El versículo es tajante: cuando su aliento se va, vuelven a la
          tierra y sus planes perecen.'
        scripture_cite: Salmo 146:3-4
      en:
        prompt: 'True or false: The plans of rulers outlive them.'
        choices:
        - key: a
          label: 'True'
        - key: b
          label: 'False'
        feedback: 'The verse is clear: When their breath leaves, they return to the
          earth, and their plans perish.'
        scripture_cite: Psalm 146:3-4
      pt-BR:
        prompt: 'Verdadeiro ou falso: os planos dos poderosos sobrevivem a eles.'
        choices:
        - key: a
          label: Verdadeiro
        - key: b
          label: Falso
        feedback: 'O versículo é claro: quando seu espírito sai, eles voltam à terra
          e seus planos perecem.'
        scripture_cite: Salmo 146:3-4
  - id: fast-psalms-pack01-q08
    scripture:
      canon: bible
      cite: Psaume 146:5-10
      study: ot/ps/146
    correct_choice: b
    points: 12
    duration: 15
    intensity: 4
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q08.png
    copy:
      fr:
        prompt: 'Vrai ou faux : ce psaume promet que toute épreuve finit aussitôt.'
        choices:
        - key: a
          label: Vrai
        - key: b
          label: Faux
        feedback: Dieu demeure fidèle, secourt et règne. Le psaume ne promet pourtant
          pas que chaque épreuve cessera aussitôt.
        scripture_cite: Psaume 146:5-10
      es:
        prompt: 'Cierto o falso: este salmo promete que toda prueba acaba enseguida.'
        choices:
        - key: a
          label: Cierto
        - key: b
          label: Falso
        feedback: Dios sigue fiel, socorre y reina. Pero el salmo no promete que cada
          prueba termine enseguida.
        scripture_cite: Salmo 146:5-10
      en:
        prompt: 'True or false: This psalm promises every trial will end at once.'
        choices:
        - key: a
          label: 'True'
        - key: b
          label: 'False'
        feedback: God remains faithful, gives help, and reigns. Yet the psalm does
          not promise every trial will end at once.
        scripture_cite: Psalm 146:5-10
      pt-BR:
        prompt: 'Verdadeiro ou falso: este salmo promete o fim imediato de toda provação.'
        choices:
        - key: a
          label: Verdadeiro
        - key: b
          label: Falso
        feedback: Deus permanece fiel, socorre e reina. Mas o salmo não promete que
          cada provação termine de imediato.
        scripture_cite: Salmo 146:5-10
  - id: fast-psalms-pack01-q09
    scripture:
      canon: bible
      cite: Psaume 135:15-18 · Psaume 146:3-6
      study: ot/ps/135
    correct_choice: b
    points: 15
    duration: 15
    intensity: 4
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q09.png
    copy:
      fr:
        prompt: Un appui utile peut devenir une idole. À quel moment ?
        choices:
        - key: a
          label: Quand on apprend à s’en servir
        - key: b
          label: Quand il doit garantir le salut
        - key: c
          label: Quand on demande un conseil
        - key: d
          label: Quand on reconnaît ses limites
        feedback: 'Les moyens humains peuvent nous aider. Mais aucun ne peut porter
          notre salut : cette confiance appartient à Dieu.'
        scripture_cite: Psaume 135:15-18 · Psaume 146:3-6
      es:
        prompt: Un apoyo útil puede volverse un ídolo. ¿Cuándo?
        choices:
        - key: a
          label: Cuando aprendes a usarlo
        - key: b
          label: Cuando esperas que te salve
        - key: c
          label: Cuando pides consejo
        - key: d
          label: Cuando reconoces sus límites
        feedback: 'Los medios humanos pueden ayudar. Pero ninguno puede cargar con
          tu salvación: esa confianza le pertenece a Dios.'
        scripture_cite: Salmo 135:15-18 · Salmo 146:3-6
      en:
        prompt: A useful support can become an idol. When?
        choices:
        - key: a
          label: When you learn to use it
        - key: b
          label: When you expect it to save you
        - key: c
          label: When you ask for advice
        - key: d
          label: When you admit its limits
        feedback: Human help can be useful. But none can carry our salvation; that
          trust belongs to God.
        scripture_cite: Psalm 135:15-18 · Psalm 146:3-6
      pt-BR:
        prompt: Um apoio útil pode virar ídolo. Quando?
        choices:
        - key: a
          label: Quando você aprende a usá-lo
        - key: b
          label: Quando deve garantir a salvação
        - key: c
          label: Quando você pede um conselho
        - key: d
          label: Quando reconhece seus limites
        feedback: 'Os recursos humanos podem ajudar. Mas nenhum pode carregar nossa
          salvação: essa confiança pertence a Deus.'
        scripture_cite: Salmo 135:15-18 · Salmo 146:3-6
  - id: fast-psalms-pack01-q10
    scripture:
      canon: bible
      cite: Psaume 146:5-10
      study: ot/ps/146
    correct_choice: d
    points: 25
    duration: 15
    intensity: 5
    presentation:
      image: quizzes/psalms_living_god/fast-psalms-pack01-q10.png
    copy:
      fr:
        prompt: Le secours de Dieu tarde. Quel premier pas garde la foi vivante ?
        choices:
        - key: a
          label: Cacher sa souffrance
        - key: b
          label: Croire sa foi trop faible
        - key: c
          label: Exiger un signe immédiat
        - key: d
          label: Prier vrai, continuer d’espérer
        feedback: Tu peux dire à Dieu ce qui pèse et continuer d’espérer. Son délai
          ne mesure ni ta foi ni ta valeur spirituelle.
        scripture_cite: Psaume 146:5-10
      es:
        prompt: La ayuda de Dios tarda. ¿Qué primer paso mantiene viva tu fe?
        choices:
        - key: a
          label: Ocultar tu sufrimiento
        - key: b
          label: Creer que tu fe es muy débil
        - key: c
          label: Exigir una señal inmediata
        - key: d
          label: Orar con sinceridad y esperar
        feedback: Puedes contarle a Dios lo que te pesa y seguir esperando. La demora
          no mide tu fe ni tu valor espiritual.
        scripture_cite: Salmo 146:5-10
      en:
        prompt: God’s help is delayed. What first step keeps faith alive?
        choices:
        - key: a
          label: Hide your pain
        - key: b
          label: Believe your faith is too weak
        - key: c
          label: Demand an immediate sign
        - key: d
          label: Pray honestly and keep hoping
        feedback: You can tell God what weighs on you and keep hoping. His timing
          does not measure your faith or spiritual worth.
        scripture_cite: Psalm 146:5-10
      pt-BR:
        prompt: A ajuda de Deus demora. Que primeiro passo mantém sua fé viva?
        choices:
        - key: a
          label: Esconder seu sofrimento
        - key: b
          label: Achar que sua fé é fraca demais
        - key: c
          label: Exigir um sinal imediato
        - key: d
          label: Orar com sinceridade e esperar
        feedback: Você pode contar a Deus o que pesa e continuar esperando. A demora
          não mede sua fé nem seu valor espiritual.
        scripture_cite: Salmo 146:5-10
- id: psalms_servant_king
  copy:
    fr:
      title: Voici Jésus-Christ
      kicker: Psaumes 110 · 118
      lede: Un prêtre pour toujours. Une pierre rejetée devenue principale. Le Nouveau
        Testament aide les chrétiens à reconnaître Jésus-Christ dans ces images des
        Psaumes 110 et 118.
    es:
      title: Este es Jesucristo
      kicker: Salmos 110 · 118
      lede: Un sacerdote para siempre. Una piedra rechazada que llega a ser la principal.
        El Nuevo Testamento ayuda a los cristianos a reconocer a Jesucristo en estas
        imágenes de los Salmos 110 y 118.
    en:
      title: This Is Jesus Christ
      kicker: Psalms 110 · 118
      lede: A priest forever. A rejected stone made the cornerstone. The New Testament
        helps Christians recognize Jesus Christ in these images from Psalms 110 and
        118.
    pt-BR:
      title: Este é Jesus Cristo
      kicker: Salmos 110 · 118
      lede: Um sacerdote para sempre. Uma pedra rejeitada que se torna a principal.
        O Novo Testamento ajuda os cristãos a reconhecer Jesus Cristo nessas imagens
        dos Salmos 110 e 118.
  readings:
