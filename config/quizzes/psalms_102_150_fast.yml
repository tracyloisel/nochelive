- id: psalms_hears_knows
  copy:
    fr:
      title: Il entend et il connaît
      kicker: Psaumes 102 · 103 · 116 · 139
      lede: Ces psaumes ne cachent ni détresse, ni faute, ni fragilité. Dieu écoute,
        se souvient de notre poussière et reçoit même la prière qui lui demande de
        sonder le cœur.
    es:
      title: Él te escucha y te conoce
      kicker: Salmos 102 · 103 · 116 · 139
      lede: Estos salmos no esconden la angustia, el pecado ni la fragilidad. Dios
        escucha, recuerda que somos polvo y recibe incluso la oración que le pide
        examinar el corazón.
    en:
      title: He Hears and Knows You
      kicker: Psalms 102 · 103 · 116 · 139
      lede: These psalms hide neither distress, sin, nor frailty. God listens, remembers
        that we are dust, and even receives the prayer asking him to search the heart.
    pt-BR:
      title: Ele ouve e conhece você
      kicker: Salmos 102 · 103 · 116 · 139
      lede: Estes salmos não escondem angústia, pecado nem fragilidade. Deus escuta,
        lembra que somos pó e recebe até a oração que pede que ele examine o coração.
