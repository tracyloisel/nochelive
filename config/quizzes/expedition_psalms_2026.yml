  - id: ps128_travail_07
    question: Dans le Psaume 128, que mange le travailleur ?
    choices:
    - key: a
      label: Le fruit de son travail
    - key: b
      label: Le pain de ses voisins
    - key: c
      label: La nourriture du roi
    correct_choice: a
    answer: Le bonheur inclut ici le fruit concret du travail, reçu dans une vie tournée vers Dieu.
    points: 12
    duration: 15
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 128:1-2
      study: ot/ps/128
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps128_travail_07.png
  - id: ps128_voies_08
    question: À quoi le Psaume 128 relie-t-il le bonheur ?
    choices:
    - key: a
      label: Craindre Dieu, suivre ses voies
    - key: b
      label: Posséder la plus grande maison
    - key: c
      label: Ne jamais connaître l’effort
    correct_choice: a
    answer: Le texte parle de craindre Dieu et de marcher dans ses voies, pas d’acheter une vie parfaite.
    points: 12
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 128:1
      study: ot/ps/128
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps128_voies_08.png
  - id: ps128_ville_09
