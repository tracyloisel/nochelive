- id: exp_psalms_suspended_harps
  title: Les harpes suspendues
  kicker: Psaumes 135–139
  lede: Ils ont détruit leur ville, puis leur ont demandé de la chanter.
  questions:
  - id: ps135_souffle_01
    question: Que manque-t-il aux idoles malgré leur bouche ?
    choices:
    - key: a
      label: Le souffle et la parole
    - key: b
      label: Une couronne
    - key: c
      label: Des serviteurs
    correct_choice: a
    answer: Elles ont bouche, yeux et oreilles, mais elles ne parlent, ne voient, n’entendent ni ne respirent.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 135:15-17
      study: ot/ps/135
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps135_souffle_01.png
  - id: ps135_ressembler_02
    question: Que risquent ceux qui font confiance à ces idoles ?
    choices:
    - key: a
      label: De leur ressembler
    - key: b
      label: De devenir rois
    - key: c
      label: De quitter Jérusalem
    correct_choice: a
    answer: Le psaume avertit que ceux qui les fabriquent et leur font confiance deviennent comme elles.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 135:18
      study: ot/ps/135
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps135_ressembler_02.png
  - id: ps136_refrain_03
    question: Que répète chaque verset du Psaume 136 ?
    choices:
    - key: a
      label: Son amour dure toujours
    - key: b
      label: Le roi vaincra toujours
    - key: c
      label: La ville ne tombera jamais
    correct_choice: a
    answer: Le même refrain revient vingt-six fois, jusque dans les souvenirs les plus difficiles.
    points: 5
    duration: 0
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 136:1-26
      study: ot/ps/136
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps136_refrain_03.png
  - id: ps136_assemblee_04
    question: Comment ce refrain pouvait-il être chanté ?
    choices:
    - key: a
      label: Une voix, puis l’assemblée
    - key: b
      label: Un soliste sans réponse
    - key: c
      label: Une armée en marche
    correct_choice: a
    answer: La répétition suggère un appel et une réponse, sans nous donner le rythme ni l’effectif exacts.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 136:1-26
      study: ot/ps/136
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps136_assemblee_04.png
  - id: ps137_harpes_05
    question: Pourquoi les exilés suspendent-ils leurs harpes ?
    choices:
    - key: a
      label: Ils refusent l’humiliation
    - key: b
      label: Ils ont oublié la musique
    - key: c
      label: Ils préparent une fête
    correct_choice: a
    answer: Leurs vainqueurs demandent un chant de Sion. Ils refusent de faire de leur ville détruite un divertissement.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 137:1-4
      study: ot/ps/137
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps137_harpes_05.png
  - id: ps137_babylone_06
    question: Où ces exilés se trouvent-ils probablement ?
    choices:
    - key: a
      label: À Babylone
    - key: b
      label: À Rome
    - key: c
      label: En Égypte
    correct_choice: a
    answer: Le contexte babylonien après la chute de Jérusalem est très probable, mais le chanteur reste inconnu.
    points: 8
    duration: 20
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 137:1-4
      study: ot/ps/137
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps137_babylone_06.png
  - id: ps138_detresse_07
    question: La détresse a-t-elle déjà disparu dans le Psaume 138 ?
    choices:
    - key: a
      label: Non, elle est encore présente
    - key: b
      label: Oui, tout est déjà réglé
    - key: c
      label: Le psaume n’en parle pas
    correct_choice: a
    answer: La voix loue Dieu tout en marchant encore dans la détresse et en demandant de ne pas être abandonnée.
    points: 12
    duration: 15
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 138:7-8
      study: ot/ps/138
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps138_detresse_07.png
  - id: ps139_fuir_08
    question: Où peut-on fuir loin de Dieu dans le Psaume 139 ?
    choices:
    - key: a
      label: Nulle part
    - key: b
      label: Au fond de la mer
    - key: c
      label: Dans la nuit
    correct_choice: a
    answer: Ciel, séjour des morts, mer et nuit deviennent autant de lieux où la présence de Dieu rejoint la voix.
    points: 12
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 139:7-12
      study: ot/ps/139
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps139_fuir_08.png
  - id: ps139_parole_09
    question: Que connaît Dieu avant même qu’une parole soit dite ?
    choices:
    - key: a
      label: La parole tout entière
    - key: b
      label: Seulement sa dernière syllabe
    - key: c
      label: Rien avant de l’entendre
    correct_choice: a
    answer: Le psaume présente Dieu connaissant déjà la parole entière avant qu’elle arrive sur la langue.
    points: 15
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 139:1-6
      study: ot/ps/139
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps139_parole_09.png
  - id: ps139_sonde_10
    question: Après avoir jugé le mal, que demande finalement la voix ?
    choices:
    - key: a
      label: Sonde-moi et conduis-moi
    - key: b
      label: Dire que j’ai toujours raison
    - key: c
      label: Cache-moi de toute question
    correct_choice: a
    answer: Après sa colère, la voix accepte d’être elle-même sondée et demande à être conduite sur le bon chemin.
    points: 25
    duration: 15
    intensity: 5
    scripture:
      canon: bible
      cite: Psaume 139:19-24
      study: ot/ps/139
    presentation:
      image: quizzes/exp_psalms_suspended_harps/ps139_sonde_10.png
- id: exp_psalms_everything_breathes
  title: Tout ce qui respire
  kicker: Psaumes 146–150
  lede: Le Dieu qui compte les étoiles s’arrête devant les cœurs brisés.
  questions:
  - id: ps146_princes_01
    question: Pourquoi ne pas placer l’espérance ultime dans les princes ?
    choices:
    - key: a
      label: Leur souffle finit
    - key: b
      label: Ils ne parlent jamais
    - key: c
      label: Ils vivent hors des villes
    correct_choice: a
    answer: Quand leur souffle s’en va, leurs projets cessent. Le psaume oppose ce pouvoir mortel à Dieu.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 146:3-4
      study: ot/ps/146
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps146_princes_01.png
  - id: ps146_vulnerables_02
    question: De qui Dieu prend-il concrètement soin dans ce psaume ?
    choices:
    - key: a
      label: Affamés, captifs, étrangers
    - key: b
      label: Seulement des rois puissants
    - key: c
      label: Seulement des soldats
    correct_choice: a
    answer: Le texte nomme affamés, captifs, aveugles, étrangers, orphelins et veuves.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 146:5-9
      study: ot/ps/146
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps146_vulnerables_02.png
  - id: ps146_regne_03
    question: Quel règne ne s’arrête pas avec un souffle ?
    choices:
    - key: a
      label: Le règne de Dieu
    - key: b
      label: Le règne des princes
    - key: c
      label: Le règne d’une armée
    correct_choice: a
    answer: Les princes meurent ; le psaume affirme que Dieu règne de génération en génération.
    points: 5
    duration: 0
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 146:10
      study: ot/ps/146
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps146_regne_03.png
  - id: ps147_coeurs_04
    question: Que fait celui qui compte les étoiles aux cœurs brisés ?
    choices:
    - key: a
      label: Il les guérit
    - key: b
      label: Il les oublie
    - key: c
      label: Il les juge trop faibles
    correct_choice: a
    answer: Le même Dieu compte les étoiles, rassemble les dispersés et soigne les cœurs brisés.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 147:2-5
      study: ot/ps/147
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps147_coeurs_04.png
  - id: ps147_reconstruction_05
    question: Quel horizon le Psaume 147 rend-il très probable ?
    choices:
    - key: a
      label: Jérusalem rebâtie après l’exil
    - key: b
      label: Rome fondée par David
    - key: c
      label: Le Temple construit par Noé
    correct_choice: a
    answer: Le rassemblement des dispersés et la reconstruction de Jérusalem suggèrent fortement l’après-exil.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 147:2-3
      study: ot/ps/147
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps147_reconstruction_05.png
  - id: ps148_choeur_06
    question: Qui rejoint le chœur après les astres ?
    choices:
    - key: a
      label: Reliefs, animaux et humains
    - key: b
      label: Seulement les prêtres
    - key: c
      label: Seulement les adultes
    correct_choice: a
    answer: Le chant descend vers météo, reliefs, animaux, rois, peuples, jeunes et vieux.
    points: 8
    duration: 20
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 148:1-13
      study: ot/ps/148
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps148_choeur_06.png
  - id: ps148_ages_07
    question: Où commence le chant nouveau du Psaume 149 ?
    choices:
    - key: a
      label: Dans l'assemblée
    - key: b
      label: Dans le palais
    - key: c
      label: Dans le désert
    correct_choice: a
    answer: Le psaume place le chant nouveau dans l'assemblée et l'accompagne de danse et de tambourin.
    points: 12
    duration: 15
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 149:1-3
      study: ot/ps/149
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps148_ages_07.png
  - id: ps150_lieu_08
    question: Où le Psaume 150 invite-t-il d’abord à louer Dieu ?
    choices:
    - key: a
      label: Dans son sanctuaire
    - key: b
      label: Dans le palais du roi
    - key: c
      label: Dans une ville étrangère
    correct_choice: a
    answer: Le psaume commence dans le sanctuaire et l’étendue céleste, puis élargit l’appel à tout souffle.
    points: 12
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 150:1
      study: ot/ps/150
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps150_lieu_08.png
  - id: ps150_instrument_09
    question: Dans le Psaume 150, quel est le dernier instrument ?
    choices:
    - key: a
      label: Tout ce qui respire
    - key: b
      label: La cymbale la plus forte
    - key: c
      label: Le cor du roi
    correct_choice: a
    answer: Après tous les instruments, l’appel final vise tout être vivant qui possède un souffle.
    points: 15
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 150:1-6
      study: ot/ps/150
    presentation:
      image: quizzes/exp_psalms_everything_breathes/ps150_instrument_09.png
  - id: souffle_echo_10
    question: Quel motif relie idoles, princes et louange finale ?
    choices:
    - key: a
      label: Le souffle
    - key: b
      label: La couronne
    - key: c
      label: La porte de la ville
    correct_choice: a
    answer: Les idoles n’en ont pas, les princes le perdent, puis tout souffle loue. C’est un écho, pas un code secret.
