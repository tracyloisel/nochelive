---
packs:
- id: exp_psalms_disappearing_voice
  title: La voix qui disparaît
  kicker: Psaumes 102–103
  lede: Quand tes jours partent en fumée, qu’est-ce qui peut encore tenir ?
  questions:
  - id: ps102_fumee_01
    question: Que craint la voix au début du Psaume 102 ?
    choices:
    - key: a
      label: Disparaître
    - key: b
      label: Perdre son trône
    - key: c
      label: Oublier une victoire
    correct_choice: a
    answer: 'Ses jours partent en fumée et son corps s’épuise : elle craint de disparaître.'
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 102:2-12
      study: ot/ps/102
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps102_fumee_01.png
  - id: ps102_herbe_02
    question: À quoi son cœur est-il comparé ?
    choices:
    - key: a
      label: À de l’herbe desséchée
    - key: b
      label: À une muraille fissurée
    - key: c
      label: À une rivière tarie
    correct_choice: a
    answer: 'Son cœur est comme une herbe frappée et desséchée : la souffrance atteint tout son être.'
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 102:5
      study: ot/ps/102
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps102_herbe_02.png
  - id: ps102_mais_toi_03
    question: Quel tournant ouvre enfin un avenir ?
    choices:
    - key: a
      label: Mais toi, tu subsistes
    - key: b
      label: Moi seul, je résisterai
    - key: c
      label: Tout est déjà réparé
    correct_choice: a
    answer: La voix ne prétend pas aller mieux. Elle tourne son regard vers Dieu, qui demeure.
    points: 5
    duration: 0
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 102:13-14
      study: ot/ps/102
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps102_mais_toi_03.png
  - id: ps102_sion_04
    question: À quelle ville sa douleur finit-elle par se mêler ?
    choices:
    - key: a
      label: Sion
    - key: b
      label: Rome
    - key: c
      label: Ninive
    correct_choice: a
    answer: Sa plainte personnelle rejoint les pierres et la poussière de Sion, qui attend d’être relevée.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 102:14-23
      study: ot/ps/102
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps102_sion_04.png
  - id: ps102_avenir_05
    question: Qui devra encore louer Dieu après cette génération ?
    choices:
    - key: a
      label: Un peuple à venir
    - key: b
      label: Seulement les rois
    - key: c
      label: Personne après elle
    correct_choice: a
    answer: Le psaume imagine une génération future qui lira, louera Dieu et trouvera encore Sion devant elle.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 102:19-29
      study: ot/ps/102
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps102_avenir_05.png
  - id: ps103_memoire_06
    question: Que demande le Psaume 103 à l’âme ?
    choices:
    - key: a
      label: N’oublie aucun bienfait
    - key: b
      label: Ne regarde que tes fautes
    - key: c
      label: Oublie ce qui t’a blessé
    correct_choice: a
    answer: La voix commande à son âme de bénir Dieu et de ne pas oublier ses bienfaits.
    points: 8
    duration: 20
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 103:1-5
      study: ot/ps/103
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps103_memoire_06.png
  - id: ps103_distance_07
    question: Que fait Dieu des fautes dans l’image du psaume ?
    choices:
    - key: a
      label: Il les éloigne très loin
    - key: b
      label: Il les garde pour humilier
    - key: c
      label: Il nie qu’elles existent
    correct_choice: a
    answer: Comme l’orient est loin de l’occident, le psaume représente Dieu éloignant les fautes.
    points: 12
    duration: 15
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 103:8-12
      study: ot/ps/103
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps103_distance_07.png
  - id: ps103_fragilite_08
    question: Comment Dieu regarde-t-il notre fragilité ?
    choices:
    - key: a
      label: Avec compassion
    - key: b
      label: Avec surprise
    - key: c
      label: Avec mépris
    correct_choice: a
    answer: Le psaume dit que Dieu se souvient que nous sommes poussière et nous regarde avec compassion.
    points: 12
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 103:13-14
      study: ot/ps/103
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps103_fragilite_08.png
  - id: ps103_eternite_09
    question: La vie passe comme l’herbe. Qu’est-ce qui demeure ?
    choices:
    - key: a
      label: L’amour fidèle de Dieu
    - key: b
      label: La force du corps
    - key: c
      label: La renommée humaine
    correct_choice: a
    answer: La vie humaine est brève, mais l’amour de Dieu est présenté comme allant d’éternité en éternité.
    points: 15
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 103:15-18
      study: ot/ps/103
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps103_eternite_09.png
  - id: ps102_hebreux_10
    question: Dans Hébreux 1, ces mots du Psaume 102 parlent de qui ?
    choices:
    - key: a
      label: Du Fils
    - key: b
      label: Du chanteur anonyme
    - key: c
      label: De Melchisédek
    correct_choice: a
    answer: Hébreux applique au Fils les mots sur celui qui demeure. Cela ne fait pas de toute la plainte la voix de Jésus.
    points: 25
    duration: 15
    intensity: 5
    scripture:
      canon: bible
      cite: Psaume 102:26-28
      study: ot/ps/102
    presentation:
      image: quizzes/exp_psalms_disappearing_voice/ps102_hebreux_10.png
- id: exp_psalms_nameless_king
  title: Le Roi sans nom
  kicker: Psaume 110
  lede: 'Un roi reçoit une promesse étrange : prêtre pour toujours.'
  questions:
  - id: ps110_roles_01
    question: Quels deux rôles le Psaume 110 réunit-il ?
    choices:
    - key: a
      label: Roi et prêtre
    - key: b
      label: Prophète et juge
    - key: c
      label: Scribe et soldat
    correct_choice: a
    answer: Une première parole concerne un roi ; une seconde le déclare prêtre selon Melchisédek.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 110:1-4
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_roles_01.png
  - id: ps110_roi_inconnu_02
    question: Le texte permet-il de nommer ce roi avec certitude ?
    choices:
    - key: a
      label: Non, il reste inconnu
    - key: b
      label: Oui, c’est David
    - key: c
      label: Oui, c’est Salomon
    correct_choice: a
    answer: Le titre transmis l’associe à David, mais le roi visé et la première scène historique restent inconnus.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 110:1-7
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_roi_inconnu_02.png
  - id: ps110_droite_03
    question: Où Dieu invite-t-il ce seigneur à s’asseoir ?
    choices:
    - key: a
      label: À sa droite
    - key: b
      label: Derrière l’autel
    - key: c
      label: Hors de Jérusalem
    correct_choice: a
    answer: La droite représente ici une place d’autorité accordée par Dieu.
    points: 5
    duration: 0
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 110:1
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_droite_03.png
  - id: ps110_melchisedek_04
    question: Pourquoi Melchisédek surprend-il au verset 4 ?
    choices:
    - key: a
      label: Le roi devient aussi prêtre
    - key: b
      label: Il détruit Jérusalem
    - key: c
      label: Il écrit le psaume
    correct_choice: a
    answer: Le serment ajoute un rôle sacerdotal au roi. Le rapport historique exact à Melchisédek reste discuté.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 110:4
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_melchisedek_04.png
  - id: ps110_fin_05
    question: Le psaume finit-il avec le serment sacerdotal ?
    choices:
    - key: a
      label: Non, il poursuit vers le combat
    - key: b
      label: Oui, tout s’arrête là
    - key: c
      label: Non, il raconte l’exil
    correct_choice: a
    answer: Après le serment, le poème poursuit avec une victoire violente. L’expédition ne doit pas l’effacer.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 110:5-7
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_fin_05.png
  - id: ps110_scene_06
    question: Que reste-t-il inconnu derrière cette scène royale ?
    choices:
    - key: a
      label: Le roi et la cérémonie
    - key: b
      label: Le nom de Jérusalem
    - key: c
      label: L’existence de la royauté
    correct_choice: a
    answer: Le psaume est royal, mais il ne permet pas de reconstruire avec certitude le roi ni la cérémonie.
    points: 8
    duration: 20
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 110:1-7
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_scene_06.png
  - id: ps110_matthieu_07
    question: Dans Matthieu 22, quelle énigme Jésus pose-t-il ?
    choices:
    - key: a
      label: David appelle son fils Seigneur
    - key: b
      label: Moïse refuse d’être roi
    - key: c
      label: Salomon devient prophète
    correct_choice: a
    answer: Jésus demande comment le Messie peut être fils de David si David l’appelle aussi Seigneur.
    points: 12
    duration: 15
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 110:1
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_matthieu_07.png
  - id: ps110_hebreux5_08
    question: Dans Hébreux 5, qui est le prêtre pour toujours ?
    choices:
    - key: a
      label: Jésus-Christ
    - key: b
      label: Le roi historique certain
    - key: c
      label: Le chanteur du psaume
    correct_choice: a
    answer: Hébreux reprend le serment pour le Christ et le nomme auteur d’un salut éternel.
    points: 12
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 110:4
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_hebreux5_08.png
  - id: ps110_hebreux7_09
    question: Selon Hébreux 7, pourquoi peut-il sauver pleinement ?
    choices:
    - key: a
      label: Il vit toujours et intercède
    - key: b
      label: Il gagne chaque bataille
    - key: c
      label: Il ignore toute faiblesse
    correct_choice: a
    answer: Hébreux fonde cette espérance sur le Christ vivant toujours pour intercéder.
    points: 15
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 110:4
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_hebreux7_09.png
  - id: ps110_lds_10
    question: Dans la lecture LDS, quel ordre éclaire ce serment ?
    choices:
    - key: a
      label: L’ordre du Fils de Dieu
    - key: b
      label: L’ordre des rois de Juda
    - key: c
      label: L’ordre des scribes
    correct_choice: a
    answer: Alma et Doctrine et Alliances relient cet ordre au Fils de Dieu et à la prêtrise de Melchisédek.
    points: 25
    duration: 15
    intensity: 5
    scripture:
      canon: bible
      cite: Psaume 110:4
      study: ot/ps/110
    presentation:
      image: quizzes/exp_psalms_nameless_king/ps110_lds_10.png
- id: exp_psalms_cry_stone_seek
  title: Cherche-moi
  kicker: Psaumes 116–119
  lede: Crier, traverser la porte et demander à Dieu de venir te chercher.
  questions:
  - id: ps116_appel_01
    question: Quand la mort l’enserre, que fait d’abord la voix ?
    choices:
    - key: a
      label: Elle appelle Dieu
    - key: b
      label: Elle cache sa peur
    - key: c
      label: Elle promet de tout contrôler
    correct_choice: a
    answer: 'Son cri tient en peu de mots : elle appelle le nom de Dieu et demande d’être délivrée.'
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 116:1-4
      study: ot/ps/116
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps116_appel_01.png
  - id: ps116_public_02
    question: Après la délivrance, où porte-t-elle sa gratitude ?
    choices:
    - key: a
      label: Devant tout le peuple
    - key: b
      label: Dans un lieu secret
    - key: c
      label: Devant les armées
    correct_choice: a
    answer: La voix accomplit ses vœux publiquement et transforme sa délivrance en témoignage partagé.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 116:12-19
      study: ot/ps/116
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps116_public_02.png
  - id: ps117_nations_03
    question: Qui le Psaume 117 invite-t-il à louer Dieu ?
    choices:
    - key: a
      label: Toutes les nations
    - key: b
      label: Seulement les prêtres
    - key: c
      label: Seulement Jérusalem
    correct_choice: a
    answer: En deux versets, le psaume appelle toutes les nations et tous les peuples.
    points: 5
    duration: 0
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 117:1-2
      study: ot/ps/117
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps117_nations_03.png
  - id: ps117_romains_04
    question: Pourquoi Paul reprend-il le Psaume 117 dans Romains 15 ?
    choices:
    - key: a
      label: Les nations louent Dieu
    - key: b
      label: Le Temple doit être rebâti
    - key: c
      label: David doit devenir prêtre
    correct_choice: a
    answer: Paul y voit les nations accueillies avec le peuple de Dieu dans la louange et l’espérance.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 117:1
      study: ot/ps/117
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps117_romains_04.png
  - id: ps118_pierre_05
    question: Que devient la pierre rejetée du Psaume 118 ?
    choices:
    - key: a
      label: La pierre principale
    - key: b
      label: Une pierre oubliée
    - key: c
      label: Une arme de guerre
    correct_choice: a
    answer: Ce que les bâtisseurs avaient rejeté devient la pierre dont la construction dépend.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 118:22-23
      study: ot/ps/118
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps118_pierre_05.png
  - id: ps118_actes_06
    question: Dans Actes 4, qui devient cette pierre ?
    choices:
    - key: a
      label: Jésus-Christ
    - key: b
      label: Pierre l’apôtre
    - key: c
      label: Le roi du Psaume 110
    correct_choice: a
    answer: Pierre applique l’image à Jésus ressuscité et affirme que le salut se trouve en lui.
    points: 8
    duration: 20
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 118:22
      study: ot/ps/118
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps118_actes_06.png
  - id: ps119_return_07
    question: Tu as raté trois jours. Que faire d’après la fin du Psaume 119 ?
    choices:
    - key: a
      label: Me cacher jusqu’à aller mieux
    - key: b
      label: Me promettre de ne plus échouer
    - key: c
      label: Demander à Dieu de me chercher
    - key: d
      label: Abandonner le chemin
    correct_choice: c
    answer: La voix ne dit pas qu’elle a réussi. Elle reconnaît s’être perdue et demande à Dieu de la chercher.
    points: 12
    duration: 15
    intensity: 3
    scripture:
      canon: bible
      cite: Psaume 119:176
      study: ot/ps/119
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps119_return_07.png
  - id: ps119_teach_08
    question: Ton esprit part ailleurs. Quel réflexe revient dans le Psaume 119 ?
    choices:
    - key: a
      label: Faire comme si j’avais compris
    - key: b
      label: Demander à Dieu de m’enseigner
    - key: c
      label: Arrêter dès que je me disperse
    - key: d
      label: Réciter pour mériter son aide
    correct_choice: b
    answer: 'Le psaume revient à cette demande : enseigne-moi, donne-moi de comprendre et fais-moi vivre.'
    points: 12
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 119:12
      study: ot/ps/119
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps119_teach_08.png
  - id: ps119_order_09
    question: Ta routine tient. Que rappelle pourtant la fin du Psaume 119 ?
    choices:
    - key: a
      label: Une routine empêche de se perdre
    - key: b
      label: L’ordre aide sans remplacer Dieu
    - key: c
      label: Toute discipline est inutile
    - key: d
      label: Dieu aide, donc je n’agis plus
    correct_choice: b
    answer: Le poème est très ordonné, mais il finit avec une brebis perdue. La discipline ne remplace pas Dieu.
    points: 15
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 119:1-176
      study: ot/ps/119
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps119_order_09.png
  - id: ps119_help_10
    question: "« Dieu me cherche, donc je n’ai rien à faire. » Que répond le psaume ?"
    choices:
    - key: a
      label: Attendre suffit toujours
    - key: b
      label: Dieu n’aide que les parfaits
    - key: c
      label: Demander son aide, puis agir
    - key: d
      label: Les règles passent avant Dieu
    correct_choice: c
    answer: La voix cherche Dieu, demande d’être enseignée, puis d’être cherchée. L’aide et le prochain pas vont ensemble.
    points: 25
    duration: 15
    intensity: 5
    scripture:
      canon: bible
      cite: Psaume 119:10
      study: ot/ps/119
    presentation:
      image: quizzes/exp_psalms_cry_stone_seek/ps119_help_10.png
- id: exp_psalms_house_table_city
  title: La maison que Dieu bâtit
  kicker: Psaumes 127–128
  lede: Travailler, aimer et bâtir sans porter seul le poids du monde.
  questions:
  - id: ps127_batir_01
    question: Sans Dieu, que devient le travail des bâtisseurs ?
    choices:
    - key: a
      label: Un effort vain
    - key: b
      label: Une faute impardonnable
    - key: c
      label: Une victoire certaine
    correct_choice: a
    answer: Le psaume ne méprise pas le travail ; il refuse d’en faire une fondation suffisante sans Dieu.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 127:1
      study: ot/ps/127
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps127_batir_01.png
  - id: ps127_garde_02
    question: Sans Dieu, que vaut la veille du gardien ?
    choices:
    - key: a
      label: Elle devient vaine
    - key: b
      label: Elle garantit la ville
    - key: c
      label: Elle remplace la prière
    correct_choice: a
    answer: Le gardien veille réellement, mais sa vigilance n’est pas présentée comme une sécurité absolue.
    points: 5
    duration: 0
    intensity: 1
    scripture:
      canon: bible
      cite: Psaume 127:1
      study: ot/ps/127
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps127_garde_02.png
  - id: ps127_labeur_03
    question: Que dénonce le Psaume 127 dans le travail ?
    choices:
    - key: a
      label: Le labeur anxieux sans Dieu
    - key: b
      label: Tout effort humain
    - key: c
      label: Le besoin de dormir
    correct_choice: a
    answer: Il vise l’effort qui se lève tôt, se couche tard et vit comme si tout dépendait de lui seul.
    points: 5
    duration: 0
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 127:2
      study: ot/ps/127
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps127_labeur_03.png
  - id: ps127_enfants_04
    question: Comment les enfants sont-ils présentés dans le psaume ?
    choices:
    - key: a
      label: Comme un héritage reçu
    - key: b
      label: Comme une preuve de mérite
    - key: c
      label: Comme une charge honteuse
    correct_choice: a
    answer: Le texte parle d’un héritage reçu. Le jeu ne classe ni fertilité ni forme familiale.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 127:3-5
      study: ot/ps/127
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps127_enfants_04.png
  - id: ps127_porte_05
    question: Dans le monde ancien, que se passait aussi à la porte ?
    choices:
    - key: a
      label: Les affaires de la cité
    - key: b
      label: Les sacrifices du Temple
    - key: c
      label: Les récoltes des champs
    correct_choice: a
    answer: La porte était probablement un lieu civique et judiciaire, pas seulement une défense militaire.
    points: 8
    duration: 20
    intensity: 2
    scripture:
      canon: bible
      cite: Psaume 127:5
      study: ot/ps/127
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps127_porte_05.png
  - id: ps127_montee_06
    question: À quel voyage associe-t-on les Chants des montées ?
    choices:
    - key: a
      label: La montée vers Jérusalem
    - key: b
      label: La fuite vers l’Égypte
    - key: c
      label: La conquête de Babylone
    correct_choice: a
    answer: On les associe généralement aux pèlerinages vers Jérusalem, sans connaître un itinéraire précis.
    points: 8
    duration: 20
    intensity: 3
    scripture:
      canon: bible
      cite: Psaumes 127–128
      study: ot/ps/127
    presentation:
