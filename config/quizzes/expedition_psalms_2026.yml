    choices:
    - key: a
      label: Non, bâtir avec lui
    - key: b
      label: Oui, attendre sans agir
    - key: c
      label: Non, tout porter seul
    correct_choice: a
    answer: Le psaume garde bâtisseurs et gardiens à l’œuvre, mais refuse qu’ils se prennent pour la fondation.
