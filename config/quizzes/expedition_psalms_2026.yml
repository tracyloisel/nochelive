    choices:
    - key: a
      label: Vers le bien de Jérusalem
    - key: b
      label: Vers une richesse privée
    - key: c
      label: Vers la chute des voisins
    correct_choice: a
    answer: La vision s’élargit de la table au bien de Jérusalem et à la paix sur Israël.
    points: 15
    duration: 15
    intensity: 4
    scripture:
      canon: bible
      cite: Psaume 128:5-6
      study: ot/ps/128
    presentation:
      image: quizzes/exp_psalms_house_table_city/ps128_ville_09.png
  - id: ps127_agir_10
