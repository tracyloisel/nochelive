packs:
  - id: perdido_encontrado
    title: "Perdido y hallado"
    kicker: "Parábolas de Jesús"
    lede: "Una oveja, una moneda y un hijo: la alegría de Dios cuando alguien vuelve."
    questions:
      - id: ovejas_cien
        question: "El pastor tenía cien ovejas. ¿Cuántas se perdieron?"
        choices:
          - key: una
            label: "Una"
          - key: diez
            label: "Diez"
          - key: cincuenta
            label: "Cincuenta"
        correct_choice: una
        answer: "Una. El pastor dejó las noventa y nueve para buscar la que se había perdido."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Lucas 15:3-4"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/ovejas_cien.jpg
      - id: hasta_encontrarla
        question: "¿Hasta cuándo buscó el pastor a la oveja perdida?"
        choices:
          - key: encontrarla
            label: "Hasta encontrarla"
          - key: anochecer
            label: "Hasta el anochecer"
          - key: cansarse
            label: "Hasta cansarse"
        correct_choice: encontrarla
        answer: "Hasta encontrarla. La búsqueda no terminó mientras la oveja siguiera perdida."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Lucas 15:4"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/hasta_encontrarla.jpg
      - id: hombros_gozoso
        question: "Cuando encontró la oveja, el pastor la puso…"
        choices:
          - key: hombros
            label: "Sobre sus hombros"
          - key: corral
            label: "Sola en el corral"
          - key: carro
            label: "En un carro"
        correct_choice: hombros
        answer: "Sobre sus hombros, gozoso. Después llamó a sus amigos para celebrarlo."
        points: 5
        duration: 0
        intensity: 2
        scripture:
          canon: bible
          cite: "Lucas 15:5-6"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/hombros_gozoso.jpg
      - id: monedas_diez
        question: "La mujer de la segunda parábola tenía…"
        choices:
          - key: diez
            label: "Diez monedas"
          - key: doce
            label: "Doce monedas"
          - key: cien
            label: "Cien monedas"
        correct_choice: diez
        answer: "Diez monedas. Cuando perdió una, encendió una lámpara y buscó con cuidado."
        points: 8
        duration: 20
        intensity: 2
        scripture:
          canon: bible
          cite: "Lucas 15:8"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/monedas_diez.jpg
      - id: lampara_escoba
        question: "Para hallar su moneda, la mujer encendió una lámpara y…"
        choices:
          - key: barrio
            label: "Barrió la casa"
          - key: vendio
            label: "Vendió la casa"
          - key: espero
            label: "Esperó junto a la puerta"
        correct_choice: barrio
        answer: "Barrió la casa y buscó con diligencia hasta encontrar la moneda."
        points: 8
        duration: 20
        intensity: 2
        scripture:
          canon: bible
          cite: "Lucas 15:8"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/lampara_escoba.jpg
      - id: gozo_angeles
        question: "Jesús comparó esa alegría con el gozo de los ángeles cuando…"
        choices:
          - key: arrepiente
            label: "Un pecador se arrepiente"
          - key: rey_nace
            label: "Nace un rey"
          - key: templo_abre
            label: "Se abre un templo"
        correct_choice: arrepiente
        answer: "Cuando un pecador se arrepiente. El cielo celebra a quien regresa."
        points: 8
        duration: 20
        intensity: 3
        scripture:
          canon: bible
          cite: "Lucas 15:9-10"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/gozo_angeles.jpg
      - id: parte_herencia
        question: "¿Qué pidió el hijo menor a su padre?"
        choices:
          - key: herencia
            label: "Su parte de la herencia"
          - key: rebano
            label: "Todo el rebaño"
          - key: corona
            label: "La corona familiar"
        correct_choice: herencia
        answer: "Pidió la parte de los bienes que le correspondía y partió a un país lejano."
        points: 12
        duration: 15
        intensity: 3
        scripture:
          canon: bible
          cite: "Lucas 15:11-13"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/parte_herencia.jpg
      - id: pais_lejano
        question: "En el país lejano, el hijo menor…"
        choices:
          - key: desperdicio
            label: "Desperdició sus bienes"
          - key: multiplico
            label: "Multiplicó sus bienes"
          - key: reino
            label: "Fundó un reino"
        correct_choice: desperdicio
        answer: "Desperdició sus bienes. Cuando llegó el hambre, deseó incluso la comida de los cerdos."
        points: 12
        duration: 15
        intensity: 4
        scripture:
          canon: bible
          cite: "Lucas 15:13-16"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/pais_lejano.jpg
      - id: padre_corrio
        question: "Al ver regresar a su hijo, el padre…"
        choices:
          - key: corrio
            label: "Corrió y lo abrazó"
          - key: cerro
            label: "Cerró la puerta"
          - key: escondio
            label: "Se escondió"
        correct_choice: corrio
        answer: "Sintió compasión, corrió hacia él, lo abrazó y preparó una fiesta."
        points: 15
        duration: 15
        intensity: 4
        scripture:
          canon: bible
          cite: "Lucas 15:20-24"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/padre_corrio.jpg
      - id: muerto_revive
        question: "¿Por qué dijo el padre que era necesario celebrar?"
        choices:
          - key: vuelto
            label: "El perdido había vuelto"
          - key: cosecha
            label: "La cosecha había comenzado"
          - key: deuda
            label: "La deuda estaba pagada"
          - key: herencia
            label: "Había recibido una herencia"
        correct_choice: vuelto
        answer: "Porque su hijo estaba muerto y había revivido; estaba perdido y había sido hallado."
        points: 25
        duration: 15
        intensity: 5
        scripture:
          canon: bible
          cite: "Lucas 15:31-32"
          study: "nt/luke/15"
        presentation:
          image: quizzes/perdido_encontrado/muerto_revive.jpg

  - id: secretos_reino
    title: "Los secretos del Reino"
    kicker: "Parábolas de Jesús"
    lede: "Semillas, levadura y tesoros: el Reino empieza pequeño y vale más que todo."
    questions:
      - id: semilla_camino
        question: "En la parábola del sembrador, la semilla junto al camino fue comida por…"
        choices:
          - key: aves
            label: "Las aves"
          - key: ovejas
            label: "Las ovejas"
          - key: langostas
            label: "Las langostas"
        correct_choice: aves
        answer: "Las aves se la comieron. Jesús la comparó con quien oye la palabra y no la comprende."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Mateo 13:3-4, 19"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/semilla_camino.jpg
      - id: pedregales_raiz
        question: "La semilla entre piedras se secó porque no tenía…"
        choices:
          - key: raiz
            label: "Raíz"
          - key: lluvia
            label: "Color"
          - key: espigas
            label: "Espigas"
        correct_choice: raiz
        answer: "No tenía raíz. Recibió la palabra con gozo, pero no resistió la dificultad."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Mateo 13:5-6, 20-21"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/pedregales_raiz.jpg
      - id: buena_tierra
        question: "¿Dónde produjo fruto la semilla?"
        choices:
          - key: buena
            label: "En buena tierra"
          - key: camino
            label: "En el camino"
          - key: espinos
            label: "Entre espinos"
        correct_choice: buena
        answer: "En buena tierra. Representa a quien oye, comprende y deja que la palabra dé fruto."
        points: 5
        duration: 0
        intensity: 2
        scripture:
          canon: bible
          cite: "Mateo 13:8, 23"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/buena_tierra.jpg
      - id: espinos_ahogan
        question: "¿Qué ahogó la palabra representada por la semilla entre espinos?"
        choices:
          - key: afanes
            label: "Los afanes y el engaño de las riquezas"
          - key: frio
            label: "El frío de la noche"
          - key: silencio
            label: "El silencio del campo"
        correct_choice: afanes
        answer: "Los afanes del mundo y el engaño de las riquezas hicieron que quedara sin fruto."
        points: 8
        duration: 20
        intensity: 2
        scripture:
          canon: bible
          cite: "Mateo 13:7, 22"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/espinos_ahogan.jpg
      - id: mostaza_crece
        question: "El Reino es como una semilla de mostaza que, al crecer…"
        choices:
          - key: grande
            label: "Se hace mayor que las hortalizas"
          - key: desaparece
            label: "Desaparece bajo la tierra"
          - key: piedra
            label: "Se convierte en piedra"
        correct_choice: grande
        answer: "Aunque empieza diminuta, se hace grande y las aves vienen a sus ramas."
        points: 8
        duration: 20
        intensity: 2
        scripture:
          canon: bible
          cite: "Mateo 13:31-32"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/mostaza_crece.jpg
      - id: levadura_masa
        question: "La mujer escondió la levadura en…"
        choices:
          - key: harina
            label: "Una gran cantidad de harina"
          - key: aceite
            label: "Una jarra de aceite"
          - key: arena
            label: "Un montón de arena"
        correct_choice: harina
        answer: "La mezcló con harina hasta que toda la masa quedó leudada. El Reino transforma desde dentro."
        points: 8
        duration: 20
        intensity: 3
        scripture:
          canon: bible
          cite: "Mateo 13:33"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/levadura_masa.jpg
      - id: tesoro_campo
        question: "Al hallar un tesoro escondido, el hombre lo volvió a esconder y…"
        choices:
          - key: compro
            label: "Vendió todo y compró el campo"
          - key: olvido
            label: "Olvidó dónde estaba"
          - key: entrego
            label: "Lo entregó al rey"
        correct_choice: compro
        answer: "Lleno de alegría, vendió todo lo que tenía y compró aquel campo."
        points: 12
        duration: 15
        intensity: 3
        scripture:
          canon: bible
          cite: "Mateo 13:44"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/tesoro_campo.jpg
      - id: mercader_perlas
        question: "El mercader de la parábola buscaba…"
        choices:
          - key: perlas
            label: "Buenas perlas"
          - key: coronas
            label: "Coronas antiguas"
          - key: caballos
            label: "Caballos veloces"
        correct_choice: perlas
        answer: "Buscaba buenas perlas. Cuando encontró una de gran valor, reconoció algo incomparable."
        points: 12
        duration: 15
        intensity: 4
        scripture:
          canon: bible
          cite: "Mateo 13:45-46"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/mercader_perlas.jpg
      - id: vendio_todo
        question: "¿Qué hizo el mercader para obtener la perla de gran precio?"
        choices:
          - key: todo
            label: "Vendió todo lo que tenía"
          - key: cambio
            label: "La cambió por tres monedas"
          - key: espero
            label: "Esperó a que bajara el precio"
        correct_choice: todo
        answer: "Vendió todo lo que tenía y la compró. El Reino merece una decisión completa."
        points: 15
        duration: 15
        intensity: 4
        scripture:
          canon: bible
          cite: "Mateo 13:45-46"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/vendio_todo.jpg
      - id: valor_reino
        question: "¿Qué comparten el tesoro escondido y la perla de gran precio?"
        choices:
          - key: valor
            label: "El Reino vale más que todo lo demás"
          - key: miedo
            label: "El Reino debe mantenerse en secreto"
          - key: suerte
            label: "El Reino se obtiene por suerte"
          - key: poder
            label: "El Reino da poder político"
        correct_choice: valor
        answer: "Ambas parábolas muestran una alegría tan grande que vale la pena entregarlo todo por el Reino."
        points: 25
        duration: 15
        intensity: 5
        scripture:
          canon: bible
          cite: "Mateo 13:44-46"
          study: "nt/matt/13"
        presentation:
          image: quizzes/secretos_reino/valor_reino.jpg

  - id: amar_projimo
    title: "Amar al prójimo"
    kicker: "Parábolas de Jesús"
    lede: "Un camino peligroso, una deuda imposible y una pregunta: ¿quién mostró misericordia?"
    questions:
      - id: camino_jerico
        question: "El hombre de la parábola bajaba de Jerusalén a…"
        choices:
          - key: jerico
            label: "Jericó"
          - key: belen
            label: "Belén"
          - key: nazaret
            label: "Nazaret"
        correct_choice: jerico
        answer: "Bajaba a Jericó cuando cayó en manos de ladrones, que lo dejaron herido."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Lucas 10:30"
          study: "nt/luke/10"
        presentation:
          image: quizzes/amar_projimo/camino_jerico.jpg
      - id: pasaron_largo
        question: "¿Quiénes vieron al herido y pasaron de largo?"
        choices:
          - key: sacerdote_levita
            label: "Un sacerdote y un levita"
          - key: pescadores
            label: "Dos pescadores"
          - key: soldados
            label: "Dos soldados"
        correct_choice: sacerdote_levita
        answer: "Un sacerdote y un levita lo vieron, pero ambos pasaron por el otro lado."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Lucas 10:31-32"
          study: "nt/luke/10"
        presentation:
          image: quizzes/amar_projimo/pasaron_largo.jpg
      - id: samaritano_compasion
        question: "Cuando el samaritano vio al herido, sintió…"
        choices:
          - key: compasion
            label: "Compasión"
          - key: desprecio
            label: "Desprecio"
          - key: impaciencia
            label: "Impaciencia"
        correct_choice: compasion
        answer: "Sintió compasión. Vendó sus heridas, lo llevó a una posada y cuidó de él."
        points: 5
        duration: 0
        intensity: 2
        scripture:
          canon: bible
          cite: "Lucas 10:33-34"
          study: "nt/luke/10"
        presentation:
          image: quizzes/amar_projimo/samaritano_compasion.jpg
      - id: aceite_vino
        question: "¿Qué derramó el samaritano sobre las heridas?"
        choices:
          - key: aceite_vino
            label: "Aceite y vino"
          - key: agua_sal
            label: "Agua y sal"
          - key: leche_miel
            label: "Leche y miel"
        correct_choice: aceite_vino
        answer: "Aceite y vino. Después puso al hombre sobre su cabalgadura y pagó la posada."
        points: 8
        duration: 20
        intensity: 2
        scripture:
          canon: bible
          cite: "Lucas 10:34-35"
          study: "nt/luke/10"
        presentation:
          image: quizzes/amar_projimo/aceite_vino.jpg
      - id: mostro_misericordia
        question: "Para Jesús, ¿quién fue el prójimo del hombre herido?"
        choices:
          - key: misericordia
            label: "El que mostró misericordia"
          - key: cercano
            label: "El que vivía más cerca"
          - key: conocido
            label: "El que ya lo conocía"
        correct_choice: misericordia
        answer: "El que mostró misericordia. Jesús concluyó: ve y haz tú lo mismo."
        points: 8
        duration: 20
        intensity: 2
        scripture:
          canon: bible
          cite: "Lucas 10:36-37"
          study: "nt/luke/10"
        presentation:
          image: quizzes/amar_projimo/mostro_misericordia.jpg
      - id: deuda_diez_mil
        question: "En la parábola del siervo sin misericordia, su deuda era de…"
        choices:
          - key: diez_mil
            label: "Diez mil talentos"
          - key: cien
            label: "Cien denarios"
          - key: diez
            label: "Diez monedas"
        correct_choice: diez_mil
        answer: "Diez mil talentos: una deuda enorme que el siervo no podía pagar."
        points: 8
        duration: 20
        intensity: 3
        scripture:
          canon: bible
          cite: "Mateo 18:23-25"
          study: "nt/matt/18"
        presentation:
          image: quizzes/amar_projimo/deuda_diez_mil.jpg
      - id: rey_perdono
        question: "Al oír la súplica del siervo, el rey…"
        choices:
          - key: perdono
            label: "Le perdonó la deuda"
          - key: duplico
            label: "Duplicó la deuda"
          - key: ignoro
            label: "Lo ignoró"
        correct_choice: perdono
        answer: "Tuvo compasión, lo dejó libre y le perdonó toda la deuda."
        points: 12
        duration: 15
        intensity: 3
        scripture:
          canon: bible
          cite: "Mateo 18:26-27"
          study: "nt/matt/18"
        presentation:
          image: quizzes/amar_projimo/rey_perdono.jpg
      - id: cien_denarios
        question: "El compañero del siervo le debía…"
        choices:
          - key: cien
            label: "Cien denarios"
          - key: diez_mil
            label: "Diez mil talentos"
          - key: nada
            label: "Nada"
        correct_choice: cien
        answer: "Cien denarios. A pesar de haber sido perdonado, el siervo exigió el pago y no tuvo compasión."
        points: 12
        duration: 15
        intensity: 4
        scripture:
          canon: bible
          cite: "Mateo 18:28-30"
          study: "nt/matt/18"
        presentation:
          image: quizzes/amar_projimo/cien_denarios.jpg
      - id: corazon_perdona
        question: "¿Qué enseñanza cerró la parábola del siervo?"
        choices:
          - key: corazon
            label: "Perdonar de corazón"
          - key: cobrar
            label: "Cobrar cada deuda"
          - key: olvidar
            label: "Olvidar a quien falla"
        correct_choice: corazon
        answer: "Quien ha recibido misericordia debe perdonar de corazón a su hermano."
        points: 15
        duration: 15
        intensity: 4
        scripture:
          canon: bible
          cite: "Mateo 18:32-35"
          study: "nt/matt/18"
        presentation:
          image: quizzes/amar_projimo/corazon_perdona.jpg
      - id: dos_deudores
        question: "Dos deudores fueron perdonados: uno debía quinientos y otro cincuenta. ¿Quién amó más?"
        choices:
          - key: mas_perdonado
            label: "Aquel a quien se perdonó más"
          - key: menos_perdonado
            label: "Aquel a quien se perdonó menos"
          - key: ninguno
            label: "Ninguno de los dos"
          - key: primero
            label: "El que fue perdonado primero"
        correct_choice: mas_perdonado
        answer: "Aquel a quien se perdonó más. Reconocer la gracia recibida despierta un amor profundo."
        points: 25
        duration: 15
        intensity: 5
        scripture:
          canon: bible
          cite: "Lucas 7:41-43"
          study: "nt/luke/7"
        presentation:
          image: quizzes/amar_projimo/dos_deudores.jpg

  - id: velar_servir
    title: "Velar y servir"
    kicker: "Parábolas de Jesús"
    lede: "Lámparas, talentos y una llegada inesperada: prepárate sirviendo con fidelidad."
    questions:
      - id: talentos_repartidos
        question: "El señor repartió cinco, dos y un talento según…"
        choices:
          - key: capacidad
            label: "La capacidad de cada siervo"
          - key: edad
            label: "La edad de cada siervo"
          - key: azar
            label: "El azar"
        correct_choice: capacidad
        answer: "A cada uno según su capacidad. Luego se fue lejos y les confió la responsabilidad."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Mateo 25:14-15"
          study: "nt/matt/25"
        presentation:
          image: quizzes/velar_servir/talentos_repartidos.jpg
      - id: cinco_gano
        question: "El siervo que recibió cinco talentos ganó…"
        choices:
          - key: cinco
            label: "Otros cinco"
          - key: uno
            label: "Uno más"
          - key: ninguno
            label: "Ninguno"
        correct_choice: cinco
        answer: "Ganó otros cinco. El que recibió dos también duplicó lo que se le había confiado."
        points: 5
        duration: 0
        intensity: 1
        scripture:
          canon: bible
          cite: "Mateo 25:16-17"
          study: "nt/matt/25"
        presentation:
          image: quizzes/velar_servir/cinco_gano.jpg
      - id: uno_escondio
        question: "¿Qué hizo el siervo con el único talento que recibió?"
        choices:
          - key: tierra
            label: "Lo escondió en la tierra"
          - key: negocio
            label: "Abrió un negocio"
          - key: regalo
            label: "Lo regaló"
        correct_choice: tierra
        answer: "Cavó en la tierra y escondió el dinero de su señor por miedo."
        points: 5
        duration: 0
        intensity: 2
        scripture:
          canon: bible
          cite: "Mateo 25:18, 24-25"
          study: "nt/matt/25"
        presentation:
          image: quizzes/velar_servir/uno_escondio.jpg
      - id: buen_siervo
        question: "¿Qué dijo el señor a los siervos que fueron fieles?"
        choices:
