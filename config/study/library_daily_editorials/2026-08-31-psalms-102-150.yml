    fr:
      eyebrow: Aujourd’hui dans les Écritures
      title: Assez de lumière pour un pas
      setup: La parole n’éclaire pas forcément toute la route d’un coup. Le Psaume
        119 la compare à une lampe pour les pieds, tandis que le Psaume 138 parle
        d’une âme fortifiée au milieu de la détresse.
      question: Quel prochain pas as-tu déjà assez de lumière pour faire ?
      cta_label: Ouvrir le Psaume 119
    es:
      eyebrow: Hoy en las Escrituras
      title: Luz suficiente para un paso
      setup: La palabra no siempre ilumina todo el camino de una vez. El Salmo 119
        la compara con una lámpara para los pies, mientras el Salmo 138 habla de un
        alma fortalecida en medio de la angustia.
      question: "¿Para qué próximo paso ya tienes suficiente luz?"
      cta_label: Abrir el Salmo 119
    en:
      eyebrow: Today in Scripture
      title: Enough light for one step
      setup: The word may not light the entire road at once. Psalm 119 compares it
        to a lamp for your feet, while Psalm 138 speaks of a soul strengthened in
        the middle of distress.
      question: What next step do you already have enough light to take?
      cta_label: Open Psalm 119
    pt-BR:
      eyebrow: Hoje nas Escrituras
      title: Luz suficiente para um passo
      setup: A palavra nem sempre ilumina todo o caminho de uma vez. O Salmo 119 a
        compara a uma lâmpada para os pés, enquanto o Salmo 138 fala de uma alma fortalecida
        em meio à angústia.
      question: Para qual próximo passo você já tem luz suficiente?
      cta_label: Abrir o Salmo 119
