  copy:
    fr:
      eyebrow: Aujourd’hui dans les Écritures
      title: Connu sans être rejeté
      setup: Ces psaumes ne cachent ni détresse, ni faute, ni fragilité. Dieu écoute,
        se souvient de notre poussière et reçoit même la prière qui lui demande de
        sonder le cœur.
      question: Qu’oserais-tu lui dire si tu croyais pouvoir être connu ainsi ?
      cta_label: Ouvrir le Psaume 139
    es:
      eyebrow: Hoy en las Escrituras
      title: Conocido sin ser rechazado
      setup: Estos salmos no esconden la angustia, el pecado ni la fragilidad. Dios
        escucha, recuerda que somos polvo y recibe incluso la oración que le pide
        examinar el corazón.
      question: "¿Qué te atreverías a decirle si creyeras que puedes ser conocido
        así?"
      cta_label: Abrir el Salmo 139
    en:
      eyebrow: Today in Scripture
      title: Known without being rejected
      setup: These psalms hide neither distress, sin, nor frailty. God listens, remembers
        that we are dust, and even receives the prayer asking him to search the heart.
      question: What would you dare tell him if you believed you could be known like
        this?
      cta_label: Open Psalm 139
    pt-BR:
      eyebrow: Hoje nas Escrituras
      title: Conhecido sem ser rejeitado
      setup: Estes salmos não escondem angústia, pecado nem fragilidade. Deus escuta,
        lembra que somos pó e recebe até a oração que pede que ele examine o coração.
      question: O que você ousaria lhe dizer se acreditasse que pode ser conhecido
        assim?
      cta_label: Abrir o Salmo 139
  alt:
    fr: Assise seule sur un banc de chapelle, une femme relit un message sur son téléphone
      avant de toucher l’écran.
    es: Sentada sola en un banco de la capilla, una mujer relee un mensaje en el teléfono
      antes de tocar la pantalla.
    en: Sitting alone on a chapel pew, a woman rereads a message on her phone before
      touching the screen.
    pt-BR: Sentada sozinha num banco da capela, uma mulher relê uma mensagem no celular
      antes de tocar na tela.
  disclosure:
    fr: Cette scène contemporaine a été inventée pour accompagner le Psaume 139. Cette
      femme n’est pas un personnage biblique.
    es: Esta escena contemporánea fue inventada para acompañar el Salmo 139. La mujer
      no es un personaje bíblico.
    en: This present-day scene was invented to accompany Psalm 139. The woman is not
      a biblical figure.
    pt-BR: Esta cena contemporânea foi inventada para acompanhar o Salmo 139. A mulher
      não é uma personagem bíblica.
