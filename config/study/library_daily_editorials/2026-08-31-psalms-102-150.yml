    fr:
      eyebrow: Aujourd’hui dans les Écritures
      title: Revenir sans faire semblant
      setup: Dans ces psaumes, les nations, les générations, les instruments et tout
        ce qui respire sont appelés à louer Dieu. Même si ta joie n’est pas encore
        revenue, tu peux reprendre place sans faire semblant.
      question: Quel pas sincère peux-tu faire vers Dieu aujourd’hui ?
      cta_label: Ouvrir le Psaume 150
    es:
      eyebrow: Hoy en las Escrituras
      title: Volver sin fingir
      setup: Estos salmos llaman a las naciones, a todas las generaciones, a los instrumentos
        y a todo ser que respira a alabar a Dios. Aunque la alegría aún no haya vuelto,
        puedes ocupar de nuevo tu lugar sin fingir.
      question: "¿Qué paso sincero puedes dar hoy para acercarte a Dios?"
      cta_label: Abrir el Salmo 150
    en:
      eyebrow: Today in Scripture
      title: Come back without pretending
      setup: In these psalms, nations, generations, instruments, and everything that
        breathes are called to praise God. Even if your joy has not returned yet,
        you can take your place again without pretending.
      question: What honest step can you take toward God today?
      cta_label: Open Psalm 150
    pt-BR:
      eyebrow: Hoje nas Escrituras
      title: Voltar sem fingir
      setup: Esses salmos chamam as nações, todas as gerações, os instrumentos e tudo
        o que respira a louvar a Deus. Mesmo que sua alegria ainda não tenha voltado,
        você pode ocupar seu lugar de novo sem fingir.
      question: Que passo sincero você pode dar hoje para se aproximar de Deus?
      cta_label: Abrir o Salmo 150
