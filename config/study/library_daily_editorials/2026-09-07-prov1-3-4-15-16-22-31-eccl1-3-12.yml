    copy:
      fr:
        eyebrow: "Contemplation de la semaine"
        title: "Tu n’as pas à tout emporter"
        setup: "Tu as vu six images cette semaine. Garde-en une aujourd’hui, sans décider que les cinq autres comptent moins."
        question: "Laquelle veux-tu rouvrir ?"
        cta_label: "Revoir les six passages"
      es:
        eyebrow: "Contemplación de la semana"
        title: "No tienes que llevártelo todo"
        setup: "Has visto seis imágenes esta semana. Quédate hoy con una, sin decidir que las otras cinco importan menos."
        question: "¿Cuál quieres volver a abrir?"
        cta_label: "Volver a los seis pasajes"
      en:
        eyebrow: "This week’s contemplation"
        title: "You do not have to carry it all"
        setup: "You have seen six images this week. Hold on to one today without deciding the other five matter less."
        question: "Which one do you want to reopen?"
        cta_label: "Return to the six passages"
      pt-BR:
        eyebrow: "Contemplação da semana"
        title: "Você não precisa levar tudo com você"
        setup: "Você viu seis imagens nesta semana. Fique hoje com uma delas, sem achar que as outras cinco valem menos."
        question: "Qual delas você quer reabrir?"
        cta_label: "Voltar às seis passagens"
    alt:
