    questions:
    - key: day_lord
      scripture_ref: Ésaïe 13:6-11
      correct_choice: c
      locales:
        fr:
          question: Pourquoi Ésaïe appelle-t-il le peuple à se lamenter ?
          choices:
            a: Une famine ordinaire approche
            b: Le roi est absent
            c: Le jour de l’Éternel est proche
            d: Le temple va fermer
          explanation: Le jour de l’Éternel expose l’orgueil et le mal ; l’avertissement appelle à la repentance.
        es:
          question: "¿Por qué Isaías llama al pueblo a lamentarse?"
          choices:
            a: Se acerca una hambruna común
            b: El rey está ausente
            c: El día del Señor está cerca
            d: El templo va a cerrar
          explanation: El día del Señor deja al descubierto el orgullo y la maldad; la advertencia invita al arrepentimiento.
        en:
          question: Why does Isaiah call the people to mourn?
          choices:
            a: An ordinary famine is coming
            b: The king is away
            c: The day of the Lord is near
            d: The temple is about to close
          explanation: The day of the Lord exposes pride and evil; the warning is a call to repent.
        pt-BR:
          question: Por que Isaías chama o povo a lamentar?
          choices:
            a: Uma fome comum se aproxima
            b: O rei está ausente
            c: O dia do Senhor está perto
            d: O templo vai fechar
          explanation: O dia do Senhor revela o orgulho e a maldade; o aviso é um convite ao arrependimento.
    - key: morning_star_fall
      scripture_ref: Ésaïe 14:12-15
      correct_choice: b
      locales:
        fr:
          question: Qu’arrive-t-il à l’astre brillant qui veut s’élever au-dessus de Dieu ?
          choices:
            a: Il reçoit une couronne
            b: Il est précipité
            c: Il devient prophète
            d: Il bâtit Sion
          explanation: L’orgueil cherche à prendre la place de Dieu mais conduit finalement à la chute.
        es:
          question: "¿Qué le sucede al astro brillante que quiere elevarse por encima de Dios?"
          choices:
            a: Recibe una corona
            b: Es derribado
            c: Se convierte en profeta
            d: Edifica Sión
          explanation: El orgullo quiere ocupar el lugar de Dios, pero al final conduce a la caída.
        en:
          question: What happens to the shining star that wants to rise above God?
          choices:
            a: It receives a crown
            b: It is brought down
            c: It becomes a prophet
            d: It builds Zion
          explanation: Pride tries to take God’s place, but in the end it leads to a fall.
        pt-BR:
          question: O que acontece com a estrela brilhante que quer se elevar acima de Deus?
          choices:
            a: Ela recebe uma coroa
            b: Ela é derrubada
            c: Ela se torna profeta
            d: Ela edifica Sião
          explanation: O orgulho quer ocupar o lugar de Deus, mas no fim leva à queda.
    - key: key_david
      scripture_ref: Ésaïe 22:20-23
      correct_choice: a
      locales:
        fr:
          question: Quelle clé est placée sur l’épaule d’Éliakim ?
          choices:
            a: La clé de la maison de David
            b: La clé de Babylone
            c: La clé du trésor d’Égypte
            d: La clé de la prison
          explanation: 'La clé symbolise une autorité confiée : ce qu’il ouvre, personne ne le ferme.'
        es:
          question: "¿Qué llave se pone sobre el hombro de Eliaquim?"
          choices:
            a: La llave de la casa de David
            b: La llave de Babilonia
            c: La llave del tesoro de Egipto
            d: La llave de la cárcel
          explanation: 'La llave simboliza una autoridad confiada: lo que él abre, nadie lo cierra.'
        en:
          question: What key is placed on Eliakim’s shoulder?
          choices:
            a: The key of the house of David
            b: The key of Babylon
            c: The key to Egypt’s treasure
            d: The prison key
          explanation: 'The key represents entrusted authority: what he opens, no one shuts.'
        pt-BR:
          question: Que chave é colocada sobre o ombro de Eliaquim?
          choices:
            a: A chave da casa de Davi
            b: A chave da Babilônia
            c: A chave do tesouro do Egito
            d: A chave da prisão
          explanation: 'A chave representa uma autoridade confiada: o que ele abre, ninguém fecha.'
    - key: everlasting_covenant
      scripture_ref: Ésaïe 24:4-6
      correct_choice: d
      locales:
        fr:
          question: Qu’ont rompu les habitants de la terre selon Ésaïe 24 ?
          choices:
            a: Les murailles
            b: Les instruments
            c: Les routes
            d: L’alliance éternelle
          explanation: 'La crise décrite n’est pas seulement naturelle : elle révèle une alliance abandonnée.'
        es:
          question: "¿Qué han quebrantado los habitantes de la tierra según Isaías 24?"
          choices:
            a: Las murallas
            b: Los instrumentos
            c: Los caminos
            d: El convenio eterno
          explanation: 'La crisis no es solo natural: revela que se ha abandonado un convenio.'
        en:
          question: According to Isaiah 24, what have the people of the earth broken?
          choices:
            a: The walls
            b: The instruments
            c: The roads
            d: The everlasting covenant
          explanation: The crisis is not merely natural; it reveals a covenant that has been abandoned.
        pt-BR:
          question: Segundo Isaías 24, o que os habitantes da terra quebraram?
          choices:
            a: As muralhas
            b: Os instrumentos
            c: Os caminhos
            d: O convênio eterno
          explanation: A crise não é apenas natural; ela revela um convênio abandonado.
    - key: death_swallowed
      scripture_ref: Ésaïe 25:6-9
      correct_choice: b
      locales:
        fr:
          question: Qu’est-ce que le Seigneur engloutira pour toujours ?
          choices:
            a: Les montagnes
            b: La mort
            c: La mer
            d: Les villes
          explanation: Dieu essuiera les larmes de tous les visages ; cette victoire nourrit l’espérance de la résurrection.
        es:
          question: "¿Qué destruirá el Señor para siempre?"
          choices:
            a: Las montañas
            b: La muerte
            c: El mar
            d: Las ciudades
          explanation: Dios enjugará las lágrimas de todos los rostros; esta victoria alimenta la esperanza de la resurrección.
        en:
          question: What will the Lord swallow up forever?
          choices:
            a: The mountains
            b: Death
            c: The sea
            d: The cities
          explanation: God will wipe away every tear; this victory strengthens our hope in the Resurrection.
        pt-BR:
          question: O que o Senhor destruirá para sempre?
          choices:
            a: As montanhas
            b: A morte
            c: O mar
            d: As cidades
          explanation: Deus enxugará as lágrimas de todos os rostos; essa vitória fortalece a esperança na Ressurreição.
    - key: perfect_peace
      scripture_ref: Ésaïe 26:3-4
      correct_choice: c
      locales:
        fr:
          question: Qui Dieu garde-t-il dans une paix parfaite ?
          choices:
            a: Celui qui ne doute jamais
            b: Celui qui possède beaucoup
            c: Celui dont l’esprit s’appuie sur lui
            d: Celui qui vit seul
          explanation: La paix grandit lorsque notre esprit demeure tourné vers l’Éternel, le rocher des siècles.
        es:
          question: "¿A quién guarda Dios en completa paz?"
          choices:
            a: A quien nunca duda
            b: A quien posee mucho
            c: A quien mantiene su mente puesta en Él
            d: A quien vive solo
          explanation: La paz crece cuando nuestra mente permanece fija en el Señor, la roca eterna.
        en:
          question: Whom does God keep in perfect peace?
          choices:
            a: Someone who never doubts
            b: Someone with many possessions
            c: The person whose mind stays fixed on Him
            d: Someone who lives alone
          explanation: Peace grows as our minds remain fixed on the Lord, the everlasting rock.
        pt-BR:
          question: Quem Deus guarda em perfeita paz?
          choices:
            a: Quem nunca duvida
            b: Quem possui muitas coisas
            c: Quem mantém a mente firme Nele
            d: Quem vive sozinho
          explanation: A paz cresce quando nossa mente permanece firme no Senhor, a rocha eterna.
    - key: cornerstone
      scripture_ref: Ésaïe 28:16
      correct_choice: a
      locales:
        fr:
          question: Quelle pierre Dieu pose-t-il en Sion ?
          choices:
            a: Une pierre angulaire éprouvée
            b: Une pierre sans valeur
            c: Une statue royale
            d: Une borne assyrienne
          explanation: Jésus-Christ est la fondation sûre sur laquelle la foi peut bâtir sans fuir dans la peur.
        es:
          question: "¿Qué piedra pone Dios en Sión?"
          choices:
            a: Una piedra angular probada
            b: Una piedra sin valor
            c: Una estatua real
            d: Un mojón asirio
          explanation: Jesucristo es el fundamento seguro sobre el que la fe puede edificar sin huir atemorizada.
        en:
          question: What stone does God lay in Zion?
          choices:
            a: A tested cornerstone
            b: A worthless stone
            c: A royal statue
            d: An Assyrian boundary stone
          explanation: Jesus Christ is the sure foundation on which faith can build without fleeing in fear.
        pt-BR:
          question: Que pedra Deus coloca em Sião?
          choices:
            a: Uma pedra angular provada
            b: Uma pedra sem valor
            c: Uma estátua real
            d: Um marco assírio
          explanation: Jesus Cristo é o fundamento seguro sobre o qual a fé pode edificar sem fugir com medo.
    - key: marvellous_work
      scripture_ref: Ésaïe 29:13-14, 18
      correct_choice: d
      locales:
        fr:
          question: Que liront les sourds et que verront les aveugles dans l’œuvre merveilleuse ?
          choices:
            a: Les plans d’une ville
            b: Les ordres du roi
            c: Les signes du ciel
            d: Les paroles du livre
          explanation: Dieu promet une œuvre qui renverse la sagesse humaine et rend sa parole de nouveau accessible.
        es:
          question: En la obra maravillosa, ¿qué leerán los sordos y qué verán los ciegos?
          choices:
            a: Los planos de una ciudad
            b: Las órdenes del rey
            c: Las señales del cielo
            d: Las palabras del libro
          explanation: Dios promete una obra que supera la sabiduría humana y vuelve a poner Su palabra al alcance de todos.
        en:
          question: In the marvelous work, what will the deaf read and the blind see?
          choices:
            a: A city’s plans
            b: The king’s orders
            c: Signs in the sky
            d: The words of the book
          explanation: God promises a work that overturns human wisdom and makes His word accessible again.
        pt-BR:
          question: Na obra maravilhosa, o que os surdos lerão e os cegos verão?
          choices:
            a: As plantas de uma cidade
            b: As ordens do rei
            c: Os sinais do céu
            d: As palavras do livro
          explanation: Deus promete uma obra que supera a sabedoria humana e torna Sua palavra acessível novamente.
    - key: voice_way
      scripture_ref: Ésaïe 30:18-21
      correct_choice: b
      locales:
        fr:
          question: Que dira la voix derrière nous lorsque nous hésiterons ?
          choices:
            a: Retourne en arrière
            b: Voici le chemin, marchez-y
            c: Choisis le chemin le plus large
            d: Attends sans agir
          explanation: Le Seigneur enseigne avec patience et guide personnellement ceux qui reviennent à lui.
        es:
          question: "¿Qué dirá la voz detrás de nosotros cuando dudemos?"
          choices:
            a: Vuelve atrás
            b: Este es el camino; andad por él
            c: Escoge el camino más ancho
            d: Espera sin hacer nada
          explanation: El Señor enseña con paciencia y guía personalmente a quienes regresan a Él.
        en:
          question: What will the voice behind us say when we are unsure?
          choices:
            a: Turn back
            b: This is the way; walk in it
            c: Choose the widest road
            d: Wait without acting
          explanation: The Lord teaches patiently and personally guides those who return to Him.
        pt-BR:
          question: O que dirá a voz atrás de nós quando estivermos em dúvida?
          choices:
            a: Volte para trás
            b: Este é o caminho; andem por ele
            c: Escolham o caminho mais largo
            d: Esperem sem agir
          explanation: O Senhor ensina com paciência e guia pessoalmente aqueles que voltam para Ele.
    - key: holy_way
      scripture_ref: Ésaïe 35:1-10
      correct_choice: c
      locales:
        fr:
          question: Comment s’appelle la route sur laquelle les rachetés retournent avec joie ?
          choices:
            a: La voie des rois
            b: La route du désert
            c: La voie de la sainteté
            d: Le chemin de Babylone
          explanation: Dieu transforme le désert et ramène les rachetés à Sion avec une joie éternelle.
        es:
          question: "¿Cómo se llama el camino por el que los redimidos vuelven con alegría?"
          choices:
            a: El camino de los reyes
            b: La ruta del desierto
            c: El camino de la santidad
            d: El camino de Babilonia
          explanation: Dios transforma el desierto y lleva a los redimidos de regreso a Sión con alegría eterna.
        en:
          question: What is the road called where the redeemed return with joy?
          choices:
            a: The kings’ road
            b: The desert road
            c: The Way of Holiness
            d: The road to Babylon
          explanation: God transforms the desert and brings the redeemed home to Zion with everlasting joy.
        pt-BR:
          question: Como se chama o caminho pelo qual os redimidos voltam com alegria?
          choices:
            a: O caminho dos reis
            b: A estrada do deserto
            c: O Caminho de Santidade
            d: O caminho da Babilônia
          explanation: Deus transforma o deserto e leva os redimidos de volta a Sião com alegria eterna.
