    questions:
    - key: eagles_strength
      scripture_ref: Ésaïe 40:28-31
      correct_choice: d
      locales:
        fr:
          question: À quoi ressemble la force renouvelée de ceux qui espèrent en l’Éternel ?
          choices:
            a: À une muraille
            b: À un torrent
            c: À un lion endormi
            d: Aux ailes des aigles
          explanation: Dieu ne se fatigue pas ; il communique sa force à ceux qui se confient en lui.
        es:
          question: "¿A qué se parece la fuerza renovada de quienes esperan en el Señor?"
          choices:
            a: A una muralla
            b: A un torrente
            c: A un león dormido
            d: A las alas de las águilas
          explanation: Dios no se cansa; comparte Su fuerza con quienes confían en Él.
        en:
          question: What is the renewed strength of those who hope in the Lord like?
          choices:
            a: A wall
            b: A rushing stream
            c: A sleeping lion
            d: Eagles’ wings
          explanation: God never grows weary; He shares His strength with those who trust Him.
        pt-BR:
          question: A que se compara a força renovada daqueles que esperam no Senhor?
          choices:
            a: A uma muralha
            b: A uma correnteza
            c: A um leão adormecido
            d: Às asas das águias
          explanation: Deus não Se cansa; Ele compartilha Sua força com aqueles que confiam Nele.
    - key: fear_not_hand
      scripture_ref: Ésaïe 41:10, 13
      correct_choice: a
      locales:
        fr:
          question: Pourquoi Israël ne doit-il pas craindre ?
          choices:
            a: Dieu est avec lui et lui tient la main
            b: Il ne connaîtra aucune épreuve
            c: Son armée est invincible
            d: Il possède toutes les richesses
          explanation: 'L’assurance vient de la présence de Dieu : il fortifie, secourt et tient son peuple par la main.'
        es:
          question: "¿Por qué no debe temer Israel?"
          choices:
            a: Dios está con él y lo toma de la mano
            b: Nunca tendrá pruebas
            c: Su ejército es invencible
            d: Posee todas las riquezas
          explanation: 'La seguridad nace de la presencia de Dios: Él fortalece, ayuda y lleva de la mano a Su pueblo.'
        en:
          question: Why does Israel not need to fear?
          choices:
            a: God is with them and holds their hand
            b: They will never face trials
            c: Their army cannot be defeated
            d: They own every treasure
          explanation: 'Confidence comes from God’s presence: He strengthens, helps, and holds His people by the hand.'
        pt-BR:
          question: Por que Israel não precisa ter medo?
          choices:
            a: Deus está com ele e o segura pela mão
            b: Ele nunca enfrentará provações
            c: Seu exército é invencível
            d: Ele possui todas as riquezas
          explanation: 'A segurança vem da presença de Deus: Ele fortalece, ajuda e segura Seu povo pela mão.'
    - key: bruised_reed
      scripture_ref: Ésaïe 42:1-7
      correct_choice: c
      locales:
        fr:
          question: Que fait le serviteur choisi d’un roseau froissé ?
          choices:
            a: Il le jette
            b: Il le cache
            c: Il ne le brise pas
            d: Il l’emploie comme arme
          explanation: Le serviteur apporte la justice avec douceur ; les chrétiens reconnaissent ici le caractère de Jésus-Christ.
        es:
          question: "¿Qué hace el siervo escogido con una caña quebrada?"
          choices:
            a: La desecha
            b: La esconde
            c: No la rompe
            d: La usa como arma
          explanation: El siervo trae justicia con ternura; los cristianos reconocen aquí el carácter de Jesucristo.
        en:
          question: What does the chosen servant do with a bruised reed?
          choices:
            a: Throw it away
            b: Hide it
            c: He does not break it
            d: Use it as a weapon
          explanation: The servant brings justice gently; Christians recognize the character of Jesus Christ here.
        pt-BR:
          question: O que o servo escolhido faz com uma cana quebrada?
          choices:
            a: Joga fora
            b: Esconde
            c: Não a quebra
            d: Usa como arma
          explanation: O servo traz justiça com mansidão; os cristãos reconhecem aqui o caráter de Jesus Cristo.
    - key: through_waters
      scripture_ref: Ésaïe 43:1-4
      correct_choice: b
      locales:
        fr:
          question: Que promet Dieu lorsque son peuple traverse les eaux ?
          choices:
            a: Les eaux disparaîtront toujours
            b: Il sera avec lui
            c: Il n’aura plus peur
            d: Il trouvera un bateau
          explanation: Le rachat ne signifie pas l’absence d’épreuve, mais la présence fidèle de Dieu au milieu d’elle.
        es:
          question: "¿Qué promete Dios cuando Su pueblo pasa por las aguas?"
          choices:
            a: Las aguas siempre desaparecerán
            b: Él estará con ellos
            c: Ya no sentirán miedo
            d: Encontrarán un barco
          explanation: La redención no significa ausencia de pruebas, sino la presencia fiel de Dios en medio de ellas.
        en:
          question: What does God promise when His people pass through the waters?
          choices:
            a: The waters will always disappear
            b: He will be with them
            c: They will never feel afraid
            d: They will find a boat
          explanation: Redemption does not mean a life without trials; it means God’s faithful presence within them.
        pt-BR:
          question: O que Deus promete quando Seu povo passa pelas águas?
          choices:
            a: As águas sempre desaparecerão
            b: Ele estará com eles
            c: Eles nunca sentirão medo
            d: Eles encontrarão um barco
          explanation: Redenção não significa ausência de provações, mas a presença fiel de Deus em meio a elas.
    - key: graven_palms
      scripture_ref: Ésaïe 49:14-16
      correct_choice: d
      locales:
        fr:
          question: Où le Seigneur dit-il avoir gravé Sion ?
          choices:
            a: Sur une porte
            b: Dans un livre
            c: Sur une montagne
            d: Sur ses mains
          explanation: Même si une mère pouvait oublier son enfant, le Seigneur n’oublie pas son peuple.
        es:
          question: "¿Dónde dice el Señor que ha grabado a Sión?"
          choices:
            a: En una puerta
            b: En un libro
            c: En una montaña
            d: En las palmas de Sus manos
          explanation: Aunque una madre pudiera olvidar a su hijo, el Señor nunca olvida a Su pueblo.
        en:
          question: Where does the Lord say He has engraved Zion?
          choices:
            a: On a door
            b: In a book
            c: On a mountain
            d: On the palms of His hands
          explanation: Even if a mother could forget her child, the Lord will never forget His people.
        pt-BR:
          question: Onde o Senhor diz que gravou Sião?
          choices:
            a: Em uma porta
            b: Em um livro
            c: Em uma montanha
            d: Nas palmas de Suas mãos
          explanation: Mesmo que uma mãe pudesse esquecer seu filho, o Senhor nunca Se esquece de Seu povo.
    - key: only_god
      scripture_ref: Ésaïe 44:6-8
      correct_choice: a
      locales:
        fr:
          question: Qui l’Éternel déclare-t-il être en dehors de lui ?
          choices:
            a: Aucun autre Dieu
            b: Un roi plus puissant
            c: Un prophète caché
            d: Un ange créateur
          explanation: L’Éternel est le premier et le dernier ; les idoles ne peuvent prendre sa place.
        es:
          question: "¿Quién declara el Señor que existe fuera de Él?"
          choices:
            a: Ningún otro Dios
            b: Un rey más poderoso
            c: Un profeta escondido
            d: Un ángel creador
          explanation: El Señor es el primero y el último; los ídolos no pueden ocupar Su lugar.
        en:
          question: Who does the Lord declare exists besides Him?
          choices:
            a: No other God
            b: A more powerful king
            c: A hidden prophet
            d: A creator angel
          explanation: The Lord is the first and the last; idols cannot take His place.
        pt-BR:
          question: Quem o Senhor declara que existe além Dele?
          choices:
            a: Nenhum outro Deus
            b: Um rei mais poderoso
            c: Um profeta escondido
            d: Um anjo criador
          explanation: O Senhor é o primeiro e o último; os ídolos não podem ocupar Seu lugar.
    - key: every_knee
      scripture_ref: Ésaïe 45:22-23
      correct_choice: c
      locales:
        fr:
          question: Qui est invité à se tourner vers Dieu pour être sauvé ?
          choices:
            a: Juda seulement
            b: Les prêtres seulement
            c: Toutes les extrémités de la terre
            d: Les rois seulement
          explanation: Le salut offert par Dieu est universel ; devant lui tout genou fléchira.
        es:
          question: "¿Quién está invitado a volver a Dios para ser salvo?"
          choices:
            a: Solo Judá
            b: Solo los sacerdotes
            c: Todos los confines de la tierra
            d: Solo los reyes
          explanation: La salvación que Dios ofrece es universal; ante Él se doblará toda rodilla.
        en:
          question: Who is invited to turn to God and be saved?
          choices:
            a: Judah alone
            b: Only the priests
            c: All the ends of the earth
            d: Only kings
          explanation: God’s offer of salvation is universal; every knee will bow before Him.
        pt-BR:
          question: Quem é convidado a se voltar para Deus e ser salvo?
          choices:
            a: Somente Judá
            b: Somente os sacerdotes
            c: Todos os confins da terra
            d: Somente os reis
          explanation: A salvação que Deus oferece é universal; diante Dele todo joelho se dobrará.
    - key: carried_old_age
      scripture_ref: Ésaïe 46:3-4
      correct_choice: b
      locales:
        fr:
          question: Jusqu’à quel moment Dieu promet-il de porter son peuple ?
          choices:
            a: Jusqu’à sa première faute
            b: Jusqu’à la vieillesse
            c: Jusqu’à la frontière
            d: Jusqu’au prochain roi
          explanation: Celui qui nous a faits promet de nous soutenir et de nous sauver durant toute la vie.
        es:
          question: "¿Hasta cuándo promete Dios sostener a Su pueblo?"
          choices:
            a: Hasta su primer error
            b: Hasta la vejez
            c: Hasta la frontera
            d: Hasta el siguiente rey
          explanation: Quien nos creó promete sostenernos y salvarnos durante toda la vida.
        en:
          question: How long does God promise to carry His people?
          choices:
            a: Until their first mistake
            b: Into old age
            c: As far as the border
            d: Until the next king
          explanation: The One who made us promises to sustain and rescue us throughout our lives.
        pt-BR:
          question: Até quando Deus promete sustentar Seu povo?
          choices:
            a: Até o primeiro erro
            b: Até a velhice
            c: Até a fronteira
            d: Até o próximo rei
          explanation: Aquele que nos criou promete nos sustentar e salvar durante toda a vida.
    - key: peace_river
      scripture_ref: Ésaïe 48:17-18
      correct_choice: d
      locales:
        fr:
          question: À quoi aurait ressemblé la paix d’Israël s’il avait écouté les commandements ?
          choices:
            a: À une tour
            b: À une flamme
            c: À une rosée
            d: À un fleuve
          explanation: Le Rédempteur enseigne ce qui est utile et conduit son peuple sur le chemin à suivre.
        es:
          question: "¿A qué se habría parecido la paz de Israel si hubiera escuchado los mandamientos?"
          choices:
            a: A una torre
            b: A una llama
            c: Al rocío
            d: A un río
          explanation: El Redentor enseña lo que nos hace bien y guía a Su pueblo por el camino correcto.
        en:
          question: What would Israel’s peace have been like if the people had listened to the commandments?
          choices:
            a: A tower
            b: A flame
            c: The dew
            d: A river
          explanation: The Redeemer teaches what is good for us and leads His people in the way they should go.
        pt-BR:
          question: Como seria a paz de Israel se o povo tivesse ouvido os mandamentos?
          choices:
            a: Como uma torre
            b: Como uma chama
            c: Como o orvalho
            d: Como um rio
          explanation: O Redentor ensina o que é bom para nós e guia Seu povo pelo caminho certo.
    - key: light_nations
      scripture_ref: Ésaïe 49:5-6
      correct_choice: a
      locales:
        fr:
          question: Que doit devenir le serviteur pour porter le salut jusqu’aux extrémités de la terre ?
          choices:
            a: Une lumière pour les nations
