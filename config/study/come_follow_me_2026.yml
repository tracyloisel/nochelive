    questions:
    - key: afflicted_prayer
      scripture_ref: Psaumes 102:1-2
      correct_choice: b
      locales:
        fr:
          question: Quand il est dans la détresse, que demande le psalmiste ?
          choices:
            a: D’être laissé seul
            b: Que sa prière parvienne à Dieu
            c: De devenir roi
            d: D’oublier Jérusalem
          explanation: Il supplie l’Éternel d’écouter et de lui répondre sans tarder.
        es:
          question: "¿Qué pide el salmista cuando está angustiado?"
          choices:
            a: Que lo dejen solo
            b: Que su oración llegue a Dios
            c: Llegar a ser rey
            d: Olvidar Jerusalén
          explanation: Suplica al Señor que lo escuche y le responda sin tardar.
        en:
          question: What does the psalmist ask for when he is in distress?
          choices:
            a: To be left alone
            b: For his prayer to reach God
            c: To become king
            d: To forget Jerusalem
          explanation: He pleads with the Lord to hear him and answer without delay.
        pt-BR:
          question: O que o salmista pede quando está angustiado?
          choices:
            a: Que o deixem sozinho
            b: Que sua oração chegue a Deus
            c: Que ele se torne rei
            d: Que ele esqueça Jerusalém
          explanation: Ele suplica ao Senhor que o ouça e responda sem demora.
    - key: compassionate_father
      scripture_ref: Psaumes 103:8-13
      correct_choice: c
      locales:
        fr:
          question: À quoi le Psaume 103 compare-t-il la compassion de Dieu ?
          choices:
            a: À la force d’une armée
            b: À la richesse d’un roi
            c: À la tendresse d’un père
            d: À la vitesse du vent
          explanation: Comme un père a compassion de ses enfants, l’Éternel a compassion de ceux qui le craignent.
        es:
          question: "¿Con qué compara el Salmo 103 la compasión de Dios?"
          choices:
            a: Con la fuerza de un ejército
            b: Con la riqueza de un rey
            c: Con la ternura de un padre
            d: Con la velocidad del viento
          explanation: Como un padre se compadece de sus hijos, el Señor se compadece de quienes lo honran.
        en:
          question: What does Psalm 103 compare God’s compassion to?
          choices:
            a: The strength of an army
            b: A king’s wealth
            c: A father’s tender care
            d: The speed of the wind
          explanation: As a father has compassion on his children, the Lord has compassion on those who honor Him.
        pt-BR:
          question: A que o Salmo 103 compara a compaixão de Deus?
          choices:
            a: À força de um exército
            b: À riqueza de um rei
            c: Ao carinho de um pai
            d: À velocidade do vento
          explanation: Como um pai se compadece dos filhos, o Senhor se compadece daqueles que o honram.
    - key: right_hand
      scripture_ref: Psaumes 110:1-4
      correct_choice: a
      locales:
        fr:
          question: Où l’Éternel invite-t-il le Seigneur du psalmiste à s’asseoir ?
          choices:
            a: À sa droite
            b: Devant le temple
            c: Sur le mont Carmel
            d: Près de l’arche
          explanation: Ce psaume royal annonce celui qui siège à la droite de Dieu et règne avec puissance.
        es:
          question: "¿Dónde invita el Señor a sentarse al Señor del salmista?"
          choices:
            a: A su derecha
            b: Delante del templo
            c: En el monte Carmelo
            d: Junto al arca
          explanation: Este salmo real anuncia al que se sienta a la derecha de Dios y reina con poder.
        en:
          question: Where does the Lord invite the psalmist’s Lord to sit?
          choices:
            a: At His right hand
            b: In front of the temple
            c: On Mount Carmel
            d: Beside the ark
          explanation: This royal psalm points to the One who sits at God’s right hand and reigns with power.
        pt-BR:
          question: Onde o Senhor convida o Senhor do salmista a se sentar?
          choices:
            a: À sua direita
            b: Diante do templo
            c: No monte Carmelo
            d: Ao lado da arca
          explanation: Este salmo real anuncia aquele que se assenta à direita de Deus e reina com poder.
    - key: cup_salvation
      scripture_ref: Psaumes 116:12-17
      correct_choice: d
      locales:
        fr:
          question: Que prend le psalmiste pour répondre aux bienfaits de l’Éternel ?
          choices:
            a: Une couronne
            b: Une épée
            c: Une tablette de pierre
            d: La coupe du salut
          explanation: Il prend la coupe du salut, invoque l’Éternel et accomplit ses vœux.
        es:
          question: "¿Qué toma el salmista para responder a las bondades del Señor?"
          choices:
            a: Una corona
            b: Una espada
            c: Una tabla de piedra
            d: La copa de la salvación
          explanation: Toma la copa de la salvación, invoca al Señor y cumple sus promesas.
        en:
          question: What does the psalmist take up in response to the Lord’s goodness?
          choices:
            a: A crown
            b: A sword
            c: A stone tablet
            d: The cup of salvation
          explanation: He takes the cup of salvation, calls on the Lord, and keeps his promises.
        pt-BR:
          question: O que o salmista toma para agradecer as bondades do Senhor?
          choices:
            a: Uma coroa
            b: Uma espada
            c: Uma tábua de pedra
            d: O cálice da salvação
          explanation: Ele toma o cálice da salvação, invoca o Senhor e cumpre suas promessas.
    - key: rejected_stone
      scripture_ref: Psaumes 118:22-24
      correct_choice: b
      locales:
        fr:
          question: Que devient la pierre rejetée par ceux qui bâtissaient ?
          choices:
            a: Une pierre oubliée
            b: La pierre principale de l’angle
            c: Une borne du désert
            d: Une idole
          explanation: 'L’Éternel fait de la pierre rejetée la pierre principale : une image accomplie en Jésus-Christ.'
        es:
          question: "¿En qué se convierte la piedra que rechazaron los constructores?"
          choices:
            a: En una piedra olvidada
            b: En la principal piedra angular
            c: En un mojón del desierto
            d: En un ídolo
          explanation: El Señor convierte la piedra rechazada en la principal piedra angular, una imagen que se cumple en Jesucristo.
        en:
          question: What becomes of the stone the builders rejected?
          choices:
            a: It is forgotten
            b: It becomes the chief cornerstone
            c: It marks a desert boundary
            d: It becomes an idol
          explanation: The Lord makes the rejected stone the chief cornerstone, a picture fulfilled in Jesus Christ.
        pt-BR:
          question: O que acontece com a pedra rejeitada pelos construtores?
          choices:
            a: Ela é esquecida
            b: Ela se torna a principal pedra angular
            c: Ela vira um marco no deserto
            d: Ela se torna um ídolo
          explanation: O Senhor faz da pedra rejeitada a principal pedra angular, uma imagem que se cumpre em Jesus Cristo.
    - key: lamp_word
      scripture_ref: Psaumes 119:105
      correct_choice: c
      locales:
        fr:
          question: Dans le Psaume 119, à quoi la parole de Dieu est-elle comparée ?
          choices:
            a: À une couronne
            b: À une muraille
            c: À une lampe
            d: À une trompette
          explanation: La parole de Dieu est une lampe à nos pieds et une lumière sur notre sentier.
        es:
          question: En el Salmo 119, ¿a qué se compara la palabra de Dios?
          choices:
            a: A una corona
            b: A una muralla
            c: A una lámpara
            d: A una trompeta
          explanation: La palabra de Dios es lámpara para nuestros pies y luz para nuestro camino.
        en:
          question: In Psalm 119, what is God’s word compared to?
          choices:
            a: A crown
            b: A wall
            c: A lamp
            d: A trumpet
          explanation: God’s word is a lamp for our feet and a light for our path.
        pt-BR:
          question: No Salmo 119, a que a palavra de Deus é comparada?
          choices:
            a: A uma coroa
            b: A uma muralha
            c: A uma lâmpada
            d: A uma trombeta
          explanation: A palavra de Deus é lâmpada para os nossos pés e luz para o nosso caminho.
    - key: builds_house
      scripture_ref: Psaumes 127:1-2
      correct_choice: a
      locales:
        fr:
          question: Sans qui ceux qui bâtissent une maison travaillent-ils en vain ?
          choices:
            a: Sans l’Éternel
            b: Sans un architecte royal
            c: Sans une armée
            d: Sans Salomon
          explanation: Le psaume rappelle que nos efforts trouvent leur solidité lorsque l’Éternel bâtit avec nous.
        es:
          question: "¿Sin quién trabajan en vano los que construyen una casa?"
          choices:
            a: Sin el Señor
            b: Sin un arquitecto real
            c: Sin un ejército
            d: Sin Salomón
          explanation: El salmo recuerda que nuestros esfuerzos son firmes cuando el Señor edifica con nosotros.
        en:
          question: Without whom do those who build a house labor in vain?
          choices:
            a: Without the Lord
            b: Without a royal architect
            c: Without an army
            d: Without Solomon
          explanation: The psalm reminds us that our work stands firm when the Lord builds with us.
        pt-BR:
          question: Sem quem os que constroem uma casa trabalham em vão?
          choices:
            a: Sem o Senhor
            b: Sem um arquiteto real
            c: Sem um exército
            d: Sem Salomão
          explanation: O salmo lembra que nossos esforços ficam firmes quando o Senhor edifica conosco.
    - key: known_completely
      scripture_ref: Psaumes 139:1-6, 23-24
      correct_choice: d
      locales:
        fr:
          question: Que connaît Dieu de la personne qui prie dans le Psaume 139 ?
          choices:
            a: Seulement ses paroles
            b: Seulement ses bonnes actions
            c: Uniquement son avenir
            d: Ses pensées et toutes ses voies
          explanation: Dieu nous connaît profondément ; nous pouvons lui demander de sonder notre cœur et de nous conduire.
        es:
          question: "¿Qué conoce Dios de la persona que ora en el Salmo 139?"
          choices:
            a: Solo sus palabras
            b: Solo sus buenas obras
            c: Solamente su futuro
            d: Sus pensamientos y todos sus caminos
          explanation: Dios nos conoce profundamente; podemos pedirle que examine nuestro corazón y nos guíe.
        en:
          question: What does God know about the person praying in Psalm 139?
          choices:
            a: Only their words
            b: Only their good deeds
            c: Only their future
            d: Their thoughts and all their ways
          explanation: God knows us deeply; we can ask Him to search our hearts and lead us.
        pt-BR:
          question: O que Deus conhece sobre a pessoa que ora no Salmo 139?
          choices:
            a: Apenas suas palavras
            b: Apenas suas boas ações
            c: Somente seu futuro
            d: Seus pensamentos e todos os seus caminhos
          explanation: Deus nos conhece profundamente; podemos pedir que examine nosso coração e nos guie.
    - key: help_oppressed
      scripture_ref: Psaumes 146:5-9
      correct_choice: b
      locales:
        fr:
          question: Qui l’Éternel secourt-il selon le Psaume 146 ?
          choices:
            a: Uniquement les puissants
            b: Les opprimés, les affamés et les étrangers
            c: Seulement les rois
            d: Ceux qui n’ont jamais souffert
          explanation: Sa fidélité se voit dans son soin concret des personnes vulnérables.
        es:
          question: "¿A quiénes ayuda el Señor según el Salmo 146?"
          choices:
            a: Solo a los poderosos
            b: A los oprimidos, hambrientos y extranjeros
            c: Solo a los reyes
            d: A quienes nunca han sufrido
          explanation: Su fidelidad se ve en el cuidado concreto que brinda a las personas vulnerables.
        en:
          question: Whom does the Lord help in Psalm 146?
          choices:
            a: Only the powerful
            b: The oppressed, the hungry, and the stranger
            c: Only kings
            d: Those who have never suffered
          explanation: His faithfulness is seen in His practical care for vulnerable people.
        pt-BR:
          question: Quem o Senhor ajuda, segundo o Salmo 146?
          choices:
            a: Somente os poderosos
            b: Os oprimidos, os famintos e os estrangeiros
            c: Somente os reis
            d: Quem nunca sofreu
          explanation: Sua fidelidade aparece no cuidado concreto com as pessoas vulneráveis.
    - key: everything_breathes
      scripture_ref: Psaumes 150:1-6
      correct_choice: c
      locales:
        fr:
          question: Qui le dernier verset des Psaumes invite-t-il à louer l’Éternel ?
          choices:
            a: Les prêtres seulement
            b: Les musiciens seulement
            c: Tout ce qui respire
            d: Israël seulement
          explanation: 'Le recueil s’achève par une invitation universelle : que tout ce qui respire loue l’Éternel.'
        es:
          question: "¿A quiénes invita a alabar al Señor el último versículo de los Salmos?"
          choices:
            a: Solo a los sacerdotes
            b: Solo a los músicos
            c: A todo lo que respira
            d: Solo a Israel
          explanation: 'El libro termina con una invitación universal: que todo lo que respira alabe al Señor.'
        en:
          question: Whom does the final verse of Psalms invite to praise the Lord?
          choices:
            a: Only priests
            b: Only musicians
            c: Everything that has breath
            d: Only Israel
          explanation: 'The book ends with a universal invitation: let everything that has breath praise the Lord.'
        pt-BR:
          question: Quem o último versículo dos Salmos convida a louvar o Senhor?
          choices:
            a: Somente os sacerdotes
            b: Somente os músicos
            c: Tudo o que respira
            d: Somente Israel
          explanation: 'O livro termina com um convite universal: tudo o que respira louve o Senhor.'
