    questions:
    - key: wisdom_begins
      scripture_ref: Proverbes 1:7
      correct_choice: a
      locales:
        fr:
          question: Quel est le commencement de la connaissance ?
          choices:
            a: La crainte de l’Éternel
            b: La richesse
            c: L’âge
            d: Le pouvoir
          explanation: La sagesse biblique commence par le respect profond de Dieu et le désir de l’écouter.
        es:
          question: "¿Cuál es el principio del conocimiento?"
          choices:
            a: El temor del Señor
            b: La riqueza
            c: La edad
            d: El poder
          explanation: La sabiduría bíblica comienza con un profundo respeto por Dios y el deseo de escucharlo.
        en:
          question: What is the beginning of knowledge?
          choices:
            a: Reverence for the Lord
            b: Wealth
            c: Age
            d: Power
          explanation: Biblical wisdom begins with deep respect for God and a desire to listen to Him.
        pt-BR:
          question: Qual é o princípio do conhecimento?
          choices:
            a: O temor do Senhor
            b: A riqueza
            c: A idade
            d: O poder
          explanation: A sabedoria bíblica começa com profundo respeito por Deus e o desejo de ouvi-Lo.
    - key: trust_paths
      scripture_ref: Proverbes 3:5-6
      correct_choice: c
      locales:
        fr:
          question: Que devons-nous faire plutôt que nous appuyer sur notre seule sagesse ?
          choices:
            a: Ne jamais décider
            b: Suivre la foule
            c: Nous confier en l’Éternel de tout notre cœur
            d: Attendre un signe spectaculaire
          explanation: Lorsque nous reconnaissons Dieu dans nos voies, il peut aplanir nos sentiers.
        es:
          question: "¿Qué debemos hacer en vez de apoyarnos solo en nuestra propia sabiduría?"
          choices:
            a: No decidir nunca
            b: Seguir a la mayoría
            c: Confiar en el Señor de todo corazón
            d: Esperar una señal espectacular
          explanation: Cuando reconocemos a Dios en nuestros caminos, Él puede enderezar nuestras sendas.
        en:
          question: What should we do instead of relying only on our own wisdom?
          choices:
            a: Never make a decision
            b: Follow the crowd
            c: Trust the Lord with all our heart
            d: Wait for a spectacular sign
          explanation: When we acknowledge God in our ways, He can make our paths straight.
        pt-BR:
          question: O que devemos fazer em vez de confiar apenas na nossa própria sabedoria?
          choices:
            a: Nunca tomar uma decisão
            b: Seguir a maioria
            c: Confiar no Senhor de todo o coração
            d: Esperar um sinal espetacular
          explanation: Quando reconhecemos Deus em nossos caminhos, Ele pode endireitar nossas veredas.
    - key: guard_heart
      scripture_ref: Proverbes 4:23
      correct_choice: b
      locales:
        fr:
          question: Qu’est-ce que Proverbes 4 nous demande de garder plus que toute autre chose ?
          choices:
            a: Nos possessions
            b: Notre cœur
            c: Notre réputation
            d: Nos secrets
          explanation: Du cœur viennent les sources de la vie ; nos désirs orientent nos choix.
        es:
          question: "¿Qué nos pide Proverbios 4 que guardemos por encima de todo?"
          choices:
            a: Nuestras posesiones
            b: Nuestro corazón
            c: Nuestra reputación
            d: Nuestros secretos
          explanation: Del corazón mana la vida; nuestros deseos orientan nuestras decisiones.
        en:
          question: What does Proverbs 4 tell us to guard above everything else?
          choices:
            a: Our possessions
            b: Our heart
            c: Our reputation
            d: Our secrets
          explanation: Life flows from the heart; our desires shape our choices.
        pt-BR:
          question: O que Provérbios 4 nos manda guardar acima de tudo?
          choices:
            a: Nossos bens
            b: Nosso coração
            c: Nossa reputação
            d: Nossos segredos
          explanation: Do coração procedem as fontes da vida; nossos desejos orientam nossas escolhas.
    - key: gentle_answer
      scripture_ref: Proverbes 15:1
      correct_choice: d
      locales:
        fr:
          question: Qu’est-ce qui calme la fureur ?
          choices:
            a: Une menace
            b: Le silence méprisant
            c: Une réponse plus forte
            d: Une réponse douce
          explanation: La douceur peut interrompre l’escalade, tandis qu’une parole dure excite la colère.
        es:
          question: "¿Qué calma la ira?"
          choices:
            a: Una amenaza
            b: El silencio desdeñoso
            c: Una respuesta más fuerte
            d: Una respuesta suave
          explanation: La suavidad puede detener una pelea, mientras que una palabra hiriente enciende la ira.
        en:
          question: What turns anger away?
          choices:
            a: A threat
            b: Scornful silence
            c: A louder answer
            d: A gentle answer
          explanation: Gentleness can stop a quarrel from growing, while a harsh word stirs up anger.
        pt-BR:
          question: O que acalma a ira?
          choices:
            a: Uma ameaça
            b: O silêncio com desprezo
            c: Uma resposta mais alta
            d: Uma resposta branda
          explanation: A brandura pode impedir que uma briga cresça, enquanto uma palavra dura atiça a ira.
    - key: plans_directed
      scripture_ref: Proverbes 16:3, 9
      correct_choice: a
      locales:
        fr:
          question: Qui dirige finalement les pas, même lorsque l’homme forme des projets ?
          choices:
            a: L’Éternel
            b: Le hasard
            c: Le roi
            d: La richesse
          explanation: Nous pouvons préparer notre voie tout en remettant nos œuvres à l’Éternel.
        es:
          question: "¿Quién dirige finalmente los pasos, aunque hagamos nuestros propios planes?"
          choices:
            a: El Señor
            b: La casualidad
            c: El rey
            d: La riqueza
          explanation: Podemos preparar nuestro camino y, al mismo tiempo, encomendar nuestras obras al Señor.
        en:
          question: Who ultimately directs our steps, even when we make our own plans?
          choices:
            a: The Lord
            b: Chance
            c: The king
            d: Wealth
          explanation: We can plan our way while still entrusting our work to the Lord.
        pt-BR:
          question: Quem dirige nossos passos no fim, mesmo quando fazemos nossos planos?
          choices:
            a: O Senhor
            b: O acaso
            c: O rei
            d: A riqueza
          explanation: Podemos planejar nosso caminho e, ao mesmo tempo, confiar nossas obras ao Senhor.
    - key: good_name
      scripture_ref: Proverbes 22:1-2
      correct_choice: c
      locales:
        fr:
          question: Qu’est-ce qui vaut mieux que de grandes richesses ?
          choices:
            a: Une grande maison
            b: Une longue vie
            c: Une bonne renommée
            d: Une place au palais
          explanation: Le caractère et la faveur acquise par la droiture valent plus que l’argent.
        es:
          question: "¿Qué vale más que muchas riquezas?"
          choices:
            a: Una casa grande
            b: Una vida larga
            c: Un buen nombre
            d: Un lugar en el palacio
          explanation: El carácter y la estima que nace de la rectitud valen más que el dinero.
        en:
          question: What is worth more than great riches?
          choices:
            a: A large house
            b: A long life
            c: A good name
            d: A place in the palace
          explanation: Character and the respect earned through goodness are worth more than money.
        pt-BR:
          question: O que vale mais do que muitas riquezas?
          choices:
            a: Uma casa grande
            b: Uma vida longa
            c: Um bom nome
            d: Um lugar no palácio
          explanation: O caráter e o respeito conquistado pela retidão valem mais do que dinheiro.
    - key: open_hand
      scripture_ref: Proverbes 31:8-9, 20
      correct_choice: b
      locales:
        fr:
          question: Pour qui la femme vertueuse ouvre-t-elle sa main ?
          choices:
            a: Pour les riches
            b: Pour le pauvre et l’indigent
            c: Pour les soldats
            d: Pour elle seule
          explanation: Sa sagesse devient compassion, justice et service envers les personnes dans le besoin.
        es:
          question: "¿A quién tiende la mano la mujer virtuosa?"
          choices:
            a: A los ricos
            b: Al pobre y al necesitado
            c: A los soldados
            d: Solo a sí misma
          explanation: Su sabiduría se convierte en compasión, justicia y servicio a quienes pasan necesidad.
        en:
          question: To whom does the woman of noble character reach out?
          choices:
            a: The rich
            b: The poor and needy
            c: Soldiers
            d: Only herself
          explanation: Her wisdom becomes compassion, justice, and service to people in need.
        pt-BR:
          question: A quem a mulher virtuosa estende a mão?
          choices:
            a: Aos ricos
            b: Ao pobre e ao necessitado
            c: Aos soldados
            d: Somente a si mesma
          explanation: Sua sabedoria se transforma em compaixão, justiça e serviço a quem precisa.
    - key: vanity
      scripture_ref: Ecclésiaste 1:2-4
      correct_choice: d
      locales:
        fr:
          question: Quel mot résume d’abord la fragilité des choses terrestres dans l’Ecclésiaste ?
          choices:
            a: Victoire
            b: Sécurité
            c: Abondance
            d: Vanité
          explanation: Le Prédicateur constate que ce qui est terrestre, isolé de Dieu, est passager et ne suffit pas.
        es:
          question: "¿Qué palabra resume al principio de Eclesiastés lo frágiles que son las cosas terrenales?"
          choices:
            a: Victoria
            b: Seguridad
            c: Abundancia
            d: Vanidad
          explanation: El Predicador observa que lo terrenal, separado de Dios, es pasajero y no basta.
        en:
          question: What word does Ecclesiastes first use to sum up how fleeting earthly things are?
          choices:
            a: Victory
            b: Security
            c: Abundance
            d: Vanity
          explanation: The Teacher sees that earthly things, apart from God, are temporary and cannot satisfy us.
        pt-BR:
          question: Que palavra Eclesiastes usa no início para resumir como as coisas terrenas são passageiras?
          choices:
            a: Vitória
            b: Segurança
            c: Abundância
            d: Vaidade
          explanation: O Pregador percebe que as coisas terrenas, separadas de Deus, passam e não bastam.
    - key: season_everything
      scripture_ref: Ecclésiaste 3:1-8
      correct_choice: a
      locales:
        fr:
          question: Qu’y a-t-il pour toute chose sous les cieux ?
          choices:
            a: Un temps et une saison
            b: Une réponse facile
            c: Un seul chemin
            d: Une récompense immédiate
          explanation: La vie comporte des saisons différentes ; la sagesse apprend à les recevoir devant Dieu.
        es:
          question: "¿Qué hay para cada cosa debajo del cielo?"
          choices:
            a: Un tiempo y una ocasión
            b: Una respuesta fácil
            c: Un solo camino
            d: Una recompensa inmediata
          explanation: La vida tiene distintas etapas; la sabiduría aprende a vivirlas delante de Dios.
        en:
          question: What is there for everything under heaven?
          choices:
            a: A time and a season
            b: An easy answer
            c: Only one path
            d: An immediate reward
          explanation: Life has different seasons; wisdom learns to receive each one before God.
        pt-BR:
          question: O que há para cada coisa debaixo do céu?
          choices:
            a: Um tempo e uma ocasião
            b: Uma resposta fácil
            c: Um único caminho
            d: Uma recompensa imediata
          explanation: A vida tem fases diferentes; a sabedoria aprende a vivê-las diante de Deus.
    - key: whole_duty
      scripture_ref: Ecclésiaste 12:13-14
      correct_choice: c
      locales:
        fr:
          question: Quelle conclusion l’Ecclésiaste donne-t-il à toute sa recherche ?
          choices:
            a: Accumule des biens
            b: Évite toute joie
            c: Crains Dieu et garde ses commandements
            d: Cherche seulement la connaissance
          explanation: Le sens durable ne vient pas de ce qui passe, mais d’une vie tournée vers Dieu.
        es:
          question: "¿Qué conclusión da Eclesiastés a toda su búsqueda?"
          choices:
            a: Acumula bienes
            b: Evita toda alegría
            c: Teme a Dios y guarda sus mandamientos
            d: Busca solo conocimiento
          explanation: El sentido duradero no viene de lo pasajero, sino de una vida orientada hacia Dios.
        en:
          question: What conclusion does Ecclesiastes reach after its long search?
          choices:
            a: Gather possessions
            b: Avoid all joy
            c: Revere God and keep His commandments
            d: Seek knowledge alone
          explanation: Lasting meaning is not found in what passes away, but in a life turned toward God.
        pt-BR:
          question: A que conclusão Eclesiastes chega depois de toda a sua busca?
          choices:
            a: Acumule bens
            b: Evite toda alegria
            c: Tema a Deus e guarde Seus mandamentos
            d: Busque apenas conhecimento
          explanation: O sentido duradouro não vem do que passa, mas de uma vida voltada para Deus.
