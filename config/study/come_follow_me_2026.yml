    questions:
    - key: scarlet_white
      scripture_ref: Ésaïe 1:16-18
      correct_choice: b
      locales:
        fr:
          question: Que peuvent devenir des péchés rouges comme le cramoisi ?
          choices:
            a: Invisibles
            b: Blancs comme la neige
            c: Légers comme le vent
            d: Durs comme la pierre
          explanation: L’Éternel invite son peuple à se repentir et promet une purification complète.
        es:
          question: "¿En qué pueden convertirse los pecados rojos como el carmesí?"
          choices:
            a: En algo invisible
            b: En algo blanco como la nieve
            c: En algo ligero como el viento
            d: En algo duro como la piedra
          explanation: El Señor invita a Su pueblo a arrepentirse y promete limpiarlo por completo.
        en:
          question: What can sins that are red like crimson become?
          choices:
            a: Invisible
            b: White as snow
            c: Light as the wind
            d: Hard as stone
          explanation: The Lord invites His people to repent and promises to make them completely clean.
        pt-BR:
          question: Em que podem se tornar os pecados vermelhos como o carmesim?
          choices:
            a: Invisíveis
            b: Brancos como a neve
            c: Leves como o vento
            d: Duros como a pedra
          explanation: O Senhor convida Seu povo ao arrependimento e promete purificá-lo por completo.
    - key: mountain_house
      scripture_ref: Ésaïe 2:2-5
      correct_choice: a
      locales:
        fr:
          question: Pourquoi les nations montent-elles à la maison de l’Éternel ?
          choices:
            a: Pour apprendre ses voies
            b: Pour choisir un roi
            c: Pour cacher leurs armes
            d: Pour compter leurs richesses
          explanation: Elles viennent recevoir la parole de Dieu, marcher dans ses sentiers et rechercher la paix.
        es:
          question: "¿Por qué suben las naciones a la casa del Señor?"
          choices:
            a: Para aprender Sus caminos
            b: Para elegir un rey
            c: Para esconder sus armas
            d: Para contar sus riquezas
          explanation: Van a recibir la palabra de Dios, andar por Sus sendas y buscar la paz.
        en:
          question: Why do the nations go up to the house of the Lord?
          choices:
            a: To learn His ways
            b: To choose a king
            c: To hide their weapons
            d: To count their riches
          explanation: They come to receive God’s word, walk in His paths, and seek peace.
        pt-BR:
          question: Por que as nações sobem à casa do Senhor?
          choices:
            a: Para aprender Seus caminhos
            b: Para escolher um rei
            c: Para esconder suas armas
            d: Para contar suas riquezas
          explanation: Elas vêm receber a palavra de Deus, andar em Suas veredas e buscar a paz.
    - key: vineyard_fruit
      scripture_ref: Ésaïe 5:1-7
      correct_choice: d
      locales:
        fr:
          question: Quel fruit la vigne soigneusement cultivée produit-elle ?
          choices:
            a: Des figues
            b: Du blé
            c: De bonnes grappes
            d: Des raisins sauvages
          explanation: La vigne représente un peuple comblé de soins mais qui ne produit pas la justice attendue.
        es:
          question: "¿Qué fruto produce la viña cuidada con tanto esmero?"
          choices:
            a: Higos
            b: Trigo
            c: Uvas buenas
            d: Uvas silvestres
          explanation: La viña representa a un pueblo muy cuidado que no produce la justicia esperada.
        en:
          question: What fruit does the carefully tended vineyard produce?
          choices:
            a: Figs
            b: Wheat
            c: Good grapes
            d: Wild grapes
          explanation: The vineyard represents a people who received great care but did not produce the justice God sought.
        pt-BR:
          question: Que fruto a vinha cultivada com tanto cuidado produz?
          choices:
            a: Figos
            b: Trigo
            c: Uvas boas
            d: Uvas bravas
          explanation: A vinha representa um povo muito bem cuidado que não produz a justiça esperada.
    - key: holy_call
      scripture_ref: Ésaïe 6:1-8
      correct_choice: c
      locales:
        fr:
          question: Que répond Ésaïe lorsque l’Éternel demande qui envoyer ?
          choices:
            a: Envoie le roi
            b: Je ne peux pas parler
            c: Me voici, envoie-moi
            d: Attends encore
          explanation: Purifié par Dieu, Ésaïe accepte librement son appel de prophète.
        es:
          question: "¿Qué responde Isaías cuando el Señor pregunta a quién enviar?"
          choices:
            a: Envía al rey
            b: No sé hablar
            c: Aquí estoy, envíame a mí
            d: Espera un poco más
          explanation: Después de ser purificado por Dios, Isaías acepta libremente su llamamiento profético.
        en:
          question: How does Isaiah answer when the Lord asks whom He should send?
          choices:
            a: Send the king
            b: I cannot speak
            c: Here I am; send me
            d: Wait a little longer
          explanation: After God cleanses him, Isaiah freely accepts his prophetic call.
        pt-BR:
          question: O que Isaías responde quando o Senhor pergunta quem deve enviar?
          choices:
            a: Envie o rei
            b: Não sei falar
            c: Eis-me aqui; envia-me
            d: Espere mais um pouco
          explanation: Depois de ser purificado por Deus, Isaías aceita livremente seu chamado profético.
    - key: immanuel
      scripture_ref: Ésaïe 7:14
      correct_choice: a
      locales:
        fr:
          question: Quel nom porte l’enfant annoncé comme signe ?
          choices:
            a: Emmanuel
            b: Samuel
            c: Élie
            d: David
          explanation: Emmanuel signifie Dieu avec nous et oriente notre espérance vers Jésus-Christ.
        es:
          question: "¿Qué nombre recibe el niño anunciado como señal?"
          choices:
            a: Emanuel
            b: Samuel
            c: Elías
            d: David
          explanation: Emanuel significa Dios con nosotros y dirige nuestra esperanza hacia Jesucristo.
        en:
          question: What name is given to the child promised as a sign?
          choices:
            a: Immanuel
            b: Samuel
            c: Elijah
            d: David
          explanation: Immanuel means God with us and points our hope toward Jesus Christ.
        pt-BR:
          question: Que nome recebe a criança anunciada como sinal?
          choices:
            a: Emanuel
            b: Samuel
            c: Elias
            d: Davi
          explanation: Emanuel significa Deus conosco e dirige nossa esperança para Jesus Cristo.
    - key: sanctuary
      scripture_ref: Ésaïe 8:13-14
      correct_choice: d
      locales:
        fr:
          question: Que devient l’Éternel pour ceux qui le sanctifient ?
          choices:
            a: Une armée
            b: Un juge lointain
            c: Un secret
            d: Un sanctuaire
          explanation: Au milieu de la peur, le Seigneur lui-même peut être notre lieu saint et sûr.
        es:
          question: "¿Qué llega a ser el Señor para quienes lo santifican?"
          choices:
            a: Un ejército
            b: Un juez lejano
            c: Un secreto
            d: Un santuario
          explanation: En medio del temor, el propio Señor puede ser nuestro lugar santo y seguro.
        en:
          question: What does the Lord become for those who honor Him as holy?
          choices:
            a: An army
            b: A distant judge
            c: A secret
            d: A sanctuary
          explanation: In the middle of fear, the Lord Himself can be our holy and safe place.
        pt-BR:
          question: O que o Senhor Se torna para aqueles que O santificam?
          choices:
            a: Um exército
            b: Um juiz distante
            c: Um segredo
            d: Um santuário
          explanation: Em meio ao medo, o próprio Senhor pode ser nosso lugar santo e seguro.
    - key: child_titles
      scripture_ref: Ésaïe 9:5-6
      correct_choice: b
      locales:
        fr:
          question: Quel titre appartient à l’enfant promis par Ésaïe ?
          choices:
            a: Prince de Babylone
            b: Prince de la paix
            c: Chef des archers
            d: Gardien du palais
          explanation: L’enfant promis est aussi Conseiller admirable, Dieu puissant et Prince de la paix.
        es:
          question: "¿Qué título pertenece al niño prometido por Isaías?"
          choices:
            a: Príncipe de Babilonia
            b: Príncipe de Paz
            c: Jefe de los arqueros
            d: Guardián del palacio
          explanation: El niño prometido también es Admirable Consejero, Dios Fuerte y Príncipe de Paz.
        en:
          question: Which title belongs to the child Isaiah promised?
          choices:
            a: Prince of Babylon
            b: Prince of Peace
            c: Chief of the archers
            d: Keeper of the palace
          explanation: The promised child is also Wonderful Counselor, Mighty God, and Prince of Peace.
        pt-BR:
          question: Que título pertence à criança prometida por Isaías?
          choices:
            a: Príncipe da Babilônia
            b: Príncipe da Paz
            c: Chefe dos arqueiros
            d: Guardião do palácio
          explanation: A criança prometida também é Maravilhoso Conselheiro, Deus Forte e Príncipe da Paz.
    - key: remnant_returns
      scripture_ref: Ésaïe 10:20-22
      correct_choice: c
      locales:
        fr:
          question: Vers qui le reste d’Israël reviendra-t-il avec sincérité ?
          choices:
            a: Vers l’Assyrie
            b: Vers ses richesses
            c: Vers le Dieu puissant
            d: Vers l’Égypte
          explanation: La prophétie promet qu’un reste cessera de s’appuyer sur ses oppresseurs et reviendra à Dieu.
        es:
          question: "¿A quién volverá sinceramente el remanente de Israel?"
          choices:
            a: A Asiria
            b: A sus riquezas
            c: Al Dios Fuerte
            d: A Egipto
          explanation: La profecía promete que un remanente dejará de apoyarse en sus opresores y volverá a Dios.
        en:
          question: To whom will the remnant of Israel sincerely return?
          choices:
            a: Assyria
            b: Their wealth
            c: The Mighty God
            d: Egypt
          explanation: The prophecy promises that a remnant will stop relying on its oppressors and return to God.
        pt-BR:
          question: A quem o remanescente de Israel voltará com sinceridade?
          choices:
            a: À Assíria
            b: Às suas riquezas
            c: Ao Deus Forte
            d: Ao Egito
          explanation: A profecia promete que um remanescente deixará de confiar em seus opressores e voltará para Deus.
    - key: peaceable_kingdom
      scripture_ref: Ésaïe 11:1-9
      correct_choice: a
      locales:
        fr:
          question: Dans le royaume paisible, qui demeure avec l’agneau ?
          choices:
            a: Le loup
            b: Le faucon
            c: Le cheval
            d: Le chameau
          explanation: Cette image annonce le règne juste du Messie, où la violence cède devant la paix.
        es:
          question: En el reino de paz, ¿quién habita con el cordero?
          choices:
            a: El lobo
            b: El halcón
            c: El caballo
            d: El camello
          explanation: Esta imagen anuncia el reinado justo del Mesías, donde la violencia cede ante la paz.
        en:
          question: In the peaceable kingdom, who lives with the lamb?
          choices:
            a: The wolf
            b: The hawk
            c: The horse
            d: The camel
          explanation: This picture points to the Messiah’s righteous reign, where violence gives way to peace.
        pt-BR:
          question: No reino de paz, quem vive com o cordeiro?
          choices:
            a: O lobo
            b: O falcão
            c: O cavalo
            d: O camelo
          explanation: Essa imagem anuncia o reinado justo do Messias, no qual a violência dá lugar à paz.
    - key: god_salvation
      scripture_ref: Ésaïe 12:1-6
      correct_choice: d
      locales:
        fr:
          question: Pourquoi le peuple peut-il puiser de l’eau avec joie ?
          choices:
            a: Les ennemis ont fui
            b: La ville est riche
            c: Le désert a disparu
            d: Dieu est son salut
          explanation: Quand Dieu devient notre force et notre chant, nous puisons avec joie aux sources du salut.
        es:
          question: "¿Por qué puede el pueblo sacar agua con alegría?"
          choices:
            a: Los enemigos huyeron
            b: La ciudad es rica
            c: El desierto desapareció
            d: Dios es su salvación
          explanation: Cuando Dios se convierte en nuestra fuerza y nuestra canción, sacamos agua con gozo de las fuentes de la salvación.
        en:
          question: Why can the people draw water with joy?
          choices:
            a: Their enemies have fled
            b: The city is wealthy
            c: The desert has vanished
            d: God is their salvation
          explanation: When God becomes our strength and song, we joyfully draw water from the wells of salvation.
        pt-BR:
          question: Por que o povo pode tirar água com alegria?
          choices:
            a: Os inimigos fugiram
            b: A cidade é rica
            c: O deserto desapareceu
            d: Deus é sua salvação
          explanation: Quando Deus Se torna nossa força e nosso cântico, tiramos água com alegria das fontes da salvação.
