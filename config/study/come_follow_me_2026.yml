    questions:
    - key: riches_cannot_redeem
      scripture_ref: Psaumes 49:7-9, 15
      correct_choice: c
      locales:
        fr:
          question: Selon le Psaume 49, qu’est-ce que la richesse ne peut pas acheter ?
          choices:
            a: Une longue réputation
            b: L’amitié des puissants
            c: Le rachat d’une âme
            d: Une maison plus sûre
          explanation: Aucune richesse ne peut racheter une âme. Le psalmiste place son espérance en Dieu, qui peut délivrer de la mort.
        es:
          question: Según el Salmo 49, ¿qué no puede comprar la riqueza?
          choices:
            a: Una reputación duradera
            b: La amistad de los poderosos
            c: El rescate de un alma
            d: Una casa más segura
          explanation: Ninguna riqueza puede rescatar un alma. El salmista pone su esperanza en Dios, que puede librar de la muerte.
        en:
          question: According to Psalm 49, what can wealth not buy?
          choices:
            a: A lasting reputation
            b: The friendship of the powerful
            c: The redemption of a soul
            d: A safer home
          explanation: No amount of wealth can redeem a soul. The psalmist trusts God, who can deliver from death.
        pt-BR:
          question: Segundo o Salmo 49, o que a riqueza não pode comprar?
          choices:
            a: Uma reputação duradoura
            b: A amizade dos poderosos
            c: A redenção de uma alma
            d: Uma casa mais segura
          explanation: Nenhuma riqueza pode redimir uma alma. O salmista deposita a esperança em Deus, que pode livrar da morte.
    - key: god_owns_all
      scripture_ref: Psaumes 50:10-12
      correct_choice: b
      locales:
        fr:
          question: Pourquoi Dieu dit-il qu’il n’a pas besoin que l’homme le nourrisse ?
          choices:
            a: Il ne reçoit aucun sacrifice
            b: Le monde et tout ce qu’il contient lui appartiennent
            c: Il ne s’intéresse qu’aux prières
            d: Les animaux ne lui appartiennent pas
          explanation: Dieu possède déjà toute la création. Ce qu’il recherche n’est pas une transaction, mais une reconnaissance sincère et une alliance vécue.
        es:
          question: "¿Por qué dice Dios que no necesita que el ser humano lo alimente?"
          choices:
            a: No recibe sacrificios
            b: El mundo y todo lo que contiene le pertenecen
            c: Solo le interesan las oraciones
            d: Los animales no le pertenecen
          explanation: Dios ya posee toda la creación. No busca una transacción, sino gratitud sincera y una alianza vivida.
        en:
          question: Why does God say He does not need people to feed Him?
          choices:
            a: He accepts no offerings
            b: The world and everything in it belong to Him
            c: He cares only about prayers
            d: The animals do not belong to Him
          explanation: God already owns all creation. He seeks no transaction, but sincere gratitude and a covenant lived faithfully.
        pt-BR:
          question: Por que Deus diz que não precisa que o ser humano o alimente?
          choices:
            a: Ele não recebe ofertas
            b: O mundo e tudo o que nele há pertencem a Ele
            c: Ele só se importa com orações
            d: Os animais não pertencem a Ele
          explanation: Deus já possui toda a criação. Ele não busca uma troca, mas gratidão sincera e uma aliança vivida.
    - key: clean_heart
      scripture_ref: Psaumes 51:10-12
      correct_choice: c
      locales:
        fr:
          question: Que demande principalement David à Dieu après avoir reconnu son péché ?
          choices:
            a: D’oublier ses ennemis
            b: De lui donner un nouveau royaume
            c: De créer en lui un cœur pur
            d: De cacher sa faute aux autres
          explanation: David ne demande pas seulement que sa faute disparaisse. Il supplie Dieu de le transformer intérieurement et de lui rendre la joie du salut.
        es:
          question: "¿Qué pide principalmente David a Dios después de reconocer su pecado?"
          choices:
            a: Olvidar a sus enemigos
            b: Darle un reino nuevo
            c: Crear en él un corazón limpio
            d: Ocultar su falta a los demás
          explanation: David no pide solo que desaparezca su culpa. Suplica a Dios que lo transforme por dentro y le devuelva el gozo de la salvación.
        en:
          question: What does David chiefly ask God for after acknowledging his sin?
          choices:
            a: To forget his enemies
            b: To give him a new kingdom
            c: To create a clean heart in him
            d: To hide his fault from others
          explanation: David asks for more than the removal of guilt. He pleads for inner transformation and the restored joy of salvation.
        pt-BR:
          question: O que Davi pede principalmente a Deus depois de reconhecer seu pecado?
          choices:
            a: Esquecer seus inimigos
            b: Dar-lhe um novo reino
            c: Criar nele um coração puro
            d: Esconder sua culpa dos outros
          explanation: Davi não pede apenas que a culpa desapareça. Ele suplica por transformação interior e pela alegria renovada da salvação.
    - key: rock_higher
      scripture_ref: Psaumes 61:1-4
      correct_choice: a
      locales:
        fr:
          question: Où le psalmiste demande-t-il à Dieu de le conduire lorsque son cœur est abattu ?
          choices:
            a: Sur le rocher trop élevé pour lui
            b: Dans la maison d’un roi
            c: Au milieu d’une armée
            d: Loin de toute responsabilité
          explanation: L’image du rocher enseigne que Dieu peut nous établir dans une sécurité que nous ne pouvons pas atteindre par nos seules forces.
        es:
          question: "¿Adónde pide el salmista que Dios lo guíe cuando su corazón desfallece?"
          choices:
            a: A la roca más alta que él
            b: A la casa de un rey
            c: En medio de un ejército
            d: Lejos de toda responsabilidad
          explanation: La roca enseña que Dios puede establecernos en una seguridad que no alcanzamos solo con nuestras fuerzas.
        en:
          question: Where does the psalmist ask God to lead him when his heart is overwhelmed?
          choices:
            a: To the rock higher than he is
            b: To a king’s house
            c: Into the middle of an army
            d: Away from every responsibility
          explanation: The rock teaches that God can establish us in a safety we cannot reach through our own strength alone.
        pt-BR:
          question: Para onde o salmista pede que Deus o conduza quando seu coração desfalece?
          choices:
            a: À rocha mais alta do que ele
            b: À casa de um rei
            c: Ao meio de um exército
            d: Para longe de toda responsabilidade
          explanation: A rocha ensina que Deus pode nos firmar numa segurança que não alcançamos apenas com nossa própria força.
    - key: wait_in_silence
      scripture_ref: Psaumes 62:1-2, 5-8
      correct_choice: d
      locales:
        fr:
          question: Quelle attitude le Psaume 62 associe-t-il à la confiance en Dieu ?
          choices:
            a: Multiplier les paroles
            b: Ne jamais montrer sa faiblesse
            c: Contrôler toutes les circonstances
            d: Attendre en silence et répandre son cœur devant lui
          explanation: 'La foi réunit ici le silence confiant et la parole honnête : attendre Dieu, puis ouvrir pleinement son cœur devant lui.'
        es:
          question: "¿Qué actitud relaciona el Salmo 62 con la confianza en Dios?"
          choices:
            a: Multiplicar las palabras
            b: No mostrar nunca debilidad
            c: Controlar todas las circunstancias
            d: Esperar en silencio y derramar el corazón ante Él
          explanation: 'La fe une el silencio confiado y la sinceridad: esperar en Dios y abrir completamente el corazón ante Él.'
        en:
          question: What attitude does Psalm 62 connect with trusting God?
          choices:
            a: Using more words
            b: Never showing weakness
            c: Controlling every circumstance
            d: Waiting quietly and pouring out one’s heart before Him
          explanation: 'Faith joins quiet trust with honest speech: waiting for God, then opening the whole heart before Him.'
        pt-BR:
          question: Que atitude o Salmo 62 relaciona à confiança em Deus?
          choices:
            a: Multiplicar as palavras
            b: Nunca mostrar fraqueza
            c: Controlar todas as circunstâncias
            d: Esperar em silêncio e derramar o coração diante Dele
          explanation: 'A fé une silêncio confiante e sinceridade: esperar em Deus e abrir completamente o coração diante Dele.'
    - key: refined_through_trial
      scripture_ref: Psaumes 66:10-12
      correct_choice: b
      locales:
        fr:
          question: À quoi le Psaume 66 compare-t-il les épreuves traversées par le peuple ?
          choices:
            a: À une route sans destination
            b: À l’argent éprouvé par le feu
            c: À une fête interrompue
            d: À une dette impossible à payer
          explanation: 'L’épreuve n’est pas présentée comme la fin du peuple : Dieu le fait passer par le feu et l’eau, puis le conduit vers l’abondance.'
        es:
          question: "¿Con qué compara el Salmo 66 las pruebas que atravesó el pueblo?"
          choices:
            a: Con un camino sin destino
            b: Con la plata refinada por el fuego
            c: Con una fiesta interrumpida
            d: Con una deuda imposible de pagar
          explanation: 'La prueba no es el final: Dios hace pasar a su pueblo por fuego y agua y después lo lleva a la abundancia.'
        en:
          question: What does Psalm 66 compare the people’s trials to?
          choices:
            a: A road with no destination
            b: Silver refined by fire
            c: An interrupted celebration
            d: A debt that cannot be paid
          explanation: 'Trial is not the people’s ending: God brings them through fire and water and then into abundance.'
        pt-BR:
          question: A que o Salmo 66 compara as provações enfrentadas pelo povo?
          choices:
            a: A uma estrada sem destino
            b: À prata refinada pelo fogo
            c: A uma festa interrompida
            d: A uma dívida impossível de pagar
          explanation: 'A provação não é o fim: Deus conduz seu povo pelo fogo e pela água e depois o leva à abundância.'
    - key: suffering_servant
      scripture_ref: Psaumes 69:20-21
      correct_choice: c
      locales:
        fr:
          question: Quel détail du Psaume 69 rappelle particulièrement la Passion de Jésus-Christ ?
          choices:
            a: Une couronne offerte au roi
            b: Une armée venue le défendre
            c: Du fiel et du vinaigre donnés dans sa souffrance
            d: Une fuite secrète hors de la ville
          explanation: Les chrétiens reconnaissent dans ces paroles un écho puissant de la souffrance du Sauveur et du vinaigre qui lui fut présenté sur la croix.
        es:
          question: "¿Qué detalle del Salmo 69 recuerda especialmente la Pasión de Jesucristo?"
          choices:
            a: Una corona ofrecida al rey
            b: Un ejército que vino a defenderlo
            c: Hiel y vinagre ofrecidos en su sufrimiento
            d: Una huida secreta de la ciudad
          explanation: Los cristianos reconocen aquí un poderoso eco del sufrimiento del Salvador y del vinagre que le ofrecieron en la cruz.
        en:
          question: Which detail in Psalm 69 especially recalls the Passion of Jesus Christ?
          choices:
            a: A crown offered to the king
            b: An army coming to defend him
            c: Gall and vinegar offered in suffering
            d: A secret escape from the city
          explanation: Christians hear here a powerful echo of the Savior’s suffering and the vinegar offered to Him on the cross.
        pt-BR:
          question: Que detalhe do Salmo 69 lembra especialmente a Paixão de Jesus Cristo?
          choices:
            a: Uma coroa oferecida ao rei
            b: Um exército vindo defendê-lo
            c: Fel e vinagre oferecidos em seu sofrimento
            d: Uma fuga secreta da cidade
          explanation: Os cristãos reconhecem aqui um poderoso eco do sofrimento do Salvador e do vinagre oferecido a Ele na cruz.
    - key: righteous_king
      scripture_ref: Psaumes 72:1-4, 12-14
      correct_choice: a
      locales:
        fr:
          question: Comment reconnaît-on le roi juste décrit dans le Psaume 72 ?
          choices:
            a: Il défend le pauvre et délivre celui qui n’a aucun secours
            b: Il agrandit d’abord son palais
            c: Il évite les personnes qui souffrent
            d: Il réserve la justice aux puissants
          explanation: Le règne juste se reconnaît à la manière dont les plus vulnérables sont traités. Ce portrait nourrit aussi l’espérance du règne parfait du Christ.
        es:
          question: "¿Cómo se reconoce al rey justo descrito en el Salmo 72?"
          choices:
            a: Defiende al pobre y libra al que no tiene ayuda
            b: Primero amplía su palacio
            c: Evita a quienes sufren
            d: Reserva la justicia para los poderosos
          explanation: Un reino justo se reconoce por el trato a los más vulnerables. Este retrato también alimenta la esperanza en el reinado perfecto de Cristo.
        en:
          question: How is the righteous king in Psalm 72 recognized?
          choices:
            a: He defends the poor and delivers those with no helper
            b: He first enlarges his palace
            c: He avoids those who suffer
            d: He reserves justice for the powerful
          explanation: A righteous reign is known by its treatment of the vulnerable. This portrait also nourishes hope in Christ’s perfect reign.
        pt-BR:
          question: Como se reconhece o rei justo descrito no Salmo 72?
          choices:
            a: Ele defende o pobre e livra quem não tem auxílio
            b: Primeiro amplia seu palácio
            c: Evita os que sofrem
            d: Reserva a justiça aos poderosos
          explanation: Um reinado justo é reconhecido pelo cuidado com os vulneráveis. Esse retrato também nutre a esperança no reinado perfeito de Cristo.
    - key: remember_gods_works
      scripture_ref: Psaumes 77:7-14
      correct_choice: d
      locales:
        fr:
          question: Que fait le psalmiste lorsque ses questions lui font douter de la bonté de Dieu ?
          choices:
            a: Il nie avoir peur
            b: Il abandonne toute prière
            c: Il cherche un signe spectaculaire
            d: Il se souvient des œuvres de Dieu
          explanation: Se souvenir ne supprime pas immédiatement la souffrance, mais replace la crise présente dans l’histoire de la fidélité de Dieu.
        es:
          question: "¿Qué hace el salmista cuando sus preguntas le hacen dudar de la bondad de Dios?"
          choices:
            a: Niega tener miedo
            b: Abandona toda oración
            c: Busca una señal espectacular
            d: Recuerda las obras de Dios
          explanation: Recordar no elimina de inmediato el sufrimiento, pero sitúa la crisis presente dentro de la historia de la fidelidad de Dios.
        en:
          question: What does the psalmist do when his questions make him doubt God’s goodness?
          choices:
            a: He denies being afraid
            b: He abandons prayer
            c: He looks for a spectacular sign
            d: He remembers God’s works
          explanation: Remembering does not instantly remove suffering, but it places the present crisis inside the story of God’s faithfulness.
        pt-BR:
          question: O que o salmista faz quando suas perguntas o levam a duvidar da bondade de Deus?
          choices:
            a: Nega estar com medo
            b: Abandona toda oração
            c: Procura um sinal espetacular
            d: Lembra-se das obras de Deus
          explanation: Lembrar não elimina imediatamente o sofrimento, mas coloca a crise presente dentro da história da fidelidade de Deus.
    - key: mercy_and_truth_meet
      scripture_ref: Psaumes 85:10-13
      correct_choice: b
      locales:
        fr:
          question: Quelle rencontre magnifique le Psaume 85 associe-t-il au salut de Dieu ?
          choices:
            a: La puissance et la célébrité
            b: La bonté et la vérité, la justice et la paix
            c: Le silence et l’oubli
            d: La richesse et l’autorité
          explanation: Le salut de Dieu ne sacrifie ni la vérité ni la miséricorde. En lui, la justice et la paix peuvent enfin s’embrasser.
        es:
          question: "¿Qué encuentro hermoso relaciona el Salmo 85 con la salvación de Dios?"
          choices:
            a: El poder y la fama
            b: La misericordia y la verdad, la justicia y la paz
            c: El silencio y el olvido
            d: La riqueza y la autoridad
          explanation: La salvación de Dios no sacrifica ni la verdad ni la misericordia. En Él, la justicia y la paz pueden abrazarse.
        en:
          question: What beautiful meeting does Psalm 85 associate with God’s salvation?
          choices:
            a: Power and fame
            b: Mercy and truth, righteousness and peace
            c: Silence and forgetfulness
            d: Wealth and authority
          explanation: God’s salvation sacrifices neither truth nor mercy. In Him, righteousness and peace can finally embrace.
        pt-BR:
          question: Que belo encontro o Salmo 85 associa à salvação de Deus?
          choices:
            a: Poder e fama
            b: Misericórdia e verdade, justiça e paz
            c: Silêncio e esquecimento
            d: Riqueza e autoridade
          explanation: A salvação de Deus não sacrifica nem a verdade nem a misericórdia. Nele, justiça e paz podem finalmente se abraçar.
