                - paragraph [ref=e44]:
                  - generic [ref=e45]: "2"
                  - generic [ref=e46]: "À l’occasion du rapport que Doëg, l’Édomite, vint faire à Saül en lui disant : David s’est rendu dans la maison d’Achimélec."
                - paragraph [ref=e47]:
                  - generic [ref=e48]: "3"
                  - generic [ref=e49]: Pourquoi te glorifies-tu de ta méchanceté, tyran ? La bonté de Dieu subsiste toujours.
                - paragraph [ref=e50]:
                  - generic [ref=e51]: "4"
                  - generic [ref=e52]: Ta langue n’invente que malice comme un rasoir affilé, fourbe que tu es !
                - paragraph [ref=e53]:
                  - generic [ref=e54]: "5"
                  - generic [ref=e55]: Tu aimes le mal plutôt que le bien, Le mensonge plutôt que la droiture. — Sélah.
                - paragraph [ref=e56]:
                  - generic [ref=e57]: "6"
                  - generic [ref=e58]: Tu aimes toutes les paroles de destruction, Langue trompeuse !
                - paragraph [ref=e59]:
                  - generic [ref=e60]: "7"
                  - generic [ref=e61]: Aussi Dieu t’abattra pour toujours, Il te saisira et t’enlèvera de ta tente ; Il te déracinera de la terre des vivants. — Sélah.
                - paragraph [ref=e62]:
                  - generic [ref=e63]: "8"
                  - generic [ref=e64]: "Les justes le verront et auront de la crainte, Et ils feront de lui le sujet de leurs moqueries :"
                - paragraph [ref=e65]:
                  - generic [ref=e66]: "9"
                  - generic [ref=e67]: Voilà l’homme qui ne prenait pas Dieu pour protecteur, Mais qui se confiait en ses grandes richesses, Et qui triomphait dans sa malice !
                - paragraph [ref=e68]:
                  - generic [ref=e69]: "10"
                  - generic [ref=e70]: Et moi, je suis dans la maison de Dieu comme un olivier verdoyant, Je me confie dans la bonté de Dieu, éternellement et à jamais.
                - paragraph [ref=e71]:
                  - generic [ref=e72]: "11"
                  - generic [ref=e73]: Je te louerai toujours parce que tu as agi ; Et je veux espérer en ton nom parce qu’il est favorable, En présence de tes fidèles.
